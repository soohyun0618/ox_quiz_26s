"甲과 乙은 합동하여 평소 알고 지내던 A의 집에서 현금 1,000만 원을 절취하였다는 사실로 특수절도로 공소가 제기되어 함께 재판을 받고 있다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "경찰과 검찰에서 甲은 범행을 모두 부인하였고, 乙은 범행을 모두 자백하였는데, 사법경찰관 작성의 乙에 대한 피의자신문조서는 甲이 그 내용을 부인하면 甲에 대한 유죄의 증거로 사용할 수 없다. ", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다(대판 2010.01.28. 2009도10139). ", "answer": "O"}, {"source": "21변시", "question": "甲과 乙은 합동하여 평소 알고 지내던 A의 집에서 현금 1,000만 원을 절취하였다는 사실로 특수절도로 공소가 제기되어 함께 재판을 받고 있다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관 작성의 검증조서에 甲이 A의 거실에서 현금을 가지고 나오면서 “빨리 도망가자”라고 말한 진술기재 부분과 범행을 재연하는 사진이 첨부되어 있는 경우, 甲이 법정에서 검증조서에 대해서만 증거로 활용함에 동의하고 진술기재 부분과 재연사진에 대해서는 그 성립의 진정 및 내용을 부인하였다면, 위 진술기재 부분과 재연사진은 유죄의 증거로 사용할 수 없다. ", "explanation": "사법경찰관 작성의 검증조서에 대하여 피고인이 증거로 함에 동의만 하였을 뿐 공판정에서 검증조서에 기재된 진술내용 및 범행을 재연한 부분에 대하여 그 성립의 진정 및 내용을 인정한 흔적을 찾아 볼 수 없고 오히려 이를 부인하고 있는 경우에는 그 증거능력을 인정할 수 없으므로, 위 검증조서 중 범행에 부합되는 피고인의 진술을 기재한 부분과 범행을 재연한 부분을 제외한 나머지 부분만을 증거로 채용하여야 함에도 이를 구분하지 아니한 채 그 전부를 유죄의 증거로 인용한 항소심의 조치는 위법하다(대판 1998.03.13. 98도159). ", "answer": "O"}, {"source": "21변시", "question": "甲과 乙은 합동하여 평소 알고 지내던 A의 집에서 현금 1,000만 원을 절취하였다는 사실로 특수절도로 공소가 제기되어 함께 재판을 받고 있다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 유죄의 자료로 제출한 사법경찰관 작성의 甲에 대한 피의자신문조서는 甲이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 甲의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있다.", "explanation": "사법경찰리 작성의 피고인에 대한 피의자신문조서와 피고인이 작성한 자술서들은 모두 검사가 유죄의 자료로 제출한 증거들로서 피고인이 각 그 내용을 부인하는 이상 증거능력이 없으나 그러한 증거라 하더라도 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있다(대판 1998.02.27. 97도1770). ", "answer": "O"}, {"source": "19변시", "question": "자백에 관한 설명 중 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변론을 분리하지 아니한 채 이루어진 공범인 공동피고인의 공판정에서의 자백은 피고인에 대하여 불리한 증거로 사용할 수 없다. ", "explanation": "공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있고, 이는 피고인들간에 이해관계가 상반된다고 하여도 마찬가지라 할 것이다(대판 2006.05.11. 2006도1944).", "answer": "X"}, {"source": "19변시", "question": "자백에 관한 설명 중 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "상업장부나 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 우연히 피고인이 자기에게 맡겨진 사무를 처리한 사무 내역을 그때그때 계속적, 기계적으로 기재한 문서라도 공소사실에 일부 부합되는 사실의 기재가 있다면 이는 범죄사실을 자백하는 문서로 보아야 한다. ", "explanation": "[1] 상법장부나 항해일지, 진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 자기에게 맡겨진 사무를 처리한 사무 내역을 그때그때 계속적, 기계적으로 기재한 문서 등의 경우는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 그 존재 자체 및 기재가 그러한 내용의 사무가 처리되었음의 여부를 판단할 수 있는 별개의 독립된 증거자료이고, 설사 그 문서가 우연히 피고인이 작성하였고 그 문서의 내용 중 피고인의 범죄사실의 존재를 추론해 낼 수 있는, 즉 공소사실에 일부 부합되는 사실의 기재가 있다고 하더라도, 이를 일컬어 피고인이 범죄사실을 자백하는 문서라고 볼 수는 없다. [2] 피고인이 뇌물공여 혐의를 받기 전에 이와는 관계없이 준설공사에 필요한 각종 인·허가 등의 업무를 위임받아 이를 추진하는 과정에서 그 업무수행에 필요한 자금을 지출하면서, 스스로 그 지출한 자금내역을 자료로 남겨두기 위하여 뇌물자금과 기타 자금을 구별하지 아니하고 그 지출 일시, 금액, 상대방 등 내역을 그때그때 계속적, 기계적으로 기입한 수첩의 기재 내용은, 피고인이 자신의 범죄사실을 시인하는 자백이라고 볼 수 없으므로, 증거능력이 있는 한 피고인의 금전출납을 증명할 수 있는 별개의 증거라고 할 것인즉, 피고인의 검찰에서의 자백에 대한 보강증거가 될 수 있다(대판 1996.10.17. 94도2865(전합) ).", "answer": "X"}, {"source": "19변시", "question": "자백에 관한 설명 중 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 그 범죄혐의를 받기 전에 이와는 관계없이 자기의 업무수행에 필요한 자금을 지출하면서 스스로 그 지출한 자금내역을 자료로 남겨두기 위하여 뇌물자금과 기타 자금을 구별하지 아니하고 그 내역을 기입한 수첩은 피고인의 검찰에서의 자백에 대한 보강증거가 될 수 없다.", "explanation": "[1] 상법장부나 항해일지, 진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 자기에게 맡겨진 사무를 처리한 사무 내역을 그때그때 계속적, 기계적으로 기재한 문서 등의 경우는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 그 존재 자체 및 기재가 그러한 내용의 사무가 처리되었음의 여부를 판단할 수 있는 별개의 독립된 증거자료이고, 설사 그 문서가 우연히 피고인이 작성하였고 그 문서의 내용 중 피고인의 범죄사실의 존재를 추론해 낼 수 있는, 즉 공소사실에 일부 부합되는 사실의 기재가 있다고 하더라도, 이를 일컬어 피고인이 범죄사실을 자백하는 문서라고 볼 수는 없다. [2] 피고인이 뇌물공여 혐의를 받기 전에 이와는 관계없이 준설공사에 필요한 각종 인·허가 등의 업무를 위임받아 이를 추진하는 과정에서 그 업무수행에 필요한 자금을 지출하면서, 스스로 그 지출한 자금내역을 자료로 남겨두기 위하여 뇌물자금과 기타 자금을 구별하지 아니하고 그 지출 일시, 금액, 상대방 등 내역을 그때그때 계속적, 기계적으로 기입한 수첩의 기재 내용은, 피고인이 자신의 범죄사실을 시인하는 자백이라고 볼 수 없으므로, 증거능력이 있는 한 피고인의 금전출납을 증명할 수 있는 별개의 증거라고 할 것인즉, 피고인의 검찰에서의 자백에 대한 보강증거가 될 수 있다(대판 1996.10.17. 94도2865(전합) ).", "answer": "X"}, {"source": "19변시", "question": "자백에 관한 설명 중 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "횡령죄의 피고인이 제출한 항소이유서에 \"피고인은 돈이 급해 지어서는 안될 죄를 지었습니다.\", \"진심으로 뉘우치고 있습니다.\"라고 기재되어 있더라도, 이어진 검사와 재판장 및 변호인의 각 신문에 대하여 범죄사실을 일관되게 부인한다면 범죄사실을 자백한 것이라고 볼 수 없다.", "explanation": " [1] 피고인이 제출한 항소이유서에 ‘피고인은 돈이 급해 지어서는 안될 죄를 지었습니다.’ ‘진심으로 뉘우치고 있습니다.’라고 기재되어 있고 피고인은 항소심 제2회 공판기일에 위 항소이유서를 진술하였으나, 곧 이어서 있은 검사와 재판장 및 변호인의 각 심문에 대하여 피고인은 범죄사실을 부인하였고, 수사단계에서도 일관되게 그와 같이 범죄사실을 부인하여 온 점에 비추어 볼 때, 위와 같이 추상적인 항소이유서의 기재만을 가지고 범죄사실을 자백한 것으로 볼 수 없다. [2] 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 않더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 충분하다. 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있고, 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다(대판 1999.11.12. 99도3341).", "answer": "O"}, {"source": "19변시", "question": "자백에 관한 설명 중 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "자백에 대한 보강증거는 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도로 충분하지만, 자백과 보강증거만으로도 유죄의 증거로 충분하다고 볼 수 있으므로, 간접증거나 정황증거는 보강증거가 될 수 없다.", "explanation": " [1] 피고인이 제출한 항소이유서에 ‘피고인은 돈이 급해 지어서는 안될 죄를 지었습니다.’ ‘진심으로 뉘우치고 있습니다.’라고 기재되어 있고 피고인은 항소심 제2회 공판기일에 위 항소이유서를 진술하였으나, 곧 이어서 있은 검사와 재판장 및 변호인의 각 심문에 대하여 피고인은 범죄사실을 부인하였고, 수사단계에서도 일관되게 그와 같이 범죄사실을 부인하여 온 점에 비추어 볼 때, 위와 같이 추상적인 항소이유서의 기재만을 가지고 범죄사실을 자백한 것으로 볼 수 없다. [2] 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 않더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 충분하다. 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있고, 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다(대판 1999.11.12. 99도3341).", "answer": "X"}, {"source": "18변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": " '국가보안법'상 회합죄를 피고인이 자백하는 경우, 회합 당시 상대방으로부터 받았다는 명함의 현존은 보강증거로 될 수 있다. ", "explanation": "자백에 대한 보강증거는 범죄사실 전체에 관한 것이 아니라 할지라도 피고인의 자백사실이 가공적인 것이 아니고 진실한 것이라고 인정할 수 있는 정도이면 충분하고, 이러한 증거는 직접증거뿐만 아니라 간접증거 내지 정황증거라도 족하다 할 것이므로 국가보안법상 회합죄를 피고인이 자백하는 경우 회합 당시 상대방으로부터 받았다는 명함의 현존은 보강증거로 될 수 있다(대판 1990.06.22. 90도741). ", "answer": "O"}, {"source": "18변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "전과에 관한 사실은 누범가중의 사유가 되는 경우에도 피고인의 자백만으로 인정할 수 있다.", "explanation": "전과에 관한 사실은 엄격한 의미에서의 범죄사실과는 구별되는 것으로서 피고인의 자백만으로서도 이를 인정할 수 있다고 할 것인데 피고인은 수사기관이래 공판정에 이르기까지 일관하여 전과에 관한 사실을 자백하고 있고 다만 형의 집행을 완료한 날짜에 착오가 있는듯하지만 누범기중되는 전과임에는 틀림이 없으므로 채증법칙 위배의 위법이 없다(대판 1973.03.20. 73도280). ", "answer": "O"}, {"source": "18변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "약 3개원에 걸쳐 8회의 도박을 하였다는 혐의로 검사가 피고인에 대해 상습도박죄로 기소한 경우, 총 8회의 도박 중 3회의 도박사실에 대해서는 피고인의 자백 외에 보강증거가 없는 경우에도 법원은 소위 진실성담보설에 입각하여 8회의 도박행위 전부에 대하여 유죄판결을 할 수 있다.", "explanation": "피고인의 습벽을 범죄구성요건으로 하며 포괄일죄인 상습범에 있어서도 이를 구성히는 각 행위에 관하여 개별적으로 보강증거를 요구하고 있다(대판 1996.02.13. 95도1794).", "answer": "X"}, {"source": "18변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "2017. 2. 18. 01:35경 자동차를 타고 온 甲으로부터 필로폰을 건네받은 후 甲이 위 차량을 운전해 갔다고 한 A의 진술과 2017. 2. 20. 甲으로부터 채취한 소변에서 나온 필로폰 양성반응 결과는, 甲이 2017. 2. 18. 02:00경의 필로폰 투약으로 정상적으로 운전하지 못할 우려가 있는 상태에서 운전하였다는 자백을 보강하는 증거가 되기에 충분하다.", "explanation": "자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라, 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있고, 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다. 2010. 2. 18. 01:35경 자동차를 타고 온 피고인으로부터 필로폰을 건네받은 후 피고인이 위 차량을 운전해 갔다고 한 甲의 진술과 2010. 2. 20. 피고인으로부터 채취한 소변에서 나온 필로폰 양성 반응은, 피고인이 2010. 2. 18. 02:00경의 필로폰 투약으로 정상적으로 운전하지 못할 우려가 있는 상태에 있었다는 공소사실 부분에 대한 자백을 보강하는 증거가 되기에 충분하므로, 위 공소사실 부분에 대한 보강증거가 없다는 원심판단에 보강증거의 정도에 관한 법리오해의 위법이 있다(대판 2010.12.23. 2010도11272).", "answer": "O"}, {"source": "18변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "실체적 경합범의 경우 각 범죄사실에 관하여 자백에 대한 보강증거가 있어야 한다.", "explanation": "실체적 경합범은 실질적으로 수죄이므로 각 범죄사실에 관하여 자백에 대한 보강증거가 있어야 한다(대판 2008.02.14. 2007도10937).", "answer": "O"}, {"source": "16변시", "question": "공범인 甲과 Z은 특수절도죄로 기소된 공동피고인이다. 甲은 사법경찰관과 검사의 피의자신문에서 범행을 모두 자백하였으나, 공판정에서는 공소사실을 부인하고 있다. 반면, 乙은 일관되게 공소사실을 부인하고 있다. 甲에 대한 각 피의자신문조서는 모두 적법한 절차와 방법에 따라 작성되었고 임의성과 특신상태가 인정됨을 전제로 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲에 대한 사법경찰관 작성의 피의자신문조서를 乙이 증거로 함에 부동의하는 경우에는 甲이 성립의 진정과 내용을 인정하는지 여부와 상관없이 그 피의자신문조서를 乙에 대한 유죄의 증거로 사용할 수 없다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다(대판 2010.01.28. 2009도10139). ", "answer": "O"}, {"source": "16변시", "question": "공범인 甲과 Z은 특수절도죄로 기소된 공동피고인이다. 甲은 사법경찰관과 검사의 피의자신문에서 범행을 모두 자백하였으나, 공판정에서는 공소사실을 부인하고 있다. 반면, 乙은 일관되게 공소사실을 부인하고 있다. 甲에 대한 각 피의자신문조서는 모두 적법한 절차와 방법에 따라 작성되었고 임의성과 특신상태가 인정됨을 전제로 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲에 대한 검사 작성의 피의자신문조서를 乙이 증거로 함에 부동의하는 경우 甲이 성립의 진정을 인정하고 법원이 乙에게 甲에 대한 반대신문의 기회를 주었다면 甲이 그 내용을 인정하는지의 여부와 상관없이 乙에 대한 유죄의 증거로 사용할 수 있다. ", "explanation": "2020. 2. 4. 법률 제16924호로 개정되어 2022. 1. 1.부터 시행된 형사소송법 제312조 제1항은 검사가 작성한 피의자신문조서의 증거능력에 대하여 ‘적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다.’고 규정하였다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. 형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형별 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023도3741).  \n=>출제당시에는 O인 지문이었으나, 형사소송법 개정 및 위 판례에 따라 X로 정답 변경. 형소법 제312조 제1항의 개정 취지에 따르면 검사가 작성한피의자신문조서도 내용인정이라는 엄격한 요건을 요구하는 바 피고인과 공범관계에 있다면 그에 대해 검사가 작성한 피의자신문조서는 공동피고인이 여부를 묻지 않고 당해 피고인 또는 변호인이 내용을 인정해야만 증거능력이 인정된다고 할 것이다(이창현, 형사소송법 제9판, p.899 참조). ", "answer": "X"}, {"source": "16변시", "question": "공범인 甲과 Z은 특수절도죄로 기소된 공동피고인이다. 甲은 사법경찰관과 검사의 피의자신문에서 범행을 모두 자백하였으나, 공판정에서는 공소사실을 부인하고 있다. 반면, 乙은 일관되게 공소사실을 부인하고 있다. 甲에 대한 각 피의자신문조서는 모두 적법한 절차와 방법에 따라 작성되었고 임의성과 특신상태가 인정됨을 전제로 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙에 대한 공소사실과 관련하여 甲에 대한 검사 작성의 피의자신문조서의 증거능력이 인정되는 때에는 다른 보강증거가 없어도 법원은 乙에 대하여 유죄판결을 할 수 있다.", "explanation": "형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 진술은 포함되지 않으며, 이러한 공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립한 증거능력이 있다(대판 1992.07.28. 92도917). ", "answer": "O"}, {"source": "16변시", "question": "공범인 甲과 Z은 특수절도죄로 기소된 공동피고인이다. 甲은 사법경찰관과 검사의 피의자신문에서 범행을 모두 자백하였으나, 공판정에서는 공소사실을 부인하고 있다. 반면, 乙은 일관되게 공소사실을 부인하고 있다. 甲에 대한 각 피의자신문조서는 모두 적법한 절차와 방법에 따라 작성되었고 임의성과 특신상태가 인정됨을 전제로 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": " 乙이 甲을 증인으로 신청한 경우 법원은 소송절차를 분리하지 않고도 甲을 증인으로 신문할 수 있으며, 이러한 경우에도 甲은 증언을 거부할 수 있다. ", "explanation": "공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다(대판 2008.06.26. 2008도3300).", "answer": "X"}, {"source": "16변시", "question": "공범인 甲과 Z은 특수절도죄로 기소된 공동피고인이다. 甲은 사법경찰관과 검사의 피의자신문에서 범행을 모두 자백하였으나, 공판정에서는 공소사실을 부인하고 있다. 반면, 乙은 일관되게 공소사실을 부인하고 있다. 甲에 대한 각 피의자신문조서는 모두 적법한 절차와 방법에 따라 작성되었고 임의성과 특신상태가 인정됨을 전제로 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲에 대한 검사 작성의 피의자신문조서에 자백하는 진술이 기재되어 있더라도 다른 보강증거가 없다면 그 자백만으로는 甲에 대한 공소사실에 대하여 유죄를 선고할 수 없고, 이는 甲이 공판정에서 자백을 하는 경우라도 마찬가지이다.", "explanation": "공판정에서의 피고인의 자백에도 보강법칙이 적용되는가가 문제된다. 이에 대하여 공판정의 자백이라 하여 언제나 진실하다고 볼 수 없고 대법원도 형사소송법 제310조의 자백에는 공판정의 자백과 수사기관에서의 자백을 불문한다고 판시하고 있다(대판 1981.07.07. 81도1314). ", "answer": "O"}, {"source": "13변시", "question": "자백의 보강법칙에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 자백이 포함되지 아니하므로 그 진술은 피고인에 대한 범죄사실을 인정하는 데 있어서 보강증거로 쓸 수 있다. ", "explanation": "형사소송법 제310조 소정의 “피고인의 자백”에 공범인 공동피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다(대판 1990.10.30. 90도1939). ", "answer": "O"}, {"source": "13변시", "question": "자백의 보강법칙에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "전문증거는 전문법칙의 예외에 해당하는지 여부에 관계없이 보강증거가 될 수 있다. ", "explanation": "보강증거도 증거능력이 있어야 하므로 전문증거는 전문법칙의 예외에 해당하는 경우를 제외하고는 보강증거가 될 수 없다. ", "answer": "X"}, {"source": "13변시", "question": "자백의 보강법칙에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되어야 하고, 또한 직접증거가 아닌 간접증거나 정황증거는 보강증거가 될 수 없다. ", "explanation": "자백에 대한 보강증거는 범죄사실의 전부 또는 중요부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있으며 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다(대판 2002.01.08. 2001도1897). ", "answer": "X"}, {"source": "13변시", "question": "자백의 보강법칙에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "즉결심판절차 및 간이공판절차에서는 자백만 있으면 보강증거 없이도 유죄판결을 할 수 있다. ", "explanation": "자백의 보강법칙은 일반 형사소송절차에서 적용된다. 즉결심판절차에서는 자백의 보강법칙이 적용되지 않으나, 간이공판절차에서는 자백의 보강법칙이 여전히 적용되므로 보강증거 없이 자백만으로 유죄판결을 선고할 수 없다. ", "answer": "X"}, {"source": "13변시", "question": "자백의 보강법칙에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "피고인이 자백한 상황에서 나머지 2명의 공동피고인 중 한 사람이 자백하였으나 다른 한 사람이 부인하는 경우에는 유죄판결을 할 수 없고, 공동피고인 전원이 자백한 경우에 한하여 유죄판결이 가능하다. ", "explanation": "공동피고인중의 한 사람이 자백하였고 피고인 역시 자백했다면 다른 공동피고인 중의 한 사람이 부인한다 하여도 위 공동피고인 중 한 사람의 자백은 피고인의 자백에 대한 보강증거가 된다(대판 1968.03.19. 68도43). ", "answer": "X"}, {"source": "19변시", "question": "공판조서에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "공판기일의 소송절차에 관하여는 수소법원의 재판장이 아니라 참여한 법원사무관 등이 공판조서를 작성한다. ", "explanation": "형사소송법 제51조 제1항 참조. \n형사소송법 제51조(공판조서의 기재요건) ① 공판기일의 소송절차에 관하여는 참여한 법원사무관등이 공판조서를 작성하여야 한다. ", "answer": "O"}, {"source": "19변시", "question": "공판조서에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "공판기일의 소송절차로서 공판조서에 기재된 것은 그 조서만으로 증명하고, 명백한 오기인 경우를 제외하고는 다른 자료에 의한 반증이 허용되지 않는다. ", "explanation": "공판조서의 기재가 명백한 오기인 경우를 제외하고는 공판기일의 소송절차로서 공판조서에 기재된 것은 조서만으로써 증명하여야 하고, 그 증명력은 공판조서 이외의 자료에 의한 반증이 허용되지 않는 절대적인 것이다(대판 2003.10.10. 2003도3282). \n형사소송법 제56조(공판조서의 증명력) 공판기일의 소송절차로서 공판조서에 기재된 것은 그 조서만으로써 증명한다.", "answer": "O"}, {"source": "19변시", "question": "공판조서에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "검사가 제출한 증거에 대하여 동의 또는 진정성립 여부 등에 관한 피고인의 의견이 증거목록에 기재된 경우,  그 증거목록의 기재도 명백한 오기가 아닌 이상 절대적인 증명력을 가진다.", "explanation": "공판조서의 기재가 명백한 오기인 경우를 제외하고는 공판기일의 소송절차로서 공판조서에 기재된 것은 조서만으로써 증명하여야 하고 그 증명력은 공판조서 이외의 자료에 의한 반증이 허용되지 않는 절대적인 것이므로, 검사 제출의 증거에 관하여 동의 또는 진정성립 여부 등에 관한 피고인의 의견이 증거목록에 기재된 경우에는 그 증거목록의 기재는 공판조서의 일부로서 명백한 오기가 아닌 이상 절대적인 증명력을 가지게 된다(대판 2012.06.14. 2011도12571). ", "answer": "O"}, {"source": "19변시", "question": "공판조서에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "피고인이 공판조서에 대해 열람 또는 등사를 청구하였는데 법원이 불응하여 피고인의 열람 또는 등사청구권이 침해된 경우 그 공판조서를 유죄의 증거로 할 수 없으나 그 공판조서에 기재된 증인의 진술은 다른 절차적 위법이 없는 이상 증거로 할 수 있다. ", "explanation": "형사소송법 제55조 제1항이 피고인에게 공판조서의 열람 또는 등사청구권을 부여한 이유는 공판조서의 열람 또는 등사를 통하여 피고인으로 하여금 진술자의 진술내용과 그 기재된 조서의 기재내용의 일치 여부를 확인할 수 있도록 기회를 줌으로써 그 조서의 정확성을 담보함과 이울러 피고인의 방어권을 충실하게 보장하려는 데 있으므로 피고인의 공판조서에 대한 열람 또는 등사청구에 법원이 불응하여 피고인의 열람 또는 등사청구권이 침해된 경우에는 그 공판조서를 유죄의 증거로 할 수 없을 뿐만 아니라, 공판조서에 기재된 당해 피고인이나 증인의 진술도 증거로 할 수 없다(대판 2003.10.10. 2003도3282)", "answer": "X"}, {"source": "19변시", "question": "공판조서에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "피고인이 차회 공판기일 전 등 원하는 시기에 공판조서를 열람·등사하지 못하였다 하더라도 그 변론종결 이전에 이를 열람·등사한 경우에는 그 열람·등사가 늦어짐으로 인하여 피고인의 방어권 행사에 지장이 있었다는 등의 특별한 사정이 없는 한 그 공판조서를 유죄의 증거로 할 수 있다. ", "explanation": "형사소송법 제55조 제1항이 피고인에게 공판조서의 열람 또는 등사청구권을 부여한 이유는 공판조서의 열람 또는 등사를 통하여 피고인으로 하여금 진술자의 진술내용과 그 기재된 조서의 기재 내용의 일치 여부를 확인할 수 있도록 기회를 줌으로써 그 조서의 정확성을 담보함과 아울러 피고인의 방어권을 충실하게 보장하려는 데 있으므로, 비록 피고인이 차회 공판기일 전 등 원하는 시기에 공판조서를 열람·등사하지 못하였다 하더라도 그 변론종결 이전에 이를 열람·등사한 경우에는 그 열람·등사가 늦어짐으로 인하여 피고인의 방어권 행사에 지장이 있었다는 등의 특별한 사정이 없는 한 형사소송법 제55조 제1항 소정의 피고인의 공판조서의 열람·등사청구권이 침해되었다고 볼 수 없어, 그 공판조서를 유죄의 증거로 할 수 있다고 보아야 한다(대판 2007.07.26. 2007도3906).", "answer": "O"}, {"source": "26변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "형벌에 관한 법령이 헌법재판소의 위헌결정으로 소급하여 그 효력을 상실하였거나 법원에서 위헌·무효로 선언된 경우, 당해 법령을 적용하여 공소가 제기된 피고사건에 대하여 무죄를 선고하여야 하고, 나아가 형벌에 관한 법령이 폐지되었더라도 당초부터 위헌·무효인 경우라면 ‘범죄로 되지 아니한 때’의 무죄사유에 해당하므로 이 경우 면소판결을 선고하였다면 이에 대하여 무죄를 주장하여 상소가 가능하다. ", "explanation": "재심이 개시된 사건에서 범죄사실에 대하여 적용하여야 할 법령은 재심판결 당시의 법령이므로, 법원은 재심대상판결 당시의 법령이 변경된 경우에는 그 범죄사실에 대하여 재심판결 당시의 법령을 적용하여야 하고, 폐지된 경우에는 형사소송법 제326조 제4호를 적용하여 그 범죄사실에 대하여 면소를 선고하는 것이 원칙이다. 그러나 법원은, 형벌에 관한 법령이 헌법재판소의 위헌결정으로 인하여 소급하여 그 효력을 상실하였거나 볍원에서 위헌·무효로 선언된 경우, 당해 법령을 적용하여 공소가 제기된 피고사건에 대하여 같은 법 제325조에 따라 무죄를 선고하여야 한다. 나아가 형벌에 관한 법령이 재심판결 당시 폐지되었다 하더라도 그 ‘폐지’가 당초부터 헌법에 위배되어 효력이 없는 법령에 대한 것이었다면 같은 법 제325조 전단이 규정하는 ‘범죄로 되지 아니한 때’의 무죄사유에 해당하는 것이지, 같은 법 제326조 제4호의 면소사유에 해당한다고 할 수 없다. 따라서 면소판결에 대하여 무죄판결인 실체판결이 선고되어야 한다고 주장하면서 상고할 수 없는 것이 원칙이지만, 위와 같은 경우에는 이와 달리 면소를 할 수 없고 피고인에게 무죄의 선고를 하여야 하므로 면소를 선고한 판결에 대하여 상고가 기능하다(대판 2010. 12.16. 2010도5986(전합)) ", "answer": "O"}, {"source": "26변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "경찰서장이 범칙행위에 대하여 통고처분을 하였다면 원칙적으로 통고처분에서 정한 범칙금 납부기간까지는 경찰서장은 범칙행위 사건에 대하여 즉결심판을 청구할 수 없고, 검사도 동일한 범칙행위에 대하여 공소를 제기할 수 없다. ", "explanation": "경찰서장이 범칙행위에 대하여 통고처분을 한 이상 범칙자의 위와 같은 절차적 지위를 보장하기 위하여 통고처분에서 정한 범칙금 납부기간까지는 원칙적으로 경찰서장은 즉결심판을 청구할 수 없고, 검사도 동일한 범칙행위에 대하여 공소를 제기할 수 없다. 또한 범칙자가 범칙금 납부기간이 지나도록 범칙금을 납부하지 아니하였다면 경찰서장이 즉결심판을 청구하여야 하고 검사는 동일한 범칙행위에 대하여 공소를 제기할 수 없다(대판 2021.04.01. 2020도15194).", "answer": "O"}, {"source": "26변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소기각의 재판이 있으면 피고인은 유죄판결의 위험으로부터 벗어나지만 그 재판은 행정처분 등에서 피고인에게 불이익한 재판이라고 할 수 있어 이에 대하여 피고인에게 상소의 이익이 인정된다. ", "explanation": "피고인을 위한 상소는 피고인에게 불이익한 재판을 시정하여 이익된 재판을 청구함을 그 본질로 하는 것이므로 피고인은 당해 재판이 자기에게 불이익하지 아니하면 이에 대한 상소권을 가질 수 없다할 것인데, 공소기각의 판결이 있으면 피고인은 공소의 제기가 없었던 상태로 복귀되어 유죄판결의 위험으로부터 해방되는 것이니 그 공소 기각판결에 대하여 피고인은 상소할 수 없다(대판 1983.12.13. 82도3076 ). ", "answer": "X"}, {"source": "26변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법률조항에 대하여 헌법재판소가 종전의 합헌결정 이후 위헌결정을 내려 이 법률조항이 종전 합헌결정일의 다음 날로 소급하여 효력을 상실하였다면 종전의 합헌결정일 이전에 이 법률조항에 해당하는 범죄행위에 대한 유죄의 확정판결을 받은 경우, 위 확정판결을 대상으로 하는 재심심판절차에서는 재심 대상 범죄행위 당시 유효한 위 법률조항이 그 이후 폐지된 경우와 마찬가지이므로 법원은 면소판결을 선고하여야 한다. ", "explanation": "형사소송법 제326조 제4호는 ‘범죄 후의 법령개폐로 형이 폐지되었을 때’를 면소판결을 선고하여야 하는 경우로 정하고 있으므로, 종전 합헌결정일 이전의 범죄행위에 대하여 재심개시결정이 확정되었는데 그 범죄행위에 적용될 법률 또는 법률의 조항이 위헌결정으로 헌법재판소법 제47조 제3항 단서에 의하여 종전 합헌결정일의 다음 날로 소급하여 효력을 상실하였다면 범죄행위 당시 유효한 법률 또는 법률의 조항이 그 이후 폐지된 경우와 마찬가지이므로 법원은 형사소송법 제326조 제4호에 해당하는 것으로 보아 면소판결을 선고하여야 하는 점에 비추어 보면, 공소사실 기재 범행일이 종전 합헌결정일 이전이고, 구형법 제241조가 위 위헌결정으로 인하여 종전 합헌결정일의 다음 날인 2008. 10. 31.로 소급하여 효력을 상실하므로 공소사실을 심판하는 제1심은 형사소송법 제326조 제4호에 따라 면소판결을 선고하여야 한다는 이유로, 공소사실에 대하여 면소판결을 선고한 제1심 및 이를 유지한 원심의 조치가 타당하다(대판 2019.12.24. 2019도15167).", "answer": "O"}, {"source": "22변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "원심판결 선고 후 헌법재판소가 원심판결 대상인 법률조항에 대하여 헌법불합치결정을 선고하면서 개정시한을 정하여 입법개선을 촉구하였는데도 그 시한까지 법률개정이 이루어지지 않은 경우 위 법률조항은 소급하여 효력을 상실하므로 이를 적용하여 공소가 제기된 피고사건에 대하여는 무죄를 선고하여야 한다.", "explanation": "피고인이 야간옥외집회를 주최하였디는 취지의 공소사실에 대하여 원심이 집회 및 시위에 관한 법률(2007. 5. 11. 법률 제8424호로 전부 개정된 것) 제23조 제1호, 제10조 본문을 적용하여 유죄를 인정하였는데, 원심판결 선고 후 헌법재판소가 위 법률조항에 대해 헌법불합치결정을 선고하면서 개정시한을 정하여 입법개선을 촉구하였는데도 위 시한까지 법률개정이 이루어지지 않은 사안에서, 위 법률조항은 소급하여 효력을 상실하므로 이를 적용하여 공소가 제기된 위 피고사건에 대하여 형사소송법 제325조 전단에 따라 무죄를 선고하여야 한다(대판 2011.06.23. 2008도7562(전합)) ", "answer": "O"}, {"source": "22변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "공소제기 당시의 공소사실에 대한 법정형을 기준으로 하면 공소제기 당시 아직 공소시효가 완성되지 않았으나 변경된 공소사실에 대한 법정형을 기준으로 하면 공소제기 당시 이미 공소시효가 완성된 경우에는 공소시효의 완성을 이유로 면소판결을 선고하여야 한다.", "explanation": "공소장 변경 절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 된다고 보아야 하므로 공소제기 당시의 공소사실에 대한 법정형을 기준으로 하면 공소제기 당시 아직 공소시효가 완성되지 않았으나 변경된 공소사실에 대한 법정형을 기준으로 하면 공소제기 당시 이미 공소시효가 완성된 경우에는 공소시효의 완성을 이유로 면소판결을 선고하여야 한다(대판 2001.08.24. 2001도2902 등참조) . 이러한 법리는 법원이 공소장을 변경하지 않고도 인정할 수 있는 사실에 대한 법정형을 기준으로 하면 공소제기 당시 이미 공소시효가 완성된 경우에도 마찬가지로 적용된다(대판 200l.08.24. 2001도2902).", "answer": "O"}, {"source": "22변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "피고인을 금고 이상의 형에 처한 판결이 확정된 다음 확정판결 전의 공소사실과 확정판결 후의 공소사실에 대하여 따로 유죄를 선고하여 두 개의 형을 정한 제1심 판결에 대하여 피고인만이 확정판결 전의 유죄판결 부분에 대하여 항소한 경우, 피고인과 검사가 항소하지 아니한 확정판결 후의 유죄판결 부분은 항소기간이 지남으로써 확정되어 항소심에 계속된 사건은 확정판결 전의 유죄판결 부분뿐이고, 그에 따라 항소심이 심리·판단하여야 할 범위는 확정판결 전의 유죄판결 부분에 한정된다. ", "explanation": "형법 제37조 전단의 경합범으로 동시에 기소된 수 개의 공소사실에 대하여 일부 유죄, 일부 무죄를 선고하거나 수 개의 공소사실이 금고 이상의 형에 처한 확정판결 전후의 것이어서 형법 제37조 후단, 제39조 제1항에 의하여 각기 따로 유·무죄를 선고하거나 형을 정하는 등으로 판결주문이 수 개일 때에는 그 1개의 주문에 포함된 부분을 다른 부분과 분리하여 일부상소를 할 수 있고 이때 당사자 쌍방이 상소하지 아니한 부분은 분리 확정된다. 그러므로 확정판결 전의 공소사실과 확정판결 후의 공소사실에 대하여 따로 유죄를 선고하여 두 개의 형을 정한 제1심판결에 대하여 피고인만이 확정판결 전의 유죄판결 부분에 대하여 항소한 경우 피고인과 검사가 항소하지 아니한 확정판결 후의 유죄판결 부분은 항소기간이 지남으로써 확정되어 항소심에 계속된 사건은 확정판결 전의 유죄판결 부분 뿐이고, 그에 따라 항소심이 심리·판단하여야 할 범위는 확정판결 전의 유죄판결 부분에 한정된다(대판 2018.03.29. 2016도18553). ", "answer": "O"}, {"source": "22변시", "question": "재판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "「소년법」 제32조의 보호처분을 받은 사건과 동일한 사건에 대하여 다시 공소제기가 되었다면 「소년법」 제32조의 보호처분은 확정판결이어서 기판력을 가지므로 면소판결을 하여야한다. ", "explanation": "소년법 제32조의 보호처분을 받은 사건과 동일(상습죄 등 포괄일죄 포함)한 사건에 관하여 다시 공소제기가 되었다면, 이는 공소제기 절차가 법률의 규정에 위배하여 무효인 때에 해당한 경우이므로 형사소송법 제327조 제2호의 규정에 의하여 공소기각의 판결을 하여야 한다(대판 1996.02.23. 96도47). ", "answer": "X"}, {"source": "16변시", "question": "재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "재심대상판결 확정 후에 형 선고의 효력을 상실케 하는 특별사면이 있었다고 하더라도, 재심 개시결정이 확정되어 재심심판절차를 진행하는 법원은 그 심급에 따라 다시 심판하여 실체에 관한 유/무죄 등의 판단을 해야지, 특별사면이 있음을 들어 면소판결을 하여서는 아니 된다.", "explanation": "면소판결 사유인 형사소송법 제326조 제2호의 '사면이 있는 때'에서 말하는 '사면'이란 일반사면을 의미할 뿐, 형을 선고받아 확정된 자를 상대로 이루어지는 특별사면은 여기에 해당하지 않으므로, 재심대상판결 확정 후에 형 선고의 효력을 상실케 하는 특별사면이 있었다고 하더라도, 재심개시결정이 확정되어 재심심판절차를 진행하는 법원은 그 심급에 따라 다시 심판하여 실체에 관한 유.무죄 등의 판단을 해야지, 특별사면이 있음을 들어 면소판결을 하여서는 아니 된다(대판 2015.05.21. 2011도1932).", "answer": "O"}, {"source": "16변시", "question": "재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "원래 공소제기가 없었음에도 피고인의 소환이 이루어지는 등 사실상의 소송계속이 발생한 상태에서 검사가 약식명령을 청구하는 공소장을 제1심법원에 제출하고, 위 공소장에 기하여 공판절차를 진행한 경우 제1심법원으로서는 이에 기하여 유/무죄의 실체판단을 하여야 한다.", "explanation": " [1] 소송행위로서 요구되는 본질적인 개념요소가 결여되어 소송행위로 성립되지 아니한 경우에는 소송행위가 성립되었으나 무효인 경우와는 달리 하자의 치유문제는 발생하지 않으나, 추후 당해 소송행위가 적법하게 이루어진 경우에는 그 때부터 위 소송행위가 성립된 것으로 볼 수 있다. \n[2] 원래 공소제기가 없었음에도 피고인의 소환이 이루어지는 등 사실상의 소송계속이 발생한 상태에서 검사가 약식명령을 청구하는 공소장을 제1심법원에 제출하고, 위 공소장에 기하여 공판절차를 진행한 경우 제1심법원으로서는 이에 기하여 유. 무죄의 실체판단을 하여야 한다(대판 2003.11.14. 2003도2735)", "answer": "O"}, {"source": "16변시", "question": "재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "판결의 확정력은 사실심리의 가능성이 있는 최후의 시점인 판결선고시를 기준으로 하여 그때까지 행하여진 행위에 대하여만 미친다.", "explanation": "판결의 확정력은 사실심리의 가능성이 있는 최후의 시점인 판결선고시를 기준으로 하여 그때까지 행하여진 행위에 대하여만 미치는 것으로서, 제1심 판결에 대하여 항소가 된 경우 판결의 확정력이 미치는 시간적 한계는 현행 형사항소심의 구조와 운용실태에 비추어 볼 때 항소심 판결선고시라고 보는 것이 상당한데 항소이유서를 제출하지 아니하여 결정으로 항소가 기각된 경우에도 형사소송법 제361조의4 제1항에 의하면 피고인이 항소한 때에는 법정기간 내에 항소이유서를 제출하지 아니하였다 하더라도 판결에 영향을 미친 사실오인이 있는 등 직권조사사유가 있으면 항소법원이 직권으로 심판하여 제1심 판결을 파기하고 다시 판결할 수도 있으므로 사실심리의 가능성이 있는 최후시점은 항소기각 결정시라고 보는 것이 옳다(대판 1993.05.25. 93도836)", "answer": "O"}, {"source": "16변시", "question": "재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「소년법」상의 보호처분을 받은 사건과 동일한 사건에 대하여 다시 공소가 제기된 경우, 법원은 면소판결을 선고하여야 한다", "explanation": "소년법 제32조의 보호처분을 받은 사건과 동일(상습죄 등 포괄일죄 포함)한 사건에 관하여 다시 공소제기가 되었다면, 이는 공소제기 절차가 법률의 규정에 위배하여 무효인 때에 해당한 경우이므로 형사소송법 제327조 제2호의 규정에 의하여 공소기각의 판결을 하여야 한다(대판 1996.02.23. 96도47)", "answer": "X"}, {"source": "16변시", "question": "재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "헌법재판소의 위현결정으로 인하여 형벌에 관한 법령이 소급하여 그 효력을 상실한 경우, 법원은 당해 법령을 적용하여 공소가 제기된 피고사건에 대하여는 무죄를 선고하여야 한다", "explanation": "위헌결정으로 인하여 형벌에 관한 법률 또는 법률조항이 소급하여 그 효력을 상실한 경우에는 당해 조항을 적용하여 공소가 제기된 피고사건은 범죄로 되지 아니한 때에 해당한다고 할 것이어서 법원은 그 피고 사건에 대하여 형사소송법 제325조 전단에 따라 무죄를 선고하여야 한다( 대판 2011.09.29. 2009도12515).", "answer": "O"}, {"source": "25변시", "question": "종국재판에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄱ. 유죄판결의 판결이유에는 범죄사실, 증거의 요지와 법령의 적용을 명시하여야 하므로, 유죄판결을 선고하면서 판결이유에 이 중 어느 하나를 전부 누락한 경우에는 형사소송법 제383조 제1호에 정한 판결에 영향을 미친 법률위반으로 파기사유가 된다.", "explanation": "형사소송법 제323조 제1항에 따르면 유죄판결의 판결이유에는 범죄사실, 증거의 요지와 법령의 적용을 명시하여야 하므로. 유죄판결을 선고하면서 판결이유에 이 중 어느 하나를 전부 누락한 경우에는 형사소송법 제383조 제1호에 정한 판결에 영향을 미친 법률위반으로서 파기사유가 된다( 대판 2009.06.25. 2009도3505).", "answer": "O"}, {"source": "25변시", "question": "종국재판에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄴ. 헌법재판소법 제47조 제3항 본문에 따라 형벌에 관한 법률조항에 대하여 위헌결정이 선고된 경우 그 조항은 소급하여 효력을 상실하므로, 법원은 당해 조항이 적용되어 공소가 제기된 피고사건에 대하여 형사소송법 제325조 전단에 따라 무죄를 선고하여야 한다.", "explanation": "헌법재판소법 제47조 제3항 본문은 형벌에 관한 법률조항에 대하여 위헌결정이 선고된 경우 그 조항이 소급하여 효력을 상실한다고 규정하고 있으므로, 형벌에 관한 법률조항이 소급하여 효력을 상실한 경우에 당해 조항을 적용하여 공소가 제기된 피고사건은 범죄로 되지 않은 때에 해당한다. 따라서 법원은 그 피고사건에 대하여 형사소송법 제325조 전단에 따라 무죄를 선고하여야 한다( 대판 2018.10.25. 2015도17936).", "answer": "O"}, {"source": "25변시", "question": "종국재판에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄷ. 가정폭력범죄의 처벌 등에 관한 특례법 에 따른 보호처분의 결정이 확정되고 그 결정을 이행하거나 집행에 따름으로써 그 보호처분이 취소되지 않은 사건과 동일한 사건에 대하여 다시 공소제기가 된 경우 형사소송법 제327조 제2호에 의하여 공소기각판결을 선고하여야 한다.", "explanation": "가정폭력처벌법에 따른 보호처분의 결정이 확정된 경우에는 원칙적으로 그 가정폭력행위자에 대하여 같은 범죄사실로 다시 공소를 제기할 수 없으나(가정폭력처벌법 제16조), 그 보호처분은 확정판결이 아니고 따라서 기판력도 없으므로, 보호처분을 받은 사건과 동일한 사건에 대하여 다시 공소제기가 되었다면 이에 대해서는 면소판결을 할 것이 아니라 공소제기의 절차가 법률의 규정에 위배하여 무효인 때에 해당한 경우이므로 형사소송법 제327조 제2호의 규정에 의하여 공소기각의 판결을 하여야 한다(대판 2017.08.23. 2016도5423).", "answer": "O"}, {"source": "25변시", "question": "종국재판에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 소년법 제53조에 의하면 같은 법 제32조의 보호처분의 심리가 결정된 사건은 다시 공소를 제기하거나 소년부에 송치할 수 없다고 하여 확정판결에 준하는 효력을 인정하고 있으므로, 제32조의 보호처분을 받은 사건은 그 보호처분이 취소되는 등 특별한 사정이 없다면, 이와 동일한 사건에 관하여 다시 공소제기가 된 경우 형사소송법 제326조 제1호에 의하여 면소판결을 선고하여야 한다.", "explanation": "소년법 제53조는 제32조의 보호처분을 받은 소년에 대하여는 그 심리 결정된 사건은 다시 공소를 제기하거나 소년부에 송치할 수 없다고 규정하고 있으므로, 제32조의 보호처분을 받은 사건과 동일(상습죄 등 포괄일죄 포함)한 사건에 관하여 다시 공소제기가 되었다면 이는 공소제기절차가 법률의 규정에 위배하여 무효인 때에 해당한 경우이므로 형사소송법 제327조 제2호의 규정에 의하여 공소기각의 판결을 하여야 한다(대판 1996.02.23. 96도47).", "answer": "X"}, {"source": "25변시", "question": "종국재판에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 재심대상판결 확정 후에 형 선고의 효력을 상실케 하는 특별사면이 있었던 경우 재심개시결정이 확정되어 재심심판절차를 진행하는 법원은 그 심급에 따라 다시 심판하여 특별사면을 이유로 면소판결을 선고하여야 한다.", "explanation": "면소판결 사유인 형사소송법 제326조 제2호의 '사면이 있는 때'에서 말하는 '사면'이란 일반사면을 의미할 뿐, 형을 선고받아 확정된 자를 상대로 이루어지는 특별사면은 여기에 해당하지 않으므로, 재심대상판결 확정 후에 형 선고의 효력을 상실케 하는 특별사면이 있었다고 하더라도, 재심개시결정이 확정되어 재심심판절차를 진행하는 법원은 그 심급에 따라 다시 심판하여 실체에 관한 유.무죄 등의 판단을 해야지, 특별사면이 있음을 들어 면소판결을 하여서는 아니 된다(대판 2015.05.21. 2011도1932(전합)).", "answer": "X"}, {"source": "20변시", "question": "형사소송법 제326조에 따라 면소판결이 선고되어야 할 사건(O)과 그렇지 않은 사건(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 간통죄로 기소된 이후에 간통죄는 헌법재판소의 위헌결정으로 인하여 소급하여 그 효력을 상실하였다.", "explanation": "(X) 법원은 무죄를 선고해야 한다.\n\n판례) 헌법재판소법 제47조 제2항 단서는 형벌에 관한 법률조항에 대하여 위헌결정이 선고된 경우 그 조항이 소급하여 효력을 상실한다고 규정하고 있으므로, 형벌에 관한 법률조항이 소급하여 효력을 상실한 경우에 당해 조항을 적용하여 공소가 제기된 피고사건은 범죄로 되지 아니한 때에 해당하고. 법원은 이에 대하여 형사소송법 제325조 전단에 따라 무죄를 선고하여야 한다(대판 2011.06.23. 2008도7562(전합)).", "answer": "X"}, {"source": "20변시", "question": "형사소송법 제326조에 따라 면소판결이 선고되어야 할 사건(O)과 그렇지 않은 사건(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙은 절도범행으로 소년법에 따라 보호처분을 받은 이후에 동일한 절도범행으로 다시 공소가 제기되었다.", "explanation": "(X) 법원은 공소기각판결을 선고해야 한다.\n\n판례) 소년법 제47조(현행법 제53조)는 제30조(현행법 제32조)의 보호처분을 받은 소년에 대하여는 그 심리결정된 사건은 다시 공소제기 할 수 없고 소년부에 송치하지 못한다라고 규정하고 있으므로 제30조의 보호처분을 받은 사건과 동일(상습죄등 포괄일죄 포함)한 사건에 대하여 다시 공소제기가 되었다면 소년법 제30조의 보호처분은 확정판결이 아니고 따라서 기판력도 없으므로 이에 대하여 면소판결을 할 것이 아니라 공소제기의 절차가 법률의 규정에 위배하여 무효인 때에 해당한다(대판 1985.05.28. 85도21).", "answer": "X"}, {"source": "20변시", "question": "형사소송법 제326조에 따라 면소판결이 선고되어야 할 사건(O)과 그렇지 않은 사건(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "丙은 절도죄로 징역 1년의 판결을 선고받아 그 판결이 확정된 이후에 그 선고 전에 저지른 절도범행이 발견되어 상습절도죄로 기소되었다.", "explanation": "(X) 법원은 뒤에 기소된 상습절도죄에 관하여 실체재판을 하여야 한다.\n\n판례) 상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호). 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니 된다(대판 2004.09.16. 2001도3206(전합)).\n\n판례) 상습범이 아닌 단순절도죄로서의 확정판결이 있는 후 그 절도행위 후 그 판결 전에 범한 다른 절도행위를 상습절도죄로 기소함에 있어서 위 판결에서 이미 처단받은 절도행위를 상습성인정의 한 자료로 하고 법원에서도 상습절도죄로 인정된다고 하여 이미 처단받은 절도행위까지를 포함하여 공소된 것이라고 할 수 없는 것이고 따라서 위 확정판결의 기판력이 뒤에 기소되는 상습절도죄에 미칠 수는 없다 할 것이다(대판 1968.11.26. 68도1423).", "answer": "X"}, {"source": "20변시", "question": "형사소송법 제326조에 따라 면소판결이 선고되어야 할 사건(O)과 그렇지 않은 사건(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "丁은 신호위반으로 인한 교통사고를 일으켜 A의 자동차를 손괴하였다는 취지의 도로교통법위반죄로 벌금 50만 원의 약식명령을 받아 그 약식명령이 확정되었다. 그 이후에 丁은 위 교통사고로 A에게 상해를 입게 하였다는 취지의 교통사고처리특례법위반(치상)죄로 공소가 제기되었다.", "explanation": "(O) 법원은 면소판결을 하여야 한다.\n\n판례) 약식명령이 확정된 피고인의 도로교통법 제74조 위반죄와 이 사건으로 공소제기된 죄는 모두 피고인의 동일한 업무상과실로 발생한 수개의 결과로서 형법 제40조 소정의 상상적 경합관계에 있다 할 것이고(당원 1977.09.28. 77도2203), 이미 확정된 약식명령의 효력은 이 사건 공소사실에 미친다 할 것이므로 원심이 같은 이유로 이 사건 공소사실은 확정판결이 있는 때에 해당한다고 판단하여 면소의 판결을 하였음은 정당하다(대판 1986.02.11. 85도2658).", "answer": "O"}, {"source": "20변시", "question": "형사소송법 제326조에 따라 면소판결이 선고되어야 할 사건(O)과 그렇지 않은 사건(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "戊에 대하여 2019. 1. 1.부터 2019. 6. 30.까지 신고 없이 분식점을 운영하였다는 취지의 식품위생법위반죄로 벌금 100 만 원의 약식명령이 2019. 8. 16. 발령되고 2019. 10. 1. 확정되었다. 戊는 2019. 9. 1.부터 2019. 9. 30.까지 같은 장소에서 신고 없이 동일한 분식점을 운영하였다는 취지의 식품위생법위반죄로 공소가 제기되었다.", "explanation": "(X) 법원은 실체판결을 하여야 한다.\n\n판례) 면소판결을 선고할 수 있는 범위는 확정판결의 일사부재리의 효력이 미치는 범위와 동일하다. 구체적으로 주관적 측면에서 면소판결의 대상이 되는 피고인은 검사가 피고인으로 지정하여 확정판결을 받은 사람이어야 하고(법 제248조 제1항 참조), 객관적 측면에서 면소판결의 대상이 되는 범죄사실은 확정판결이 있었던 범죄사실과 동일성이 인정되는 사실이어야 하고(대판 1996.06.28. 95도1270), 시간적 측면에서 사실심리의 가능성이 있는 최후의 시점인 사실심 판결선고시까지 행하여진 범죄사실이어야 한다. 다만 약식명령의 경우에는 발령시점이 사실심리의 가능성이 있는 최후의 시점이므로 송달시가 아니라 발령시를 기준으로한다(대판 1994.08.09. 94도1318).", "answer": "X"}, {"source": "17변시", "question": "면소판결에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소제기된 사건에 적용된 법령이 헌법재판소의 위헌결정으로 효력이 소급하여 상실된 경우는 '범죄후의 법령개폐로 형이 페지되었을 때'에 해당하므로 법원은 면소판결을 선고하여야 한다.", "explanation": "헌법재판소법 제47조 제2항 단서는 형벌에 관한 법률조항에 대하여 위헌결정이 선고된 경우 그 조항이 소급하여 효력을 상실한다고 규정하고 있으므로, 형벌에 관한 법률조항이 소급하여 효력을 상실한 경우에 당해 조항을 적용하여 공소가 제기된 피고사건은 범죄로 되지 아니한 때에 해당하고, 법원은 이에 대하여 형사소송법 제325조 전단에 따라 무죄를 선고하여야 한다(대판 2011.06.23. 2008도7562(전합)).", "answer": "X"}, {"source": "17변시", "question": "면소판결에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인은 면소판결에 대하여 무죄의 실체판결을 구하는 상소를 할 수 없는 것이 원칙이다.", "explanation": "피고인에게는 실체 판결청구권이 없는 것이므로 면소판결에 대하여 무죄의 실체판결을 구하여 상소를 할 수는 없는 것이다(대판 1984.11.27. 84도2106).", "answer": "O"}, {"source": "17변시", "question": "면소판결에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "면소의 재판을 할 것이 명백한 사건에 관하여는 공판기일에 피고인의 출석을 요하지 아니한다.", "explanation": "공소기각 또는 면소의 재판을 할 것이 명백한 사건에 관하여는 피고인의 출석을 요하지 아니하며, 이 경우 피고인은 대리인을 출석하게 할 수 있다(형사소송법 제277조 제2호).", "answer": "O"}, {"source": "17변시", "question": "면소판결에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "면소판결의 사유 중 '사면이 있은 때'란 일반사면이 있은 때를 말한다.", "explanation": "형사소송법 제326조 제2호 소정의 면소판결의 사유인 사면이 있을 때란 일반 사면이 있을 때를 말한다(대판 2000.02.11. 99도2983).", "answer": "O"}, {"source": "17변시", "question": "면소판결에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "A죄와 B죄가 상상적 경합관계에 있는 경우에 A죄에 대한 판결이 확정되었다면 법원은 공소제기된 B죄에 대하여 면소판결을 선고하여야 한다.", "explanation": "형법 제40조 소정의 상상적 경합 관계의 경우에는 그 중 1죄에 대한 확정판결의 기판력은 다른 죄에 대하여도 미치는 것이고, 여기서 1개의 행위라 함은 법적 평가를 떠나 사회 관념상 행위가 사물자연의 상태로서 1개로 평가되는 것을 의미한다(대판 2007.02.23. 2005도10233). 따라서 일죄에 대한 판결이 확정되었다면 다른 일죄에 대해서는 유죄.무죄의 실체재판을 할 것이 아니라 면소판결을 하여야 한다.", "answer": "O"}, {"source": "23변시", "question": "기판력 등에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "헌법 제13조 제1항이 규정하고 있는 이중처벌금지의 원칙 내지 일사부재리의 원칙에서의 ‘처벌’에는 범죄에 대한 국가의 형벌권 실행으로서의 과벌 이외에도 국가가 행하는 일체의 제재나 불이익 처분이 모두 포함된다.", "explanation": "헌법은 제13조 제1항에서 “모든 국민은 ... 동일한 범죄에 대하여 거듭 처벌받지 아니한다\"라고 규정하여 이른바 이중처벌금지의 원칙 내지 일사부재리의 원칙을 선언하고 있다. 이는 한번 판결이 확정되면 그 후 동일한 사건에 대해서는 다시 심판하는 것이 허용되지 않는다는 원칙을 말한다. 여기에서 ‘처벌’이란 원칙적으로 범죄에 대한 국가의 형벌권 실행으로서의 과벌을 의미하고, 국가가 행하는 일체의 제재나 불이익처분이 모두 여기에 포함되는 것은 아니다(대판 2017.08.23. 2016도5423)", "answer": "X"}, {"source": "23변시", "question": "기판력 등에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "상습범으로서 포괄일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로 공소가 제기되었다면 이에 대하여 법원은 면소판결을 선고하여야 하는바, 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 한다.", "explanation": "상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 한다(형사소송법 제326조 제1호). 그런데 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범이 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니된다(대판 2010.05.27. 2010도2182). ▶ 포괄일죄의 일부에 대한 판결 확정의 기판력은 사실심 판결선고 이전의 나머지 행위에 대해서도 미치지만(2006도1252 등), 상습범으로서 포괄일죄의 기판력이 지나치게 확대되는 것을 보완하기 위해 판례는 상습범으로 선고되어 확정판결을 받은 것이 아닌 기본 구성요건의 범죄로 확정판결을 받은 경우에는 나머지 행위에 기판력이 미치지 않는다고 한다(2010도2182 등).", "answer": "O"}, {"source": "23변시", "question": "기판력 등에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심 판결에 대하여 항소가 제기된 경우 판결의 확정력이 미치는 시간적 한계는 항소심 판결선고 시라고 보는 것이 상당하고, 항소이유서를 제출하지 아니하여 결정으로 항소가 기각된 경우에는 항소기각 결정 시가 그 기준 시점이 된다.", "explanation": "판결의 확정력은 사실심리의 가능성이 있는 최후의 시점인 판결선고시를 기준으로 하여 그때까지 행하여진 행위에 대하여만 미치는 것으로서, 제1심 판결에 대하여 항소가 된 경우 판결의 확정력이 미치는 시간적 한계는 현행 형사항소심의 구조와 운용실태에 비추어 볼 때 항소심 판결선고시라고 보는 것이 상당한데 항소이유서를 제출하지 아니하여 결정으로 항소가 기각된 경우에도 형사소송법 제361조의4 제1항에 의하면 피고인이 항소한 때에는 법정기간 내에 항소이유서를 제출하지 아니하였다 하더라도 판결에 영향을 미친 사실오인이 있는 등 직권조사사유가 있으면 항소법원이 직권으로 심판하여 제1심 판결을 파기하고 다시 판결할 수도 있으므로 사실심리의 가능성이 있는 최후시점은 항소기각 결정시라고 보는 것이 옳다(대판 1993.05.25. 93도836)", "answer": "O"}, {"source": "23변시", "question": "기판력 등에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "한 개의 행위가 여러 개의 죄에 해당히는 「형법」 제40조의 상상적 경합 관계에 있는 경우에는 그중 일죄에 대한 확정판결의 기판력은 다른 죄에 미치지 않는다.", "explanation": "상상적 경합은 1개의 행위가 수개의 죄에 해당하는 경우를 말한다(형법 제40조). 여기에서 1개의 행위란 법적 평가를 떠나 사회관념상 행위가 사물자연의 상태로서 1개로 평가되는 것을 의미한다. 그리고 상상적 경합 관계의 경우에는 그중 1죄에 대한 확정판결의 기판력은 다른 죄에 대하여도 미친다(대판 2017.09.21. 2017도11687)", "answer": "X"}, {"source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) [사 례] 甲은 2015. 6. 5. 무전취식 범행을 저질러 2015. 7. 10. 사기죄로 약식명령을 발령받았고 2015. 7. 29. 그 약식명령이 확정되었다. 그런데 이후 甲이 ㉠ 2015. 5. 2., ㉡ 2015. 5. 20., ㉢ 2015. 7. 20., ㉣ 2015. 8. 5. 등 4회에 걸쳐 위와 같은 수법으로 각 무전취식한 사기 사건이 경찰에서 송치되었고 검사는 2015. 8. 20. 이를 상습사기죄로 공소제기하였다. 甲은 법정에서 위 범행 모두를 자백하였으며 보강증거도 충분한 상황이다.", "choice": "법원은 ㉠, ㉡ 공소사실에 대하여 약식명령의 기판력에 저촉된다는 이유로 면소판결을 할 수는 없다.", "explanation": "상습범 아닌 기본 구성요건의 범죄로 처단된 경우에는 상습범의 일부에 대한 확정판결이라고 볼 수 없으므로 그 기판력이 사실심판결 선고 전의 나머지 범죄에 미치지 않는다. 사안에서 甲의 경우 약식명령이 확정된 무전취식 범행은 단순사기죄이므로, 그 기판력이 검사가 기소한 ㉠, ㉡, ㉢, ㉣의 상습사기에 미치지 않으므로 법원은 이에 대하여 실체재판을 하여야 하고, 면소판결을 선고할 수 없다.\n[판례] 상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호), 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니된다(대판 2004.09.16. 2001도3206(전합)).", "answer": "O"}, {"source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) [사 례] 甲은 2015. 6. 5. 무전취식 범행을 저질러 2015. 7. 10. 사기죄로 약식명령을 발령받았고 2015. 7. 29. 그 약식명령이 확정되었다. 그런데 이후 甲이 ㉠ 2015. 5. 2., ㉡ 2015. 5. 20., ㉢ 2015. 7. 20., ㉣ 2015. 8. 5. 등 4회에 걸쳐 위와 같은 수법으로 각 무전취식한 사기 사건이 경찰에서 송치되었고 검사는 2015. 8. 20. 이를 상습사기죄로 공소제기하였다. 甲은 법정에서 위 범행 모두를 자백하였으며 보강증거도 충분한 상황이다.", "choice": "만약 甲에 대한 위 약식명령이 상습사기죄로 발령되어 확정되었다면 법원은 ㉢ 공소사실에 대하여 면소판결을 선고하여야 한다.", "explanation": "면소판결을 선고할 수 있는 범위는 확정판결의 일사부재리의 효력이 미치는 범위와 동일하다. 구체적으로 주관적 측면에서 면소판결의 대상이 되는 피고인은 검사가 피고인으로 지정하여 확정판결을 받은 사람이어야 하고(법 제248조 제1항 참조), 객관적 측면에서 면소판결의 대상이 되는 범죄사실은 확정판결이 있었던 범죄사실과 동일성이 인정되는 사실이어야 하고(대판 1996.06.28. 95도1270), 시간적 측면에서 사실심리의 가능성이 있는 최후의 시점인 사실심 판결선고시까지 행하여진 범죄사실이어야 한다. 다만 약식명령의 경우에는 발령시점이 사실심리의 가능성이 있는 최후의 시점이므로 송달시가 아니라 발령시를 기준으로 한다(대판 1994.08.09. 94도1318). 따라서 비록 상습사기죄의 약식명령이 확정되었더라도 그 발령(2015. 7. 10.) 후인 2015. 7. 20.에 범한 ㉢ 공소사실에 대하여는 실체재판을 하여야 하고, 면소판결을 선고할 수 없다.\n[판례] 여러 개의 업무상 횡령행위라 하더라도 피해법익이 단일하고, 범죄의 태양이 동일하며, 단일 범의의 발현에 기인하는 일련의 행위라고 인정될 때에는, 포괄하여 1개의 범죄라고 봄이 타당하고, 포괄일죄의 관계에 있는 범행의 일부에 대하여 약식명령이 확정된 경우에는 그 약식명령의 발령 시를 기준으로 하여 그 이전에 이루어진 범행에 대하여는 면소의 판결을 선고하여야 한다(대판 2013.06.13. 2013도4737).", "answer": "X"}, {"source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) [사 례] 甲은 2015. 6. 5. 무전취식 범행을 저질러 2015. 7. 10. 사기죄로 약식명령을 발령받았고 2015. 7. 29. 그 약식명령이 확정되었다. 그런데 이후 甲이 ㉠ 2015. 5. 2., ㉡ 2015. 5. 20., ㉢ 2015. 7. 20., ㉣ 2015. 8. 5. 등 4회에 걸쳐 위와 같은 수법으로 각 무전취식한 사기 사건이 경찰에서 송치되었고 검사는 2015. 8. 20. 이를 상습사기죄로 공소제기하였다. 甲은 법정에서 위 범행 모두를 자백하였으며 보강증거도 충분한 상황이다.", "choice": "만약 검사가 甲에 대한 동종의 다른 무전취식 사기 사건을 2015. 8. 21. 송치받았다면 검사는 위 상습사기 사건에 이 부분 공소사실을 추가하는 공소장변경신청을 할 수는 없고, 추가기소만을 하여야 한다.", "explanation": "검사가 이미 기소한 ㉠, ㉡, ㉢, ㉣의 상습사기죄와 송치받은 또 다른 사기 사건은 공소사실의 동일성이 인정되어 포괄하여 일죄의 관계에 있으므로, 검사는 이를 공소장변경의 방식으로 추가할 수 있다.\n형사소송법 제298조(공소장의 변경) ① 검사는 법원의 허가를 얻어 공소장에 기재한 공소사실 또는 적용법조의 추가, 철회 또는 변경을 할 수 있다. 이 경우에 법원은 공소사실의 동일성을 해하지 아니하는 한도에서 허가하여야 한다.", "answer": "X"}, {"source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) [사 례] 甲은 2015. 6. 5. 무전취식 범행을 저질러 2015. 7. 10. 사기죄로 약식명령을 발령받았고 2015. 7. 29. 그 약식명령이 확정되었다. 그런데 이후 甲이 ㉠ 2015. 5. 2., ㉡ 2015. 5. 20., ㉢ 2015. 7. 20., ㉣ 2015. 8. 5. 등 4회에 걸쳐 위와 같은 수법으로 각 무전취식한 사기 사건이 경찰에서 송치되었고 검사는 2015. 8. 20. 이를 상습사기죄로 공소제기하였다. 甲은 법정에서 위 범행 모두를 자백하였으며 보강증거도 충분한 상황이다.", "choice": "검사는 위 공소사실들 중 일부만을 철회하는 내용의 공소장변경신청을 할 수 없고, 이 경우 공소사실 전체에 대한 공소취소로 보아야 한다.", "explanation": "검사가 이미 기소한 ㉠, ㉡, ㉢, ㉣의 상습사기죄는 공소사실의 동일성이 인정되어 포괄하여 일죄의 관계에 있으므로 검사는 그 일부를 철회하는 공소장변경을 할 수 있다(형사소송법 제298조 제1항). 이 경우 철회된 부분을 제외한 나머지는 여전히 법원의 심판대상으로 남아있게 되므로, 이를 공소사실 전체에 대한 공소취소로 볼 수 없다. ▶ 철회란 추가의 경우와 반대로 공소사실 또는 적용법조를 법원의 심판대상에서 제외시키는 것을 의미한다. 철회는 포괄일죄나 과형상 일죄의 관계에 있는 여러 개의 공소사실 가운데 일부를 철회하거나 또는 예비적, 택일적으로 기재된 공소사실에 대하여 이를 철회하는 경우에 행해진다.\n[판례] 공소사실의 동일성이 인정되지 아니하고 실체적 경합관계에 있는 수개의 공소사실의 전부 또는 일부를 철회하는 공소취소의 경우 그에 따라 공소기각의 결정이 확정된 때에는 그 범죄사실에 대하여는 형사소송법 제329조의 규정에 의하여 다른 중요한 증거가 발견되지 않는 한 재기소가 허용되지 아니하지만, 이와 달리 포괄일죄로 기소된 공소사실 중 일부에 대하여 형사소송법 제298조 소정의 공소장변경의 방식으로 이루어지는 공소사실의 일부 철회의 경우에는 그러한 제한이 적용되지 아니한다(대판 2004.09.23. 2004도3203).", "answer": "X"}, {"source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) [사 례] 甲은 2015. 6. 5. 무전취식 범행을 저질러 2015. 7. 10. 사기죄로 약식명령을 발령받았고 2015. 7. 29. 그 약식명령이 확정되었다. 그런데 이후 甲이 ㉠ 2015. 5. 2., ㉡ 2015. 5. 20., ㉢ 2015. 7. 20., ㉣ 2015. 8. 5. 등 4회에 걸쳐 위와 같은 수법으로 각 무전취식한 사기 사건이 경찰에서 송치되었고 검사는 2015. 8. 20. 이를 상습사기죄로 공소제기하였다. 甲은 법정에서 위 범행 모두를 자백하였으며 보강증거도 충분한 상황이다.", "choice": "약식명령이 확정되기 이전의 사기 범행과 그 이후의 사기범행에 대하여 형을 분리하여 선고할 것인지 아니면 하나의 형만을 선고할 것인지 여부는 법원의 재량이다.", "explanation": "약식명령이 확정된 무전취식 범행은 단순사기죄이므로, 그 기판력이 검사가 기소한 ㉠, ㉡, ㉢, ㉣의 상습사기에 미치지 않으므로 법원은 이에 대하여 하나의 형을 선고하여야 하며, 형을 분리하여 선고하여서는 아니된다.\n[판례] 상습사기의 범행이 단순사기죄의 확정판결의 전후에 걸쳐서 행하여진 경우에는 그 죄는 두 죄로 분리되지 않고 확정판결 후인 최종의 범죄행위 시에 완성되는 것이다(대판 2010.07.08. 2010도1939).", "answer": "X"}, {"source": "12변시", "question": "다음 <사례>에서 X사건과 Y사건 및 Z사건이 甲의 동일한 사기 습벽의 발현에 의하여 저질러진 것이라고 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함) [사 례] ⓐ 甲은 춘천지방법원에 단순사기의 범죄사실(X사건, 범행일 2009. 6. 20.)로 기소되어 2009. 8. 11. 징역 8월 및 집행유예 2년의 형을 선고받아 같은 달 18일 판결이 확정되었다. ⓑ 甲은 다시 대전지방법원에서 A로부터 7회에 걸쳐 재물을 편취하였다는 상습사기의 범죄사실(Y사건, 범행일 2009. 1. 1.부터 2009. 6. 14.까지)로 재판을 받고 있던 중, 춘천지방검찰청 검사가 甲의 B에 대한 사기의 범죄사실(Z사건, 범행일 2010. 3. 2.)을 추가로 확인하였다.", "choice": "X사건에 대한 위 판결의 기판력은 Z사건에 미치지 아니한다.", "explanation": "단순사기죄로 기소된 X사건의 확정판결 전후에 걸쳐서 행하여진 동일한 사기습벽의 발현에 의한 Y와 Z사건은 두 죄로 분리되지 않고 포괄일죄에 해당하게 된다. X사건에 대한 판결의 기판력은 Y와 Z사건에 미치지 않으며, 대전지방법원은 Y사건에 대하여 유·무죄의 실체재판을 하여야 한다.\n[판례] 상습사기의 범행이 단순사기죄의 확정판결의 전후에 걸쳐서 행하여진 경우에는 그 죄는 두 죄로 분리되지 않고 확정판결 후인 최종의 범죄행위 시에 완성되는 것이다(대판 2010.07.08. 2010도1939).", "answer": "O"}, {"source": "12변시", "question": "다음 <사례>에서 X사건과 Y사건 및 Z사건이 甲의 동일한 사기 습벽의 발현에 의하여 저질러진 것이라고 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함) [사 례] ⓐ 甲은 춘천지방법원에 단순사기의 범죄사실(X사건, 범행일 2009. 6. 20.)로 기소되어 2009. 8. 11. 징역 8월 및 집행유예 2년의 형을 선고받아 같은 달 18일 판결이 확정되었다. ⓑ 甲은 다시 대전지방법원에서 A로부터 7회에 걸쳐 재물을 편취하였다는 상습사기의 범죄사실(Y사건, 범행일 2009. 1. 1.부터 2009. 6. 14.까지)로 재판을 받고 있던 중, 춘천지방검찰청 검사가 甲의 B에 대한 사기의 범죄사실(Z사건, 범행일 2010. 3. 2.)을 추가로 확인하였다.", "choice": "대전지방법원은 Y사건에 대하여 면소판결을 선고하여야 한다.", "explanation": "단순사기죄로 기소된 X사건의 확정판결 전후에 걸쳐서 행하여진 동일한 사기습벽의 발현에 의한 Y와 Z사건은 두 죄로 분리되지 않고 포괄일죄에 해당하게 된다. X사건에 대한 판결의 기판력은 Y와 Z사건에 미치지 않으며, 대전지방법원은 Y사건에 대하여 유·무죄의 실체재판을 하여야 한다.\n[판례] 상습사기의 범행이 단순사기죄의 확정판결의 전후에 걸쳐서 행하여진 경우에는 그 죄는 두 죄로 분리되지 않고 확정판결 후인 최종의 범죄행위 시에 완성되는 것이다(대판 2010.07.08. 2010도1939).", "answer": "X"}, {"source": "12변시", "question": "다음 <사례>에서 X사건과 Y사건 및 Z사건이 甲의 동일한 사기 습벽의 발현에 의하여 저질러진 것이라고 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함) [사 례] ⓐ 甲은 춘천지방법원에 단순사기의 범죄사실(X사건, 범행일 2009. 6. 20.)로 기소되어 2009. 8. 11. 징역 8월 및 집행유예 2년의 형을 선고받아 같은 달 18일 판결이 확정되었다. ⓑ 甲은 다시 대전지방법원에서 A로부터 7회에 걸쳐 재물을 편취하였다는 상습사기의 범죄사실(Y사건, 범행일 2009. 1. 1.부터 2009. 6. 14.까지)로 재판을 받고 있던 중, 춘천지방검찰청 검사가 甲의 B에 대한 사기의 범죄사실(Z사건, 범행일 2010. 3. 2.)을 추가로 확인하였다.", "choice": "검사는 Y사건의 공판심리 중 공소장변경절차를 통하여 Z사건의 범죄사실을 Y사건의 공소사실에 추가할 수 있다.", "explanation": "상습범에 있어서 공소제기의 효력은 공소가 제기된 범죄사실과 동일성이 인정되는 범죄사실의 전체에 미치는 것이므로 상습범의 범죄사실에 대한 공판심리중에 그 범죄사실과 동일한 습벽의 발현에 의한 것으로 인정되는 범죄사실이 추가로 발견된 경우에는 검사는 공소장변경절차에 의하여 그 범죄사실을 공소사실로 추가할 수 있다고 할 것이다(대판 2000.03.10. 99도2744).", "answer": "O"}, {"source": "12변시", "question": "다음 <사례>에서 X사건과 Y사건 및 Z사건이 甲의 동일한 사기 습벽의 발현에 의하여 저질러진 것이라고 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함) [사 례] ⓐ 甲은 춘천지방법원에 단순사기의 범죄사실(X사건, 범행일 2009. 6. 20.)로 기소되어 2009. 8. 11. 징역 8월 및 집행유예 2년의 형을 선고받아 같은 달 18일 판결이 확정되었다. ⓑ 甲은 다시 대전지방법원에서 A로부터 7회에 걸쳐 재물을 편취하였다는 상습사기의 범죄사실(Y사건, 범행일 2009. 1. 1.부터 2009. 6. 14.까지)로 재판을 받고 있던 중, 춘천지방검찰청 검사가 甲의 B에 대한 사기의 범죄사실(Z사건, 범행일 2010. 3. 2.)을 추가로 확인하였다.", "choice": "Y사건의 판결이 2010. 7. 1. 선고되어 같은 달 8일 확정된 후에 검사가 Z사건에 대하여 공소를 제기하면 법원은 면소판결을 선고하여야 한다.", "explanation": "Y와 Z사건은 포괄일죄의 관계에 있으며, Y사건은 상습범으로 기소되었으므로, Y사건에 대한 확정판결의 사실심판결 선고 전에 저질러진 Z사건에 대하여 위 확정판결 후 새로이 공소가 제기된 경우에 법원은 면소판결을 선고하여야 한다(형사소송법 제326조 제1호).\n[판례] 상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호), 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니된다(대판 2004.09.16. 2001도3206(전합)).", "answer": "O"}, {"source": "12변시", "question": "다음 <사례>에서 X사건과 Y사건 및 Z사건이 甲의 동일한 사기 습벽의 발현에 의하여 저질러진 것이라고 할 때, 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함) [사 례] ⓐ 甲은 춘천지방법원에 단순사기의 범죄사실(X사건, 범행일 2009. 6. 20.)로 기소되어 2009. 8. 11. 징역 8월 및 집행유예 2년의 형을 선고받아 같은 달 18일 판결이 확정되었다. ⓑ 甲은 다시 대전지방법원에서 A로부터 7회에 걸쳐 재물을 편취하였다는 상습사기의 범죄사실(Y사건, 범행일 2009. 1. 1.부터 2009. 6. 14.까지)로 재판을 받고 있던 중, 춘천지방검찰청 검사가 甲의 B에 대한 사기의 범죄사실(Z사건, 범행일 2010. 3. 2.)을 추가로 확인하였다.", "choice": "Y사건의 소송 계속 중 검사가 춘천지방법원에 Z사건을 단순사기죄로 기소하였다면 춘천지방법원은 Z사건에 대하여 공소기각의 결정을 하여야 한다.", "explanation": "먼저 공소를 받은 대전지방법원이 심판을 하게 되므로(형사소송법 제13조), 뒤에 공소를 받은 춘천지방법원은 형사소송법 제328조 제1항 제3호에 따라서 Z사건에 대하여 공소기각결정을 하여야 한다.\n형사소송법 제13조(관할의 경합) 동일사건이 사물관할을 같이하는 수개의 법원에 계속된 때에는 먼저 공소를 받은 법원이 심판한다. 단, 각 법원에 공통되는 직근 상급법원은 검사 또는 피고인의 신청에 의하여 결정으로 뒤에 공소를 받은 법원으로 하여금 심판하게 할 수 있다.\n형사소송법 제328조(공소기각의 결정) ① 다음 경우에는 결정으로 공소를 기각하여야 한다. 3. 제12조 또는 제13조의 규정에 의하여 재판할 수 없는 때", "answer": "O"}, {"source": "14변시", "question": "재판의 효력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "공소기각과 관할위반의 형식재판에 대하여는 일사부재리의 효력이 인정되지 아니한다.", "explanation": "유죄·무죄의 실체재판에 일사부재리의 효력이 인정된다는 점에서 이론이 없다. 한편 공소기각과 관할위반의 형식재판에 대하여는 일사부재리의 효력을 인정할 여지가 없다.", "answer": "O"}, {"source": "14변시", "question": "재판의 효력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "상습범의 일부에 대하여 유죄판결이 확정된 경우 기판력이 그 사실심판결 선고 전에 저질러진 나머지 범죄에 미치기 위해서는 그 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것이 필요하고, 상습범이 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는 기판력이 미치지 아니한다.", "explanation": "상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호), 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니 된다(대판 2004.09.16. 2001도3206(전합)).", "answer": "O"}, {"source": "14변시", "question": "재판의 효력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 수회의 공갈행위로 「폭력행위 등 처벌에 관한 법률」 제2조 제1항 제3호, 형법 350조(상습공갈)가 적용되어 상습범으로 유죄 판결이 확정된 경우 그 사실심판결 선고 전에 저질러진 재물손괴 범죄에 대하여는 동일한 폭력행위의 습벽이 인정되더라도 그 확정판결의 기판력이 미치지 아니한다.", "explanation": "폭력행위 등 처벌에 관한 법률(이하 ‘폭처법’이라 한다) 제2조 제1항에서 말하는 상습이란 같은 항 각 호에 열거된 각 범죄행위 상호 간의 상습성만을 의미하는 것이 아니라 같은 항 각 호에 열거된 모든 범죄행위를 포괄한 폭력행위의 습벽을 의미하는 것이다. 따라서 위와 같은 습벽을 가진 자가 폭처법 제2조 제1항 각 호에 열거된 형법 각 조에서 정하는 다른 수종의 죄를 범하였다면 그 각 행위는 그 각 호 중 가장 중한 법정형의 상습폭력범죄의 포괄일죄에 해당한다(대판 2012.08.17. 2012도6815). ▶ 2016. 1. 6. 폭력행위 등 처벌에 관한 법률이 일부 개정되어 제2조 제1항, 제3조 제1항은 삭제되었다.", "answer": "X"}, {"source": "14변시", "question": "재판의 효력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "일사부재리의 효력이 미치는 객관적 범위는 공소사실과 단일하고 동일한 관계에 있는 모든 사실에 미치므로, 그 물적 범위는 현실적 심판대상인 사실에 한정되지 아니한다.", "explanation": "일사부재리의 효력이 미치는 객관적 범위는 법원의 현실적 심판의 대상인 당해 공소사실은 물론 그 공소사실과 단일하고 동일한 관계에 있는 사실의 전부에 미친다고 하는 것이 다수설의 태도이다(이재상, 형사소송법 제9판 p.709).", "answer": "O"}, {"source": "14변시", "question": "재판의 효력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "약식명령의 기판력이 미치는 시간적 범위는 약식명령의 송달시가 아닌 발령시를 기준으로 한다.", "explanation": "유죄의 확정판결의 기판력의 시적범위 즉 어느 때까지의 범죄사실에 관하여 기판력이 미치느냐의 기준점은 사실심리의 가능성이 있는 최후의 시점인 판결선고시를 기준으로 하여 가리게 되고, 판결절차 아닌 약식명령은 그 고지를 검사와 피고인에 대한 재판서 송달로써 하고 따로 선고하지 않으므로 약식명령에 관하여는 그 기판력의 시적범위를 약식명령의 송달시를 기준으로 할 것인가 또는 그 발령시를 기준으로 할 것인지 이론의 여지가 있으나 그 기판력의 시적 범위를 판결절차와 달리 하여야 할 이유가 없으므로 그 발령시를 기준으로 하여야 한다(대판 1984.07.24. 84도1129).", "answer": "O"}],
  burok: [{"year": "2026", "num": "2", "source": "26변시", "question": "甲은 지하철역 계단을 올라가는 A의 치마 속을 동영상 촬영하기 위하여 A의 치마 밑으로 자신의 휴대전화를 들이밀었으나, 이를 발견한 A가 소리를 지르는 바람에 촬영버튼을 누르지는 못하고 도망갔다. 계속해서 甲은 지하철역 계단을 올라가는 B의 치마 속을 자신의 휴대전화 카메라로 몰래 동영상 촬영하다가 잠복근무 중인 사법경찰관 P에게 발각되어 저장버튼을 누르지 못한 채 (ㄱ) 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)죄의 현행범인으로 체포되었다. 甲은 체포 당시 위 휴대전화를 임의제출하였고, P는 압수조서 중 (ㄴ) ‘압수경위’란에 “甲이 지하철역 계단에서 B의 치마 속을 몰래 촬영하는 모습을 목격하였다.”라는 내용을 기재하였다. 이 사례에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. (ㄴ)은 甲이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것이므로 「형사소송법」 제313조 제1항에 의하여 증거능력을 인정할 수 있다.", "explanation": "[1] 피고인이 지하철역 에스컬레이터에서 휴대전화기의 카메라를 이용하여 성명불상 여성 피해자의 치마 속을 몰래 촬영하다가 현행범으로 체포되어 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)으로 기소된 사안에서, 체포 당시 임의제출 방식으로 압수된 피고인 소유 휴대전화기에 대한 압수조서 중 ‘압수경위’란에 기재된 내용은 피고인이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것으로서 형사소송법 제312조 제5항에서 정한 ‘피고인이 아닌 자가 수사과정에서 작성한 진술서’에 준하는 것으로 볼 수 있고(ㄹ), 이에 따라 휴대전화기에 대한 임의제출절차가 적법하였는지에 영향을 받지 않는 별개의 독립적인 증거에 해당한다(ㅁ)고 한 사례.\n[2] 범죄를 실행 중이거나 실행 직후의 현행범인은 누구든지 영장 없이 체포할 수 있고(형사소송법 제212조), 검사 또는 사법경찰관은 피의자 등이 유류한 물건이나 소유자·소지자 또는 보관자가 임의로 제출한 물건은 영장 없이 압수할 수 있으므로(제218조), 현행범 체포현장이나 범죄 현장에서 소지자 등이 임의로 제출하는 물건은 형사소송법 제218조에 의하여 영장 없이 압수하는 것이 허용되고, 이 경우 검사나 사법경찰관은 별도로 사후에 영장을 받을 필요가 없다(ㄷ)(대판 2019.11.14. 2019도13290).", "answer": "X"}, {"year": "2026", "num": "2", "source": "26변시", "question": "甲은 지하철역 계단을 올라가는 A의 치마 속을 동영상 촬영하기 위하여 A의 치마 밑으로 자신의 휴대전화를 들이밀었으나, 이를 발견한 A가 소리를 지르는 바람에 촬영버튼을 누르지는 못하고 도망갔다. 계속해서 甲은 지하철역 계단을 올라가는 B의 치마 속을 자신의 휴대전화 카메라로 몰래 동영상 촬영하다가 잠복근무 중인 사법경찰관 P에게 발각되어 저장버튼을 누르지 못한 채 (ㄱ) 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영)죄의 현행범인으로 체포되었다. 甲은 체포 당시 위 휴대전화를 임의제출하였고, P는 압수조서 중 (ㄴ) ‘압수경위’란에 “甲이 지하철역 계단에서 B의 치마 속을 몰래 촬영하는 모습을 목격하였다.”라는 내용을 기재하였다. 이 사례에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 甲의 휴대전화에 대한 압수 절차가 위법하다고 하더라도 (ㄴ)은 압수 절차의 적법 여부에 영향을 받지 않는 별개의 독립적인 증거로 볼 수 있다.", "explanation": "[1] 피고인이 지하철역 에스컬레이터에서 휴대전화기의 카메라를 이용하여 성명불상 여성 피해자의 치마 속을 몰래 촬영하다가 현행범으로 체포되어 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)으로 기소된 사안에서, 체포 당시 임의제출 방식으로 압수된 피고인 소유 휴대전화기에 대한 압수조서 중 ‘압수경위’란에 기재된 내용은 피고인이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것으로서 형사소송법 제312조 제5항에서 정한 ‘피고인이 아닌 자가 수사과정에서 작성한 진술서’에 준하는 것으로 볼 수 있고(ㄹ), 이에 따라 휴대전화기에 대한 임의제출절차가 적법하였는지에 영향을 받지 않는 별개의 독립적인 증거에 해당한다(ㅁ)고 한 사례.\n[2] 범죄를 실행 중이거나 실행 직후의 현행범인은 누구든지 영장 없이 체포할 수 있고(형사소송법 제212조), 검사 또는 사법경찰관은 피의자 등이 유류한 물건이나 소유자·소지자 또는 보관자가 임의로 제출한 물건은 영장 없이 압수할 수 있으므로(제218조), 현행범 체포현장이나 범죄 현장에서 소지자 등이 임의로 제출하는 물건은 형사소송법 제218조에 의하여 영장 없이 압수하는 것이 허용되고, 이 경우 검사나 사법경찰관은 별도로 사후에 영장을 받을 필요가 없다(ㄷ)(대판 2019.11.14. 2019도13290).", "answer": "O"}, {"year": "2026", "num": "3", "source": "26변시", "question": "X회사의 대표이사 甲은 급전이 필요하여 乙로부터 2,000만 원을 차용하였고(a사실), 이후 변제일에 회사 자금 3,000만 원을 임의로 인출하여 그중 2,000만 원을 乙에 대한 자신의 채무변제에 사용하였다(b사실). 甲은 이 사실을 알게 된 경리직원 丙에게 비밀 유지를 부탁하면서 그 대가로 위 3,000만 원 중 나머지 1,000만 원을 교부하였다(c사실). 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 甲이 b사실로 인해 약식명령으로 벌금형을 고지받았는데 이에 불복하여 정식재판을 청구하였음에도 법원이 약식명령 청구 당시 검사가 제출한 증거서류와 증거물을 검사에게 반환하지 않고 그대로 보관하였다면, 그 이전에 이미 적법하게 제기된 공소제기의 절차가 위법하게 된다고 할 수 없다.", "explanation": "검사가 약식명령을 청구하는 때에는 약식명령의 청구와 동시에 약식명령을 하는 데 필요한 증거서류 및 증거물을 법원에 제출하여야 하나(형사소송규칙 제170조), 이는 약식절차가 서면심리에 의한 재판이어서 공소장일본주의의 예외를 인정한 것이므로 약식명령의 청구와 동시에 증거서류 및 증거물이 법원에 제출되었다 하여 공소장일본주의를 위반하였다 할 수 없고, 그 후 약식명령에 대한 정식재판청구가 제기되었음에도 법원이 증거서류 및 증거물을 검사에게 반환하지 않고 보관하고 있다고 하여 그 이전에 이미 적법하게 제기된 공소제기의 절차가 위법하게 된다고 할 수도 없다(대판 2007.07.26. 2007도3906).", "answer": "O"}, {"year": "2026", "num": "3", "source": "26변시", "question": "X회사의 대표이사 甲은 급전이 필요하여 乙로부터 2,000만 원을 차용하였고(a사실), 이후 변제일에 회사 자금 3,000만 원을 임의로 인출하여 그중 2,000만 원을 乙에 대한 자신의 채무변제에 사용하였다(b사실). 甲은 이 사실을 알게 된 경리직원 丙에게 비밀 유지를 부탁하면서 그 대가로 위 3,000만 원 중 나머지 1,000만 원을 교부하였다(c사실). 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 甲이 b사실로 인해 약식명령으로 벌금형을 고지받아 확정되었으나, 이후 법원이 c사실을 근거로 하여 甲에게 배임증재죄의 성립을 인정한다면 일사부재리 원칙에 위반된다.", "explanation": "회사의 대표이사가 회사 자금을 빼돌려 횡령한 다음 그 중 일부를 배임증재에 공여한 사안에서, 위 횡령의 범행과 배임증재의 범행은 서로 별개의 행위라고 보아 횡령의 점에 대해 확정된 약식명령의 기판력이 배임증재의 점에는 미치지 않는다고 본 원심판결을 수긍한 사례(대판 2010.05.13. 2009도13463).\n⇒ (b)사실(업무상횡령)과 (c)사실(배임증재)은 별개의 범죄사실이며, 공소사실의 동일성이 인정되지 않기 때문에 甲이 (b)사실로 인해 약식명령으로 벌금형을 고지받아 확정되었다면, 이후 법원이 (c)사실을 근거로 하여 甲에게 배임증재죄의 성립을 인정하더라도 일사부재리 원칙(기판력)에 위반되지 않는다.\n▶ 기판력과 일사부재리의 효력의 개념에 대한 구별설이나 포함설의 견해도 있으나, 다수설은 동일설이며, 판례는 ‘확정판결의 기판력이나 일사부재리의 원칙에 관한 법리’라고 하는 등 이를 혼용하고 있다(이창현, 형사소송법 제9판(2023), 다독, p.1144-1145; 대판 2017.01.25. 2016도15526 참조).", "answer": "X"}, {"year": "2026", "num": "4", "source": "26변시", "question": "A회사 이사 甲은 B신문사 기자 乙에게 A회사의 기술적 탁월성을 담은 자료를 이메일로 건네면서 이를 기사로 게재해 주면 B신문사에 광고비를 주겠다고 제안하였다. 乙이 甲에게 제공받은 자료 내용대로 홍보성 기사를 게재하자 甲은 B신문사에 광고비를 지급하였다. 사법경찰관 P는 ‘압수할 물건’에 “정보처리장치(컴퓨터, 노트북, 태블릿 등) 및 정보저장매체(USB, 외장하드 등)에 저장되어 있는 전자정보”로 기재된 압수·수색영장으로 甲의 휴대전화와 원격지 서버에 저장된 이메일을 압수하였다. 이 사례에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 만약 甲이 배임증재죄, 乙이 배임수재죄로 기소되어 함께 재판을 받게 된 경우, 검사가 작성한 甲에 대한 피의자신문조서에 대하여 乙이 ‘피의자신문조서에 기재된 甲의 진술은 실제 사실과 다르다.’라는 취지로 증거의견을 밝힌다면 검사가 작성한 甲에 대한 피의자신문조서는 乙에 대하여 증거능력이 인정되지 않는다.", "explanation": "2020. 2. 4. 법률 제16924호로 개정되어 2022. 1. 1.부터 시행된 형사소송법 제312조 제1항은 검사가 작성한 피의자신문조서의 증거능력에 대하여 “적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다.”라고 규정하였다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. 그리고 형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2024.08.29. 2024도8200). ⇒ 대향범(공범) 관계에서 甲에 대한 검사 작성 피의자신문조서를 상대방 피고인 乙에 대한 유죄의 증거로 하기 위해서는, 乙이 ‘내용 인정(=진술이 실제 사실과 부합)’을 해야 하는데, 사안에서 乙이 “피의자신문조서에 기재된 甲의 진술이 실제 사실과 다르다” 취지로 증거의견을 밝혔으므로 증거능력이 부정된다.", "answer": "O"}, {"year": "2026", "num": "5", "source": "26변시", "question": "甲은 2025. 3. 3. 아래와 같이 업무방해죄 및 야간건조물침입절도죄로 기소되었다. 제1심법원은 심리 결과 범죄사실을 모두 인정하여 2025. 7. 1. 판결을 선고하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)\n<범죄전력>\n피고인(甲)은 2024. 2. 14. 서울북부지방법원에서 공무집행방해죄로 징역 6개월, 집행유예 1년을 선고받아 2024. 2. 22. 그 판결이 확정되었다.\n<범죄사실>\n1. 피고인은 2024. 1. 10. 21:55경 서울 도봉구(이하 생략)에 있는 A가 운영하는 ○○모텔 로비에서, A에게 ‘외상이 가능하냐’면서 소리를 지르며 그곳에 있던 손님들 및 A에게 욕설을 하고 엘리베이터를 발로 차는 등 약 15분간 소란을 피워 위력으로써 A의 모텔 운영 업무를 방해하였다.\n2. 피고인은 2024. 12. 16. 23:47경 서울 서초구(이하 생략)에 있는 B 운영의 △△카페 앞에 도착해 비상출입문을 통해 카페 내부로 침입한 다음, 매장 안쪽의 금고를 보고 그것을 열어 그 안에 들어 있던 B 소유의 현금 190만 원을 몰래 가져가 절취하였다.", "choice": "ㄱ. 제1심판결 선고일에 甲의 전과인 공무집행방해죄에 대한 집행유예 선고가 실효 또는 취소됨이 없이 유예기간을 경과함으로써 형의 선고가 이미 효력을 잃었다면, 위 공무집행방해죄는 「형법」 제37조 후단에서 정한 ‘판결이 확정된 죄’에 해당하지 않으므로, 제1심법원은 甲의 전과인 공무집행방해죄의 확정판결 전·후에 범한 위 범죄사실 1과 2에 대하여 「형법」 제37조 전단의 경합범 관계에 있다고 보아 하나의 형을 선고하여야 한다.", "explanation": "ㄱ. (X) 사안에서 공무집행방해죄 확정판결(2024. 2. 22.)이 범죄사실 1(2024. 1. 10.)과 범죄사실 2(2024. 12. 16.)의 사이에 존재한다. 즉, 범죄사실 1과 범죄사실 2는 경합범 관계에 있지 않으므로, ㄱ.선지의 후단은 타당하지 않다(아래 2025도470 참조). 한편, 공무집행방해죄의 집행유예의 형의 선고가 집행종료 또는 실효되었는지 여부와는 무관하게, 공무집행방해죄와 범죄사실1은 형법 제37조 후단의 경합범 관계에 있으므로, ㄱ.선지의 전단 역시 타당하지 않다(아래 2018도14863 참조).\n형법 제37조(경합범) 판결이 확정되지 아니한 수개의 죄 또는 금고 이상의 형에 처한 판결이 확정된 죄와 그 판결확정전에 범한 죄를 경합범으로 한다.\n판례: [가] 형법 제37조 후단의 경합범에서 ‘판결이 확정된 죄’라 함은 수개의 독립한 죄 중에서 확정판결이 있다는 사실 자체가 있었던 어느 죄를 의미하고, 그 확정판결이 있는 죄의 형 집행을 종료하였는지 여부 또는 형의 집행유예가 실효되었는지 여부는 묻지 않는다고 해석되므로, 집행유예를 선고한 확정판결에 의한 형의 선고가 형법 제65조에 따라 그 효력을 잃었다 하더라도 확정판결을 받은 죄의 존재가 이에 의하여 소멸되지 않는 이상 형법 제37조 후단에서 정한 ‘판결이 확정된 죄’에 해당한다고 보아야 한다. [나] 원심판결 이유와 기록에 의하면 다음과 같은 사실을 알 수 있다. 1) 피고인 1은 2023. 2. 14. 수원지방법원 안산지원에서 「마약류 관리에 관한 법률 위반(향정)」죄로 징역 6개월, 집행유예 1년을 선고받아 2023. 2. 22. 위 판결이 확정되었다(이하 ‘이 사건 전과’라 한다). 2) 피고인 1에 대한 이 사건 각 죄 중 2023. 1. 3. 필로폰 매수 및 2023. 1. 3. 20:00경부터 2023. 1. 4. 09:00경 사이의 필로폰 투약으로 인한 각 「마약류 관리에 관한 법률 위반(향정)」죄(이하 ‘이 사건 「마약류 관리에 관한 법률 위반(향정)」죄’라 한다)의 범행일시는 이 사건 전과의 판결 확정일 이전임이 역수상 분명하다. [다] 위 법리에 비추어 이 사건을 보면, 이 사건 「마약류 관리에 관한 법률 위반(향정)」죄는 이 사건 전과의 판결이 확정되기 전에 범한 것으로 이 사건 전과와 형법 제37조 후단의 경합범관계에 있고, 피고인 1에 대한 나머지 각 죄는 이 사건 전과의 판결이 확정된 후 범한 것으로 이들은 서로 경합범 관계에 있지 않게 되었다. 따라서 제1심으로서는 형법 제39조 제1항을 적용하여 이 사건 「마약류 관리에 관한 법률 위반(향정)」죄와 피고인 1에 대한 나머지 각 죄에 대하여 2개의 주문으로 형을 선고하여야 한다(대판 2025.05.15. 2025도470)한다.\n판례: 아직 판결을 받지 않은 수 개의 죄가 판결 확정을 전후하여 저질러진 경우 판결 확정 전에 범한 죄를 이미 판결이 확정된 죄와 동시에 판결할 수 없었던 경우라고 하여 마치 확정된 판결이 존재하지 않는 것처럼 그 수 개의 죄 사이에 형법 제37조 전단의 경합범 관계가 성립하여 형법 제38조가 적용된다고 볼 수도 없으므로, 판결 확정을 전후한 각각의 범죄에 대하여 별도로 형을 정하여 선고할 수밖에 없다(대판 2018.11.29. 2018도14863).", "answer": "X"}, {"year": "2026", "num": "5", "source": "26변시", "question": "甲은 2025. 3. 3. 아래와 같이 업무방해죄 및 야간건조물침입절도죄로 기소되었다. 제1심법원은 심리 결과 범죄사실을 모두 인정하여 2025. 7. 1. 판결을 선고하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)\n<범죄전력>\n피고인(甲)은 2024. 2. 14. 서울북부지방법원에서 공무집행방해죄로 징역 6개월, 집행유예 1년을 선고받아 2024. 2. 22. 그 판결이 확정되었다.\n<범죄사실>\n1. 피고인은 2024. 1. 10. 21:55경 서울 도봉구(이하 생략)에 있는 A가 운영하는 ○○모텔 로비에서, A에게 ‘외상이 가능하냐’면서 소리를 지르며 그곳에 있던 손님들 및 A에게 욕설을 하고 엘리베이터를 발로 차는 등 약 15분간 소란을 피워 위력으로써 A의 모텔 운영 업무를 방해하였다.\n2. 피고인은 2024. 12. 16. 23:47경 서울 서초구(이하 생략)에 있는 B 운영의 △△카페 앞에 도착해 비상출입문을 통해 카페 내부로 침입한 다음, 매장 안쪽의 금고를 보고 그것을 열어 그 안에 들어 있던 B 소유의 현금 190만 원을 몰래 가져가 절취하였다.", "choice": "ㄷ. 범죄사실 2에 대하여 수사기관이 甲을 적법하게 현행범체포하면서 건조물침입에 사용한 드라이버를 체포현장에서 영장없이 압수하였는데, 그 후 압수·수색영장을 청구하지 않고 드라이버를 반환하지 않았다면 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 드라이버의 증거능력이 인정되지 않는다.", "explanation": "형사소송법 제216조 제1항 제2호, 제217조 제2항, 제3항은 사법경찰관은 형사소송법 제212조(현행범인의 체포)의 규정에 의하여 피의자를 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압수·수색을 할 수 있고, 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 하며, 청구한 압수수색영장을 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다고 규정하고 있는바, 형사소송법 제217조 제2항, 제3항에 위반하여 압수수색영장을 청구하여 이를 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다(대판 2009.12.24. 2009도11401 참조; 서울서부지법 2022.04.25. 2021노1431).", "answer": "O"}, {"year": "2026", "num": "6", "source": "26변시", "question": "甲은 사업주인 乙주식회사의 사용인으로서 행한 범죄사실로 2022. 12. 16. 불구속 기소되어 제1심 공판 진행 중이며, ㉠검사는 이후 2023. 3. 15. 위 甲의 범죄행위에 관련된 양벌규정에 의거하여 사업주인 乙주식회사를 기소하였다. [乙주식회사에 대한 공소사실의 공소시효는 2018. 3. 9.부터 기산되고, 이 범죄의 공소시효 기간은 5년이다.]\n위 범죄의 발각으로 인하여 퇴사하게 된 甲은 ㉡□□부동산에 취업하기 위하여 컴퓨터를 이용하여 대 "source": "26변시", "question": "공무원 甲은 자신이 직접 뇌물을 받는 것은 위험하다고 생각하여, A와 공모한 다음 자신이 담당하는 인허가 업무의 대상이 되는 X회사의 대표이사 乙에게 'A에게 3,000만 원을 지원하면 인허가에 도움을 주겠다'고 하였다. X회사의 직원 丙은 乙의 지시대로 돈봉투에 든 돈이 뇌물인 것을 알면서 A에게 그 봉투를 전달하였다. A는 甲과의 약속대로 乙로부터 받은 돈 중 1,000만 원은 자신이 갖고 2,000만 원을 甲에게 전달하였다. 한편 丙은 과거 자신이 연루된 폭력사건 피해자의 고소가 경찰청에 접수되자 필리핀으로 도주하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 丙이 폭력사건과 관련하여 형사처분을 면할 목적으로 국외에 체류하고 있는 동안 돈봉투를 A에게 전달한 사건으로 처벌받을 가능성이 있음을 인지하였다고 보기 어려운 경우라도, 丙의 제3자뇌물취득죄의 공소시효는 정지된다.", "explanation": "형사소송법 제253조 제3항은 \"범인이 형사처분을 면할 목적으로 국외에 있는 경우 그 기간 동안 공소시효는 정지된다.\"고 규정하여 공소시효의 정지를 위해서는 '형사처분을 면할 목적'이 있을 것을 요구한다. 형사소송법 제253조 제3항이 정한 '형사처분을 면할 목적'은 국외 체류의 유일한 목적으로 되는 것에 한정되지 않고 범인이 가지는 여러 국외 체류 목적 중에 포함되어 있으면 족하고, 범인이 국외에 있는 것이 형사처분을 면하기 위한 방편이었다면 '형사처분을 면할 목적'이 있었다고 볼 수 있으며, '형사처분을 면할 목적'과 양립할 수 없는 범인의 주관적 의사가 명백히 드러나는 객관적 사정이 존재하지 않는 한 국외 체류기간 동안 '형사처분을 면할 목적'은 계속 유지된다.\n한편 피고인이 당해 사건으로 처벌받을 가능성이 있음을 인지하였다고 보기 어려운 경우라면 피고인이 다른 고소사건과 관련하여 형사처분을 면할 목적으로 국외에 있은 경우라고 하더라도 당해 사건의 형사처분을 면할 목적으로 국외에 있었다고 볼 수 없다(대판 2014.04.24. 2013도9162).", "answer": "X"}, {"year": "2026", "num": "9", "source": "26변시", "question": "공무원 甲은 자신이 직접 뇌물을 받는 것은 위험하다고 생각하여, A와 공모한 다음 자신이 담당하는 인허가 업무의 대상이 되는 X회사의 대표이사 乙에게 'A에게 3,000만 원을 지원하면 인허가에 도움을 주겠다'고 하였다. X회사의 직원 丙은 乙의 지시대로 돈봉투에 든 돈이 뇌물인 것을 알면서 A에게 그 봉투를 전달하였다. A는 甲과의 약속대로 乙로부터 받은 돈 중 1,000만 원은 자신이 갖고 2,000만 원을 甲에게 전달하였다. 한편 丙은 과거 자신이 연루된 폭력사건 피해자의 고소가 경찰청에 접수되자 필리핀으로 도주하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 제1심 재판장이 선고기일에 법정에서 乙에 대하여 \"피고인을 징역 6월에 처한다.\"라고 주문을 낭독한 뒤 상소기간 등에 관한 고지를 하던 중 乙이 욕설을 하면서 난동을 부리자 재판장이 \"이 법정에서 나타난 사정들을 종합하여 선고형을 정정한다. 피고인을 징역 1년에 처한다.\"라고 하였다면, 이는 선고가 최종적으로 마무리되기 전의 변경 선고로서 적법하다.", "explanation": "제1심 재판장이 선고기일에 법정에서 '피고인을 징역 1년에 처한다.'는 주문을 낭독한 뒤 상소기간 등에 관한 고지를 하던 중 피고인이 '재판이 개판이야, 재판이 뭐 이 따위야.' 등의 말과 욕설을 하면서 난동을 부려 교도관이 피고인을 제압하여 구치감으로 끌고 갔는데, 제1심 재판장은 그 과정에서 피고인에게 원래 선고를 듣던 자리로 돌아올 것을 명하였고, 법정경위가 구치감으로 따라 들어가 피고인을 다시 법정으로 데리고 나오자, 제1심 재판장이 피고인에게 '선고가 아직 끝난 가하여 추가된 공소사실에 대하여 심리·판단했어야 하므로, 이러한 조치 없이 검사의 항소를 기각한 원심판결에 법리오해 등의 잘못이 있다고 한 사례(대판 2023.06.15. 2023도3038).", "answer": "O"}, {"year": "2025", "num": "3", "source": "25년 변시", "question": "甲은 A로부터 그 소유의 노트북컴퓨터를 위탁받아 보관하였고, B로부터 그 소유의 태블릿 PC를 위탁받아 보관하던 중 이러한 위탁 사실을 알고 있는 乙에게 일괄 매각하여 도박 자금을 마련하였다. 甲은 위 매각 대금 전액을 같은 날 도박으로 탕진하였다. 검사는 甲을 횡령죄 및 도박죄로 기소하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법원이 공소장변경허가신청서 부본을 甲에게 송달하였음에도 공판조서에 법원이 그 허가 여부를 결정한 절차가 기재되지 않은 경우, 공소장변경허가신청을 간과하여 그 허가 여부를 결정하지 않은 것으로 당연히 추정되는 것은 아니고 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있으나, 이는 엄격한 증명의 대상이 된다. ", "explanation": "공판기일의 소송절차로서 판결 기타의 재판을 선고 또는 고지한 사실은 공판조서에 기재되어야 하는데(형사소송법 제51조 제1항, 제2항 제14호), 공판조서의 기재가 명백한 오기인 경우를 제외하고는, 공판기일의 소송절차로서 공판조서에 기재된 것은 조서만으로써 증명하여야 하고 그 증명력은 공판조서 이외의 자료에 의한 반증이 허용되지 않는 절대적인 것이다. 반면에 어떤 소송절차가 진행된 내용이 공판조서에 기재되지 않았다고 하여 당연히 그 소송절차가 당해 공판기일에 행하여지지 않은 것으로 추정되는 것은 아니고 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있고, 이는 소송법적 사실이므로 자유로운 증명의 대상이 된다(대판 2023.06.15. 2023도3038). ▶ 공소장변경허가신청에 관한 소송절차의 존재는 소송법적 사실이므로 자유로운 증명의 대상이 된다.\n", "answer": "X"}, {"year": "2025", "num": "3", "source": "25년 변시", "question": "甲은 A로부터 그 소유의 노트북컴퓨터를 위탁받아 보관하였고, B로부터 그 소유의 태블릿 PC를 위탁받아 보관하던 중 이러한 위탁 사실을 알고 있는 乙에게 일괄 매각하여 도박 자금을 마련하였다. 甲은 위 매각 대금 전액을 같은 날 도박으로 탕진하였다. 검사는 甲을 횡령죄 및 도박죄로 기소하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "횡령 및 도박의 점에 대하여 전부 무죄를 선고한 제1심판결에 관하여 검사의 항소로 계속된 항소심에서 횡령죄 및 도박죄 모두 유죄를 인정하여 하나의 형을 선고하였는데, 甲의 상고로 계속된 상고심에서 원심판결 중 횡령죄 부분을 파기하는 경우에 이와 경합범 관계에 있어 하나의 형이 선고된 도박죄 부분도 함께 파기의 대상이 된다. ", "explanation": "원심판결 중 업무상횡령 부분은 파기되어야 한다. 그런데 이 부분은 유죄로 인정한 나머지 부분(근로기준법위반 등)과 형법 제37조 전단의 경합범 관계에 있어 하나의 형이 선고되었으므로, 결국 원심판결 전부가 파기의 대상이 된다(대판 2023.06.15. 2023도3038). ▶ 경합범 관계에 있어 하나의 형이 선고되었는데 그중 하나를 파기하는 경우, 판례는 원심판결 전부가 파기의 대상이 된다는 입장이다. ", "answer": "O"}, {"year": "2025", "num": "4", "source": "25년 변시", "question": "甲은 백화점에서 A의 지갑을 절취하기 위해 A와 부딪치며 양복 상의 주머니에 손을 넣는 순간 발각되어 도주하다가 곧바로 뒤쫓아 온 보안요원 X에게 붙잡혔다. 甲은 X로부터 그 경위를 확인받던 중 체포된 상태를 벗어나기 위해 X의 얼굴을 주먹으로 수차례 때려 전치 4주의 상해를 입히고 도주하였다. 사건이 발생한 지 1시간이 지난 후 X의 신고를 받고 출동한 사법경찰관 P가 인근 버스 정류장에 서있던 甲에게 임의동행을 요청하자, 甲은 영장의 제시를 요구하면서 동행을 거부하였다. 그럼에도 P가 甲을 순찰차에 강제로 태워 파출소로 연행하려 하자 甲은 이를 벗어날 목적으로 P의 복부를 발로 차 전치 2주의 상해를 입혔다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "甲이 제1회 공판기일에서 공소사실에 대하여 검사가 신문을 할 때 공소사실이 모두 사실과 다름없다고 진술한 경우, 이후 변호인이 신문을 할 때에는 범의나 공소사실을 부인하더라도 그 공소사실은 간이공판절차에 의하여 심판할 수 있다. ", "explanation": "피고인이 공소사실에 대하여 검사가 신문을 할 때에는 공소사실을 모두 사실과 디름없다고 진술하였으나 변호인이 신문을 할 때에는 범의나 공소사실을 부인하였다면 그 공소사실은 간이공판절차에 의하여 심판할 대상이 아니고, 따라서 피고인의 법정에서의 진술을 제외한 나머지 증거들은 간이공판절차가 아닌 일반절차에 의한 적법한 증거조사를 거쳐 그에 관한 증거능력이 부여되지 아니하는 한 그 공소사실에 대한 유죄의 증거로 삼을 수 없다(대판 1998.02.27. 97도3421). ", "answer": "X"}, {"year": "2025", "num": "5", "source": "25변시", "question": "甲은 급하게 돈이 필요하여 그가 소유한 시가 7억 원의 아파트를 丁에게 6억 원에 매도하기로 하고 丁으로부터 계약금과 중도금 합계 1억 5,000만 원을 지급받았다. 그 소식을 들은 乙은 甲에게 “아파트를 너무 싸게 판 것 같은데, 내 친구 丙이 시세에 따라 매수한다고 하니 丙에게 매도를 하라.”고 제안하고 수차례 설득한 끝에 甲은 丙에게 위 아파트를 매도하고 소유권이전등기를 마쳐 주었다. 이에 관한 설명 중 옳은 것은? (위 아파트의 시가는 변동이 없다고 가정할 것, 다툼이 있는 경우 판례에 의함)", "choice": "④ 만약 丙이 甲과 丁 사이의 위 매매계약 사실을 모른 채 위 아파트를 매수하였다면, 사법경찰관 작성의 丙에 대한 진술조서는 甲이 내용을 부인하면 증거능력이 없다", "explanation": "丙이 甲과 丁사이의 매매계약 시실을 모른 채 아파트를 매수한 자에 불과한 경우, 사법경찰관이 작성한 丙에 대한 진술조서는 형사소송법 제312조 제4항의 피고인 아닌 자의 진술을 기재한 조서에 해당한다.  이 경우, 피고인 甲이 내용을 부인하더라도, 형사소송법 제312조 제4항의 요건을 충족하면 증거로 할 수 있다.\n\n형사소송법 제312조(검사 또는 사법경찰관의 조서 등) \n④ 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서는 적법한 절차와 방식에 따라 작성된 것으로서 그 조서가 검사 또는 사법경찰관 앞에서 진술한 내용과 동일하게 기재되어 있음이 원진술자의 공판준비 또는 공판기일에서의 진술이나 영상녹화물 또는 그 밖의 객관적인 방법에 의하여 증명되고, 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 원진  술자를 신문할 수 있었던 때에는 증거로 할 수 있다. 다만, 그 조서에 기재된 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한한다.", "answer": "X"}, {"year": "2025", "num": "6", "source": "25변시", "question": "甲은 친구 乙과 丙에게 연락해 \"은행에서 돈을 출금해 나오는 사람의 가방을 날치기 하자.”고  제안했다. 이에 乙과 丙은 은행 문밖에서 범행대상을 물색하고, 甲은 날치기를 끝낸 乙과 丙을  태우고 도망치기 위해 은행 앞 차도에 승용차를 세워 두고 대기하기로 했다. 며칠 후 A가 은행에서 현금 1천만 원을 출금하여 가방에 담아 나오는 것을 본 乙과 丙은 A의 뒤를 따라가기 시작했다. 甲은 차를 몰고 그 뒤를 따라가던 중 갑자기 처벌이 두려워져 핸들을 꺾어 혼자 말없이  도주해 버렸다. A가 좁은 골목길로 들어서자 乙은 입구에서 망을 보았고, 丙은 A가 손에 든 가방을 그대로 낚아채어 달아났다. 검사는 甲, 乙, 丙을 위 범죄혐의로 기소하였고, 법원은 이들을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 소송절차가 분리된 공범인 공동피고인 乙이 丙에 대한 재판의 증인으로 출석해 증언거부권을 고지받았음에도 불구하고 증언거부권을 행사하지 아니한 채 자신을 방어하기 위해 허위 진술을 하였더라도 위증죄로 처벌받지 않는다.", "explanation": "소송절차가 분리된 상태에서 피고인들이 증언거부권을 고지받았음에도 불구하고 증언거부권을 행사하지 아니한 채 허위의 진술을 하였다면, 자신의 범죄사실에 대하여 증인으로서 신문을 받았더라도 피고인으로서의 진술거부권 내지 자기부죄거부특권 등이 침해되었다고 할 수 없고, 위중죄가 성립한다(대판 2024.02.29. 2023도7528)", "answer": "X"}, {"year": "2025", "num": "6", "source": "25변시", "question": "甲은 친구 乙과 丙에게 연락해 \"은행에서 돈을 출금해 나오는 사람의 가방을 날치기 하자.”고  제안했다. 이에 乙과 丙은 은행 문밖에서 범행대상을 물색하고, 甲은 날치기를 끝낸 乙과 丙을  태우고 도망치기 위해 은행 앞 차도에 승용차를 세워 두고 대기하기로 했다. 며칠 후 A가 은행에서 현금 1천만 원을 출금하여 가방에 담아 나오는 것을 본 乙과 丙은 A의 뒤를 따라가기 시작했다. 甲은 차를 몰고 그 뒤를 따라가던 중 갑자기 처벌이 두려워져 핸들을 꺾어 혼자 말없이  도주해 버렸다. A가 좁은 골목길로 들어서자 乙은 입구에서 망을 보았고, 丙은 A가 손에 든 가방을 그대로 낚아채어 달아났다. 검사는 甲, 乙, 丙을 위 범죄혐의로 기소하였고, 법원은 이들을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 乙을 제외한 나머지 공범이 범행을 일체 부인하고 있고 다른 증거가 없다면, 乙의 자백만으로는 乙에 대하여 유죄를 선고할 수 없다.", "explanation": "피고인의 자백이 그 피고인에게 불이익한 유일의 증거인 때에는 이를 유죄의 증거로 하지 못하는 것이므로(형사소송법 제310조), 보강증거가 없이 피고인의 자백만을 근거로 공소사실을 유죄로 판단한 경우에 는 그 자체로 판결 결과에 영향을 미친 위법이 있는 것으로 보아야 한다.(대판 2007.11.29. 2007도7835)", "answer": "O"}, {"year": "2025", "num": "7", "source": "25변시", "question": "甲과 乙은 서로 공모하지 않은 채 甲이 먼저 상해의 고의로 A의 머리를 수회 때렸고, 이로부터 약 1시간 후 乙은 쓰러져 있는 A에게 다가가 상해의 고의로 A의 머리를 수회 때렸다. A는 위 폭행으로 머리에 전치 4주의 상해를 입었으나, 그 상해가 甲과 乙 중 누구의 폭행으로 인하여 발생한 것인지 판명되지 않았다.(ⓐ범죄사실).甲과 乙은 각각 상해죄로 기소되어 제1심에서 유죄판결을 선고받자 항소하였다. 항소심법원은 적법하게 공판의 심리를 종결하고 판결선고기일을 고지하였는데, 그 직후 A는 머리에 입은 상해가 악화되어 병원에서 사망하였다. 이에 관한  설명 중 옳은 것을 모두 고른 것은?(다툼이 있는 경우 판례에 의함)\n", "choice": "ㄷ. A의 사망 후 검사가 甲과 乙에 대한 공소사실을 각각 상해치사죄로 변경히는 내용의 공소장변경신청을 하면서 그와 함께 변론재개신청을 하더라도, 항소심법원이 종결한  심리를 재개하여 공소장변경을 허가할 의무는 없다.", "explanation": "법원이 공판의 심리를 종결하기 전에 한 공소장의 변경에 대하여는 공소사실의 동일성을 침해하지  \n않는 한도에서 허가해야 한다. 그러나 적법하게 공판의 심리를 종결하고 판결선고기일까지 고지한 후에 이르러서 한 검사의 공소장변경에 대하여는 그것이 변론재개신청과 함께 된 것이더라도 법원이 종결한 심리를 재개하여 공소장변경을 허가할 의무는 없다(대판 2022.07.14. 2022도4624).\n", "answer": "O"}, {"year": "2025", "num": "7", "source": "25변시", "question": "甲과 乙은 서로 공모하지 않은 채 甲이 먼저 상해의 고의로 A의 머리를 수회 때렸고, 이로부터 약 1시간 후 乙은 쓰러져 있는 A에게 다가가 상해의 고의로 A의 머리를 수회 때렸다. A는 위 폭행으로 머리에 전치 4주의 상해를 입었으나, 그 상해가 甲과 乙 중 누구의 폭행으로 인하여 발생한 것인지 판명되지 않았다.(ⓐ범죄사실).甲과 乙은 각각 상해죄로 기소되어 제1심에서 유죄판결을 선고받자 항소하였다. 항소심법원은 적법하게 공판의 심리를 종결하고 판결선고기일을 고지하였는데, 그 직후 A는 머리에 입은 상해가 악화되어 병원에서 사망하였다. 이에 관한  설명 중 옳은 것을 모두 고른 것은?(다툼이 있는 경우 판례에 의함)\n", "choice": "ㄹ. A가 사망한 후 A의 유족이 항소심법원에 “甲과 乙 때문에 A가 사망하였으니 이들을 엄벌에 처해 달라\"는 내용의 의견서에 A의 사망진단서를 첨부하여 양형자료로 제출한 경우, 항소심법원은 변론을 재개하여 피고인들에게 위 자료에 관하여 의견진술 기회를 주는 등의 양형심리 절차를 거치지 않고서는 A의 사망 사실을 피고인들에 대한 형벌가중적 양형조건으로 삼을 수 없다.", "explanation": "사실심 변론종결 후 검사나 피해자 등에 의해 피고인에게 불리한 새로운 양형조건에 관한 자료가 법원에 제출되었다면 사실심 법원으로서는 변론을 재개하여 그 양형자료에 대하여 피고인에게 의견진술 기회를 주는 둥 필요한 양형심리절차를 거침으로써 피고인의 방어권을 실질적으로 보장해야 한다(대판  2021.09.30. 2021도5777).", "answer": "O"}, {"year": "2025", "num": "8", "source": "25변시", "question": "甲은 2018. 8. 6. 상해죄로 징역 9월을 선고받아 2019. 1. 10. 그 형의 집행을 종료하였다  (ⓐ 전과) . 또한 甲은 2022. 4. 4. 절도죄로 징역 1 년에 집행유예 2 년을 선고받아 2022. 4.  12. 위 판결이 확정되었다(ⓑ전과).  \n\n甲은 (ㄱ) 2021. 12. 1. A의 휴대전화 1대를 절취하였고, (ㄴ) 2022. 4. 18. B의 지갑 1개를 절취하였고, (ㄷ) 2022. 5. 10. C의 신용카드 1매를 절취하였다.  \n(ㄱ), (ㄴ), (ㄷ) 범행에 관하여 검사는 2024. 1. 5. 甲을 「형법」 제332조, 제329조에 의하여 상습절도죄로 기소하였다.\n", "choice": "① 상습절도 범행에 관하여 법정형 중 징역형을 선택한 경우, 포괄일죄의 일부 범행이 ⓐ전과의 누범기간 내에 있더라도 나머지 범행이 누범기간 경과 후에 이루어졌기 때문에 상습절도 범행 전부가 누범에 해당하지 않는다.", "explanation": "상습범 중 일부 소위가 누범기간 내에 이루어진 이상 나머지 소위가 누범기간 경과 후에 행하여졌더라도 그 행위 전부가 누범관계에 있는 것이다(대판 1982.05.25. 82도600등).", "answer": "X"}, {"year": "2025", "num": "8", "source": "25변시", "question": "甲은 2018. 8. 6. 상해죄로 징역 9월을 선고받아 2019. 1. 10. 그 형의 집행을 종료하였다  (ⓐ 전과) . 또한 甲은 2022. 4. 4. 절도죄로 징역 1 년에 집행유예 2 년을 선고받아 2022. 4.  12. 위 판결이 확정되었다(ⓑ전과).  \n甲은 (ㄱ) 2021. 12. 1. A의 휴대전화 1대를 절취하였고, (ㄴ) 2022. 4. 18. B의 지갑 1개를 절취하였고, (ㄷ) 2022. 5. 10. C의 신용카드 1매를 절취하였다.  \n(ㄱ), (ㄴ), (ㄷ) 범행에 관하여 검사는 2024. 1. 5. 甲을 「형법」 제332조, 제329조에 의하여 상습절도죄로 기소하였다.\n", "choice": "② ⓑ전과로 확정판결을 받은 범행과 (ㄱ)범행 이 모두 甲의 습벽에서 이루어졌음이 인정되는 경우, 양자는 상습절도죄의 포괄일죄의 관계에 있으므로 (ㄱ) 부분에 대하여 기판력 저촉을 이유로 면소판결이 선고되어야 한다.", "explanation": "상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된  \n경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호), 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니 된다(대판 2004.09.16. 2001도3206(전합))． \n► ⓑ 전과는 단순절도에 해당하므로, 이를 상습절도의 일부에 대한 확정판결로 볼 수 없다. 따라서 (ㄱ) 부분에 대하여 기판력이 미치지 않는다.\n\n[비교판례] 포괄일죄 관계인 범행의 일부에 대하여 판결이 확정된 경우에는 사실심 판결선고 시를 기준으로,  약식명령이 확정된 경우에는 약식명령 발령 시를 기준으로, 그 이전에 이루어진 범행에 대하여는 확정판결의 기판력이 미친다. 또한 상상적 경합범 중 1죄에 대한 확정판결의 기판력은 다른 죄에 대하여도 미친다. 따라서 포괄일죄 관계인 범행의 일부에 대하여 판결이 확정되거나 약식명령이 확정되었는데 그 사실심 판결선고 시 또는 약식명령 발령 시를 기준으로 그 이전에 이루어진 범행이 포괄일죄의 일부에 해당할 뿐만 아니라 그와 상상적 경합관계에 있는 다른 죄에도 해당하는 경우에는 확정된 판결 내지 약식명령의 기판력은 위와 같이 상상적 경합관계에 있는 다른 죄에 대하여도 미친다(대판 2023.06.29. 2020도3705)", "answer": "X"}, {"year": "2025", "num": "8", "source": "25변시", "question": "甲은 2018. 8. 6. 상해죄로 징역 9월을 선고받아 2019. 1. 10. 그 형의 집행을 종료하였다  (ⓐ 전과) . 또한 甲은 2022. 4. 4. 절도죄로 징역 1 년에 집행유예 2 년을 선고받아 2022. 4.  12. 위 판결이 확정되었다(ⓑ전과).  \n甲은 (ㄱ) 2021. 12. 1. A의 휴대전화 1대를 절취하였고, (ㄴ) 2022. 4. 18. B의 지갑 1개를 절취하였고, (ㄷ) 2022. 5. 10. C의 신용카드 1매를 절취하였다.  \n(ㄱ), (ㄴ), (ㄷ) 범행에 관하여 검사는 2024. 1. 5. 甲을 「형법」 제332조, 제329조에 의하여 상습절도죄로 기소하였다.\n", "choice": "③ 법원이 2024. 5. 1. 甲에 대하여 형을 선고하는 경우, 집행유예 결격 기간을 도과하였기 때문에 집행유예를 선고할 수 있다.", "explanation": "금고 이상의 형을 선고한 판결이 확정된 때부터 그 집행을 종료하고 3년까지의 기간에 범한 죄에 대하여 형을 선고하는 경우에는 형의 집행을 유예할 수 없다. 3년의 기간은 형기종료일의 익일부터 기산한다. 사안의 경우, ⓐ전과의  징역 9월의 집행을 종료한 날은 2019. 1. 10. 이므로 그 익일부터 3 년의 기간에 해당하는 2019. 1. 11. 부터 2022. 1. 10. 사이의 범죄에 대해서는 집행유예를 선고할 수 없다. 甲의 (ㄱ) 범죄가 2021. 12. 1.에  있었으므로, 법원은 甲에 대하여 집행유예를 선고할 수 없다고 볼 것이다.\n  \n형법 제62조(집행유예의 요건) ① 3년 이하의 징역이나 금고 또는 500만원 이하의 벌금의 형을 선고할 경우에  제51조의 사항을 참작하여 그 정상에 참작할 만한 사유가 있는 때에는 1년 이상 5년 이하의 기간 형의 집행을  유예할 수 있다. 다만, 금고 이상의 형을 선고한 판결이 확정된 때부터 그 집행을 종료하거나 면제된 후 3년까  지의 기간에 범한 죄에 대하여 형을 선고하는 경우에는 그러하지 아니하다.  \n② 형을 병과할 경우에는 그 형의 일부에 대하여 집행을 유예할 수 있다.\n", "answer": "X"}, {"year": "2025", "num": "8", "source": "25변시", "question": "甲은 2018. 8. 6. 상해죄로 징역 9월을 선고받아 2019. 1. 10. 그 형의 집행을 종료하였다  (ⓐ 전과) . 또한 甲은 2022. 4. 4. 절도죄로 징역 1 년에 집행유예 2 년을 선고받아 2022. 4.  12. 위 판결이 확정되었다(ⓑ전과).  \n甲은 (ㄱ) 2021. 12. 1. A의 휴대전화 1대를 절취하였고, (ㄴ) 2022. 4. 18. B의 지갑 1개를 절취하였고, (ㄷ) 2022. 5. 10. C의 신용카드 1매를 절취하였다.  \n(ㄱ), (ㄴ), (ㄷ) 범행에 관하여 검사는 2024. 1. 5. 甲을 「형법」 제332조, 제329조에 의하여 상습절도죄로 기소하였다.\n", "choice": "④ 검사가 공판절차 진행 중 범죄사실의 증명이 어렵자 (ㄴ)부분의 공소사실을 철회한 경우, 그 범죄사실에 대한 다른 중요한 증거를 발견한 것이 아니더라도 점유이탈물횡령죄로 다시 공소를 제기할수 있다.", "explanation": "공소사실의 동일성이 인정되지 아니하고 실체적 경합관계에 있는 수개의 공소사실의 전부 또는 일부를 철회하는 공소취소의 경우 그에 따라 공소기각의 결정이 확정된 때에는 그 범죄사실에 대하여는 형사소송법 제329조의 규정에 의하여 다른 중요한 증거가 발견되지 않는 한 재기소가 허용되지 아니하지만, 이와 달리 포괄일죄로 기소된 공소사실 중 일부에 대하여 형사소송법 제298조 소정의 공소장변경의 방식으로 이루어지는 공소사실의 일부 철회의 경우에는 그러한 제한이 적용되지 아니한다(대판 2004.09.23.  2004도3203). ►공소취소가 아닌 공소사실의 일부 철회의 경우에는 다른 중요한 증거가 발견되지 않는 한 재기소가 허용되지  않는다는 형사소송법 제329조가 적용되지 않는다. 지문의 경우, 상습범(포괄일죄)의 공소사실을 일부 철회한 것이므로, 검사는 다른 중요한 증거를 발견한 경우가 아니더라도 다시 공소를 제기할 수 있다.\n\n형사소송법 제329조(공소취소와 재기소) 공소취소에 의한 공소기각의 결정이 확정된 때에는 공소취소 후 그 범죄사실에 대한 다른 중요한 증거를 발견한 경우에 한하여 다시 공소를 제기할 수 있다.\n  \n형사소송법 제298조(공소장의 변경) ①검사는 법원의 허가를 얻어 공소장에 기재한 공소사실 또는 적용법조의  추가, 철회 또는 변경을 할 수 있다. 이 경우에 법원은 공소사실의 동일성을 해하지 아니하는 한도에서 허가하여야 한다.\n", "answer": "O"}, {"year": "2024", "num": "1", "source": "24변시", "question": "연예인 甲은 2023. 3. 9. 08:00경 고속도로에서 자동차종합보험에 가입되어 있는 자신의 승용차를 운전하여 가던 중 도로 좌측 노면 턱을 들이받는 바람에 그 충격으로 자신에게 전치 6주의 상해를, 조수석에 타고 있던 사실혼 관계인 乙에게 전치 8주의 상해를 각 입게 하였다. 甲, 乙은 사고 직후 승용차에서 내렸으나 바로 의식을 잃었고, 그 상태로 병원에 이송되었다. 乙은 의식이 깨자 甲의 연예인 활동에 지장이 생길 것을 우려하여 경찰관 P에게 자신이 위 승용차를 운전하다가 교통사고를 발생하게 하였다는 허위 사실을 진술하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "② 乙이 도로교통법위반(음주운전)죄 및 교통사고처리특례법위반(치상)죄로 기소되었고, 제1회 공판기일에 乙 및 乙의 변호인은 혈액감정의뢰회보에 대하여 증거부동의를 하였는데, 제3회 공판기일에 乙이 출석하지 아니한 상태에서 乙의 변호인이 이를 증거로 하는 데 동의하였다면 위 증거동의는 효력이 있다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 주체는 소송 주체인 검사와 피고인이고, 변호인은 피고인을 대리하여 증거동의에 관한 의견을 낼 수 있을 뿐이므로 피고인의 명시한 의사에 반하여 증거로 함에 동의 할 수는 없다. 따라서 피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다 하더라도 이는 특별한 사정이 없는 한 효력이 없다고 보아야 한다(대판 2013.3.28. 2013도3).", "answer": "X"}, {"year": "2024", "num": "1", "source": "24변시", "question": "연예인 甲은 2023. 3. 9. 08:00경 고속도로에서 자동차종합보험에 가입되어 있는 자신의 승용차를 운전하여 가던 중 도로 좌측 노면 턱을 들이받는 바람에 그 충격으로 자신에게 전치 6주의 상해를, 조수석에 타고 있던 사실혼 관계인 乙에게 전치 8주의 상해를 각 입게 하였다. 甲, 乙은 사고 직후 승용차에서 내렸으나 바로 의식을 잃었고, 그 상태로 병원에 이송되었다. 乙은 의식이 깨자 甲의 연예인 활동에 지장이 생길 것을 우려하여 경찰관 P에게 자신이 위 승용차를 운전하다가 교통사고를 발생하게 하였다는 허위 사실을 진술하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "③ 乙이 교통사고처리특례법위반(치상)죄로 유죄확정판결을 받은 이후 甲과 헤어지게 되자, 자신이 숨겨두고 있던 위 교통사고 당시 甲이 운전하는 모습을 찍은 휴대전화 사진을 증거로 제출하면서 재심을 청구한 경우, 「형사소송법」 제420조 제5호의 '무죄를 인정할 명백한 증거가 새로 발견된 때'에 해당한다.", "explanation": "형사소송법 제420조 제5호에 정한 무죄 등을 인정할 '증거가 새로 발견된 때'란 재심대상이 되는 확정판결의 소송절차에서 발견되지 못하였거나 또는 발견되었다 하더라도 제출할 수 없었던 증거를 새로 발견하였거나 비로소 제출할 수 있게 된 때를 말한다. 증거의 신규성을 누구를 기준으로 판단할 것인지에 대하여 위 조항이 그 범위를 제한하고 있지 않으므로 그 대상을 법원으로 한정할 것은 아니다. 그러나 재심은 당해 심급에서 또는 상소를 통한 신중한 사실심리를 거쳐 확정된 사실관계를 재심사하는 예외적인 비상구제절차이므로, 피고인이 판결확정 전 소송절차에서 제출할 수 있었던 증거까지 거기에 포함된다고 보게 되면, 판결의 확정력이 피고인이 선택한 증거제출시기에 따라 손쉽게 부인될 수 있게 되어 형사재판의 법적 안정성을 해치고, 헌법이 대법원을 최종심으로 규정한 취지에 반하여 제4심으로서의 재심을 허용하는 결과를 초래할 수 있다. 따라서 피고인이 재심을 청구한 경우 재심대상이 되는 확정판결의 소송절차 중에 그러한 증거를 제출하지 못한 데 과실이 있는 경우에는 그 증거는 위 조항에서의 '증거가 새로 발견 된 때'에서 제외된다고 해석함이 상당하다(대결 2009.07.16. 2005모472(전합)).", "answer": "X"}, {"year": "2024", "num": "2", "source": "24변시", "question": "甲과 A는 동거하지 않는 형제 사이인데 A가 실종되었다. 甲은 2023. 1.경 법원이 선임한 A의 부재자 재산관리인으로서 A 앞으로 공탁된 수용보상금 7억 원을 수령하였다. 그 후 법원은 2023. 3.경 A의 부재자 재산관리인을 甲에서 B로 개임하였다. 그럼에도 甲은 B에게 공탁금의 존재를 알려 주지도 않고 인계하지도 않았다. 2023. 5.경 위 사실을 알게 된 B가 2023. 6.경 법원으로부터 고소권 행사에 관하여 허가를 받고 나서 바로 甲을 위 사실에 관하여 특정경제범죄가중처벌등에관한법률위반(배임)죄로 수사기관에 고소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄱ. 甲, B, 甲의 누나 C가 모여서 같이 대화를 나누던 중, B는 증거수집 목적으로 자신의 휴대전화 녹음 기능을 사용하여 위 3명의 대화를 녹음하였는데, 이러한 녹음 행위는 「통신비밀보호법」 제16조 제1항에 해당하며 위법하다.", "explanation": "통신비밀보호법 제3조 제1항이 \"공개되지 아니한 타인간의 대화를 녹음 또는 청취하지 못한다\"라고 정한 것은, 대화에 원래부터 참여하지 않는 제3자가 그 대화를 하는 타인들 간의 발언을 녹음해서는 아니된다는 취지이다. 3인 간의 대화에 있어서 그 중 한 사람이 그 대화를 녹음하는 경우에 다른 두 사람의 발언은 그 녹음자에 대한 관계에서 '타인 간의 대화'라고 할 수 없으므로, 이와 같은 녹음행위가 통신비밀보호법 제3조 제1항에 위배된다고 볼 수는 없다(대판 2006.10.12. 2006도4981).", "answer": "X"}, {"year": "2024", "num": "3", "source": "24변시", "question": "甲은 Z 소유 토지 위에 있는 X건물을 소유하고 있었는데 Z이 제기한 건물철거소송에서 패소하여 X건물이 철거되자 위 토지 위에 Y건물을 신축하였다. 乙은 Y건물 벽면에 계란 30여 개를 던져 甲이 Y건물에 남은 계란의 흔적을 지우는 데 약 50만 원의 청소비가 들게 하였다. 甲은 乙의 위와 같은 행위에 대항하여 Y건물 인근에 주차된 Z의 차량 앞에 철근콘크리트 구조물을, 뒤에 굴삭기 크러셔를 바짝 붙여 놓아 乙이 약 17시간 동안 위 차량을 운행할 수 없게 하였다. 한편, 乙은 화가 나 甲 소유의 굴삭기 크러셔에 빨간색 페인트를 이용하여 “불법 건축물 소유자는 물러가라\"라는 낙서를 하였고, 이 범죄사실에 대하여 벌금 100만 원의 약식명령이 발령되었다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 乙이 위 약식명령에 불복하여 변호인 선임 없이 정식재판을 청구한 후 연속으로 2회 불출정한 경우, 법원은 乙의 출정 없이 증거조사를 할 수 있고, 이 경우에는 「형사소송법」  제318조 제2항에 따라 乙의 증거동의가 간주된다.", "explanation": "[1] 형사소송법 제458조 제2 항, 제365조는 피고인이 출정을 하지 않음으로써 본안에 대한 변론권을 포기한 것으로 보는 일종의 제재적 규정으로, 이와 같은 경우 피고인의 출정 없이도 심리, 판결할 수 있고 공판심리의 일환으로 증거조사가 행해지게 마련이어서 피고인이 출석하지 아니한 상태에서 증거조사를 할 수밖에 없는 경우에는 위 법 제318조 제2항의 규정상 피고인의 진의와는 관계없이 같은 조 제1항의 동의가 있는 것으로 간주하게 되어 있는 점, 위 법 제318조 제2항의 입법 취지가 재판의 필요성 및 신속성 즉, 피고인의 불출정으로 인한 소송행위의 지연 방지 내지 피고인 불출정의 경우 전문증거의 증거능력을 결정하지 못함에 따른 소송지연 방지에 있는 점 등에 비추어 약식명령에 불복하여 정식 재판을 청구한 피고인이 정식재판절차에서 2회 불출정하여 법원이 피고인의 출정 없이 증거조사를 하는 경우에 위 법 제318조 제2항에 따른 피고인의 증거동의가 간주된다.  \n[2] 약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 불출정하여 형사소송법 제318조 제2항에 따른 증거동의가 간주된 후 증거조사를 완료한 이상, 간주의 대상인 증거동의는 증거조사가 완료되기 전까지 철회 또는 취소할 수 있으나 일단 증거조사를 완료한 뒤에는 취소 또는 철회가 인정되지 아니하는
