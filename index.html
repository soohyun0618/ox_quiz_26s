, {"source": "20변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장 부본을 송달받은 날부터 7 일 이내에 의사확인서를 제출하지 아니한 피고인도 제1회 공판기일이 열리기 전까지는 국민참여재판 신청을 할 수 있고, 법원은 그 의사를 확인하여 국민참여재판으로 진행할 수 있다.", "explanation": "국민의 형사재판 참여에 관한 법률 제8조는 피고인이 공소장 부본을 송달받은 날부터 7일 이내에 국민참여재판을 원하는지 여부에 관한 의사가 기재된 서면(이하 ‘ 의사확인서’)을 제출하도록 하고, 피고인이 그 기간 내에 의사확인서를 제출하지 아니한 때에는 국민참여재판을 원하지 아니하는 것으로 보며, 공판준비 기일이 종결되거나 제1회 공판기일이 열린 이후 등에는 종전의 의사를 바꿀 수 없도록 규정하고 있다. 위 규정의 취지를 위 기한이 지나면 피고인이 국민참여재판 신청을 할 수 없도록 하려는 것으로는 보기 어려운 점 등에 비추어 볼 때, 공소장 부본을 송달받은 날부터 7일 이내에 의사확인서를 제출하지 아니한 피고인도 제1회 공판기일이 열리기 전까지는 국민참여재판 신청을 할 수 있고, 법원은 그 의사를 확인하여 국민참여재판으로 진행할 수 있다고 봄이 상당하다(대결 2009.10.23. 2009모1032) .", "answer": "O"}, {"source": "13변시", "question": "피고인 甲은 성폭력범죄의처벌등에관한특례법위반(특수강도강간등)죄로 기소되었다. 피고인이 모두진술에서 공소사실을 전부 인정함에 따라 제1심법원은 간이공판절차에 의하여 심판할 것을 결정하였다. 공판절차에 검사가 작성한 수사기록과 사법경찰관 작성의 참고인진술조서 등의 증거가 제출되었고, 이에 제1심법원은 상당하다고 인정되는 방법으로 증거조사하였다. 피고인 甲은 1심에서 유죄를 선고받고 항소하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인 甲의 진술이 자백이 되려면 공판정에서 공소장 기재사실을 인정하고 나아가 위법성이나 책임의 조각사유가 되는 사실을 진술하지 않는 것으로 충분하지 않고, 명시적으로 유죄를 자인하는 진술까지 하여야 한다.", "explanation": "형사소송법 제286조의2가 규정하는 간이 공판절차의 결정의 요건인 공소사실의 자백이라 함은 공소장기재사실을 인정하고 나아가 위법성이나 책임조각사유가 되는 사실을 진술하지 아니하는 것으로 충분하고 명시적으로 유죄를 자인하는 진술이 있어야 하는 것은 아니다(대판 1987.08.18. 87도1269).", "answer": "X"}, {"source": "13변시", "question": "피고인 甲은 성폭력범죄의처벌등에관한특례법위반(특수강도강간등)죄로 기소되었다. 피고인이 모두진술에서 공소사실을 전부 인정함에 따라 제1심법원은 간이공판절차에 의하여 심판할 것을 결정하였다. 공판절차에 검사가 작성한 수사기록과 사법경찰관 작성의 참고인진술조서 등의 증거가 제출되었고, 이에 제1심법원은 상당하다고 인정되는 방법으로 증거조사하였다. 피고인 甲은 1심에서 유죄를 선고받고 항소하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "甲은 간이공판절차 개시결정에 대하여 항고할 수 없다.", "explanation": "간이공판절차의 개시 결정은 판결 전 소송절차에 대한 결정이므로 항고할 수 없다. 다만 간이공판절차로 심리할 수 없는데도 이에 의한 경우에는 항소이유가 된다. \n\n형사소송법 제403조 제1항 법원의 관할 또는 판결전의 소송절차에 관한 결정에 대하여는 특히 즉시항고를 할 수 있는 경우 외에는 항고하지 못한다.\n형사소송법 제361조의5(항소이유) 다음 사유가 있을 경우에는 원심판결에 대한 항소이유로 할 수 있다.\n1. 판결에 영향을 미친 헌법·법률·명령 또는 규칙의 위반이 있는 때", "answer": "O"}, {"source": "13변시", "question": "피고인 甲은 성폭력범죄의처벌등에관한특례법위반(특수강도강간등)죄로 기소되었다. 피고인이 모두진술에서 공소사실을 전부 인정함에 따라 제1심법원은 간이공판절차에 의하여 심판할 것을 결정하였다. 공판절차에 검사가 작성한 수사기록과 사법경찰관 작성의 참고인진술조서 등의 증거가 제출되었고, 이에 제1심법원은 상당하다고 인정되는 방법으로 증거조사하였다. 피고인 甲은 1심에서 유죄를 선고받고 항소하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "위 간이공판절차에서 법원은 증거조사결과에 대하여 반드시 피고인 甲의 의견을 물어야 한다.", "explanation": "간이공판절차에서는 증거조사 결과에 대하여 피고인의 의견을 묻는 규정은 적용되지 아니한다(제297조의 2, 제293조) . 그 외에 증인신문의 방식(제161조의2), 증거조사의 시기와 방식(제290조 내지 제292조), 증인신문시 피고인의 퇴정(제297조)등에 관한 규정도 적용되지 않는다.\n\n형사소송법 제297조의2(간이공판절차에서의 증거조사) 제 286조의2의 결정(간이공판절차의 결정)이 있는 사건에 대하여는 제161조의2,  제290조 내지 제293조, 제297조의 규정을 적용하지 아니하며 법원이 상당하다고 인정하는 방법으로 증거조사를 할 수 있다\n형사소송법 제293조(증거조사 결과와 피고인의 의견) 재판장은 피고인에게 각 증거조사의결과에 대한 의견을 묻고 권리를 보호함에 필요한 증거조사를 신청할 수 있음을 고지하여야 한다.", "answer": "X"}, {"source": "13변시", "question": "피고인 甲은 성폭력범죄의처벌등에관한특례법위반(특수강도강간등)죄로 기소되었다. 피고인이 모두진술에서 공소사실을 전부 인정함에 따라 제1심법원은 간이공판절차에 의하여 심판할 것을 결정하였다. 공판절차에 검사가 작성한 수사기록과 사법경찰관 작성의 참고인진술조서 등의 증거가 제출되었고, 이에 제1심법원은 상당하다고 인정되는 방법으로 증거조사하였다. 피고인 甲은 1심에서 유죄를 선고받고 항소하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "사법경찰관 작성 참고인진술조서는 검사, 피고인 甲 또는 변호인이 이의를 하지 아니하는 한 증거에 대하여 동의가 있는 것으로 간주된다.", "explanation": "간이공판절치에서는 검사, 피고인 또는 변호인이 증거로 함에 대한 이의가 없는 한 전문법칙이 적용되지 않는다.\n\n형사소송법 제318조의3(간이공판절차에서의 증거능력에 관한 특례) 제286조의2의 결정(간이공판절차의 결정)이있는 사건의 증거에 관하여는 제310조의2, 제312조 내지 제314조 및 316조의 규정에 의한 증거에 대하여 형사소송법 제318조(당사자동의와 증거능력) 제1항의 동의가 있는 것으로 간주한다. 단, 검사, 피고인 또는 변호인이 증거로 함에 이의가 있는 때에는 그러하지 아니하다.", "answer": "O"}, {"source": "13변시", "question": "피고인 甲은 성폭력범죄의처벌등에관한특례법위반(특수강도강간등)죄로 기소되었다. 피고인이 모두진술에서 공소사실을 전부 인정함에 따라 제1심법원은 간이공판절차에 의하여 심판할 것을 결정하였다. 공판절차에 검사가 작성한 수사기록과 사법경찰관 작성의 참고인진술조서 등의 증거가 제출되었고, 이에 제1심법원은 상당하다고 인정되는 방법으로 증거조사하였다. 피고인 甲은 1심에서 유죄를 선고받고 항소하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "항소심에서 피고인 甲이 범행을 부인하는 경우 제1심법원이 증거로 할 수 있었던 증거는 새로이 증거조사를 거쳐야만 항소심에서도 증거로 할 수 있다.", "explanation": "피고인이 제1심법원에서 공소사실에 대하여 자백하여 제1심법원이 이에 대하여 간이공판절차에 의하여 심판할 것을 결정하고, 이에 따라 제1심법원이 제1심판결 명시의 증거들을 증거로 함에 피고인 또는 변호인의 이의가 없어 형사소송법 제318조의3의 규정에 따라 증거능력이 있다고 보고, 상당하다고 인정하는 방법으로 증거조사를 한 이상, 가사 항소심에 이르러 범행을 부인하였다고 하더라도 제1심법원에서 증거로 할 수 있었던 증거는 항소법원에서도 증거로 할 수 있는 것이므로 제 1 심법원에서 이미 증거능력이 있었던 증거는 항소심에서도 증거능력이 그대로 유지되어 심판의 기초가 될 수 있고 다시 증거조사를 할 필요가 없다(대판 1998.02.27. 97도3421).", "answer": "X"}, {"source": "18변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 법원에 국민참여재판을 신청하였는데도 법원이 이에 대한 배제결정도 하지 않은 채 통상의 공판절차로 재판을 진행하였다면 이러한 공판절차에서 이루어진 소송행위는 무효라고 보아야 한다.", "explanation": "국민참여재판을 시행하는 이유나 ‘국민의 형사재판 참여에 관한 법률’의 여러 규정에 비추어 볼 때, 위 법에서 정하는 대상 사건에 해당하는 한 피고인은 원칙적으로 국민참여재판으로 재판을 받을 권리를 가지는 것이므로, 피고인이 법원에 국민참여재판을 신청하였는데도 법원이 이에 대한 배제결정도 하지 않은 채 통상의 공판절차로 재판을 진행하는 것은 피고인의 국민참여재판을 받을 권리 및 법원의 배제결정에 대한 항고권 등 중대한 절차적 권리를 침해한 것으로서 위법하고, 국민참여재판제도의 도입 취지나 위법에서 배제결정에 대한 즉시항고권을 보장한 취지 등에 비추어 이와 같이 위법한 공판절차에서 이루어진 소송행위는 무효라고 보아야 한다(대판 2011.09.08. 2011도7106).", "answer": "O"}, {"source": "18변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심 법원이 피고인의 의사에 따라 국민참여재판으로 진행함에 있어 별도의 국민참여재판 개시결정을 할 필요는 없으나 그에 관한 이의가 있어 국민참여재판으로 진행하기로 결정한 경우, 검사는 그 결정에 대하여 즉시항고를 할 수 있다.", "explanation": "국민의 형사재판 참여에 관한 법률에 의하면 제 1 심 법원이 국민침여재판 대상사건을 피고인의 의사에 따라 국민참여재판으로 진행함에 있어 별도의 국민참여재판 개시결정을 할 필요는 없고, 그에 관한 이의가 있어 제1심 법원이 국민참여재판으로 진행하기로 하는 결정에 이른 경우 이는 판결 전의 소송절차에 관한 결정에 해당하며,그에 대하여 특별히 즉시항고를 허용하는 규정이 없으므로 위 결정에 대하여는 항고할 수 없다. 따라서 국민침여재판으로 진행하기로 하는 제1심 법원의 결정에 대한 항고는 항고의 제기가 법률상의 방식을 위반한 때에 해당하여 위 결정을 한 법원이 항고를 기각하여야 하고 위 결정을 한 법원이 항고기각의 결정을 하지 아니한 때에는 항고법원은 결정으로 항고를 기각하여야 한다(대결 2009.10.23. 2009모1032)", "answer": "X"}, {"source": "18변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "국민참여재판에서 공판준비 기일은 원칙적으로 공개하여야 하나, 배심원은 공판준비기일에는 참여하지 아니한다.", "explanation": "국민참여재판법 제37조(공판준비기일) 제1항 법원은 주장과 증거를 정리하고 심리계획을 수립하기 위하여 공판준비기일을 지정하여야 한다.\n제2항 법원은 합의부원으로 하여금 공판준비기일을 진행하게 할 수 있다. 이 경우 수명법관은 공판준비기일에 관하여 법원 또는 재판장과 동일한 권한이 있다\n제3항 공판준비기일은 공개한다. 다만, 법원은 공개함으로써 절차의 진행이 방해될 우려가 있는 때에는 공판준비기일을 공개하지 아니할 수 있다.\n제4항 공판준비기일에는 배심원이 참여하지 아니한다.", "answer": "O"}, {"source": "18변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "국민참여재판은 간이공판절차에 의한 증거능력과 증거조사의 특칙을 적용하기에 부적합한 재판이기 때문에 간이공판절차에 관한 규정을 적용하지 아니한다.", "explanation": "국민참여재판법 제43조(공판준비기일) 국민참여재판에 는 「형사소송법」 제286조의2를 적용하지 아니한다.\n형사소송법 제286조의2(간이공판절차의 결정) 피고인이 공판정에서 공소사실에 대하여 자백한 때에는 법원은 그 공소사실에 한하여 간이공판절차에 의하여 심판할 것을 결정할 수 있다.", "answer": "O"}, {"source": "18변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "국민참여재판에 관하여 변호인이 없는 때에는 법원은 직권으로 변호인을 선정하여야 한다.", "explanation": "국민참여재판법 제7조(필요적 국선변호) 이 법에 따른 국민참여재판에 관하여 변호인이 없는 때에 는 법원은 직권으로 변호인을 선정하여야 한다.", "answer": "O"}, {"source": "12변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은?", "choice": "법원은 국민참여재판 대상사건에 대하여 반드시 피고인에게 국민참여재판을 원하는지 여부를 확인하여야 한다.", "explanation": "국민의 형사재판 참여에 관한 법률 제8조 제1항 참조(법원은 대상사건의 피고인에 대하여 국민참여재판을 원하는지 여부에 관한 의사를 서면 등의 방법으로 반드시 확인하여야 한다. 이 경우 피고인 의사의 구체적인 확인 방법은 대법원규칙으로 정하되, 피고인의 국민참여재판을 받을 권리가 최대한 보장되도록 하여야 한다.)", "answer": "O"}, {"source": "12변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은?", "choice": "배심원은 만 20세 이상의 대한민국 국민 중에서 국민의 형사재판 참여에 관한 법률로 정하는 바에 따라 선정된다.", "explanation": "배심원은 만 20세 이상의 대한민국 국민 중에서 이 법으로 정하는 바에 따라 선정된다(국민의 형사재판 참여에 관한 법률 제16조).", "answer": "O"}, {"source": "12변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은?", "choice": "국민참여재판을 진행하던 중 공소사실의 변경으로 대상사건에 해당하지 않게 된 경우에는 국민참여재판으로 진행할 수 없다.", "explanation": "국민의 형사재판 참여에 관한 법률 제6조 제1항 참조(법원은 공소사실의 일부 철회 또는 변경으로 인하여 대상사건에 해당하지 아니하게 된 경우에도 이 법에 따른 재판을 계속 진행한다. 다만, 법원은 심리의 상황이나 그 밖의 사정을 고려하여 국민참여재판으로 진행하는 것이 적당하지 아니하다고 인정하는 때에는 결정으로 당해 사건을 지방법원 본원 합의부가 국민참여 재판에 의하지 아니하고 심판하게 할 수 있다.)", "answer": "X"}, {"source": "12변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은?", "choice": "법원은 공범관계에 있는 피고인들 중 일부가 국민참여재판을 원하지 않아 국민참여재판을 진행하는 데 어려움이 있다고 판단한 경우 국민참여재판을 하지 않는 결정을 할 수 있다.", "explanation": "국민의 형사재판 참여에 관한 법률 제9조 제1항 제2호 참조(법원은 공소제기 후부터 공판준비기일이 종결된 다음날까지 다음 각 호의 어느 하나에 해당하는 경우 국민참여재판을 하지 아니하기로 하는 결정을 할 수 있다.\n2. 공범 관계에 있는 피고인들 중 일부가 국민참여재판을 원하지 아니하여 국민참여재판의 진행에 어려움이 있다고 인정되는 경우)", "answer": "O"}, {"source": "12변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은?", "choice": "법원은 피고인의 질병으로 공판절차가 장기간 정지되어 국민참여재판을 계속 진행하는 것이 부적절하다고 인정하는 경우 사건을 지방법원 본원 합의부가 국민참여재판에 의하지 않고 심판하게 할수 있다.", "explanation": "국민의 형사재판 참여에 관한 법률 제11조 1항 참조(법원은 피고인의 질병 등으로 공판절차가 장기간 정지되거나 피고인에 대한 구속기간의 만료, 그 밖에 심리의 제반 상황에 비추어 국민참여재판을 계속 진행하는 것이 부적절하다고 인정하는 경우에는 직권 또는 검사 · 피고인 또는 변호인의 신청에 따라 결정으로 사건을 지방법원 본원 합의부가 국민참여재판에 의하지 아니하고 심판하게 할 수 있다.)", "answer": "O"}, {"source": "24변시", "question": "증거에 관한 설명 중 옳은 것과 옳지 않은 것을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": " '증거물인 서면’을 조사하기 위해서는 증거서류의 조사방식인 낭독·내용고지 또는 열람의 절차와 증거물의 조사방식인 제시의 절차가 함께 이루어져야 한다.", "explanation": "형사소송법 제292조, 제292조의2 제1항, 형사소송규칙 제134조의6의 취지에 비추어 보면, 본래 증거물이지만 증거서류의 성질도 가지고 있는 이른바 '증거물인 서면'을 조사하기 위해서는 증거서류의 조사방식인 낭독,내용고지 또는 열람의 절차와 증거물의 조사방식인 제시의 절차가 함께 이루어져야 하므로, 원칙적으로 증거신청인으로 하여금 그 서면을 제시하면서 낭독하게 하거나 이에 갈음하여 그 내용을 고지 또는 열람하도록 하여야 한다(대판 2013.07.26. 2013도2511).\n>형사소송법 제292조(증거서류에 대한 조사방식) ①검사, 피고인 또는 변호인의 신청에 따라 증거서류를 조사하는 때에는 신청인이 이를 낭독하여야 한다.\n②법원이 직권으로 증거서류를 조사하는 때에는 소지인 또는 재판장이 이를 낭독하여야 한다.\n③재판장은 필요하다고 인정하는 때에는 제1항 및 제2항에도 불구하고 내용을 고지하는 방법으로 조사할 수 있다.\n④재판장은 법원사무관등으로 하여금 제1항부터 제3항까지의 규정에 따른 낭독이나 고지를 하게 할 수 있다.\n⑤재판장은 열람이 다른 방법보다 적절하다고 인정하는 때에는 증거서류를 제시하여 열람하게 하는 방법으로 조사할 수 있다.\n>형사소송법 제292조의2(증거물에 대한 조사방식) ①검사, 피고인 또는 변호인의 신청에 따라 증거물을 조사하는 때에는 신청인이 이를 제시하여야 한다.\n②법원이 직권으로 증거물을 조사하는 때에는 소지인 또는 재판장이 이를 제시하여야 한다.\n③재판장은 법원사무관등으로 하여금 제1항 및 제2항에 따른 제시를 하게 할 수 있다.\n>형사소송규칙 제134조의6(증거서류에 대한 조사방법) ① 법 제292조제3항에 따른 증거서류 내용의 고지는 그 요지를 고지하는 방법으로 한다.\n② 재판장은 필요하다고 인정하는 때에는 법 제292조제1항ㆍ제2항ㆍ제4항의 낭독에 갈음하여 그 요지를 진술하게 할 수 있다.", "answer": "O"}, {"source": "24변시", "question": "증거에 관한 설명 중 옳은 것과 옳지 않은 것을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "상해의 증거로 제시된 상해부위를 촬영한 사진은 비진술증거로서 전문법칙이 적용되지 않는다.", "explanation": " '공소외인의 상해부위를 촬영한 사진’은 비진술증거로서 전문법칙이 적용되지 않으므로,  위 사진이 진술증거임을 전제로 전문법칙이 적용되어야 한다는 취지의 상고이유의 주장 또한 받아들일 수 없다(대판 2007.07.26 2007도3906).", "answer": "O"}, {"source": "24변시", "question": "증거에 관한 설명 중 옳은 것과 옳지 않은 것을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "형사소송법 제312조 제5항의 적용 대상인 ‘수사과정에서 작성한 진술서’란 수사가 시작된 이후에 수사기관의 관여 아래 수사관서 내에서 작성된 것을 말하므로, 수사관서 이외의 장소에서 수사기관의 요청에 따라 피의자가 작성한 진술서는 수사과정에서 작성한 진술서에 해당하지 않는다.", "explanation": "형사소송법 제312조 제5항의 적용대상인 ‘수사과정에서 작성한 진술서’란 수사가 시작된 이후에 수사기관의 관여 아래 작성된 것이거나, 개시된 수사와 관련하여 수사과정에 제출할 목적으로 작성한 것으로, 작성 시기와 경위 등 여러 사정에 비추어 그 실질이 이에 해당하는 이상 명칭이나 작성된 장소 여부를 불문한다(대판 2022.10.27. 2022도9510).", "answer": "X"}, {"source": "24변시", "question": "증거에 관한 설명 중 옳은 것과 옳지 않은 것을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 공판기일에 증인으로 신청하여 신문할 사람을 특별한 사정 없이 미리 수사기관에 소환하여 면담하는 절차를 거친 후 그 증인이 법정에서 피고인에게 불리한 내용을 진술한 경우, 검사가 증인신문 전 면담 과정에서 증인에 대한 회유나 압박, 답변 유도나 암시 등으로 증인의 법정진술에 영향을 미치지 않았다는 점이 담보되어야 증인의 법정진술을 신빙할 수 있다.", "explanation": "검사가 공판기일에 증인으로 신청하여 신문할 사람을 특별한 사정 없이 미리 수사기관에 소환하여 면담하는 절차를 거친 후 증인이 법정에서 피고인에게 불리한 내용의 진술을 한 경우, 검사가 증인신문 전 면담 과정에서 증인에 대한 회유나 압박, 답변 유도나 암시 등으로 증인의 법정진술에 영향을 미치지 않았다는 점이 담보되어야 증인의 법정진술을 신빙할 수 있다고 할 것이다. 검사가 증인신문 준비 등 필요에 따라 증인을 사전 면담할 수 있다고 하더라도 법원이나 피고인의 관여 없이 일방적으로 사전 면담하는 과정에서 증인이 훈련되거나 유도되어 법정에서 왜곡된 진술을 할 가능성도 배제할 수 없기 때문이다. 증인에 대한 회유나 압박 등이 없었다는 사정은 검사가 증인의 법정진술이나 면담 과정을 기록한 자료 등으로 사전면담 시점 이유와 방법 구체적 내용 등을 밝힘으로써 증명하여야 한다(대판 2021.06.10. 2020도15891).\n> 비교판례:  제1심에서 피고인에 하여 무죄판결이 선고되어 검사가 항소한 후, 기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 않는 한 증거능력이 없다(대판 2019.11.28. 2013 6825) . \n", "answer": "O"}, {"source": "23변시", "question": "녹음증거 및 「통신비밀보호법」 에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「통신비밀보호법」상 통신사실확인자료 제공요청의 목적이 된 범죄와 관련된 범죄란 통신사실확인자료 제공요청허가서에 기재된 혐의사실과 객관적 관련성이 있고 자료제공 요청 대상자와 피의자 사이에 인적 관련성이 있는 범죄를 의미한다.", "explanation": "통신사실 확인자료 제공요청의 목적이 된 범죄와 관련된 범죄라 함은 통신사실 확인자료 제공요청허가서에 기재한 혐의사실과 객관적 관련성이 있고, 자료제공 요청 대상자와 피의자 사이에 인적 관련성이 있는 범죄를 의미한다(대판 2021.9.16. 2021도2748).", "answer": "O"}, {"source": "23변시", "question": "녹음증거 및 「통신비밀보호법」 에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": " '우당탕' 소리는 사람의 목소리가 아니라 사물에서 발생하는 음향이고 ‘악’ 소리도 사람의 목소리이기는 하나 그것만으로 상대방에게 의사를 전달하는 말이라고 보기는 어려워 특별한 사정이 없는 한  「통신비밀보호법」 에서 말히는 타인 간의 ‘대화’에 해당한다고 볼 수 없다.", "explanation": "통신비밀보호법 제1조, 제3조 제1항 본문, 제4조, 제14조 제1항, 제2항의 문언, 내용, 체계와 입법취지 등에 비추어 보면, 통신비밀보호법에서 보호하는 타인 간의 ‘대화’는 원칙적으로 현장에 있는 당사자들이 육성으로 말을 주고받는 의사소통행위를 가리킨다. 따라서 사람의 육성이 아닌 사물에서 발생하는 음향은 타인 간의 ‘대화’에 해당하지 않는다. 또한 사람의 목소리라고 하더라도 상대방에게 의사를 전달하는 말이 아닌 단순한 비명소리나 탄식 등은 타인과 의사소통을 하기 위한 것이 아니라면 특별한 사정이 없는 한 타인 간의 ‘대화’에 해당한다고 볼 수 없다. ...공소외인이 들었다는 ‘우당탕’ 소리는 사물에서 발생하는 음향일 뿐 사람의 목소리가 아니므로 통신비밀보호법에서 말하는 타인 간의 ‘대화’에 해당하지 않는다. ‘악’ 소리도 사람의 목소리이기는 하나 단순한 비명소리에 지나지 않아 그것만으로 상대방에게 의사를 전달하는 말이라고 보기는 어려워 특별한 사정이 없는 한 타인 간의 ‘대화’에 해당한다고 볼 수 없다(대판 2017.3.15. 2016도19843).", "answer": "O"}, {"source": "23변시", "question": "녹음증거 및 「통신비밀보호법」 에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관은 통신기관 등에 통신제한조치허가서의 사본을 교부하고 집행을 위탁할 수 있지만, 위탁을 받은 통신기관 등이 허가서에 기재된 집행방법 등을 준수하지 아니한 채 취득한 전기통신의 내용 등은 유죄 인정의 증거로 할 수 없다.", "explanation": "통신제한조치허가서에는 통신제한조치의 종류·목적·대상범위·기간 및 집행장소와 방법을 특정하여 기재하여야 하고(통신비밀보호법 제6조 제6항), 수사기관은 허가서에 기재된 허가의 내용과 범위 및 집행방법 등을 준수하여 통신제한조치를 집행하여야 한다. 이때 수사기관은 통신기관 등에 통신제한조치허가서의 사본을 교부하고 집행을 위탁할 수 있으나(통신비밀보호법 제9조 제1항, 제2항), 그 경우에도 집행의 위탁을 받은 통신기관 등은 수사기관이 직접 집행할 경우와 마찬가지로 허가서에 기재된 집행방법 등을 준수하여야 함은 당연하다 ...통신제한조치허가서에 기재된 사항을 준수하지 아니한 채 통신제한조치를 집행하였다면, 그러한 집행으로 취득한 전기통신의 내용 등은 헌법과 통신비밀보호법이 국민의 기본권인 통신의 비밀을 보장하기 위해 마련한 적법한 절차를 따르지 아니하고 수집한 증거에 해당하므로(형사소송법 제308조의2), 이는 유죄 인정의 증거로 할 수 없다(대판 2016.10.13. 2016도8137).", "answer": "O"}, {"source": "23변시", "question": "녹음증거 및 「통신비밀보호법」 에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 피고인의 마약류관리에관한법률위반(향정)죄의 추가적인 증거를 확보할 목적으로 필로폰 투약혐의로 구속수감 중인 공소외인에게 그의 압수된 휴대전화를 제공하여 그로 하여금 피고인과 통화하고 피고인의 이 사건 공소사실 범행에 관한 통화 내용을 녹음하게 한 경우 그 녹음파일은 ‘타인 간의 대화’라고 할 수 없으므로 증거능력이 있다.", "explanation": "...위와 같은 녹음행위는 수사기관이 공소외인으로부터 피고인의 이 사건 공소사실 범행에 대한 진술을 들은 다음 추가적인 증거를 확보할 목적으로 구속수감되어 있던 공소외인에게 그의 압수된 휴대전화를 제공하여 그로 하여금 피고인과 통화하고 피고인의 이 사건 공소사실 범행에 관한 통화 내용을 녹음하게 한 것이라 할 것이고, 이와 같이 수사기관이 구속수감된 자로 하여금 피고인의 범행에 관한 통화 내용을 녹음하게 한 행위는 수사기관 스스로가 주체가 되어 구속수감된 자의 동의만을 받고 상대방인 피고인의 동의가 없는 상태에서 그들의 통화 내용을 녹음한 것으로서 범죄수사를 위한 통신 제한조치의 허가 등을 받지 아니한 불법감청에 해당한다고 보아야 할 것이므로, 그 녹음 자체는 물론이고 이를 근거로 작성된 이 사건 수사보고의 기재 내용과 첨부 녹취록 및 첨부 mp3 파일도 모두 피고인과 변호인의 증거동의에 상관없이 증거능력이 없다고 할 것이다(대판 2010.10.14. 2010도9016).", "answer": "X"}, {"source": "23변시", "question": "녹음증거 및 「통신비밀보호법」 에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「통신비밀보호법」상 감청은 전기통신이 이루어지고 있는 상황에서 실시간으로 그 전기통신의 내용을 지득·채록하는 경우와 통신의 송・수신을 직접적으로 방해하는 경우를 의미하는 것이지 이미 수신이 완료된 전기통신에 관하여 남아 있는 기록이나 내용을 열어보는 등의 행위는 포함하지 않는다.", "explanation": "통신비밀보호법 제2조 제3호 및 제7호에 의하면 같은 법상 ‘감청’은 전자적 방식에 의하여 모든 종류의 음향·문언·부호 또는 영상을 송신하거나 수신하는 전기통신에 대하여 당사자의 동의 없이 전자장치·기계장치 등을 사용하여 통신의 음향·문언·부호·영상을 청취·공독하여 그 내용을 지득 또는 채록하거나 전기통신의 송수신을 방해하는 것을 말한다. 그런데 해당 규정의 문언이 송신하거나 수신하는 전기통신 행위를 감청의 대상으로 규정하고 있을 뿐 송수신이 완료되어 보관 중인 전기통신 내용은 대상으로 규정하지 않은 점, 일반적으로 감청은 다른 사람의 대화나 통신 내용을 몰래 엿듣는 행위를 의미하는 점 등을 고려하여 보면, 통신비밀보호법상 ‘감청’이란 대상이 되는 전기통신의 송·수신과 동시에 이루어지는 경우만을 의미하고, 이미 수신이 완료된 전기통신의 내용을 지득하는 등의 행위는 포함되지 않는다(대판 2012.10.25. 2012도4644).", "answer": "O"}, {"source": "12변시", "question": "디지털 정보 저장매체를 압수하여 증거로 사용함에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "컴퓨터디스크에 기억된 문자정보를 증거로 제출하는 경우에는 이를 읽을 수 있도록 출력하여 인증한 등본으로 낼 수 있다.", "explanation": "형사소송규칙 제134조의7 제1항, 제2항 참조.\n>형사소송규칙 제134조의7(컴퓨터용디스크 등에 기억된 문자정보 등에 대한 증거조사) ① 컴퓨터용디스크 그 밖에 이와 비슷한 정보저장매체(다음부터 이 조문 안에서 이 모두를 “컴퓨터디스크 등”이라 한다)에 기억된 문자정보를 증거자료로 하는 경우에는 읽을 수 있도록 출력하여 인증한 등본을 낼 수 있다.\n② 컴퓨터디스크 등에 기억된 문자정보를 증거로 하는 경우에 증거조사를 신청한 당사자는 법원이 명하거나 상대방이 요구한 때에는 컴퓨터디스크 등에 입력한 사람과 입력한 일시, 출력한 사람과 출력한 일시를 밝혀야 한다.", "answer": "O"}, {"source": "12변시", "question": "디지털 정보 저장매체를 압수하여 증거로 사용함에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "컴퓨터디스크에 기억된 문자정보를 증거로 하는 경우에 상대방이 요구한 때에는 컴퓨터디스크에 입력한 사람과 입력한 일시, 출력한 사람과 출력한 일시를 밝혀야 한다.", "explanation": "\"형사소송규칙 제134조의7 제1항, 제2항 참조.\n>형사소송규칙 제134조의7(컴퓨터용디스크 등에 기억된 문자정보 등에 대한 증거조사) ① 컴퓨터용디스크 그 밖에 이와 비슷한 정보저장매체(다음부터 이 조문 안에서 이 모두를 “컴퓨터디스크 등”이라 한다)에 기억된 문자정보를 증거자료로 하는 경우에는 읽을 수 있도록 출력하여 인증한 등본을 낼 수 있다.\n② 컴퓨터디스크 등에 기억된 문자정보를 증거로 하는 경우에 증거조사를 신청한 당사자는 법원이 명하거나 상대방이 요구한 때에는 컴퓨터디스크 등에 입력한 사람과 입력한 일시, 출력한 사람과 출력한 일시를 밝혀야 한다.\"", "answer": "O"}, {"source": "12변시", "question": "디지털 정보 저장매체를 압수하여 증거로 사용함에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "디지털 저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 정보저장매체 원본에 저장된 내용과 출력한 문건의 동일성이 인정되어야 하고, 이를 위해서는 디지털 저장매체원본이 압수시부터 문건 출력시까지 변경되지 않았음이 담보되어야 한다.", "explanation": "압수물인 디지털 저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 디지털 저장매체 원본에 저장된 내용과 출력한 문건의 동일성이 인정되어야 하고, 이를 위해서는 디지털 저장매체 원본이 압수시부터 문건 출력시까지 변경되지 않았음이 담보되어야 한다. 특히 디지털 저장매체 원본을 대신하여 저장매체에 저장된 자료를 ‘하드카피’ 또는 ‘이미징’한 매체로부터 출력한 문건의 경우에는 디지털 저장매체 원본과 ‘하드카피’ 또는 ‘이미징’한 매체 사이에 자료의 동일성도 인정되어야 할 뿐만 아니라, 이를 확인하는 과정에서 이용한 컴퓨터의 기계적 정확성 프로그램의 신뢰성 입력·처리·출력의 각 단계에서 조작자의 전문적인 기술능력과 정확성이 담보되어야 한다. 그리고 압수된 디지털 저장매체로부터 출력한 문건을 진술증거로 사용하는 경우 그 기재 내용의 진실성에 관하여는 전문법칙이 적용되므로 형사소송법 제313조 제1항에 따라 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에 한하여 이를 증거로 사용할 수 있다(대판 2007.12.13. 2007도7257).", "answer": "O"}, {"source": "12변시", "question": "디지털 정보 저장매체를 압수하여 증거로 사용함에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "복제한 정보저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 정보저장매체 원본과 복제한 매체 사이에 자료의 동일성도 인정되어야 할 뿐만 아니라, 이를 확인하는 과정에서 이용한 컴퓨터의 기계적 정확성, 프로그램의 신뢰성, 입력 · 처리 · 출력의 각 단계에서 조작자의 전문적인 기술능력과 정확성이 담보되어야 한다.", "explanation": "압수물인 디지털 저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 디지털 저장매체 원본에 저장된 내용과 출력한 문건의 동일성이 인정되어야 하고, 이를 위해서는 디지털 저장매체 원본이 압수시부터 문건 출력시까지 변경되지 않았음이 담보되어야 한다. 특히 디지털 저장매체 원본을 대신하여 저장매체에 저장된 자료를 ‘하드카피’ 또는 ‘이미징’한 매체로부터 출력한 문건의 경우에는 디지털 저장매체 원본과 ‘하드카피’ 또는 ‘이미징’한 매체 사이에 자료의 동일성도 인정되어야 할 뿐만 아니라, 이를 확인하는 과정에서 이용한 컴퓨터의 기계적 정확성 프로그램의 신뢰성 입력·처리·출력의 각 단계에서 조작자의 전문적인 기술능력과 정확성이 담보되어야 한다. 그리고 압수된 디지털 저장매체로부터 출력한 문건을 진술증거로 사용하는 경우 그 기재 내용의 진실성에 관하여는 전문법칙이 적용되므로 형사소송법 제313조 제1항에 따라 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에 한하여 이를 증거로 사용할 수 있다(대판 2007.12.13. 2007도7257).", "answer": "O"}, {"source": "12변시", "question": "디지털 정보 저장매체를 압수하여 증거로 사용함에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "디지털 저장매체로부터 출력한 문건을 진술증거로 사용하는 경우, 그 기재 내용의 진실성에 관하여는 전문법칙이 적용되므로, 문서의 압수·수색의 주체가 검사인가 사법경찰관인가에 따라 증거능력의 인정요건이 달라지게 된다.", "explanation": "...그리고 압수된 디지털 저장매체로부터 출력한 문건을 진술증거로 사용하는 경우 그 기재 내용의 진실성에 관하여는 전문법칙이 적용되므로 형사소송법 제313조 제1항에 따라 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에 한하여 이를 증거로 사용할 수 있다(대판 2007.12.13. 2007도7257).\n*문서의 압수수색의 주체가 검사인지 사법경찰관인지는 증거능력 인정요건과 관계 없다.", "answer": "X"}, {"source": "15변시", "question": "검사 작성 피의자신문조서의 증거능력에 대해 규정한 형사소송법 제312조 제1항에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검찰에 송치되기 전에 검사가 구속피의자를 상대로 작성한 피의자신문조서라도 송치 후에 작성된 검사 작성의 피의자신문조서와 마찬가지로 취급된다.", "explanation": "검찰에 송치되기 전에 구속피의자로부터 받은 검사 작성의 피의자신문조서는 극히 이례에 속하는 것으로 그와 같은 상태에서 작성된 피의자신문조서는 내용만 부인하면 증거능력을 상실하게 되는 사법경찰관 작성의 피의자신문조서상의 자백 등을 부당하게 유지하려는 수단으로 악용될 가능성이 있어, 그렇게 했어야 할 특별한 사정이 보이지 않는 한 송치후에 작성된 피의자신문조서와 마찬가지로 취급하기는 어렵다(대판 1994. 8. 9. 94도1228).", "answer": "X"}, {"source": "15변시", "question": "검사 작성 피의자신문조서의 증거능력에 대해 규정한 형사소송법 제312조 제1항에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피의자의 진술을 기재한 서류 또는 문서가 검사의 수사과정에서 작성된 것이라면 ‘진술조서, 진술서, 자술서’의 어떤 형식을 취하였더라도 피의자신문조서와 마찬가지로 취급된다.", "explanation": "피의자의 진술을 녹취 내지 기재한 서류 또는 문서가 수사기관에서의 조사과정에서 작성된 것이라면, 그것이 ‘진술조서, 진술서, 자술서’라는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없다(대판 2009.8.20. 2008도8213).", "answer": "O"}, {"source": "15변시", "question": "검사 작성 피의자신문조서의 증거능력에 대해 규정한 형사소송법 제312조 제1항에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "형사소송법상의 조서 작성방법에 따라야 하지만 조서 말미에 피고인의 기명만 있거나 날인만 하더라도 그 하자가 경미한 이상 증거능력이 인정된다.", "explanation": "검사작성의 피의자 신문조서에 대하여 증거능력을 인정하기 위해서는 적법한 절차와 방식에 따라서 작성된 것이어야 하고(형사소송법 제312조 제1항), 피의자 신문조서에는 피의자가 간인한 후 기명날인 또는 서명해야 하므로(형사소송법 제244조 제3항) 이를 위반한 것은 적법한 절차와 방식에 따라서 작성된 것이 아니므로 증거 능력을 인정받을 수 없을 것이다.\n>판례: 피고인의 기명만이 있고, 그 날인이나 무인이 없는, 검사 작성의 피고인에 대한 피의자신문조서는 증거능력이 없다(대판 1981.10.27. 81도1370).\n>형사소송법 제244조 3항: 피의자가 조서에 대하여 이의나 의견이 없음을 진술한 때에는 피의자로 하여금 그 취지를 자필로 기재하게 하고 조서에 간인한 후 기명날인 또는 서명하게 한다.", "answer": "X"}, {"source": "15변시", "question": "검사 작성 피의자신문조서의 증거능력에 대해 규정한 형사소송법 제312조 제1항에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 작성한 피의자신문조서의 일부에 대하여만 피고인이 성립의 진정을 인정하는 것은 허용되지 않는다.", "explanation": "수사기관이 작성한 조서의 내용이 원진술자가 진술한 대로 기재된 것이라 함은 조서 작성 당시 원진술자의 진술대로 기재되었는지의 여부만을 의미히는 것으로 그와 같이 진술하게 된 연유나 그 진술의 신빙성 여부는 고려할 것이 아니며, 한편 검사가 피의자나 피의자 아닌 자의 진술을 기재한 조서 중 일부에 관하여만 원진술자가 공판준비 또는 공판기일에서 실질적 진정성립을 인정하는 경우에는 법원은 당해 조서 중 어느 부분이 원진술자가 진술한 대로 기재되어 있고 어느 부분이 달리 기재되어 있는지 여부를 구체적으로 심리한 다음 진술한 대로 기재되어 있다고 하는 부분에 한하여 증거능력을 인정하여야 하고 그밖에 실질적 진정성립이 부정되는 부분에 대해서는 증거능력을 부정하여야 한다(대판 2005.6.10. 2005도1849).\n*2020년 2월 4일 개정 형사소송법 제312조 참조.\n\n<2021. 1. 1. 시행>\n형사소송법 312조(검사 또는 사법경찰관의 조서 등) 1항: 검사가 피고인이 된 피의자의 진술을 기재한 조서는 적법한 절차와 방식에 따라 작성된 것으로서 피고인이 진술한 내용과 동일하게 기재되어 있음이 공판준비 또는 공판기일에서의 피고인의 진술에 의하여 인정되고 그 조서에 기재된 이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한하여 증거로 할 수 있다.\n2항: 삭제 <2020. 2. 4. >\n\n<2022. 1. 1. 시행>\n형사소송법 312조(검사 또는 사법경찰관의 조서 등) 1항: 검사가 작성한 피의자신문조서는 적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다. \n2항: 삭제 <2020. 2. 4>", "answer": "X"}, {"source": "15변시", "question": "검사 작성 피의자신문조서의 증거능력에 대해 규정한 형사소송법 제312조 제1항에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": " '특히 신빙할 수 있는 상태’란 그 진술내용이나 조서의 작성에 허위개입의 여지가 거의 없고, 그 진술내용의 신용성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우를 말하며 검사가 엄격한 증명을 통해 증명하여야 한다.", "explanation": "형사소송법 제312조 제4항에서 ‘특히 신빙할 수 있는 상태’란 진술 내용이나 조서 작성에 허위개입의 여지가 거의 없고, 진술 내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 것을 말한다. 그리고 이러한 ‘특히 신빙할 수 있는 상태’는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장 · 증명하여야 하지만 이는 소송상의 사실에 관한 것이므로 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다(대판 2012.7.26. 2012도2937).", "answer": "X"}, {"source": "17변시", "question": "「형사소송법」 제308조에 규정된 자유심증주의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "증거의 증명력을 볍관의 자유판단에 의하도록 하는 것은 그것이 실체적 진실발견에 적합하기 때문이지 법관의 자의적인 판단을 인용한디는 것은 아니다.", "explanation": "자유심증주의를 규정한 형사소송법 제 308조가 증거의 증명력을 법관의 자유판단에 의하도록 한 것은 그것이 실체적 진실발견에 적합하기 때문이지 법관의 자의적인 판단을 인용한다는 것은 아니므로, 증거판단에 관한 전권을 가지고 있는 사실심 법관은 사실인정에 있어 공판절차에서 획득된 인식과 조사된 증거를 남김없이 고려하여야 한다( 대판 2007.05.10. 2007도1950) .", "answer": "O"}, {"source": "17변시", "question": "「형사소송법」 제308조에 규정된 자유심증주의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "형사재판에 있어서 유죄로 인정하기 위한 심증형성의 정도는 합리적인 의심을 할 여지가 없을 정도이어야 하고 여기서 합리적 의심이란 논리와 경험칙에 기하여 요증사실과 양립할 수 없는 사실의 개연성에 대한 합리성 있는 의문을 의미한다.", "explanation": "증거의 증명력에 대한 법관의 판단은 논리와 경험칙에 합치하여야 하고, 형사재판에서 유죄로 인정하기 위한 심증 형성의 정도는 합리적인 의심을 할 여지가 없을 정도여야 하나, 이는 모든 가능한 의심을 배제할 정도에 이를 것까지 요구하는 것은 아니며, 증명력이 있는 것으로 인정되는 증거를 합리적인 근거가 없는 의심을 일으켜 배척하는 것은 자유심증주의의 한계를 벗어나는 것으로 허용될 수 없다. 여기에서 말하는 합리적 의심이란 모든 의문, 불신을 포함하는 것이 아니라 논리와 경험칙에 기하여 요증사실과 양립할 수 없는 사실의 개연성에 대한 합리성 있는 의문을 의미하는 것으로서, 단순히 관념적인 의심이나 추상적인 가능성에 기초한 의심은 합리적 의심에 포함된다고 할 수 없다( 대판 2011.01.27. 2010 도12728).", "answer": "O"}, {"source": "17변시", "question": "「형사소송법」 제308조에 규정된 자유심증주의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "형사재판에 있어서 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되기 때문에 당해 형사재판에서 제 출된 다른 증거 내용에 비추어 관련 형사사건 확정판결의 사실판단을 그대로 채택하기 어렵다고 인정될 경우라도 이를 배척할수 없다.", "explanation": "형사재판에서 이와 관련된 다른 형시사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이나, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건 확정판결의 사실판단을 그대로 채택하기 어렵다고 인정될 경우에는 이를 배척할 수 있디{대판 2012.06.14. 2011 도15653).", "answer": "X"}, {"source": "17변시", "question": "「형사소송법」 제308조에 규정된 자유심증주의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사실섬 법원은 주장과 증거에 대하여 신중하고 충실한 심리를 하여야 하고, 그에 이르지 못하여 필요한 심리를 다하지 아니하는 등으로 판결 결과에 영향을 미친 때에는 사실인정을 사실심 법원의 전권으로 인정한 전제가 충족되지 아니하므로 이는 당연히 상고심의 심판대상에 해당한다.", "explanation": "사실심 법원으로서는, 형사소송법이 사실의 오인을 항소이유로는 하면서도 상고이유로 삼을 수 있는 사유로는 규정하지 아니한 데에 담긴 의미가 올바르게 실현될 수 있도록 주장과 증거에 대하여 신중하고 충실한 심리를 하여야 하고, 그에 이르지 못하여 자유심증주의의 한계를 벗어나거나 필요한 심리를 다하지 아니하는 등으로 판결 결과에 영향을 미친 때에는, 사실인정을 사실심 법원의 전권으로 인정한 전제가 충족되지 아니하므로 당연히 상고심의 심판대싱에 해당한다(대판 2016.10.13. 2015도17869).", "answer": "O"}, {"source": "17변시", "question": "「형사소송법」 제308조에 규정된 자유심증주의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "호흡측정기에 의한 음주측정치와 혈액검사에 의한 음주측정치가 다른 경우에 혈액채취에 의한 검사결과를 믿지 못할 특별한 사정이 없는 한, 혈액검사에 의한 음주측정치가 호흡측정기에 의한 측정치보다 측정 당시의 혈중알콜농도에 더 근접한 음주측정치라고 보는 것이 경험칙에 부합한다.", "explanation": "호흡측정기에 의한 음주측정치와 혈액검사에 의한 음주측정치가 다른 경우에 어느 음주측정치를 신뢰할 것인지는 법관의 자유심증에 의한 증거취사선택의 문제라고 할 것이나 호흡측정기에 의한 측정의 경우 그 측정기의 상태, 측정방법, 상대방의 협조정도 등에 의하여 그 측정결과의 정확성과 신뢰성에 문제가 있을 수 있디는 사정을 고려하면, 혈액의 채취 또는 검사과정에서 인위적인 조작이나 관계자의 잘못이 개입되는 등 혈액채취에 의한 검사결과를 믿지 못할 특별한 사정이 없는 한, 혈액검사에 의한 음주측정치가 호흡측정기에 의한 음주측정치보다 측정 당시의 혈중알콜농도에 더 근접한 음주측정치라고 보는 것이 경험칙에 부합한다 (대판 2004.02.13. 2003도6905) .", "answer": "O"}, {"source": "15변시", "question": "「형사소송법」상 자백배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판레메 의함)", "choice": "임의성이 인정되지 아니하여 증거능력이 없는 진술증거라도 피고인이 증거로 함에 동의하면 증거로 쓸 수 있다.", "explanation": "기록상 진술증거의 임의성에 관하여 의심할 만한 사정이 나타나 있는 경우에는 법원은 직권으로 그 임의성 여부에 관하여 조사를 하여야 하고, 임의성이 인정되지 아니하여 증거능력이 없는 진술증거는 피고인이 증거로 함에 동의하더라도 증거로 삼을 수 없다(대판 2006.11.23. 2004도7900) .", "answer": "X"}, {"source": "15변시", "question": "「형사소송법」상 자백배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판레메 의함)", "choice": "피고인이 수사기관에서 가흑행위 등으로 인하여 임의성 없는 자백을 하고, 그 후 법정에서도 임의성 없는 심리상태가 계속되어 동일한 내용의 자백을 하였다면 법정에서의 자백도 임의성 없는 자백이라고 보아야 한다.", "explanation": "피고인이 수사기관에서 가흑행위 등으로 인하여 임의성 없는 자백을 하고 그 후 법정에서도 임의성 없는 심리상태가 계속되어 동일한 내용의 자백을 하였다면 법정에서의 자백도 임의성 없는 자백이라고 보아야 한다(대판 2012.11.29. 2010도3029).", "answer": "O"}, {"source": "15변시", "question": "「형사소송법」상 자백배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판레메 의함)", "choice": "피고인의 자백이, 신문에 참여한 검찰수사관이 절도 피의사실을 모두 자백하면 피의사실 부분은 가볍게 처리하고 특정범죄가중처벌등에관한법률위반(절도)죄 대신 형법상 절도죄를 적용하겠다는 각서를 작성하여 주면서 자백을 유도한 것에 기인한 것이라 하여 위 자백이 기망에 의하여 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에 해당한다고 볼 수 없다.", "explanation": "판례는 가벼운 형으로 처벌 받도록 유도한 결과 얻어진 자백의 임의성을 부인한 바 있다.\n<판례> 피고인이 처음 검찰조사시에 범행을 부인하다가 뒤에 자백을 하는 과정에서 금 200만 원을 뇌물로 받은 것으로 하면 특정범죄가중처벌등에관한법률 위반으로 중형을 받게 되니 금 200 만 원 중 금 30 만 원을 술값을 갚은 것으로 조서를 허위작성한 것이라면 이는 단순 수뢰죄의 가벼운 형으로 처벌되도록 하겠다고 약속하고 자백을 유도한 것으로 위와 같은 상황하에서 한 자백은 그 임의성에 의심이 가고 따라서 진실성이 없다는 취지에서 이를 배척하였다 하여 자유심증주의의 한계를 벗어난 위법이 있다고는 할 수 없다(대판 1984.05.09. 83도2782) .", "answer": "X"}, {"source": "15변시", "question": "「형사소송법」상 자백배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판레메 의함)", "choice": "일정한 증거가 발견되면 피의자가 자백하겠다고 한 약속이 검사의 강요나 위계에 의하여 이루어졌디든가 또는 볼기소나 경한 죄의 소추 등 이익과 교환조건으로 된 것으로 인정되지 않는다면 이러한 약속 하에 한 자백이라 하여 곧 임의성 없는 자백이라 단정할 수 없다.", "explanation": "일정한 증거가 발견되면 피의자가 자백하겠다고 한 약속이 검사의 강요나 위계에 의하여 이루어졌다던가 또는 불기소나 경한 죄의 소추등 이익과 교환조건으로 된 것으로 인정되지 않는다면 위와 같은 자백의 약속하에 된 자백이라 하여 곧 임의성 없는 자백이라고 단정할 수는 없다(대판 1983.09.13. 83도712).", "answer": "O"}, {"source": "15변시", "question": "「형사소송법」상 자백배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판레메 의함)", "choice": "검사가 피의자에 대한 변호인의 접견을 부당하게 제한하고 있는 동안에 검사가 작성한 피의자신문조서는 증거능력이 없다.", "explanation": "헌법상 보장된 변호인과의 접견교통권이 위법하게 제한된 상태에서 얻어진 피의자의 자백은 그 증거능력을 부인하는 유죄의 증거에서 실질적이고 완전하게 배제하여야 하는 것인바, 피고인이 구속되어 국가안전기획부에서 조사를 받다가 변호인의 접견신청이 불허되어 이에 대한 준항고를 제기중에 검찰로 송치되어 검사가 피고인을 신문하여 제1회 피의자신문조서를 작성한 후 준항고절차에서 위 접견불허처분이 취소되어 접견이 허용된 경우에는 검사의 피고인에 대한 위 제1회 피의자신문은 변호인의 접견교통을 금지한 위법상태가 계속된 상황에서 시행된 것으로 보아야 할 것 이므로 그 피의자신문조서는 증거능력이 없다(대판 1990.09.25. 90도1586) .", "answer": "O"}, {"source": "14변시", "question": "피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 법정에서 甲은 공소사실을 부인하였으나 乙은 공소사실을 자백하였다. 이에 관한 설명 중 옳지 않은 것은? (다만, 조서는 모두 적법한 절차와 방식에 따라 작성되었고, 임의성과 특신상태가 인정텀을 전제로 하며, 다툼이 있는 경우에는 판례에 의함)", "choice": "甲이 사법경찰관 작성의  乙에 대한 피의자신문조서에 대하여 내용을 부인하면,  乙이 법정에서 그 조서에 대하여 진정성립을 인정하고 甲 이  乙을 반대 신문 하였더라도 그 피의자신문조서는 甲의 공소사실에 대한 증거로 사용할 수 없다.", "explanation": "판례는 제 312조 제3 항의 ‘피의자신문조서’에 공범인 공동피고인에 대한 ‘피의자신문조서 ’도 포함되는것으로 본다.\n<판례> 형사소송법 제 312 조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에 도 적용된다. 따라서 당해 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는, 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되는 등 형사소송법 제 312조 제4항의 요건을 갖춘 경우라고 하더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없다(대판 2009.07.09. 2009도2865) .", "answer": "O"}, {"source": "14변시", "question": "피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 법정에서 甲은 공소사실을 부인하였으나 乙은 공소사실을 자백하였다. 이에 관한 설명 중 옳지 않은 것은? (다만, 조서는 모두 적법한 절차와 방식에 따라 작성되었고, 임의성과 특신상태가 인정텀을 전제로 하며, 다툼이 있는 경우에는 판례에 의함)", "choice": "검사 작성의 乙에 대한 피의자신문조서는 乙이 법정에서 그 조서에 대하여 진정성립을 인정하고 甲이 乙을 반대신문 하였다면 甲 이 증거로 함에 부동의하였더라도 甲의 공소사실에 대한 증거로 사용할 수 있다.", "explanation": "2020. 2. 4. 법률 제 16924호로 개정되어 2022. 1.1.부터 시행된 형사소송법 제312조 제1항은 검사가 작성한 피의자신문조서의 증거능력에 대하여 ‘적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다고\n규정하였다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. 형사소송법 제312 조 제1항에서 정한 ‘검사가 작성한 피의자신문조서 ’란 당해 피고인에 대한 피의자신문조서만이 아니라\n당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범 관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023 도3741).\n--> 을은 갑과 필요적 공범의 관계에 있다, 개정 형사소송법 시행 후 판시된 위 판례에 의하면 검사 작성의 을에 대한 피의자신문조서를 갑이 내용부인의 취지로 부동의 하면, 갑의 공소사실에 대히여는 증거능력이 없다", "answer": "X"}, {"source": "14변시", "question": "피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 법정에서 甲은 공소사실을 부인하였으나 乙은 공소사실을 자백하였다. 이에 관한 설명 중 옳지 않은 것은? (다만, 조서는 모두 적법한 절차와 방식에 따라 작성되었고, 임의성과 특신상태가 인정텀을 전제로 하며, 다툼이 있는 경우에는 판례에 의함)", "choice": "乙이 피고인신문에서 甲 에게 뇌물공여사실을 자백한 진술은 甲의 乙에 대한 반대신문권이 보장되어 있어 甲의 공소사실에 대한 증거로 쓸 수 있지만 乙이 기억에 반하는 허위의 진술을 하더라도 위증죄가 성립하지 않는다.", "explanation": "헌법 제 12조 제 2 항은 ‘모든 국민은 형사상 자기에게 불리한 진술을 강요당하지 아니한다고 규정하고 있고 형사소송법 제 283조의2 제1항도 “피고인은 진술하지 아니하거나 개개의 질문에 대하여 진술을 거부할 수 있다 \"고 규정하고 있으므로, 공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있어 다른 공동피고인에 대한 공소 사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다(대판 2012.10.11. 2012도6848, 2012 전도143).\n--> 소송절차가 분리되지 아니한 이상, 을은 피고인의 지위에 있다 증인이 아닌 피고인의 지위에서 허위의 진술을 하였더라도 위증죄가 성립하지 않는다.\n형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 진술은 포함되지 않으며, 이러한 공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립한 증거능력이 있다(대판 1992.07.28. 92도917)\n--> 공범인 공동피고인 을이 피고인의 지위에서 한 진술이라도 갑에게 반대신문권이 보장되므로 갑의 공소사실에 대한 증거로 쓸 수 있다.", "answer": "O"}, {"source": "14변시", "question": "피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 법정에서 甲은 공소사실을 부인하였으나 乙은 공소사실을 자백하였다. 이에 관한 설명 중 옳지 않은 것은? (다만, 조서는 모두 적법한 절차와 방식에 따라 작성되었고, 임의성과 특신상태가 인정텀을 전제로 하며, 다툼이 있는 경우에는 판례에 의함)", "choice": "乙이 자신의 사업과 관련하여 그때그때의 수입과 지출을 기재해 놓은 금전출납부가 적법하게 압수되어 증거로 제출된 경우, 그 금전출납부에 甲에 대한 뇌물공여로 지출된 금액의 기재가 있는 경우에 이는 乙의 자백에 대한 보강증거가 될 수 있다.", "explanation": "상법장부나 항해일지, 진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계 없이 자기에게 맡겨진 사무를 처리한 사무 내역을 그때 그때 계속적 기계적으로 기재한 문서 등의 경우는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 그 존재 자체 및 기재가 그러한 내용의 사무가 처리되었음의 여부를 판단할 수 있는 별개의 독립된 증거자료이고 설사 그 문서가 우연히 피고인이 작성하였고 그 문서의 내용 중 피고인의 범죄사실의 존재를 추론해 낼 수 있는, 즉 공소사실에 일부 부합되는 사실의 기재가 있다고 하더라도, 이를 일컬어 피고인이 범죄사실을 자백하는 문서라고 볼 수는 없다(대판 1996.10.17. 94도2865(전합) ).", "answer": "O"}, {"source": "14변시", "question": "피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 법정에서 甲은 공소사실을 부인하였으나 乙은 공소사실을 자백하였다. 이에 관한 설명 중 옳지 않은 것은? (다만, 조서는 모두 적법한 절차와 방식에 따라 작성되었고, 임의성과 특신상태가 인정텀을 전제로 하며, 다툼이 있는 경우에는 판례에 의함)", "choice": "甲이 법정에서 乙로부터 뇌물을 수수한 사실을 부인하면서 공소사실 기재 일시경에 乙을 만났던 사실과 공무에 관한 청탁을 받은 사실만을 시인하였다면 이것만으로는 乙의 자백에 대한 보강증거가 될 수 없다.", "explanation": "자백에 대한 보강증거는 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라 직접증거가 아닌 간접 증거나 정황증거도 보강증거가 될 수 있다. 뇌물공여의 상대방인 공무원이 뇌물을 수수한 사실을 부인하면서도 그 일시경에 뇌물공여자를 만났던 사실 및 공무에 관한 청탁을 받기도 한 사실자체는 시인하였다면, 이는 뇌물을 공여하였다는 뇌물공여자의 자백에 대한 보강증거가 될 수 있다고 한 사례(대판 1995.06.30. 94도993) .", "answer": "X"}, {"source": "24변시", "question": "위법수집증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "임의제출된 정보저장매체에서 압수의 대상이 되는 전자정보의 범위를 넘어서는 전자정보에 대해 수사기관이 영장 없이 압수· 수색 하여 취득한 증거는 위법수집증거로서 증거능력이 없고, 설령 사후에 압수· 수색 영장이 발부되었거나 피고인이나 변호인이 이를 증거로 함에 동의하였더라도 그 위법성이 치유되지 않는다.", "explanation": "임의제출된 정보저장매체에서 압수의 대상이 되는 전자정보의 범위를 초과하여 수사기관이 임의로 전자정보를 탐색·복제·출력하는 것은 원칙적으로 위법한 압수수색에 해당하므로 허용될 수 없다. 만약 전자정보에 대한 압수수색이 종료되기 전에 범죄혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원으로부터 별도의 범죄혐의에 대한 압수수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수·수색을 할 수 있다. 따라서 임의제출된 정보저장매체에서 압수의 대상이 되는 전자 정보의 범위를 넘어서는 전자정보에 대해 수사기관이 영장 없이 압수·수색하여 취득한 증거는 위법수집증거에 해당하고, 사후에 법원으로부터 영장이 발부되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 그 위법성이 치유되는 것도 아니다(대판 2021.11.18. 2016도348( 전합)) .", "answer": "O"}, {"source": "24변시", "question": "위법수집증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 그 피의자의 진술은 설령 그 진술의 임의성이 인정되는 경우라도 증거능력이 부정되지만 이는 진술거부권을 고지 받지 못한 당해 피의자에 대하여 유죄의 증거로 사용할 수 없다는 의미이므로, 당해 피의자의 공범에 대하여는 유죄의 증거로 사용할 수 있다.", "explanation": "피의자의 진술을 녹취 내지 기재한 서류 또는 문서가 수사기관에서의 조사과정에서 작성된 것이라면, 그것이 ‘진술조서, 진술서, 자술서’리는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없고,한편 형사소송법이 보장하는 피의자의 진술거부권은 헌법이 보장하는 형사상 자기에 불리한 진술을 강요딩하지 않는 자기부죄거부의 권리에 터잡은 것이므로 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거능력이 부인되어야 한다 ... 공소외 1에 대한 진술조서가 진술조서의 형식을 취하였다고 하더라도 그 내용은 피의자의 진술을 기재한 피의자신문조서와 실질적으로 같고, 그런데도 기록상 검사가 공소외 1 의 진술을 들음에 있어 공소외 1 에게 미리 진술거부권이 있음을 고지한 사실을 인정할 만한 아무런 자료가 없으므로, 진술의 임의성이 인정되는 경우라도 위법하게 수집된 증거로서 증거능력이 없어 피고인에 대한 유죄의 증거로 쓸 수 없으며, 나아가 검사가 제출한 나머지 증거들만으로 피고인이 공소외 2, 공소외 1 등과 공모하여 2005. 1 1.경 대학가에 주체사상을 유포시키고 주사파 양성을 위한 전국적 단일 조직의 중앙지도부를 결성하고, 이를 위하여 대학가에 주체사상 학습CD 등을 조직적으로 제작· 배포하는 한편 이를 학습·토론함으로서 이적 활동을 찬양·동조하였다는 위 공소사실을 인정하기에는 부족하고, 달리 이를 인정할 만한 아무런 증거가 없다(대판 2009.08.20. 2008 도8213)", "answer": "X"}, {"source": "24변시", "question": "위법수집증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "범죄증거를 수집할 목적으로 피의자의 동의 없이 이루어지는 강제채뇨는 피의자에게 신체적 고통이나 장애를 초래하고 수치심이나 굴욕감을 주며 인간으로서의 존엄과 가치를 침해히는 수사방법이므로 「형사소송법」 제 215조에 따라 판사로부터 압수수색영장을 적법하게 발부받았더라도 허용되지 않는다.", "explanation": "수사기관이 범죄 증거를 수집할 목적으로 하는 강제 채뇨는 피의자의 신체에 직접적인 작용을 수반할 뿐만 아니라 피의자에게 신체적 고통이나 장애를 초래하거나 수치심이나 굴욕감을 줄 수 있다. 따라서 피의자에게 범죄 혐의가 있고 그 범죄가 중대한지, 소변성분 분석을 통해서 범죄 혐의를 밝힐 수 있는지, 범죄 증거를 수집하기 위하여 피의자의 신체에서 소변을 확보하는 것이 필요한 것인지, 채뇨가 아닌 다른 수단으로는 증명이 곤란한지 등을 고려하여 범죄 수사를 위해서 강제 채뇨가 부득이하다고 인정되는 경우에 최후의 수단으로 적법한 절차에 따라 허용된다고 보아야 한다. 이때 의사, 간호사, 그 밖의 숙련된 의료인 등으로 하여금 소변 채취에 적합한 의료장비와 시설을 갖춘 곳에서 피의자의 신체와 건강을 해칠 위험이 적고 피의자의 굴욕감 등을 최소화하는 방법으로 소변을 채취하여야 한다. 수사기관이 범죄 증거를 수집할 목적으로 피의자의 동의 없이 피의자의 소변을 채취하는 것은 법원으로부터 감정허가장을 받아 형사소송법 제221조의4 제1항, 제173조 제1항에서 정한 ‘감정에 필요한 처분’으로 할 수 있지만(피의자를 병원 등에 유치할 필요가 있는 경우에는 형사소송법 제221조의3에 따라 법원으로부터 감정유치장을 받아야 한다), 형사소송법 제219조, 제106조 제1항, 제109조에 따른 압수 • 수색의 방법으로도 할 수 있다. 이러한 압수 · 수색의 경우에도 수사기관은 원칙적으로 형사소송법 제215조에 따라 판사로부터 압수 • 수색영장을 적법하게 발부받아 집행해야 한다(대판 2018.07.12. 2018도6219).", "answer": "X"}, {"source": "24변시", "question": "위법수집증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수출입 물품 통관검사절차에서 이루어지는 물품의 개봉, 시료채취, 성분분석 등의 검사는 수출입 물품에 대한 적정한 통관 등을 목적으로 하는 것으로서 세관공무원은 압수·수색영장 없이 이러한 검사를 진행할 수 있지만, 세관공무원이 통관검사를 위하여 직무상 소지하거나 보관하는 물품에 대하여 수사기관이 점유를 취득하기 위해서는 사전 또는 사후에 영장을 받아야만 한다.", "explanation": "... 수출입물품 통관검사절차에서 이루어지는 물품의 개봉, 시료채취, 성분분석 등의 검사는 수출입물품에 대한 적정한 통관 등을 목적으로 조사를 하는 것으로서 이를 수사기관의 강제처분이라고 할 수 없으므로, 세관공무원은 압수수색영장 없이 이러한 검사를 진행할 수 있다. 세관공무원이 통관검사를 위하여 직무상 소지하거나 보관하는 물품을 수사기관에 임의로 제출한 경우에는 비록 소유자의 동의를 받지 않았더라도 수사기관이 강제로 점유를 취득하지 않은 이상 해당 물품을 압수하였다고 할 수 없다. 그러나 마약류 불법거래 방지에 관한 특례법 제 4 조 제 1 항에 따른 조치의 일환으로 특정한 수출입물품을 개봉하여 검사하고 그 내용물의 점유를 취득한 행위는 위에서 본 수출입물품에 대한 적정한 통관 등을 목적으로 조사를 하는 경우와는 달리, 범죄수사인 압수 또는 수색에 해당하여 사전 또는 사후에 영장을 받아야 한다 (대판 2017.07.18. 2014도8719) . \n-> 마약류 불법거래방지에 관한 특례법 제4조 제1항에 따른 조치가 수사기관의 압수수색에 해당하는 경우에는 영장주의 원칙이 적용됨", "answer": "X"}, {"source": "24변시", "question": "위법수집증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 문서위조를 위해 연습한 흔적이 남아 있는 업무일지는 공익과 사익을 비교형량할 때 피고인의 소송사기를 증명하기 위한 유죄의 증거로 사용할 수 있지만, 만약 그 업무일지가 제3자에 의하여 절취된 것이고 소송사기의 피해자가 대가를 지급하고 이를 취득한 것이라면 유죄의 증거로 사용할 수 없다.\n", "explanation": "이 사건 업무일지 그 자체는 피고인 경영의 주식회사 수복건설이 그날그날 현장 및 사무실에서 수행한 업무내용 등을 담당직원이 기재한 것이고 그 뒷면은 ... 이 사건 각 문서의 위조를 위해 미리 연습한 흔적이 남아 있는 것에 불과하여, 이를 피고인의 사생활 영역과 관계된 자유로운 인격권의 발현물이라고 볼 수는 없고, 사문서위조·위조사문서행사 및 소송사기로 이어지는 일련의 범행에 대하여 피고인을 형사소추하기 위해서는 이 사건 업무일지가 반드시 필요한 증거로 보이므로 설령 그것 이 제 3 자에 의하여 절취된 것으로서 위 소송사기 등의 피해자측이 이를 수사기관에 증거자료로 제출하기 위하여 대가를 지급하였다 하더라도, 공익의 실현을 위하여는 이 사건 업무일지를 범죄의 증거로 제출하는 것이 허용되어야 하고, 이로 말미암아 피고인의 사생활 영역을 침해하는 결과가 초래된다 하더라도 이는 피고인이 수인하여야 할 기본권의 제한에 해당된다(대판 2008.06.26. 2008도1584) .", "answer": "X"}, {"source": "23변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "헌법 제109조, 법원조직법 제57조 제1항에서 정한 재판의 공개금지사유가 없음에도 공개금지 결정에 따라 비공개로 진행된 증인신문절차에서 증인의 증언은 증거능력이 없고, 변호인의 반대신문권이 보장되었더라도 달리 볼 수 없다.", "explanation": "헌법 제 27 조 제 3 항 후문은 “형사피고인은 상당한 이유가 없는 한 지체 없이 공개재판을 받을 권리를 가진다\"고 규정하여 공개재판을 받을 권리가 형사피고인의 기본적 인권임을 선언하고 있고, 이에 따라 헌법 제 109 조는 “재판의 심리와 판결은 공개한다. 다만, 심리는 국가의 안정보장 또는 안녕질서를 방해하거나 선량한 풍속을 해할 염려가 있을 때에는 법원의 결정으로 공개하지 아니할 수 있다\"고 규정하고, 법원조직법 제 57 조 제 1 항도 “재판의 섬리와 판결은 공개한다. 다만 심리는 국가의 안전보장 안녕질서 또는 선량한 풍속을 해할 우려가 있는 때에는 결정으로 이를 공개하지 아니 할 수 있다\"고 규정하여 심리의 공개 금지사유를 엄격하게 제한하고 있는바 원심이 공소외인에 대한 증인신문절차의 공개 금지 사유로 삼은 위와 같은 사정이 ‘국가의 안녕질서를 방해할 우려가 있는 때’에 해당하지 아니함은 명백하고, 달리 기록상 헌법 제109 조, 법원조직법 제 57 조 제 1 항이 정한 공개금지사유를 찾아볼 수도 없으므로, 원심의 위와 같은 공개금지결정은 피고인의 공개 재판을 받을 권리를 침해한 것으로서 그 절차에 의하여 이루어진 공소외인의 증언은 증거능력이 없다고 할 것이고, 변호인의 반대신문권이 보장되었다 하더라도 달리 볼 수 없다 (대판 2005.10.28. 2005도5854) .", "answer": "O"}, {"source": "23변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 피의자신문시 피의자에게 미리 진술거부권을 고지하지 않았다고 하더라도 진술의 임의성이 인정되는 경우라면 증거능력이 인정된다.", "explanation": "형사소송법이 보장하는 피의자의 진술거부권은 헌법이 보장하는 형사상 자기에게 불리한 진술을 강요당하지 않는 자기부죄거부의 권리에 터잡은 것이므로, 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지 하지 않은 때에 는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거능력이 부인되어야 한다(대판 2009.08.20. 2008도8213) .", "answer": "X"}, {"source": "23변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검찰관이 형사사법공조절차를 거치지 아니한 채 외국으로 현지출장을 나가 참고인진술조서를 작성한 경우 조사 대상자가 우리나라 국민이고 조사에 스스로 응함으로써 조사의 방식이나 절차에 강제력이나 위력은 물론 어떠한 비자발적 요소도 개입될 여지가 없었고 피고인과 해당 국가 사이에 국제법상 관할의 원인이 될 만한 아무런 연관성이 없다면 위 참고인진술조서는 위법수집증거라고 할 수 없다.", "explanation": "검찰관이 피고인을 뇌물수수 혐의로 기소한 후 형사사법공조절차를 거치지 아니한 채 과테말라공화국에 현지출장하여 그곳 호텔에서 뇌물공여자 甲을 상대로 참고인 진술조서를 작성한 사안에서, 검찰관의 甲에 대한 참고인조사가 증거수집을 위한 수사행위에 해당하고 그 조사 장소가 우리나라가 아닌 과테말라 공화국의 영역에 속하기는 하나, 조사의 상대방이 우리나라 국민이고, 그가 조사에 스스로 응함으로써 조사의 방식이나 절차에 강제력이나 위력은 물론 어떠한 비자발적 요소도 개입될 여지가 없었음이 기록상 분명한 이상, 이는 서로 상대방 국민의 여행과 거주를 허용하는 우호국 사이에서 당연히 용인되는 우호국 국가기관과 그 국민 사이의 자유로운 의사연락의 한 형태에 지나지 않으므로 어떠한 영토주권 침해의 문제가 생겨날 수 없고, 더욱이 이 는 우리나라와 과테말라공화국 사이의 국제법적 문제로서 피고인은 그 일방인 과테말라공화국과 국제법상 관할의 원인이 될 만한 아무런 연관성도 갖지 아니하므로, 피고인에 대한 국내 형사소송절차에서 위와 같은 사유로 인하여 위법수집 증거 배제법칙이 적용된다고 볼 수 없다고 한 사례(대판 2011.07.14. 2011 도3809).", "answer": "O"}, {"source": "23변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피해자 등 제 3자가 피의자의 소유·관리에 속하는 정보저장매체를 영장에 의하지 않고 임의제출한 경우에는 특별한 사정이 없는 한 피의지에게도 참여권을 보장하고 입수한 전자정보 목록을 교부하는 등 피의자의 절차적 권리를 보장하기 위한 적절한 조치가 이루어져야 한다.", "explanation": "피해자 등 제 3자가 피의자의 소유·관리에 속하는 정보저장매체를 영장에 의하지 않고 임의제출한 경우에는 실질적 피압수수색 당사자(이하 ‘피압수자’라 한다)인 피의자가 수사기관으로 하여금 그 전자정보전부를 무제한 탐색하는 데 동의한 것으로 보기 어려울 뿐만 아니라 피의자 스스로 임의제출한 경우 피의자의 참여권 등이 보장되어야 하는 것과 견주어 보더라도 특별한 사정이 없는 한 형사소송법 제 219 조, 제121 조, 제129 조에 따라 피의자에게 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피의자의 절차적 권리를 보장하기 위한 적절한 조치가 이루어져야 한다(대판 2022.01.27. 2021도11170).", "answer": "O"}, {"source": "23변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "범행현장에서 지문채취 대상물에 대한 지문채취가 먼저 이루어진 이상, 수사기관이 그 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 입수하였다고 하더라도 위와 같이 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 않는다.", "explanation": "범행 현장에서 지문채취 대상물에 대한 지문채취가 먼저이 루어진 이상, 수사기관이 그 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 압수하였다고 하더라도 (한편 이 사건 지문채취 대상물인 맥주컵, 물컵, 맥주병 등은 피해자 공소외 1 이 운영하는 주점 내에 있던 피해자 공소외 1 의 소유로서 이를 수거한 행위가 피해자 공소외 1의 의사에 반한 것이라고 볼 수 없으므로 이를 가리켜 위법한 압수라고 보기도 어렵다) , 위와 같이 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2 차적 증거에 해당하지 아니힘어 분명하여, 이를 가리켜 위법수집 증거라고 할 수 없으므로, 원심이 이를 증거로 채택한 것이 위법하다고 할 수 없다. 이 점에 관한 상고이유의 주장은 받아들일 수 없다 (대판 2008.10.23. 2008도7471).", "answer": "O"}, {"source": "22변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관이 피고인이 아닌 A를 사실상 강제연행하여 불법체포한 상태에서 피고인의 행 위를 처벌하기 위해 A에게 자술서를 받은 경우, 이를 피고인에 대한 유죄 인정의 증거로 사용할 수 없다.", "explanation": "유흥주점 업주와 종업원인 피고인들이 영업장을 벗어나 시간적 소요의 대가로 금품을 받아서는 아니 되는데도, 이른바 '티켓영업' 형태로 성매매를 하면서 금품을 수수하였다고 하여 구 식품위생법(2007. 12. 21. 법률 제8779호로 개정되기 전의 것) 위반으로 기소된 사안에서, 경찰이 피고인 아닌 甲, 乙을 사실상 강제연행하여 불법체포한 상태에서 甲, 乙 간의 성매매행위나 피고인들의 유흥업소 영업행위를 처벌하기 위하여 甲, 乙에게서 자술서를 받고 甲, 乙에 대한 진술조서를 작성한 경우, 위 각 자술서와 진술조서는 헌법과 형사소송법이 규정한 체포·구속에 관한 영장주의 원칙에 위배하여 수집된 것으로서 수사기관이 피 고인 아닌 자를 상대로 적법한 절차에 따르지 아니하고 수집한 증거에 해당하여 형사소송법 제308조의2 에 따라 증거능력이 부정된다(대판 2011.06.30. 2009도6717).", "answer": "O"}, {"source": "22변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 피의자 甲의 범행을 영장 범죄사실로 하여 발부받은 압수·수색영장의 집행 과 정에서 A와 B 사이의 대화가 녹음된 녹음파일을 압수하였는데, 그 녹음파일에서 발견된 A 와 B의 범죄 혐의사실이 위 압수·수색영장에 기재된 피의자 甲과 무관한 경우 그 녹음파일 을 A와 B에 대한 유죄 인정의 증거로 사용할 수 없다.", "explanation": "수사기관이 피의자 갑의 공직선거법 위반 범행을 영장 범죄사실로 하여 발부받은 압수·수색영장의 집행 과정에서 을, 병 사이의 대화가 녹음된 녹음파일(이하 '녹음파일'이라 한다)을 압수하여 을, 병의 공 직선거법 위반 혐의사실을 발견한 경우, 압수·수색영장에 기재된 '피의자'인 갑이 녹음파일에 의하여 의심 되는 혐의사실과 무관한 이상, 수사기관이 별도의 압수·수색영장을 발부받지 아니한 채 압수한 녹음파일 은 형사소송법 제219조에 의하여 수사기관의 압수에 준용되는 형사소송법 제106조 제1항이 규정하는 '피 고사건' 내지 같은 법 제215조 제1항이 규정하는 '해당 사건'과 '관계가 있다고 인정할 수 있는 것'에 해당 하지 않으며, 이와 같은 압수에는 헌법 제12조 제1항 후문, 제3항 본문이 규정하는 영장주의를 위반한 절 차적 위법이 있으므로, 녹음파일은 형사소송법 제308조의2에서 정한 '적법한 절차에 따르지 아니하고 수 집한 증거'로서 증거로 쓸 수 없고, 그 절차적 위법은 헌법상 영장주의 내지 적법절차의 실질적 내용을 침 해하는 중대한 위법에 해당하여 예외적으로 증거능력을 인정할 수도 없다(대판 2014.01.16. 2013도7101).", "answer": "O"}, {"source": "22변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "적법한 공개금지사유가 없음에도 불구하고 공개금지결정에 따라 비공개로 진행된 증인신 문절차에 의하여 이루어진 증인의 증언은 변호인의 반대신문권이 보장되었다고 하더라도 증거능력이 없다.", "explanation": "헌법 제27조 제3항 후문, 제109조와 법원조직법 제57조 제1항, 제2항의 취지에 비추어 보면, 헌법 제109조, 법원조직법 제57조 제1항에서 정한 공개금지사유가 없음에도 불구하고 재판의 심리에 관한 공 개를 금지하기로 결정하였다면 그러한 공개금지결정은 피고인의 공개재판을 받을 권리를 침해한 것으로 서 그 절차에 의하여 이루어진 증인의 증언은 증거능력이 없고, 변호인의 반대신문권이 보장되었더라도 달리 볼 수 없으며, 이러한 법리는 공개금지결정의 선고가 없는 등으로 공개금지결정의 사유를 알 수 없 는 경우에도 마찬가지이다(대판 2013.07.26. 2013도2511).", "answer": "O"}, {"source": "22변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형사소송법」의 규정을 위반하여 소유자, 소지자 또는 보관자가 아닌 피해자로부터 제출받은 물건을 영장 없이 압수한 경우 그 압수물을 유죄 인정의 증거로 사용할 수 없다.", "explanation": "형사소송법 제218조는 '사법경찰관은 소유자, 소지자 또는 보관자가 임의로 제출한 물건을 영장 없이 압수할 수 있다'고 규정하고 있는바, 위 규정을 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 제출받은 물건을 영장 없이 압수한 경우 그 압수물 및 압수물을 찍은 사진은 이를 유죄 인정의 증거로 사 용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인 이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다(대판 2010.01.28. 2009도10092).", "answer": "O"}, {"source": "22변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 피의자의 범의를 명백하게 하기 위하여 A를 참고인으로 조사하는 과정에서 진술거부권을 고지하지 않고 진술조서를 작성하였는데, 추후 계속된 수사를 통하여 A가 피의자와 공범관계에 있을 가능성이 인정되었다면 A에 대한 위 조사 당시 A는 이미 피의자의 지위에 있었다고 볼 수 있으므로 A에 대한 위 진술조서는 증거능력이 없다.", "explanation": "피고인들이 중국에 있는 甲과 공모한 후 중국에서 입국하는 乙을 통하여 필로폰이 들어 있는 곡물 포대를 배달받는 방법으로 필로폰을 수입하였다고 하여 주위적으로 기소되었는데 검사가 乙에게서 곡물포 대를 건네받아 피고인들에게 전달하는 역할을 한 참고인 丙에 대한 검사 작성 진술조서를 증거로 신청한 사안에서, 피고인들과 공범관계에 있을 가능성만으로 丙이 참고인으로서 검찰 조사를 받을 당시 또는 그 후라도 검사가 丙에 대한 범죄혐의를 인정하고 수사를 개시하여 피의자 지위에 있게 되었다고 단정할 수 없고, 검사가 丙에 대한 수사를 개시할 수 있는 상태이었는데도 진술거부권 고지를 잠탈할 의도로 피의자 신문이 아닌 참고인 조사의 형식을 취한 것으로 볼 만한 사정도 기록상 찾을 수 없으며, 오히려 피고인들 이 수사과정에서 필로폰이 중국으로부터 수입되는 것인지 몰랐다는 취지로 변소하였기 때문에 피고인들 의 수입에 관한 범의를 명백하게 하기 위하여 丙을 참고인으로 조사한 것이라면, 丙은 수사기관에 의해 범죄 혐의를 인정받아 수사가 개시된 피의자의 지위에 있었다고 할 수 없고 참고인으로서 조사를 받으면서 수 사기관에게서 진술거부권을 고지받지 않았다는 이유만으로 그 진술조서가 위법수집증거로서 증거능력이 없다고 할 수 없는데도, 아무런 객관적 자료 없이 丙이 피고인들 범행의 공범으로서 피의자 지위에 있다고 단정한 후 진술거부권 불고지로 인하여 丙에 대한 진술조서의 증거능력이 없다고 본 원심판결에는 법리오 해의 위법이 있고, 이러한 위법은 주위적 공소사실을 무죄로 인정한 판결 결과에 영향을 미쳤다(대판 2011. 11.10. 201158125).", "answer": "X"}, {"source": "21변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳은 것(○)과 옳지 않은 것(x)을 올바르게 조합한 것 은? (다툼이 있는 경우 판례에 의함)", "choice": "위법한 체포 상태에서 음주측정요구가 이루어진 경우, 음주측정요구를 위한 위법한 체 포와 그에 이은 음주측정요구는 주취운전이라는 범죄행위에 대한 증거 수집을 위하여 연속하여 이루어진 것으로서 그 일련의 과정을 전체적으로 보아 위법한 음주측정 요구가 있었던 것으로 볼 수 밖에 없다.", "explanation": "위법한 체포 상태에서 음주측정요구가 이루어진 경우, 음주측정요구를 위한 위법한 체포와 그에 이 은 음주측정요구는 주취운전이라는 범죄행위에 대한 증거 수집을 위하여 연속하여 이루어진 것으로서 개 별적으로 그 적법 여부를 평가하는 것은 적절하지 않으므로 그 일련의 과정을 전체적으로 보아 위법한 음주측정요구가 있었던 것으로 볼 수밖에 없다(대판 2006.11.09. 2004도8404).", "answer": "O"}, {"source": "21변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳은 것(○)과 옳지 않은 것(x)을 올바르게 조합한 것 은? (다툼이 있는 경우 판례에 의함)", "choice": "법관이 압수·수색영장을 발부하면서 '압수할 물건'을 특정하기 위하여 기재한 문언은 이 를 엄격하게 해석하여야 하므로, 압수·수색영장의 범죄사실과 기본적 사실관계가 동일 한 범행 또는 동종·유사의 범행과 관련된다고 의심할만한 상당한 이유가 있는 물건까지 압수하였다면 위법한 압수에 해당한다.", "explanation": "헌법과 형사소송법이 구현하고자 하는 적법절차와 영장주의의 정신에 비추어 볼 때, 법관이 압수수색영장을 발부하면서 '압수할 물건'을 특정하기 위하여 기재한 문언은 이를 엄격하게 해석하여야 하고, 함부로 피압수자 등에게 불리한 내용으로 확장 또는 유추해석하는 것은 허용될 수 없다. 그러나 압수의 대상을 압수수색영장의 범죄사실 자체와 직접적으로 연관된 물건에 한정할 것은 아니고, 압수수색영장의 범죄사실과 기본적 사실관계가 동일한 범행 또는 동종·유사의 범행과 관련된다고 의심할 만한 상당한 이 유가 있는 범위 내에서는 압수를 실시할 수 있다(대판 2018.10.12. 2018도6252).", "answer": "X"}, {"source": "21변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳은 것(○)과 옳지 않은 것(x)을 올바르게 조합한 것 은? (다툼이 있는 경우 판례에 의함)", "choice": "3인 간의 대화에 있어서 그중 한 사람이 그 대화를 녹음하는 경우에 다른 두 사람의 발 언은 그 녹음자에 대한 관계에서 '타인 간의 대화'라고 할 수 있으므로, 이와 같은 녹음 행위는 「통신비밀보호법」 제3조 제1항에 위배된다.", "explanation": "통신비밀보호법 제3조 제1항이 \"공개되지 아니한 타인간의 대화를 녹음 또는 청취하지 못한다\"라고 정한 것은, 대화에 원래부터 참여하지 않는 제3자가 그 대화를 하는 타인들 간의 발언을 녹음해서는 아니 된다는 취지이다. 3인 간의 대화에 있어서 그 중 한 사람이 그 대화를 녹음하는 경우에 다른 두 사람의 발언은 그 녹음자에 대한 관계에서 '타인 간의 대화'라고 할 수 없으므로, 이와 같은 녹음행위가 통신비밀 보호법 제3조 제1항에 위배된다고 볼 수는 없다(대판 2006.10.12. 2006도4981).", "answer": "X"}, {"source": "21변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳은 것(○)과 옳지 않은 것(x)을 올바르게 조합한 것 은? (다툼이 있는 경우 판례에 의함)", "choice": "음주운전과 관련한 도로교통법위반죄의 범죄수사를 위하여 미성년자인 피의자의 혈액 채취가 필요한 경우에도 피의자에게 의사능력이 있다면 피의자 본인만이 혈액 채취에 관한 유효한 동의를 할 수 있고, 피의자에게 의사능력이 없는 경우에도 명문의 규정이 없는 이상 법정대리인이 피의자를 대리하여 동의할 수는 없다.", "explanation": "형사소송법상 소송능력이란 소송당사자가 유효하게 소송행위를 할 수 있는 능력, 즉 피고인 또는 피의자가 자기의 소송상의 지위와 이해관계를 이해하고 이에 따라 방어행위를 할 수 있는 의사능력을 의미 하는데, 피의자에게 의사능력이 있으면 직접 소송행위를 하는 것이 원칙이고, 피의자에게 의사능력이 없는 경우에는 형법 제9조 내지 제11조의 규정의 적용을 받지 아니하는 범죄사건에 한하여 예외적으로 법정대 리인이 소송행위를 대리할 수 있다(형사소송법 제26조). 따라서 음주운전과 관련한 도로교통법 위반죄의 범죄수사를 위하여 미성년자인 피의자의 혈액채취가 필요한 경우에도 피의자에게 의사능력이 있다면 피 의자 본인만이 혈액채취에 관한 유효한 동의를 할 수 있고, 피의자에게 의사능력이 없는 경우에도 명문의 규정이 없는 이상 법정대리인이 피의자를 대리하여 동의할 수는 없다(대판 2014.11.13. 2013도1228).", "answer": "O"}, {"source": "20변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "호텔 투숙객 甲이 마약을 투약하였다는 신고를 받고 출동한 경찰관이 임의동행을 거부 하는 甲을 강제로 경찰서로 데리고 가서 채뇨 요구를 하자 이에 甲이 응하여 소변검사 가 이루어진 경우, 그 결과물인 소변검사시인서는 증거능력이 없다.", "explanation": "[1] 피의자가 동행을 거부하는 의사를 표시하였음에도 불구하고 경찰관들이 영장에 의하지 아니하고 피의자를 강제로 연행한 행위는 수사상의 강제처분에 관한 형사소송법상의 절차를 무시한 채 이루어진 것으로 위법한 체포에 해당하고, 이와 같이 위법한 체포상태에서 마약 투약 혐의를 확인하기 위한 채뇨 요구가 이루어진 경우, 채뇨 요구를 위한 위법한 체포와 그에 이은 채뇨 요구는 마약 투약이라는 범죄행 위에 대한 증거 수집을 위하여 연속하여 이루어진 것으로서 개별적으로 그 적법 여부를 평가하는 것은 적절하지 아니하므로 그 일련의 과정을 전체적으로 보아 위법한 채뇨 요구가 있었던 것으로 볼 수밖에 없다. 소변검사 사인서는 위법한 채뇨요구에 의한 것으로 위법수집증거에 해당한다. [2] 마약 투약 혐의를 받고 있던 피고인이 임의동행을 거부하겠다는 의사를 표시하였는데도 경찰관들이 피고인을 영장 없이 강제로 연행 한 상태에서 마약 투약 여부의 확인을 위한 1차 채뇨절차가 이루어졌는데, 그 후 압수영장에 기하여 2차 채뇨절차가 이루어지고 그 결과를 분석한 소변 감정서 등이 증거로 제출된 사안에서, 1차 채뇨 요구에 의 하여 수집된 증거는 증거능력이 없으나, 제반 사정을 고려할 때 2차적 증거인 소변 감정서 등은 증거능력 이 인정된다(대판 2013.03.14. 2012도13611).", "answer": "O"}, {"source": "20변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "음주운전 피의자에 대해 위법한 강제연행 상태에서 호흡측정방법에 의한 음주측정을 한 다음, 즉시 그 자리에서 피의자가 자신의 호흡측정 결과에 대한 탄핵을 하기 위하여 스스로 혈액채취방법에 의한 측정을 할 것을 요구하여 혈액채취가 이루어진 경우, 호흡측 정에 의한 측정결과는 물론 혈액채취에 의한 측정결과도 증거능력이 없다.", "explanation": "위법한 강제연행 상태에서 호흡측정 방법에 의한 음주측정을 한 다음 강제연행 상태로부터 시간적·장소적으로 단절되었다고 볼 수도 없고 피의자의 심적 상태 또한 강제연행 상태로부터 완전히 벗어났다고 볼 수 없는 상황에서 피의자가 호흡측정 결과에 대한 탄핵을 하기 위하여 스스로 혈액채취 방법에 의한 측정을 할 것을 요구하여 혈액채취가 이루어졌다고 하더라도 그 사이에 위법한 체포 상태에 의한 영향이 완전하게 배제되고 피의자의 의사결정의 자유가 확실하게 보장되었다고 볼 만한 다른 사정이 개입되지 않 은 이상 불법체포와 증거수집 사이의 인과관계가 단절된 것으로 볼 수는 없다. 따라서 그러한 혈액채취에 의한 측정 결과 역시 유죄 인정의 증거로 쓸 수 없다고 보아야 한다. 그리고 이는 수사기관이 위법한 체포 상태를 이용하여 증거를 수집하는 등의 행위를 효과적으로 억지하기 위한 것이므로, 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여도 달리 볼 것은 아니다(대판 2013.03.14. 2010도2094).", "answer": "O"}, {"source": "20변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 甲의 뇌물수수 범행을 범죄사실로 하여 발부받은 압수수색영장을 집행하는 과정에 乙과 丙 사이의 甲과 무관한 별개의 뇌물수수에 관한 대화가 녹음된 녹음파일 을 발견한 경우, 별도의 압수수색영장을 발부받지 않더라도 위 녹음파일을 乙과 丙 에 대한 뇌물수수죄의 증거로 사용할 수 있다.", "explanation": "사법기관이 피의자 甲의 공직선거법 위반 범행을 영장 범죄사실로 하여 발부받은 압수·수색영장의 집 행 과정에서 乙 丙 사이의 대화가 녹음된 녹음파일(이하 '녹음파일'이라 한다)을 압수하여 乙 丙의 공직선거법 위반 혐의사실을 발견한 사안에서, 압수·수색영장에 기재된 '피의자'인 甲이 녹음파일에 의하여 의 심되는 혐의사실과 무관한 이상, 수사기관이 별도의 압수·수색영장을 발부받지 아니한 채 압수한 녹음파 일은 형사소송법 제219조에 의하여 수사기관의 압수에 준용되는 형사소송법 제106조 제1항이 규정하는 '피고사건' 내지 같은 법 제215조 제1항이 규정하는 '해당 사건'과 '관계가 있다고 인정할 수 있는 것'에 해 당하지 않으며, 이와 같은 압수에는 헌법 제12조 제1항 후문, 제3항 본문이 규정하는 영장주의를 위반한 절차적 위법이 있으므로, 녹음파일은 형사소송법 제308조의2에서 정한 '적법한 절차에 따르지 아니하고 수집한 증거'로서 증거로 쓸 수 없고, 그 절차적 위법은 헌법상 영장주의 내지 적법절차의 실질적 내용을 침해하는 중대한 위법에 해당하여 예외적으로 증거능력을 인정할 수도 없다(대판 2014.01.16. 2013도7101).", "answer": "X"}, {"source": "20변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 甲을 긴급체포하여 조사 중, 甲의 친구인 변호사 A가 甲의 변호인이 되기 위하 여 검사에게 접견신청을 하였으나, 검사가 변호인선임신고서의 제출을 요구하면서 변호 인 접견을 못하게 한 상태에서 검사가 작성한 甲에 대한 피의자신문조서는 甲에 대한 유죄의 증거로 사용할 수 없다.", "explanation": "헌법상 보장된 변호인과의 접견교통권이 위법하게 제한된 상태에서 얻어진 피의자의 자백은 그 증거능력을 부인하는 유죄의 증거에서 실질적이고 완전하게 배제하여야 하는 것인바, 피고인이 구속되어 국가안전기획부에서 조사를 받다가 변호인의 접견신청이 불허되어 이에 대한 준항고를 제기중에 검찰로 송치되어 검사가 피고인을 신문하여 제1회 피의자신문조서를 작성한 후 준항고절차에서 위 접견불허처 분이 취소되어 접견이 허용된 경우에는 검사의 피고인에 대한 위 제1회 피의자신문은 변호인의 접견교통 을 금지한 위법상태가 계속된 상황에서 시행된 것으로 보아야 할 것이므로 그 피의자신문조서는 증거능 력이 없다(대판 1990.09.25. 90도1586).", "answer": "O"}, {"source": "20변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인의 뇌물수수 범행에 대한 추가적인 증거를 확보할 목적으로, 수사기관이 구속 수감되어 있던 A에게 휴대전화를 제공하여 피고인과 통화하게 하고 그 통화내용을 녹음 하게 한 경우, 이를 근거로 작성된 녹취록은 피고인이 증거로 함에 동의하면 증거능력이 있다.", "explanation": "수사기관이 甲으로부터 피고인의 마약류관리에 관한 법률 위반(향정) 범행에 대한 진술을 듣고 추 가적인 증거를 확보할 목적으로, 구속수감되어 있던 甲에게 그의 압수된 휴대전화를 제공하여 피고인과 통화하고 위 범행에 관한 통화 내용을 녹음하게 한 행위는 불법감청에 해당하므로, 그 녹음 자체는 물론 이를 근거로 작성된 녹취록 첨부 수사보고는 피고인의 증거동의에 상관없이 그 증거능력이 없다(대판 20 10.10.14. 201059016).", "answer": "X"}, {"source": "15변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "범행 현장에서 지문채취 대상물에 대한 지문채취가 먼저 이루어지고 수사기관이 그 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 압수한 경우, 압수 이전에 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하므로 위법수집증거이다.", "explanation": "원심이 적법하게 채택한 증거들에 의하면, 피해자 공소외 1의 신고를 받고 현장에 출동한 인천남동경찰서 과학수사팀 소속 경장 공소외 2는 피해자 공소외 1이 범인과 함께 술을 마신 테이블 위에 놓여 있던 맥주컵에서 지문 6점을, 물컵에서 지문 8점을, 맥주병에서 지문 2점을 각각 현장에서 직접 채취하였음을 알 수 있는바, 이와 같이 범행 현장에서 지문채취 대상물에 대한 지문채취가 먼저 이루어진 이상, 수사기 관이 그 이후에 지문채취대상물을 적법한 절차에 의하지 아니한 채 압수하였다고 하더라도(한편, 이 사건 지문채취 대상물인 맥주컵, 물컵, 맥주병 등은 피해자 공소외 1이 운영하는 주점 내에 있던 피해자 공소 외 1의 소유로서 이를 수거한 행위가 피해자 공소외 1의 의사에 반한 것이라고 볼 수 없으므로, 이를 가리 켜 위법한 압수라고 보기도 어렵다), 위와 같이 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 아니함이 분명하여, 이를 가리켜 위법수집증거라고 할 수 없으므로, 원심 이 이를 증거로 채택한 것이 위법하다고 할 수 없다(대판 2008.10.23. 2008도7471).", "answer": "X"}, {"source": "15변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "우편물 통관검사절차에서 이루어지는 우편물의 개봉, 시료채취, 성분분석 등의 검사는 수출입 물품에 대한 적정한 통관 등을 목적으로 한 행정조사의 성격을 가지는 것으로서 수사 기관의 강제처분이라고 할 수 없으므로, 압수·수색영장 없이 우편물의 개봉, 시료채취, 성분분석 등 검사가 진행되었다고 하더라도 특별한 사정이 없는 한 위법하다고 볼 수 없다.", "explanation": "관세법 제246조 제1항, 제2항, 제257조, '국제우편물 수입통관 사무처리'(2011. 9. 30. 관세청고시제2011-40호) 제1-2조 제2항, 제1-3조, 제36조, 구 '수출입물품 등의 분석사무 처리에 관한 시행세 칙'(2013. 1. 4. 관세청훈령 제1507호로 개정되기 전의 것) 등과 관세법이 관세의 부과·징수와 아울러 수출입물품의 통관을 적정하게 함을 목적으로 한다는 점(관세법 제1조)에 비추어 보면, 우편물 통관검사 절차에서 이루어지는 우편물의개봉, 시료채취, 성분분석 등의 검사는 수출입물품에 대한 적정한 통관 등 을 목적으로 한 행정조사의 성격을 가지는 것으로서 수사기관의 강제처분이라고 할 수 없으므로, 압수. 수색영장 없이 우편물의 개봉, 시료채취, 성분분석 등 검사가 진행되었다 하더라도 특별한 사정이 없는 한 위법하다고 볼 수 없다(대판 2013.09.26. 2013도7718).", "answer": "O"}, {"source": "15변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 법관의 영장에 의하지 아니하고 신용카드 매출전표의 거래명의자에 관한 정보 를 획득한 경우, 이에 터잡아 수집한 2차적 증거들의 증거능력을 판단할 때, 수사기관이 의 도적으로 영장주의의 정신을 회피하는 방법으로 증거를 확보한 것이 아니라고 볼 만한 사 정, 체포되었던 피의자가 석방된 후 상당한 시간이 경과하였음에도 다시 동일한 내용의 자 백을 하였다거나 그 범행의 피해품을 수사기관에 임의로 제출하였다는 사정 등은 통상 2차 적 증거의 증거능력을 인정할 만한 정황에 속한다.", "explanation": "수사기관이 법관의 영장에 의하지 아니하고 매출전표의 거래명의자에 관한 정보를 획득한 경우, 이에 터 잡아 수집한 2차적 증거들, 예컨대 피의자의 자백이나 범죄 피해에 대한 제3자의 진술 등이 유죄 인정의 증거로 사용될 수 있는지를 판단할 때, 수사기관이 의도적으로 영장주의의 정신을 회피하는 방법 으로 증거를 확보한 것이 아니라고 볼 만한 사정, 위와 같은 정보에 기초하여 범인으로 특정되어 체포 되었던 피의자가 석방된 후 상당한 시간이 경과하였음에도 다시 동일한 내용의 자백을 하였다거나 그 범행 의 피해품을 수사기관에 임의로 제출하였다는 사정, 2차적 증거 수집이 체포 상태에서 이루어진 자백 등 으로부터 독립된 제3자의 진술에 의하여 이루어진 사정 등은 통상 2차적 증거의 증거능력을 인정할 만한 정황에 속한다고 볼 수 있다(대판 2013.03.28. 2012도13607).", "answer": "O"}, {"source": "15변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "위법한 강제연행 상태에서 호흡측정방법에 의한 음주측정을 한 다음, 강제연행 상태로부터 시간적·장소적으로 단절되었다고 볼 수 없는 상황에서 피의자가 호흡측정결과를 탄핵하기 위하여 스스로 혈액채취방법에 의한 측정을 할 것을 요구하여 혈액채취가 이루어진 경우 그러한 혈액채취에 의한 측정 결과를 유죄 인정의 증거로 쓸 수는 없다.", "explanation": "위법한 강제연행 상태에서 호흡측정 방법에 의한 음주측정을 한 다음 강제연행 상태로부터 시간적·장소적으로 단절되었다고 볼 수도 없고 피의자의 심적 상태 또한 강제연행 상태로부터 완전히 벗어났다 고 볼 수 없는 상황에서 피의자가 호흡측정 결과에 대한 탄핵을 하기 위하여 스스로 혈액채취 방법에 의 한 측정을 할 것을 요구하여 혈액채취가 이루어졌다고 하더라도 그 사이에 위법한 체포 상태에 의한 영향 이 완전하게 배제되고 피의자의 의사결정의 자유가 확실하게 보장되었다고 볼 만한 다른 사정이 개입되지 않은 이상 불법체포와 증거수집 사이의 인과관계가 단절된 것으로 볼 수는 없다. 따라서 그러한 혈액채취 에 의한 측정 결과 역시 유죄 인정의 증거로 쓸 수 없다고 보아야 한다. 그리고 이는 수사기관이 위법한 체포 상태를 이용하여 증거를 수집하는 등의 행위를 효과적으로 억지하기 위한 것이므로, 피고인이나 변 호인이 이를 증거로 함에 동의하였다고 하여도 달리 볼 것은 아니다(대판 2013.03.14. 2010도2094).", "answer": "O"}, {"source": "15변시", "question": "위법수집증거배제법칙에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "마약 투약 혐의를 받고 있던 피고인을 경찰관들이 영장 없이 강제로 연행한 상태에서 마약 투약 여부의 확인을 위한 1차 채뇨절차가 이루어졌다고 하더라도, 그후 피고인이 법관이 발부한 영장에 의하여 적법하게 구금되고, 압수·수색영장에 의하여 2차 채뇨 및 채모절차 가 적법하게 이루어진 이상, 이와 같은 사정은 체포과정에서의 절차적 위법과 2차적 증거 수집 사이의 인과관계를 희석하게 할 만한 정황에 속한다.", "explanation": "마약 투약 혐의를 받고 있던 피고인이 임의동행을 거부하겠다는 의사를 표시하였는데도 경찰관들이 피고인을 영장 없이 강제로 연행한 상태에서 마약 투약 여부의 확인을 위한 1차 채뇨절차가 이루어졌는데, 그 후 피고인의 소변 등 채취에 관한 압수영장에 기하여 2차 채절차가 이루어지고 그 결과를 분석한 소변 감정서 등이 증거로 제출된 사안에서, 피고인을 강제로 연행한 조치는 위법한 체포에 해당하고, 위법한 체 포상태에서 이루어진 채뇨 요구 또한 위법하므로 그에 의하여 수집된 '소변검사시인서'는 유죄 인정의 증 거로 삼을 수 없으나, 한편 연행 당시 피고인이 마약을 투약한 것이거나 자살할지도 모른다는 취지의 구체적 제보가 있었던 데다가, 피고인이 경찰관 앞에서 바지와 팬티를 내리는 등 비상식적인 행동을 하였던 사정 등에 비추어 피고인에 대한 긴급한 구호의 필요성이 전혀 없었다고 볼 수 없는 점, 경찰관들은 임의동행시 점으로부터 얼마 지나지 아니하여 체포의 이유와 변호인 선임권 등을 고지하면서 피고인에 대한 긴급체포 의 절차를 밟는 등 절차의 잘못을 시정하려고 한 바 있어, 경찰관들의 위와 같은 임의동행조치는 단지 수사 의 순서를 잘못 선택한 것이라고 할 수 있지만 관련 법규정으로부터의 실질적 일탈 정도가 헌법에 규정된 영장주의 원칙을 현저히 침해할 정도에 이르렀다고 보기 어려운 점 등에 비추어 볼 때, 위와 같은 2차적 증거 수집이 위법한 체포 구금절차에 의하여 형성된 상태를 직접 이용하여 행하여진 것으로는 쉽사리 평 가할 수 없으므로, 이와 같은 사정은 체포과정에서의 절차적 위법과 2차적 증거 수집 사이의 인과관계를 희석하게 할 만한 정황에 속하고, 메스암페타민 투약 범행의 중대성도 아울러 참작될 필요가 있는 점 등 제반 사정을 고려할 때 2차적 증거인 소변 감정서 등은 증거능력이 인정된다(대판 2013.03.14. 2012도13611).", "answer": "O"}, {"source": "13변시", "question": "다음 <사례>에 관하여 옳은 설명을 한 학생만을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)\n<사례>\n사법경찰관 甲은 강도죄의 혐의로 乙을 긴급체포하면서 긴급히 압수할 필요가 있다고 판단 하여 乙이 소지하고 있는 칼(이하 \"증거물 A”라 함)을 영장 없이 압수하였으나 압수·수색 영장을 발부받지 아니하고도 즉시 乙에게 반환하지 아니하였다.\n이틀 후 甲은 乙의 집에서 10m 떨어진 범행현장인 피해자 丙이 운영하는 주점 내부를 丙 의 동의를 받고 조사하다가 丙 소유의 물컵에서 乙의 지문 2점(이하 “증거물 B\"라 함)을 채 취한 다음 영장 없이 그 물컵(이하 “증거물 C\"라 함)을 수거해 갔다.\n한편 추가적인 증거물을 수집하려고 乙의 집을 조사하던 甲은 乙이 거주하는 집 마당에서 乙 소유의 쇠파이프(이하 \"증거물 D\"라 함)를 발견한 후 丙에게서 임의로 제출받는 형식으 로 쇠파이프를 압수하였고, 그 후 증거물 D를 쇠파이프를 찍은 사진(이하 “증거물 E”라 함) 과 함께 검사에게 송부하였다.\n그리고 甲은 乙의 여죄가 더 있을 것으로 생각하고 이를 수사하면서 압수·수색영장(압수 장소: 乙이 임차하여 거주하는 丁 소유의 집, 압수대상물: 위 장소에 보관 중인 물건)을 발부받아 J에게 압수·수색영장을 제시한 후 乙이 거주하던 집을 수색하던 중 마침 乙을 찾아 온 乙의 친구인 戊가 들고 있던 야구방망이(이하 \"증거물 F\"라 함)를 압수하였다.", "choice": "철수: 공판과정에서 乙이 증거물 A를 증거로 함에 동의하면 이를 유죄 인정의 증거로 사용 할 수 있다.", "explanation": "형사소송법 제216조 제1항 제2호, 제217조 제2항, 제3항은 사법경찰관은 형사소송법 제200조의3(긴급체포)의 규정에 의하여 피의자를 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압 수·수색을 할 수 있고, 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 하며, 청구한 압수수색영장을 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다 고 규정하고 있는바, 형사소송법 제217조 제2항, 제3항에 위반하여 압수수색영장을 청구하여 이를 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없는 것이 고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거 로 함에 동의하였다고 하더라도 달리 볼 것은 아니다(대판 2009.12.24. 2009도11401).", "answer": "X"}, {"source": "13변시", "question": "다음 <사례>에 관하여 옳은 설명을 한 학생만을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)\n<사례>\n사법경찰관 甲은 강도죄의 혐의로 乙을 긴급체포하면서 긴급히 압수할 필요가 있다고 판단 하여 乙이 소지하고 있는 칼(이하 \"증거물 A”라 함)을 영장 없이 압수하였으나 압수·수색 영장을 발부받지 아니하고도 즉시 乙에게 반환하지 아니하였다.\n이틀 후 甲은 乙의 집에서 10m 떨어진 범행현장인 피해자 丙이 운영하는 주점 내부를 丙 의 동의를 받고 조사하다가 丙 소유의 물컵에서 乙의 지문 2점(이하 “증거물 B\"라 함)을 채 취한 다음 영장 없이 그 물컵(이하 “증거물 C\"라 함)을 수거해 갔다.\n한편 추가적인 증거물을 수집하려고 乙의 집을 조사하던 甲은 乙이 거주하는 집 마당에서 乙 소유의 쇠파이프(이하 \"증거물 D\"라 함)를 발견한 후 丙에게서 임의로 제출받는 형식으 로 쇠파이프를 압수하였고, 그 후 증거물 D를 쇠파이프를 찍은 사진(이하 “증거물 E”라 함) 과 함께 검사에게 송부하였다.\n그리고 甲은 乙의 여죄가 더 있을 것으로 생각하고 이를 수사하면서 압수·수색영장(압수 장소: 乙이 임차하여 거주하는 丁 소유의 집, 압수대상물: 위 장소에 보관 중인 물건)을 발부받아 J에게 압수·수색영장을 제시한 후 乙이 거주하던 집을 수색하던 중 마침 乙을 찾아 온 乙의 친구인 戊가 들고 있던 야구방망이(이하 \"증거물 F\"라 함)를 압수하였다.", "choice": "영희: 설사 증거물 C가 위법하게 압수된 것이라 하더라도 증거물 B는 그로부터 획득한 2 차적 증거에 해당하지 않는다.", "explanation": "범행 현장에서 지문채취 대상물에 대한 지문채취가 먼저 이루어진 이상, 수사기관이 그 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 압수하였다고 하더라도, 위와 같이 채취된 지문 은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 아니함이 분명하여, 이를 가리켜 위법수집증거라고 할 수 없다(대판 2008.10.23. 2008도7471).", "answer": "O"}, {"source": "13변시", "question": "다음 <사례>에 관하여 옳은 설명을 한 학생만을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)\n<사례>\n사법경찰관 甲은 강도죄의 혐의로 乙을 긴급체포하면서 긴급히 압수할 필요가 있다고 판단 하여 乙이 소지하고 있는 칼(이하 \"증거물 A”라 함)을 영장 없이 압수하였으나 압수·수색 영장을 발부받지 아니하고도 즉시 乙에게 반환하지 아니하였다.\n이틀 후 甲은 乙의 집에서 10m 떨어진 범행현장인 피해자 丙이 운영하는 주점 내부를 丙 의 동의를 받고 조사하다가 丙 소유의 물컵에서 乙의 지문 2점(이하 “증거물 B\"라 함)을 채 취한 다음 영장 없이 그 물컵(이하 “증거물 C\"라 함)을 수거해 갔다.\n한편 추가적인 증거물을 수집하려고 乙의 집을 조사하던 甲은 乙이 거주하는 집 마당에서 乙 소유의 쇠파이프(이하 \"증거물 D\"라 함)를 발견한 후 丙에게서 임의로 제출받는 형식으 로 쇠파이프를 압수하였고, 그 후 증거물 D를 쇠파이프를 찍은 사진(이하 “증거물 E”라 함) 과 함께 검사에게 송부하였다.\n그리고 甲은 乙의 여죄가 더 있을 것으로 생각하고 이를 수사하면서 압수·수색영장(압수 장소: 乙이 임차하여 거주하는 丁 소유의 집, 압수대상물: 위 장소에 보관 중인 물건)을 발부받아 J에게 압수·수색영장을 제시한 후 乙이 거주하던 집을 수색하던 중 마침 乙을 찾아 온 乙의 친구인 戊가 들고 있던 야구방망이(이하 \"증거물 F\"라 함)를 압수하였다.", "choice": "민준: 증거물 D는 위법수집증거로 증거능력이 없으나 증거물 E는 최우량증거에 해당하므로 乙이 이를 증거로 함에 동의하면 이를 유죄 인정의 증거로 사용할 수 있다.", "explanation": "형사소송법 제218조는 \"사법경찰관은 소유자, 소지자 또는 보관자가 임의로 제출한 물건을 영장 없이 압수할 수 있다\"고 규정하고 있는바, 위 규정을 위반하여 소유자, 소지자 또는 보관자가 아닌 자 로부터 제출받은 물건을 영장없이 압수한 경우 그 '압수물' 및 '압수물을 찍은 사진'은 이를 유죄 인정 의 증거로 사용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것이 아니다. 기록에 의하면, 충청남도 금산경찰서 소속 경사 공소외 1은 피고인 소유의 쇠파이프를 피고인의 주거지 앞 마당에서 발견하였으면서도 그 소유자 소지자 또는 보관자가 아닌 피해자 공소외 2로부터 임의로 제출받는 형 식으로 위 쇠파이프를 압수하였고, 그 후 압수물의 사진을 찍은 사실, 공판조서의 일부인 제1심 증거 목록상 피고인이 위 사진(증 제4호의 일부)을 증거로 하는 데 동의한 것으로 기재되어 있는 사실을 알 수 있는바, 앞서 본 법리에 비추어 보면, 이 사건 압수물과 그 사진은 형사소송법상 영장주의 원칙 을 위반하여 수집하거나 그에 기초한 증거로서 그 절차 위반행위가 적법절차의 실질적인 내용을 침 해하는 정도에 해당한다고 할 것이므로, 피고인의 증거동의에도 불구하고 위 사진은 이 사건 범죄사 실을 유죄로 인정하는 증거로 사용할 수 없다고 할 것이다(대판 2010.01.28. 2009도10092).", "answer": "X"}, {"source": "13변시", "question": "다음 <사례>에 관하여 옳은 설명을 한 학생만을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)\n<사례>\n사법경찰관 甲은 강도죄의 혐의로 乙을 긴급체포하면서 긴급히 압수할 필요가 있다고 판단 하여 乙이 소지하고 있는 칼(이하 \"증거물 A”라 함)을 영장 없이 압수하였으나 압수·수색 영장을 발부받지 아니하고도 즉시 乙에게 반환하지 아니하였다.\n이틀 후 甲은 乙의 집에서 10m 떨어진 범행현장인 피해자 丙이 운영하는 주점 내부를 丙 의 동의를 받고 조사하다가 丙 소유의 물컵에서 乙의 지문 2점(이하 “증거물 B\"라 함)을 채 취한 다음 영장 없이 그 물컵(이하 “증거물 C\"라 함)을 수거해 갔다.\n한편 추가적인 증거물을 수집하려고 乙의 집을 조사하던 甲은 乙이 거주하는 집 마당에서 乙 소유의 쇠파이프(이하 \"증거물 D\"라 함)를 발견한 후 丙에게서 임의로 제출받는 형식으 로 쇠파이프를 압수하였고, 그 후 증거물 D를 쇠파이프를 찍은 사진(이하 “증거물 E”라 함) 과 함께 검사에게 송부하였다.\n그리고 甲은 乙의 여죄가 더 있을 것으로 생각하고 이를 수사하면서 압수·수색영장(압수 장소: 乙이 임차하여 거주하는 丁 소유의 집, 압수대상물: 위 장소에 보관 중인 물건)을 발부받아 J에게 압수·수색영장을 제시한 후 乙이 거주하던 집을 수색하던 중 마침 乙을 찾아 온 乙의 친구인 戊가 들고 있던 야구방망이(이하 \"증거물 F\"라 함)를 압수하였다.", "choice": "유선: 甲이 압수·수색에 착수하면서 그 장소의 관리책임자인 J에게 압수·수색영장을 제시한 이후에 戊가 야구방망이를 들고 압수·수색장소에 출현하였으므로 乙이 증 거물 F를 증거로 함에 부동의하더라도 증거물 F는 증거능력이 있다.", "explanation": "[1] 압수·수색영장에서 압수할 물건을 '압수장소에 보관중인 물건'이라고 기재하고 있는 것을 '압 수장소에 현존하는 물건'으로 해석할 수는 없다. [2] 압수·수색영장은 처분을 받는 자에게 반드시 제 시하여야 하는바, 현장에서 압수·수색을 당하는 사람이 여러 명일 경우에는 그 사람들 모두에게 개별 적으로 영장을 제시해야 하는 것이 원칙이다. 수사기관이 압수·수색에 착수하면서 그 장소의 관리책 임자에게 영장을 제시하였다고 하더라도, 물건을 소지하고 있는 다른 사람으로부터 이를 압수하고자 하는 때에는 그 사람에게 따로 영장을 제시하여야 한다(대판 2009.03.12. 2008도763).\n▶원래 도지사 집무실에 보관중이던 서류를 도지사를 보좌하는 공무원이 압수수색절차가 진행중이던 압수장소에 일시적으로 가 져온 경우에는, 이를 영장에 기재된 압수대상물인 '보관중인 물건에 포함된다고 볼 수 없고, '보관중인 물건'에 영장집행 당시 영 장기재 장소에 '현존하는 물건까지 포함된다고 해석할 수는 없으므로, 위 서류를 압수한 것은 위법하다고 한 사례", "answer": "X"}, {"source": "26변시", "question": "전문증거에 관한 설명 중 옳지 않틀 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "휴대전화를 통해 협박 문자를 송신하였다는 범죄사실과 관련하여 협박 문자가 현출된 휴대전화의 화면을 촬영한 사진에는 전문법칙이 적용되지 않고, 문자정보가 저장된 휴대전화를 법정에 제출할 수 없거나 그 제출이 곤란한 사정이 있고, 그 사진의 영상이 휴대전화의 화면에 표시된 문자정보와 정확하게 같다는 사실이 증명되어야 그 사진의 증거능력이 인정된다.", "explanation": "휴대전화기 이용자가 그 문자정보를 읽을 수 있도록 한 휴대전화기의 화면을 촬영한 사진을 증거로 사용하려면 문자정보가 저장된 휴대전화기를 법정에 제출할 수 없거나 그 제출이 곤란한 사정이 있고, 그 사진의 영상이 휴대전화기의 화면에 표시된 문자정보와 정확하게 같다는 사실이 증명되어야 하고(대판 2008.11.13. 2006도2556 참조), 이를 진술증거로 사용하는 경우 그 기재 내용의 진실성에 관하여는 전문법칙이 적용되므로 형사소송법 제313조 제1항에 따라 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에 한하여 이를 증거로 사용할 수 있다(대판 2007.12.13. 2007도7257 등 참조)", "answer": "O"}, {"source": "26변시", "question": "전문증거에 관한 설명 중 옳지 않틀 것은? (다툼이 있는 경우 판례에 의함) ", "choice": " 검사의 분석 의뢰에 따라 대검찰청 과학수사부 소속 진술분석관이 수사기관의 조사 내용에 관해 피해자에게 문답을 하는 방식으로 피해자를 면담하고 그 내용을 녹화한 영상녹화물은 수사과정 외에서 작성된 것이라고 볼 수 없으므로 「형사소송법」 제313조 제1항에 따라 증거능력을 인정할 수 없고, 수사기관이 작성한 피의자신문조서나 피고인이 아닌 자의 진술을 기재한 조서가 아니고, 피고인 또는 피고인이 아닌 자가 작성한 진술서도 아니므로 「형사소송법」 제312조에 의하여 증거능력을 인정할 수도 없다.", "explanation": "검사가 피고인들의 성폭력범죄의 처벌 등에 관한 특례법 위반(친족관계에의한강간) 등 혐의를 수사하면서 아동인 피해자의 진술 내용에 대하여 대검찰청 과학수사부 소속 진술분석관에게 분석을 의뢰하였고, 이에 따라 진술분석관이 피해자를 면담하고 그 내용을 녹화한 ‘피해자 진술분석 과정 영상녹화 CD’(이하 ‘영상녹화물’이라 한다)가 제작되어 증거로 제출됨으로써 그 증거능력이 문제 된 사안에서, 검사는 성폭력범죄의 처벌 등에 관한 특례법 제33조 제4항, 제1항에 의하여 진술분석관에게 피해자 진술의 신빙성 여부에 대한 분석을 의뢰한 점, 진술분석관은 사건 기록을 받아 검찰청 여성·아동조사실에서 피해자를 면담하였는데, 면담은 당시까지 수사기관이 사건에 대하여 조사한 내용에 관해 피해자에게 문답을 하는 방식으로 진행되었고, 면담 과정은 녹화되어 영상녹화물로 제작된 점 등 진술분석관의 소속 및 지위, 진술분석관이 피해자와 면담을 하고 영상녹화물을 제작한 경위와 목적, 진술분석관이 면담과 관련하여 수사기관으로부터 확보한 자료의 내용과 성격, 면담 방식과 내용, 면담 장소 등에 비추어 영상녹화물은 수사과정 외에서 작성된 것이라고 볼 수 없으므로 형사소송법 제313조 제1항에 따라 증거능력을 인정할 수 없고, 나아가 수사기관이 작성한 피의자신문조서나 피고인이 아닌 자의 진술을 기재한 조서가 아니고, 피고인 또는 피고인이 아닌 자가 작성한 진술서도 아니므로 형사소송법 제312조에 의하여 증거능력을 인정할 수도 없다는 이유로, 같은 취지에서 영상녹화물의 증거능력이 없다고 본 원심판단은 정당하다고 한 사례(대판 2024.03.28. 2023도15133, 2023전도163, 2023전도164)", "answer": "O"}, {"source": "26변시", "question": "전문증거에 관한 설명 중 옳지 않틀 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "조세범칙조사를 담당하는 세무공무원이 피고인이 된 혐의자 또는 참고인에 대하여 심문한 내용을 기재한 조서는 검사·사법경찰관 등 수사기관이 작성한 조서와 동일하게 볼 수 있으므로 「형사소송법」 제312조에 따라 증거능력의 존부를 판단할 수 있다.", "explanation": "사법경찰관리 또는 특별사법경찰관리에게는 헌법과 형사소송법 등의 법령에 따라 국민의 생명·신체·재산 등을 보호하기 위하여 광범위한 기본권 제한 조치를 할 수 있는 권한이 부여되어 있으므로, 소관 업무의 성질이 수사업무와 유사하거나 이에 준하는 경우에도 명문의 규정이 없는 한 그 업무를 담당하는 공무원이 사법경찰관리 또는 특별사법경찰관리에 해당한다고 해석할 수 없다. 구 형사소송법(2020. 2. 4. 법률 제16924호로 개정되기 전의 것) 제197조는 '특별사법경찰관리'라는 표제 아래 세무 분야에 관하여 사법경찰관리의 직무를 행할 자와 그 직무의 범위를 법률로써 정한다고 규정하였고, 이에 따라 「사법경찰관리의 직무를 수행할 자와 그 직무범위에 관한 법률」은 특별사법경찰관리를 구체적으로 열거하면서 제5조 제17호에서 '관세법에 따라 관세범의 조사 업무에 종사하는 세무공무원'만 명시하였을 뿐 '조세범칙조사를 담당하는 세무공무원'을 포함시키지 않았다. 그뿐만 아니라 현행 법령상 조세범칙조사의 법적 성질은 기본적으로 행정절차에 해당하므로, 「조세범 처벌절차법」 등 관련 법령에 조세범칙조사를 담당하는 세무공무원에게 압수·수색 및 혐의자 또는 참고인에 대한 심문권한이 부여되어 있어 그 업무의 내용과 실질이 수사절차와 유사한 점이 있고, 이를 기초로 수사기관에 고발하는 경우에는 형사절차로 이행되는 측면이 있더라도, 달리 특별한 사정이 없는 한 이를 형사절차의 일환으로 볼 수 없다. 따라서 조세범칙조사를 담당하는 세무공무원이 피고인이 된 혐의자 또는 참고인에 대하여 심문한 내용을 기재한 조서는 검사·사법경찰관 등 수사기관이 작성한 조서와 동일하지 않으므로 형사소송법 제312조에 따라 그 증거능력의 유무를 판단할 수 없고, 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류에 해당하므로 형사소송법 제313조에 따라 그 증거능력의 유무를 판단하여야 한다(대판 2022.12.15. 2022도8824 참조)", "answer": "X"}, {"source": "26변시", "question": "전문증거에 관한 설명 중 옳지 않틀 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "수사기관에서 진술한 참고인이 법정에서 증언을 거부하였으나 정당하게 증언거부권을 행사한 것으로 볼 수 없는 경우, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 「형사소송법」 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 않는다.", "explanation": "수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 형사소송법 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 않는다고 보아야 한다. 따라서 증인이 정당하게 증언거부권을 행사하여 증언을 거부한 경우와 마찬가지로 수사기관에서 그 증인의 진술을 기재한 서류는 증거능력이 없다(대판 2019.11.21. 2018도13945(전합))", "answer": "O"}, {"source": "26변시", "question": "전문증거에 관한 설명 중 옳지 않틀 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 조사과정의 진행경과를 확인하기 위하여 필요한 사항을 그 진술서에 기록하거나 별도의 서면에 기록한 후 수사기록에 편철하는 등 적절한 조치를 취하지 아니한 경우 특별한 사정이 없는 한 '적법한 절차와 방식'에 따라 수사과정에서 진술서가 작성되었다고 할 수 없어 증거능력을 인정할 수 없다.", "explanation": "형사소송법 제312조 제5항은 피고인 또는 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거능력에 관하여 형사소송법 제312조 제1항부터 제4항까지 준용하도록 규정하고 있으므로, 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서의 증거능력이 인정되려면 '적법한 절차와 방식에 따라 작성된 것'이어야 한다는 법리가 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거능력에 관하여도 적용된다. 한편 검사 또는 사법경찰관이 피의자가 아닌 자의 출석을 요구하여 조사하는 경우에는 피의자를 조사하는 경우와 마찬가지로 조사장소에 도착한 시각, 조사를 시작하고 마친 시각, 그 밖에 조사과정의 진행경과를 확인하기 위하여 필요한 사항을 조서에 기록하거나 별도의 서면에 기록한 후 수사기록에 편철하도록 하는 등 조사과정을 기록하게 한 형사소송법 제221조 제1항, 제244조의4 제1항, 제3항의 취지는 수사기관이 조사과정에서 피조사자로부터 진술증거를 취득하는 과정을 투명하게 함으로써 그 과정에서의 절차적 적법성을 제도적으로 보장하려는 것이다. 따라서 수사기관이 수사에 필요하여 피의자가 아닌 자로부터 진술서를 작성·제출받는 경우에도 그 절차는 준수되어야 하므로, 피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 조사과정의 진행경과를 확인하기 위하여 필요한 사항을 그 진술서에 기록하거나 별도의 서면에 기록한 후 수사기록에 편철하는 등 적절한 조치를 취하지 아니하여 형사소송법 제244조의4 제1항, 제3항에서 정한 절차를 위반한 경우에는, 그 진술증거 취득과정의 절차적 적법성의 제도적 보장이 침해되지 않았다고 볼 만한 특별한 사정이 없는 한 '적법한 절차와 방식'에 따라 수사과정에서 진술서가 작성되었다고 할 수 없어 증거능력을 인정할 수 없다(대판 2022.10.27. 2022도9510)", "answer": "O"}, {"source": "26변시", "question": "甲은 A의 손목시계를 절취하였다는 범죄사실(절도죄)로 공소제기 되었고, 乙은 甲으로부터 장물인 것을 알면서 위 손목시계를 취득하였다는 범죄사실(장물취득죄)로 공소제기되어 공동피고인으로 공판이 진행 중이다. 공판정에서 甲은 공소사실을 자백하고 있고 乙은 부인하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 피고인 신문과정에서 \"절취한 손목시계를 乙에게 주면서 훔친 물건이라고 제가 분명히 이야기해 주었습니다.\"라고 답변한 진술은 乙의 공소사실을 인정하기 위한 증거로 사용할 수 있다.", "explanation": "선지 ㄱ에서, 甲의 진술은 자신이 체험한 사실의 진술이므로 전문진술이 아닌 원진술이다. 다만, 절도범인 甲과 장물범인 乙은 공범 아닌 공동피고인에 해당하여, 甲은 乙에 대하여 증인의 지위에 불과하다. 따라서 甲이 증인으로 선서하지 않고 피고인 신문과정에서 한 진술은, 乙에 대하여 증거능력이 없다(아래 78도1031 참조) 마찬가지로 선지 ㄴ에서, 공범 아닌 공동피고인 甲에 대한 사경작성 피의자신문조서는 乙에 대하여는 형사소송법 제312조 제4항의 요건을 모두 갖추어야 증거능력이 있다(아래 2005도7601 참조). 이러한 판례의 법리는 공범 아닌 공동피고인이 제3자와 동일, 유사하게 당해 피고인에 대한 증인의 지위에 있다는 점, 즉 증인적격이 있다는 점을 전제한다고 볼 수 있다(노태악 편집대표, 주석 형사소송법 I, 한국사법행정학회(2022), p.1018 참조). 더구나 판례는 공범인 공동피고인의 경우에도 변론이 분리되면 증인적격을 인정하고 있다(아래 2008도3300 참조). 따라서 ㄷ은 타당하지 못하다.\n피고인과는 별개의 범죄사실로 기소되고 다만 병합심리된 것 뿐인 공동피고인은 피고인에 대한 관계에서는 증인의 지위에 있음에 불과하므로 선서없이 한 그 공동피고인의 피고인으로서 한 공판정에서의 진술을 피고인에 대한 공소범죄 사실을 인정하는 증거로 쓸 수 없다(대판 1979.03.27. 78도1031)", "answer": "X"}, {"source": "26변시", "question": "甲은 A의 손목시계를 절취하였다는 범죄사실(절도죄)로 공소제기 되었고, 乙은 甲으로부터 장물인 것을 알면서 위 손목시계를 취득하였다는 범죄사실(장물취득죄)로 공소제기되어 공동피고인으로 공판이 진행 중이다. 공판정에서 甲은 공소사실을 자백하고 있고 乙은 부인하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "\"절취한 손목시계를 乙에게 주면서 훔친 물건이라고 제가 분명히 이야기해 주었습니다.\"라고 기재된 甲에 대한 사법경찰관 작성 피의자신문조서는 乙이 내용부인의 취지로 증거부동의 하는 한 乙의 공소사실에 대하여 증거능력이 없다.", "explanation": "선지 ㄱ에서, 甲의 진술은 자신이 체험한 사실의 진술이므로 전문진술이 아닌 원진술이다. 다만, 절도범인 甲과 장물범인 乙은 공범 아닌 공동피고인에 해당하여, 甲은 乙에 대하여 증인의 지위에 불과하다. 따라서 甲이 증인으로 선서하지 않고 피고인 신문과정에서 한 진술은, 乙에 대하여 증거능력이 없다(아래 78도1031 참조) 마찬가지로 선지 ㄴ에서, 공범 아닌 공동피고인 甲에 대한 사경작성 피의자신문조서는 乙에 대하여는 형사소송법 제312조 제4항의 요건을 모두 갖추어야 증거능력이 있다(아래 2005도7601 참조). 이러한 판례의 법리는 공범 아닌 공동피고인이 제3자와 동일, 유사하게 당해 피고인에 대한 증인의 지위에 있다는 점, 즉 증인적격이 있다는 점을 전제한다고 볼 수 있다(노태악 편집대표, 주석 형사소송법 I, 한국사법행정학회(2022), p.1018 참조). 더구나 판례는 공범인 공동피고인의 경우에도 변론이 분리되면 증인적격을 인정하고 있다(아래 2008도3300 참조). 따라서 ㄷ은 타당하지 못하다.\n공동피고인이 절도범과 그 장물범은 서로 다른 공동피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로, 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자신문조서는 공동피고인의 증언에 의하여 그 성립의 진정이 인정되지 아니하는 한 피고인의 공소 범죄사실을 인정하는 증거로 할 수 없다(대판 2006.01.12. 2005도7601)", "answer": "X"}, {"source": "26변시", "question": "甲은 A의 손목시계를 절취하였다는 범죄사실(절도죄)로 공소제기 되었고, 乙은 甲으로부터 장물인 것을 알면서 위 손목시계를 취득하였다는 범죄사실(장물취득죄)로 공소제기되어 공동피고인으로 공판이 진행 중이다. 공판정에서 甲은 공소사실을 자백하고 있고 乙은 부인하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공판절차에서 甲과 乙의 변론을 분리하여 甲이 증인선서를 한 후 \"절취한 손목시계를 乙에게 주면서 훔친 물건이라고 제가 분명히 이야기해 주었습니다.\"라고 증언한 경우, 위 증언은 증인적격 없는 자의 증언이므로 乙의 공소사실을 인정하기 위한 증거로 사용할 수 없다.", "explanation": "선지 ㄱ에서, 甲의 진술은 자신이 체험한 사실의 진술이므로 전문진술이 아닌 원진술이다. 다만, 절도범인 甲과 장물범인 乙은 공범 아닌 공동피고인에 해당하여, 甲은 乙에 대하여 증인의 지위에 불과하다. 따라서 甲이 증인으로 선서하지 않고 피고인 신문과정에서 한 진술은, 乙에 대하여 증거능력이 없다(아래 78도1031 참조) 마찬가지로 선지 ㄴ에서, 공범 아닌 공동피고인 甲에 대한 사경작성 피의자신문조서는 乙에 대하여는 형사소송법 제312조 제4항의 요건을 모두 갖추어야 증거능력이 있다(아래 2005도7601 참조). 이러한 판례의 법리는 공범 아닌 공동피고인이 제3자와 동일, 유사하게 당해 피고인에 대한 증인의 지위에 있다는 점, 즉 증인적격이 있다는 점을 전제한다고 볼 수 있다(노태악 편집대표, 주석 형사소송법 I, 한국사법행정학회(2022), p.1018 참조). 더구나 판례는 공범인 공동피고인의 경우에도 변론이 분리되면 증인적격을 인정하고 있다(아래 2008도3300 참조). 따라서 ㄷ은 타당하지 못하다.\n참조판례: 공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다(대판 2008.06.26. 2008도3300)\n", "answer": "X"}, {"source": "26변시", "question": "甲은 A의 손목시계를 절취하였다는 범죄사실(절도죄)로 공소제기 되었고, 乙은 甲으로부터 장물인 것을 알면서 위 손목시계를 취득하였다는 범죄사실(장물취득죄)로 공소제기되어 공동피고인으로 공판이 진행 중이다. 공판정에서 甲은 공소사실을 자백하고 있고 乙은 부인하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙의 친구 B가 법정에 증인으로 출석하여 \"甲으로부터 '내가 절취한 손목시계를 乙에게 주면서 훔친 물건이라고 말했다'고 들었습니다.\"라고 증언을 한 경우, B의 위 증언은 乙의 공소사실을 인정하기 위한 증거로 사용할 수 있다.", "explanation": "형사소송법 제316조 제2항에 의하면 피고인 아닌 자의 공판준비 또는 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 것인 때에는 원진술자가 사망, 질병 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여진 때에 한하여 이를 증거로 할 수 있다고 규정하고 있는데 여기서 말하는 피고인 아닌 자라고 함은 제3자는 말할 것도 없고 공동피고인이나 공범자를 모두 포함한다고 해석된다. 전문진술의 원진술자가 공동피고인이어서 형사소송법 제316조 제2항 소정의 '피고인 아닌 타인'에는 해당하나 법정에서 공소사실을 부인하고 있어서 '원진술자가 사망, 질병 기타 사유로 인하여 진술할 수 없는 때'에는 해당되지 않는다는 이유로 그 증거능력을 부정한 사례(대판 2000.12.27. 99도5679)", "answer": "X"}, {"source": "25변시", "question": "乙은 甲에게 술을 훔쳐오라고 하였고, 이에 甲은 편의점에 들어가 양주 1병을 절취하였다. 며칠 뒤, 甲은 친구인 丙에게 乙이 교사하여 술을 훔친 것이라고 이야기하였다. 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 한편, 甲은 수사기관과 법정에서 乙이 교사하여 절도할 마음을 먹게 되었다고 진술하였고, 乙은 수사기관과 법정에서 교사사실을 부인하였다. 이에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 법정에서 乙이 교사하였다고 진술하더라도 증인으로서 진술한 것이 아니면 甲의 법정진술은 증거능력이 없다. ", "explanation": "공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있고, 이는 피고인들간에 이해관계가 상반된다고 하여도 마찬가지라 할 것이다(대판 2006.05.11. 2006도1944). ", "answer": "X"}, {"source": "25변시", "question": "乙은 甲에게 술을 훔쳐오라고 하였고, 이에 甲은 편의점에 들어가 양주 1병을 절취하였다. 며칠 뒤, 甲은 친구인 丙에게 乙이 교사하여 술을 훔친 것이라고 이야기하였다. 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 한편, 甲은 수사기관과 법정에서 乙이 교사하여 절도할 마음을 먹게 되었다고 진술하였고, 乙은 수사기관과 법정에서 교사사실을 부인하였다. 이에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관 작성의 甲에 대한 피의자신문조서에 대하여 乙이 부동의한 경우, 증인신문을 통해 원진술자인 甲이 그 성립을 인정하고 乙에게 반대신문권이 보장되며 특신상태가 인정되면 「형사소송법」 제312조 제4항에 의하여 증거능력을 인정할 수 있다. ", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다. (대판 2009.10.15. 2009도1889). ", "answer": "X"}, {"source": "25변시", "question": "乙은 甲에게 술을 훔쳐오라고 하였고, 이에 甲은 편의점에 들어가 양주 1병을 절취하였다. 며칠 뒤, 甲은 친구인 丙에게 乙이 교사하여 술을 훔친 것이라고 이야기하였다. 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 한편, 甲은 수사기관과 법정에서 乙이 교사하여 절도할 마음을 먹게 되었다고 진술하였고, 乙은 수사기관과 법정에서 교사사실을 부인하였다. 이에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관이 甲에게 진술거부권을 고지하지 않고 조사를 하여 피의자신문조서를 작성하였더라도, 직접적으로 위법수사를 당하지 않은 乙에 대하여 이를 유죄의 증거로 사용하는 것이 금지되는 것은 아니다.", "explanation": "수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거능력이 부인되어야 한다. 수사기관이 피고인 아닌 자를 상대로 적법한 절차에 따르지 아니하고 수집한 증거는 원칙적으로 피고인에 대한 유죄 인정의 증거로 삼을 수 없다(대판 2011.06.30. 2009도6717). 공범인 피의자/피고인 아닌 제3자를 상대로 수집한 위법수집증거는 모두 당해 피고인에 대한 유죄의 증거로 쓸 수 없다.", "answer": "X"}, {"source": "25변시", "question": "乙은 甲에게 술을 훔쳐오라고 하였고, 이에 甲은 편의점에 들어가 양주 1병을 절취하였다. 며칠 뒤, 甲은 친구인 丙에게 乙이 교사하여 술을 훔친 것이라고 이야기하였다. 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 한편, 甲은 수사기관과 법정에서 乙이 교사하여 절도할 마음을 먹게 되었다고 진술하였고, 乙은 수사기관과 법정에서 교사사실을 부인하였다. 이에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "丙이 검찰에서 참고인으로 출석하여 “甲으로부터 乙이 절도를 시켰다는 이야기를 들었다.”고 진술한 경우, 위 참고인진술조서는 재전문진술이 기재된 조서에 해당하므로 乙이 동의하지 않는 한 乙에 대하여 증거능력이 인정되지 않는다. ", "explanation": "전문진술이나 전문진술을 기재한 조서는 형사소송법 제310조의2에 따라 원칙적으로 증거능력이 없다. 다만 전문진술은 형사소송법 제316조 제2항에 따라 원진술자가 사망, 질병, 외국거주, 소재불명, 그 밖에 이에 준하는 사유로 진술할 수 없고, 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한하여 예외적으로 증거능력이 있다. 그리고 전문진술이 기재된 조서는 형사소송법 제312조 또는 제314조에 따라 증거능력이 인정될 수 있는 경우에 해당하여야 함은 물론 형사소송법 제316조 제2항에 따른 요건을 갖추어야 예외적으로 증거능력이 있다. ", "answer": "X"}, {"source": "25변시", "question": "乙은 甲에게 술을 훔쳐오라고 하였고, 이에 甲은 편의점에 들어가 양주 1병을 절취하였다. 며칠 뒤, 甲은 친구인 丙에게 乙이 교사하여 술을 훔친 것이라고 이야기하였다. 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 한편, 甲은 수사기관과 법정에서 乙이 교사하여 절도할 마음을 먹게 되었다고 진술하였고, 乙은 수사기관과 법정에서 교사사실을 부인하였다. 이에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "丙이 증인으로 출석하여 “甲으로부터 乙이 교사하였다는 이야기를 들었다.”고 진술한 경우, 乙에 대한 공판절차에서 丙의 법정진술은 「형사소송법」 제316조 제2항의 요건이 인정되어야 증거능력이 인정되는데, 원진술자인 甲이 공동피고인으로서 법정에 출석하여 있으므로 원진술자가 진술을 할 수 없는 상태라고 볼 수 없어 乙이 동의하지 않는 한 丙의 법정진술은 증거능력이 없다. ", "explanation": "형사소송법 제316조 제2항에 의하면 피고인 아닌 자의 공판준비 또는 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 것인 때에는 원진술자가 사망, 질병 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여진 때에 한하여 이를 증거로 할 수 있다고 규정하고 있는데 여기서 말하는 피고인 아닌 자라고 함은 제3자는 말할 것도 없고 공동피고인이나 공범자를 모두 포함한다. 전문진술의 원진술자가 공동피고인이어서 형사소송법 제316조 제2항 소정의 ‘피고인 아닌 타인’에는 해당하나 법정에서 공소사실을 부인하고 있어서 ‘원진술자가 사망, 질병 기타 사유로 인하여 진술할 수 없는 때’에는 해당되지 않는다는 이유로 그 증거능력을 부정한 사례(대판 2000.12.27. 99도5679). ", "answer": "O"}, {"source": "24변시", "question": "甲은 평소 주벽과 의처증이 심한 남편 A와의 불화로 인해 이혼소송을 준비하던 중 A의 운전기사 乙에게 A를 살해하도록 부탁하였다. 乙은 甲의 부탁대로 술에 취하여 자고 있던 A의 목을 졸라 살해하였다. 검사는 乙을 살인죄로, 甲을 살인교사죄로 기소하였고 법원은 甲과 乙을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 사법경찰관의 피의자신문에서는 교사사실을 인정하였으나 법정에서는 이를 부인하는 경우, 甲이 내용을 부인한 甲에 대한 사법경찰관 작성 피의자신문조서는 임의성이 인정되는 한 甲의 법정 진술을 탄핵하기 위한 반대증거로 사용될 수 있다.", "explanation": "검사가 유죄의 자료로 제출한 사법경찰리 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있으며, 또한 탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제318조의2의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요...(대판 2005.08.19. 2005도2617).", "answer": "O"}, {"source": "24변시", "question": "甲은 평소 주벽과 의처증이 심한 남편 A와의 불화로 인해 이혼소송을 준비하던 중 A의 운전기사 乙에게 A를 살해하도록 부탁하였다. 乙은 甲의 부탁대로 술에 취하여 자고 있던 A의 목을 졸라 살해하였다. 검사는 乙을 살인죄로, 甲을 살인교사죄로 기소하였고 법원은 甲과 乙을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙의 친구 W가 법정에 출석하여 乙로부터 ‘자신이 A를 살해하였다’는 이야기를 들은 적이 있다고 진술한 경우, 원진술자인 乙이 법정에 출석하여 있는 한 W의 진술은 乙에 대한 유죄의 증거로 사용할 수 없다.", "explanation": "W의 진술은 ‘피고인(乙)의 진술을 내용으로 하는’ 피고인 아닌 자의 공판기일에서의 진술(=전문진술)이다. 따라서 형사소송법 제316조 제1항의 요건인 특신상태를 충족하면 증거로 사용가능하다.\n형사소송법 제316조(전문진술) ① 피고인이 아닌 자(...)의 공판준비 또는 공판기일에서의 진술이 피고인의 진술을 그 내용으로 하는 것인 때에는 그 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한하여 이를 증거로 할 수 있다.", "answer": "X"}, {"source": "24변시", "question": "甲은 평소 주벽과 의처증이 심한 남편 A와의 불화로 인해 이혼소송을 준비하던 중 A의 운전기사 乙에게 A를 살해하도록 부탁하였다. 乙은 甲의 부탁대로 술에 취하여 자고 있던 A의 목을 졸라 살해하였다. 검사는 乙을 살인죄로, 甲을 살인교사죄로 기소하였고 법원은 甲과 乙을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲과 乙이 모두 공소사실을 자백하고 있으나 달리 자백을 뒷받침할 다른 증거가 없는 경우, 甲과 乙에게 무죄를 선고하여야 한다.", "explanation": "형사소송법 제310조 소정의 “피고인의 자백”에 공범인 공동피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다(대판 1990.10.30. 90도1939). ▶ 공범인 공동피고인 甲(乙)의 자백은 자백보강법칙 적용 대상인 ‘피고인의 자백’에 해당하지 않아, 서로의 범죄사실에 대하여 독립된 별개의 증거이자 甲(乙)의 자백에 대한 보강증거가 될 수 있다. 지문에서 甲과 乙이 모두 공소사실을 자백하고 있으므로 甲과 乙 모두에 대하여 유죄판결 선고 가능하다.", "answer": "X"}, {"source": "24변시", "question": "甲은 평소 주벽과 의처증이 심한 남편 A와의 불화로 인해 이혼소송을 준비하던 중 A의 운전기사 乙에게 A를 살해하도록 부탁하였다. 乙은 甲의 부탁대로 술에 취하여 자고 있던 A의 목을 졸라 살해하였다. 검사는 乙을 살인죄로, 甲을 살인교사죄로 기소하였고 법원은 甲과 乙을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 법정에서 A에 대한 살인교사 혐의를 자백한 경우, 甲의 진술은 乙에 대한 유죄의 증거로 사용될 수 있다.", "explanation": "형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 진술은 포함되지 않으며, 이러한 공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립한 증거능력이 있다(대판 1992.07.28. 92도917). ▶ 乙의 공범인 공동피고인 甲에게 반대신문권이 보장되어 있기 때문에 그 ‘법정진술’은 乙의 공소사실과 관련하여 증거능력이 있다. 한편, 위 ㄷ.에서와 같이 공범인 공동피고인의 진술에는 독립한 증거능력이 있다.", "answer": "O"}, {"source": "24변시", "question": "甲은 평소 주벽과 의처증이 심한 남편 A와의 불화로 인해 이혼소송을 준비하던 중 A의 운전기사 乙에게 A를 살해하도록 부탁하였다. 乙은 甲의 부탁대로 술에 취하여 자고 있던 A의 목을 졸라 살해하였다. 검사는 乙을 살인죄로, 甲을 살인교사죄로 기소하였고 법원은 甲과 乙을 병합심리하고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심법원이 甲에게 형의 선고를 하면서 乙이 A의 목을 졸라 살해한 사실을 적시하지 않았더라도, 甲의 방어권이나 甲의 변호인의 변호권이 본질적으로 침해되지 않았다고 볼 만한 특별한 사정이 있다면, 판결에 영향을 미친 법령의 위반은 아니다.", "explanation": "정범의 성립은 교사범, 방조범의 구성요건의 일부를 형성하고 교사범, 방조범이 성립함에는 먼저 정범의 범죄행위가 인정되는 것이 그 전제요건이 되는 것은 공범의 종속성에 연유하는 당연한 귀결이며, 따라서 교사범, 방조범의 사실 적시에 있어서도 정범의 범죄 구성요건이 되는 사실 전부를 적시하여야 하고, 이 기재가 없는 교사범, 방조범의 사실 적시는 죄가 되는 사실의 적시라고 할 수 없다 할 것인바, ... 결국 원심판결에는 유죄판결에 명시될 이유를 갖추지 아니한 제1심 판결을 유지하여 이유불비의 위법이 있어 이 위법은 판결결과에 영향을 미쳤음이 명백하므로 상고논지는 이 점에서 그 이유있다고 할 것이다(대판 1981.11.24. 81도2422). ▶ 범죄의 구성요건 사실은 유죄판결에 명시될 이유에 해당하며, 공범 사실을 명시할 때에는 정범의 구성요건 사실도 적시해야 한다. 지문에서 교사범 甲에게 형 선고하면서 정범 乙의 살인죄 구성요건 사실 적시하지 않아 판결에 영향 미친 위법이 있다.", "answer": "X"}, {"source": "24변시", "question": "전문서류의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "증인이 자신에 대한 관련 형사판결이 확정되었음에도 정당한 이유 없이 법정증언을 거부하여 피고인이 반대신문을 하지 못하였다면, 설령 피고인이 증인의 증언거부 상황을 초래하였다고 하더라도 「형사소송법」 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않아 수사기관에서 그 증인의 진술을 기재한 서류는 증거능력이 없다.", "explanation": "수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다고 보아야 한다. 따라서 증인이 정당하게 증언거부권을 행사하여 증언을 거부한 경우와 마찬가지로 수사기관에서 그 증인의 진술을 기재한 서류는 증거능력이 없다(대판 2019.11.21. 2018도13945(전합)).\n", "answer": "X"}, {"source": "24변시", "question": "전문서류의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형사소송법」 제312조 제1항의 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함하는 개념으로서, 이때의 ‘공범’에는 대향범도 포함된다.", "explanation": "형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023도3741).", "answer": "O"}, {"source": "24변시", "question": "전문서류의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "조세범칙조사를 담당하는 세무공무원이 피고인이 된 혐의자 또는 참고인에 대하여 심문한 내용을 기재한 조서는 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류에 해당하므로 「형사소송법」 제313조에 따라 증거능력의 존부를 판단하여야 한다.", "explanation": "조세범칙조사를 담당하는 세무공무원이 피고인이 된 혐의자 또는 참고인에 대하여 심문한 내용을 기재한 조서는 검사·사법경찰관 등 수사기관이 작성한 조서와 동일하게 볼 수 없으므로 형사소송법 제312조에 따라 증거능력의 존부를 판단할 수 없고, 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류에 해당하므로 형사소송법 제313조에 따라 공판준비 또는 공판기일에서 작성자·진술자의 진술에 따라 성립의 진정함이 증명되고 나아가 그 진술이 특히 신빙할 수 있는 상태 아래에서 행하여진 때에 한하여 증거능력이 인정된다(대판 2022.12.15. 2022도8824).", "answer": "O"}, {"source": "24변시", "question": "전문서류의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "보험사기 사건에서 건강보험심사평가원이 수사기관의 의뢰에 따라 그 보내온 자료를 토대로 입원진료의 적정성에 대한 의견을 제시하는 내용의 ‘건강보험심사평가원의 입원진료 적정성 여부 등 검토의뢰에 대한 회신’은 사무 처리 내역을 계속적, 기계적으로 기재한 문서가 아니므로 「형사소송법」 제315조 제3호의 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’에 해당하지 않는다.", "explanation": "형사소송법 제315조 제3호에서 규정한 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’는 형사소송법 제315조 제1호와 제2호에서 열거된 공권적 증명문서 및 업무상 통상문서에 준하여 ‘굳이 반대신문의 기회 부여 여부가 문제 되지 않을 정도로 고도의 신용성의 정황적 보장이 있는 문서’를 의미한다. 따라서 사무처리 내역을 계속적, 기계적으로 기재한 문서가 아니라 범죄사실의 인정 여부와 관련 있는 어떠한 의견을 제시하는 내용을 담고 있는 문서는 형사소송법 제315조 제3호에서 규정하는 당연히 증거능력이 있는 서류에 해당한다고 볼 수 없으므로, 보험사기 사건에서 건강보험심사평가원이 수시기관의 의뢰에 따라 그 보내온 자료를 토대로 입원진료의 적정성에 대한 의견을 제시하는 내용의 회신은 「형사소송법」 제315조 제3호의 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’에 해당하지 않는다(대판 2017.12.05. 2017도12671).\n", "answer": "O"}, {"source": "24변시", "question": "전문서류의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "전문진술이 기재된 조서는 「형사소송법」 제312조 또는 제314조의 규정의 요건과 「형사소송법」 제316조의 규정의 요건을 갖추는 경우 증거능력이 인정된다.", "explanation": "전문진술이나 전문진술을 기재한 조서는 형사소송법 제310조의2의 규정에 따라 원칙적으로 증거능력이 없고, 다만 전문진술은 형사소송법 제316조 제2항의 규정에 따라 원진술자가 사망, 질병, 외국거주 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에 한하여 예외적으로 증거능력이 있으며, 전문진술이 기재된 조서는 형사소송법 제312조 또는 제314조의 규정에 따라 증거능력이 인정될 수 있는 경우에 해당하여야 함은 물론 형사소송법 제316조 제2항의 규정에 따른 요건을 갖추어야 예외적으로 증거능력이 있다(대판 2001.09.04. 2001도3081).", "answer": "O"}, {"source": "22변시", "question": "甲과 乙은 丙과 공모하여 피해자 A로부터 금품을 갈취한 공소사실로 기소되었는데, 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였다. 검사는 丙의 동생인 B가 丙으로부터 \"나는 甲, 乙과 함께 A의 금품을 갈취하였다.\"라는 말을 들었다는 것을 알고, B를 조사하여 그와 같은 내용의 B에 대한 진술조서를 작성하였다. 甲과 乙은 공판과정에서 위 공소사실을 다투고 있다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 사법경찰관이 작성한 乙에 대한 피의자신문조서에 대하여 증거로 함에 동의하지 않은 경우라도 乙이 법정에서 경찰 수사 도중 위 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였다면 이러한 증언은 甲에 대한 유죄 인정의 증거로 사용할 수 있다
