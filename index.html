<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>형사소송법 OX 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f1f4;
    --border: #d8dae3;
    --accent: #1a47c8;
    --accent2: #e84040;
    --correct: #16a34a;
    --wrong: #dc2626;
    --text: #1a1c2e;
    --text-muted: #4b4f6b;
    --text-dim: #9093ab;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    line-height: 1.7;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #ffffff 0%, #f4f5f7 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab.active {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--border);
    border-bottom-color: var(--surface);
  }

  /* ── Controls ── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .stat-badge span { color: var(--accent); font-weight: 600; }

  .btn {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.18s;
    font-weight: 500;
  }
  .btn:hover { background: var(--border); border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    font-weight: 700;
  }
  .btn.primary:hover { background: #1338a8; }

  .jump-wrap { display: flex; gap: 4px; align-items: center; }
  .jump-input {
    width: 90px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.8rem;
  }
  .jump-input::placeholder { color: var(--text-dim); }
  .jump-input:focus { outline: none; border-color: var(--accent); }
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .progress-bar {
    height: 3px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #f0a030);
    transition: width 0.3s ease;
  }

  /* ── Quiz Area ── */
  .quiz-area {
    max-width: 800px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 16px;
    position: relative;
    transition: all 0.25s;
  }
  .card.correct-card { border-color: var(--correct); box-shadow: 0 0 0 1px rgba(22,163,74,0.15), 0 8px 24px rgba(22,163,74,0.06); }
  .card.wrong-card { border-color: var(--wrong); box-shadow: 0 0 0 1px rgba(220,38,38,0.15), 0 8px 24px rgba(220,38,38,0.06); }

  .meta-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .meta-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 9px;
    font-size: 0.7rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .meta-num {
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .question-text {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    font-style: italic;
  }

  .choice-text {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 22px;
  }

  /* ── OX Buttons ── */
  .ox-buttons {
    display: flex;
    gap: 12px;
  }
  .ox-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .ox-btn:hover { transform: translateY(-2px); }
  .ox-btn.o-btn:hover { border-color: var(--correct); color: var(--correct); background: rgba(22,163,74,0.08); }
  .ox-btn.x-btn:hover { border-color: var(--wrong); color: var(--wrong); background: rgba(220,38,38,0.08); }
  .ox-btn.selected-o { border-color: var(--correct); color: var(--correct); background: rgba(22,163,74,0.10); }
  .ox-btn.selected-x { border-color: var(--wrong); color: var(--wrong); background: rgba(220,38,38,0.10); }
  .ox-btn:disabled { cursor: default; transform: none; opacity: 0.7; }

  /* ── Answer Reveal ── */
  .answer-reveal {
    margin-top: 18px;
    padding: 16px 20px;
    border-radius: 12px;
    border-left: 3px solid;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown {
    from { opacity:0; transform:translateY(-8px); }
    to { opacity:1; transform:translateY(0); }
  }
  .answer-reveal.correct { background: rgba(22,163,74,0.07); border-color: var(--correct); }
  .answer-reveal.wrong { background: rgba(220,38,38,0.07); border-color: var(--wrong); }

  .answer-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .answer-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .answer-label.correct { color: var(--correct); }
  .answer-label.wrong { color: var(--wrong); }
  .answer-value {
    background: var(--surface2);
    border-radius: 6px;
    padding: 3px 12px;
    font-size: 1rem;
    font-weight: 700;
  }
  .answer-value.o { color: var(--correct); }
  .answer-value.x { color: var(--wrong); }

  .explanation-text {
    font-size: 0.84rem;
    color: var(--text-muted);
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .next-btn-wrap { margin-top: 16px; text-align: right; }

  /* ── Empty / Finish ── */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
  }
  .empty-state h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }

  /* ── Score Screen ── */
  .score-screen {
    text-align: center;
    padding: 48px 24px;
  }
  .score-big {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 8px;
  }
  .score-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 32px; }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 300px;
    margin: 0 auto 32px;
  }
  .score-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .score-item .val { font-size: 1.8rem; font-weight: 700; }
  .score-item .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
  .score-item.c .val { color: var(--correct); }
  .score-item.w .val { color: var(--wrong); }

  /* mode filter */
  .mode-btns { display: flex; gap: 6px; }
  .mode-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
  }
  .mode-btn:hover, .mode-btn.active { background: var(--surface2); color: var(--accent); border-color: var(--accent); }

  @media (max-width: 600px) {
    .quiz-area { padding: 16px 14px; }
    .card { padding: 18px 16px; }
    .score-big { font-size: 3.5rem; }
    .controls { padding: 10px 14px; gap: 8px; }
    .ox-btn { padding: 18px 10px; font-size: 1.4rem; }
    .title { font-size: 1.1rem; }
    .choice-text { font-size: 0.95rem; }
    .controls { overflow-x: auto; flex-wrap: nowrap; }
    select { max-width: 120px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="title">⚖️ 형사소송법 OX 퀴즈</div>
      <div class="subtitle">변호사시험 기출 · OX 판단 훈련</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('suhap')">수합본 <small id="suhap-count"></small></button>
    <button class="tab" onclick="switchTab('burok')">부록-연도별종합문제 <small id="burok-count"></small></button>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="controls">
  <div class="stat-badge">현재 <span id="cur-idx">0</span> / <span id="total-cnt">0</span></div>
  <div class="stat-badge">정답 <span id="correct-cnt" style="color:var(--correct)">0</span> 오답 <span id="wrong-cnt" style="color:var(--wrong)">0</span></div>
  <select id="source-filter" onchange="applyFilter()"></select>
  <div class="mode-btns">
    <button class="mode-btn active" id="mode-all" onclick="setMode('all')">전체</button>
    <button class="mode-btn" id="mode-wrong" onclick="setMode('wrong')">오답만</button>
    <button class="mode-btn" id="mode-shuffle" onclick="setMode('shuffle')">랜덤</button>
  </div>
  <div class="jump-wrap">
    <input type="number" id="jump-input" class="jump-input" placeholder="번호 이동" min="1" onkeydown="if(event.key==='Enter')jumpTo()">
    <button class="btn" onclick="jumpTo()">이동</button>
  </div>
  <button class="btn primary" onclick="restartQuiz()">처음부터</button>
</div>

<div class="quiz-area" id="quiz-area"></div>

<script>

on": "재정신청에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "헌법재판소 결정에 의하면 재정신청에 관한 법원의 기각 결정에 대해서는 재항고로 불복할 수 있다.", "explanation": "재정신청 기각 결정에 대하여 형사소송법 제415조의 재항고를 금지하는 것은 대법원에 명령 · 규칙 또는 처분의 위헌 · 위법 심사 권한을 부여하여 법령 해석의 통일성을 기하고자 하는 헌법 제107조 제2항의 취지에 반할 뿐 아니라, 헌법재판소법에 의하여 법원의 재판이 헌법소원의 대상에서 제외되어 있는 상황에서 재정신청인의 재판청구권을 지나치게 제약하는 것이 된다. 그리고 법 제415조는 법 제402조와 달리 아무런 예외를 두지 않은 채 이른바 법령 위반을 이유로 즉시항고할 수 있다고 규정하고 있고, 소액사건심판법 제3조 제1호 ‘상고심 절차에 관한 특례법’ 제4조 제1항에서 처분이나 원심 판결의 헌법 위반이나 법률 위반 여부가 문제되는 경우 대법원의 판단을 받도록 규정하고 있는 것과 비교할 때, 처분(불기소 처분)의 헌법 위반 여부나 위법 · 부당 여부에 관한 법원의 결정인 재정신청 기각 결정에 대하여 이른바 법령 위반을 이유로 한 재항고를 허용하지 아니하는 것은 재정신청 기각 결정의 법적 성격에도 부합하지 않으며, 민사소송법은 재항고(제442조)뿐만 아니라 불복할 수 없는 결정이나 명령에 대하여 이른바 법령 위반을 이유로 대법원에 특별항고를 할 수 있도록 하고 있다(제449조). 비교법적으로도 일본 형사소송법은 항고 재판소의 결정에 대하여는 항고할 수 없지만, 항고 재판소의 결정에 대하여 헌법 위반이나 헌법 해석의 잘못을 이유로 하여 특별항고를 할 수 있도록 규정하고 있다. 이러한 사정들을 고려할 때, 법 제262조 제4항의 “불복할 수 없다\"는 부분은, 재정신청 기각 결정에 대한 ‘불복’에 법 제415조의 ‘재항고’가 포함되는 것으로 해석하는 한, 재정신청인인 청구인들의 재판청구권을 침해하고 또 법 제415조의 재항고가 허용되는 고등법원의 여타 결정을 받은 사람에 비하여 합리적 이유 없이 재정신청인을 차별 취급함으로써 청구인들의 평등권을 침해한다(헌재 2011.11.24. 2008헌마578).", "answer": "O"}, {"source": "19변시", "question": "공소장 기재사항 및 공소사실의 특정에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "포괄일죄에 대한 공소장을 작성하는 경우에는 그 일죄의 일부를 구성하는 개개의 행위에 대하여 구체적으로 특정되지 아니하더라도 그 전체 범행의 시기와 종기, 범행 방법, 피해자나 상대방, 범행 횟수나 피해액의 합계 등을 명시하면 이로써 그 범죄사실은 특정된 것이라고 할 수 있다.", "explanation": "공소사실의 기재에 있어서 범죄의 일시 장소 방법을 명시하여 공소사실을 특정하도록 한 법의 취지는 법원에 대하여 심판의 대상을 한정하고 피고인에게 방어의 범위를 특정하여 그 방어권 행사를 쉽게 해 주기 위한 데에 있는 것이므로, 공소사실은 이러한 요소를 종합하여 구성요건 해당 사실을 다른 사실과 구별할 수 있을 정도로 기재하면 족하고, 공소장에 범죄의 일시, 장소, 방법 등이 구체적으로 적시되지 않았더라도 위와 같이 공소사실을 특정하도록 한 법의 취지에 반하지 아니하고, 공소 범죄의 성격에 비추어 그 개괄적 표시가 부득이한 경우에는, 그 공소 내용이 특정되지 않아 공소 제기가 위법하다고 할 수 없으며, 특히 포괄일죄에 있어서는 그 일죄의 일부를 구성하는 개개의 행위에 대하여 구체적으로 특정되지 아니하더라도 그 전체 범행의 시기와 종기, 범행 방법, 피해자나 상대방, 범행 횟수나 피해액의 합계 등을 명시하면 이로써 그 범죄사실은 특정되는 것이라고 할 것이다(대판 1999.11.12. 99도2934).", "answer": "O"}, {"source": "19변시", "question": "공소장 기재사항 및 공소사실의 특정에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장의 기재가 불명확할 경우 비록 공소사실의 보완이 가능하더라도 법원이 검사에게 공소사실 특정에 대한 석명에 이르지 아니하고 공소사실의 불특정을 이유로 공소기각의 판결을 하여도 적법하다.", "explanation": "공소장의 기재가 불명확한 경우 법원은 형사소송규칙 제141조의 규정에 의하여 검사에게 석명을 구한 다음, 그래도 검사가 이를 명확하게 하지 않은 때에야 공소사실의 불특정을 이유로 공소를 기각함이 상당하다고 할 것이므로 원심이 검사에게 공소사실 특정에 관한 석명에 이르지 아니한 채 곧바로 위와 같이 공소사실의 불특정을 이유로 공소기각의 판결을 한 데에는, 공소사실의 특정에 관한 법리를 오해하였거나 심리를 미진한 위법이 있다고 할 것이고, 따라서 이를 지적하는 검사의 상고 이유의 논지는 이유 있다(대판 2006.05.11. 2004도5972).", "answer": "X"}, {"source": "19변시", "question": "공소장 기재사항 및 공소사실의 특정에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "교사범이나 방조범의 경우에는 정범의 범죄 구성을 충족하는 구체적 사실을 특정할 필요가 없다.", "explanation": "공소사실이란 범죄의 특별구성요건을 충족하는 구체적 사실을 말하며 공소장에는 공소사실의 기재에 있어서 공소의 원인 된 사실을 다른 사실과 구별할 수 있을 정도로 특정하도록 형사소송법이 요구하고 있으며, 방조범의 공소사실을 기재함에 있어서는 그 전제 요건이 되는 정범의 범죄구성요건을 충족하는 구체적 사실을 기재하여야 공소사실의 기재가 있다고 볼 것이다(대판 1982.02.23. 81도822).", "answer": "X"}, {"source": "19변시", "question": "공소장 기재사항 및 공소사실의 특정에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "필요 이상 엄격하게 공소사실의 특정을 요구하는 것도 공소의 제기와 유지에 장애를 초래할 수 있으므로, 범죄의 일시는 이중기소나 시효에 저촉되지 않을 정도로, 장소는 토지관할을 가늠할 수 있을 정도로, 그리고 방법에 있어서는 범죄구성요건을 밝히는 정도로 기재하면 족하다.", "explanation": "공소장에의 공소사실 기재는 법원에 대하여 심판의 대상을 한정하고 피고인에게 방어의 범위를 특정하여 그 방어권 행사를 용이하게 하기 위하여 요구되는 것이므로 범죄의 일시, 장소, 방법 등 소인을 명시하여 사실을 가능한 한 명확하게 특정할 수 있도록 하는 것이 바람직하나 그렇다고 해서 필요 이상 엄격하게 특정을 요구하는 것도 공소의 제기와 유지에 장애를 초래할 수 있으므로, 범죄의 일시는 이중기소나 시효에 저촉되지 않을 정도로 장소는 토지관할을 가늠할 수 있을 정도로, 그리고 방법에 있어서는 범죄구성요건을 밝히는 정도로 기재하면 족하다(대판 1992.09.14. 92도1532).", "answer": "O"}, {"source": "19변시", "question": "공소장 기재사항 및 공소사실의 특정에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소사실의 기재는 다른 공소사실과 구별할 수 있는 정도로 특정하면 족하고 그 일부가 다소 불명확하게 적시되어 있더라도 그와 함께 적시된 다른 사항들에 의하여 그 공소사실을 특정할 수 있고 피고인의 방어권 행사에 지장이 없다면, 그 공소제기의 효력에는 영향이 없다.", "explanation": "공소사실의 특정은 공소 제기된 범죄의 성격에 비추어 그 공소의 원인이 된 사실을 다른 공소사실과 구별할 수 있을 정도로 그 일시 장소 방법, 목적 등을 적시하여 특정하면 족하고, 그 일부가 다소 불명확하더라도 그와 함께 적시된 다른 사항들에 의하여 그 공소사실을 특정할 수 있고, 그리하여 피고인의 방어권 행사에 지장이 없다면, 공소 제기의 효력에는 영향이 없다(대판 1999.04.23. 99도82).", "answer": "O"}, {"source": "14변시", "question": "공소사실의 특정에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "포괄일죄에 있어서는 그 일죄의 일부를 구성하는 개개의 행위에 대하여 구체적으로 특정하지 않더라도 전체 범행의 시기와 종기 범행 방법, 피해자나 상대방 범행 횟수, 피해액의 합계 등을 명시하면 공소사실이 특정된 것으로 본다.", "explanation": "공소사실의 기재는 범죄의 시일 장소와 방법을 명시하여 사실을 특정할 수 있도록 하여야 한다 (형사소송법 제254조 제4항) .", "answer": "O"}, {"source": "14변시", "question": "공소사실의 특정에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "교사범이나 방조범의 경우 교사나 방조의 사실뿐만 아니라 정범의 범죄사실도 특정하여야 한다.", "explanation": "정범의 성립은 교사범, 방조범의 구성요건의 일부를 형성하고 교사범 방조범이 성립함에는 먼저 정범의 범죄행위가 인정되는 것이 그 전제 요건이 되는 것은 공범의 종속성에 연유하는 당연한 귀결이며, 따라서 교사범, 방조범의 사실 적시에 있어서도 정범의 범죄 구성요건이 되는 사실 전부를 적시하여야 하고, 이 기재가 없는 교사범, 방조범의 사실 적시는 죄가 되는 사실의 적시라고 할 수 없다(대판 1981.11.24. 81도2422).", "answer": "O"}, {"source": "14변시", "question": "공소사실의 특정에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "간통죄의 공소사실을 “피고인들이 2011. 5. 중순경부터 2012. 4. 3. 경까지 사이에 부산시 동구 수정4동 984 및 그들의 셋방 등지에서 횟수 불상 간음하여 간통하였다\"라고 기재한 경우 공소사실이 특정되었다고 볼 수 있다.", "explanation": "간통죄는 각 성행위마다 1개의 간통죄가 성립되는 것이므로 공소장에 “피고인은 1978.5.말경부터 같은 해 9.말경까지 사이에 상피고인과 수회 간음하여 각 간통하였다”라는 기재는 추상적인 범죄구성 요건의 문구만이 적시되어 있을 뿐 구체적 범죄사실의 기재가 없어 공소제기로서는 유효 요건을 갖추지 못한 것이다(대판 1980.07.22. 79도2246) ... 현행법상 간통죄가 폐지되었으므로 다시 출제될 가능성은 없어 보입니다.", "answer": "X"}, {"source": "14변시", "question": "공소사실의 특정에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "유가증권변조 사건의 공소사실이 범행 일자를 ‘2005. 1. 말 경에서 같은 해 2. 4. 사이’로, 범행 장소를 ‘서울 불상지’로 범행 방법을 ‘불상의 방법으로 수취인의 기재를 삭제’로 되어 있는 경우, 변조된 유가증권이 압수되어 현존하고 있는 이상 공소사실이 특정되었다고 볼 수 있다.", "explanation": "이 사건 유가증권 변조의 공소사실이 범행 일시를 “2005. 1. 말경에서 같은 해 2. 4. 사이”로, 범행 장소를 “서울 불상지”로, 범행 방법을 “불상의 방법으로 수취인의 기재를 삭제”한 것으로 되어 있다 하더라도, 유가증권 변조 여부가 문제로 된 이 사건에서 그 변조된 유가증권이 압수되어 현존하고 있는 이상, 위 범죄의 일시와 장소 및 방법의 기재는 범죄의 동일성 인정과 이중기소 방지, 시효 저촉 여부, 토지관할을 가름할 수 있는 범위 내에서 그 유가증권 변조 사실을 뒷받침한다고 보기에 충분하여 그 구성요건 해당 사실이 다른 범죄사실과 판별할 수 있는 정도로 기재되어 있고 이 부분 공소 범죄의 성격에 비추어 그 개괄적 표시가 부득이하며 그에 대한 피고인의 방어권 행사에 지장이 없다고 보이므로, 공소사실이 특정되지 아니하여 공소제기가 위법하다고 볼 수 없다(대판 2008.03.27. 2007도11000)", "answer": "O"}, {"source": "14변시", "question": "공소사실의 특정에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "공소장의 기재 사실 중 일부가 명확하지 아니한 경우 법원이 검사에게 석명을 구하지 않고 곧바로 공소기각 판결을 하면 심리 미진의 위법이 될 수 있다.", "explanation": "공소장의 기재가 불명확한 경우 법원은 형사소송규칙 제141조의 규정에 의하여 검사에게 석명을 구한 다음, 그래도 검사가 이를 명확하게 하지 않은 때에야 공소사실의 불특정을 이유로 공소를 기각함이 상당하다고 할 것이므로, 원심이 검사에게 공소사실 특정에 관한 석명에 이르지 아니한 채 곧바로 위와 같이 공소사실의 불특정을 이유로 공소기각의 판결을 한 데에는, 공소사실의 특정에 관한 법리를 오해하였거나 심리를 미진한 위법이 있다고 할 것이고, 따라서 이를 지적하는 검사의 상고 이유의 논지는 이유 있다(대판 2006.05.11. 2004도5972).", "answer": "O"}, {"source": "26변시", "question": "공소취소에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판레에 의함)", "choice": "제1심판결이 선고되고 이 판결이 확정된 후 이에 대한 재심소송절차가 진행 중인 경우에는 공소취소를 할 수 없다.", "explanation": "형사소송법 제255조 제1항에 의하면 공소는 제1심 판결의 선고 전까지 취소할 수 있다고 규정되어 있는바 이건 공소사실에 대하여는 이미 오래전에 제1심 판결이 선고되고 동 판결이 확정되어 이에 대한 재심소송절차가 진행 중에 있으므로 이 재심절차 중에 있어서의 공소취소는 이를 할 수 없는 것이라고 볼 것인즉 같은 취지에서 이건 공소취소는 허용될 수 없어 그 효력이 없는 것이라고 한 원심 판단은 정당하다(대판 1976. 12. 28. 76도3203).", "answer": "O"}, {"source": "26변시", "question": "공소취소에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판레에 의함)", "choice": "검사는 고소 또는 고발 있는 사건에 관하여 공소 취소를 한 때에는 그 처분한 날로부터 7일 이내에 서면으로 고소인 또는 고발인에게 그 취지를 통지하여야 한다.", "explanation": "형사소송법 제258조 제1항 참조. 형사소송법 제258조(고소인등에의 처분고지) ① 검사는 고소 또는 고발있는 사건에 관하여 공소를 제기하거나 제기하지 아니하는 처분, 공소의 취소 또는 제256조의 송치를 한 때에는 그 처분한 날로부터 7일 이내에 서면으로 고소인 또는 고발인에게 그 취지를 통지하여야 한다.", "answer": "O"}, {"source": "26변시", "question": "공소취소에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판레에 의함)", "choice": "약식명령의 고지가 있은 후에는 공소취소가 허용되지 않으므로 정식재판청구에 의해 공판절차가 개시되더라도 제1심 판결 선고 전이라는 이유로 공소취소를 하는 것은 허용되지 않는다.", "explanation": "약식명령은 정식재판 청구에 의한 판결이 있는 때에는 실효되는 것이므로(형사소송법 제456조), 정식재판청구에 의해 공판절차가 개시되면 제1심 공판절차가 진행되는 것이고 따라서 제1심 판결 선고 전까지는 공소취소를 할 수 있다(형사소송법 제255조 제1항).\n형사소송법 제255조(공소의 취소) ① 공소는 제1심판결의 선고 전까지 취소할 수 있다.\n형사소송법 제456조(약식명령의 실효) 약식명령은 정식재판의 청구에 의한 판결이 있는 때에는 그 효력을 잃는다.", "answer": "X"}, {"source": "26변시", "question": "공소취소에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판레에 의함)", "choice": "공소취소의 사유에는 법률상 제한이 없으므로, 재정신청에 대한 고등법원의 공소제기결정에 따라 공소제기된 사건에서도 검사는 사정 변화로 인한 처벌 가치의 감소 등의 사유가 있으면 공소를 취소할 수 있다.", "explanation": "형사소송법 제264조의2 참조.\n형사소송법 제264조의2(공소취소의 제한) 검사는 제262조제2항제2호의 결정에 따라 공소를 제기한 때에는 이를 취소할 수 없다.", "answer": "X"}, {"source": "26변시", "question": "공소취소에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판레에 의함)", "choice": "실체적 경합관계에 있는 수개의 공소사실 중 일부 공소사실을 철회한다는 검사의 공소장변경 허가신청을 법원이 허가한 경우, 그 취지가 일부의 공소를 취소한다는 것이 명백하면 법원은 결정으로 그 부분 공소를 기각하여야 한다.", "explanation": "실체적 경합관계에 있는 수 개의 공소사실 중 어느 한 공소사실을 전부 철회하는 검사의 공소장변경 신청이 있는 경우 이것이 그 부분의 공소를 취소하는 취지가 명백하다면 비록 공소취소라는 형식을 갖추지 않았더라도 이를 공소취소로 보아야 한다(대판 2022.04.14. 2022도772).", "answer": "O"}, {"source": "12변시", "question": "다음 설명에 대하여 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "재정신청에 대하여 법원의 공소제기 결정이 있게 되면 공소제기가 의제되므로 이는 불고불리의 원칙의 예외라고 할 수 있다.", "explanation": "법원이 공소제기를 결정하면 검사는 공소를 제기하여야 한다. 즉, 공소는 법원의 결정으로 제기가 의제되는 것이 아니라 검사가 제기한다.", "answer": "X"}, {"source": "12변시", "question": "다음 설명에 대하여 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "행위자에게 유죄의 재판을 하지 아니하면서 몰수를 선고하기 위하여서는 몰수의 요건이 공소가 제기된 공소사실과 관련되어 있어야 하고, 공소가 제기되지 아니한 별개의 범죄 사실을 인정하여 몰수만을 선고하는 것은 허용되지 아니한다.", "explanation": "형법 제49조 단서는 행위자에게 유죄의 재판을 하지 아니할 때에도 몰수의 요건이 있는 때에는 몰수만을 선고할 수 있다고 규정하고 있으므로 몰수뿐만 아니라 몰수에 갈음하는 추정도 위 규정에 근거하여 선고 할 수 있다고 할 것이나 우리 법제상 공소의 제기 없이 별도로 몰수나 추징만을 선고할 수 있는 제도가 마련되어 있지 아니하므로 위 규정에 근거하여 몰수나 추징을 선고하기 위하여서는 몰수나 추징의 요건이 공소가 제기된 공소사실과 관련되어 있어야 하고 공소사실이 인정되지 않는 경우에 이와 별개의 공소가 제기되지 아니한 범죄사실을 법원이 인정하여 그에 관하여 몰수나 추징을 선고히는 것은 불고불리의 원칙에 위반 되어 불가능하며, 몰수나 추정이 공소사실과 관련이 있다 하더라도 그 공소사실에 관하여 이미 공소시효가 완성되어 유죄의 선고를 할 수 없는 경우에는 몰수나 추징도 할 수 없다(대판 2010.05.13. 2009도11732).", "answer": "O"}, {"source": "12변시", "question": "다음 설명에 대하여 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인만 정식재판을 청구한 사건에 대하여 법원은 약식명령의 형보다 중한 형을 선고하지 못한다.", "explanation": "형사소송법 제457조의2의 개정으로 약식명령에 대하여 피고인이 정식재판을 청구한 경우 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 변경되었다.\n형사소송법 제457조의2(형종 상향의 금지 등)  ① 피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 종류의 형을 선고하지 못한다.", "answer": "X"}, {"source": "12변시", "question": "다음 설명에 대하여 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "공범 중 1인으로 기소된 자가 범죄의 증명이 없다는 이유로 무죄의 판결을 선고받아 그 판결이 확정되었더라도, 무죄로 확정된 그 피고사건에서 공범으로 지적된 진범인에 대하여 공소시효정지의 효력이 생긴다.", "explanation": "진범이 아닌 자에 대하여 공소를 제기한 경우 진범에 대한 공소시효의 진행을 정지시키지 않는다.\n형사소송법 제253조 제1항, 제2항에 의하면 공소시효는 공소의 제기로 진행이 정지되고, 공범의 1인에 대한 공소시효의 정지는 다른 공범자에 대하여 효력이 미치고 당해 사건의 재판이 확정된 때로부터 진행 한다고 규정하고 있는바, 위 제2항 소정의 공범관계의 존부는 현재 시효가 문제되어 있는 사건을 심판하는 법원이 판단하는 것으로서 법원조직법 제8조의 경우를 제외하고는 다른 법원의 판단에 구속되는 것은 아니라고 할 것이고, 위 형사소송법 제253조 제2항 소정의 재판이라 함은 종국재판이면 그 종류를 묻지 않는다고 할 것이나, 공범의 1인으로 기소된 자가 구성요건에 해당하는 위법행위를 공동으로 하였다고 인정되기는 하나 책임조각을 이유로 무죄로 되는 경우와는 달리 범죄의 증명이 없다는 이유로 공범 중 1인이 무죄의 확정판결을 선고받은 경우에는 그를 공범이라고 할 수 없어 그에 대하여 제기된 공소로써는 진범에 대한 공소시효정지의 효력이 없다(대판 1999.03.09. 98도4621).", "answer": "X"}, {"source": "12변시", "question": "다음 설명에 대하여 옳은 것(0)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "검사가 공소제기 후에 그 피고사건에 관하여 수소법원이 아닌 지방법원판사에게 청구하여 발부받은 영장에 의하여 압수·수색을 하여 수집된 증거는 원칙적으로 유죄의 증거로 삼을 수 없다.", "explanation": "형사소송법은 제215조에서 검사가 압수·수색 영장을 청구할 수 있는 시기를 공소제기 전으로 명시적으로 한정하고 있지는 아니하나, 헌법상 보장된 적법절차의 원칙과 재판받을 권리, 공판중심주의 · 당사 자주의 · 직접주의를 지향하는 현행 형사소송법의 소송구조, 관련 법규의 체계, 문언 형식, 내용 등을 종합하여 보면, 일단 공소가 제기된 후에는 피고사건에 관하여 검사로서는 형사소송법 제215조에 의하여 압수·수색을 할 수 없다고 보아야 하며 그럼에도 검사가 공소제기 후 형사소송법 제215조에 따라 수소법원 이외의 지방법원 판사에게 청구하여 발부받은 영장에 의하여 압수 · 수색을 하였다면, 그와 같이 수집된 증거는 기본적 인권 보장을 위해 마련된 적법한 절차에 따르지 않은 것으로서 원칙적으로 유죄의 증거로 삼을 수 없다(대판 2011.04.28. 2009도10412).\n", "answer": "O"}, {"source": "25변시", "question": "공소시효에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공범 중 1인에 대해 약식명령이 확정된 후 그에 대한 정식재판청구권회복결정이 있었다고 하더라도 그 사이의 기간 동안에는 특별한 사정이 없는 한 다른 공범자에 대한 공소시효는 정지함이 없이 계속 진행한다.", "explanation": "공범 중 1인에 대해 약식명령이 확정된 후 그에 대한 정식재판청구권회복결정이 있었다고 하더라도 그 사이의 기간 동안에는, 특별한 사정이 없는 한, 다른 공범자에 대한 공소시효는 정지함이 없이 계속 진행한다고 보아야 할 것이다(대판 2012.03.29. 2011도15137).", "answer": "O"}, {"source": "25변시", "question": "공소시효에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⌜형사소송법⌟제253조 제3항의 ‘범인이 형사처분을 면할 목적으로 국외에 있는 경우’는 범인이 국내에서 범죄를 저지르고 형사처분을 면할 목적으로 국외로 도피한 경우에 한정되고, 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우는 포함되지 않는다.", "explanation": "형사소송법 제253조 제3항은 “범인이 형사처분을 면할 목적으로 국외에 있는 경우 그 기간 동안 공소시효는 정지된다.”라고 규정하고 있다. 위 규정의 입법 취지는 범인이 우리나라의 사법권이 실질적으로 미치지 못하는 국외에 체류한 것이 도피의 수단으로 이용된 경우에 체류기간 동안은 공소시효가 진행되는 것을 저지하여 범인을 처벌할 수 있도록 하여 형벌권을 적정하게 실현하고자 하는 데 있다. 따라서 위 규정이 정한 '범인이 형사처분을 면할 목적으로 국외에 있는 경우'는 범인이 국내에서 범죄를 저지르고 형사처분을 면할 목적으로 국외로 도피한 경우에 한정되지 아니하고, 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우도 포함된다(대판 2015. 6. 24. 2015도5916).", "answer": "X"}, {"source": "25변시", "question": "공소시효에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "범죄 후 법률의 개정에 의하여 법정형이 가벼워진 경우에는 「형법」 제1조 제2항에 의하여 당해 범죄사실에 적용될 가벼운 법정형(신법의 법정형)이 공소시효기간의 기준이 된다.", "explanation": "범죄 후 법률의 개정에 의하여 법정형이 가벼워진 경우에는 형법 제1조 제2항에 의하여 당해 범죄사실에 적용될 가벼운 법정형(신법의 법정형)이 공소시효기간의 기준이 된다(대판 2008.12.11. 2008도4376).", "answer": "O"}, {"source": "25변시", "question": "공소시효에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사기죄와 변호사법위반죄가 상상적 경합의 관계에 있는 경우 변호사법위반죄의 공소시효가 완성되었다고 하여 사기죄의 공소시효까지 완성되는 것은 아니다.", "explanation": "공무원이 취급한 사건에 관하여 청탁 또는 알선을 할 의사와 능력이 없음에도 청탁 또는 알선을 한다고 기망하여 금품을 교부받은 경우에 성립하는 사기죄와 변호사법 위반죄는 상상적 경합의 관계에 있으므로, 변호사법 위반죄의 공소시효가 완성되었다고 하여 그 죄와 상상석 경합관계에 있는 사기죄의 공소시효까지 완성되는 것은 아니다(대판 2006.12.08. 2006도6356).", "answer": "O"}, {"source": "25변시", "question": "공소시효에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "미수범의 범죄행위는 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고, 그때부터 미수범의 공소시효가 진행한다.", "explanation": "공소시효는 범죄행위가 종료한 때부터 진행한다(형사소송법 제252조 제1항). 미수범은 범죄의 실행 에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에 처벌받게 되므로(형법 제25조 제 1항), 미수범의 범죄행위는 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고 그때부터 미수범의 공소시효가 진행한다(대판 2017.07.11. 2016도14820).", "answer": "O"}, {"source": "23변시", "question": "공소시효에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실 에 대한 법정형 이 공소시효기간의 기준이 된다.", "explanation": "공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 된다(대판 2001.08.24. 2001도2902).", "answer": "O"}, {"source": "23변시", "question": "공소시효에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경이 있는 경우에 공소시효의 완성 여부는 당초의 공소제기가 있었던 시점을 기준으로 판단할 것이고, 공소장 변경 시를 기준으로 삼을 것은 아니다.", "explanation": "공소장 변경이 있는 경우에 공소시효의 완성 여부는 당초의 공소제기가 있었던 시점을 기준으로 판단할 것이고 공소장 변경시를 기준으로 삼을 것은 아니다.", "answer": "O"}, {"source": "23변시", "question": "공소시효에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⌜형사소송법⌟제253조 제2항은 공범 중 1인에 대한 공소의 제기로 다른 공범자에 대하여도 공소시효가 정지되도록 규정하고 있는데, 위 조항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다.", "explanation": "뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 자는 강학상으로는 필요적 공범 이라고 불리고 있으나, 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌규정에 따라 처벌되는 것이어서, 2인 이상이 기공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며, 대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면, 형사소송법 제253조 제2항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다(대판 2015. 02.12. 2012도4842).", "answer": "O"}, {"source": "23변시", "question": "공소시효에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형사소송법」 제253조 제3항은 범인이 형사처분을 면할 목적으로 국외에 있는 경우 그 기간 동안 공소시효가 정지되도록 규정하고 있는데 여기서 ‘범인이 형사처분을 면할 목적으로 국외에 있는 경우’에는 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우도 포함된다.", "explanation": "형사소송법 제253조 제3항은 “범인이 형사처분을 면할 목적으로 국외에 있는 경우 그 기간 동안 공소시효는 정지된다\"라고 규정하고 있다. 위 규정의 입법 취지는 범인이 우리나라의 사법권이 실질적으로 미치지 못하는 국외에 체류한 것이 도피의 수단으로 이용된 경우에 체류기간 동안은 공소시효가 진행되는 것을 저지하여 범인을 처벌할 수 있도록 하여 형벌권을 적정하게 실현하고자 하는 데 있다. 따라서 위 규정이 정한 ‘범인이 형사처분을 면할 목적으로 국외에 있는 경우’는 범인이 국내에서 범죄를 저지르고 형사처분을 면할 목적으로 국외로 도피한 경우에 한정되지 아니하고, 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우도 포함된다(대판 2015.06.24. 2015도5916).", "answer": "O"}, {"source": "26변시", "question": "사기의 습벽이 있는 甲은 A에게 돈을 빌리더라도 변제할 의사나 능력이 없었고, 이를 사업자금 이 아닌 불법도박 등 다른 용도로 사용할 생각이었음에도 불구하고, 2021년 8월부터 2022년 1 월까지 10회에 걸쳐 ‘사업자금으로 돈이 필요한데, 돈을 빌려주면 이자를 은행 이자보다 많이 지급하고 6개월 뒤에 반드시 변제하겠다고 A를 기망하여 A로부터 합계 3억 원을 편취하였다는 상습사기의 공소사실로 기소되었다(a범죄사실). 또한 甲은 기소된 위 공소사실과 동일한 방법으로 2022년 2월부터 2022년 4월까지 3회에 걸쳐 B를 기망하여 B로부터 합계 2,000만원을 펀취하였다(b범죄사실). 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 甲의 a범죄사실에 대한 사건의 공판계속 중에 b범죄사실을 추가하는 내용의 공소장변경 허가신청을 한 경우, 당초 기소된 공소사실과 b범죄사실이 포괄일죄에 해당하므로 법원은 공소장변경을 허가하여야 한다.", "explanation": "상습성을 갖춘 자가 여러 개의 죄를 반복하여 저지른 경우에는 각 죄를 별죄로 보아 경합범으로 처단할 것이 아니라 그 모두를 포괄하여 상습범이라고 하는 하나의 죄로 처단하는 것이 상습범의 본질 또는 상습범 가중처벌규정의 입법취지에 부합한다(대판 2004 .09 .16 . 2001도3206(전합)). 포괄일죄에 있어서는 공소장변경을 통한 종전 공소사실의 철회 및 새로운 공소사실의 추가가 가능한 점 에 비추어 그 공소장변경허가 여부를 결정함에 있어서는 포괄일죄를 구성하는 개개 공소사실별로 종전 것과의 동일성 여부를 따지기보다는 변경된 공소사실이 전체적으로 포괄일죄의 범주 내에 있는지 여부, 즉 단일하고 계속된 범의하에 동종의 범행을 반복하여 행하고 그 피해법익도 통일한 경우에 해당한다고 볼 수 있는지 여부에 초점을 맞추어야 한다(대판 2006.04.27. 2006도514).\n ▷설문은 사기 습벽, 기간의 연속성('21.8.~'22.1., '22.2~'22.4,) 범행방법의 동일을 전제하므로, a범죄사실 뿐만 아니라, b범죄사실에도 상습사기죄의 포괄일죄가 성립한다. 또한 당초 기소된 a의 공소사실과 b는 포괄일죄에 해당하므로 법원은 공소장변경을 허가하여야 한다.", "answer": "O"}, {"source": "26변시", "question": "사기의 습벽이 있는 甲은 A에게 돈을 빌리더라도 변제할 의사나 능력이 없었고, 이를 사업자금 이 아닌 불법도박 등 다른 용도로 사용할 생각이었음에도 불구하고, 2021년 8월부터 2022년 1 월까지 10회에 걸쳐 ‘사업자금으로 돈이 필요한데, 돈을 빌려주면 이자를 은행 이자보다 많이 지급하고 6개월 뒤에 반드시 변제하겠다고 A를 기망하여 A로부터 합계 3억 원을 편취하였다는 상습사기의 공소사실로 기소되었다(a범죄사실). 또한 甲은 기소된 위 공소사실과 동일한 방법으로 2022년 2월부터 2022년 4월까지 3회에 걸쳐 B를 기망하여 B로부터 합계 2,000만원을 펀취하였다(b범죄사실). 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 검사가 甲의 a범죄사실과 b범죄사실을 포괄일죄로 함께 기소하였는데 제1심법원은 b범죄사실 부분은 무죄라 판단하여 a범죄사실에 대하여만 유죄판결을 선고하였고 이에 甲만 항소한 경우, a범죄사실과 b범죄사실은 모두 항소심법원으로 이심되지만 b범죄사실은 항소심의 심판대상이 되지 않는다.", "explanation": "포괄일죄의 일부만이 유죄로 인정된 경우 그 유죄 부분에 대해 피고인만이 상고하였을 뿐 무죄나 공소기각으로 판단된 부분에 대해 검사가 상고를 하지 않았다면, 상소불가분의 원칙에 의해 유죄 이외의 부분도 상고심에 이심되기는 하나, 그 부분 이미 당사자 간 공격, 방어의 대상으로부터 벗어나 사실상 심판대상에서부터도 이탈하게 되므로, 상고심으로서도 그 부분에까지 나아가 판단할 수 없다(대판 2004.10.28. 2004도5014).\n ▷설문은 a와 b는 포괄일죄이므로, 상소불가분원칙에 의해 a와 b 모두 항소심 법원으로 이심된다. 그러나 제1심법원이 a에 대하여만 유죄로 인정하였고, 이에 갑만 항소하고 검사는 항소하지 않은 경우, b는 피고인 갑에게 유리한 판결이므로, 불이익변경금지원칙(형소법 제368조)에 의해 b는 항소심 심판대상이 되지 않는다.", "answer": "O"}, {"source": "26변시", "question": "사기의 습벽이 있는 甲은 A에게 돈을 빌리더라도 변제할 의사나 능력이 없었고, 이를 사업자금 이 아닌 불법도박 등 다른 용도로 사용할 생각이었음에도 불구하고, 2021년 8월부터 2022년 1 월까지 10회에 걸쳐 ‘사업자금으로 돈이 필요한데, 돈을 빌려주면 이자를 은행 이자보다 많이 지급하고 6개월 뒤에 반드시 변제하겠다고 A를 기망하여 A로부터 합계 3억 원을 편취하였다는 상습사기의 공소사실로 기소되었다(a범죄사실). 또한 甲은 기소된 위 공소사실과 동일한 방법으로 2022년 2월부터 2022년 4월까지 3회에 걸쳐 B를 기망하여 B로부터 합계 2,000만원을 펀취하였다(b범죄사실). 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲의 a범죄사실에 대한 사건을 심리하던 재판부에 뒤에 추가기소된 b범죄사실에 대한 사건이 병합된 경우라면, a범죄사실에 대한 공소제기의 효력이 b범죄사실에도 미치므로, 재판부는 이중기소를 이유로 하여 b범죄사실에 대한 기소에 대하여 판결로써 공소를 기각하여야 한다.", "explanation": "검사가 수 개의 협박 범행을 먼저 기소하고 다시 별개의 협박 범행을 추가로 기소하였는데 이를 병 합하여 심리히는 과정에서 전후에 기소된 각각의 범행이 모두 포괄하여 하나의 협박죄를 구성등}는 것으 로 밝혀진 경우, 이중기소에 대하여 공소기각판결을 하도록 한 형사소송법 제327조 제3호의 취지는 동일 사건에 대하여 피고인으로 하여금 이중처벌의 위험을 받지 아니하게 하고 법원이 2개의 실체판결을 하지 아니하도록 함에 있으므로, 위와 같은 경우 법원이 각각의 범행을 포괄하여 하나의 협박죄를 인정한다고 하여 이중기소를 금하는 위 법의 취지에 반하는 것이 아닌 점과 법원이 실체적 경합범으로 기소된 범죄 사실에 대하여 그 범죄사실을 그대로 인정하면서 다만 죄수에 관한 법률적인 평가만을 달리하여 포괄일 죄로 처단하는 것이 피고인의 방어에 불이익을 주는 것이 아니어서 공소장변경 없이도 포괄일죄로 처벌 할 수 있는 점에 비추어 보면, 비록 협박죄의 포괄일죄로 공소장을 변경하는 절차가 없었다거나 추가로 공소장을 제출한 것이 포괄일죄를 구성하는 행위로서 기존의 공소장에 누락된 것을 추가· 보충하는 취지의 것이라는 석명절차를 거치지 아니하였다 하더라도 법원은 전후에 기소된 범죄사실 전부에 대하여 실체판단을 할 수 있고, 추가기소된 부분에 대하여 공소기각판결을 할 필요는 없다(대판2007.08 .23. 2007도2595)", "answer": "X"}, {"source": "26변시", "question": "사기의 습벽이 있는 甲은 A에게 돈을 빌리더라도 변제할 의사나 능력이 없었고, 이를 사업자금 이 아닌 불법도박 등 다른 용도로 사용할 생각이었음에도 불구하고, 2021년 8월부터 2022년 1 월까지 10회에 걸쳐 ‘사업자금으로 돈이 필요한데, 돈을 빌려주면 이자를 은행 이자보다 많이 지급하고 6개월 뒤에 반드시 변제하겠다고 A를 기망하여 A로부터 합계 3억 원을 편취하였다는 상습사기의 공소사실로 기소되었다(a범죄사실). 또한 甲은 기소된 위 공소사실과 동일한 방법으로 2022년 2월부터 2022년 4월까지 3회에 걸쳐 B를 기망하여 B로부터 합계 2,000만원을 펀취하였다(b범죄사실). 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲의 a범죄사실 전부에 대하여 2024.3.14. 유죄판결이 선고되어 2024.3.22. 그 판결이 확정되었고, 그 이후에 b범죄사실이 기소되었다면 법원으로서는 b범죄사실에 대하여 면소판결을 선고하여야 한다.", "explanation": "상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다 면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호), 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니 된다(대판 2004.09.16. 2001도3206(전합)). \n ▷a와 b는 포괄일죄이므로, a에 대한 확정판결의 기판력이 b에도 미친다. 따라서 a에 대하여 2024.3.14. 유죄의 확정판결이 있었다면, 법원은 사실심판결 선고 전 2022.2.~2022.4. 이루어진 b행위에 대하여 면소판결을 선고하여야 한다. 한편, 상습범인 포괄일죄의 경우에는 특히 이전의 확정판결도 “상습범”일 것을 요하나, 사안은 a도 상습범으로 기소된 것이므로 법원은 여전히 b에 면소판결을 선고하여야 한다.", "answer": "O"}, {"source": "25변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형법」 제34조 제1 항의 간접정범은 정범과 통일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어 볼 때, 정범으로 기소된 피고인에게 법원이 공소장변경 없이 직권으로 위 간접정범 규정을 적용하였더라도 피고인의 방어권 행사에 실질적인 불이익을 초래하였다고 할 수 없다.", "explanation": "간접정범은 정범과 동일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어 볼 때, 공소장 변경 없이 직권으로 간접정범 규정을 적용하였더라도 피고인의 방어권 행사에 실질적인 불이익을 초래하였다고 할 수는 없다(대판 2017.03.16. 2016도21075) .", "answer": "O"}, {"source": "25변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "항소심에서 공소장변경에 의하여 단독판사의 관할사건이 합의부 관할사건으로 된 경우에 항소심은 결정으로 사건을 관할권이 있는 고등법원에 이송하여야 한다.", "explanation": "항소심에서 공소장변경에 의하여 단독판사의 관할사건이 합의부 관할사건으로 된 경우에도 법원은 사건을 관할권이 있는 법원에 이송하여야 한다고 할 것이고, 항소심에서 변경된 위 합의부 관할사건에 대한 관할권이 있는 법원은 고등법원이라고 봄이 상당하다(대판 1997.12.12. 97도2463).", "answer": "O"}, {"source": "25변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법원이 검사에게 공소장변경을 요구할 것인지 여부는 재량에 속하는 것이므로, 법원이 검사에게 공소장의 변경을 요구하지 아니하였다고 하여 위법하다고 할 수 없다.", "explanation": "법원이 검사에게 공소장 변경을 요구할 것인지 여부는 법원의 재량에 속하는 것으로 검사에게 공소장 변경을 요구하지 아니하였다고 하여 위법하다고 볼 수 없다(대판 1993.07.13. 93도113).", "answer": "O"}, {"source": "25변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "친고죄로 기소된 후에 피해자의 고소가 취소되더라도 제1심이나 항소심에서 당초에 기소된 공소사실과 동일성이 인정되는 범위 내에서 비친고죄인 다른 공소사실로 공소장을 변경할 수 있으며 이러한 경우 변경된 공소사실에 대하여 심리· 판단하여야 하는데, 이는 반의사불벌죄에서 피해자의 처벌을 희망하지 아니하는 의사표시가 있는 경우에도 마찬가지로 보아야한다.", "explanation": "친고죄에서 피해자의 고소가 없거나 고소가 취소되었음에도 친고죄로 기소되었다가 그 후 당초에 기소 된 공소사실과 동일성이 인정되는 비친고죄로 공소장변경이 허용된 경우 그 공소제기의 흠은 치유되고, 친고죄로 기소된 후에 피해자의 고소가 취소되더라도 제1 심이나 항소심에서 당초에 기소된 공소사실과 동일성이 인정되는 범위 내에서 다른 공소사실로 공소장을 변경할 수 있으며 이러한 경우 변경된 공소사실에 대하여 심리·판단하여야 하는데 반의사불별죄에서 피해자의 ‘처벌을 희망하지 아니하는 의사표시’ 또는 ‘처벌을 희망하는 의사표시의 철회’가 있는 경우에도 마찬가지로 보아야 한다(대판 2011.05.13. 2011도2233) .", "answer": "O"}, {"source": "25변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인은 준강간죄의 장애미수로 기소되었으나 공판과정에서 ‘준강간의 고의가 없었고, 피해자가 항거불능 상태에 있지도 않았다’는 취지로 다투었고, 이에 따라 피고인이 준강간의 고의로 실행에 착수하였는지 여부, 피해자가 당시 실제 항거불능 상태에 있었는지 여부에 관하여 충분한 심리가 이루어졌더라도 준강간죄의 불능미수로 공소장이 변경되지 않았다면, 법원은 준강간죄의 불능미수 범죄사실을 직권으로 인정할 수 없다.", "explanation": "가) 이 사건 공소사실(=준강간죄의 장애미수)과 준강간죄 불능미수의 범죄사실은 기본적 사실관계가 동일하다 ... 나) 공소장변경 없이 직권으로 준강간죄 불능미수의 범죄사실을 인정하더라도 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 있다고볼 수 없다. 준강간죄의 불능미수는 피고인이 준강간의 고의로 실행에 칙수하였다는 점, 피해자가 당시 실제 항거불능 상태에 있지 않았다는 점, 준강간의 결과 발생 위험성이 있었다는 점이 인정되면 성립하는 범죄이다. 피고인은 이 사건 공판 과정에서 ‘준강간 의 고의가 없었고, 피해자가 항거불능 상태에 있지도 않았다.’는 취지로 다투었고, 이에 따라 피고인이 준강간의 고의로 실행에 착수하였는지 여부, 피해자가 당시 실제 항거불능 상태에 있었는지 여부에 관해서 충분한 심리가 이루어졌다. … 나아가 검사는 제1 심판결에 대하여 항소하면서 위 대법원 2018도16002 전원합의체 판결 법리에 따라 준강간죄 불능미수의 성립이 인정되어야 함에도 제1심이 무죄로 판단한 것은 잘못이라는 취지의 항소이유서를 제출한 바 있고, 피고인의 변호인도 이에 대하여 피고인에게 준강간의 고의가 없었으므로 준강간죄 불능미수가 성립하지 않는다는 취지의 ‘검사의 항소이유에 대한 답변서’를 제출하였다. 이와 같이 검사와 피고인 사이에서 피고인의 행위가 준강간죄의 불능미수로서 유죄로 인정될 수 있는지에 관한 언급 및 공방이 있었다는 점에서도 직권으로 준강간죄의 불능미수 범죄사실을 인정하는 것이 피고인의 방어권 행사에 실질적인 불이익을 초래한다고 보기 어렵다. 다) 이와 같은 상황에서 공소장이 변경되지 않았다는 이유로 이를 처벌하지 않는다면 적정절차에 의한 신속한 실체적 진실의 발견이라는 형사소송의 목적에 비추어 현저히 정의와 형평에 반한다. … 라) 따라서 원심으로서는 준강간의 불능미수 범죄사실을 직권으로 인정하였어야 한다. 그럼에도 원심은 판시와 같은 이유만으로 이 사건 공소사실을 무죄로 판단한 제1 심판결을 그대로 유지하였다. 이러한 원심의 판단에는 공소장변경 없이 심판할 수 있는 범위에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다(대판 2024.04.12. 2021도9043).", "answer": "X"}, {"source": "24변시", "question": "공소제기 및 공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인을 특정하지 않은 공소제기임에도 피고인과 변호인이 이의를 제기하지 않고 변론에 응하였다면 그 공소제기의 하자는 치유된다.", "explanation": "[1] 형사소송법이 공소의 제기에 관하여 서면주의와 엄격한 요식행위를 채용한 것은 공소의 제기에 의해서 법원의 심판이 개시되므로 심판을 구하는 대상을 명확하게 하고 피고인의 방어권을 보장하기 위한 것이다. 따라서 위와 같은 엄격한 형식과 절차에 따른 공소장의 제출은 공소제기리는 소송행위가 성 립 하기 위한 본질적 요소라고 할 것이므로, 공소의 제기에 현저한 방식 위반이 있는 경우에는 공소제기의 절차가 법률의 규정에 위반하여 무효인 경우에 해당하고, 위와 같은 절차 위배의 공소제기에 대하여 피고인과 변호인이 이의를 제기하지 아니하고 변론에 응하였다고 하여 그 하자가 치유되지는 않는다. [2] 검사가 공판기일에서 피고인 등이 특정되어 있지 않은 공소장변경허가신청서를 공소장에 갈음하는 것으로 구두진술하고 피고인과 변호인이 이의를 제기하지 않은 사안에서 이를 적법한 공소제기로 볼 수 없다고 본 사례(대판 2009.02.26. 2008도1181 3) .", "answer": "X"}, {"source": "24변시", "question": "공소제기 및 공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "범죄사실 상호간에 범죄의 일시, 장소, 수단 및 객체 등이 달라서 수개의 범죄사실로 인정 되는 경우에도 이들 수개의 범죄사실을 예비적 또는 택일적으로 기재할 수 있다.", "explanation": "형사소송법 254조 5항에 수개의 범죄사실과 적용법조를 예비적 또는 택일적으로 기재할 수 있다함은 수개의 범죄사실간에 범죄사실의 동일성이 인정되는 범위내에서는 물론 그들 범죄사실 상호간에 범죄의 일시, 장소, 수단 및 객체 등이 달라서 수 개의 범죄사실로 인정되는 경우에도 이들 수개의 범죄사실을 예비적 또는 택일적으로 기재할 수 있다는 취지다(대판 2018.08.01. 2018도1481) .", "answer": "O"}, {"source": "24변시", "question": "공소제기 및 공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "포괄일죄의 경우에 그 공소장변경허가 여부를 결정힘에 있어서는 포괄일죄를 구성하는 개개 공소사실별로 종전 것과의 동일성 여부를 따지기보다는 변경된 공소사실이 전체적으로 포괄일죄의 범주 내에 있는지 여부 즉 단일하고 계속된 범의 하에 동종의 범행을 반복하여 행하고 그 피해법익도 동일한 경우에 해당한다고 볼 수 있는지 여부에 초점을 맞추어야 한다.", "explanation": "포괄일죄에 있어서는 공소장변경을 통한 종전 공소사실의 철회 및 새로운 공소사실의 추가가 가능한 점에 비추어 그 공소장변경허가 여부를 결정힘에 있어서는 포괄일죄를 구성하는 개개 공소사실별로 종전 것과의 통일성 여부를 따지기보다는 변경된 공소사실이 전체적으로 포괄일죄의 범주 내에 있는지 여부, 즉 단일하고 계속된 범의하에 동종의 범행을 반복하여 행하고 그 피해법익도 동일한 경우에 해당한다고 볼 수 있는지 여부에 초점을 맞추어야 한다(대판 2006 .04.27. 2006도514) .", "answer": "O"}, {"source": "24변시", "question": "공소제기 및 공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경으로 국민참여재판 대상사건에 해당하지 않게 된 경우에도 법원은 국민참여재 판을 계속 진행하여야 하나, 법원은 국민참여재판에 의하지 않고 당해 사건을 지방법원 본 원 합의부가 심판하기로 결정할 수 있고 그러한 결정에 대해서는 불복할 수 없다.", "explanation": "국민의 형사재판 참여에 관한 법률(국민참여재판법) 제6조 제1 항, 제2항 참조.\n 국민참여재판법 제6조(공소사실의 변경 등) ①법원은 공소사실의 일부 철회 또는 변경으로 인하여 대상사건에 해당하지 아니하게 된 경우에도 이 법에 따른 재판을 계속 진행한다. 다만, 법원은 심리의 상황이나 그 밖의 사정을 고려하여 국민참여재판으로 진행하는 것이 적당하지 않다고 인정하는 때에는 결정으로 당해 사건을 지방법원 본원 합의부가 국민참여재판에 의하지 않고 심판하게 할 수 있다.\n ②제1항 단서의 결정에 대해서는 불복할 수 없다.", "answer": "O"}, {"source": "24변시", "question": "공소제기 및 공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변제할 의사와 능력 없이 피해자로부터 금원을 편취하였다고 기소된 사실을 공소장변경 절차 없이 피해자에게 제3자를 소개케 하여 동액의 금원을 치용하고 피해자에게 그에 대한 보증채무를 부담케 하여 재산상의 이익을 취득하였다는 사실로 인정하였다 할지라도 거기에 어떠한 위법이 있다 할 수 없다.", "explanation": "변제할 의사와 능력없이 피해자로부터 금원을 편취하였다고 기소된 사실을 공소장변경 절차없이 피해자에게 제3자를 소개케 하여 동액의 금원을 차용하고 피해자에게 그에 대한 보증채무를 부담케 하여 재산상의 이익을 취득하였다고 인정하였다 할지라도 위 양 범죄사실을 비교하여 보면 차용액, 기망의 태양, 피해의 내용이 실질에 있어 동일한 것이어서 피해자를 기망하여 금원을 편취하였다는 기본적 사실에 아무런 차이도 없으므로 원심의 인정사실이 공소사실의 동일성을 벗어난 것도 아닐 뿐더러 피고인이 스스로 이를 시인하고 있는 이상 피고인의 방어에 하등의 불이익을주었다고볼수도 없으므로거기에 위법이 있다 할 수 없다(대판 1984.09.25. 84도312) .", "answer": "O"}, {"source": "22변시", "question": "공소장변경에 관한 설명 중 옳은 것(ｏ)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변경된 공소사실이 변경 전의 공소사실과 기본적 사실관계에서 동일하다면 그것이 새로운 공소의 추가적 제기와 다르지 않다고 하더라도 공소장의 변경은 항소심에서도 할 수 있다.", "explanation": "변경된 공소사실이 당초의 공소사실과 기본적 사실관계에서 동일하다고 보는 이상 설사 그것이 새로운 공소의 추가적 제기와 다를 바 없다고 하더라도, 현행법상 형사항소심의 구조가 오로지 사후심으로서의 성격만을 가지고 있는 것은 아니어서 공소장의 변경은 항소심에서도 할 수 있는 것이므로 이를 허가한 항소심 법원의 조처에 피고인의 제1심판결을 받을 기회를 박탈하여 헌법 제27조 제1 항의 법률에 의한 재판을 받을 권리를 침해한 위법이 있다고 할 수 없다(대판 1995.02.17. 94도3297)", "answer": "O"}, {"source": "22변시", "question": "공소장변경에 관한 설명 중 옳은 것(ｏ)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경절차 없이도 법원이 심리·판단할 수 있는 죄가 한 개가 아니라 여러 개인 경우로서 피고인의 방어권 행사에 실질적인 불이익이 없는 경우에, 법원으로서는 그중 어느 하나를 임의로 선택하여 심리·판단할 수 있다.", "explanation": "공소장변경 절차 없이도 법원이 심리·판단할 수 있는 죄가 한 개가 아니라 여러 개인 경우에는 법원으로서는 그 중 어느 하나를 임의로 선택할 수 있는 것이 아니라 검사에게 공소사실 및 적용법조에 관한 석명을 구하여 공소장을 보완하게 한 다음 이에 따라 심리·판단하여야 할 것이다(대판 2005.07.08. 2005도279).", "answer": "X"}, {"source": "22변시", "question": "공소장변경에 관한 설명 중 옳은 것(ｏ)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에도 공소사실의 동일성이 인정되면 공소장변경을 허용하여 이를 심판대상으로 삼을 수 있으므로, 환송 후 원심이 검사의 공소장변경신청을 허가하고 공소장변경을 이유로 직권으로 제1심 판결을 파기한 후 다시 판결할 수 있다.", "explanation": "현행법상 형사항소심의 구조가 사후심으로서의 성격만을 가지는 것은 아니므로, 피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에도 공소사실의 동일성이 인정되 면 공소장변경을 허용하여 이를 심판대상으로 삼을 수 있는 바 환송 후 원심이 검사의 공소장변경신청을 허가하고 공소장변경을 이유로 직권으로 제1심판결을 파기한 후 다시 판결한 조치는 옳고, 거기에 환송 후 항소심의 구조와 공소장변경 허가에 관한 법리를 오해한 위법이 있다고 할 수 없다(대판 2004.07 .22. 2003도8153).", "answer": "O"}, {"source": "22변시", "question": "공소장변경에 관한 설명 중 옳은 것(ｏ)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 당초 ‘피고인이 A 등에게 필로폰 약 0.3g을 교부하였다’고 하여 마약류관리에관한법률위반(향정)으로 공소를 제기하였다가 ‘피고인이 A 등에게 필로폰을 구해주겠다 고 속여 A 등에게서 필로폰 대금을 편취하였다’는 사기 범죄사실을 예비적으로 추가하는 공소장변경을 신청한 경우 위 두 범죄사실은 기본적인 사실관계가 동일하므로 공소장변경은 허용된다.", "explanation": "검사가 당초 ‘피고인이 甲에게 필로폰 약 0.3g을 교부하였다고 하여 마약류관리에 관한 법률 위반(향정)으로 공소를 제기하였다가 ‘피고인이 甲에게 필로폰을 구해주겠다고 속여 甲 등에게서 필로폰 대금 등을 편취하였다’는 사기 범죄사실을 예비적으로 추가하는 공소장변경을 신청한 사안에서, 위 두 범죄사실은 기본적인 사실관계가 동일하다고 볼 수 없는데도, 공소장변경을 허가한 후 사기죄를 인정한 원심 판결에 법리오해의 위법이 있다(대판 2012.04.13. 2010도16659) .", "answer": "X"}, {"source": "22변시", "question": "공소장변경에 관한 설명 중 옳은 것(ｏ)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 되고, 그 공소시효의 완성 여 부도 공소장 변경시를 기준으로 한다.", "explanation": "[1] 공소장 변경이 있는 경우에 공소시효의 완성 여부는 당초의 공소제기가 있었던 시점을 기준으로 판단할 것이고 공소장 변경시를 기준으로 삼을 것은 아니다. [2] 공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 된다(대판 2001.08.24. 2001도2902).", "answer": "X"}, {"source": "18변시", "question": "공소장변경제도에 관한 설명 중 옳지 않를 것은? (다툼이 있는 경우 판례에 의함)", "choice": "항소심의 구조가 사후심으로서의 성격만을 가지는 것은 아니므로, 피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에도 공소사실의 통일성이 인정 되면 항소심 법원은 공소장변경을 허가하여 변경된 공소사실을 심판대상으로 삼을 수 있다", "explanation": "현행법상 형사항소심의 구조가 사후심으로서의 성격만을 가지는 것은 아니므로 피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에도 공소사실의 동일성이 인정되면 공소장변경을 허용하여 이를 심판대상으로 삼을 수 있다(대판 2004.07.22. 2003도8153) .", "answer": "O"}, {"source": "18변시", "question": "공소장변경제도에 관한 설명 중 옳지 않를 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 구두로 공소장변경허가신청을 하면서 변경하려는 공소사실의 일부만 진술하고 나머지는 전자적 형태의 문서로 저장한 저장매체를 제출한 경우 저장매체에 저장된 전자적 형태 의 문서로 제출된 부분은 공소장변경허가신청이 된 것이라고 할 수 없으므로 법원이 그 부분 에 대해서까지 공소장변경허가를 하였더라도 적법하게 공소장변경이 된 것으로 볼 수 없다.", "explanation": "검사가 공소장을 변경하고자 하는 때에는 그 취지를 기재한 공소장변경허가신청서를 법원에 제출하여야 하고, 다만 피고인이 재정하는 공판정에서 피고인에게 이익이 되거나 피고인이 동의하는 예외적인 경우에 한하여 법원은 구술에 의한 공소장변경을 허가할 수 있다(형사소송규칙 제142조 제1 항, 제5항). 따라서 검사가 구술에 의한 공소장변경허가신청을 하는 경우에도 변경하고자 하는 공소사실의 내용은 서면에 의하여 신청을 할 때와 마찬가지로 구체적으로 특정하여 진술하여야 하므로, 검사가 구술로 공소장 \n 변경허가신청을 하면서 변경하려는 공소사실의 일부만 진술하고 나머지는 전자적 형태의 문서로 저장한 저장매체를 제출하였다면, 공소사실의 내용을 구체적으로 진술한 부분에 한하여 공소장변경허가신청이 된 것으로 볼 수 있을 뿐이다. 그 경우 저장매체에 저장된 전자적 형태의 문서는 공소장변경허가신청이 된 것이라고 할 수 없고 법원이 그 부분에 대해서까지 공소장변경허가를 하였다고 하더라도 적법하게 공소장변경이 된 것으로 볼 수 없다(대판 2016.12.29. 2016도11138).", "answer": "O"}, {"source": "18변시", "question": "공소장변경제도에 관한 설명 중 옳지 않를 것은? (다툼이 있는 경우 판례에 의함)", "choice": "형사소송규칙은 “공소장변경허가신청서가 제출된 경우 법원은 그 부본을 피고인 또는 변호인에게 즉시 송달하여야 한다\"라고 규정하고 있는데, 이는 피고인과 변호인 모두에 게 부본을 송달하여야 한다는 취지가 아니므로 공소장변경신청서 부본을 피고인과 변호인 중 어느 한 쪽에 대해서만 송달하였다고 하여 절차상 잘못이 있다고 할 수 없다.", "explanation": "형사소송규칙 제142조 제3항은 공소장변경허가신청서가 제출된 경우에 법원은 그 부본을 피고인 또 는 변호인에게 즉시 송달하여야 한다고 규정하고 있는데 피고인과 변호인 모두에게 부본을 송달하여야 하는 취지가 아님은 문언상 명백하므로 공소장변경신청서 부본을 피고인과 변호인 중 어느 한 쪽에 대해 서만 송달하였다고 하여 절차상 잘못이 있다고 할 수 없다(대판 2015.02.16 . 2014도14843) .", "answer": "O"}, {"source": "18변시", "question": "공소장변경제도에 관한 설명 중 옳지 않를 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우, 변경된 공소사실에 대한 법정형이 공소시효기간의 판단기준이 된다.", "explanation": "공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 된다고 보아야 하므로 공소제기 당시의 공소사실에 대한 법정형을 기준으로 하면 공소제기 당시 아직 공소시효가 완성되지 않았으나 변경된 공소사실에 대한 법정형을 기준으로 하면 공소제기 당시 이미 공소시효가 완성된 경우에는 공소시효의 완성을 이유로 면소판결을 선고하여야 한다(대판 2013.07.26. 2013도.6182).", "answer": "O"}, {"source": "18변시", "question": "공소장변경제도에 관한 설명 중 옳지 않를 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1 심에서 합의부 관할사건에 관하여 단독판사 관할사건으로 죄명과 적용법조를 변경하는 공소장변경허가신청서가 제출된 경우 사건을 배당받은 합의부가 공소장변경을 허가하는 결정을 하였다면 합의부는 결정으로 관할권이 있는 단독판사에 게 사건을 이송하여야 한다.", "explanation": "형사소송법은 제8조 제2항에서 “단독판사의 관할사건이 공소장변경에 의하여 합의부 관할사건으로 변경된 경우에 법원은 결정으로 관할권이 있는 법원에 이송한다\"라고 규정하고 있을 뿐이고, 반대의 경 우, 즉 합의부의 관할사건이 공소장변경에 의하여 단독판사 관할사건으로 변경된 경우에 관하여는 규정하고 있지 아니하며, ‘법관 등의 시무분담 및 사건배당에 관한 예규’에서도 이러한 경우를 재배당사유로 규정하고 있지 아니하다. 그렇다면 이 사건은 공소제기 당시부터 합의부 관할사건이었고, 설령 합의부가 공소장변경을 허가히는 결정을 하였다고 하더라도 그러한 사정은 합의부의 관할에 아무런 영향을 미치지 아니하므로, 합의부로서는 마땅히 이 사건에 관하여 그 실체에 들어가 심판하였어야 하고 사건을 단독판 사에게 재배당할 수는 없다(대판 2013.04 .25. 2013도1658).", "answer": "X"}, {"source": "17 변시", "question": "공소장변경에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄱ. 공소사실의 동일성이 인정되는 경우라 하더라도 법원은 허위사실적시 출판물에 의한 명예훼손의 공소사실에 대하여 공소장변경 없이 사실적시 출판물에 의한 명예훼손으로 처벌할 수 없다. ", "explanation": "ㄱ. 형법 307조 제2항의 허위사실적시에 의한 명예훼손의 공소사실 중에는 같은 조 제 1항의 사실적시에 의한 명예훼손의 공소사실이 포함되어 있으므로, 위 허위사실적시에 의한 명예훼손으로 기소된 사안에서 적시한 사실이 허위임에 대한 입증이 없다면 법원은 공소장변경절차 없이도 직권으로 위 사실적시에 의한 명예훼손죄를 인정할 수 있다. 다만 법원이 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실에 포함된 이보다 가벼운 범죄사실을 공소장변경 없이 직권으로 인정할 수 있는 경우라고 하더라도, 공소가 제기된 범죄사실과 대비하여 볼 때 실제로 인정되는 범죄사실의 사안이 중대하여 공소장이 변경되지 않았다는 이유로 이를 처벌하지 않는다면 적정절차에 의한 신속한 실체적 진실의 발견이라는 형사소송의 목적에 비추어 현저히 정의와 형평에 반하는 것으로 인정되는 경우가 아닌 한, 법원이 직권으로 그 범죄사실을 인정하지 아니하였다고 하여 위법한 것은 아니다(대판 2008.10.09. 2007도1220) . ", "answer": "X"}, {"source": "17 변시", "question": "공소장변경에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄴ. 피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에 그 항소심에서 공소장변경은 허용된다. ", "explanation": "ㄴ. 피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에도 공소사실의 동일성이 인정되면 공소장변경을 허용하여 심판대상으로 삼을 수 있다(대판 2004.07.22. 2003도8153). ", "answer": "O"}, {"source": "17 변시", "question": "공소장변경에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄷ. 약식명령에 대하여 피고인만 정식재판을 청구한 사건에서 법정형에 유기징역형만 있는 범죄로 공소장을 변경히는 것도 허용된다. ", "explanation": "ㄷ. 약식명령에 대하여 피고인만이 정식재판을 청구한 이 사건에서 피고인에 대하여 사서명위조와 위조사서명행사의 범죄사실이 인정되는 경우에는 비록 사서명위조죄와 위조사서명행사죄의 법정형에 유기징역형만 있다 하더라도 형사소송법 457조의 2에서 규정한 불이익변경금지 원칙이 적용되어 벌금형을 선고할 수 있는 것이므로 위와 같은 불이익변경금지 원칙 등을 이유로 이 사건 공소장변경을 불허할 것은 아니다(대판 2013.02.28. 2011도14986). -> 약식명령에 대하여 피고인만이 정식재판을 청구한 사건에서 당초 사문서위조 및 위조사문서행사의 공소사실로 공소제기 되엇으나 검사가 예비적으로 사서명위조 및 위조사서명행사의  공소사실로 공소장변경 허가를 신청한 사안. 형사소송법 제457조의2 개정. \n[형사소송법 제457조의2(형종 상향의 금지 등)] ① 피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 종류의 형을 선고하지 못한다. \n ② 피고인이 정식재판을 청구한사건에 대하여 약식명령의 형보다 중한형을 선고하는 경우에는판결서에 양형의 이유를 적어야 한다.", "answer": "O"}, {"source": "17 변시", "question": "공소장변경에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄹ.법원의 공소장변경 허가결정은 판결 전의 소송절차에 관한 결정이므로 그 결정에 대하여 독립하여 항고할 수 있다. ", "explanation": "ㄹ. 판결 전의 소송절차에 관한 결정에 대하여는 특히 즉시항고를 할 수 있는 경우 외에는 항고를 하지 못하는 것인 바, 공소사실 또는 적용법조의 추가, 철회 또는 변경의 허가에 관한 결정은 판결 전의 소송 절차에 관한 결정이라 할 것이므로, 그 결정을 함에 있어서 저지른 위법이 판결에 영향을 미친 경우에 한하여 그 판결에 대하여 상소를 하여 다툼으로써 불복하는 외에는 당사자가 이에 대하여 독립하여 상소할 수 없다 할 것이다(대결 1987.03.28. 87모17). ", "answer": "X"}, {"source": "17 변시", "question": "공소장변경에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㅁ. 법원이 예비적으로 추가된 공소사실에 대하여 공소장변경 허가결정을 한 경우, 원래의 공소사실과 예비적으로 추가된 공소사실 사이에 동일성이 인정되지 않더라도 공소장변경 허가를 한 법원이 스스로 이를 취소할 수는 없다.", "explanation": "ㅁ. 공소사실의 동일성이 인정되지 않는 등의 사유로 공소장변경허가결정에 위법사유가 있는 경우에는 공소장변경허가를 한 법원이 스스로 이를 취소할 수 있다( 대판 2001.03.27. 2001도116) . \n", "answer": "X"}, {"source": "13 변시", "question": "공소장변경에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "비록 사실인정에 변화가 없고 그 사실에 대한 법률적 평가만을 달리하는 경우라도, 배임죄로 기소된 공소사실에 대하여 법원이 공소장변경 없이 횡령죄로 인정하는 것은 구성요건을 달리하는 것이어서 허용되지 않는다. ", "explanation": "횡령죄와 배임죄는 다같이 신임관계를 기본으로 하고 있는 같은 죄질의 재산범죄로서 그 형벌에 있어서도 경중의 차이가 없고 동일한 범죄사실에 대하여 단지 법률적용만을 달리하는 경우에 해당하므로 법원은 배임죄로 기소된 공소사실에 대하여 공소장변경 없이도 횡령죄를 적용하여 처벌할 수 있다 (대판 1999.1 1.26. 99도2651 ). \n", "answer": "X"}, {"source": "13 변시", "question": "공소장변경에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "공소사실의 동일성이 인정되더라도 법원은 허위사실 적시 출판물에 의한 명예훼손의 공소사실에 대하여 공소장변경 없이 사실 적시 출판물에 의한 명예훼손죄로 처벌할 수 없다. \n", "explanation": "형법 제307조 제2항의 허위사실적시에 의한 명예훼손의 공소사실 중에는 같은 조 제1항의 사실적시에 의한 명예훼손의 공소사실이 포함되어 있으므로, 위 허위사실적시에 의한 명예훼손으로 기소된 사안에서 적시한 사실이 허위임에 대한 입증이 없다면 법원은 공소장변경절차 없이도 직권으로 위 사실적시에 의한 명예훼손죄를 인정할 수 있다. 다만 법원이 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실에 포함된 이보다 가벼운 범죄사실을 공소장변경 없이 직권으로 인정할 수 있는 경우라고 하더라도, 공소가 제기된 범죄사실과 대비하여 볼 때 실제로 인정되는 범죄사실의 사안이 중대하여 공소장이 변경되지 않았다는 이유로 이를 처벌하지 않는다면 적정절차에 의한 신속한 실체적 진실의 발견이라는 형사소송의 목적에 비추어 현저히 정의와 형평에 반하는 것으로 인정되는 경우가 아닌 한, 법원이 직권으로 그 범죄사실을 인정하지 아니하였다고 하여 위법한 것은 아니다(대판 2008.10.09. 2007도1220). ", "answer": "X"}, {"source": "13 변시", "question": "공소장변경에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "일반법과 특별법의 동일한 구성요건에 모두 해당하는 범죄사실에 대하여 검사가 형이 가벼운 일반법을 적용하여 기소한 경우 법원이 공소장변경 없이 형이 더 무거운 특별법위반의죄로 처단할수 없다. \n", "explanation": "일반법과 특별법이 동일한 구성요건을 가지고 있고 그 구성요건에 해당하는 어느 범죄사실에 대하여 검사가 그 중 형이 가벼운 일반법의 법조를 적용하여 그 죄명으로 기소하였는데 그 일반법과 특별법을 적용한 때 형의 범위가 차이나는 경우에는,비록 그 공소사실에 변경이 없고 적용법조의 구성요건이 완전히 동일하다 하더라도, 그러한 적용법조의 변경이 피고인의 방어권 행사에 실질적인 이익을 초래한다고 보아야 하며, 따라서 법원은 공소장변경 없이는 형이 더 무거운 특별법의 법조를 적용하여 특별법 위반의 죄로 처단할 수 없다(대판 2007.1 2.27. 2007도4749). \n", "answer": "O"}, {"source": "13 변시", "question": "공소장변경에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "동일한 범죄사실에 대하여 포괄일죄로 기소된 것을 법원이 공소장변경 없이 실체적 경합으로 인정하는 것은 허용되지 아니한다. \n", "explanation": "법원이 동일한 범죄사실을 가지고 포괄일죄로 보지 아니하고 실체적 경합관계에 있는 수죄로 인정하였다고 하더라도 이는 다만 죄수에 관한 법률적 평가를 달리한 것에 불과할 뿐이지 소추대상인 공소사실과 다른 사실을 인정한 것도 아니고 또 피고인의 방어권행사에 실질적으로 불이익을 초래할 우려도 없으므로 불고불리의 원칙에 위반되는 것이 아니다(대판 1987.05.26. 87도527) . ", "answer": "X"}, {"source": "13 변시", "question": "공소장변경에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "공소장변경은 서면에 의하여야 하므로, 피고인이 공판정에 재정하여 그 동의 하에 검사가 공판정에서 구술로 공소장 변경 허가 신청을 한 경우에는 법원이 이를 허가하였더라도 효력이 없다. ", "explanation": "형사소송규칙 제142조 제5항 참조. \n[형사소송규칙 제142조(공소장의 변경)] (5) 법원은 제1항의 규정에도 불구하고 피고인이 재정하는 공판정에서는 피고인에게 이익이 되거나 피고인이 동의하는 경우 구술에 의한 공소장변경을 허가할 수 있다. ", "answer": "X"}, {"source": "12 변시", "question": "공소사실의 동일성이 인정되는 경우 공소장변경의 절차 없이도 법원이 직권으로 유죄를 인정할 수 있는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "가. 배임죄로 기소된 공소사실에 대하여 횡령죄를 인정한 경우 ", "explanation": "횡령죄와 배임죄는 다같이 신임관계를 기본으로 하고 있는 같은 죄질의 재산범죄로서 그 형벌에 있어서도 경중의 차이가 없고 동일한 범죄사실에 대하여 단지 법률적용만을 달리히는 경우에 해당하므로 법원은 배임죄로 기소된 공소사실에 대하여 공소장변경 없이도 횡령죄를 적용하여 처벌할 수 있다(대판 1999.11.26. 99도2651) . ", "answer": "O"}, {"source": "12 변시", "question": "공소사실의 동일성이 인정되는 경우 공소장변경의 절차 없이도 법원이 직권으로 유죄를 인정할 수 있는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "나. 피해자의 적법한 고소가 있어 강간죄로 기소된 공소사실에 대하여 폭행죄만을 인정한 경우 \n", "explanation": "강간의 공소사실은 피해자의 적법한 고소에 의하여 제기되었고 그 후 고소가 취소됨이 없이 유지되고 있는 사실, 피고인은 수사기관에서부터 제1심과 원심에 이르기까지 그 공소사실 기재 일시·장소에서 피해자를 만난 것은 인정하면서 술에 취하여 피해자의 목을 조르고 피해자의 휴대폰을 던지는 등 폭행하였다는 부분은 기억나지 않으나 피해자를 강제로 간음하였을 리가 없다고 변명하였고,나아가 피해자를 폭행하였다는 부분에 관하여 심신미약으로 인한 형의 감경을 주장한 사실을 인정할 수 있다. 이러한 사실관계를 앞서 본 법리에 추어 살펴보면, 원심이 유죄로 인정한 2009. 4. 22 자 폭행은 위 강간의 공소사실에 포함되어 있고,충분한 심리가 이루어졌음을 알 수 있으므로,원심이 적볍한 고소가 존재하는 위 강간의 공소사실에 대하여 강간 범행이 인정되지 않고 다만 그 강간 범행의 수단인 폭행만이 인정된다는 이유로 공소장변경 절차 없이 폭행죄를 인정한 조치는 피고인의 방어권 행사에 실질적 불이익을 초래할 염려가 없다(대판 2010.11.11. 20 10도10512) . ", "answer": "O"}, {"source": "12 변시", "question": "공소사실의 동일성이 인정되는 경우 공소장변경의 절차 없이도 법원이 직권으로 유죄를 인정할 수 있는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "다. 동일한 범죄사실을 가지고 포괄일죄로 기소된 공소사실에 대하여 실체적 경합관계에 있는 수죄를 인정한 경우 \n", "explanation": " 법원이 동일한 범죄사실을 가지고 포괄일죄로 보지 아니하고 실체적 경합관계에 있는 수죄로 인정하였다고 하더라도 이는 다만 죄수에 관한 법률적 평가를 달리한 것에 불과할 뿐이지 소추대상인 공소사실과 다른 사실을 인정한 것도 아니고 또 피고인의 방어권행사에 실질적으로 불이익을 초래할 우려도 없으므로 불고불리의 원칙에 위반되는 것이 아니다(대판 1987.05.26. 87도527) . ", "answer": "O"}, {"source": "12 변시", "question": "공소사실의 동일성이 인정되는 경우 공소장변경의 절차 없이도 법원이 직권으로 유죄를 인정할 수 있는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "라. 살인죄로 기소된 공소사실에 대하여 폭행치사죄를 인정한 경우 \n", "explanation": "공소가 제기된 살인죄의 범죄사실에 대하여는 그 증명이 없으나 폭행치사죄의 증명이 있는 경우에도 살인죄의 구성요건이 반드시 폭행치사 사실을 포함한다고 할 수 없고,따라서 공소장의 변경 없이 폭행치사죄를 인정함은 결국 폭행치사죄에 한 피고인의 방어권 행사에 불이익을 주는 것이므로 법원은 위와 같은 경우에 검사의 공소장변경 없이는 이를 폭행치사죄로 처단할 수는 없다(대판 2001.06.29. 2001도1091). ", "answer": "X"}, {"source": "12 변시", "question": "공소사실의 동일성이 인정되는 경우 공소장변경의 절차 없이도 법원이 직권으로 유죄를 인정할 수 있는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "마. 미성년자 약취 후 재물을 요구하였으나 취득하지는 못한 자에 대하여 ‘미성년자 약취 후 재물취득 미수 에 의한 특정범죄 가중처벌 등에 관한 법률 위반죄로 기소된 공소사실에 대하여 ‘미성년자 약취 후 재물요구 기수’에 의한 같은 법 위반죄를 인정한 경우", "explanation": "미성년자 약취 후 재물을 요구하였으나 취득하지는 못한 범인을 '미성년자 약취 후 재물취득 미수'에 의한 특정범죄 가중처벌 등에 관한 법률 위반죄로 공소제기 하였는데,법원이 공소장변경 없이 ‘미성년자 약취 후 재물요구 기수’에 의한 같은 법 위반죄로 인정하여 미수감경을 배제하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래한다(대판 2008.07.10. 2008도3747). ", "answer": "X"}, {"source": "15 변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피해자가 제1심에서 처벌불원의사를 표시한 후에도 검사가 항소하여 계속된 항소심에서 공소사실을 폭행에서 상해로 변경하는 공소장변경을 할 수 있고 이 경우 항소심이 변경된 공소사실에 상해의 점에 대해 심리 · 판단하여 유죄로 인정한 것은 정당하다. ", "explanation": "[1] 친고죄에서 피해자의 고소가 없거나 고소가 취소되었음에도 친고죄로 기소되었다가 그 후 당초에 기소된 공소사실과 동일성이 인정되는 비친고죄로 공소장변경이 허용된 경우 그 공소제기의 흠은 치유되고(대판 1996.09.24. 96도2151) , 친고죄로 기소된 후에 피해자의 고소가 취소되더라도 제1심이나 항소심에서 당초에 기소된 공소사실과 동일성이 인정되는 범위 내에서 다른 공소사실로 공소장을 변경할 수 있으며 이러한 경우 변경된 공소사실에 대하여 심리 · 판단하여야 하는데(대판 1990.01.25. 89도1317) ,이는 반의사불벌죄에서 피해자의 ‘처벌을 희망하지 아니하는 의사표시’ 또는 ‘처벌을 희망하는 의사표시의 철회’가 있는 경우에도 마찬가지로 보아야 한다. [2] 피해자가 제1심에서 처벌불원의사를 표시한 후에도 항소심에서 공소사실을 폭행에서 상해로 변경히는 공소장변경을 할 수 있고, 이 경우 항소심이 변경된 공소사실인 상해의 점에 대해 심리 판단하여 유죄로 인정한 것은 정당하다고 한 사례(대판 201 1.05.13. 2011도2233). ", "answer": "O"}, {"source": "15 변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "관세포탈미수로 인한 특정범죄가중처벌등에관한법률위반(관세)죄로 공소제기된 경우에는 공소장변경 없이 관세포탈예비로 인한 특정범죄가중처벌등에관한법률위반(관세)죄로 인정할수없다. ", "explanation": "세관직원에게 부탁하여 사위의 방법으로 밀수입하려고 외국에서 구입한 손목시계 등 물품을 가지고 왔다가 통관시켜 줄 세관직원을 찾지 못하여 이를 보세창고에 예치시킨 행위에 대하여 관세포탈미수로 인한 특정범죄가중처벌등에 관한 법률위반죄로 공소제기된 경우에는 위 소위가 관세포탈예비로 인한 특정범죄가중처벌등에 관한 법률위반죄를 구성한다고 하더라도 검사가 공소장변경을 하지 아니한 이상 법원은 이에 관하여 심판할 수 없다(대판1983.04.12. 82도2939) . ", "answer": "O"}, {"source": "15 변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 없는 경우에는 공소사실과 기본적 사실이 동일한 범위 내에서 법원이 공소장변경절차를 거치지 아니하고 다르게 사실을 인정하였다고 할지라도 불고불리의 원칙에 위배되지 아니한다. ", "explanation": "피고인의 방어권행사에 실질적인 불이익을 초래할 염려가 없는 경우에는 공소사실과 기본적 사실이 동일한 범위 내에서 법원이 공소장 변경 절차를 거치지 않고 다르게 인정하였다 할지라도 불고불리의 원칙에 위반되지 않는다(대판 2000.07.28. 98도4558). ", "answer": "O"}, {"source": "15 변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "간접정범으로 공소가 제기된 경우 공소장의 변경 없이 방조범 성립여부를 심리하여 판단하는 것은 피고인의 방어권 행사에 실질적 불이익을 초래할 염려가 있으므로 위법하다. ", "explanation": "이 문제는 1책형 21 번 문제인데 법무부는 4번을 정답(틀린 지문)으로 발표하였다. 그러나 아래 2007도4663 판례가 판시하는 바와 같이 4번 지문은 옳다고 판단된다(이창현, [변호사시험에서의 형사법 선택형 문제의 적합성 연구-제 4회 변호사시험 형사법 선택형 시험의 1책형 21문과 40문을 중심으로 ,한국외대법학연구소, 외법논집 제39권 제4호(2015),pp.187-205 참조). -> 다만 판례는 '공동정범'으로 공소제기 된 경우에는 심리의 경과 등에 따라 달리 판단하고 있는데,  i) 피고인의 방어에 불이익을 주는 것이 아닌 경우에는 공소장변경 없이도 방조범·간접정범을 인정하고(2012도2628; 2014도13148),ii) 심리과정에서 방조사실에 대해 한 번도 언급된 바 없다면 공소장변경 없이는 방조범을 인정할 수 없다고 판시하였다(2009도7166; 2001 도792) .이러한 판례를 '간접정범'으로 공소제기 된 경우에도 적용할 수 있을지는 의문이지만 상대적으로 정답을 고른다면 4번을 틀렸다고 볼 여지도 있을 것이다. \n[판례]  피고인에 대하여 부동산 명의수탁자를 처벌하는 규정인 부동산 실권리자명의 등기에 관한 법률 제7조 제2항 위반죄의 간접정범으로 공소가 제기된 이 사건에서, 원심이 공소장의 변경도 없이 부동산 명의신탁행위의 방조범을 처벌하는 규정인 위 법률 제7조 제3항위반죄가 성립되는지 여부를 심리하여 판단하는 것은 피고인의 방어권 행사에 실질적 불이익을 초래할 염려가 없다고 보기 어려울 뿐만 아니라, 이를 심리하여 처벌하지 아니하는 것이 현저히 정의와 형평에 반하여 위법하다고 볼 수도 없다(대판 2007.10.25. 2007도4663) . \n\n[참조판례] 공동정범으로 공소가 제기된 피고인에 대하여 법원이 공소장 변경 없이 직권으로 방조범으로 인정하여 처벌하기 위해서는 정범의 범행에 대한 공동가공의 의사나 기능적 행위지배의 점에 대한 증명이 부족하지만 그 의심이 있다는 정도로는 부족하고 방조의 고의와 행위가 있었다는 점에 대한 적극적인 증명이 있어야 하고 나아가 그 점에 대하여 피고인에게 방어의 기회가 제공되는 등 심리의 경과에 비추어 피고인의 방어에 실질적인 불이익을 주지 아니한 경우라야 가능할 것이다 ... 원심이 공판진행과정에서는 아무런 언급이 없다가 판결을 선고하면서 공동정범으로는 인정되지 않지만 방조범으로는 인정이 된다고 하여 유죄로 판단한 것은 공소장변경에 관한 법리를 오해하여 판결에 영향을 미친 위법이 있는 경우에 해당한다(대판 2011.11.24. 2009도7166). \n[참조판례] 보건범죄단속에관한특별조치법위반의 공동정범으로 기소된 피고인의 행위가 그 방조행위에는 해당하지만 심리과정에서 이에 관한 언급이나 공소장변경이 없는 경우 보건범죄단속에관한특별조치법위반의 방조범으로 처벌할 수 있는지 여부(소극)(대판 2001.11.09. 2001도4792). \n[비교판례] 법원은 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실보다 가벼운 범죄사실이 인정되는 경우에,그 심리의 경과 등에 비추어 볼 때 피고인의 방어에 실질적인 불이익을 주지 아니한다면 공소장변경 없이 직권으로 가벼운 범죄사실을 인정할 수 있다고 할 것이므로, 공동정범으로 기소된 범죄사실을 방조사질로 인정할 수 있다(대판 2012.06.28. 2012도2628). \n[비교판례]... 간접정범은 정범과 동일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어 살펴보면, 원심이 공소장 변경 없이 직권으로 간접정범 규정을 적용한 것을 두고 피고인들의 방어권 행사에 실질적인 불이익을 초래하였다고 할 수는 없다(대판 2015.04.23. 2014도13148) ... -> 공동정범으로 공소제기된 사례 ", "answer": "O"}, {"source": "15 변시", "question": "공소장변경에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장변경허가에 관한 법원의 결정은 판결 전의 소송절차에 관한 결정이므로 그 결정에 대하여 독립하여 항고할 수 없으나,공소장변경허가에 관한 결정의 위법이 판결에 영향을 미친 경우에 한하여 그 판결에 대하여 상소를 제기할 수 있다. ", "explanation": "판결전의 소송절차에 관한 결정에 대하여는 특히 즉시항고를 할 수 있는 경우외에는 항고를 하지 못하는 것인 바, 소송사실 또는 적용법조의 추가, 철회 또는 변경의 허가에 관한 결정은 판결전의 소송절차에 관한 결정이라 할 것이므로, 그 결정을 함에 있어서 저지른 위법이 판결에 영향을 미친 경우에 한하여 그 판결에 대하여 상소를 하여 다툼으로써 불복하는 외에는 당사자가 이에 대하여 독립하여 상소할 수 없다(대결 1987.03.28. 87모17). ", "answer": "O"}, {"source": "26 변시", "question": "공판절차에서 피고인의 불출석에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "장기 3년 이하의 징역 또는 금고,다액 500만 원을 초과하는 벌금 또는 구류에 해당하는 사건에서 피고인의 불출석 허가신청이 있고 법원이 이를 허가하였다면 인정신문은 물론 판결을 선고히는 공판기일에도 피고인의 출석을 요하지 아니한다. \n", "explanation": "2번(아래 문항) 해설과 동일", "answer": "X"}, {"source": "26 변시", "question": "공판절차에서 피고인의 불출석에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "약식명령에 대하여 피고인만이 정식재판의 청구를 한 사건에서 법원이 심리 후 판결선고기일을 따로 잡은 경우에는 피고인 출석 없이도 개정하여 판결을 선고할 수 있다. \n", "explanation": "형사소송법 제277조 제3호 단서, 제4호 참조\n[형사소송법 제277조(경미사건 등과 피고인의 불출석)] 다음 각 의 어느 하나에 해당하는 사건에 관하여는 피고인의 출석을 요하지 아니한다. 이 경우 피고인은 대리인을 출석 하게 할 수 있다. \n1. 다액 500 만원 이하의 벌금 또는 에 해당하는 사건 \n2. 공소기각 또는 면소의 재판을 할 것이 명백한 사건 \n3. 장기 3년 이하의 징역 또는 금고, 다액 500만원을 초과하는 벌금 또는 구류에 해당하는 사건에서 피고인의 불출석허가신청이 있고 법원이 피고인의 불출석이 그의 권리를 보호함에 지장이 없다고 인정하여 이를 허가한 사건. 다만, 제284조에 따른 절차를 진행하거나 판결을 선고하는 공판기일에는 출석하여야 한다. \n4. 제453조 제1항에 따라 피고인만이 정식재판의 청구를 하여 판결을 선고하는 사건  \n[형사소송법 제284조(인정신문)] 재판장은 피고인의 성명, 연령, 등록기준지, 주거와 직업을 물어서 피고인임에 틀림없음을 확인하여야 한다. \n[형사소송법 제453조(정식재판의 청구)] ①검사 또는 피고인은 약식명령의 고지를 받은 날로부터 7일 이내에 정식재판의 청구를 할 수 있다. 단 피고인은 정식재판의 청구를 포기할 수 없다. ", "answer": "O"}, {"source": "26 변시", "question": "공판절차에서 피고인의 불출석에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "증인이 피고인 면전에서 충분한 진술을 할 수 없다고 인정하여 피고인을 퇴정하게 하고 진술하게 한 경우,피고인이 재정의무를 위반한 것은 아니므로 피고인의 반대신문권을 배제할수는 없다. \n", "explanation": "형사소송법 제297조의 규정에 따라 재판장은 증인이 피고인의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 하고 증인신문을 진행함으로써 피고인의 직접적인 증인 대면을 제한할 수 있지만, 이러한 경우에도 피고인의 반대신문권을 배제하는 것은 허용될 수 없다(대판 2010.01.14. 2009도9344). ", "answer": "O"}, {"source": "26 변시", "question": "공판절차에서 피고인의 불출석에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 공판심리 중 재판거부 의사를 표시하면서 재판장 허가 없이 퇴정하고 변호인도 이에 동조하여 퇴정한 경우는 필요적 변호사건에 해당하는 때에도 피고인과 변호인의 불출석 상태에서 재판진행을  할 수 있다. \n", "explanation": "[가] 필요적 변호사건이라 하여도 피고인이 재판거부의 의사를 표시하고 재판장의 허가 없이 퇴정하고 변호인마저 이에 동조하여 퇴정해 버린 것은 모두 피고인측의 방어권의 남용 내지 변호권의 포기로 볼 수밖에 없는 것이므로 수소법원으로서는 형사소송법 제330조에 의하여 피고인이나 변호인의 재정 없이도 심리 판결할 수 있다. [나] 위 “가’항과 같이 피고인과 변호인들이 출석하지 않은 상태에서 증거조사를 할 수밖에 없는 경우에는 형사소송법 제318조 항의 규정상 피고인의 진의와는 관계없이 형사소송법 제 318조 항의 동의가 있는 것으로 간주하게 되어 있다(대판 1991.06.28. 91도865). \n[형사소송법 제330조(피고인의 진술없이 하는 판결)] 피고인이 진술하지 아니하거나 재판장의 허가없이 퇴정하거나 재판장의 질서유지를 위한 퇴정명령을 받은 때에는 피고인의 진술없이 판결할 수 있다. \n[형사소송법 318조(당사자의 동의와 증거능력)] 검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다. \n", "answer": "O"}, {"source": "26 변시", "question": "공판절차에서 피고인의 불출석에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "위(앞의 선지)의 상황에서 법원이 증거조사를 할 수밖에 없는 경우에는,검사가 제출한 전문증거에 대하여 피고인의 진의외는 관계없이 「형사소송법」 제318조 제1항의 동의가 있는 것으로 간주한다. ", "explanation": "4번(위 문항) 해설과 동일", "answer": "O"}, {"source": "24변시", "question": "공판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "피고인은 항소심 제1회 공판기일에는 불출석 제2회 공판기일에는 출석하였으나 제3회 공판기일에 다시 불출석하자 법원이 피고인의 변호인과 검사만 출석한 상태에서 공판 절차를 진행하여 변론을 종결한 다음 제4회 공판기일에 피고인의 항소를 기각하는 판결을 선고하였다면,이는 「형사소송법」 제365조에 따른 조치로서 적법하다.", "explanation": "항소심에서도 피고인의 출석 없이는 개정하지 못하는 것이 원칙이다(형사소송법 제370조, 제276조). 다만 피고인이 항소심 공판기일에 출정하지 않아 다시 기일을 정하였는데도 정당한 사유 없이 그 기일에도 출정하지 않은 때에는 피고인의 진술 없이 판결할 수 있다(형사소송법 제365조) . 이와 같이 피고인이 불출석한 상태에서 그 진술 없이 판결할 수 있기 위해서는 피고인이 적볍한 공판기일 통지를 받고서도 2회 연속으로 정당한 이유 없이 출정하지 않은 경우에 해당하여야 한다(대판 2006.02.23. 2005도9291).", "answer": "X"}, {"source": "24변시", "question": "공판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "제1심 공판절차에서 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 피고인의 소재를 확인할 수 없는 경우에는 대법원규칙으로 정하는 바에 따라 피고인의 진술 없이 재판할 수 있으나 사형 무기 또는 장기 10년이 넘는 징역이나 금고에 해당 하는 사건의 경우에는 피고인의 진술 없이 재판할 수 없다.", "explanation": "소송촉진 등에 관한 특례법 제23조(제1심 공판의 특례) 제1심 공판절차에서 피고인에 대한 송달불능보고서(送達不能報告書)가 접수된 때부터 6개월이 지나도록 피고인의 소재(所在)를 확인할 수 없는 경우에는 대법원규칙으로 정하는 바에 따라 피고인의 진술 없이 재판할 수 있다. 다만,사형,무기 또는 장기(長期) 10년이 넘는 징역이나 금고에 해당하는 사건의 경우에는 그러하지 아니하다. 소송촉진 등에 관한 특례규칙 제19조(불출석피고인에 대한 재판) ② 피고인이 제1항의 규정에 의한 공판기일의 소환을 2회이상 받고도 출석하지 아니한 때에는 법 제23조의 규정에 의하여 피고인의 진술없이 재판할 수 있다. ", "answer": "O"}, {"source": "24변시", "question": "공판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "최종의견 진술의 기회는 피고인이나 변호인에게 주어지면 되는바 재판장이 변호인의 최후변론이 끝나자마자 곧바로 선고기일을 지정·고지함으로써 피고인에게 최종의견 진술의 기회를 주지 아니한 채 변론을 종결하고 판결을 선고하였다 하더라도 이는 재판장의 소송지휘권의 범위 내에 속하는 재량행위로서 소송절차의 법령위반에 해당한다고 볼 수는 없다.", "explanation": "형사소송법 제303조는 “재판장은 검사의 의견을 들은 후 피고인과 변호인에게 최종의 의견을 진술할 기회를 주어야 한다\"라고 정하고 있으므로,최종의견 진술의 기회는 피고인과 변호인 모두에게 주어져야 한다. 이러한 최종의견 진술의 기회는 피고인과 변호인의 소송법상 권리로서 피고인과 변호인이 사실관계의 디툼이나 유리한 양형사유를 주장할 수 있는 마지막 기회이므로, 피고인이나 변호인에게 최종의견 진술의 기회를 주지 아니한 채 변론을 종결하고 판결을 선고하는 것은 소송절차의 법령위반에 해당한다 (대판 2018.03.29. 2018도327). ", "answer": "X"}, {"source": "24변시", "question": "공판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "종결한 변론을 재개할지 여부는 원칙적으로 법원의 재량에 속하는 사항이나,항소심이 변론종결한 후 선임된 변호인의 변론재개신청을 들어주지 않았다면 이는 심리미진의 위법이 있는 경우에 해당한다. ", "explanation": "종결한 변론을 재개하느냐의 여부는 법원의 재량에 속하는 사항으로서 원심이 변론종결 후 선임된 변호인의 변론재개신청을 들어주지 아니하였다 하여 심리미진의 위법이 있는 것은 아니다(대판 1986.06.10. 86도769). ", "answer": "X"}, {"source": "24변시", "question": "공판에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "증거신청의 채택 여부는 법원의 재량으로서 법원의 증거결정에 대하여는 보통항고,즉시항고 모두 할 수 없고, 다만 증거결정에 법령위반이 있는 경우에 한해 이의신청을 할 수 있을 뿐이며,또한 그로 말미암아 사실을 오인하여 판결에 영향을 미치기에 이른 경우에만 이를 상소의 이유로 삼을 수 있다 ", "explanation": "당사자의 증거신청을 채택하는지 여부에 관한 법원의 결정은 판결 전의 소송절차에 관한 결정으로서 이의신청을 하는 외에는 달리 불복할 수 있는 방법이 없고,다만 그로 말미암아사실을 오인하여 판결에 영향을 미치기에 이른 경우에 이를 들어 상소의 이유로 삼을 수 있을 뿐이다(대판 2013.04.26. 2013도856). ", "answer": "O"}, {"source": "26변시", "question": "증거조사 및 증인신문에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법원은 소환장을 송달받은 증인이 정당한 사유 없이 소환에 응하지 아니하는 경우 구인할 수 있고,이는「특정범죄신고자 등 보호법」이 직접 적용되거나 준용되는사건에서도마찬가지이므로, 불출석한 핵심 증인이 위 법에 의하여 보호되는 범죄신고자에 해당한다고 하더라도 소재탐지나 구인장 발부 없이 증인채택 결정을 취소하는 것은 특별한 사정이 없는 한 위법하다.", "explanation": "[1] 모든 국민은 법정에 출석하여 증언할 의무를 부담한다. 법원은 소환장을 송달받은 증인이 정당한 사유 없이 출석하지 아니한 경우에 당해 불출석으로 인한 소송비용을 증인이 부담하도록 명하고,500만 원 이하의 과태료를 부과할 수 있으며(형사소송법 제151조 제1항 전문) , 정당한 사유 없이 소환에 응하지 아니히는 경우에는 구인할 수 있다(형사소송법 제152조) . 또한 법원은 증인 소환장이 송달되지 아니한 경우에는 공무소 등에 대한 조회의 방법으로 직권 또는 검사 피고인 변호인의 신청에 따라 소재탐지를 할 수도 있다(형사소송법 제272조 제1항 참조) . 이는 ‘특정범죄신고자 등 보호법’이 직접 적용되거나 준용되는 사건에 대해서도 마찬가지이다. [2] 형사소송법이 증인의 법정 출석을 강제할 수 있는 권한을 법원에 부여한 취지는,다른 증거나 증인의 진술에 비추어 굳이 추가 증인신문을 할 필요가 없다는 등 특별한 사정이 없는 한 사건의 실체를 규명하는 데 가장 직접적이고 핵심적인 증인으로 하여금 공개된 법정에 출석하여 선서 후 증언하도록 하고,법원은 출석한 증인의 진술을 토대로 형성된 유죄·무죄의 심증에 따라 사건의 실체를 규명하도록 하기 위함이다. 따라서 다른 증거나 증인의 진술에 비추어 굳이 추가 증거조사를 할 필요가 없다는 등 특별한 사정이 없고,소재탐지나 구인장 발부가 불가능한 것이 아님에도 불구하고,불출석한 핵심 증인에 대하여 소재탐지나 구인장 발부 없이 증인채택 결정을 취소하는 것은 법원의 재량을 벗어나는 것으로서 위법하다(대판 2020.12.10. 2020도2623).", "answer": "O"}, {"source": "26변시", "question": "증거조사 및 증인신문에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법원이 감정서에 기재된 의견에 관한 설명을 추가로 듣기 위하여 감정인을 증인으로 채택하여 소환하였는데 감정인이 소환장을 송달받고도 출석하지 않았다면 그 불출석에 대한 제재로서 증인의 불출석에 대하여 과태료를 부과할 수 있도록 한 「형사소송법」 제151조 제1항에 따른 과태료를 부과할 수 있다. ", "explanation": "감정인은 특정한 분야에 특별한 학식과 경험을 가진 사람으로,그 학식과 경험에 의하여 알고 있거나 그 전문적 학식과 경험에 의하여 얻은 일정한 원리 또는 판단을 법원에 진술 • 보고한다. 감정에 관하여는 형사소송법의 증인에 관한 규정이 준용되나 감정인이 소환에 응하지 않더라도 구인할 수는 없다(형사소송법 제177조) . 감정인이라 하더라도 특별한 지식에 의하여 알게 된 과거의 사실에 관하여 진술하여야 하는 경우에는 증인의 지위에 해당하는 감정증인으로서 증인신문절차에 따라 신문하여야 하나(형사소송법 제179조) , 감정인이 감정을 하여 감정서(형사소송법 제171조 제1항)를 제출한 경우에 그 기재된 의견에 관한 설명을 추가로 듣는 절차(형사소송법 제171조 제4항) 등은 감정인이 과거의 사실을 진술하는 지위에 있지 않은 이상 증인신문이 아니라 형사소송법 제1편 제13장의 감정에 관한 규정에 따라 소환하여 진행하는 감정인신문으로 하여야 한다. 따라서 경험한 과거의 사실을 진술할 지위에 있지 않음이 명백한 감정인을 법원이 증인 또는 감정증인으로 소환한 경우,감정인이 소환장을 송달받고 출석하지 않았더라도 그 불출석에 대한 제재로서 형사소송법 제151조 제1항에 따른 과태료를 부과할 수는 없다(대결 2024.10.31. 2023모358). ", "answer": "X"}, {"source": "26변시", "question": "증거조사 및 증인신문에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공범인 공동피고인에 대하여 소송절차를 분리한 후 증인적격을 인정하고 그 자신의 범죄사실에 대하여 신문하더라도 피고인으로서의 진술거부권 내지 자기부죄거부특권을 침해하는 것은 아니므로, 증인신문절차에서 증언거부권이 고지되었음에도 위 피고인이 자기의 범죄 사실에 대하여 증언거부권을 행사하지 아니한 채 허위로 진술하였다면 위증죄가 성립한다. ", "explanation": "형사소송법 제148조는 피고인의 자기부죄거부특권을 보장하기 위하여 자기가 유죄판결을 받을 사실이 발로될 염려 있는 증언을 거부할 수 있는 권리를 인정하고 있고 그와 같은 증언거부권 보장을 위하여 형사소송법 제160조는 재판장이 신문 전에 증언거부권을 고지하여야 한다고 규정하고 있으므로,소송절차가 분리된 공범인 공동피고인에 대하여 증인적격을 인정하고 그 자신의 범죄사실에 대하여 신문한다 하더라도 피고인으로서의 진술거부권 내지 자기부죄거부특권을 침해한다고 할 수 없다 . 따라서 증인신문절차에서 형사소송법 제160조에 정해진 증언거부권이 고지되었음에도 불구하고 위 피고인이 자기의 범죄사실에 대하여 증언거부권을 행사하지 아니한 채 허위로 진술하였다면 위증죄가 성립된다고 할 것이다(대판 2012.10.11. 2012도6848 2012전도143).", "answer": "O"}, {"source": "26변시", "question": "증거조사 및 증인신문에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "당사자의 증거신청에 대한 법원의 채택여부의 결정은 판결 전의 소송절차에 관한 결정으로서 이의신청을 하는 것 외에는 달리 불복할 수 있는 방법이 없고,그로 말미암아 사실을 오인하여 판결에 영향을 미친 경우에만 이를 상소의 이유로 삼을 수 있을 뿐이다. ", "explanation": "당사자의 증거신청에 대한 법원의 채택여부의 결정은 판결 전의 소송절차에 관한 결정으로서 이의신청을 하는 외에는 달리 불복할 수 있는 방법이 없고,다만 그로 말미암아 사실을 오인하여 판결에 영향을 미치기에 이른 경우에만 이를 상소의 이유로 삼을 수 있을 뿐이다(대판 1990.06.08. 90도646). ", "answer": "O"}, {"source": "26변시", "question": "증거조사 및 증인신문에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "녹음·녹화매체 등에 대한 증거조사는 이를 재생하여 청취 또는 시청하는 방법으로 하여야 하므로,검사가 피고인들의 체포장면이 녹화된 동영상 CD를 별도의 증거로 제출하지 아니하고 CD의 내용을 간략히 요약한 수사보고서에 CD를 첨부하여 수사보고서만을 서증으로 제출한 경우,CD에 대하여 위와 같은 증거조사절차를 거치지 아니한 채 유죄의 증거로 채택하여서는 아니 된다.", "explanation": "피고인들이 금지통고된 옥외집회를 진행하던 중 3회에 걸쳐 자진 해산명령을 받고도 이에 불응하였다고 하여 관할 경찰공무원 등에 의해 체포되어 집회 및 시위에 관한 법률(이하 ‘집시법’이라 한다) 위반죄로 기소된 사안에서,검사가 피고인들의 체포장면이 녹화된 동영상 CD를 별도의 증거로 제출하지 아니하고 CD의 내용을 간략히 요약한 수사보고서에 CD를 첨부하여 수사보고서만을 서증으로 제출하였는데, 형사소송법 제292조의3 및 형사소송규칙 제134조의8은 녹음·녹화매체 등에 대한 증거조사는 이를 재생하여 청취 또는 시청하는 방법으로 하도록 규정하고 있으므로 원심이 CD에 대하여 형사소송규칙에서 정한 증거조사절차를 거치지 아니한 채 유죄의 증거로 채택한 조치는 잘못이다(대판 2011.10.13. 2009도13846).", "answer": "O"}, {"source": "23변시", "question": "증언거부권에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "증언거부권이 있는 자에게 증언거부권이 있음을 설명하지 않은 경우라도 증인이 선서하고 증언한 이상 그 증언의 효력에는 영향이 없다. ", "explanation": "증언거부권 있음을 설명하지 아니한 경우라 할지라도 증인이 선서하고 증언한 이상 그 증언의 효력에 관하여는 역시 영향이 없고 유효하다고 해석함이 타당하다(대판 1957.03.08. 4290형상23).", "answer": "O"}, {"source": "23변시", "question": "증언거부권에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "자신에 대한 유죄판결이 확정된 증인이 공범에 대한 형사사건에서 증언할 당시 앞으로 재심을 청구할 예정이라면 증인에게 「형사소송법」제148조(근친자의 형사책임과 증언 거부)에 의한 증언거부권이 인정된다. ", "explanation": "재심사건에는 불이익변경 금지 원칙이 적용되어 원판결의 형보다 중한 형을 선고하지 못하므로(형사소송법 제439조), 자신의 유죄 확정판결에 대하여 재심을 청구한 증인에게 증언의무를 부과하는 것이 형사소추 또는 공소제기를 당하거나 유죄판결을 받을 사실이 발로(發露)될 염려 있는 증언을 강제하는 것이라고 볼 수는 없다. 따라서 자신에 대한 유죄판결이 확정된 증인이 공범에 대한 피고사건에서 증언할 당시 앞으로 재심을 청구할 예정이라고 하여도, 이를 이유로 증인에게 형사소송법 제148조에 의한 증언거부권이 인정되지는 않는다(대판 2011.11.24. 2011도11994). ", "answer": "X"}, {"source": "23변시", "question": "증언거부권에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변호사는 그 업무상 위탁을 받은 관계로 알게 된 사실로서 타인의 비밀에 관한 것은 증언을 거부할 수 있고,다만 본인의 승낙이 있거나 중대한 공익상 필요가 있는 때에는 그러하지 아니하다. ", "explanation": "형사소송법 제149조 참조. \n형사소송법 제149조(업무상비밀과 증언거부) 변호사, 변리사, 공증인, 공인회계사, 세무사, 대서업자, 의사, 한의사, 치과의사, 약사, 약종상, 조산사, 간호사, 종교의 직에 있는 자 또는 이러한 직에 있던 자가 그 업무상 위탁을 받은 관계로 알게 된 사실로서 타인의 비밀에 관한 것은 증언을 거부할 수 있다. 단, 본인의 승낙이 있거나 중대한 공익상 필요있는 때에는 예외로 한다.", "answer": "O"}, {"source": "23변시", "question": "증언거부권에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "증언거부사유가 있음에도 형사사건의 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄가 성립하지 않는다. ", "explanation": "... 헌법 제12조 제2헝에 정한 불이익 진술의 강요금지 원칙을 구체화한 자기부죄거부특권에 관한 것이거나 기타 증언거부사유가 있음에도 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 할 것이다(대판 2010.02.25. 2009도13257).", "answer": "O"}, {"source": "23변시", "question": "증언거부권에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "소송절차가 분리된 공범인 공동피고인이 증인으로 법정에 출석하여 증언거부권을 고지받은 상태에서 자기의 범죄사실에 대하여 허위로 진술한 경우 위증죄가 성립한다. ", "explanation": "... 한편 형사소송법 제148조는 피고인의 자기부죄거부특권을 보장하기 위하여 자기가 유죄판결을 받을 사실이 발로될 염려 있는 증언을 거부할 수 있는 권리를 인정하고 있고,그와 같은 증언거부권 보장을 위하여 형사소송법 제160조는 재판장이 신문 전에 증언거부권을 고지하여야 한다고 규정하고 있으므로, 소송절차가 분리된 공범인 공동피고인에 대하여 증인적격을 인정하고 그 자신의 범죄사실에 대하여 신문한다 하더라도 피고인으로서의 진술거부권 내지 자기부죄거부특권을 침해한다고 할 수 없다. 따라서 증인신문절차에서 형사소송법 제160조에 정해진 증언거부권이 고지되었음에도 불구하고 위 피고인이 자기의 범죄사실에 대하여 증언거부권을 행사하지 아니한 채 허위로 진술하였다면 위증죄가 성립된다고 할 것이다(대판 2012.10.11. 2012도6848,2012전도143). ", "answer": "O"}, {"source": "22변시", "question": "증인신문에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "반대신문에 있어서 필요할 때에는 유도신문을 할 수 있으며 반대신문의 기회에 주신문에 나타나지 아니한 새로운 사항에 관하여 신문하고자 할 때에는 재판장의 허가를 받아야 한다. ", "explanation": "형사소송법 규칙 제76조 제2항 및 제4항 참조. \n형사소송규칙 제176조 (반대신문) ② 반대신문에 있어서 필요할 때에는 유도신문을 할 수 있다. \n④ 반대신문의 기회에 주신문에 나타나지 아니한 새로운 사항에 관하여 신문하고자 할 때에는 재판장의 허가를 받아야한다.", "answer": "O"}, {"source": "22변시", "question": "증인신문에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "공판기일에 증인은 출석하였으나 피고인이 정당한 사유 없이 출석하지 아니하여 「형사소송법」제276조의 규정에 의하여 공판기일을 연기할 수밖에 없는 경우,법원이 이미 출석하여 있는 증인에 대하여 공판기일 외의 신문으로서 증인신문을 하고 다음 공판기일에 그 증인신문조서에 대한 서증조사를 하는 것은 증거조사절차로서 위법하다. ", "explanation": "공판기일에서 증인을 채택하여 다음 공판기일에 증인신문을 하기로 피고인에게 고지하였는데,그 다음 공판기일에 증인은 출석하였으나 피고인이 정당한 사유 없이 출석하지 아니한 경우에,피고인의 출석 없이 개정 가능한 특별규정이 있는 경우가 아니어서 형사소송법 제276조의 규정에 의하여 공판기일을 연기할 수밖에 없더라도,이미 출석하여 있는 증인에 대하여 공판기일 외의 신문으로서 증인신문을 하고, 다음 공판기일에 그 증인신문조서에 대한 서증조사를 하는 것은 증거조사절차로서 적법하다(대판 2000.10.13. 2000도3265 참조)(대판 2008.02.01 2007도9851). ", "answer": "X"}, {"source": "22변시", "question": "증인신문에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "「형사소송법」제297조의 규정에 따라 재판장은 증인이 피고인의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 하고 증인신문을 진행함으로써 피고인의 직접적인 증인 대면을 제한하고 피고인의 반대신문권을 배제할 수 있다.", "explanation": "형사소송법 제297조의 규정에 따라 재판장은 증인이 피고인의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 하고 증인신문을 진행함으로써 피고인의 직접적인 증인대면을 제한할 수 있지만, 이러한 경우에도 피고인의 반대신문권을 배제히는 것은 허용될 수 없다(대판 2010.01.14. 2009도9344).", "answer": "X"}, {"source": "22변시", "question": "증인신문에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "법정 외에서 증인신문을 실시함에 있어서 피고인에 대하여 통지하지 아니하여 참여 기회를 주지 않았다면,그 후 속개된 공판기일에서 피고인과 변호인이 그 증인신문조사에 대하여 별 의견이 없다고 진술하였더라도 그 증인신문조사의 하자는 치유되지 않는다. ", "explanation": "법정외에서 증인신문을 실시함에 있어서 피고인에 대하여 통지하지 아니하여 참여 기회를 주지 않은 잘못이 있다고 하더라도 그 후 속개된 공판기일에서 피고인과 변호인이 그 증인신문조사에 대하여 별 의견이 없다고 진술하였다면 그 잘못은 책문권의 포기로 치유된다 할 것이다(대판 1980.05.20. 80도306(전합) ). ", "answer": "X"}, {"source": "22변시", "question": "증인신문에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "「형사소송법」 제165조의2 비디오 등 중계장치 등에 의한 증인신문에 있어서 「형사소송규칙」제84조의9에서 피고인과 증인 사이의 차폐시설 설치만을 규정하고 있으므로 검사,변호인, 방청인과 증인 사이에 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 없다. ", "explanation": "증인이 대면하여 진술함에 있어 심리적인 부담으로 정신의 평온을 현저하게 앓을 우려가 있는 상대방은 피고인인 경우가 대부분일 것이지만 증인이나 피고인과의 관계에 따라서는 방청인 등 다른 사람도 상대방이 될 수 있다. 이에 따라 형사소송법 제165조의2 제3호도 대상을 ‘피고인 등’이라고 규정하고 있으므로,법원은 형사소송법 제165조의2 제3호의 요건이 충족될 경우 피고인뿐만 아니라 검사, 변호인, 방청인 등에 대하여도 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 있으며 이는 형사소송규칙 제84조의9에서 피고인과 증인 사이의 차폐시설 설치만을 규정하고 있다고 하여 달리 볼 것이 아니다. 다만 증인이 변호인을 대면하여 진술함에 있어 심리적인 부담으로 정신의 평온을 현저하게 잃을 우려가 있다고 인정되는 경우는 일반적으로 쉽게 상정할 수 없고,피고인뿐만 아니라 변호인에 대해서까지 차폐시설을 설치하는 방식으로 증인신문이 이루어지는 경우 피고인과 변호인 모두 증인이 증언하는 모습이나 태도 등을 관찰할 수 없게 되어 그 한도에서 반대신문권이 제한될 수 있으므로 변호인에 대한 차폐시설의 설치는, 특정범죄신고자 등 보호법 제7조에 따라 범죄신고자 등이나 친족 등이 보복을 당할 우려가 있다고 인정되어 조서 등에 인적사항을 기재하지 아니한 범죄신고자 등을 증인으로 신문하는 경우와 같이,이미 인적사항에 관하여 비밀조치가 취해진 증인이 변호인을 대면하여 진술함으로써 자신의 신분이 노출되는 것에 대하여 심한 심리적인 부담을 느끼는 등의 특별한 사정이 있는 경우에 예외적으로 허용될 수 있을 뿐이다(대판 2015.05.28. 2014도18006).", "answer": "X"}, {"source": "20변시", "question": "공판기일에서의 증인신문에 관한 설명 중 옳지 않은 것은? ", "choice": "공무원뿐만 아니라 공무원이었던 자도 그 직무에 관하여 알게 된 사실에 관하여 본인 또는 당해 공무소가 직무상 비밀에 속한 사항임을 신고한 때에는 그 소속공무소 또는 감독관공서의 승낙 없이는 증인으로 신문하지 못한다. ", "explanation": "형사소송법 제147조 참조. \n형사소송법 제147조(공무상 비밀과 증인자격) ① 공무원 또는 공무원이었던 자가 그 직무에 관하여 알게 된 사실에 관하여 본인 또는 당해 공무소가 직무상 비밀에 속한 사항임을 신고한 때에는 그 소속공무소 또는 감독관공서의 승낙 없이는 증인으로 신문하지 못한다.", "answer": "O"}, {"source": "20변시", "question": "공판기일에서의 증인신문에 관한 설명 중 옳지 않은 것은? ", "choice": "증인이 16세 미만일 경우 선서하게 하지 아니하고 신문하여야 한다. ", "explanation": "형사소송법 제159조 참조. \n형사소송법 제159조(선서 무능력) 증인이 다음 각 호의 1에 해당한 때에는 선서하게 하지 아니하고 신문하여야 한다. \n1. 16세미만의 자 \n2. 선서의 취지를 이해하지 못하는 자 ", "answer": "O"}, {"source": "20변시", "question": "공판기일에서의 증인신문에 관한 설명 중 옳지 않은 것은? ", "choice": "증인신문은 각 증인에 대하여 신문하여야 하고 신문하지 아니한 증인이 재정한 때에는 퇴정을 명하여야한다.", "explanation": "형사소송법 제162조 참조. \n형사소송법 제162조(개별신문과 대질) ① 증인신문은 각 증인에 대하여 신문하여야 한다. \n② 신문하지 아니한 증인이 재정한 때에는 퇴정을 명하여야 한다. \n③ 필요한 때에는 증인과 다른 증인 또는 피고인과 대질하게 할 수 있다.", "answer": "O"}, {"source": "20변시", "question": "공판기일에서의 증인신문에 관한 설명 중 옳지 않은 것은? ", "choice": "주신문에서는 유도신문이 원칙적으로 허용되나 반대신문에서는 유도신문이 허용되지 않는다. ", "explanation": "형사소송규칙 제175조(주신문) ② 주신문에 있어서는 유도신문을 하여서는 아니된다. 다만, 다음 각호의 1의 경우에는 그러하지 아니하다. \n형사소송규칙 제176조(반대신문) ② 반대신문에 있어서 필요할 때에는 유도신문을 할 수 있다.", "answer": "X"}, {"source": "20변시", "question": "공판기일에서의 증인신문에 관한 설명 중 옳지 않은 것은? ", "choice": "법원은 13세 미만의 피해자를 증인으로 신문하는 경우 재판에 지장을 초래할 우려가 있는 등 부득이한 경우가 아닌 한 피해자와 신뢰관계에 있는 자를 동석하게 하여야 한다. ", "explanation": "형사소송법 제163조의2 제2항 참조. \n형사소송법 제163조의2(신뢰관계에 있는 자의 동석) ② 법원은 범죄로 인한 피해자가 13세 미만이거나 신체적 또는 정신적 장애로 사물을 변별하거나 의사를 결정할 능력이 미의f한 경우에 재판에 지장을 초래할 우려가 있는 등 부득이한 경우가 아닌 한 피해자와 신뢰관계에 있는 자를 동석하게 하여야 한다. ", "answer": "O"}, {"source": "16변시", "question": "증인신문에 관한 설명 중 옳은 것(o)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변호인에게 증인적격을 인정하더라도 변호사인 변호인은 피고인에게 불리한 사실에 대해서는 증언거부권을 행사할 수 있다.", "explanation": "형사소송법 제 146조(증인의 자격) 법원은 법률에 다른 규정이 없으면 누구든지 증인으로 신문할 수 있다.\n형사소송법 제 149조(업무상비밀과 증언거부) 변호사, 변리사, 공증인, 공인회계사, 세무사, 대서업자, 의사, 한의사, 치과의사, 약사, 약종상, 조산사, 간호사, 종교의 직에 있는 자 또는 이러한 직에 있던 자가 그 업무상 위탁을 받은 관계로 알게 된 사실로서 타인의 비밀 에 관한 것은 증언을 거부할 수 있다. 단 본인의 승낙이 있거나 중대한 공익상 필요있는 때에는 예외로 한다.", "answer": "O"}, {"source": "16변시", "question": "증인신문에 관한 설명 중 옳은 것(o)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "지신에 대한 유죄판결이 확정된 증인에게는 공범에 대한 피고사건에서 증언거부권이 인정되지 않는다.", "explanation": "형사소송법 제148조의 증언거부권은 헌법 제12조 제2항에 정한 불이익 진술의 강요금지 원칙을 구체화한 자기부죄거부특권에 관한 것인데, 이미 유죄의 확정판결을 받은 경우에는 헌법 제13조 제1항에 정한 일사부재리의 원칙에 의해 다시 처벌받지 아니하므로 자신에 대한 유죄판결이 확정된 증인은 공범에 대한 사건에서 증언을 거부할 수 없고, 설령 증인이 자신에 대한 형사사건에서 시종일관 범행을 부인하였더라도 그러한 사정만으로 증인이 진실대로 진술할 것을 기대할 수 있는 가능성이 없는 경우에 해당한다고 할 수 없으므로 허위의 진술에 대하여 위증죄 성립을 부정할 수 없다. 한편 자신에 대한 유죄판결이 확정된 증인이 재심을 청구한다 하더라도, 이미 유죄의 확정판결이 있는 사실에 대해서는 일사부재리의 원칙에 의하여 거듭 처벌받지 않는다는 점에 변함이 없고, 형사소송법상 피고인의 불이익을 위한 재심 청구는 허용되지 아니하며(형사소송법 제420조) 재심사건에는 불이익변경 금지 원칙이 적용되어 원판결의 형보다 중한 형을 선고하지 못하므로(형사소송법 제439조) , 자신의 유죄 확정판결에 대하여 재심을 청구한 증인에게 증언의무를 부과히는 것이 형사소추 또는 공소제기를 당하거나 유죄판결을 받을 사실이 발로될 염려 있는 증언을 강제하는 것이라고 볼 수는 없다. 따라서 자신에 대한 유죄판결이 확정된 증인이 공범에 대한 피고사건에서 증언할 당시 앞으로 재심을 청구할 예정이라고 하여도, 이 를 이유로 증인에게 형사소송법 제148조에 의한 증언거부권이 인정되지는 않는다(대판 2011.11.24. 2011도11994).", "answer": "O"}, {"source": "16변시", "question": "증인신문에 관한 설명 중 옳은 것(o)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "소송절차가 분리된 공범인 공동피고인이 증언거부권을 고지받은 상태에서 자기의 범죄사실에 대하여 허위로 증언한 경우에는 위증죄가 성립한다.", "explanation": "헌법 제12조 제2항은 ‘모든 국민은 형사상 자기에게 불리한 진술을 강요당하지 아니한다고 규정하고 있고 형사소송법 제283조의2 제1항도 “ 피고인은 진술하지 아니하거나 개개의 질문에 대하여 진술을 거부할 수 있다\"고 규정하고 있으므로, 공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있어 다른 공동피고인에 대한 공소 사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소 사실에 관하여 증인이 될 수 있다. 한편 형사소송법 제148조는 피고인의 자기부죄거부특권을 보장하기 위하여 자기가 유죄판결을 받을 사실이 발로될 염려 있는 증언을 거부할 수 있는 권리를 인정하고 있고 그와 같은 증언거부권 보장을 위하여 형사소송법 제160조는 재판장이 신문 전에 증언거부권을 고지하여야 한다고 규정하고 있으므로, 소송절차가 분리된 공범인 공동피고인에 대하여 증인 적격을 인정하고 그 자신의 범죄사실에 대하여 신문한다 하더라도 피고인으로서의 진술거부권 내지 자기부죄거부특권을 침해한다고 할 수 없다. 따라서 증인신문절차에서 형사소송법 제160조에 정해진 증언거부권이 고지되었음에도 불구하고 위 피고인이 자기의 범죄사실에 대하여 증언거부권을 행사하지 아니한 채 허위로 진술하였다면 위증죄가 성립된다고 할 것이다(대판 2012.10.11. 2012도6848).", "answer": "O"}, {"source": "16변시", "question": "증인신문에 관한 설명 중 옳은 것(o)과 옳지 않은 것(x)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "4세의 선서무능력자가 선서 후 한 증언은 증언능력 유무와 관계없이 증언 자체의 효력이 부정된다.", "explanation": "판례는 만 3 세 정도의 유아의 증언능력을 인정한다(대판 2005.09.30. 2005도4201). 선서무능력자에 대하여 선서하게 하고 신문한 경우라도 선서만이 무효가 되고 그 증언의 효력에 관하여는 영향이 없고 유효하다는 것이 판례의 입장이다(아래 4290형상23 참조) . 따라서 4세의 선서무능력자가 선서 후 증언한 경우 선서는 무효이지만, 증언 자체의 효력이 부정되지 아니한다.", "answer": "X"}, {"source": "21변시", "question": "공판절차에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인은 변호인이 있는 경우라도 공소제기된 사건에 관하여 검사가 증거로 신청할 피의자 신문조서의 열람·등사 또는 서면의 교부를 검사에게 신청할 수 있다.", "explanation": "형사소송법 제 266조의3(공소제기 후 검사가 보관하고 있는 서류 등의 열람·등사) 제1항  피고인 또는 변호인은 검사에게 공소제기된 사건에 관한 서류 또는 물건(이하 “서류등”이라 한다)의 목록과 공소사실의 인정 또는 양형에 영향을 미 칠 수 있는 다음 서류등의 열람 · 등사 또는 서면의 교부를 신청할 수 있다. 다만, 피고인에게 변호인이 있는 경우에는 피고인은 열람만을 신청할 수 있다.", "answer": "X"}, {"source": "21변시", "question": "공판절차에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인의 출석 없이도 공판준비기일을 개정할 수 있기 때문에 법원의 소환없이 공판준비기일에 출석한 피고인에게는 재판장은 진술거부권을 고지할 의무는 없다.", "explanation": "피고인의 출석 없이도 공판준비기일을 개정할 수 있지만, 재판장은 출석한 피고인에게 진술거부권 고지 의무가 있다. 형사소송법 제266조의8 제6항 참조.", "answer": "X"}, {"source": "21변시", "question": "공판절차에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변호인이 없는 피고인을 일시 퇴정케 하고 증인신문을 한 다음 피고인에게 실질적 인 반대신문의 기회를 부여하지 않았다면 다음 공판기일에서 재판장이 증인신문결과 등을 공판조서에 의하여 고지하여 피고인이 ‘변경할 점과 이의할 점이 없다’고 진술하더라도 실질적인 반대신문의 기회를 부여받지 못한 하자는 치유되지 않는다.", "explanation": "형사소송법 제297조에 따라 변호인이 없는 피고인을 일시 퇴정하게 하고 증인신문을 한 다음 피고인에게 실질적인 반대신문의 기회를 부여하지 아니한 채 이루어진 증인의 법정진술은 위법한 증거로서 증거능력이 없다고 볼 여지가 있으나 그 다음 공판기일에서 재판장이 증인신문 결과 등을 공판조서(증인신문조서)에 의하여 고지하였는데 피고인이 ‘변경할 점과 이의할 점이 없다’고 진술하여 책문권 포기 의사를 명시함으로써 실질적인 반대신문의 기회를 부여받지 못한 하자가 치유되었다고 한다(대판 2010.01.14. 2009도9344).", "answer": "X"}, {"source": "21변시", "question": "공판절차에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법률에 근거한 공개금지사유가 없음에도 불구하고 재판의 심리에 관한 공개를 금지하기로 한 공개금지결정은 피고인의 공개재판을 받을 권리를 침해한 것으로서 그 증인신문절차에서 이루어진 증인의 증언은 증거능력이 없으나, 만약 변호인의 반대신문권이 보장되었을 경우에는 이를 증거로 사용할 수 있다.", "explanation": "헌법 제27조 제3항 후문, 제109조와 법원조직법 제57조 제1항, 제2항의 취지에 비추어 보면, 헌법 제109 조, 법원조직법 제57조 제1항에서 정한 공개금지사유가 없음에도 불구하고 재판의 심리에 관한 공개를 금지하기로 결정하였다면 그러한 공개금지결정은 피고인의 공개재판을 받을 권리를 침해한 것으로서 그 절차에 의하여 이루어진 증인의 증언은 증거능력이 없고, 변호인의 반대신문권이 보장되었더라도 달리 볼 수 없으며, 이러한 법리는 공개금지결정의 선고가 없는 등으로 공개금지결정의 사유를 알 수 없는 경우에도 마찬가지이다(대판 2013.07.26. 2013도2511) .", "answer": "X"}, {"source": "21변시", "question": "공판절차에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 명시적으로 유죄를 자인하는 진술을 하지는 않았으나 공소장 기재사실을 인정하고 나아가 위법성이나 책임조각사유가 되는 사실을 진술하지 않은 경우는 「형사소송법」 제286조의2가 규정하는 간이공판절차의 결정의 요건인 공소사실의 자백에 해당한다.", "explanation": "형사소송법 제286조의2가 규정하는 간이공판절차의 결정의 요건인 공소사실의 자백이라 함은 공소장 기재사실을 인정하고 나아가 위법성이나 책임조각사유가 되는 사실을 진술하지 아니하는 것으로 충분하고 명시적으로 유죄를 자인하는 진술이 있어야 하는 것은 아니다(대판 1987.08.18. 87도1269).", "answer": "O"}, {"source": "20변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법원은 공소사실의 일부 철회 또는 변경으로 인하여 국민참여재판의 대상사건에 해당하지 아니하게 된 경우에도 국민참여재판을 계속 진행함이 원칙이다.", "explanation": "국민참여재판법 제6조(공소사실의 변경 등) 제1항 법원은 공소사실의 일부 철회 또는 변경으로 인하여 대상사건에 해당하지 아니하게 된 경우에도 이 법에 따른 재판을 계속 진행한다. 다만, 법원은 심리의 상황이나 그 밖의 사정을 고려하여 국민참여재판으로 진행하는 것이 적당하지 아니하다고 인정하는 때에는 결정으로 당해 사건을 지방법원 본원 합의부가 국민참여재판에 의하지 아니하고 심판하게 할 수 있다.", "answer": "O"}, {"source": "20변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "국민참여재판에 관하여 변호인이 없는 때에는 「형사소송법」 제33조 제1항 각호(구속, 미성년자, 70세 이상 등)의 어느 하나에 해당하는 경우가 아니더라도 법원은 직권으로 변호인을 선정하여야 한다.", "explanation": "국민참여재판에 관하여 변호인이 없는 때에는 법원은 직권으로 변호인을 선정하여야 한다(국민참여재판법 제7조). 또한 국민참여재판에서는 공판준비절차에서 반드시 공판준비기일을 지정하여야 하는데(국민참여재판법 제37조 제1항), 법원은 공판준비기일이 지정된 사건에 관하여 변호인이 없는 때에는 직권으로 변호인을 선정하여야 한다(형사소송법 제266조의8 제4항) . 따라서 국민참여재판의 대상사건은 모두 필요적 변호사건이 된다.", "answer": "O"}, {"source": "20변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "국민참여재판에서 배심원은 사실의 인정, 법령의 적용 및 형의 양정에 관한 의견을 제시할 권한은 있으나, 법원의 증거능력에 관한 심리에 관여할 수는 없다.", "explanation": "국민참여재판법 제12조(배심원의 권한과 의무) 제1항 배심원은 국민참여 재판을 하는 사건에 관하여 사실의 인정, 법령의 적용 및 형의 양정에 관한 의견을 제시할 권한이 있다.\n국민참여재판법 제44조(배심원의 증거능력 판단 배제) 배심원 또는 예비배심원은 법원의 증거능력에 관한 심리에 관여할수 없다.", "answer": "O"}, {"source": "20변시", "question": "국민참여재판에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심 법원이 국민참여재판 대상사건의 피고인에게 국민참여 재판을 원하는지 확인하지 아니한 채 통상의 공판절차에 따라 재판을 진행하였더라도 항소심 제1회 공판기일에 이에 대하여 이의가 없다는 피고인과 변호인의 진술만으로도 제1심의 공판절차상 하자가 치유되므로, 같은 날 변론을 종결한 후 다음 공판기일에 피고인의 항소를 기각하는 판결을 선고하더라도 이는 적법하다.", "explanation": "제1심법원이 국민참여재판 대상사건의 피고인에게 국민참여재판을 원하는지 확인하지 아니한 채 통상의 공판절차에 따라 재판을 진행하였는데, 원심법원이 제1회 공판기일에 피고인과 변호인이 이에 대하여 이의가 없다고 진술하자 같은 날 변론을 종결한 후 제2회 공판기일에 피고인의 항소를 기각하는 판결을 선고한 사안에서, 원심이 피고인에게 국민의 형사재판 참여에 관한 법률 제8조 제1항, 국민의 형사재판 참여에 관한 규칙 제3조 제1항에 준하여 사전에 국민참여재판절차 등에 관한 충분한 안내와 그 희망 여부에 관하여 숙고할 수 있는 상당한 시간을 부여함이 없이 단지 피고인과 변호인이 제 1 심에서 통상의 공판절차에 따라 재판을 받은 것에 대하여 이의가 없다고 진술한 사실만으로 제1심의 공판절차상 하자가 모두 치유되어 그에 따른 판결이 적법하게 된다고 볼 수 없는데도, 제1심의 공판절치장 하자가 원심에서 적법하게 치유되었음을 전제로 피고인의 항소를 기각한 원심판결에 법리오해의 위법이 있다(대판 2012.04.26. 2012도1225).", "answer": "X"}
