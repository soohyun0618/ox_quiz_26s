hoice": "④ 만약 乙에 대한 증인신문 당시 검사의 주신문에 대하여 乙이 적의 또는 반감을 보이지 않았음에도 검사가 유도신문을 한 경우 甲이 그 다음 공판기일에 위 증인신문조서에 대해  ‘변경할 점과 이의할 점이 없다’고 진술하였다면 유도신문에 의하여 이루어진 주신문의 하자가 치유된다. ", "explanation": "형사소송규칙 제75조 제2항은 주신문에 있어서는 증인이 주신문을 하는 자에 대하여 적의 또는 반감을 보이는 등 그 단서 각 호의 예외사유가 없는 한 유도신문을 하여서는 아니 된다고 규정하고 있다. 기록에 의하면, 공소외 5 등에 대한 제1심 증인신문 과정에서 검사가 주신문을 하면서 ‘당시 피고인1이 자신을 새마을운동중앙회(이하 생략)단장으로 소개하였지요’라는 등으로 희망하는 답변을 암시히는 형식의 질문을 하고 이에 공소외 5 등이 '예'라고 답변하는 등 형사소송규칙상 허용되지 않는 유도신문이 이루어진 것으로 볼 여지가 있다. 그러나 기록에 의하면, 제1심법원은 공소외 5 등에 대한 증인신문을 실시하고 각 공판조서(증인신문조서)를 작성한 다음 각 그 다음 공판기일에서 재판장이 증인신문 결과 등을 위 각 공판조서에 의하여 고지하였는데 피고인 1 및 그 변호인은 ‘변경할 점과 이의할 점이 없다’고 각 진술하였음을 알 수 있는바, 이와 같이 피고인 1 이 책문권 포기 의사를 명시함으로써 유도신문에 의하여 주신문이 이루어진 하자가 치유되었다고 할 수 있으므로, 이 부분 증언이 위법한 증거라고 볼 수는 없다.(대판 2012.07.26. 2012도2937).", "answer": "O"}, {"year": "2024", "num": "4", "source": "24변시", "question": "공무원 甲은 자신의 처 乙의 건축법위반 사실을 은폐할 목적으로 정산설계서를 확언하지 않았음에도 불구하고 “정산설계서에 의하여 준공검사를 하였다.\"라는 내용을 공문서인 준공검사조서에 기재하였다. 甲이 위 행위에 대하여 기소되고 乙이 증인으로 신청되자, 甲은 乙에게 위증을 교사하였으며，이에 乙은 허위 증언을 하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는  경우 판례에 의함)", "choice": "⑤ 만약 乙의 허위 증언에 대해 위증죄가 성립히는 경우, 甲에 대한 형사재판이 확정된 이후라도 乙이 위증 사실을 자수한 때에는 그 형을 감경 또는 면제한다.", "explanation": "재판이 확정된 이후에 위증 사실을 자수했다면 필요적 감면 대상에 해당하지 않는다.\n\n형법 제153조(자백, 자수) 전조의 죄를 범한 자가 그 공술한 사건의 재판 또는 징계처분이 확정되기 전에 자백 또는 자수한 때에는 그 형을 감경 또는 면제한다. ", "answer": "X"}, {"year": "2024", "num": "5", "source": "24변시", "question": "갑은 장애인인 모친 A와 거주하며 적법하게 장애인사용자동차표지(보호자용)를 발급받아 사용 하던 중, A와 주소지가 달라져 '장애인전용주차구역 주차표지가 있는 장애인사용자동차표지'가 실효되었음에도 이를 자신의 승용차에 그대로 비치한 채 아파트 주차장 내 장애인전용주차구역 이 아닌 장소에 승용차를 주차하였다가 적발되었다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "아파트입주민 B가 갑에 대한 정식재판에 증인으로 소환받고도 출산을 앞두고 있다는 이유로 출석하지 아니한 경우, 갑이 증거로 함에 부동의한 B에 대한 사법경찰관 작성 진술조서는 「형사소송법」 제314조에 의하여 증거능력이 인정될 수 없다.", "explanation": "공판기일에 증인으로 소환받고도 출산을 앞두고 있다는 이유로 출석하지 아니한 것은 특별한 사정이 없는 한 사망, 질병, 외국거주 기타 사유로 인하여 진술을 할 수 없는 때에 해당한다고 할 수 없어 형사소송법 제314조에 의한 증거능력이 있다고 할 수 없다(대판 1999.04.23. 99도915).", "answer": "O"}, {"year": "2024", "num": "6", "source": "24변시", "question": "건축허가권자 공무원 갑은 실무담당자 을의 방조 아래, 빌딩건축허가와 관련하여 건축업자 병으로부터 2,000만 원의 뇌물을 받았다. 이후 갑은 을에게 2,000만 원 중 200만 원을 사례금 으로 주었고, 400만 원은 건축허가에 필요한 비용으로 지출하였으며, 나머지 1,400만 원은 은행에 예금하였다. 병은 이후 빌딩건축허가가 반려되자 갑에게 공여한 뇌물 전액의 반환을 요구 하였다. 갑은 200만 원을 을에게 사례금으로 주었고, 400만 원을 비용으로 지출하였음을 이유로 예금하여 두었던 1,400만 원을 인출하여 위 돈만을 병에게 반환하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "병이 뇌물공여죄로 기소되어 유죄판결이 확정된 경우, 갑의 뇌물수수죄에 대한 공소시효는 병에 대한 위 형사사건이 기소된 때로부터 확정된 때까지 정지된다.", "explanation": "형사소송법 제248조 제1항, 제253조 제1항, 제2항에서 규정하는 바와 같이, 형사소송법은 공범 사이의 처벌에 형평을 기하기 위하여 공범 중 1인에 대한 공소의 제기로 다른 공범자에 대하여도 공소시효가 정지되도록 규정하고 있는데, 위 공범의 개념이나 유형에 관하여는 아무런 규정을 두고 있지 아니하다. ... 뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 자는 강학상으로는 필요적 공범이라고 불리고 있으나, 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 것이어서, 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며, 대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면, 형사소송법 제253조 제2항에서 말하는 '공범'에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다(대판 2015.02.12. 2012도4842).", "answer": "X"}, {"year": "2024", "num": "6", "source": "24변시", "question": "건축허가권자 공무원 갑은 실무담당자 을의 방조 아래, 빌딩건축허가와 관련하여 건축업자 병으로부터 2,000만 원의 뇌물을 받았다. 이후 갑은 을에게 2,000만 원 중 200만 원을 사례금 으로 주었고, 400만 원은 건축허가에 필요한 비용으로 지출하였으며, 나머지 1,400만 원은 은행에 예금하였다. 병은 이후 빌딩건축허가가 반려되자 갑에게 공여한 뇌물 전액의 반환을 요구 하였다. 갑은 200만 원을 을에게 사례금으로 주었고, 400만 원을 비용으로 지출하였음을 이유로 예금하여 두었던 1,400만 원을 인출하여 위 돈만을 병에게 반환하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "을이 뇌물수수방조죄의 처벌을 회피할 목적으로 미국으로 출국한 경우, 그 도피 기간 동안 공범인 갑의 뇌물수수죄에 대한 공소시효도 정지된다.", "explanation": "국외도피에는 공범특칙이 적용되지 않는다. 공범 중 1인의 국외도피는 다른 공범자에게 시효정지의 효력이 미치지 않는다. 즉, 공범 중 1인의 국외도피 기간 동안에도 다른 공범자에 대한 공소시효는 그대로 진행된다(이주원, 형사소송법』 (제5판), 293면).", "answer": "X"}, {"year": "2024", "num": "7", "source": "24변시", "question": "갑은 2023. 2. 12. 보이스피싱범 을에게 X은행에 자신의 명의로 개설한 예금계좌의 잔고가 없는 예금통장과 위 계좌에 연결된 체크카드 1개, OTP카드 1개를 그것이 사기범죄에 이용된다 는 것을 모른 채 100만 원에 매도하였다. 이후 을은 2023. 2. 13. A에게 전화하여 검사를 사칭하면서 '금융법률 전문가인 갑에게 송금하면 범죄 연관성을 확인 후 돌려주겠다'고 하였고, 이에 속은 A는 2023. 2. 14. 11:20경 위 계좌에 1,000만 원을 송금하였는데, 갑은 같은 날 11:50경 별도로 만들어 소지하고 있던 위 계좌에 연결된 체크카드를 이용하여 그중 300만 원 을 임의로 인출하였다. 이에 대해 검사는 갑이 사기피해금 중 300만 원을 임의로 인출함으로써 주위적으로는 을의 재물을, 예비적으로는 A의 재물을 횡령하였다는 사실로 공소를 제기하였다. 그런데 공소장 1쪽 뒷면에 간인 일부가 되어 있으나, 2쪽 앞면에는 나머지 간인이 되어 있지 않았고, 2쪽 뒷면부터 마지막 장까지 간인이 없었다. 이에 관한 설명 중 옳지 않은 것은? (다툼 이 있는 경우 판례에 의함)", "choice": "공소장에 검사의 간인이 없더라도 공소장의 형식과 내용이 연속된 것으로 일체성이 인정되고 동일한 검사가 작성하였다고 인정되는 한, 그 공소장을 효력이 없는 서류라고 할 수는 없다.", "explanation": "공소를 제기하려면 공소장을 관할법원에 제출하여야 한다(형사소송법 제254조 제1항). 공무원이 작성하는 서류에는 간인하거나 이에 준하는 조치를 하여야 한다(형사소송법 제57조 제2항). 여기서 '공무원 이 작성하는 서류'에는 검사가 작성하는 공소장이 포함된다. '간인'은 서류작성자의 간인으로서 1개의 서류가 여러 장으로 되어 있는 경우 그 서류의 각 장 사이에 겹쳐서 날인하는 것이다. 이는 서류 작성 후 그 서류의 일부가 누락되거나 교체되지 않았다는 사실을 담보하기 위한 것이다. 따라서 공소장에 검사의 간인이 없더라도 그 공소장의 형식과 내용이 연속된 것으로 일체성이 인정되고 동일한 검사가 작성하였다고 인정되는 한 그 공소장을 형사소송법 제57조 제2항에 위반되어 효력이 없는 서류라고 할 수 없다. 이러한 공소장 제출에 의한 공소제기는 그 절차가 법률의 규정에 위반하여 무효인 때(형사소송법 제327조 제2호)에 해당한다고 할 수 없다(대판 2021.12.30. 2019도16259).", "answer": "O"}, {"year": "2024", "num": "7", "source": "24변시", "question": "갑은 2023. 2. 12. 보이스피싱범 을에게 X은행에 자신의 명의로 개설한 예금계좌의 잔고가 없는 예금통장과 위 계좌에 연결된 체크카드 1개, OTP카드 1개를 그것이 사기범죄에 이용된다 는 것을 모른 채 100만 원에 매도하였다. 이후 을은 2023. 2. 13. A에게 전화하여 검사를 사칭하면서 '금융법률 전문가인 갑에게 송금하면 범죄 연관성을 확인 후 돌려주겠다'고 하였고, 이에 속은 A는 2023. 2. 14. 11:20경 위 계좌에 1,000만 원을 송금하였는데, 갑은 같은 날 11:50경 별도로 만들어 소지하고 있던 위 계좌에 연결된 체크카드를 이용하여 그중 300만 원 을 임의로 인출하였다. 이에 대해 검사는 갑이 사기피해금 중 300만 원을 임의로 인출함으로써 주위적으로는 을의 재물을, 예비적으로는 A의 재물을 횡령하였다는 사실로 공소를 제기하였다. 그런데 공소장 1쪽 뒷면에 간인 일부가 되어 있으나, 2쪽 앞면에는 나머지 간인이 되어 있지 않았고, 2쪽 뒷면부터 마지막 장까지 간인이 없었다. 이에 관한 설명 중 옳지 않은 것은? (다툼 이 있는 경우 판례에 의함)", "choice": "갑에 대한 항소심에서 공소사실 모두에 대하여 무죄판결이 선고되고 검사가 이에 대하여 상고를 한 경우, 상고심에서 예비적 공소사실 부분이 파기되어야 한다면 이에 따라 이와 동일체 관계에 있는 주위적 공소사실 부분도 함께 파기될 수밖에 없다.", "explanation": "원심이 이 사건 공소사실 중 횡령의 점에 관하여 보이스피싱 조직원을 피해자로 삼은 주위적 공소사실을 무죄로 판단한 것은 정당하다. 그러나 이와 달리 공소외인을 피해자로 삼은 예비적 공소사실도 무죄로 판단한 데에는 횡령죄에서의 위탁관계 등에 관한 법리를 오해한 위법이 있다. 이 점을 지적하는 상고 이유 주장은 이유 있다. ... 그러므로 원심판결 중 횡령의 점에 관한 예비적 공소사실 부분은 파기되어야 하고, 이에 따라 이와 동일체 관계에 있는 주위적 공소사실 부분도 함께 파기될 수밖에 없으므로, 원심판결 중 횡령 부분을 파기하고, 이 부분 사건을 다시 심리•판단하도록 원심법원에 환송하며, 검사의 나머지 상고를 기각하기로 하여 주문과 같이 판결한다(대판 2018.07.19. 2017도17494(전합)). -> 주문: 원심판결 중 횡령 부분을 파기하고, 이 부분 사건을 서울남부지방법원에 환송한다. 검사의 나머지 상고를 기각한다.", "answer": "O"}, {"year": "2024", "num": "8", "source": "24변시", "question": "갑은 2023. 1.경 도로에서 운전면허를 받지 아니하고 혈중알코올농도 0.15%의 술에 취한 상태에서 자동차를 운전하였다. 검사는 갑에 대하여 무면허운전의 점에 관하여만 도로교통법위반 (무면허운전)죄로 공소를 제기하였는데, 제1심 제1회 공판기일에 이르러 음주운전의 점에 관한 도로교통법위반(음주운전)죄를 추가하는 취지의 공소장변경허가신청서를 제출하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심법원이 공소장변경허가신청에 대한 결정을 공판정에서 고지한 경우, 그 사실은 공판조서의 필요적 기재사항이다.", "explanation": "법원은 검사의 공소장변경허가신청에 대해 결정의 형식으로 이를 허가 또는 불허가 하고, 법원의 허가 여부 결정은 공판정 외에서 별도의 결정서를 작성하여 고지하거나 공판정에서 구술로 하고 공판조서에 기재할 수도 있다. 만일 공소장변경허가 여부 결정을 공판정에서 고지하였다면 그 사실은 공판조서의 필요적 기재사항이다(형사소송법 제51조 제2항 제14호)(대판 2023.06.15. 2023도3038).", "answer": "O"}, {"year": "2024", "num": "8", "source": "24변시", "question": "갑은 2023. 1.경 도로에서 운전면허를 받지 아니하고 혈중알코올농도 0.15%의 술에 취한 상태에서 자동차를 운전하였다. 검사는 갑에 대하여 무면허운전의 점에 관하여만 도로교통법위반 (무면허운전)죄로 공소를 제기하였는데, 제1심 제1회 공판기일에 이르러 음주운전의 점에 관한 도로교통법위반(음주운전)죄를 추가하는 취지의 공소장변경허가신청서를 제출하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심법원이 공소장변경허가신청에 대하여 불허가 결정을 한 경우, 검사는 이에 불복하여 그 결정에 대한 즉시항고를 제기할 수 있다.", "explanation": "형사소송법 제403조", "answer": "X"}, {"year": "2023", "num": "1", "source": "23변시", "question": "다음 사실관계에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)\n\n(가) 甲은 2018. 5.경 저금리 대출을 해주겠다고 전화로 거짓말을 하여 금원을 편취하는 소위 보이스피싱 범죄단체에 가입한 후 실제로 위와 같이 보이스피싱 범행을 하였다. 乙은 2019. 7.경 甲으로부터 적법한 사업운영에 필요하니 은행계좌, 현금카드, 비밀번호 를 빌려달라는 부탁을 받고 甲이 이를 보이스피싱 범행에 사용할 것임을 알지 못한 채 乙명의의 은행계좌 등을 甲에게 건네주었다. A는 甲으로부터 보이스피싱 기망을 당해 乙 명의의 은행계좌에 1,000만 원을 입금하였다. 乙은 1,000만 원이 입금된 사실을 우연히 알게 되자 순간적으로 욕심이 나 이를 임의로 인출하여 사용하였다.\n\n(나) 이에 화가 난 甲은 乙에게 전화하여  「A가 입금한 1,000만 원을 돌려주지 않으면 죽여버린다」라고 말하였는데, 乙은 甲의 이러한 협박 발언을 녹음한 후, 자신의 동생 丙에게 \"내 계좌에 모르는 사람으로부터 1,000만 원이 입금되어 있기에 사용했는데, 이를 안 甲이 나에게 돌려주지 않으면 죽여버린다고 협박했다.\" 라는 내용의 문자메시지를 보냈다. 이후 A와 丙의 신고로 수사가 개시되어 甲이 기소되었고, 검사는 乙이 녹음한 녹음파일 중 甲의 협박 발언 부분 및 문자메시지를 촬영한 사진을 증거로 신청하였다.", "choice": "ㄷ. (나) 사실관계에서 검사의 입증취지가 甲이 위와 같이 협박한 사실인 경우, 乙이 녹음한 녹음파일 중 甲의 협박 발언 부분은 전문증거이다.", "explanation": "1) 피고인 또는 피고인 아닌 사람의 진술을 녹음한 녹음파일은 실질에 있어서 피고인 또는 피고인 아닌 사람이 작성한 진술서나 그 진술을 기재한 서류와 크게 다를 바 없어 그 녹음파일에 담긴 진술 내용의 진실성이 증명의 대상이 되는 때에는 전문법칙이 적용된다고 할 것이나, 녹음파일에 담긴 진술 내용의 진실성이 아닌 그와 같은 진술이 존재하는 것 자체가 증명의 대상이 되는 경우에는 전문법칙이 적용되지 아니한다(대판 2013.02.15. 2010도3504 등 참조). 나아가 어떤 진술을 범죄사실에 대한 직접증거로 사용할때에는 그 진술이 전문증거가 된다고 하더라도 그와 같은 진술을 하였다는 것 자체 또는 그 진술의 진실성과 관계없는 긴접사실에 대한 정황증거로 사용할 때에는 반드시 전문증거가 되는 것은 아니다 (대판 2000.02.25. 99도1252 등 참조). 원심은 위 녹음파일들(증거순번 I-839, 844~874)은 거기에 녹음된 진술 내용의 진실성을 증명하기 위해 제출된 것이 아니라 그러한 진술이 있었다는 사실 그 자체를 증명하기 위해 제출된 것으로 보고, 위 녹음파일들에 대해서는 전문법칙이 적용되지 아니한다고 판단하였다. 원심판결 이유를 위 법리와 기록에 비추어 살펴보면, 원심의 위와 같은 판단은 정당한 것으로 수긍할 수 있고, 거기에 상고이유 주장과 같이 전문법칙의 적용범위에 관한 법리를 오해하는 등의 위법이 없다 (대판 2015.01.22. 2014도10978(전합)).\n2) 형사소송법 제310조의2는 사실을 직접 경험한 사람의 진술이 법정에 직접 제출되어야 하고 이에 갈음하는 대체물인 진술 또는 서류가 제출되어서는 안 된디는 이른바 전문법칙을 선언한 것이다. 그런데 정보통신망을 통하여 공포심 이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소시질에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2에서 정한 전문법칙이 적용되지 않는다(대판 2008.11.13. 2006도2556). \n-> 갑의 협박 부분이 요증사실 자체이므로 전문증거가 아니다.\n-> 한편 공갈죄 피고사건에서 피고인의 공갈 발언에 대한 녹음파일을 다시 녹음하는 괴정을 반복하여 작성한 녹음파일 사본을 전문 증거로 보고 형사소송법 제313조 제1항 단서를 적용한 사례가 있는 바(대판 2012.09.13. 2012도7461 참조), 판례의 입장이 명확치 않은 것으로 보인다. 다만 현장녹음에 대한 비진술증거설 및 2014도10978 판례에 따라 ㄷ.은 틀린 지문으로 볼 것이다.", "answer": "X"}, {"year": "2023", "num": "1", "source": "23변시", "question": "다음 사실관계에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)\n\n(가) 甲은 2018. 5.경 저금리 대출을 해주겠다고 전화로 거짓말을 하여 금원을 편취하는 소위 보이스피싱 범죄단체에 가입한 후 실제로 위와 같이 보이스피싱 범행을 하였다. 乙은 2019. 7.경 甲으로부터 적법한 사업운영에 필요하니 은행계좌, 현금카드, 비밀번호 를 빌려달라는 부탁을 받고 甲이 이를 보이스피싱 범행에 사용할 것임을 알지 못한 채 乙명의의 은행계좌 등을 甲에게 건네주었다. A는 甲으로부터 보이스피싱 기망을 당해 乙 명의의 은행계좌에 1,000만 원을 입금하였다. 乙은 1,000만 원이 입금된 사실을 우연히 알게 되자 순간적으로 욕심이 나 이를 임의로 인출하여 사용하였다.\n\n(나) 이에 화가 난 甲은 乙에게 전화하여  「A가 입금한 1,000만 원을 돌려주지 않으면 죽여버린다」라고 말하였는데, 乙은 甲의 이러한 협박 발언을 녹음한 후, 자신의 동생 丙에게 \"내 계좌에 모르는 사람으로부터 1,000만 원이 입금되어 있기에 사용했는데, 이를 안 甲이 나에게 돌려주지 않으면 죽여버린다고 협박했다.\" 라는 내용의 문자메시지를 보냈다. 이후 A와 丙의 신고로 수사가 개시되어 甲이 기소되었고, 검사는 乙이 녹음한 녹음파일 중 甲의 협박 발언 부분 및 문자메시지를 촬영한 사진을 증거로 신청하였다.", "choice": "ㄹ. (나) 사실관계에서 검사의 입증취지가 甲이 위와 같이 협박한 사실인 경우, 문자메시지를 촬영한 사진은 전문증거이다.", "explanation": "피해자가 피고인으로부터 당한 공갈 등 피해 내용을 담아 남동생에게 보낸 문자메시지를 촬영한 사진은 형사소송법 제313조에 규정된 ‘피해자의 진술서’에 준하는 것인데, 제반 사정에 비추어 그 진정성립이 인정되어 증거로 할 수 있다고 한 사례(대판 2010.11.25. 2010도8735).", "answer": "O"}, {"year": "2023", "num": "2", "source": "23변시", "question": "다음 사실관계에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)\n● 甲과 乙은 소위 날치기 범행을 공모한 후 함께 차를 타고 범행 대상을 물색하던 중, 은행에서 나와 거리를 걷고 있는 A를 발견하였다. 甲은 하차 후 A의 뒤에서 접근하여 A 소유의 자기앞수표(액면금 1억 원) 총 5매가 들어있는 손가방의 끈을 갑자기 잡아당겼는데, A는 빼앗기지 않으려고 버티다가 바닥에 넘어진 상태로 약 5미터 가량을 끌려가다 힘이 빠져 손가방을 놓쳤다. 甲은 이를 틈타 A의 손가방을 들고, 현장에서 대기하고 있던 乙이 운전하는 차를 타고 도망갔다.\n● 그 뒤 甲은 본인 명의의 계좌를 새로 개설하여 위 자기앞수표 총 5매를 모두 입금하였다가, 며칠 뒤 다시 5억 원 전액을 현금으로 인출한 후, 甲과 따로 살고 있는 사촌 형 丙에게 위 사실관계를 모두 말해 주면서 위 현금 5억 원을 당분간 보관해 달라고 부탁하였다. 이에 동의한 丙은 그 돈을 건네받아 보관하던 중, A의 신고로 수사가 개시되었고 甲, 乙, 丙이 함께 기소되어 공동피고인으로 재판이 계속 중이다.", "choice": "ㅁ. 甲의 손가방 탈취 범행의 유죄 입증과 관련하여, 자백 취지의 乙에 대한 사법경찰관 작성 피의자신문조서에 대하여 甲이 법정에서 내용부인하더라도, 「형사소송법」 제314조에 의해서 증거능력을 인정할 수 있다.", "explanation": "검사 이외의 수사기관 작성의 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정되므로 그 당연한 결과로 그 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 전술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 형사소송법 제314조가 적용되지 아니한다(대판 2004.07.15. 2003도7185). - 형사소송법 개정 이후에는 검사 작성의 공에 대한 피의자신문조서에 대해서도 제314조가 적용되지 않는다고 보아야 한다.\n", "answer": "X"}, {"year": "2023", "num": "2", "source": "23변시", "question": "다음 사실관계에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)\n● 甲과 乙은 소위 날치기 범행을 공모한 후 함께 차를 타고 범행 대상을 물색하던 중, 은행에서 나와 거리를 걷고 있는 A를 발견하였다. 甲은 하차 후 A의 뒤에서 접근하여 A 소유의 자기앞수표(액면금 1억 원) 총 5매가 들어있는 손가방의 끈을 갑자기 잡아당겼는데, A는 빼앗기지 않으려고 버티다가 바닥에 넘어진 상태로 약 5미터 가량을 끌려가다 힘이 빠져 손가방을 놓쳤다. 甲은 이를 틈타 A의 손가방을 들고, 현장에서 대기하고 있던 乙이 운전하는 차를 타고 도망갔다.\n● 그 뒤 甲은 본인 명의의 계좌를 새로 개설하여 위 자기앞수표 총 5매를 모두 입금하였다가, 며칠 뒤 다시 5억 원 전액을 현금으로 인출한 후, 甲과 따로 살고 있는 사촌 형 丙에게 위 사실관계를 모두 말해 주면서 위 현금 5억 원을 당분간 보관해 달라고 부탁하였다. 이에 동의한 丙은 그 돈을 건네받아 보관하던 중, A의 신고로 수사가 개시되었고 甲, 乙, 丙이 함께 기소되어 공동피고인으로 재판이 계속 중이다.", "choice": "ㅂ. 甲의 손가방 탈취 범행의 유죄 입증과 관련하여, 甲과 丙은 서로의 범죄사실에 관하여는 증인의 지위에 있으므로 증인선서 없이 한 丙의 법정진술은 甲의 증거동의가 없는 한 증거능력이 없다.", "explanation": "피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로 선서없이 한 공동피고인의 법정진술이나 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자 신문조서는 피고인의 공소 범죄사실을 인정하는 증거로 할 수 없다 (대판 1982.09.14. 82도1000).", "answer": "O"}, {"year": "2023", "num": "3", "source": "23변시", "question": "X회사 대표이사 A는 X회사의 자금 3억 원을 횡령한 혐의로 구속·기소되었다. A의 변호인 甲은 구치소에서 의뢰인 A를 접견하면서 선처를 받기 위해서는 횡령금을 모두 X회사에 반환한 것으로 해야 하는데, 반환할 돈이 없으니 A의 지인 乙의 도움을 받아서 X회사 명의의 은행계좌로 돈을 입금한 후 이를 돌려받는 이른바 ‘돌려막기 방법’을 사용하자고 했다. 며칠 후 甲은 乙을 만나 이러한 방법을 설명하고 乙을 안심시키기 위해 민·형사상 아무런 문제가 되지 않는다는 내용의 법률의견서를 작성해 주었다. 이러한 甲과 乙의 모의에 따라 乙은 5차례에 걸쳐 X회사에 돈을 입금한 후 은행으로부터 받은 입금확인증 5장(반환금 합계 3억 원)을 甲에게 전달했다. 甲은 A의 제1심 재판부에 이를 제출하면서 횡령금 전액을 X회사에 반환하였으니 선처를 해달라는 취지의 변론요지서를 제출하였고, 보석허가신청도 하였다. 이에 대해 제1심 재판부는 A에 대해 보석허가결정을 하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)\n", "choice": "4. 甲이 乙에게 작성해 준 법률의견서는 「형사소송법」 제313조 제1항에 규정된 ‘피고인 아닌 자가 작성한 진술서나 그 진술을 기재한 서류’에 해당한다.", "explanation": "갑 주식회사 및 그 직원인 피고인들이 정비사업전문관리엽자의 임원에게 갑 회사가 주택재개발사업 시공사로 선정되게 해 달라는 청탁을 하면서 금원을 제공하였다고 하여 구 건설산업기본법 (2011. 5. 24. 법률 제10719호로 개정되기 전의 것) 위반으로 기소되었는데, 변호사가 법률지문 과정에 작성하여 갑 회사 측에 전송한 전자문서를 출력한 ‘법률의견서’에 대하여 피고인들이 증거로 함에 동의하지 아니하고, 변호사가 원심 공판기일에 증인으로 출석하였으나 증언할 내용이 갑 회사로부터 업무상 위탁을 받은 관계로 알게 된 타인의 비밀에 관한 것임을 소명한 후 증언을 거부한 사안에서 위 법률의견서는 압수된 디지털 저장매체로부터 출력한 문건으로서 실질에 있어서 형사소송법 제313조 제1항에 규정된 ‘피고인 아닌 자가 작성한 진술서나 그 진술을 기재한 서류’에 해당하는데 공판준비 또는 공판기일에서 작성자 또는 진술자인 변호사의 진술에 의하여 성립의 진정함이 증명되지 아니하였으므로 위 규정에 의하여 증거능력을 인정할 수 없고, 나아가 원심 공판기일에 출석한 변호사가 그 진정 성립 등에 관하여 진술하지 아니한 것은 형사소송법 제149조에서 정한 바에 따라 정당하게 증언거부권을 행사한 경우에 해당하므로 형사소송법 제314조에 의하여 증거능력을 인정할 수도 없다는 이유로, 원심이 이른바 변호인·의뢰인 특권에 근거하여 위 의견서의 증거능력을 부정한 것은 적절하다고 할 수 없으나, 위 의견서의 증거능력을 부정하고 나머지 증거들만으로 유죄를 인정하기 어렵다고 본 결론은 정당하다(대판 2012.05.17. 2009도6788(전합)).", "answer": "O"}, {"year": "2023", "num": "4", "source": "23변시", "question": "유흥주점의 지배인 甲은 피해자 A로부터 신용카드를 강취하고 신용카드 비밀번호를 알아냈다. 甲은 위 주점 직원 乙, 丙과 모의하면서, 자신은 주점에서 A를 붙잡아 두면서 감시하고, 乙과 丙은 위 신용카드를 이용하여 인근 편의점에 있는 현금자동지급기에서 300만 원의 예금을 인출하기로 하였다. 그에 따라 甲이 A를 감시하는 동안 乙과 丙은 위 편의점에 있는 현금자동지급기에 신용카드를 넣고 비밀번호를 입력하여 300만 원의 예금을 인출하였고, 이를 甲, 乙, 丙 각자 100만 원씩 분배하였다. 결국 甲, 乙, 丙은 특수(합동)절도죄로 공소제기되었는데, 甲은 법정에서 범행을 부인하였으나 甲의 공동피고인 乙과 丙은 법정에서 범행을 자백하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄷ. 공범인 공동피고인 乙, 丙의 법정에서의 자백은 소송절차를 분리하여 증인신문하는 절차를 거치지 않았더라도 甲에 대하여 증거능력이 인정된다.", "explanation": "공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있다(대판 1985.06.25. 85도691).", "answer": "O"}, {"year": "2023", "num": "4", "source": "23변시", "question": "유흥주점의 지배인 甲은 피해자 A로부터 신용카드를 강취하고 신용카드 비밀번호를 알아냈다. 甲은 위 주점 직원 乙, 丙과 모의하면서, 자신은 주점에서 A를 붙잡아 두면서 감시하고, 乙과 丙은 위 신용카드를 이용하여 인근 편의점에 있는 현금자동지급기에서 300만 원의 예금을 인출하기로 하였다. 그에 따라 甲이 A를 감시하는 동안 乙과 丙은 위 편의점에 있는 현금자동지급기에 신용카드를 넣고 비밀번호를 입력하여 300만 원의 예금을 인출하였고, 이를 甲, 乙, 丙 각자 100만 원씩 분배하였다. 결국 甲, 乙, 丙은 특수(합동)절도죄로 공소제기되었는데, 甲은 법정에서 범행을 부인하였으나 甲의 공동피고인 乙과 丙은 법정에서 범행을 자백하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 만약 위 사례에서 甲이 범행을 자백하였고, 甲이 범행을 자인하는 것을 들었다는 피고인 아닌 제3자의 진술이 있다면, 이는 「형사소송법」 제310조의 피고인 자백에는 포함되지 아니하므로 甲의 자백에 대한 보강증거가 될 수 있다.", "explanation": "피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 형사소송법 제310조의 피고인의 자백에는 포함되지 아니하나 이는 피고인의 자백의 보강증거로 될 수 없다(대판 1981.07.07. 81도1314).", "answer": "X"}, {"year": "2023", "num": "5", "source": "23변시", "question": "甲은 회식 자리에서 직원 A의 옆에 앉아 술을 마시며 대화하던 중 오른손으로 갑자기 A의 엉덩이 부위를 옷 위로 쓰다듬었다. 그 자리에 있던 동료 직원 B는 수사기관에 참고인으로 출석하여 “甲이 A의 엉덩이 부위를 쓰다듬어 A가 매우 놀라며 황급히 일어나 밖으로 나가는 것을 보았다\"라고 진술하였다. 결국 甲은 A를 위와 같이 강제추행하였다는 공소사실로 기소되었는데, A는 제2회 공판기일 법정에서 甲으로부터 위와 같이 강제추행을 당하였다고 증언하였고, 동료 직원 B는 같은 공판기일 법정에 출석하였으나 증언거부사유가 없음에도 증언을 거부하였으며, 다른 동료 직원 C는 같은 공판기일 법정에서 “이 사건 다음 날 A로부터 '甲에게 추행을 당했다'는 말을 들었다\"라고 증언하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄴ. B가 정당하게 증언거부권을 행사한 것이 아니라고 하더라도 甲이 증언거부 상황을 초래하였다는 등의 특별한 사정이 없다면 B의 증언거부는 「형사소송법」 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다.", "explanation": "수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인해 진술할 수 없는 때’에 해당하지 않는다고 보아야 한다. 따라서 증인이 정당하게 증언거부권을 행사하여 증언을 거부한 경우와 마찬가지로 수사기관에서 그 증인의 진술을 기재한 서류는 증거능력이 없다(대판 2019.11.21. 2018도13945(전합)).", "answer": "O"}, {"year": "2023", "num": "5", "source": "23변시", "question": "甲은 회식 자리에서 직원 A의 옆에 앉아 술을 마시며 대화하던 중 오른손으로 갑자기 A의 엉덩이 부위를 옷 위로 쓰다듬었다. 그 자리에 있던 동료 직원 B는 수사기관에 참고인으로 출석하여 “甲이 A의 엉덩이 부위를 쓰다듬어 A가 매우 놀라며 황급히 일어나 밖으로 나가는 것을 보았다\"라고 진술하였다. 결국 甲은 A를 위와 같이 강제추행하였다는 공소사실로 기소되었는데, A는 제2회 공판기일 법정에서 甲으로부터 위와 같이 강제추행을 당하였다고 증언하였고, 동료 직원 B는 같은 공판기일 법정에 출석하였으나 증언거부사유가 없음에도 증언을 거부하였으며, 다른 동료 직원 C는 같은 공판기일 법정에서 “이 사건 다음 날 A로부터 '甲에게 추행을 당했다'는 말을 들었다\"라고 증언하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄷ. 「형사소송법」 제297조(피고인등의 퇴정)의 규정에 따라 재판장은 증인 A가 피고인 甲의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 하고 증인 신문을 진행함으로써 피고인의 직접적인 증인 대면을 제한할 수 있지만, 이러한 경우 피고인의 반대신문권까지 배제하는 것은 허용될 수 없다.", "explanation": "형사소송법 제297조의 규정에 따라 재판장은 증인이 피고인의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 하고 증인신문을 진행함으로써 피고인의 직접적인 증인 대면을 제한할 수 있지만, 이러한 경우에도 피고인의 반대신문권을 배제하는 것은 허용되지 않는다(대판 2012.02. 23. 2011도15608).", "answer": "O"}, {"year": "2023", "num": "5", "source": "23변시", "question": "甲은 회식 자리에서 직원 A의 옆에 앉아 술을 마시며 대화하던 중 오른손으로 갑자기 A의 엉덩이 부위를 옷 위로 쓰다듬었다. 그 자리에 있던 동료 직원 B는 수사기관에 참고인으로 출석하여 “甲이 A의 엉덩이 부위를 쓰다듬어 A가 매우 놀라며 황급히 일어나 밖으로 나가는 것을 보았다\"라고 진술하였다. 결국 甲은 A를 위와 같이 강제추행하였다는 공소사실로 기소되었는데, A는 제2회 공판기일 법정에서 甲으로부터 위와 같이 강제추행을 당하였다고 증언하였고, 동료 직원 B는 같은 공판기일 법정에 출석하였으나 증언거부사유가 없음에도 증언을 거부하였으며, 다른 동료 직원 C는 같은 공판기일 법정에서 “이 사건 다음 날 A로부터 '甲에게 추행을 당했다'는 말을 들었다\"라고 증언하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. C가 법정에서 한 증언은 원진술자인 A가 법정에 증인으로 출석하였으므로 「형사소송법」 제316조 제2항의 요건이 충족되지 않아 피고인 甲의 증거동의가 없는 이상 증거능력이 없다.", "explanation": "다른 사람의 진술을 내용으로 하는 진술이 전문증거인지는 요증사실이 무엇인지에 따라 정해진다. 다른 사람의 진술, 즉 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이지만, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다. 어떤 진술 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 되지만, 그와 같은 진술을 하였다는 것 자체 또는 진술의 진실성과 관계없는 간접사실에 대한 정황증거로 사용될 때는 반드시 전문증거가 되는 것이 아니다. 그러나 어떠한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 진술의 증거능력을 인정한 다음 그 사실을 다시 진술 내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우에 그 진술은 전문증거에 해당한다. 그 진술에 포함된 원진술의 내용인 사실을 증명하는 데 사용되어 원진술의 내용인 사실이 요증사실이 되기 때문이다. 이러한 경우 형사소송법 제311조부터 제316조까지 정한 요건을 충족하지 못한다면 증거능력이 없다. 원심의 이 부분 판단은. 피해자가 공소외인에게 ‘피고인이 추행했다.’는 진술을 하였다는 것 자체에 대한 증거로 사용된다는 이유로 증거능력을 인정한 것이나, 원심은 위와 같이 판단한 다음 공소외인의 위 진술이 피해자의 진술에 부합한다고 보아 공소외인의 위 진술을 피해자의 진술 내용의 진실성을 증명하는 간접사실로 사용하였다. 따라서 위 공소외인의 진술은 전문증거에 해당하고, 형사소송법 제310조의2, 제316조 제2항의 요건을 갖추지 못하므로 증거능력이 없다(대판 2021.02.25. 2020도17109).", "answer": "O"}, {"year": "2023", "num": "6", "source": "23변시", "question": "甲은 자신의 소유 부동산에 근저당권설정등기를 해 주고 A로부터 돈을 빌렸다. 그 후 甲은 사업자금이 더 필요해지자 A에게 근저당권설정등기를 해 주기 1주일 전에 인터넷을 통하여 열람·출력한 등기사항전부증명서 하단의 열람 일시 부분을 수정 테이프로 지우고 복사한 것을 B에게 보여 주면서 \"사업자금으로 한 달만 1억원을 빌려달라. 만일 한 달 후 돈을 갚지 못하면 내가 소유하고 있는 부동산에 근저당권을 설정해 주겠다.\"라고 말했다. 이에 속은 B는 해당 부동산에 충분한 담보가치가 있는 것으로 믿고 甲에게 1억원을 빌려 주었다. 그러나 B는 변제기일까지 차용금을 변제받지 못하고 A의 선순위근저당권으로 인해 甲소유 부동산은 담보가치가 거의 없다는 사실을 알게 되자 甲을 고소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 만일 제1심 재판부가 甲에게 사기죄, 공문서변조 및 동행사죄에 대해 유죄를 인정하여 징역 1년을 선고하자 甲만 항소한 경우에 항소심이 甲에 대하여 제1심이 유죄로 인정한 공문서변조 및 동행사의 범죄사실을 무죄로 인정하면서 제1심과 동일한 징역 1년을 선고하였다면 이는 「형사소송법」제368조 소정의 불이익변경금지 원칙에 위배된다. ", "explanation": " '불이익변경의 금지'에 관한 형사소송법 제368조에서 피고인이 항소한 사건과 피고인을 위하여 항소한 사건에 대하여는 원심판결의 형보다 중한 형을 선고하지 못한다고 규정하고 있고, 위 법률조항은 형사소송법 제399조에 의하여 상고심에도 준용된다. 이러한 불이익변경금지 원칙은, 상소심에서 원심판결의 형보다 중한 형을 선고받을 수 있다는 우려로 말미암아 피고인의 상소권 행사가 위축되는 것을 막기 위한 정책적 고려의 결과로 입법자가 채택하였다. 위 법률조항의 문언이 '원심판결의 형보다 중한 형'으로의 변경만을 금지하고 있을 뿐이고, 상소심은 원심법원이 형을 정함에 있어서 전제로 삼았던 사정이나 견해에 반드시 구속되는 것은 아닌 점 등에 비추어 보면, 피고인만이 상소한 사건에서 상소심이 원심법원이 인정한 범죄사실의 일부를 무죄로 인정하면서도 피고인에 대하여 원심법원과 동일한 형을 선고하였다고 하여 그것이 불이익변경금지 원칙을 위반하였다고 볼 수 없다.(대판 2021.05.06. 2021도1282)", "answer": "X"}, {"year": "2023", "num": "8", "source": "23변시", "question": "甲은 술에 취한 상태로 조수석에 이혼한 전처 乙을 태우고 빌린 승용차를 캠핑장에 주차하던 중 엑셀을 브레이크로 착각하고 세게 밟아 바위에 충돌하여 위 승용차 차량 뒷 범퍼가 파손되었다. 신고로 출동한 사법경찰관은 甲이 술에 취하여 운전하였다고 판단하고 甲에게 음주측정을 요구하였으나 甲은 거부하였다. 검사는 甲을 도로교통법위반(음주측정거부)죄 및 업무상과실재물손괴로 인한 도로교통법위반죄로 기소하였다. 乙은 위 사건의 제2회 공판기일에 증인으로 출석하여 증언거부권을 고지받고 선서한 후 甲이 아니라 자신이 운전을 하였다고 증언하였고, 증인신문절차가 그대로 종료되었다. 한편, 검사는 공소제기 후 법원 영장전담판사(수소법원 이외의 지방법원 판사)로부터 위 차량에 대한 압수·수색영장을 발부받아 차량 블랙박스 메모리칩을 압수한 결과 甲이 위 사건 당시 운전하는 장면을 발견하고 위 영상을 CD에 저장하여 추가 증거로 제출하였다. 이후 검사는 乙을 위증죄의 피의자로 소환하여 제2회 공판기일의 증언을 번복시켜 '운전자가 甲이 맞고 제2회 공판기일 당시 위증을 하였다'는 자백을 받아 이를 피의자신문조서에 기재하였다. 법원은 검사의 신청에 따라 乙을 다시 증인으로 채택하였고, 제5회 공판기일에 증인으로 출석한 乙은 위 피의자신문조서의 진정성립을 인정하는 동시에 운전자가 甲이 맞다는 취지로 진술하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "② 만일 증인소환장을 송달받은 乙이 정당한 시유 없이 증인으로 출석하지 아니한 때에는 법원은 결정으로 당해 불출석으로 인한 소송비용을 증인이 부담하도록 명하고 500 만 원 이하의 과태료를 부과할 수 있으며 乙은 이러한 결정에 대해 즉시항고를 할 수 있다. ", "explanation": "형사소송법 제151조 참조 \n형사소송법 제151조(증인이 출석하지 아니한 경우의 과태료 등) \n①법원은 소환장을 송달받은 증인이 정당한 사유 없이 출석하지 아니한 때에는 결정으로 당해 불출석으로 인한 소송비용을 증인이 부담하도록 명하고, 500만원 이하의 과태료를 부과할 수 있다. 제153조에 따라 준용되는 제76조제2항ㆍ제5항에 따라 소환장의 송달과 동일한 효력이 있는 경우에도 또한 같다.\n⑧제1항과 제2항의 결정에 대하여는 즉시항고를 할 수 있다. 이 경우 제410조는 적용하지 아니한다.\n\n", "answer": "O"}, {"year": "2023", "num": "8", "source": "23변시", "question": "甲은 술에 취한 상태로 조수석에 이혼한 전처 乙을 태우고 빌린 승용차를 캠핑장에 주차하던 중 엑셀을 브레이크로 착각하고 세게 밟아 바위에 충돌하여 위 승용차 차량 뒷 범퍼가 파손되었다. 신고로 출동한 사법경찰관은 甲이 술에 취하여 운전하였다고 판단하고 甲에게 음주측정을 요구하였으나 甲은 거부하였다. 검사는 甲을 도로교통법위반(음주측정거부)죄 및 업무상과실재물손괴로 인한 도로교통법위반죄로 기소하였다. 乙은 위 사건의 제2회 공판기일에 증인으로 출석하여 증언거부권을 고지받고 선서한 후 甲이 아니라 자신이 운전을 하였다고 증언하였고, 증인신문절차가 그대로 종료되었다. 한편, 검사는 공소제기 후 법원 영장전담판사(수소법원 이외의 지방법원 판사)로부터 위 차량에 대한 압수·수색영장을 발부받아 차량 블랙박스 메모리칩을 압수한 결과 甲이 위 사건 당시 운전하는 장면을 발견하고 위 영상을 CD에 저장하여 추가 증거로 제출하였다. 이후 검사는 乙을 위증죄의 피의자로 소환하여 제2회 공판기일의 증언을 번복시켜 '운전자가 甲이 맞고 제2회 공판기일 당시 위증을 하였다'는 자백을 받아 이를 피의자신문조서에 기재하였다. 법원은 검사의 신청에 따라 乙을 다시 증인으로 채택하였고, 제5회 공판기일에 증인으로 출석한 乙은 위 피의자신문조서의 진정성립을 인정하는 동시에 운전자가 甲이 맞다는 취지로 진술하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 검사가 乙에 대하여 작성한 피의자신문조서는 당해 사건의 피고인이 아닌 사람의 진술을 기재한 서류로서 「형사소송법」 제312조 제4항에 따라 원진술자에 의한 진정성립이 인정되었으므로 甲의 증거동의가 없더라도 당해 사건에 대해 증거능력이 인정된다. ", "explanation": "공판준비 또는 공판기일에서 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서를 유죄의 증거로 삼는 것은 당사자주의· 공판중심주의·직접주의를 지향하는 현행 형사소송법의 소송구조에 어긋나는 것일 뿐만 아니라, 헌법 제27조가 보장하는 기본권, 즉 법관의 면전에서 모든 증거자료가 조사·진술되고 이에 대하여 피고인이 공격·방어할 수 있는 기회가 실질적으로 부여되는 재판을 받을 권리를 침해하는 것이므로 이러한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 아니하는 한 증거능력이 없고, 그 후 원진술자인 종전 증인이 다시 법정에 출석하여 증언을 하면서 그 진술조서의 성립의 진정함을 인정하고 피고인 측에 반대신문의 기회가 부여되었다고 하더라도 그 증언 자체를 유죄의 증거로 할 수 있음은 별론으로 하고 위와 같은 진술조서의 증거능력이 없다는 결론은 달리할 것이 아니다. 이는 검사가 공판준비 또는 공판기일에서 이미 증언을 마친 증인에게 수사기관에 출석할 것을 요구하여 그 증인을 상대로 위증의 혐의를 조사한 내용을 담은 피의자신문조서의 경우도 마찬가지이다. (대판 2013.08.14. 2012도13665) . \n", "answer": "X"}, {"year": "2023", "num": "9", "source": "23변시", "question": "건설업을 하는 甲은 시청 건설 담당 공무원인 Z에게 자신의 회사를 신청사 공사의 시공사로 선정해 줄 것을 부탁하면서 현금 1천만 원을 건네주었으나 다른 회사가 시공사로 선정되었다. 이에 甲은 乙에게 전화를 걸어 뇌물로 준 1천만 원을 돌려줄 것을 요구했으나 乙은 이미 주식투자로 소비하어 이를 거부하였다. 그런데 甲은 乙과 전화로 나눈 대화를 휴대전화로 몰래 녹음하였고, 여기에는 뇌물을 받은 사실을 인정하는 乙의 진술이 포함되었다. 이후 甲은 乙의 집을 찾아가 뇌물로 준 1천만 원을 당장 돌려주지 않으면 녹음한 내용을 수사기관과 언론사에 보내겠다고 말하였다. 이에 겁을 먹은 乙은 甲이 지정한 은행 예금계좌로 1천만 원을 입금하였다. 乙의 배우자 丙은 乙의 사전 언급에 따라 甲과 乙의 대화 내용을 옆방에서 자신의 휴대전화로 甲 모르게 녹음하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "③ 甲이 乙과의 전화상 대화를 휴대전화로 몰래 녹음한 것은「통신비밀보호법상」 비밀녹음에 \n해당하여 甲의 뇌물공여죄나 乙의 뇌물수수죄에 대한 유죄의 증거로 사용할 수 없다. ", "explanation": "통신비밀보호법 제2조 7호는 “감청”이라 함은 전기통신에 대하여 당사자의 동의 없이 전자장치·기계장치 등을 사용하여 통신의 음향 문언·부호·영상을 청취·공독하여 그 내용을 지득 또는 채록하거나 전기통신의 송·수신을 방해하는 것을 말한다고 규정하고 있다. 같은 법 제3조 제1항은 누구든지 이 법과 형사소송법 또는 군사법원법의 규정에 의하지 아니하고는 전기통신의 감청을 하지 못한다고 규정하고, 제4조는 제3조의 규정에 위반하여 불법감청에 의하여 지득 또는 채록된 전기통신의 내용은 재판 또는 징계절차에서 증거로 사용할 수 없다고 규정하고 있다. 이에 따르면 전기통신의 감청은 제3자가 전기통신의 당사자인 송신인과 수신인의 동의를 받지 아니하고 전기통신 내용을 녹음하는 등의 행위를 하는 것만을 말한다고 해석함이 타당하므로, 전기통신에 해당하는 전화통화 당사자의 일방이 상대 법 제318조의2의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요한 것이고, 한편 증거신청의 방식에 관하여 규정한 형사소송규칙 제132 조 1항의 취지에 비추어 보면 탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입증취지 등을 미리 구체적으로 명시하여야 할 것이므로, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다. [2] 피고인이 내용을 부인하여 증거능력이 없는 사법경찰리 작성의 피의자신문조서에 대하여 비록 당초 증거제출 당시 탄핵증거라는 입증취지를 명시하지 아니하였지만 피고인의 법정 진술에 대한 탄핵 증거로서의 증거조사절차가 대부분 이루어졌다고 볼 수 있는 점 등의 사정에 비추어 위 피의자신문조서를 피고인의 법정 진술에 대한 탄핵증거로 사용할 수 있다고 한 사례(대판 2005.08.19. 2005도2617) . \n", "answer": "O"}, {"year": "2022", "num": "1", "source": "22변시", "question": "甲과 Z은 카드 뒷면에 형광물질로 표시를 하여 특수한 콘택트렌즈를 끼면 상대의 패를 볼 수 있는 특수카드를 이용하여 사기도박을 하기로 공모하고 피해자 A와 B를 도박장소에 유인하여 처음 40분 동안은 정상적인 도박을 하다가 몰래 특수카드로 바꾼 다음 피해자들의 패를 보면서 도박을 하여 피해자들로부터 각 1,000만 원을 편취하였다. 甲과 Z은 위 범행으로 기소되어 공동피고인으로 재판을 받게 되었다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄷ. 甲이 제1심 법정에서 ‘을과 함께 사기도박범행을 저지른 것이 맞다’고 자백하였다면, 위 자백은 을의 반대신문권이 보장되어 있어 독립한 증거능력이 있다.", "explanation": "공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있고, 이는 피고인들 간에 이해관계가 상반된다고 하여도 마찬가지라 할 것이므로, 이 점에 관한 상고이유의 주장도 받아들일 수 없다(대판 2006.05.11. 2006도1944).", "answer": "O"}, {"year": "2022", "num": "1", "source": "22변시", "question": "甲과 Z은 카드 뒷면에 형광물질로 표시를 하여 특수한 콘택트렌즈를 끼면 상대의 패를 볼 수 있는 특수카드를 이용하여 사기도박을 하기로 공모하고 피해자 A와 B를 도박장소에 유인하여 처음 40분 동안은 정상적인 도박을 하다가 몰래 특수카드로 바꾼 다음 피해자들의 패를 보면서 도박을 하여 피해자들로부터 각 1,000만 원을 편취하였다. 甲과 Z은 위 범행으로 기소되어 공동피고인으로 재판을 받게 되었다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 검찰에서 B에 대한 참고인 진술조서가 작성되고 B가 제1심 법정에 증인으로 출석하여 정당한 사유 없이 증언을 거부하였다면 위 진술조서는 특별한 사정이 없는 한 「형사소 송법」 제314조에 따라 증거능력이 있다.", "explanation": "수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다고 보아야 한다. 따라서 증인이 정당하게 증언거부권을 행사하여 증언을 거부한 경우와 마찬가지로 수사기관에서 그 증인의 진술을 기재한 서류는 증거능력이 없다. 다만 피고인이 증인의 증언 거부 상황을 초래하였디는 등의 특별한 사정이 있는 경우에는 형사소송법 저11314조의 적용을 배제할 이유가 없다. 이러한 경우까지 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다고 보면 사건의 실체에 대한 심증 형성은 법관의 면전에서 본래증거에 대한 반대신문이 보장된 증거조사를 통하여 이루어져야 한다는 실질적 직접심리주의와 전문법칙에 대하여 예외를 정한 형사소송법 제314조의 취지에 반하고 정의의 관념에도 맞지 않기 때문이다(대판 2019.11.2l. 2018도 13945(전합) ). \n위와 같은 현행 형사소송법 제314조의 문언과 개정 취지 증언거부권 관련 규정의 내용 등에 비추어 보면,법정에 출석한 증인이 형사소송법 제148조, 제149조 등에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우는 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 아니한다(대판 2012.05.17. 2009도6788(전합)) . ", "answer": "X"}, {"year": "2022", "num": "2", "source": "22변시", "question": "甲은 자동차를 운전하고 가다가 A가 바로 앞에서 리어카를 천천히 끌고 가기에 A를 향해 경적을 울렸다. 이에 A가 욕설을 하며 소리를 치자 甲은 화가 나 A에게 겁을 주려고 폭행의 고의로 A를 추월했다가 A 앞에서 급정거하였다. 그런데 뜻하지 않게 A는 이를 피하는 과정에서 넘어져 상해를 입었다. 그 후 甲은 자신의 행위가 발각될 것을 염려하여 과음을 하는 바람에 정상적인 운전을 할 수 없는 상황에 이르게 되었다. 이러한 상태에서 甲은 졸음운전을 하다 신호를 위반하여 행인 B를 치어 전치 2주의 상해를 입힌 후 가로수를 들이 받아 정신을 잃은 상태에서 인근 병원 응급실로 이송되었다. 이에 관한 설명 중 옳지 앓은것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲은 도로교통법위반(음주운전)죄로 유죄판결이 확정되었는데 그 후 술에 취한 상태에서 B를 차로 치어 상해를 입힌 사실이 밝혀져서 특정범죄가중처벌등에관한법률위반(위험운전 치상)죄로 기소되었다면 이에 대해서는 유죄판결을 선고하여야 한다.", "explanation": "형법 제37조 및 제39조 제1항 참조.\n제37조 (경합범)판결이 확정되지 아니한 수개의 죄 또는 금고 이상의 형에 처한 판결이 확정된 죄와 그 판결확정 전에 범한 죄를 경합범으로 한다. \n제39조 (판결을 받지 아니한 경합범, 수개의 판결과 경합범, 형의 집행과 경합범) ①경합범중 판결을 받지 아니한 죄가 있는 때에는 그 죄와 판결이 확정된 죄를 동시에 판결할 경우와 형평을 고려하여 그 죄에 대하여 형을 선고한다. 이 경우 그 형을 감경 또는 면제할 수 있다.  <개정 2005. 7. 29.>", "answer": "O"}, {"year": "2022", "num": "2", "source": "22변시", "question": "甲은 자동차를 운전하고 가다가 A가 바로 앞에서 리어카를 천천히 끌고 가기에 A를 향해 경적을 울렸다. 이에 A가 욕설을 하며 소리를 치자 甲은 화가 나 A에게 겁을 주려고 폭행의 고의로 A를 추월했다가 A 앞에서 급정거하였다. 그런데 뜻하지 않게 A는 이를 피하는 과정에서 넘어져 상해를 입었다. 그 후 甲은 자신의 행위가 발각될 것을 염려하여 과음을 하는 바람에 정상적인 운전을 할 수 없는 상황에 이르게 되었다. 이러한 상태에서 甲은 졸음운전을 하다 신호를 위반하여 행인 B를 치어 전치 2주의 상해를 입힌 후 가로수를 들이 받아 정신을 잃은 상태에서 인근 병원 응급실로 이송되었다. 이에 관한 설명 중 옳지 앓은것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관 P는 응급실로 가서 담당의사로 하여금 甲의 혈액을 채취하게 한 후 혈중알콜농도에 관한 감정의뢰회보를 확보하였으나 사후압수영장은 발부받지 못한 경우 감정의뢰회보의 증거능력은 부정된다.", "explanation": "형사소송법 제215조 제2항은 “사법경찰관이 범죄수사에 필요한 때에는 검사에게 신청하여 검사의 청구로 지방법원판사가 발부한 영장에 의하여 압수, 수색 또는 검증을 할 수 있다\"고 규정하고, 형사소송법 제216조 제3항은 범행 중 또는 범행 직후의 범죄장소에서 긴급을 요하여 법원판사의 영장을 받을 수 없는 때에는 압수·수색·검증을 할 수 있으나 이 경우에는 사후에 지체없이 영장을 받아야 한다고 규정하고 있으며, 한편 검사 또는 사법경찰관으로부터 감정을 위촉받은 감정인은 감정에 관하여 필요한 때에는 검사의 청구에 의해 판사로부터 감정처분허가장을 발부받아 신체의 검사 등 형사소송법 제173조 제1항에 규정된 처분을 할 수 있도록 규정되어 있는바(형사소송법 제221조, 제221조의4, 제173조 제1항) , 위와 같은 형사소송법 규정에 위반하여 수사기관이 법원으로부터 영장 또는 감정처분허가장을 발부받지 아니한 채 피의자의 동의 없이 피의자의 신체로부터 혈액을 채취하고 더구나 사후적으로도 지체없이 이에 대한 영장을 발부받지 아니하고서 위와 같이 강제 채혈한 피의자의 혈액 중 알코올농도에 관한 감정이 이루어졌다면, 이러한 감정결과보고서 등은 형사소송법상 영장주의 원칙을 위반하여 수집하거나 그에 기초한 증거로서 그 절차 위반행위가 적법절차의 실질적인 내용을 침해히는 정도에 해당한다고 할 것이므로, 피고인이나 변호인의 증거동의 여부를 불문하고 이 사건 범죄사실을 유죄로 인정하는 증거로 사용할 수 없다고 보아야 한다(대판 2011.05.13. 2009도10871).", "answer": "O"}, {"year": "2022", "num": "3", "source": "22변시", "question": "甲은 주점에서 여주인 A와 함께 술을 마시다가 단 둘만 남게 되자 A를 폭행·협박하여 반항을 억압한 상태에서 강간행위 실행 도중 범행현장에 있던 A 소유의 핸드백을 빼앗고 그 자리에서 강간행위를 계속한 후 핸드백을 가지고 도주하였다. A의 신고를 받고 현장에 출동한 사법경찰관 P는 테이블 위에 놓여 있던 A 소유의 맥주컵에서 甲의 지문 8점을 현장에서 직접 채취한 후, 해당 맥주컵을 압수하였다. 검사는 甲이 범행 직후 “내가 주점 여주인 A를 강간했다\"라고 말하는 것을 들었다는 甲의 친구 B를 참고인으로 불러 조사한 후 위 범죄사실과 관련하여 甲을 기소하면서 맥주컵에서 채취한 지문과 B에 대한 참고인진술조서 등을 증거로 제출하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄴ. 위 맥주컵에 대한 P의 압수가 적법절차에 위반된 경우 해당 맥주컵에서 채취한 甲의 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하여 원칙적으로 증거능력이 없다. ", "explanation": "범행 현징에서 지문채취 대상물에 대한 지문채취가 먼저 이루어진 이상, 수사기관이 그 이후에 지문 채취 대상물을 적법한 절차에 의하지 아니한 채 압수하였다고 하더라도 (한편,이 사건 지문채취 대상물인 맥주컵, 물컵, 맥주병 등은 피해자 공소외 1이 운영하는 주점 내에 있던 피해자 공소외 1의 소유로서 이를 수거한 행위가 피해자 공소외 1의 의사에 반한 것이라고 볼 수 없으므로, 이를 가리켜 위법한 압수라고 보기도 어렵다) 위와 같이 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 아니함이 분명하여 이를 가리켜 위법수집증거라고 할 수 없으므로, 원심이 이를 증거로 채택한 것이 위법하다고 할 수 없다(대판 2008.10.23. 2008도7471). ", "answer": "X"}, {"year": "2022", "num": "3", "source": "22변시", "question": "甲은 주점에서 여주인 A와 함께 술을 마시다가 단 둘만 남게 되자 A를 폭행·협박하여 반항을 억압한 상태에서 강간행위 실행 도중 범행현장에 있던 A 소유의 핸드백을 빼앗고 그 자리에서 강간행위를 계속한 후 핸드백을 가지고 도주하였다. A의 신고를 받고 현장에 출동한 사법경찰관 P는 테이블 위에 놓여 있던 A 소유의 맥주컵에서 甲의 지문 8점을 현장에서 직접 채취한 후, 해당 맥주컵을 압수하였다. 검사는 甲이 범행 직후 “내가 주점 여주인 A를 강간했다\"라고 말하는 것을 들었다는 甲의 친구 B를 참고인으로 불러 조사한 후 위 범죄사실과 관련하여 甲을 기소하면서 맥주컵에서 채취한 지문과 B에 대한 참고인진술조서 등을 증거로 제출하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄷ. 제1회 공판기일에 증인으로 출석한 B가 검사 앞에서의 진술과 달리 범행직후 甲이 자신에게 “내가 주점 여주인 A를 강간했다\"라고 말했는지 정확히 기억이 나질 않는다고 증언하자, 검사가 B를 다시 소환하여 추궁한 후 증언내용을 번복하는 진술조서를 작성하여 이를 증거로 제출하고 그 후 공판기일에 B가 다시 법정에 출석하여 그 진술조서의 성립의 진정함을 인정하고 피고인 측에 반대신문의 기회가 부여된 경우, 그 진술조서의 증거능력은 인정된다. ", "explanation": "공판준비 또는 공판기일에서 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 그 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서를 유죄의 증거로 삼는 것은 당사자주의·공판중심주의·직접주의를 지향하는 현행 형사소송법의 소송구조에 어긋니는 것일 뿐만 아니라,헌법 제27조가 보장하는 기본권 즉 볍관의 면전에서 모든 증거자토깐 조사·진술되고 이에 대하여 피고인이 공격·벙어할 수 있는 기회가 실질적으로 부여되는 재판을 받을 권리를 침해하는 것이므로, 이러한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 아니하는 한 그 증거능력이 없다고 하여야 할 것이고, 그 후 원진술자인 종전 증인이 다시 법정에 출석하여 증언을 하면서 그 진술조서의 성립의 진정함을 인정하고 피고인측에 반대신문의 기회가 부여되었다고 하더라도 그 증언 자체를 유죄의 증거로 할 수 있음은 별론으로 하고 위와 같은 진술조서의 증거능력이 없다는 결론은 달리할 것이 아니다(대판 2000.06.15. 99도1108).", "answer": "X"}, {"year": "2022", "num": "3", "source": "22변시", "question": "甲은 주점에서 여주인 A와 함께 술을 마시다가 단 둘만 남게 되자 A를 폭행·협박하여 반항을 억압한 상태에서 강간행위 실행 도중 범행현장에 있던 A 소유의 핸드백을 빼앗고 그 자리에서 강간행위를 계속한 후 핸드백을 가지고 도주하였다. A의 신고를 받고 현장에 출동한 사법경찰관 P는 테이블 위에 놓여 있던 A 소유의 맥주컵에서 甲의 지문 8점을 현장에서 직접 채취한 후, 해당 맥주컵을 압수하였다. 검사는 甲이 범행 직후 “내가 주점 여주인 A를 강간했다\"라고 말하는 것을 들었다는 甲의 친구 B를 참고인으로 불러 조사한 후 위 범죄사실과 관련하여 甲을 기소하면서 맥주컵에서 채취한 지문과 B에 대한 참고인진술조서 등을 증거로 제출하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄹ. 제1심 법원이 甲이 국민참여재판을 원하는지에 대한 의사확인 절차를 거치지 아니하고 통상의 공판절차로 재판을 진행한 경우 제1심의 공판절차는 위법하고 항소심에서도 그 하자의 치유가 인정될 수 없다. ", "explanation": "국민참여재판은 피고인의 희망 의사 번복에 관한 일정한 제한(국민의 형사재판 참여에 관한 법률 제8조 제4항)이 있는 외에는 피고인의 의사에 반하여 할 수 없는 것이므로, 제1심법원이 국민참여재판의 대상이 되는 사건임을 간과하여 이에 관한 피고인의 의사를 확인하지 아니한 채 통상의 공판절차로 재판을 진행하였더라도, 피고인이 항소심에서 국민참여재판을 원하지 아니한다고 하면서 위와 같은 제1심의 절차적 위법을 문제삼지 아니할 의사를 명백히 표시하는 경우에는 하자가 치유되어 제1심 공판절차는 전체로서 적법하게 된다(대판 2012.06.14. 2011도15484).", "answer": "X"}, {"year": "2022", "num": "4", "source": "22변시", "question": "甲과 乙은 A를 살해하기로 공모하고 A의 집으로 찾아가, 乙이 망을 보고 있는 동안 甲은 가지고 있던 식칼로 A를 찔러 살해하였다. 우연히 이를 목격한 행인 B가 경찰에 신고하였고, 사법 경찰관 P는 甲과 乙의 범행 직후 A의 집에 도착하여 그 현장에서 甲을 적법하게 체포하고, 甲으로부터 범행에 사용한 식칼을 임의로 제출받아 압수하면서 즉석에서 현장검증을 실시하여 검증조서를 작성하였다. 한편 P는 위 압수한 식칼에 관하여 사후에 압수영장을 발부받지 않았고, B에 대하여는 진술조서를 작성하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄴ. 갑이 B에 대한 진술조서를 증거로 함에 동의하지 않은 경우라도 위 진술조서에 기재된 B의 주소로 보낸 증인소환장이 주소불명으로 송달되지 않자 검사가 증인신청을 철회하였다면, 위 진술조서를 甲에 대한 유죄 인정의 증거로 사용할 수 있다. ", "explanation": "제1심법원은 피고인이 피해자에 대한 경찰 진술조서와 공소외 2의 진술서를 증거로 함에 동의하지 않음에 따라 피해자와 공소외 2를 증인으로 채택하여 수회에 걸쳐 증인소환장의 송달을 실시하였으나 송달이 되지 아니하자, 증인에 대한 소재탐지촉탁을 하는 등 소재수사를 한 바 없이 증인 채택을 취소하고 위 경찰 진술조서 등을 증거로 채택하여 조사한 사실을 알 수 있다. 잎서 본 법리에 비추어 살펴보면, 위 경찰  진술조서 등은 ‘공판기일에 진술을 요하는 자가 소재불명, 그 밖에 이에 준히는 사유로 인하여 진술할 수 없는 때’에 해당하지 아니하여 형사소송법 제314조에 의하여 증거능력이 인정될 수 없다 할 것이다(대판 2010.09.09. 2010도2602). ", "answer": "X"}, {"year": "2022", "num": "4", "source": "22변시", "question": "甲과 乙은 A를 살해하기로 공모하고 A의 집으로 찾아가, 乙이 망을 보고 있는 동안 甲은 가지고 있던 식칼로 A를 찔러 살해하였다. 우연히 이를 목격한 행인 B가 경찰에 신고하였고, 사법 경찰관 P는 甲과 乙의 범행 직후 A의 집에 도착하여 그 현장에서 甲을 적법하게 체포하고, 甲으로부터 범행에 사용한 식칼을 임의로 제출받아 압수하면서 즉석에서 현장검증을 실시하여 검증조서를 작성하였다. 한편 P는 위 압수한 식칼에 관하여 사후에 압수영장을 발부받지 않았고, B에 대하여는 진술조서를 작성하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄷ. 甲이 B에 대한 진술조서를 증거로 함에 동의하지 않아 B를 증인으로 소환하였으나 B가 증인소환장을 송달받고도 법원의 소환에 계속하여 불응하고 구인장도 집행되지 않아 B에 대한 법정에서의 신문이 불가능한 경우 검사가 B에 대한 구인장의 강제력에 기하여 B의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 불구하고 부득이 B의 법정 출석이 불가능하게 되었다는 사정을 입증하더라도 위 진술조서를 甲에 대한 유죄인정의 증거로 사용할 수 없다. ", "explanation": "법원이 수회에 걸쳐 진술을 요할 자에 대한 증인소환장이 송달되지 아니하여 그 소재탐지촉탁까지 하였으나 그 소재를 알지 못하게 된 경우 또는 진술을 요할 자가 일정한 주거를 가지고 있더라도 법원의 소환에 계속 불응하고 구인하여도 구인장이 집행되지 아니하는 등 법정에서의 신문이 불가능한 상태의 경우에는 형사소송법 제314조 소정의 “공판정에 출정하여 진술을 할 수 없는 때”에 해당한다고 할 것이므로, 그 진술내용이나 조서의 작성에 허위개입의 여지가 거의 없고 그 진술내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우에는 그 진술조서의 증거능력이 인정된다(대판 2000.06. 09. 2000도1765).", "answer": "X"}, {"year": "2022", "num": "4", "source": "22변시", "question": "甲과 乙은 A를 살해하기로 공모하고 A의 집으로 찾아가, 乙이 망을 보고 있는 동안 甲은 가지고 있던 식칼로 A를 찔러 살해하였다. 우연히 이를 목격한 행인 B가 경찰에 신고하였고, 사법 경찰관 P는 甲과 乙의 범행 직후 A의 집에 도착하여 그 현장에서 甲을 적법하게 체포하고, 甲으로부터 범행에 사용한 식칼을 임의로 제출받아 압수하면서 즉석에서 현장검증을 실시하여 검증조서를 작성하였다. 한편 P는 위 압수한 식칼에 관하여 사후에 압수영장을 발부받지 않았고, B에 대하여는 진술조서를 작성하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄹ. 검사가 위 식칼을 을에 대한 증거로 제출하였다면, 을이 이를 증거로 함에 동의하지 않은 경우라도 을에 대한 유죄 인정의 증거로 사용할 수 있다.", "explanation": "범죄를 실행 중이거나 실행 직후의 현행범인은 누구든지 영장 없이 체포할 수 있고(형사소송법 제212조) , 검사 또는 사법경찰관은 피의자 등이 유류한 물건이나 소유자·소지자 또는 보관자가 임의로 제출한 물건은 영장 없이 압수할 수 있으므로(제218조) , 현행범 체포현장이나 범죄 현장에서도 소지자 등이 임의로 제출하는 물건은 형사소송법 제218조에 의하여 영장 없이 압수하는 것이 허용되고, 이 경우 검사나 사법경찰관은 별도로 사후에 영장을 받을 필요가 없다(대판 2019.11.14. 2019도13290) ► 식칼은 증거물이므로 피고인이 공판과정에서 증거동의를 하지 않더라도 위법수집증거가 아니라면 전문법칙이 적용되지 않아 증거능력이 인정될 수 있다. ", "answer": "O"}, {"year": "2022", "num": "5", "source": "22변시", "question": "甲은 2021. 1.20.부터 영업허가를 받지 아니하고 음식점 영업행위를 하였다. 이에 (ㄱ) 검사는 2021.6.21. 甲에 대해 ‘2021. 1.20.부터 2021.5.31.까지’의 식품위생법위반죄로 공소제기하였다. 그럼에도 甲은 계속해서 무허가 영업을 하였고, 이로 인해 이웃 乙과 다툼이 잦았다. 어느 날 (ㄴ) 乙은 도박으로 돈을 잃고 밤에 귀가하던 중 甲의 음식점 문을 뜯고 들어가 보관함에 있던 현금을 가지고 나왔다. 다음날 甲이 간밤에 도둑이 들었다면서 乙을 의심하며 큰소리로 다툼을 하자, (ㄷ) 뛰쳐나온 이웃주민 A. B가 있는 자리에서 乙은 “甲은 징역 살다온 전과자다\" 라고 수회 소리를 쳤다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "위의 약식명령이 확정되었음이 밝혀지자 검사는 범행일자를 ‘2021. 6. 4.부터 2021. 10. 20. 까지’로 변경하는 내용의 공소장변경허가신청을 하였다면, 법원은 이를 허가하여야 한다. ", "explanation": "포괄일죄인 영업범에서 공소제기의 효력은 공소가 제기된 범죄사실과 동일성이 인정되는 범죄사실의 전체에 미치므로, 공판심리 중에 그 범죄사실과 동일성이 인정되는 범죄사실이 추가로 발견된 경우에 검사는 공소장변경절치에 의하여 그 범죄사실을 공소사실로 추가할 수 있다. 그러나 공소제기된 범죄사실과 추가로 발견된 범죄사실 사이에 그 범죄사실들과 동일성이 인정되는 또 다른 범죄사실에 대한 유죄의 확정판결이 있는 때에는, 추가로 발견된 확정판결 후의 범죄사실은 공소제기된 범죄사실과 분단되어 통일성이 없는 별개의 범죄가 된다. 따라서 이때 검사는 공소장변경절차에 의하여 확정판결 후의 범죄사실을 공소사실로 추가할 수는 없고 별개의 독립된 범죄로 공소를 제기하여야 한다(대판 2017.04.28. 2016도21342). ", "answer": "X"}, {"year": "2022", "num": "5", "source": "22변시", "question": "甲은 2021. 1.20.부터 영업허가를 받지 아니하고 음식점 영업행위를 하였다. 이에 (ㄱ) 검사는 2021.6.21. 甲에 대해 ‘2021. 1.20.부터 2021.5.31.까지’의 식품위생법위반죄로 공소제기하였다. 그럼에도 甲은 계속해서 무허가 영업을 하였고, 이로 인해 이웃 乙과 다툼이 잦았다. 어느 날 (ㄴ) 乙은 도박으로 돈을 잃고 밤에 귀가하던 중 甲의 음식점 문을 뜯고 들어가 보관함에 있던 현금을 가지고 나왔다. 다음날 甲이 간밤에 도둑이 들었다면서 乙을 의심하며 큰소리로 다툼을 하자, (ㄷ) 뛰쳐나온 이웃주민 A. B가 있는 자리에서 乙은 “甲은 징역 살다온 전과자다\" 라고 수회 소리를 쳤다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "검사가 (ㄴ)의 범죄사실로 기소한 경우, 도박죄의 법정형은 1천만 원 이하의 벌금이고, 특수절도죄의 법정형은 1년 이상 10년 이하의 징역이므로 법원은 징역형과 벌금형을 병과하여 형을 선고하여야 한다. ", "explanation": "형법 제38조 참고 \n제38조(경합범과 처벌례)① 경합범을 동시에 판결할 때에는 다음 각 호의 구분에 따라 처벌한다. \n3. 각 죄에 대하여 정한 형이 무기징역, 무기금고 외의 다른 종류의 형인 경우에는 병과한다.", "answer": "O"}, {"year": "2022", "num": "5", "source": "22변시", "question": "甲은 2021. 1.20.부터 영업허가를 받지 아니하고 음식점 영업행위를 하였다. 이에 (ㄱ) 검사는 2021.6.21. 甲에 대해 ‘2021. 1.20.부터 2021.5.31.까지’의 식품위생법위반죄로 공소제기하였다. 그럼에도 甲은 계속해서 무허가 영업을 하였고, 이로 인해 이웃 乙과 다툼이 잦았다. 어느 날 (ㄴ) 乙은 도박으로 돈을 잃고 밤에 귀가하던 중 甲의 음식점 문을 뜯고 들어가 보관함에 있던 현금을 가지고 나왔다. 다음날 甲이 간밤에 도둑이 들었다면서 乙을 의심하며 큰소리로 다툼을 하자, (ㄷ) 뛰쳐나온 이웃주민 A. B가 있는 자리에서 乙은 “甲은 징역 살다온 전과자다\" 라고 수회 소리를 쳤다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "(ㄴ)과 관련하여, 을의 특수절도죄가「형법」의 누범에 해당한다면 특수절도에 대해서는 법정형의 단기와 장기 모두 2배를 가중한 범위 내에서 선고형을 정하여야 한다. ", "explanation": "형법 제35조 참조. \n제35조 (누범)  ②누범의 형은 그 죄에 정한 형의 장기의 2배까지 가중한다.", "answer": "X"}, {"year": "2022", "num": "6", "source": "22변시", "question": "甲은 식당을 운영하는 을과 을의 건물 증축공사에 필요한 형틀공사 계약을 체결한 후 그 공사를 완료하였는데, 을이 공사대금을 주지 않자 건물 입구에 쌓아두었던 건축 자재를 일부러 치우지 않았고 이로 인해 을은 추가 공사를 진행할 수 없었다. 이후 증축공사를 전부 완료하였으나 을은 영업이 제대로 이루어지지 않아 건물을 담보로 X은행에서 3억 원의 대출을 받고,채권최고액 3억 6천만 원의 근저당권을 설정해주었다. 그럼에도 영업이 나아질 기미가 없자 A에게 건물을 5억 원에 매각하기로 약정하고 계약금과 중도금을 받았다. 이후 을 건물 인근에 도로확충개발 소문이 돌자 B가 시가 상당액인 7억 원에 건물을 매입하겠다고 하여, 을은 B에게 매매대금을 받고 소유권이전등기를 해주었다. 한편 Z이 농수산물의원산지표시등에관한법률위반으로 단속에 걸리자 이 소식을 들은 부동산업자 병이 “담당공무원을 잘 알고 있으니, 나에게 현금으로 500만 원만 주면 잘 해결해주겠다\"라고 하여 Z은 병에게 500만 원을 이체해주었다. 이에 관한 설명 중 옳지 않를 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 검사가 乙의 이중매매에 대해 병이 관여하였다고 보아 병을 공동정범으로 기소하였으나 법원이 丙에게 방조의 죄책이 인정된다고 판단하여 공소장변경없이 방조범을 인정하는 경우, 심리과정에서 방조범에 대해 전혀 언급이 없거나 공방이 이뤄지지 않았다 하더라도 이는 丙의 방어권행사에 실질적인 불이익을 초래한 것이 아니므로 위법하지 아니하다. ", "explanation": "원심으로서는 설령 그 판시와 같은 사정을 들어 피고인을 조세포탈범행의 방조범으로 인정할 수 있다고 하더라도 그에 앞서 공소장변경의 절치를 거치거나 피고인에게 방조범의 성립 여부와 관련한 방어의 기회를 제공함으로써 그 방어권 행사에 불이익이 초래되지 않도록 필요한 조치를 하였어야 할 것이다. 그럼에도 불구하고 원심이 공판진행과정에서는 아무런 언급이 없다가 판결을 선고하면서, 공동정범으로는 인정되지 않지만 방조범으로는 인정이 된다고 하여 유죄로 판단한 것은 공소장변경에 관한 법리를 오해하여 판결에 영향을 미친 위법이 있는 경우에 해당한다(대판 2011.11.24. 2009도7166). ", "answer": "X"}, {"year": "2022", "num": "6", "source": "22변시", "question": "甲은 식당을 운영하는 乙과 乙의 건물 증축공사에 필요한 형틀공사 계약을 체결한 후 그 공사를 완료하였는데, 乙이 공사대금을 주지 않자 건물 입구에 쌓아두었던 건축 자재를 일부러 치우지 않았고 이로 인해 乙은 추가 공사를 진행할 수 없었다. 이후 증축공사를 전부 완료하였으나 乙은 영업이 제대로 이루어지지 않아 건물을 담보로 X은행에서 3억 원의 대출을 받고, 채권최고액 3억 6천만원의 근저당권을 설정해주었다. 그럼에도 영업이 나아질 기미가 없자 A에게 건물을 5억 원에 매각하기로 약정하고 계약금과 중도금을 받았다. 이후 乙 건물 인근에 도로확충개발 소문이 돌자 B가 시가 상당액인 7억 원에 건물을 매입하겠다고 하여, 乙은 B에게 매매대금을 받고 소유권이전등기를 해주었다. 한편 乙이 농수산물의원산지표시등에관한법률위반으로 단속에 걸리자 이 소식을 들은 부동산업자 丙이 “담당공무원을 잘 알고 있으니, 나에게 현금으로 500만 원만 주면 잘 해결해주겠다\"라고 하여 乙은 丙에게 500만 원을 이체해주었다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 검사가 乙의 이중매매에 대해 丙이 관여하였다고 보아 丙을 공동정범으로 기소하였으나 법원이 丙에게 방조의 죄책이 인정된다고 판단하여 공소장변경 없이 방조범을 인정하는 경우, 심리과정에서 방조범에 대해 전혀 언급이 없거나 공방이 이뤄지지 않았다 하더라도 이는 丙의 방어권 행사에 실질적인 불이익을 초래한 것이 아니므로 위법하지 아니하다.", "explanation": "원심으로서는 설령 그 판시와 같은 사정을 들어 피고인을 조세포탈범행의 방조범으로 인정할 수 있다고 하더라도 그에 앞서 공소장변경의 절치를 거치거나 피고인에게 방조범의 성립 여부와 관련한 방어의 기회를 제공함으로써 그 방어권 행사에 불이익이 초래되지 않도록 필요한 조치를 하였어야 할 것이다. 그럼에도 불구하고 원심이 공판진행과정에서는 아무런 언급이 없다가 판결을 선고하면서, 공동정범으로는 인정되지 않지만 방조범으로는 인정이 된다고 하여 유죄로 판단한 것은 공소장변경에 관한 법리를 오해하여 판결에 영향을 미친 위법이 있는 경우에 해당한다(대판 2011.11.24. 2009도7166). ", "answer": "X"}, {"year": "2022", "num": "7", "source": "22변시", "question": "사법경찰관 P1은 甲이 지하철역 에스컬레이터에서 휴대전화 카메라를 이용하여 A의 치마 속을 몰래 촬영하는 것을 발견하고 甲을 현행범인으로 체포하면서 甲의 휴대전화를 압수하였고, 사건을 인계받은 사법경찰관 P2는 甲을 피의자로 신문한 후 석방하였다. 이후 甲은 음주 후 승용차를 운전하던 중 음주단속을 피하기 우|하여 도망가다가 운전 중인 승용차로 단속 중이던 사법경찰관 P3 고의로 들이받아 전치 6주의 상해를 입혔다. 검사는 甲을 위 범죄사실로 기소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄴ. P1이 甲의 휴대전회를 적법하게 압수하면서 작성한 압수조서의 ‘압수경위’란에 ‘甲이 지하철역 에스컬레이터에서 짧은 치마를 입고 올라가는 여성을 쫓아가 뒤에 밀착하여 치마 속으로 휴대전화를 집어넣는 등 해당 여성의 신체를 몰래 촬영하는 행동을 하였다’는 내용이 기재되어 있고, 그 하단에 甲의 범행을 직접 목격하고 위 압수조서를 작성한 P1의 기명날인이 있는 경우 위 압수조서의 ‘압수경위’란에 기재된 내용은 「형사소송법」 제312조 제5항의 ‘피고인이 아닌 자가 수사과정에서 작성한 진술서’에 준하는 것으로 볼 수 있다.", "explanation": "피고인이 지하철역 에스컬레이터에서 휴대전화기의 카메리를 이용하여 성명불상 여성 피해자의 치마 속을 몰래 촬영하다가 현행범으로 체포되어 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)으로 기소된 사안에서, 피고인은 공소사실에 대해 자백하고 검사가 제출한 모든 서류에 대하여 증거로 함에 동의하였는데 그 서류들 중 체포 당시 임의제출 방식으로 입수된 피고인 소유 휴대전화기(이하 ‘휴대전화기’라고 한다)에 대한 압수조서의 ‘입수경위’란에 ‘지하철역 승강장 및 게이트 앞에서 경찰관이 지하철범죄 예방·검거를 위한 비노출 잠복근무 중 검정 재킷, 검정 바지, 흰색 운동화를 착용한 20대가량 남성이 짧은 치마를 입고 에스컬레이터를 올라가는 여성을 쫓아가 뒤에 밀착하여 치마 속으로 휴대폰을 집어넣는 등 해당 여성의 신체를 몰래 촬영하는 행동을 하였다’는 내용이 포함되어 있고, 그 하단에 피고인의 범행을 직접 목격하면서 위 압수조서를 작성한 사법경찰관 및 사법경찰리의 각 기명날인이 들어가 있으므로, 위 입수조서 중 ‘압수경위’란에 기재된 내용은 피고인이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것으로서 형사소송법 제312조 제5헝에서 정한 ‘피고인이 아닌 자가 수사과정에서 작성한 진술서’에 준하는 것으로 볼 수 있고, 이에 따라 휴대전화기에 대한 임의제출절차가 적법하였는지에 영향을 받지 않는 별개의 독립적인 증거에 해당하여 피고인이 증거로 힘에 동의한 이상 유죄를 인정하기 위한 증거로 시용할 수 있을 뿐 아니라 피고인의 자백을 보강하는 증거가 된다고 볼 여지가 많다는 이유로 이와 달리 피고인의 자백을 뒷받침할 보강증거가 없다고 보아 무죄를 선고한 원심판결에 자백의 보강증거 등에 관한 법리를 오해하거나 필요한 심리를 다하지 아니한 잘못이 있다고 한 사례(대판 2019.11.14. 2019도13290).", "answer": "O"}, {"year": "2022", "num": "7", "source": "22변시", "question": "사법경찰관 P1은 甲이 지하철역 에스컬레이터에서 휴대전화 카메라를 이용하여 A의 치마 속을 몰래 촬영하는 것을 발견하고 甲을 현행범인으로 체포하면서 甲의 휴대전화를 압수하였고, 사건을 인계받은 사법경찰관 P2는 甲을 피의자로 신문한 후 석방하였다. 이후 甲은 음주 후 승용차를 운전하던 중 음주단속을 피하기 우|하여 도망가다가 운전 중인 승용차로 단속 중이던 사법경찰관 P3 고의로 들이받아 전치 6주의 상해를 입혔다. 검사는 甲을 위 범죄사실로 기소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄷ. 만약 위 휴대전화에 대한 압수가 위법한 경우 P1이 작성한 압수조서 중 ‘압수경위’란에 기재된 내용은 위법하게 수집된 증거에 터잡아 획득한 2차적 증거로서 피고인이 증거로 함에 동의하더라도 원칙적으로 증거능력이 없다. ", "explanation": "피고인이 지하철역 에스컬레이터에서 휴대전화기의 카메리를 이용하여 성명불상 여성 피해자의 치마 속을 몰래 촬영하다가 현행범으로 체포되어 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)으로 기소된 사안에서, 피고인은 공소사실에 대해 자백하고 검사가 제출한 모든 서류에 대하여 증거로 함에 동의하였는데 그 서류들 중 체포 당시 임의제출 방식으로 입수된 피고인 소유 휴대전화기(이하 ‘휴대전화기’라고 한다)에 대한 압수조서의 ‘입수경위’란에 ‘지하철역 승강장 및 게이트 앞에서 경찰관이 지하철범죄 예방·검거를 위한 비노출 잠복근무 중 검정 재킷, 검정 바지, 흰색 운동화를 착용한 20대가량 남성이 짧은 치마를 입고 에스컬레이터를 올라가는 여성을 쫓아가 뒤에 밀착하여 치마 속으로 휴대폰을 집어넣는 등 해당 여성의 신체를 몰래 촬영하는 행동을 하였다’는 내용이 포함되어 있고, 그 하단에 피고인의 범행을 직접 목격하면서 위 압수조서를 작성한 사법경찰관 및 사법경찰리의 각 기명날인이 들어가 있으므로, 위 입수조서 중 ‘압수경위’란에 기재된 내용은 피고인이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것으로서 형사소송법 제312조 제5헝에서 정한 ‘피고인이 아닌 자가 수사과정에서 작성한 진술서’에 준하는 것으로 볼 수 있고, 이에 따라 휴대전화기에 대한 임의제출절차가 적법하였는지에 영향을 받지 않는 별개의 독립적인 증거에 해당하여 피고인이 증거로 힘에 동의한 이상 유죄를 인정하기 위한 증거로 시용할 수 있을 뿐 아니라 피고인의 자백을 보강하는 증거가 된다고 볼 여지가 많다는 이유로 이와 달리 피고인의 자백을 뒷받침할 보강증거가 없다고 보아 무죄를 선고한 원심판결에 자백의 보강증거 등에 관한 법리를 오해하거나 필요한 심리를 다하지 아니한 잘못이 있다고 한 사례(대판 2019.11.14. 2019도13290).", "answer": "X"}, {"year": "2022", "num": "7", "source": "22변시", "question": "사법경찰관 P1은 甲이 지하철역 에스컬레이터에서 휴대전화 카메라를 이용하여 A의 치마 속을 몰래 촬영하는 것을 발견하고 甲을 현행범인으로 체포하면서 甲의 휴대전화를 압수하였고, 사건을 인계받은 사법경찰관 P2는 甲을 피의자로 신문한 후 석방하였다. 이후 甲은 음주 후 승용차를 운전하던 중 음주단속을 피하기 우|하여 도망가다가 운전 중인 승용차로 단속 중이던 사법경찰관 P3 고의로 들이받아 전치 6주의 상해를 입혔다. 검사는 甲을 위 범죄사실로 기소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "ㄹ. P2는 조사과정의 영상녹화를 위해 미리 영상녹화사실을 甲과 A에게 각각 알려주었으나 甲은 촬영을 거부하고 A는 이에 동의한 경우, 甲에 대한 영상녹화물은 기억환기를 위한 자료로 활용할 수 없지만 A에 대한 영상녹화물은 참고인 진술조서의 실질적 진정성립을 증명하기 위한 방법으로 사용할 수 있다. ", "explanation": "형사소송법 제221조 제1항, 제244조의2 제1항 참조. (형사소송법 제221조(제3자의 출석요구 등) ① 검사 또는 사법경찰관은 수사에 필요한 때에는 피의자가 아닌 자의 출석을 요구하여 진술을 들을 수 있다. 이 경우 그의 동의를 받아 영상녹화 할 수 있다. 형사소송법 제244조의2(피의자진술의 영상녹화) ① 피의자의 진술은 영상녹화 할 수 있다. 이 경우 미리 영상녹화사실을 알려주어야 하며 조사의 개시부터 종료까지의 전 과정 및 객관적 정황을 영상녹화하여야 한다.)\n", "answer": "X"}, {"year": "2022", "num": "8", "source": "22변시", "question": "술에 만취해 운전을 하던 甲은 교통사고를 낸 후 조수석에 타고 있던 친동생 乙에게 乙 자신이 운전하였다고 경찰에 말해 달라 부탁하였고, 乙은 甲의 부탁대로 자신이 운전하다 사고를 냈다고 진술하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 만약 사법경찰관이 甲에 대하여 현장검증을 실시하여 적법하게 검증조서를 작성하였고, 이 검증조서에는 甲이 乙에게 “네가 운전하였다고 말해라\"라는 진술기재부분과 범행을 재연하는 사진이 첨부되어 있는데 甲이 법정에서 검증조서에 대해서만 증거로 함에 동의하고 진술기재부분과 재연사진에 대해서는 그 성립의 진정 및 내용을 부인하였다면, 검증조서에 기재된 진술기재부분과 재연사진을 제외한 검증조서의 나머지 부분에 대해서만 증거능력이 인정된다. ", "explanation": "사법경찰관 작성의 검증조서에 대하여 피고인이 증거로 함에 동의만 하였을 뿐 공판정에서 검증조서에 기재된 진술내용 및 범행을 재연한 부분에 대하여 그 성립의 진정 및 내용을 인정한 흔적을 찾아 볼 수 없고 오히려 이를 부인하고 있는 경우에는 그 증거능력을 인정할 수 없으므로, 위 검증조서 중 범행에 부합되는 피고인의 진술을 기재한 부분과 범행을 재연한 부분을 제외한 나머지 부분만을 증거로 채용하여야 함에도 이를 구분하지 아니한 채 그 전부를 유죄의 증거로 인용한 항소심의 조치는 위법하다(대판 \n1998.03.13. 98도159). ", "answer": "O"}, {"year": "2022", "num": "9", "source": "22변시", "question": "필요적 공범에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "① 공소시효는 공소의 제기로 진행이 정지되고 「형사소송법」 제253조 제2항에 따라 공범의 1인에 대한 시효의 정지는 다른 공범자에 대하여 효력이 미치므로 뇌물수수자에 대하여 공소가 제기되었다면 뇌물공여자에 대한 공소시효 또한 정지된다. ", "explanation": "형사소송법 제248조 제1항 제253조 제1항, 제2항에서 규정하는 바와 같이, 형사소송법은 공범 사이의 처벌에 형평을 기하기 위하여 공범 중 1인에 대한 공소의 제기로 디른 공범자에 대하여도 공소시효가 정지되도록 규정하고 있는데 위 공범의 개념이나 유형에 관하여는 아무런 규정을 두고 있지 아니하다. 따라서 형사소송법 제253조 제2항의 공범을 해석할 때에는 공범 사이의 처벌의 형평이라는 위 조항의 입법취지, 국가형벌권의 적정한 실현이라는 형사소송법의 기본이념, 국가형벌권 행사의 대상을 규정한 형법 등 실체법과의 체계적 조화 등의 관점을 종합적으로 고려하여야 하고 특히 위 조항이 공소제기 효력의 인적 범위를 확장하는 예외를 마련하여 놓은 것이므로 원칙적으로 엄격하게 해석하여야 하고 피고인에게 불리한 방향으로 확장하여 해석해서는 아니 된다. 뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 자는 강학상으로는 필요적 공범이라고 불리고 있으나, 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌규정에 따라 처벌되는 것이어서 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며，대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면, 형사소송법 제253조 제2항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다(대판 2015.02.12. 2012도4842). ", "answer": "X"}, {"year": "2022", "num": "9", "source": "22변시", "question": "필요적 공범에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ í형사소송법」 제312조 제3항은 검사 이외의 수사기관이 작성한 해당 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되는데 이때 공범에는 형법 총칙의 공범 이외에 필요적 공범 관계에 있는 자들도 포함된다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 해당 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 해당 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. ... 나아가 대법원은 형사소송법 제312조 제3항이 형법 총칙의 공범 이외에도, 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형별 규정에 따라 처벌되는 강학상 필요적 공범 내지 대향범 관계에 있는 자들 사이에서도 적용된다는 판시를 하기도 하였다. 이는 필요적 공범 내지 대향범의 경우 형법 총칙의 공범관계와 마찬가지로 어느 한 피고인이 자기의 범죄에 대하여 한 진술이 나머지 대향적 관계에 있는 자가 저지른 범죄에도 내용상 불가분적으로 관련되어 있어 목격자, 피해자 등 제3자의 진술괴는 본질적으로 다른 속성을 지니고 있음을 중시한 것으로 볼 수 있다{대판 2020.06.11. 2016도9367). ", "answer": "O"}, {"year": "2022", "num": "10", "source": "22변시", "question": "X회사에 근무하던 甲은 대표이사 A와 갈등으로 퇴사하게 되자 재직하면서 알게 된 회사 비리를 국세청과 수사기관에 알리겠다며 각각 3차례에 걸쳐 A에게 협박 메일을 발송하였다. 이후 甲은 OO빌딩 6층에 있는 X회사에 들어갈 생각으로 5층 베란다 테라스의 난간을 잡고 기어올라 6층 창문을 통해 자신이 사용하던 사무실로 들어갔다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "① 검사가 甲의 1차 협박 범행을 먼저 기소하고 다시 2, 3차의 협박 범행을 추가로 기소하였 는데 이를 병합하여 심리하는 과정에서 전후에 기소된 각각의 범행이 모두 포괄하여 하나의 협박죄를 구성하는 것으로 밝혀진 경우, 법원이 석명절차나 공소장 변경절차를 거치지 아니하고 전후에 기소된 범죄사실 전부에 대하여 실체판단을 하는 것은 위법하다. ", "explanation": "검사가 수 개의 협박 범행을 먼저 기소하고 다시 별개의 협박 범행을 추가로 기소하였는데 이를 병합하여 심리하는 과정에서 전후에 기소된 각각의 범행이 모두 포괄하여 하나의 협박죄를 구성하는 것으로 밝혀진 경우, 이중기소에 대하여 공소기각판결을 하도록 한 형사소송법 제327조 제3호의 취지는 동일사건에 대하여 피고인으로 하여금 이중처별의 위험을 받지 아니하게 하고 법원이 2개의 실체판결을 하지 아니하도록 함에 있으므로, 위와 같은 경우 법원이 각각의 범행을 포괄하여 하나의 협박죄를 인정한다고 하여 이중기소를 금하는 위 법의 취지에 반하는 것이 아닌 점과 법원이 실체적 경합범으로 기소된 범죄사실에 대하여 그 범죄사실을 그대로 인정하면서 다만 죄수에 관한 법률적인 평가만을 달리하여 포괄일죄로 처단하는 것이 피고인의 방어에 불이익을 주는 것이 아니어서 공소장변경 없이도 포괄일죄로 처벌할 수 있는 점에 비추어 보면, 비록 협박죄의 포괄일죄로 공소장을 변경하는 절차가 없었다거나 추가로 공소장을 제출한 것이 포괄일죄를 구성하는 행위로서 기존의 공소장에 누락된 것을 추가· 보충하는 취지의 것이라는 석명절차를 거치지 아니하였다 하더라도, 법원은 전후에 기소된 범죄사실 전부에 대하여 실체판단을 할 수 있고, 추가기소 된 부분에 대하여 공소기각판결을 할 필요는 없다(대판 2007.08.23. 2007도2595) ", "answer": "X"}, {"year": "2022", "num": "10", "source": "22변시", "question": "X회사에 근무하던 甲은 대표이사 A와 갈등으로 퇴사하게 되자 재직하면서 알게 된 회사 비리를 국세청과 수사기관에 알리겠다며 각각 3차례에 걸쳐 A에게 협박 메일을 발송하였다. 이후 甲은 OO빌딩 6층에 있는 X회사에 들어갈 생각으로 5층 베란다 테라스의 난간을 잡고 기어올라 6층 창문을 통해 자신이 사용하던 사무실로 들어갔다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "② 甲의 1차 협박 범행에 대하여 협박죄의 유죄판결이 확정된 경우 그 확정판결의 사실심판결 선고 전에 저질러진 1차 범행과 포괄일죄의 관계에 있는 2, 3차 협박 범행에 대하여 상습 협박죄로 새로이 공소가 제기되었다면 법원은 면소판결을 선고하여야 한다. ", "explanation": "상습범으로서 포괄적 일죄의 관계에 있는 여러 개의 범죄사실 중 일부에 대하여 유죄판결이 확정된 경우에, 그 확정판결의 사실심판결 선고 전에 저질러진 나머지 범죄에 대하여 새로이 공소가 제기되었다면 그 새로운 공소는 확정판결이 있었던 사건과 동일한 사건에 대하여 다시 제기된 데 해당하므로 이에 대하여는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호) 다만 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하는 것이고, 상습범 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는, 가사 뒤에 기소된 사건에서 비로소 드러났거나 새로 저질러진 범죄사실과 전의 판결에서 이미 유죄로 확정된 범죄사실 등을 종합하여 비로소 그 모두가 상습범으로서의 포괄적 일죄에 해당하는 것으로 판단된다 하더라도 뒤늦게 앞서의 확정판결을 상습범의 일부에 대한 확정판결이라고 보아 그 기판력이 그 사실심판결 선고 전의 나머지 범죄에 미친다고 보아서는 아니 된다(대판 2004.09.16. 2001도3206(전합)) .", "answer": "X"}, {"year": "2022", "num": "10", "source": "22변시", "question": "X회사에 근무하던 甲은 대표이사 A와 갈등으로 퇴사하게 되자 재직하면서 알게 된 회사 비리를 국세청과 수사기관에 알리겠다며 각각 3차례에 걸쳐 A에게 협박 메일을 발송하였다. 이후 甲은 OO빌딩 6층에 있는 X회사에 들어갈 생각으로 5층 베란다 테라스의 난간을 잡고 기어올라 6층 창문을 통해 자신이 사용하던 사무실로 들어갔다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "③ 甲의 3차례 협박 범행에 대해 상습성이 인정되고 그중 2차 협박 범행에 대하여 상습범으로 유죄판결이 확정된 경우 확정판결 후에 행해진 3차 협박의 범죄사실은 1차 협박의 범죄사실과 분리되어 별개의 상습협박죄가 된다. ", "explanation": "상습범에 있어서 공소제기의 효력은 공소가 제기된 범죄사실과 동일성이 인정되는 범죄사실의 전체에 미치는 것이므로 상습범의 범죄사실에 대한 공판심리 중에 그 범죄사실과 동일한 습벽의 발현에 의한 것으로 인정되는 범죄사실이 추가로 발견된 경우에는 검사는 공소장변경절차에 의하여 그 범죄사실을 공소사실로 추가할 수 있다고 할 것이나, 공소제기 된 범죄사실과 추가로 발견된 범죄사실 사이에 그것들과 동일한 습벽에 의하여 저질러진 또 다른 범죄사실에 대한 유죄의 확정판결이 있는 경우에는 전후 범죄사실의 일죄성은 그에 의하여 분단되어 공소제기된 범죄사실과 판결이 확정된 범죄사실만이 포괄하여 하나의 상습범을 구성하고, 추가로 발견된 확정판결 후의 범죄사실은 그것과 경합범 관계에 있는 별개의 상습범이 되므로, 검사는 공소장변경절차에 의하여 이를 공소사실로 추가할 수는 없고 어디까지나 별개의 독립된 범죄로 공소를 제기하여야 할 것이다(대판 2000.03.10. 99도2744).", "answer": "O"}, {"year": "2021", "num": "2", "source": "21변시", "question": "A는 자신에 대한 세무조사가 진행되자 지인으로부터 세무사 甲을 소개받았다. 甲은 세무공무원에게 실제로 청탁할 의사와 능력이 없음에도 세무공무원에게 로비하여 세무조사에서 편의를 봐줄 수 있게 하고 부과될 세금을 많이 낮춰 줄 것이니 공무원에게 사용할 로비자금을 A에게 요구하였고, 이에 A는 甲에게 3,000만 원을 건네 주었다. 그런데 A는 생각했던 것보다 별다른 도움을 받지 못하자 수사기관에 甲을 고소하였다. 이에 검사는 A를 조사한 후 법원으로부터 변호사법위반 및 사기에 관한 압수·수색영장을 발부받아 甲의 사무실에서 컴퓨터 하드디스크를 압수하여 수사기관으로 가지고 왔다. 검사는 하드디스크에 저장된 정보를 탐색하던 중 성명불상 여자의 치마 속이 찍힌 사진 여러 장을 발견하였음에도 별도로 영장을 발부받지 않고 이를 출력한 다음, 甲에 대한 피의자신문 과정에서 이를 제시하자, 甲은 지하철에서 무단 촬영한 사진이라고 자백하였다. 검사는 甲을 변호사법위반, 사기, 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)으로 기소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 위 컴퓨터 하드디스크 자체의 반출이 적법하다고 하여도 위 치마 속을 촬영한 사진은 위법하게 수집한 증거이므로 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영·반포등)에 관한 유죄의 증거로 시용할 수 없는 것이 원칙이다. ", "explanation": "저장매체에 대한 압수수색 과정에서 범위를 정하여 출력 또는 복제하는 방법이 불가능하거나 압수의 목적을 달성하기에 현저히 곤란한 예외적인 사정이 인정되어 전자정보가 담긴 저장매체 또는 하드카피나 이미징 등 형태(이하 ‘복제본’이라 한다)를 수사기관 사무실 등으로 옮겨 복제·탐색·출력하는 경우에도, 그와 같은 일련의 과정에서 형사소송법 제219조 제121조에서 규정하는 피압수수색 당사자(이하 ‘피압수자’라 한다)나 변호인에게 참여의 기회를 보장하고 혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 한다. 전자정보에 대한 압수·수색에 있어 저장매체 자체를 외부로 반출하거나 하드카피·이미징 등의 형태로 복제본을 만들어 외부에서 저장매체나 복제본에 대하여 압수수색이 허용되는 예외적인 경우에도 혐의사실과 관련된 전자정보 이외에 이와 무관한 전자정보를 탐색·복제·출력하는 것은 원칙적으로 위법한 압수·수색에 해당하므로 허용될 수 없다. 그러나 전자정보에 대한 압수수색이 종료되기 전에 혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원에서 별도의 범죄혐의에 대한 압수·수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수·수색을 할 수 있다. 나아가 이러한 경우에도 별도의 압수·수색 절차는 최초의 압수·수색 절차와 구별되는 별개의 절차이고 별도 범죄혐의와 관련된 전자정보는 최초의 압수·수색영장에 의한 압수·수색의 대상이 아니어서 저장매체의 원래 소재지에서 별도의 압수·수색영장에 기해 압수·수색을 진행하는 경우와 마찬가지로 피압수·수색 당사자(이하 ‘피압수자’ 라 한다)는 최초의 압수·수색 이전부터 해당 전자정보를 관리하고 있던 자라 할 것이므로, 특별한 사정이 없는 한 피압수자에게 형사소송법 제 219조, 제121조, 제129조에 따라 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피압수자의 이익을 보호하기 위한 적절한 조치가 이루어져야 한다(대결 2015.07.16. 2011모1839(전합)). ", "answer": "O"}, {"year": "2021", "num": "3", "source": "21변시", "question": "A는 2020.9.24. 甲에 대한 대여금채권을 피보전권리로 하여 甲이 B에 대하여 가지는 물품대금 채권에 대하여 가압류결정을 받았고, 위 가압류결정 정본은 2020. 10.7. B에게 송달되었다. 甲은 C에게 채무가 없음에도 허위의 채무를 작출하여 그 허위채무에 대한 담보로 2020.10.6.경 위 물품대금채권을 C에게 양도하기로 하는 채권양도계약을 체결하였고, 2020. 10. 8. 채권양도 통지가 C에게 도달하였다. 한편 甲과 乙은 합동하여 2020. 10. 11. A가 화장실에 간 틈을 타서 甲이 망을 보는 도중에 乙이 A의 핸드백에서 A 소유의 지갑을 꺼내어 가 절취하였다. 경찰은 甲과 乙을 조사한 후 사건을 검찰에 송치하였고, 검사는 A를 참고인으로 조사하면서 진술조서를 작성하고, A의 동의를 받아 참고인 조사 과정을 영상 녹화하였다. 甲은 강제집행면탈죄 및 특수절도죄로, 乙은 특수절도죄로 각 기소되어 함께 재판받고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙은 피의자신문과정에서 ‘甲이 허위의 채무를 부담하여 허위의 채권양도계약을 체결하는 것을 목격하였다’고 진술하였는데 이러한 진술이 기재된 경찰 작성의 乙에 대한 피의자신문조서는 「형사소송법」 제312조 제3항이 적용되어 당해 피고인인 甲이 공판기일에서 내용을 부인하는 이상 甲의 강제집행면탈에 대한 증거로 쓸 수 없다. ", "explanation": "강제집행면탈죄 부분에 있어서 乙은 甲과 공범 아닌 공동피고인의 관계에 있는바, 사법경찰관이 작성한 진술조서에서 ‘甲이 허위의 채권양도계약을 체결하는 것을 목격하였다’는 乙의 진술부분은 참고인진술조서에 해당하여 형사소송법 제312조 제4항이 적용된다. 따라서 甲이 내용을 부인하여도 '① 적법절차와 방식 ② 乙의 진정 성립 인정 ③ 반대신문권 보장 ④ 특신상태’의 요건이 충족될 경우 甲에 대한 유죄의 증거로 사용될 수 있게 된다.", "answer": "X"}, {"year": "2021", "num": "3", "source": "21변시", "question": "A는 2020.9.24. 甲에 대한 대여금채권을 피보전권리로 하여 甲이 B에 대하여 가지는 물품대금 채권에 대하여 가압류결정을 받았고, 위 가압류결정 정본은 2020. 10.7. B에게 송달되었다. 甲은 C에게 채무가 없음에도 허위의 채무를 작출하여 그 허위채무에 대한 담보로 2020.10.6.경 위 물품대금채권을 C에게 양도하기로 하는 채권양도계약을 체결하였고, 2020. 10. 8. 채권양도 통지가 C에게 도달하였다. 한편 甲과 乙은 합동하여 2020. 10. 11. A가 화장실에 간 틈을 타서 甲이 망을 보는 도중에 乙이 A의 핸드백에서 A 소유의 지갑을 꺼내어 가 절취하였다. 경찰은 甲과 乙을 조사한 후 사건을 검찰에 송치하였고, 검사는 A를 참고인으로 조사하면서 진술조서를 작성하고, A의 동의를 받아 참고인 조사 과정을 영상 녹화하였다. 甲은 강제집행면탈죄 및 특수절도죄로, 乙은 특수절도죄로 각 기소되어 함께 재판받고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲에 대한 제1심 공판절차에서 검사 작성의 A에 대한 진술조서가 증거로 제출되었는데, 이에 대해 甲이 증거로 함에 동의하지 않고 A가 증인으로 출석하여 진정성립을 인정하지 않았다 하더라도, 위 증거를 신청한 검사가 재판장의 허가를 받아 진술조서의 내용을 낭독하는 등으로 법정에서 엄격한 증거조사가 이루어졌다면 증거능력이 있다.", "explanation": "A에 대한 참고인 진술조서도 형사소송법 제312조 제4항이 적용되는데, A가 진정성립을 부정하였으므로 제312조 제4항의 요건이 충족되지 않아 당해 조서를 甲에 대한 유죄의 증거로 사용히는 것은 불가능하다. (형사소송법 제312조(검사 또는 사법경찰관의 조서 등) ④ 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서는 적법한 절차와 방식에 따라 작성된 것으로서 그 조서가 검사 또는 사법경찰관 앞에서 진술한 내용과 동일하게 기재되어 있음이 원진술자의 공판준비 또는 공판기일에서의 진술이나 영상녹화물 또는 그 밖의 객관적인 방법에 의하여 증명되고, 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 원진술자를 신문할 수 있었던 때에는 증거로 할 수 있다. 다만 그 조서에 기재된 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한한다.)", "answer": "X"}, {"year": "2021", "num": "3", "source": "21변시", "question": "A는 2020.9.24. 甲에 대한 대여금채권을 피보전권리로 하여 甲이 B에 대하여 가지는 물품대금 채권에 대하여 가압류결정을 받았고, 위 가압류결정 정본은 2020. 10.7. B에게 송달되었다. 甲은 C에게 채무가 없음에도 허위의 채무를 작출하여 그 허위채무에 대한 담보로 2020.10.6.경 위 물품대금채권을 C에게 양도하기로 하는 채권양도계약을 체결하였고, 2020. 10. 8. 채권양도 통지가 C에게 도달하였다. 한편 甲과 乙은 합동하여 2020. 10. 11. A가 화장실에 간 틈을 타서 甲이 망을 보는 도중에 乙이 A의 핸드백에서 A 소유의 지갑을 꺼내어 가 절취하였다. 경찰은 甲과 乙을 조사한 후 사건을 검찰에 송치하였고, 검사는 A를 참고인으로 조사하면서 진술조서를 작성하고, A의 동의를 받아 참고인 조사 과정을 영상 녹화하였다. 甲은 강제집행면탈죄 및 특수절도죄로, 乙은 특수절도죄로 각 기소되어 함께 재판받고 있다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 A의 진술을 녹화한 영상 녹화물은 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한 甲에 대한 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용할 수 없다. ", "explanation": "2007. 6. 1. 법률 제8496호로 개정되기 전의 형사소송법에는 없던 수사기관에 의한 피의자 아닌 자 (이하 ‘참고인’이라 한다) 진술의 영상녹화를 새로 정하면서 그 용도를 참고인에 대한 진술조서의 실질적 진정성립을 증명하거나 참고인의 기억을 환기시키기 위한 것으로 한정하고 있는 현행 형사소송법의 규정 내용을 영상물에 수록된 성범죄 피해자의 진술에 대하여 독립적인 증거능력을 인정하고 있는 성폭력범죄의 처벌 등에 관한 특례법 제30조 제6항 또는 아동·청소년의 성보호에 관한 법률 제26조 제6항의 규정과 대비하여 보면, 수사기관이 참고인을 조사하는 과정에서 형사소송법 제221조 제1항에 따라 작성한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수는 없다고 해석함이 타당하다(대판 2014.07.10. 2012도5041).", "answer": "O"}, {"year": "2021", "num": "4", "source": "21변시", "question": "A 분양대책위원회의 공동대표인 甲이 업무상 임무에 위배하여 주상복합아파트 일부 세대에 관한 분양계약서를 받아 그에 관한 소유권이전등기를 하여 재산상 이익을 취득하려고 하였으나 소유권이전등기를 마치지 못하였다. 이에 대하여 경찰의 내사가 시작되자 甲은 사법경찰관 丙의 동생인 乙에게 1,000만 원을 주면서 이를 丙에게 주고 사건을 미리 잘 무마해 줄 것을 부탁하였고, 乙은 丙에게 같은 취지의 부탁을 하며 1,000만 원을 전달하였다. 그 후, 甲은 영국으로 출국하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 범한 배임미수의 범죄행위는 甲이 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고, 그때부터 공소시효가 진행된다. ", "explanation": "공소시효는 범죄행위가 종료한 때부터 진행한다(형사소송법 제252조 제1항). 미수범은 범죄의 실행에 칙수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에 처벌받게 되므로(형법 제25조 제1항) , 미수범의 범죄행위는 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고 그때부터 미수범의 공소시효가 진행한다 ... 이 부분 업무상 배임미수 범행은, 피고인 1이 피해자 대책위원회에 대한 업무상 임무에 위배하여 OOOOO 2층 오피스텔 28세대에 관한 분양계약에 따라 소유권이전등기를 하여 재산상 이익을 취득하려다가 이 사건 금전지급약정에 따라 2007. 2. 8. 공소외 1 회사 등에게 분양계약서를 반환하여 더 이상 OOOOO 2층 28세대에 관한 소유권이전등기절차를 진행할 수 없게 됨으로써 미수에 그친 경우에 해당한다. 이 부분 업무상 배임미수죄에 있어 범죄행위의 종료시기는 위와 같이 이 사건 금전지급약정 및 분양계약서 반환으로 더 이상 소유권이전등기절차를 진행할 수 없게 된 때이다(대판 2017.07.11. 2016도14820). ", "answer": "O"}, {"year": "2021", "num": "4", "source": "21변시", "question": "A 분양대책위원회의 공동대표인 甲이 업무상 임무에 위배하여 주상복합아파트 일부 세대에 관한 분양계약서를 받아 그에 관한 소유권이전등기를 하여 재산상 이익을 취득하려고 하였으나 소유권이전등기를 마치지 못하였다. 이에 대하여 경찰의 내사가 시작되자 甲은 사법경찰관 丙의 동생인 乙에게 1,000만 원을 주면서 이를 丙에게 주고 사건을 미리 잘 무마해 줄 것을 부탁하였고, 乙은 丙에게 같은 취지의 부탁을 하며 1,000만 원을 전달하였다. 그 후, 甲은 영국으로 출국하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲과 丙은 대향범관계에 있으므로 丙이 기소되어 재판이 확정될 때까지의 기간 동안 甲의 뇌물공여에 관한 공소시효의 진행은 정지된다. ", "explanation": "뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 자는 강학상으로는 필요적 공범이라고 불리고 있으나, 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌규정에 따라 처벌되는 것이어서, 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며, 대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면 형사소송법 제253조 제2항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다(대판 2015.02.12. 2012도4842).", "answer": "X"}, {"year": "2021", "num": "4", "source": "21변시", "question": "A 분양대책위원회의 공동대표인 甲이 업무상 임무에 위배하여 주상복합아파트 일부 세대에 관한 분양계약서를 받아 그에 관한 소유권이전등기를 하여 재산상 이익을 취득하려고 하였으나 소유권이전등기를 마치지 못하였다. 이에 대하여 경찰의 내사가 시작되자 甲은 사법경찰관 丙의 동생인 乙에게 1,000만 원을 주면서 이를 丙에게 주고 사건을 미리 잘 무마해 줄 것을 부탁하였고, 乙은 丙에게 같은 취지의 부탁을 하며 1,000만 원을 전달하였다. 그 후, 甲은 영국으로 출국하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 영국 체류 중에 현지 물품 구매대행업을 하면서 국내 구매자들로부터 돈을 받고도 구매자들의 사전 동의 없이 임의로 소비하여 횡령하자 구매자들이 甲을 고소하였다. 만약 위 고소와 관련하여 甲이 자신의 누나로부터 한국경찰의 출석통지 소식을 전해 들었음에도 형사처분을 면할 목적으로 귀국하지 않고 영국에 계속 체류히는 경우라 할지라도, 甲이 국외에서 범죄를 저지르고 국외에서 체류를 계속하는 경우이므로 甲의 위 횡령에 대한 공소시효의 진행은 정지되지 않는다. ", "explanation": "형사소송법 제253조 제3항은 “범인이 형사처분을 면할 목적으로 국외에 있는 경우 그 기간 동안 공소시효는 정지된다\"라고 규정하고 있다. 위 규정의 입법 취지는 범인이 우리나라의 사법권이 실질적으로 미치지 못하는 국외에 체류한 것이 도피의 수단으로 이용된 경우에 체류기간 동안은 공소시효가 진행되는 것을 저지하여 범인을 처벌할 수 있도록 하여 형벌권을 적정하게 실현하고자 하는 데 있다. 따라서 위 규정이 정한 ‘범인이 형사처분을 면할 목적으로 국외에 있는 경우’는 범인이 국내에서 범죄를 저지르고 형사처분을 면할 목적으로 국외로 도피한 경우에 한정되지 아니하고, 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우도 포함된다(대판 2015.06.24. 2015도5916).", "answer": "X"}, {"year": "2021", "num": "4", "source": "21변시", "question": "A 분양대책위원회의 공동대표인 甲이 업무상 임무에 위배하여 주상복합아파트 일부 세대에 관한 분양계약서를 받아 그에 관한 소유권이전등기를 하여 재산상 이익을 취득하려고 하였으나 소유권이전등기를 마치지 못하였다. 이에 대하여 경찰의 내사가 시작되자 甲은 사법경찰관 丙의 동생인 hoice": "만약 甲 이 피의자신문을 받으면서 사법경찰관 P 에게 ‘ A종중으로부터 X토지 에 관한 근저당권설정 행위에 대하여 동의를 받은 일 이 없다’고 진술하였고 P가 甲의 횡령행위에 대한 제1심 공판절차에 증인으로 출석하여 甲 이 피의자 조사과정에서 위와 같이 진술하였다고 진술하였다면, 이러한 P 의 법정진술은 甲의 동의가 없다고 하더라도 甲의 위 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한하여 甲에 대하여 증거능력이 있다.", "explanation": "P의 법정진술은 피고인 甲의 진술을 그 내용으로 하고 있는 것인바 설문에서 甲의 동의가 없더라도 형사소송법 제 316조 제 1 항의 요건을 충족하면 유죄의 증거로 쓸 수 있다.", "answer": "O"}, {"year": "2021", "num": "9", "source": "21변시", "question": "甲은 드라이버로 문을 열고 A의 집에 절도 목적으로 침입하였고, 순찰 중이던 경찰관 P는 A의 신고를 받고 즉시 현장에 출동하여 A소유의금 목걸이를 훔쳐서 A의 집에서 나오던 甲을 발견하고 적법하게 현행범으로 체포하면서 甲을 경찰차에 태우려고 하였다. 이에 甲은 친구 집에서 나온 것이라고 하면서 P으| 체포에 저항하였고, 그 과정에서 P를 때려 2주간의 치료를 요하는 상해를 가하였다. 이에 검사는 甲을 절도, 공무집행방해와 상해로 기소하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 법원이 절도 공소사실에 대하여 간이공판절차에 의하여 심판할 것을 결정하였다면, 사법경찰관 작성의 A에 대한 참고인 진술조서는 甲이 증거로 함에 동의한 것으로 간주되므로 甲이 이를 증거로 함에 이의를 제기하더라도 甲에 대한 유죄의 증거로 쓸 수 있다.", "explanation": "간이공판절차에서 전문증거에 대해 당사지동의가 간주되지만 이의가 있는 경우에는 간주되지 않는다.", "answer": "X"}, {"year": "2020", "num": "1", "source": "20변시", "question": "시청 건설국장인 甲은 건설업자인 乙이 건축허가를 신청하자 “해당 토지가 자연녹지라서 건축허가를 내 줄 수 없다. 돈을 주면 어떻게든 건축허가를 내 주겠다\"라고 거짓말하여 乙로부터 500만 원을 받았다. 乙은 동업자 A에게 “내가 甲에게 500만 원을 줬으니 건축허가는 잘 해결될 것이다\"라고 알려 주었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 甲은 뇌물수수죄로, 乙은 뇌물공여죄로 기소되어 공동피고인으로 출석하고 있는 법정에서 A가 Z로부터 들은 대로 증언한 경우라면, A의 증언은 甲에 대하여 증거능력이 없다.", "explanation": "형사소송법 제316조 제2항에 의하면 피고인 아닌 자의 공판준비 또는 공판 기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 것인 때에는 원진술자가 사망, 질병 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에 한하여 이를 증거로 할 수 있다고 규정하고 있는데 여기서 말하는 “피고인 아닌 타인”이라 함은 제3자는 말할 것도 없고 공동피고인이나 공범자를 모두 포함한다(대판 1984.11.27. 84도2279). 사안에서 乙은 甲의 뇌물죄의 공범으로서 피고인 甲에 대해 형사소송법 제316조 제2항 피고인 아닌 타인에 해당한다 따라서 乙의 피고인 甲에 진술을 내용으로 하는 A의 증언은 형사소송법 제316조 제2항에 의해 원칙적으로 증거능력이 없다.", "answer": "O"}, {"year": "2020", "num": "1", "source": "20변시", "question": "시청 건설국장인 甲은 건설업자인 乙이 건축허가를 신청하자 “해당 토지가 자연녹지라서 건축허가를 내 줄 수 없다. 돈을 주면 어떻게든 건축허가를 내 주겠다\"라고 거짓말하여 乙로부터 500만 원을 받았다. 乙은 동업자 A에게 “내가 甲에게 500만 원을 줬으니 건축허가는 잘 해결될 것이다\"라고 알려 주었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 甲은 뇌물수수죄로, 乙은 뇌물공여죄로 기소되어 병합심리되었는데,甲은 부인하고 6은 자백한 경우라면 다른 증거가 없더라도 법원은 甲에 대하여 유죄선고를 할 수 있다.", "explanation": "형사소송법 제1310조의 피고인의 자백에는 공범인 공동피고인의 진술이 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는데 있어서 증거로 쓸 수 있다(대판 1990.10.30. 90도1939).", "answer": "O"}, {"year": "2020", "num": "1", "source": "20변시", "question": "시청 건설국장인 甲은 건설업자인 乙이 건축허가를 신청하자 “해당 토지가 자연녹지라서 건축허가를 내 줄 수 없다. 돈을 주면 어떻게든 건축허가를 내 주겠다\"라고 거짓말하여 乙로부터 500만 원을 받았다. 乙은 동업자 A에게 “내가 甲에게 500만 원을 줬으니 건축허가는 잘 해결될 것이다\"라고 알려 주었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 甲만 먼저 뇌물수수죄로 기소되었다면, 乙의 뇌물공여죄에 대한 공소시효는 甲에 대한 공소가 제기된 때부터 당해 사건의 재판이 확정될 때까지의 기간 동안 정지된다.", "explanation": "형사소송법 제248조 제1항, 제253조 제1항, 제2항에서 규정하는 바와 같이, 형사소송법은 공범 사이의 처벌에 형평을 기하기 위하여 공범 중 1인에 대한 공소의 제기로 다른 공범자에 대하여도 공소시효가 정지되도록 규정하고 있는데, 위 공범의 개념이나 유형에 관하여는 아무런 규정을 두고 있지 아니하다. 따라서 형사소송법 제253조 제2항의 공범을 해석할 때에는 공범 사이의 처벌의 형평이라는 위 조항의 입법 취지, 국가형벌권의 적정한 실현이라는 형사소송법의 기본이념, 국가형벌권 행사의 대상을 규정한 형법 등 실체법과의 체계적 조화 등의 관점을 종합적으로 고려하여야 하고, 특히 위 조항이 공소제기 효력의 인적 범위를 확장하는 예외를 마련하여 놓은 것이므로 원칙적으로 엄격하게 해석하여야 하고 피고인에게 불리한 방향으로 확장하여 해석해서는 아니 된다. 뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 지는 강학상으로는 필요적 공범이라고 불리고 있으나, 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌규정에 따라 처벌되는 것이어서 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며, 대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면, 형사소송법 제253조 제2헝에서 말히는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다(대판 2015.02.12. 2012도4842).", "answer": "X"}, {"year": "2020", "num": "3", "source": "20변시", "question": "(ㄱ)甲은 乙과 공모하여 A가 운영하는 식당에서 A 소유의 현금 10만 원과 신용카드를 절취하고 乙은 그 동안 망을 보았다. 그 후 (ㄴ)甲은 B가 운영하는 주점에서 술을 마시고 절취한 위 신용카드를 이용하여 술값 50만 원을 결제하였는데, 이 때 甲은 술값이 기재된 매출전표의 서명란에 A의 이름을 기재하고 그 자리에서 B에게 위 매출전표를 교부하였다. 甲은 특수절도죄, 사기죄 등으로,乙은 특수절도죄로 기소되었다. 그런데 甲은 법정에서 乙과의 범행일체를 자백하였으나 Z은 이를 모두 부인하였고, 한편 압수된 위 현금 10만 원과 신용카드가 증거물로 제출되었다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄷ. 만약 乙이 망을 본 사실이 인정되지 않는다면, 법원은 공소장변경이 없더라도 甲에 대하여 단순절도죄로 유죄를 인정할 수 있다.", "explanation": "乙이 망을 본 사실이 인정되지 않는다면, 법원은 공소장변경절차 없이 법원은 乙을 단순절도죄로 처벌할수 있다. (판례)특수절도죄로 공소제기한 사실을 법원이 검사의 공소장변경 절차없이 절도죄로 인정하더라도 공소원\n인 사실의 동일성에 변경이 없으므로 위법이라 할 수 없다(대판 1973.07.24. 73도1256).", "answer": "O"}, {"year": "2020", "num": "3", "source": "20변시", "question": "(ㄱ)甲은 乙과 공모하여 A가 운영하는 식당에서 A 소유의 현금 10만 원과 신용카드를 절취하고 乙은 그 동안 망을 보았다. 그 후 (ㄴ)甲은 B가 운영하는 주점에서 술을 마시고 절취한 위 신용카드를 이용하여 술값 50만 원을 결제하였는데, 이 때 甲은 술값이 기재된 매출전표의 서명란에 A의 이름을 기재하고 그 자리에서 B에게 위 매출전표를 교부하였다. 甲은 특수절도죄, 사기죄 등으로,乙은 특수절도죄로 기소되었다. 그런데 甲은 법정에서 乙과의 범행일체를 자백하였으나 Z은 이를 모두 부인하였고, 한편 압수된 위 현금 10만 원과 신용카드가 증거물로 제출되었다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 만약 사법경찰관이 식당 현장상황에 관하여 甲의 범행재연사진을 포함하여 검증조서를 작성하였다면, 그 검증조서 중 위 사진 부분은 비진술증거이므로 피고인 甲이 증거로 함에 동의하지 않았더라도 증거능력이 있다.", "explanation": "검증 현장에서의 범행 재연은 자백에 해당되므로 그 범행재연사진 부분은 진술증거에 해당한다. 따라서 검증의 주체에 따라 제312조 제1항 내지 제3항을 적용해야 한다. 사안의 경우 검증의 주체가 사법 경찰관이므로 제312조 제3항에 따라 위 검증조서의 사진 부분의 증거능력을 검토해야 한다. (판례)‘사법경찰관이 작성한 검증조서 중 피고인의 진술 부분을 제외한 기재 및 사진의 각 영상’에는 이 사건 범행에 부합되는 피의자이었던 피고인이 범행을 재연하는 사진이 첨부되어 있으나, 기록에 의하면 행위자인 \n피고인이 위 검증조서에 대하여 증거로 함에 부동의하였고 공판정에서 검증조서 중 범행을 재연한 부분에 대하여 그 성립의 진정 및 내용을 인정한 흔적을 찾아 볼 수 없고 오히려 이를 부인하고 있으므로 그 증거능력을 인정할 수 없는바, 원심으로서는 위 검증조서 중 피고인의 진술 부분 뿐만 아니라 범행을 재연한 부분까지도 제외한 나머지 부분만을 증거로 채용하여야 함에도 이를 구분하지 아니한 채 피고인의 진술 부분을 제외한 나머지를 유죄의 증거로 인용한 조치는 위법하다(대판 2007.04.26. 2007도1794).", "answer": "X"}, {"year": "2020", "num": "3", "source": "20변시", "question": "(ㄱ)甲은 乙과 공모하여 A가 운영하는 식당에서 A 소유의 현금 10만 원과 신용카드를 절취하고 乙은 그 동안 망을 보았다. 그 후 (ㄴ)甲은 B가 운영하는 주점에서 술을 마시고 절취한 위 신용카드를 이용하여 술값 50만 원을 결제하였는데, 이 때 甲은 술값이 기재된 매출전표의 서명란에 A의 이름을 기재하고 그 자리에서 B에게 위 매출전표를 교부하였다. 甲은 특수절도죄, 사기죄 등으로,乙은 특수절도죄로 기소되었다. 그런데 甲은 법정에서 乙과의 범행일체를 자백하였으나 Z은 이를 모두 부인하였고, 한편 압수된 위 현금 10만 원과 신용카드가 증거물로 제출되었다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 만약 검찰주사보가 A와의 전화대화내용을 문답형식의 수사보고서로 작성하였다면, 위 수사보고서는 전문증거로서 「형사소송법」 제313조가 적용되는데 수사보고서에 진술자 A의 서명 또는 날인이 없으므로 증거능력이 없다.", "explanation": "검찰주사보 작성의 A와의 문답형식 수사보고서는, A의 서명 또는 날인이 없어 증거능력이 부정된다. (판례)외국에 거주하는 참고인과의 전화 대화내용을 문답형식으로 기재한 검찰주사보 작성의 수사보고서는 전문증거로서 형사소송법 제310조의2에 의하여 제311조 내지 제316조에 규정된 것 이외에는 이를 증거로 삼을 수 없는 것인데, 위 수사보고서는 제311조, 제312조, 제315조, 제316조의 적용대상이 되지 아니함이 분명하므로, 결국 제313조의 진술을 기재한 서류에 해당하여야만 제314조의 적용 여부가 문제될 것인바, 제313조가 적용되기 위하여는 그 진술을 기재한 서류에 그 진술자의 서명 또는 날인이 있어야 한다(대판 1999.02.26. 98도2742).", "answer": "O"}, {"year": "2020", "num": "4", "source": "20변시", "question": "甲과 乙은 길거리에서 서로 몸싸움을 하였다. 출동한 경찰관 P가 甲과 乙을 현행범으로 체포하려고 하자 (ㄱ)甲이 P의 얼굴을 주먹으로 쳐 P에게 2주간의 치료를 요하는 타박상을 가하였다. 현장을 벗어난 (ㄴ)甲은 혈중알콜농도 0.1%의 상태에서 승용차를 타고 에어컨을 가동하기 위하여 시동을 걸어 놀고 잠을 자던 중 변속기를 잘못 건드려 자동차가 앞으로 약 1m 가다가 멈추었다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙이 나중에 “甲이 경찰관의 얼굴을 때리는 것을 보았다\"라고 한 말을 친구 A가 보이스펜으로 녹음한 파일은 乙이 그 진정성립을 부인하더라도 (ㄱ)행위의 목격사실을 부인하는 乙의 법정진술의 증명력을 다투기 위한 증거로 사용할 수 있다.", "explanation": "형사소송법 제313조 제1항의 피고인 아닌 자의 진술을 기재한 서류에 해당하는 당해 녹음한 파일은 진술자인 乙이 진정성립을 부인하였으므로 증거능력은 부정되나, 형사소송법 제318조의2에 의하여 (ㄱ)행위의 목격사실을 부인하는 乙의 법정진술의 증명력을 다투기 위한 증거로 사용될 수 있다. (판례) 수사기관이 아닌 사인이 피고인 아닌 사람과의 대화내용을 녹음한 녹음테이프는 형사소송법 제311조, 제312조 규정 이외의 피고인 아닌 자의 진술을 기재한 서류와 다를 바 없으므로, 피고인이 그 녹음 테이프를 증거로 할 수 있음에 동의하지 아니하는 이상 그 증거능력을 부여하기 위하여는 첫째, 녹음테이프가 원본이거나 원본으로부터 복사한 사본일 경우(녹음디스크에 복사할 경우에도 동일하다)에는 복사과정에서 편집되는 등의 인위적 개작 없이 원본의 내용 그대로 복사된 사본일 것, 둘째 형사소송법 제313조 제1항에 따라 공판준비나 공판기일에서 원진술자의 진술에 의하여 그 녹음테이프에 녹음된 각자의 진술내용이 자신이 진술한 대로 녹음된 것이리는 점이 인정되어야 할 것이고 사인이 피고인 아닌 사람과의 대화내용을 대화 상대방 몰래 녹음하였다고 하더라도 위와 같은 조건이 갖추어진 이상 그것만으로는 그 녹음테이프가 위법하게 수집된 증거로서 증거능력이 없다고 할 수 없으며 사인이 피고인 아닌 사람과의 대화내용을 상대방 몰래 비디오로 촬영·녹음한 경우에도 그 비디오테이프의 진술부분에 대하여도 위와 마찬가지로 취급하여야 할 것이다(대판 1999.03.09. 98도3169).\n", "answer": "O"}, {"year": "2020", "num": "4", "source": "20변시", "question": "甲과 乙은 길거리에서 서로 몸싸움을 하였다. 출동한 경찰관 P가 甲과 乙을 현행범으로 체포하려고 하자 (ㄱ)甲이 P의 얼굴을 주먹으로 쳐 P에게 2주간의 치료를 요하는 타박상을 가하였다. 현장을 벗어난 (ㄴ)甲은 혈중알콜농도 0.1%의 상태에서 승용차를 타고 에어컨을 가동하기 위하여 시동을 걸어 놀고 잠을 자던 중 변속기를 잘못 건드려 자동차가 앞으로 약 1m 가다가 멈추었다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲과 乙이 기소되어 병합심리되었는데, 甲이 피고인신문절차에서 “乙이 먼저 나를 폭행하였다\"라는 진술을 하였다면 이 진술은 乙의 폭행죄에 대하여 증거능력이 있다.", "explanation": "증인신문절차를 거쳐야 피고인과 별개의 범죄사실로 기소되어 병합 심리중인 공동피고인의 법정진술에 대하여 증거능력을 인정할 수 있다. - 갑을 을의 공소사실에 대하여 공범 아닌 공동피고인이다. (판례)피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로 선서 없이 한 공동피고인의 법정진술이나 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자 신문조서는 피고인의 공소 범죄사실을 인정하는 증거로 할 수 없다(대판 1982.09.14. 82도1000).", "answer": "X"}, {"year": "2020", "num": "4", "source": "20변시", "question": "甲과 乙은 길거리에서 서로 몸싸움을 하였다. 출동한 경찰관 P가 甲과 乙을 현행범으로 체포하려고 하자 (ㄱ)甲이 P의 얼굴을 주먹으로 쳐 P에게 2주간의 치료를 요하는 타박상을 가하였다. 현장을 벗어난 (ㄴ)甲은 혈중알콜농도 0.1%의 상태에서 승용차를 타고 에어컨을 가동하기 위하여 시동을 걸어 놀고 잠을 자던 중 변속기를 잘못 건드려 자동차가 앞으로 약 1m 가다가 멈추었다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙이 제1심에서 폭행죄로 벌금 100만 원을 선고받고 항소하였는데 항소심 계속 중 甲이 乙에 대한 처벌의사를 철회하였다면, 항소심 법원은 乙에게 공소기각판결을 하여야 한다.", "explanation": "항소심 계속 중이라면 1심판결 이후이므로 甲이 乙에 대한 처벌의사를 철회하여도 공소기각판결을 선고할 수 없다.", "answer": "X"}, {"year": "2020", "num": "5", "source": "20변시", "question": "상습도박자인 甲은 도박의 습벽 없는 乙을 도박에 가담하도록 교사하였고, 이를 승낙한 乙은 丙을 포힘한 4명이 참여하고 있는 도박에 가담하였다. 이웃 주민의 신고로 도박 현장에 출동한 사법경찰관 P1 이 도박을 하고 있던 丙을 현행범으로 체포하려고 하자 丙은 휴대하고 있던 등산용 칼을 휘둘러 P1 에게 전치 4주의 상해를 가하였다. 사법경찰관 P2는 甲과 乙에 대한 피의자신문조서를 작성하였는데,乙에 대한 피의자신문조서에는 甲의 교사에 의해 도박에 가담하게 되었다는 자백 취지의 진술이 기재되어 있다. 한편 甲이 수사과정에서 L을 변호인으로 선임하여 상습도박 혐의를 빠져나갈 수 있는 방법에 대해 자문을 구하자 L은 이에 대한 자문의견서를 甲에게 이메일로 송부하였는데, P2는 적법하게 그 자문의견서를 압수하였다. 기소된 甲과 乙이 병합심리를 받던 중 乙은 외국으로 이민을 떠났다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 검사가 甲에 대한 유죄의 증거로 자문의견서를 제출하자 甲이 증거로 함에 부동의하였고, 증인으로 소환된 L이 증언거부권이 있음을 이유로 증언을 거부한 경우, 그 자문의견서는 증거능력이 인정된다.", "explanation": "설문에서 변호인 L이 작성한 상습도박 혐의를 빠져나갈 수 있는 방법에 관한 의견서는 형사소송법 제313조 제1항의 진술서에 해당하므로 피고인이 증거로 하는데 동의하지 않으면 작성자인 L에 의해 성립의 진정이 인정되어야 증거로 사용할 수 있다. 그런데 L이 증언을 거부함에 따라 L이 작성한 의견서는 형사소송법 제314조의 요건을 갖추어야 증거능력을 인정할 수 있을 텐데, L의 증언거부권행사는 그것이 정당한지 여부와 무관하게 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않아 증거능력이 부정된다. (판례) 증인이 형사소송법에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다(대판 2012.05. 17. 2009도6788(전합)). 수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못하였다면, 설령 그 증언거부가 정당하지 않은 것이라 하더라도, 피고인이 그러한 증언거부 상황을 초래하였다는 등 특별한 사정이 없는 한 형사소송법 저11314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다(대판 2019.11.21. 2018도13945).", "answer": "X"}, {"year": "2020", "num": "5", "source": "20변시", "question": "상습도박자인 甲은 도박의 습벽 없는 乙을 도박에 가담하도록 교사하였고, 이를 승낙한 乙은 丙을 포힘한 4명이 참여하고 있는 도박에 가담하였다. 이웃 주민의 신고로 도박 현장에 출동한 사법경찰관 P1 이 도박을 하고 있던 丙을 현행범으로 체포하려고 하자 丙은 휴대하고 있던 등산용 칼을 휘둘러 P1 에게 전치 4주의 상해를 가하였다. 사법경찰관 P2는 甲과 乙에 대한 피의자신문조서를 작성하였는데,乙에 대한 피의자신문조서에는 甲의 교사에 의해 도박에 가담하게 되었다는 자백 취지의 진술이 기재되어 있다. 한편 甲이 수사과정에서 L을 변호인으로 선임하여 상습도박 혐의를 빠져나갈 수 있는 방법에 대해 자문을 구하자 L은 이에 대한 자문의견서를 甲에게 이메일로 송부하였는데, P2는 적법하게 그 자문의견서를 압수하였다. 기소된 甲과 乙이 병합심리를 받던 중 乙은 외국으로 이민을 떠났다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 검사가 甲에 대한 유죄의 증거로 P2가 작성한 乙에 대한 피의자신문조서를 제출하자 甲이 그 조서의 내용을 부인하면서 증거로 함에 부동의한 경우, 원진술자인 乙이 외국에 거주 중이므로 증거능력이 인정된다.", "explanation": "설문에서 사법경찰관 P2가 작성한 공범 乙에 대한 피의자신문조서는 당해 피고인인 甲이 그 내용을 부인하였으므로 형사소송법 제312조 제3항 뿐 아니라 같은 법 제314조에 의해서도 증거능력이 인정되지 않는다(대판 2009.11.26. 2009도6602 참조). 개정 형시소송법 하에서는 공범에 대한 검사 작성 피의자신문조서에 대해서도 제314조가 적용되지 않는다고 해석된다. 공범의 법정진술에 의해 성립의 진정이 인정되더라도 당해 피고인이 그 조서의 내용을 부인하면 증거능력이 부정되기 때문이다(이창현 형사소송법 제9판, p.901 참조) (판례)경찰 피의자신문조서는 검사 이외의 수사기관이 작성한 피고인과 공범관계에 있는 다른 피의자에 대한 피의자신문조서 또는 공동피의자에 대한 피의자신문조서로서 형사소송법 제312조 제3항이 적용되어 당해 피고인이 공판기일에서 그 조서의 내용을 부인하떤 증거능댁이 부정되고, 또한 형사소송법 제314조에 의하여 예외적으로 증거능력이 인정될 여지가 없는 것이다(대판 2009.11.26. 2009도6602). ", "answer": "X"}, {"year": "2020", "num": "6", "source": "20변시", "question": "甲은 2019. 8. 1. A에게 X건물을 2억 원에 매도하였다. 甲은 A로부터 2019.8. 1. 계약금 2,000만 원, 2019. 9. 1. 중도금 8,000만 원을 지급받았다.\n그런데 甲은 2019. 11. 1. A로부터 잔금 1억 원을 지급받고 소유권이전등기 관련 서류를 교부해 주기로 하였음에도 2019. 10. 1. B에게 X건물을 매매대금 3억 원에 매도하면서, B로부터 매매대금 전액을 지급받고 2019. 10. 30. B에게 그 소유권이전등기를 마쳐 주었다. 이에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 만약 甲이 Y건물을 추가로 이중매매하였고 검사가 甲의 X, Y건물에 대한 배임행위를 포괄하여 특정경제범죄가중처벌등에관한법률위반(배임)죄로 기소하였는데 법원 심리 결과 단순 배임죄의 경합범으로 확인되었다면, 법원은 공소장변경이 없더라도 단순 배임죄의 경합범으로 유죄를 인정할 수 있다.", "explanation": "사안에서 포괄일죄로 보아 특경법을 적용한 공소사실에 대하여 법원의 심리결과 경합범으로 확인된 경우 공소장 변경 없이 단순배임죄의 경합범을 인정할 수 있다. 이렇게 하여도 동일한 범죄사실을 두고 법률적 평가를 달리 한 것에 불과하여 피고인의 방어권행사에 불이익을 초래할 염려가 없기 때문이다.", "answer": "O"}, {"year": "2020", "num": "7", "source": "20변시", "question": "甲과 乙은 공모하여 A의 자전거를 편취한 사기죄의 공범으로, 丙은 甲·乙이 편취한 정을 알고도 위 자전거를 매수한 장물취득죄로 함께 기소된 공동피고인이다. 甲은 공소사실을 부인하고 있는 반면,乙과  丙은 공소사실을 자백하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "① 乙의 법정진술은 이에 대한 甲의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 甲에 대한 유죄의 증거로 사용할 수 있다.", "explanation": "공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있다(대판 1987.07.07. 87도973). ", "answer": "O"}, {"year": "2020", "num": "7", "source": "20변시", "question": "甲과 乙은 공모하여 A의 자전거를 편취한 사기죄의 공범으로, 丙은 甲·乙이 펀취한 정을 알고도 위 자전거를 매수한 장물취득죄로 함께 기소된 공동피고인이다. 甲은 공소사실을 부인하고 있는 반면,乙과  丙은 공소사실을 자백하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "② 甲을 조사하였던 사법경찰관 P가 법정에서 \"甲이 수사과정에서 범행을 자백하였다.\"라고 진술하였을 경우, 甲의 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명되면, P의 법정진술을 甲에 대한 유죄의 증거로 사용할 수 있다.", "explanation": "형사소송법 제316조 참조.", "answer": "O"}, {"year": "2020", "num": "7", "source": "20변시", "question": "甲과 乙은 공모하여 A의 자전거를 편취한 사기죄의 공범으로, 丙은 甲·乙이 펀취한 정을 알고도 위 자전거를 매수한 장물취득죄로 함께 기소된 공동피고인이다. 甲은 공소사실을 부인하고 있는 반면,乙과  丙은 공소사실을 자백하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "③ 乙에 대한 검사 작성의 피의자신문조서는 적법한 절차와 방식에 따라 작성된 것으로서 乙이 법정에서 실질적 진정성립을 인정하고 임의성과 특신상태가 인정되며 甲에게 반대신문의 기회가 부여된 경우에는 甲이 이를 증거로 함에 부동의하였더라도 甲에 대한 유죄의 증거로 사용할수 있다.", "explanation": "2020. 2. 4. 법률 제16924호로 개정되어 2022. 1. 1.부터 시행된 형사소송법 제312조 제1항은 검사가 작성한 피의자신문조서의 증거능력에 대하여 ‘적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다.’고 규정하였다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. 형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의지신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023 도3741).", "answer": "X"}, {"year": "2020", "num": "7", "source": "20변시", "question": "甲과 乙은 공모하여 A의 자전거를 편취한 사기죄의 공범으로, 丙은 甲·乙이 펀취한 정을 알고도 위 자전거를 매수한 장물취득죄로 함께 기소된 공동피고인이다. 甲은 공소사실을 부인하고 있는 반면,乙과  丙은 공소사실을 자백하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 乙에 대한 사법경찰관 작성의 피의자신문조서를 甲이 내용부인의 취지로 증거로 함에 부동의하는 경우에는 乙이 성립의 진정과 내용을 인정하는지 여부와 상관없이 그 피의자신문조서를 甲에 대한 유죄의 증거로 사용할 수 없다.", "explanation": "乙에 대한 사경작성 피의자신문조서에 대해 乙이 성립의 진정과 내용을 인정하는지 여부와 상관없이 甲이 내용을 부인하면 甲에 대한 유죄의 증거로 사용할 수 없다. [판례] 형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다(대판 2010.02.25. 2009도14409).", "answer": "O"}, {"year": "2020", "num": "7", "source": "20변시", "question": "甲과 乙은 공모하여 A의 자전거를 편취한 사기죄의 공범으로, 丙은 甲·乙이 펀취한 정을 알고도 위 자전거를 매수한 장물취득죄로 함께 기소된 공동피고인이다. 甲은 공소사실을 부인하고 있는 반면,乙과  丙은 공소사실을 자백하고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 만약 乙만 사기죄로 먼저 공소제기 되어 재판을 받았고,이후에 甲, 丙이 따로 공소제기 되었다면,乙에 대한 피고사건에서 작성된 공판조서 는「형사소송법」제311조(법원 또는 법관의 조서)에 해당하므로 甲에 대한 유죄의 증거로 사용할 수 있다.", "explanation": "제311조의 공판조서는 당해 사건을 의미한다. 설문에서 을의 사기죄와 별도로 공소제기 된 갑, 병의 사건은 을의 사기죄와 다른 사건이다. 따라서 을에 대한 피고사건에서 작성된 공판조서를 갑과 병의 공소사실에 대한 유죄의 증거로 사용하는데 있어서 제311조가 근거가 될 수는 없다. 다만 제315조 제3호에 의해 증거로 사용할 여지는 있다.", "answer": "X"}, {"year": "2020", "num": "8", "source": "20변시", "question": "甲은 동생인 乙과 공모하여 함께 丙을 상대로 토지거래허가에 필요한 서류라고 속여서 丙으로 하여금 근저당권설정계약서 등에 서명, 날인하게 하고 丙의 인감증명서를 교부받은 다음, 이를 이용하여 丙 소유의 토지에 관하여 甲을 채무자로 하는 채권최고액 3억 원인 근저당권을 丁에게 설정하여 주고 丁으로부터 2억 원을 차용하였다.\n검사는 甲과 乙을 함께 공소제기하였다. 법정에서 甲은 변론분리 후 증인으로 증언하면서 자신의 단독 범행이라고 허위의 진술을 하였다. 이에 검사는 甲을 위증 혐의로 소환하여 乙과 공범이며 법정에서 위증하였음을 인정하는 취지의 피의자신문조서를 작성하여 증거로 제출하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "② 검사가 추가로 제출한 甲에 대한 위증 혐의의 피의자신문조서는 원진술자인 甲이 다시 법정에서 증언하면서 위 조서의 진정 성립을 인정하고 乙에게 반대신문의 기회가 부여되었다면 乙에 대한 유죄의 증거로 사용할 수 있다.", "explanation": "공판준비 또는 공판기일에서 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서를 유죄의 증거로 삼는 것은 당사자주의·공판중심주의·직접주의를 지향하는 현행 형사소송법의 소송구조에 어긋나는 것일 뿐만 아니라, 헌법 제27조가 보장하는 기본권, 즉 법관의 면전에서 모든 증거자료가 조사·진술되고 이에 대하여 피고인이 공격·방어할 수 있는 기회가 실질적으로 부여되는 재판을 받을 권리를 침해하는 것이므로, 이러한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 아니하는 한 증거능력이 없고, 그 후 원진술자인 종전 증인이 다시 법정에 출석하여 증언을 하면서 그 진술조서의 성립의 진정함을 인정하고 피고인 측에 반대신문의 기회가 부여되었다고 하더라도 그 증언 자체를 유죄의 증거로 할 수 있음은 별론으로 하고 위와 같은 진술조서의 증거능력이 없다는 결론은 달리할 것이 아니다. 이는 검사가 공판준비 또는 공판기일에서 이미 증언을 마친 증인에게 수사기관에 출석할 것을 요구하여 그 증인을 상대로 위증의 혐의를 조사한 내용을 담은 피의자신문조서의 경우도 마찬가지이다(대판 2013.08.14. 2012도13665).", "answer": "X"}, {"year": "2020", "num": "8", "source": "20변시", "question": "甲은 동생인 乙과 공모하여 함께 丙을 상대로 토지거래허가에 필요한 서류라고 속여서 丙으로 하여금 근저당권설정계약서 등에 서명, 날인하게 하고 丙의 인감증명서를 교부받은 다음, 이를 이용하여 丙 소유의 토지에 관하여 甲을 채무자로 하는 채권최고액 3억 원인 근저당권을 丁에게 설정하여 주고 丁으로부터 2억 원을 차용하였다.\n검사는 甲과 乙을 함께 공소제기하였다. 법정에서 甲은 변론분리 후 증인으로 증언하면서 자신의 단독 범행이라고 허위의 진술을 하였다. 이에 검사는 甲을 위증 혐의로 소환하여 乙과 공범이며 법정에서 위증하였음을 인정하는 취지의 피의자신문조서를 작성하여 증거로 제출하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 만약 甲이 위 사기범행을 인정하는 취지의 乙·丁간의 대화내용을 몰래 녹음하였다면, 그 녹음파일은 乙에 대한 유죄의 증거로 사용할 수 있다.", "explanation": "통신비밀보호법을 위반하여 수집한 증거로 위법수집증거에 해당한다. 따라서 308조의 2에 따라 증거능력이 부정된다.", "answer": "X"}, {"year": "2020", "num": "9", "source": "20변시", "question": "유흥주점 단속업무를 담당하고 있는 공무원 甲과 乙은 뇌물을 수수하기로 공모하여 유흥주점을 운영하는 丙을 찾아가 단속을 무마해 달라는 취지의 뇌물 4,000만 원을 수수하였다. 사무실로 돌아간 후 甲, 乙은 각자 2,000만 원씩 나누어 가졌다. 乙은 그 돈을 바로 자신의 예금계좌에 입금하였다가 일주일 뒤 양심의 가책을 받아 丙에게 전액 반환하였다. 甲, 乙, 丙은 위와 같은 범죄사실로 공동피고인으로 재판중이다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 공판과정에서 丙은 甲, 乙에게 준 돈의 명목을 대여금이라고 주장하면서 범행을 부인하고 있는데 乙에 대한 피고인신문 과정 중 이루어진 “甲과 함께 있는 자리에서 丙이 단속을 무마해 달라면서 우리에게 4,000만 원을 줬다.”는 乙의 진술은 丙에 대한 유죄의 증거로 사용될 수 있다.", "explanation": "공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립한 증거능력이 있다(대판 1992.07.28. 92도917) .", "answer": "O"}, {"year": "2020", "num": "10", "source": "20변시", "question": "다음 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㅁ. 모든 국민은 형사상 자기에게 불리한 진술을 강요당하지 아니할 권리가 보장되어 있으므로, 법원이 피고인의 진술거부권 행사를 가중적 양형의 조건으로 삼는 것은 어떠한 경우에도 허용될 수 없다.", "explanation": "형법 제51조 제4호에서 양형의 조건의 하나로 정하고 있는 범행 후의 정황 가운데에는 형사소송절차에서의 피고인의 태도나 행위를 들 수 있는데, 모든 국민은 형사상 자기에게 불리한 진술을 강요당하지 아니할 권리가 보장되어 있으므로(헌법 제12조 제2항), 형사소송절차에서 피고인은 방어권에 기하여 범죄사실에 대하여 진술을 거부하거나 거짓 진술을 할 수 있고, 이 경우 범죄사실을 단순히 부인하고 있는 것이 죄를 반성하거나 후회하고 있지 않다는 인격적 비난요소로 보아 가중적 양형의 조건으로 삼는 것은 결과적으로 피고인에게 자백을 강요하는 것이 되어 허용될 수 없다고 할 것이나, 그러한 태도나 행위가 피고인에게 보장된 방어권 행사의 범위를 넘어 객관적이고 명백한 증거가 있음에도 진실의 발견을 적극 적으로 숨기거나 법원을 오도하려는 시도에 기인한 경우에는 가중적 양형의 조건으로 참작될 수 있다(대판 2001.03.09. 2001도192).", "answer": "X"}, {"year": "2019", "num": "2", "source": "19변시", "question": "X회사의 대표이사 甲은 신축 중인 건물공사의 하도급과 관련하여 발주업체의 이사 乙에게 “개인채무변제에 필요하니 하도급 공사대금 20억 원을 23억 원으로 부풀리는데 눈감아 달라. 그리고 3억 원은 급하니 공사완료 전에 미리 개인적으로 지급해주면 2,000만 원을 주겠다\"라고 부탁하였고, 며칠 후 약속한 대로 업무상 보관 중이던 X회사의 비자금 2,000만 원을 그 정을 알고 있는 운전기사 丙에게 주면서 乙에게 그 돈을 전달하게 하였다. 丙은 甲에게서 받은 2,000만 원 중 1,000만 원은 자신의 유흥비로 소비하고 나머지 1,000만 원만 乙에게 교부하였다. 그로부터 일주일 후 甲은 丙에게 ‘'2,000만 원을 乙에게 잘 전달하였느냐?\"라고 물었고, 丙은 甲이 말한 내용을 보이스펜에 녹음하였다. 경찰관 P가 위 범행에 대한 제보를 받고 수사에 나서자 丙은 수사에 협조하여 선처를 받고자 甲의 말을 녹음해 두었던 원본 보이스펜을 P에게 임의제출하였다. 그 후 검사는 피의자 甲을 구속한 상태에서 수사를 진행하였다. 이에 관한 설명 중 옳지 않은 것은? (특별법 위반의 점은 논외로 하고, 다툼이 있는 경우 판례에 의함)", "choice": "만약 법정에서 甲에 대한 증거로 제출된 보이스펜의 녹음내용을 증거로 함에 甲이 부동의한 경우에는 보이스펜이 甲이 말한 내용을 녹음한 원본임이 입증되고, 「형사소송법」 제313조 제1항 단서에 따라 공판준비 또는 공판기일에서 丙의 진술에 의하여 보이스펜에 녹음된 甲의 진술내용이 甲이 진술한 대로 녹음된 것임이 증명되고, 그 진술이 특히 신빙할 수 있는 상태에서 행하여진 것임이 인정되면 보이스펜에 녹음된 진술의 증거능력을 인정할 수 있다.", "explanation": "녹음테이프 검증조서의 기재 중 고소인이 피고인과의 대화를 녹음한 부분은 타인간의 대화를 녹음한 것이 아니므로 위 법 제14조의 적용을 받지는 않지만, 그 녹음테이프에 대하여 실시한 검증의 내용은 녹음테이프에 녹음된 대화의 내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과하여 증거자료가 되는 것은 여전히 녹음테이프에 녹음된 대화의 내용이라 할 것인바, 그 중 피고인의 진술내용은 실질적으로 형사소송법 제311조, 제312조 규정 이외에 피고인의 진술을 기재한 서류와 다를 바 없으므로, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 그 녹음테이프 검증조서의 기재 중 피고인의 진술내용을 증거로 사용하기 위해서는 형사소송법 제313조
