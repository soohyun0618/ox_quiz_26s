.", "explanation": "甲, 乙, 丙은 공범관계에 있으므로 사법경찰관 작성의 공범인 공동피고인에 대한 피의자신문조서의 증거능력 인정요건이 문제된다. 이에 대해 判例는 형사소송법 제312조 제3항을 적용하면서 당해피고인이 내용을 인정해야 증거능력을 인정할 수 있다고 한다. \n[판례] 형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다. 그리고 이러한 경우 그 공동피고인이 법정에서 경찰수사 도중 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였다고 하더라도, 이러한 증언은 원진술자인 공동피고인이 그 자신에 대한 경찰 작성의 피의자신문조서의 진정성립을 인정하는 취지에 불과하여 위 조서와 분리하여 독자적인 증거가치를 인정할 것은 아니므로, 앞서 본 바와 같은 이유로 위 조서의 증거능력이 부정되는 이상 위와 같은 증언 역시 이를 유죄 인정의 증거로 쓸 수 없다(대판 2009.10.15. 2009도1889). ", "answer": "X"}, {"source": "22변시", "question": "甲과 乙은 丙과 공모하여 피해자 A로부터 금품을 갈취한 공소사실로 기소되었는데, 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였다. 검사는 丙의 동생인 B가 丙으로부터 \"나는 甲, 乙과 함께 A의 금품을 갈취하였다.\"라는 말을 들었다는 것을 알고, B를 조사하여 그와 같은 내용의 B에 대한 진술조서를 작성하였다. 甲과 乙은 공판과정에서 위 공소사실을 다투고 있다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙이 출석한 공판기일에서 乙을 조사한 사법경찰관이 법정에 증인으로 출석하여 乙에 대한 피의자신문을 하면서 乙이 자백하는 것을 들었던 내용을 증언한 경우, 그 증언은 乙의 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 경우라도 甲의 증거동의가 없는 한 甲에 대한 유죄 인정의 증거로 사용할 수 없다.", "explanation": "원진술자인 乙이 공판정에 출석하였으므로 필요성 요건이 충족되지 않아, 당해 피고인인 甲의 증거 동의가 있는 경우에 한하여 乙을 조사한 사법경찰관의 법정 증언에 증거능력이 부여된다. \n[판례] 형사소송법 제316조 제2항은 “피고인 아닌 자의 공판준비 또는 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 것인 때에는 원진술자가 사망, 질병, 외국거주, 소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없고, 그 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한하여 이를 증거로 할 수 있다”고 규정하고 있고, 같은 조 제1항에 따르면 위 ‘피고인 아닌 자’에는 공소제기 전에 피고인 아닌 타인을 조사하였거나 그 조사에 참여하였던 자(이하 ‘조사자’라고 한다)도 포함된다. 따라서 조사자의 증언에 증거능력이 인정되기 위해서는 원진술자가 사망, 질병, 외국거주, 소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없어야 하는 것이라서, 원진술자가 법정에 출석하여 수사기관에서 한 진술을 부인하는 취지로 증언한 이상 원진술자의 진술을 내용으로 하는 조사자의 증언은 증거능력이 없다(대판 2008.09.25. 2008도6985). \n형사소송법 제316조(전문의 진술) ②피고인 아닌 자의 공판준비 또는 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 것인 때에는 원진술자가 사망, 질병, 외국거주, 소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없고, 그 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한하여 이를 증거로 할 수 있다.\n형사소송법 제318조(당사자의 동의와 증거능력) ①검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다. ", "answer": "O"}, {"source": "22변시", "question": "甲과 乙은 丙과 공모하여 피해자 A로부터 금품을 갈취한 공소사실로 기소되었는데, 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였다. 검사는 丙의 동생인 B가 丙으로부터 \"나는 甲, 乙과 함께 A의 금품을 갈취하였다.\"라는 말을 들었다는 것을 알고, B를 조사하여 그와 같은 내용의 B에 대한 진술조서를 작성하였다. 甲과 乙은 공판과정에서 위 공소사실을 다투고 있다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "丙이 경찰에서 작성한 진술서는 그 작성이 특히 신빙할 수 있는 상태에서 행하여졌음이 증명된다면 甲이 증거로 사용함에 동의하지 않더라도 甲에 대한 유죄 인정의 증거로 사용할 수 있다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 해당 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 해당 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 해당 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 피의자의 법정진술에 의하여 성립의 진정이 인정되는 등 형사소송법 제312조 제4항의 요건을 갖춘 경우라도 해당 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없고, 그 당연한 결과로 위 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 진술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 형사소송법 제314조가 적용되지 아니한다(대판 2020.06.11. 2016도9367). ► 병은 갑과 공범 관계에 있는데, 병이 사망하여, 병에 대한 사법경찰관 작성의 피의자신문조서의 갑의 공소사실에 있어서의 증거능력이 문제된 사안이다. 한편, 수사과정에서 작성한 진술서 역시 피의자신문조서와 같이 판단해야할 것이다(형사소송법 제312조 제5항).\n형사소송법 제312조(검사 또는 사법경찰관의 조서 등) ③검사 이외의 수사기관이 작성한 피의자신문조서는 적법한 절차와 방식에 따라 작성된 것으로서 공판준비 또는 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한하여 증거로 할 수 있다. \n⑤제1항부터 제4항까지의 규정은 피고인 또는 피고인이 아닌 자가 수사과정에서 작성한 진술서에 관하여 준용한다.", "answer": "X"}, {"source": "22변시", "question": "甲과 乙은 丙과 공모하여 피해자 A로부터 금품을 갈취한 공소사실로 기소되었는데, 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였다. 검사는 丙의 동생인 B가 丙으로부터 \"나는 甲, 乙과 함께 A의 금품을 갈취하였다.\"라는 말을 들었다는 것을 알고, B를 조사하여 그와 같은 내용의 B에 대한 진술조서를 작성하였다. 甲과 乙은 공판과정에서 위 공소사실을 다투고 있다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "B에 대한 진술조서는 B가 증언을 거부하여 진정성립이 인정되지 않더라도 丙이 사망하여 진술할 수 없는 경우에 해당하므로 甲에 대한 유죄 인정의 증거로 사용할 수 있다.", "explanation": "현행 형사소송법 제314조의 문언과 개정 취지, 증언거부권 관련 규정의 내용 등에 비추어 보면, 법정에 출석한 증인이 형사소송법 제148조, 제149조 등에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우는 형사소송법 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 아니한다(대판 2012.05.17. 2009도6788).", "answer": "X"}, {"source": "22변시", "question": "甲과 乙은 丙과 공모하여 피해자 A로부터 금품을 갈취한 공소사실로 기소되었는데, 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였다. 검사는 丙의 동생인 B가 丙으로부터 \"나는 甲, 乙과 함께 A의 금품을 갈취하였다.\"라는 말을 들었다는 것을 알고, B를 조사하여 그와 같은 내용의 B에 대한 진술조서를 작성하였다. 甲과 乙은 공판과정에서 위 공소사실을 다투고 있다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "B에 대한 진술조서는 전문진술을 기재한 서류이므로 乙이 증거동의하더라도 乙에 대한 유죄 인정의 증거로 사용할 수 없다.", "explanation": "[1] 전문진술이나 재전문진술을 기재한 조서는 형사소송법 제310조의2의 규정에 의하여 원칙적으로 증거능력이 없는 것인데, 다만 전문진술은 형사소송법 제316조 제2항의 규정에 따라 원진술자가 사망, 질병, 외국거주 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에 한하여 예외적으로 증거능력이 있다고 할 것이고, 전문진술이 기재된 조서는 형사소송법 제312조 또는 제314조의 규정에 의하여 각 그 증거능력이 인정될 수 있는 경우에 해당하여야 함을 물론 나아가 형사소송법 제316조 제2항의 규정에 따른 위와 같은 요건을 갖추어야 예외적으로 증거능력이 있다고 할 것인바, 여기서 '그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때'라 함은 그 진술을 하였다는 것에 허위개입의 여지가 거의 없고, 그 진술내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우를 가리킨다. [2] 형사소송법은 전문진술에 대하여 제316조에서 실질상 단순한 전문의 형태를 취하는 경우에 한하여 예외적으로 그 증거능력을 인정하는 규정을 두고 있을 뿐, 재전문진술이나 재전문진술을 기재한 조서에 대하여는 달리 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 하는 데 동의하지 아니하는 한 형사소송법 제310조의2의 규정에 의하여 이를 증거로 할 수 없다(대판 2000.03.10. 2000도159). ", "answer": "X"}, {"source": "21변시", "question": "증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심 법원에서 이미 증거능력이 있었던 증거는 항소심에서도 증거능력이 그대로 유지되어 심판의 기초가 될 수 있고, 다시 증거조사를 할 필요가 없으므로, 항소심법원의 재판장은 증거조사절차에 들어가기에 앞서 제1심의 증거관계와 증거조사결과의 요지를 고지할 필요가 없다.", "explanation": "형사소송법 제364조 제3항은 \"제1심법원에서 증거로 할 수 있었던 증거는 항소법원에서도 증거로 할 수 있다.\"라고 정하고 있다. 따라서 제1심법원에서 이미 증거능력이 있었던 증거는 항소심에서도 증거능력이 그대로 유지되어 심판의 기초가 될 수 있고, 다시 증거조사를 할 필요가 없다(대판 2009.04.09. 2009도377 참조). 다만 항소법원의 재판장은 증거조사 절차에 들어가기에 앞서 제1심의 증거관계와 증거조사 결과의 요지를 고지하여야 한다(형사소송규칙 제156조의5 제1항) .", "answer": "X"}, {"source": "21변시", "question": "증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "행위자가 아닌 법인 또는 개인이 양벌규정에 따라 기소된 경우, 검사 이외의 수사기관이 행위자에 대하여 작성한 피의자신문조서는 행위자가 그 내용을 인정한 경우에라도 당해 피고인인 법인 또는 개인이 그 내용을 부인하는 경우에는 「형사소송법」 제312조 제3항이 적용되어 증거능력이 없고, 「형사소송법」 제314조를 적용하여 증거능력을 인정할 수도 없다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 해당 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 해당 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 해당 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되는 등 형사소송법 제312조 제4항의 요건을 갖춘 경우라고 하더라도 해당 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없고, 그 당연한 결과로 위 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 진술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 형사소송법 제314조가 적용되지 아니한다(대판 2004.07.15. 2003도7185(전합)). 그리고 이러한 법리는 공동정범이나 교사범, 방조범 등 공범관계에 있는 자들 사이에서뿐만 아니라, 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원 등 행위자의 위반행위에 대하여 행위자가 아닌 법인 또는 개인이 양벌규정에 따라 기소된 경우, 이러한 법인 또는 개인과 행위자 사이의 관계에서도 마찬가지로 적용된다고 보아야 한다(대판 2020.06.11. 2016도9367). ", "answer": "O"}, {"source": "21변시", "question": "증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 구속수감되어 있던 甲으로부터 乙의 마약류관리에관한법률위반(향정) 범행에 대한 진술을 듣고 추가적인 증거를 확보할 목적으로 甲에게 그의 압수된 휴대전화를 제공하여 乙과 통화하고 위 범행에 관한 통화 내용을 녹음하게 한 경우, 甲이 통화당사자가 되므로 그 녹음은 乙에 대한 유죄 인정의 증거로 사용할 수 있다.", "explanation": "수사기관이 甲으로부터 피고인의 마약류관리에 관한 법률 위반(향정) 범행에 대한 진술을 듣고 추가적인 증거를 확보할 목적으로, 구속수감되어 있던 甲에게 그의 압수된 휴대전화를 제공하여 피고인과 통화하고 위 범행에 관한 통화 내용을 녹음하게 한 행위는 불법감청에 해당하므로, 그 녹음 자체는 물론 이를 근거로 작성된 녹취록 첨부 수사보고는 피고인의 증거동의에 상관없이 그 증거능력이 없다(대판 2010.10.14. 2010도9016). ", "answer": "X"}, {"source": "21변시", "question": "증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "전자문서를 수록한 파일 등의 경우에는 원본임이 증명되거나 혹은 원본으로부터 복사한 사본일 경우에는 복사 과정에서 편집되는 등 인위적 개작 없이 원본의 내용 그대로 복사된 사본임이 증명되어야만 하고, 그러한 증명이 없는 경우에는 쉽게 그 증거능력을 인정할 수 없다. 이때 원본 동일성은 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장·증명하여야 한다.", "explanation": "전자문서를 수록한 파일 등의 경우에는, 그 성질상 작성자의 서명 흑은 날인이 없을 뿐만 아니라 작성자·관리자의 의도나 특정한 기술에 의하여 그 내용이 편집·조작될 위험성이 있음을 고려하여, 원본임이 증명되거나 흑은 원본으로부터 복사한 사본일 경우에는 복사 과정에서 편집되는 등 인위적 개작 없이 원본의 내용 그대로 복사된 사본임이 증명되어야만 하고, 그러한 증명이 없는 경우에는 쉽게 그 증거능력을 인정할 수 없다. 그리고 증거로 제출된 전자문서 파일의 사본이나 출력물이 복사·출력 과정에서 편집되는 등 인위적 개작 없이 원본 내용을 그대로 복사·출력한 것이라는 사실은 전자문서 파일의 사본이나 출력물의 생성과 전달 및 보관 등의 절차에 관여한 사람의 증언이나 진술, 원본이나 사본 파일 생성 직후의 해시값의 비교, 전자문서 파일에 대한 검증·감정 결과 등 제반 사정을 종합하여 판단할 수 있다(대판 2016.09.28. 2014도9903 참조). 이러한 원본 동일성은 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장·증명해야 한다(대판 2001.09.04. 2000도1743 참조)(대판 2018.02.08. 2017도13263). ", "answer": "O"}, {"source": "21변시", "question": "전문법칙에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "다른 사람의 진술, 즉 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이지만, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다.", "explanation": "타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정하여지는바, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이나, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다(대판 2008.11.13. 2008도8007).", "answer": "O"}, {"source": "21변시", "question": "전문법칙에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "어떠한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 서류의 증거능력을 인정한 다음 그 사실을 다시 진술 내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우에는 그 서류는 전문증거에 해당한다.", "explanation": "어떤 진술이 기재된 서류가 그 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 되지만, 그와 같은 진술을 하였디는 것 자체 또는 진술의 진실성과 관계없는 간접사실에 대한 정황증거로 시용될 때는 반드시 전문증거가 되는 것이 아니다. 그러나 어떠한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 서류의 증거능력을 인정한 다음 그 사실을 다시 진술 내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우에 그 서류는 전문증거에 해당한다. 서류가 그곳에 기재된 원진술의 내용인 사실을 증명하는 데 사용되어 원진술의 내용인 사실이 요증사실이 되기 때문이다. 이러한 경우 형사소송법 제311조부터 제316조까지 정한 요건을 충족하지 못한다면 증거능력이 없다(대판 2019.08.29. 2018도14303(전합)). ", "answer": "O"}, {"source": "21변시", "question": "전문법칙에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲이 정보통신망을 통하여 \"너를 죽이고 싶다\"라는 문자메시지를 반복적으로 乙에게 도달하게 하는 행위를 하였다는 정보통신망이용촉진및정보보호등에관한법률위반의 공소사실에 대하여 휴대전화기에 저장된 문자정보(위 협박문자)가 그 증거가 되는 경우, 그 문자 정보는 피고인의 진술에 해당하므로 「형사소송법」 제313조 제1항의 요건이 충족되어야 증거능력이 인정된다.", "explanation": "형사소송법 제310조의2는 사실을 직접 경험한 사람의 진술이 법정에 직접 제출되어야 하고 이에 갈음하는 대체물인 진술 또는 서류가 제출되어서는 안 된다는 이른바 전문법칙을 선언한 것이다. 그런데 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2에서 정한 전문법칙이 적용되지 않는다(대판 2008.11.13. 2006도2556).", "answer": "X"}, {"source": "21변시", "question": "전문법칙에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형사소송법」 제314조의 적용에 있어서 증인이 소재불명이거나 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때에 해당한다고 법원이 인정할 수 있으려면 증인의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 부득이 증인의 법정 출석이 불가능하게 되었다는 사정을 검사가 입증하여야 한다.", "explanation": "직접주의와 전문법칙의 예외를 정한 형사소송법 제314조의 요건 충족 여부는 엄격히 심사하여야 하고, 전문증거의 증거능력을 갖추기 위한 요건에 관한 증명책임은 검사에게 있으므로 법원이 증인이 소재불명이거나 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때에 해당한다고 인정할 수 있으려면, 증인의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 불구하고 부득이 증인의 법정 출석이 불가능하게 되었다는 사정을 검사가 증명한 경우여야 한다(대판 2013.04.11. 2013도1435).", "answer": "O"}, {"source": "20변시", "question": "전문증거의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로 전문법칙이 적용되지 않는다.", "explanation": "정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2에서 정한 전문법칙이 적용되지 않는다(대판 2008.11.13. 2006도2556). ", "answer": "O"}, {"source": "20변시", "question": "전문증거의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "성폭력 피해아동이 어머니에게 진술한 내용을 어머니가 상담원에게 전한 후, 상담원이 그 내용을 검사 면전에서 진술하여 작성된 진술조서는 이른바 ‘재전문진술을 기재한 조서’로서, 피고인이 동의하지 않는 한 증거능력이 인정되지 아니한다.", "explanation": "형사소송법은 전문진술에 대하여 제316조에서 실질상 단순한 전문의 형태를 취하는 경우에 한하여 예외적으로 그 증거능력을 인정하는 규정을 두고 있을 뿐, 재전문진술이나 재전문진술을 기재한 조서에 대하여는 달리 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 하는 데 동의하지 아니하는 한 형사소송법 제310조의2의 규정에 의하여 이를 증거로 할 수 없다(대판 2000.03.10. 2000도159).", "answer": "O"}, {"source": "20변시", "question": "전문증거의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "A가 특정범죄가중처벌등에관한법률위반(알선수재)죄로 기소된 피고인으로부터 건축허가를 받으려면 담당공무원에게 사례비를 주어야 한다는 말을 들었디는 취지의 법정진술을 한 경우, 원진술의 존재 자체가 알선수재죄에서의 요증사실이므로 A의 진술은 전문증거가 아니라 본래증거에 해당한다.", "explanation": "타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정하여지는바, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이나, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다(대판 2008.09.25. 2008도5347). 공소외 2는 전화를 통하여 피고인으로부터 2005. 8.경 건축허가 담당 공무원이 외국연수를 가므로 사례비를 주어야 한다는 말과 2006. 2.경 건축 허가 담당 공무원이 4,000만 원을 요구하는데 사례비로 2,000만 원을 주어야 한다는 말을 들었다는 취지로 수사기관, 제1심 및 원심 법정에서 진술하였음을 알 수 있는데, 피고인의 위와 같은 원진술의 존재 자체가 이 사건 알선수재죄에 있어서의 요증사실이므로, 이를 직접 경험한 공소외 2가 피고인으로부터 위와 같은 말들을 들었다고 하는 진술들은 전문증거가 아니라 본래증거에 해당된다(대판 2008.11.13. 2008도8007).", "answer": "O"}, {"source": "20변시", "question": "전문증거의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 참고인을 조사하는 과정에서 촬영한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용할 수 없다.", "explanation": "수사기관에 의한 피의자 아닌 자(이하 '참고인'이라 한다) 진술의 영상녹화를 새로 정하면서 그 용도를 참고인에 대한 진술조서의 실질적 진정성립을 증명하거나 참고인의 기억을 환기시키기 위한 것으로 한정하고 있는 현행 형사소송법의 규정 내용을 영상물에 수록된 성범죄 피해자의 진술에 대하여 독립적인 증거능력을 인정하고 있는 성폭력범죄의 처벌 등에 관한 특례법 제30조 제6항 또는 아동·청소년의 성보호에 관한 법률 제26조 제6항의 규정과 대비하여 보면, 수사기관이 참고인을 조사하는 과정에서 형사소송법 제221조 제1항에 따라 작성한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수는 없다고 해석함이 타당하다(대판 2014.07.10. 2012도5041).", "answer": "O"}, {"source": "20변시", "question": "전문증거의 증거능력에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "보험사기 사건에서 건강보험심사평가원이 수사기관의 의뢰에 따라 그 보내온 자료를 토대로 입원진료의 적정성에 대한 의견을 제시하는 내용의 '건강보험심사평가원의 입원진료 적정성 여부 등 검토의뢰에 대한 회신'은 「형사소송법」 제315조 제3호의 '기타 특히 신용할만한 정황에 의하여 작성된 문서'에 해당한다.", "explanation": "사무처리 내역을 계속적, 기계적으로 기재한 문서가 아니라 범죄사실의 인정 여부와 관련 있는 어떠한 의견을 제시하는 내용을 담고 있는 문서는 형사소송법 제315조 제3호에서 규정하는 당연히 증거능력이 있는 서류에 해당한다고 볼 수 없으므로, 이른바 보험사기 사건에서 건강보험심사평가원이 수사기관의 의뢰에 따라 그 보내온 자료를 토대로 입원진료의 적정성에 대한 의견을 제시하는 내용의 '건강보험심사평가원의 입원진료 적정성 여부 등 검토의뢰에 대한 회신'은 형사소송법 제315조 제3호의 '기타 특히 신용할 만한 정황에 의하여 작성된 문서'에 해당하지 않는다(대판 2017.12.05. 2017도12671).", "answer": "X"}, {"source": "19변시", "question": "다음 중 전문증거에 해당하는 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "건축허가를 둘러싼 A의 알선수재사건에서 \"건축허가 담당공무원에게 내(B)가 사례비 2,000만 원을 주기로 A와 상의하였다.\"라는 B의 증언", "explanation": "B의 진술은 자신이 경험한 바를 전하는 원진술이다. 참고로 B의 진술을 들었다고 C가 하는 진술도 본래증거에 해당한다. \n[참고판례] 타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정하여지는바, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이나, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다. 앞에서 본 법리와 기록에 비추어 살펴보면, 공소외 2(C)는 전화를 통하여 피고인(B)으로부터 2005.8.경 건축허가 담당 공무원(A)이 외국연수를 가므로 사례비를 주어야 한다는 말과 2006. 2.경 건축허가 담당 공무원이 4,000만 원을 요구하는데 사례비로 2,000만 원을 주어야 한다는 말을 들었다는 취지로 수사기관, 제1심 및 원심 법정에서 진술하였음을 알 수 있는데, 피고인(B)의 위와 같은 원진술의 존재 자체가 이 사건 알선수재죄에 있어서의 요증사실이므로, 이를 직접 경험한 공소외 2(C)가 피고인(B)으로부터 위와 같은 말들을 들었다고 하는 진술들은 전문증거가 아니라 본래증거에 해당된다(대판 2008.11.13. 2008도8007). ", "answer": "X"}, {"source": "19변시", "question": "다음 중 전문증거에 해당하는 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "휴대전화기에 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 C에 대한 공소사실의 유죄증거로 C의 휴대전화기에 저장된 위와 같은 내용의 문자정보", "explanation": "형사소송법 제310조의2는 사실을 직접 경험한 사람의 진술이 법정에 직접 제출되어야 하고 이에 갈음하는 대체물인 진술 또는 서류가 제출되어서는 안 된다는 이른바 전문법칙을 선언한 것이다. 그런데 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2에서 정한 전문법칙이 적용되지 않는다(대판 2008.11.13. 2006도2556). ", "answer": "X"}, {"source": "19변시", "question": "다음 중 전문증거에 해당하는 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "횡령죄로 기소된 D의 의뢰를 받은 변호사가 작성하여 D에게 이메일로 전송한 '법률의견서'를 출력한 사본", "explanation": "갑 주식회사 및 그 직원인 피고인들이 정비사업전문관리업자의 임원에게 갑 회사가 주택재개발사업 시공사로 선정되게 해 달라는 청탁을 하면서 금원을 제공하였다고 하여 구 건설산업기본법 위반으로 기소되었는데, 변호사가 법률자문 과정에 작성하여 갑 회사 측에 전송한 전자문서를 출력한 '법률의견서'에 대하여 피고인들이 증거로 함에 동의하지 아니하고, 변호사가 원심 공판기일에 증인으로 출석하였으나 증언할 내용이 갑 회사로부터 업무상 위탁을 받은 관계로 알게 된 타인의 비밀에 관한 것임을 소명한 후 증언을 거부한 사안에서, 위 법률의견서는 압수된 디지털 저장매체로부터 출력한 문건으로서 실질에 있어서 형사소송법 제313조 제1항에 규정된 '피고인 아닌 자가 작성한 진술서나 그 진술을 기재한 서류'에 해당하는데, 공판준비 또는 공판기일에서 작성자 또는 진술자인 변호사의 진술에 의하여 성립의 진정함이 증명되지 아니하였으므로 위 규정에 의하여 증거능력을 인정할 수 없고, 나아가 원심 공판기일에 출석한 변호사가 그 진정성립 등에 관하여 진술하지 아니한 것은 형사소송법 제149조에서 정한 바에 따라 정당하게 증언거부권을 행사한 경우에 해당하므로 형사소송법 제314조에 의하여 증거능력을 인정할 수도 없다(대판 2012.05.17. 2009도6788(전합)). ", "answer": "O"}, {"source": "19변시", "question": "다음 중 전문증거에 해당하는 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "반국가단체로부터 지령을 받고 국가기밀을 탐지·수집하였다는 공소사실로 기소된 E의 컴퓨터에 저장된 국가기밀문건", "explanation": "피고인 또는 피고인 아닌 사람이 컴퓨터용디스크 그 밖에 이와 비슷한 정보저장매체에 입력하여 기억된 문자정보 또는 그 출력물을 증거로 시용하는 경우, 이는 실질에 있어서 피고인 또는 피고인 아닌 사람이 작성한 진술서나 그 진술을 기재한 서류와 크게 다를 바 없고, 압수 후의 보관 및 출력과정에 조작의 가능성이 있으며, 기본적으로 반대신문의 기회가 보장되지 않는 점 등에 비추어 그 내용의 진실성에 관하여는 전문법칙이 적용되고, 따라서 원칙적으로 형사소송법 제313조 제1항에 의하여 작성자 또는 진술자의 진술에 의하여 성립의 진정함이 증명된 때에 한하여 이를 증거로 사용할 수 있다. 다만 정보저장매체에 기억된 문자정보의 내용의 진실성이 아닌 그와 같은 내용의 문자정보의 존재 자체가 직접 증거로 되는 경우에는 전문법칙이 적용되지 아니한다(대판 2013.02.15. 2010도3504). ► 국가기밀의 소지여부(존재 자체)가 문제되는 것이지 컴퓨터에 저장된 기밀의 내용의 진실성이 문제되는 것이 아니므로 전문법칙이 적용되지 않는다.", "answer": "X"}, {"source": "19변시", "question": "다음 중 전문증거에 해당하는 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "F가 한 진술의 내용인 사실이 요증사실인 경우, F의 진술을 내용으로 하는 G의 진술", "explanation": "타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정하여지는바, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이나, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다(대판 2008.11.13. 2008도8007). ► 지문에서 F가 한 진술(원진술)의 내용이 요증사실인 경우, F의 진술을 내용으로 하는 G의 진술은 전문증거에 해당한다.", "answer": "O"}, {"source": "19변시", "question": "피의자신문조서에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인이 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다(대판 2009.10.15. 2009도1889).\n", "answer": "O"}, {"source": "19변시", "question": "피의자신문조서에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공동피고인이 아닌 공범에 관한 검사 작성의 피의자신문조서가 증거능력을 인정받기 위해서는 피고인이 위 공범에 대한 피의자신문조서를 증거로 함에 동의하지 않는 이상, 그 공범이 현재의 사건에 증인으로 출석하여 그 서류의 성립의 진정을 인정하여야 한다.", "explanation": "2020. 2. 4. 법률 제16924호로 개정되어 2022. 1. 1.부터 시행된 형사소송법 제312조 제1항은 검사가 작성한 피의자신문조서의 증거능력에 대하여 ‘적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다.’고 규정하였다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. 형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023도3741). -> 출제당시에는 O인 지문이었으나, 형사소송법 개정 및 위 판례에 따라 X로 정답 변경. 형사소송법 제312조 제1항 개정 취지에 따르면 검사가 작성한 피의자신문조서도 내용인정이라는 엄격한 요건을 요구하는 바, 피고인과 공범관계에 있다면 그에 대해 검사가 작성한 피의자신문조서는 공동피고인인 여부를 묻지 않고 당해 피고인 또는 변호인이 내용을 인정해야만 증거능력이 인정된다고 할 것이다(이창현, 형사소송법 제9판, p.899 참조).", "answer": "X"}, {"source": "19변시", "question": "피의자신문조서에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인과 공범관계가 있는 다른 피의자에 대한 검사 이외의 수사기관 작성의 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 진술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 「형사소송법」 제314조가 적용되지 않는다.", "explanation": "형사소송법 제312조 제2항(현행 형사소송법 제312조 제3항)은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되는바, 당해 피고인과 공범관계가 있는 다른 피의자에 대한 검사 이외의 수사기관 작성의 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정되므로 그 당연한 결과로 그 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 진술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 형사소송법 제314조가 적용되지 아니한다(대판 2004.07.15. 2003도7185). -> 개정 형사소송법 하에서는 공범에 대한 검사 작성 피의자신문조서에 대해서도 제314조가 적용되지 않는다고 해석된다. 공범의 법정진술에 의해 성립의 진정이 인정되더라도 당해 피고인이 그 조서의 내용을 부인하면 증거능력이 부정되기 때문이다(이창현, 형사소송법 제9판, p.901 참조).", "answer": "O"}, {"source": "19변시", "question": "피의자신문조서에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "절도범과 장물범이 공동피고인으로 기소된 경우, 피고인이 증거로 함에 동의한 바 없는 검사 작성의 공동피고인에 대한 피의자신문조서가 증거능력을 인정받기 위해서는 공동피고인의 증언에 의하여 그 성립의 진정이 인정되어야 한다.", "explanation": "공동피고인인 절도범과 그 장물범은 서로 다른 공동피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로, 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자신문조서는 공동피고인의 증언에 의하여 그 성립의 진정이 인정되지 아니하는 한 피고인의 공소 범죄사실을 인정하는 증거로 할 수 없다(대판 2006.01.12. 2005도7601). -> 공범이 아닌 공동피고인의 검사 작성의 피의자신문조서는 공동피고인이 당해 피고인과의 관계에서 순수한 제3자에 해당하므로 형소법 제312조 제4항이 적용되어 피고인이 증거 부동의를 하는 경우에는 진정성립 등이 증명된 때에 한해서 증거능력이 인정된다고 할 것이다(이창현, 형사소송법 제9판, p.899-900 참조).", "answer": "O"}, {"source": "19변시", "question": "피의자신문조서에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 검사 작성의 피고인에 대한 피의자신문조서의 성립이 진정함을 인정하는 진술을 하고, 그 피의자신문조서에 대하여 증거조사가 완료되었다면, 절차적 안정성을 위해 진술의 취소는 허용될 수 없다.", "explanation": "피고인이나 그 변호인이 검사 작성의 당해 피고인에 대한 피의자신문조서의 성립의 진정함을 인정하는 진술을 하였다 하더라도, 그 피의자신문조서에 대하여 구 형사소송법 제292조에서 정한 증거조사가 완료되기 전에는 최초의 진술을 번복함으로써 그 피의자신문조서를 유죄 인정의 자료로 사용할 수 없도록 할 수 있으나, 그 피의자신문조서에 대하여 위의 증거조사가 완료된 뒤에는 그와 같은 번복의 의사표시에 의하여 이미 인정된 조서의 증거능력이 당연히 상실되는 것은 아니다. 다만, 적법절차 보장의 정신에 비추어 성립의 진정함을 인정한 최초의 진술에 그 효력을 그대로 유지하기 어려운 중대한 하자가 있고 그에 관하여 진술인에게 귀책사유가 없는 경우에 한하여 예외적으로 증거조사 절차가 완료된 뒤에도 그 진술을 취소할 수 있고, 그 취소 주장이 이유 있는 것으로 받아들여지게 되면 법원은 구 형사소송규칙 제139조 제4항의 증거배제결정을 통하여 그 조서를 유죄 인정의 자료에서 제외하여야 한다(대판 2008.07.10. 2007도7760).", "answer": "X"}, {"source": "18변시", "question": "甲이 공무원 乙에게 뇌물 4,000만 원을 제공하였다는 범죄사실로 甲과 乙이 함께 공소제기되어 공동피고인으로 재판을 받으면서 甲은 자백하나, 乙은 뇌물을 받은 사실이 없다고 주장하며 다투고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "위 뇌물수수사실이 인정되는 경우 甲, 乙은 「특정범죄 가중처벌 등에 관한 법률」에 따라 가중처벌된다.", "explanation": "증뢰자 甲은 가중처벌되지 않는다.\n특정범죄 가중처벌 등에 관한 법률 제2조(뇌물죄의 가중처벌) ① 형법 제129조·제130조 또는 제132조에 규정된 죄를 범한 사람은 그 수수·요구 또는 약속한 뇌물의 가액(이하 이 조에서 “수뢰액”이라 한다)에 따라 다음 각 호와 같이 가중처벌한다.\n1. 수뢰액이 1억원 이상인 경우에는 무기 또는 10년 이상의 징역에 처한다.\n2. 수뢰액이 5천만원 이상 1억원 미만인 경우에는 7년 이상의 유기징역에 처한다.\n3. 수뢰액이 3천만원 이상 5천민원 미만인 경우에는 5년 이상의 유기징역에 처한다.", "answer": "X"}, {"source": "18변시", "question": "甲이 공무원 乙에게 뇌물 4,000만 원을 제공하였다는 범죄사실로 甲과 乙이 함께 공소제기되어 공동피고인으로 재판을 받으면서 甲은 자백하나, 乙은 뇌물을 받은 사실이 없다고 주장하며 다투고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙이 그 직무의 대상이 되는 사람으로부터 금품 기타 이익을 받은 때에는 특별한 사정이 없는 한 직무와의 관련성이 없다고 할 수 없고, 비록 사교적 의례의 형식을 빌어 금품을 주고받았다고 하더라도 그것이 乙의 직무와 관련된 이상 그 수수한 금품은 뇌물이 된다.", "explanation": "공무원이 그 직무의 대상이 되는 사람으로부터 금품 기타 이익을 받은 때에는 사회상규에 비추어 볼 때에 의례상의 대가에 불과한 것이라고 여겨지거나, 개인적인 친분관계가 있어서 교분상의 필요에 의한 것이라고 명백하게 인정할 수 있는 경우 등 특별한 사정이 없는 한 직무와의 관련성이 없는 것으로 볼 수 없으며, 공무원이 직무와 관련하여 금품을 수수하였다면 비록 사교적 의례의 형식을 빌어 금품을 주고 받았다 하더라도 그 수수한 금품은 뇌물이 된다(대판 2001.10.12. 2001도3579).", "answer": "O"}, {"source": "18변시", "question": "甲이 공무원 乙에게 뇌물 4,000만 원을 제공하였다는 범죄사실로 甲과 乙이 함께 공소제기되어 공동피고인으로 재판을 받으면서 甲은 자백하나, 乙은 뇌물을 받은 사실이 없다고 주장하며 다투고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲은 소송절차가 분리되지 않는 한 乙에 대한 공소사실에 관하여 증인이 될 수 없다.", "explanation": "피고인의 지위에 있는 공동피고인은 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있고, 이는 대향범인 공동피고인의 경우에도 다르지 않다(대판 2012.03.29. 2009도11249).", "answer": "O"}, {"source": "18변시", "question": "甲이 공무원 乙에게 뇌물 4,000만 원을 제공하였다는 범죄사실로 甲과 乙이 함께 공소제기되어 공동피고인으로 재판을 받으면서 甲은 자백하나, 乙은 뇌물을 받은 사실이 없다고 주장하며 다투고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "변론분리 후 甲이 증언하는 과정에서 “뇌물을 제공받은 乙이 저에게 ‘국가와 민족을 위해 잘 쓰겠습니다.’라고 말했습니다.\"라고 진술한 경우, 乙의 위 진술내용은 특신상태가 증명된 때에 한하여 증거로 할 수 있다.", "explanation": "피고인 아닌 자의 공판기일에서의 진술이 피고인의 진술을 그 내용으로 하는 것인 때에는 형사소송법 제316조 제1항의 규정에 따라 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에는 이를 증거로 할 수 있고, 여기서 ‘그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때’라 함은 그 진술을 하였다는 것에 허위 개입의 여지가 거의 없고, 그 진술 내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우를 가리킨다(대판 2010.11.25. 2010도 8735).", "answer": "O"}, {"source": "18변시", "question": "甲이 공무원 乙에게 뇌물 4,000만 원을 제공하였다는 범죄사실로 甲과 乙이 함께 공소제기되어 공동피고인으로 재판을 받으면서 甲은 자백하나, 乙은 뇌물을 받은 사실이 없다고 주장하며 다투고 있다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형법」 제134조는 뇌물 또는 뇌물에 공할 금품을 필요적으로 몰수하고 이를 몰수하기 불가능한 때에는 그 가액을 추정하도록 규정하고 있는바, 몰수는 특정된 물건에 대한 것이고 추징은 본래 몰수할 수 있었음을 전제로 하는 것임에 비추어 뇌물 또는 뇌물에 공할 금품이 특정되지 않았던 것은 몰수할 수 없고 그 가액을 추징할 수도 없다.", "explanation": "형법 제134조는 뇌물에 공할 금품을 필요적으로 몰수하고 이를 몰수하기 불가능한 때에는 그 가액을 추징하도록 규정하고 있는바, 몰수는 특정된 물건에 대한 것이고 추징은 본래 몰수할 수 있었음을 전제로 하는 것임에 비추어 뇌물에 공할 금품이 특정되지 않았던 것은 몰수할 수 없고 그 가액을 추징할 수도 없다(대판 1996.05.08. 96도221).", "answer": "O"}, {"source": "18변시", "question": "전문증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사의 피고인에 대한 당해 공소사실에 관한 진술조서가 기소된 후에 작성된 것이라는 이유만으로도 당사자주의, 공판중심주의에 비추어 그 증거능력은 부정되어야 한다.", "explanation": "검사의 피고인에 대한 진술조서(당해 공소사실에 관한 것임)가 기소 후에 작성된 것이라는 이유만으로 곧 그 증거능력이 없는 것이라고 할 수 없다(대판 1982.06.08. 82도754).", "answer": "X"}, {"source": "18변시", "question": "전문증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "A가 진술 당시 술에 취하여 횡설수설하였다는 것을 확인하기 위하여 제출된 A의 진술이 녹음된 녹음테이프는 전문증거에 해당한다.", "explanation": "수사기관이 아닌 사인(私人)이 피고인 아닌 자와의 전화대화를 녹음한 녹음테이프에 대하여 법원이 실시한 검증의 내용이 녹음테이프에 녹음된 전화대화의 내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과한 경우에는 증거자료가 되는 것은 여전히 녹음테이프에 녹음된 대화 내용이므로, 그 중 피고인 아닌 자와의 대화의 내용은 실질적으로 형사소송법 제311조, 제312조 규정 이외의 피고인 아닌 자의 진술을 기재한 서류와 다를 바 없어서, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 그 녹음테이프 검증조서의 기재 중 피고인 아닌 자의 진술내용을 증거로 사용하기 위해서는 형사소송법 제313조 제1항에 따라 공판준비나 공판기일에서 원진술자의 진술에 의하여 그 녹음테이프에 녹음된 진술내용이 자신이 진술한 대로 녹음된 것이라는 점이 인정되어야 하는 것이지만, 이와는 달리 녹음테이프에 대한 검증의 내용이 그 진술 당시 진술자의 상태 등을 확인하기 위한 것인 경우에는, 녹음테이프에 대한 검증조서의 기재 중 진술내용을 증거로 사용하는 경우에 관한 위 법리는 적용되지 아니하고, 따라서 위 검증조서는 법원의 검증의 결과를 기재한 조서로서 형사소송법 제311조에 의하여 당연히 증거로 할 수 있다(대판 2008.07.10. 2007도10755).", "answer": "X"}, {"source": "18변시", "question": "전문증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검찰에 송치되기 전에 검사가 작성한 구속 피의자에 대한 피의자신문조서도 작성주체에 따라 전문법칙의 예외를 인정하는 「형사소송법」의 규정체계에 따르는 한 적법한 검사 작성의 피의자신문조서로 볼 수밖에 없다.", "explanation": "검찰에 송치되기 전에 구속피의자로부터 받은 검사 작성의 피의자신문조서는 극히 이례에 속하는 것으로, 그와 같은 상태에서 작성된 피의자신문조서는 내용만 부인하면 증거능력을 상실하게 되는 사볍경찰관 작성의 피의자신문조서상의 자백 등을 부당하게 유지하려는 수단으로 악용될 가능성이 있어, 그렇게 했어야 할 특별한 사정이 보이지 않는 한 송치 후에 작성된 피의자신문조서와 마찬가지로 취급하기는 어렵다(대판 1994.08.09. 94도1228).", "answer": "X"}, {"source": "18변시", "question": "전문증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 조서의 진정성립을 인정한 경우 증거조사가 완료된 후에는 절차유지의 원칙상 일절 번복이 허용되지 않는다.", "explanation": "피고인이나 그 변호인이 검사 작성의 당해 피고인에 대한 피의자신문조서의 성립의 진정함을 인정하는 진술을 하였다 하더라도, 그 피의자신문조서에 대하여 구 형사소송법 제292조에서 정한 증거조사가 완료되기 전에는 최초의 진술을 번복함으로써 그 피의자신문조서를 유죄 인정의 자료로 사용할 수 없도록 할 수 있으나, 그 피의자신문조서에 대하여 위의 증거조사가 완료된 뒤에는 그와 같은 번복의 의사표시에 의하여 이미 인정된 조서의 증거능력이 당연히 상실되는 것은 아니다. 다만, 적법절차 보장의 정신에 비추어 성립의 진정함을 인정한 최초의 진술에 그 효력을 그대로 유지하기 어려운 중대한 하자가 있고 그에 관하여 진술인에게 귀책사유가 없는 경우에 한하여 예외적으로 증거조사 절차가 완료된 뒤에도 그 진술을 취소할 수 있고, 그 취소 주장이 이유 있는 것으로 받아들여지게 되면 법원은 구 형사소송규칙 제139조 제4항의 증거배제결정을 통하여 그 조서를 유죄 인정의 자료에서 제외하여야 한다(대판 2008.07.10. 2007도7760).", "answer": "X"}, {"source": "18변시", "question": "전문증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관이 작성한 조서의 내용이 원진술자가 진술한 대로 기재된 것이라 함은 조서작성 당시 원진술자의 진술대로 기재되었는지의 여부만을 의미하는 것으로, 이와 같이 진술하게 된 연유나 그 진술의 신빙성 여부는 고려할 것이 아니다.", "explanation": "검사가 피의자나 피의자 아닌 자의 진술을 기재한 조서는 공판준비 또는 공판기일에서 원진술자의 진술에 의하여 형식적 진정성립 뿐만 아니라, 실질적 진정성립까지 인정된 때에 한하여 비로소 그 성립의 진정함이 인정되어 증거로 사용할 수 있다. 그런데 조서의 내용이 원진술자가 진술한 대로 기재된 것이라 함은 조서 작성 당시 원진술자의 진술대로 기재되었는지의 여부만을 의미하는 것으로, 그와 같이 진술하게 된 연유나 그 진술의 신빙성 여부는 고려할 것이 아니다(대판 2005.06.10. 2005도1849).", "answer": "O"}, {"source": "17변시", "question": "공동피고인의 진술에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로 선서없이 한 공동피고인의 법정진술은 피고인의 범죄사실을 인정하는 증거로 할 수 없다.", "explanation": "피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로 선서없이 한 공동피고인의 법정진술이나 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자 신문조서는 피고인의 공소 범죄사실을 인정하는 증거로 할 수 없다(대판 1982.09.14. 82도1000).", "answer": "O"}, {"source": "17변시", "question": "공동피고인의 진술에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인 甲이 공판정에서 공범인 공동피고인 乙에 대한 사법경찰관 작성의 피의자신문조서의 내용을 부인하면 乙이 법정에서 그 조서의 내용을 인정하여도 그 조서를 甲의 범죄사실에 대한 증거로 사용할 수 없다.", "explanation": "형사소송법 제312조 제3항은 “검사 이외의 수사기관이 작성한 피의자신문조서는 적법한 절차와 방식에 따라 작성된 것으로서 공판준비 또는 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한하여 증거로 할 수 있다.\"라고 규정하고 있다. 위 규정은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되는바(대판 2009.10.15. 2009도1889 등 참조), 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도, 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 내지 대향범도 포함된다(대판 2020.06.11. 2016도9367 등 참조). 그리고 위 규정에서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다(대판 2010.06.24. 2010도5040 등 참조)(대판 2024.08.29. 2024도8200).\n-> 참조판례: 형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023도3741).", "answer": "O"}, {"source": "17변시", "question": "공동피고인의 진술에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲과 乙이 공모하여 타인의 재물을 편취한 범죄사실로 기소된 사건에서, 甲은 법정에서 범행을 부인하고 乙은 경찰 수사 단계에서 범행을 자백하는 자술서를 작성·제출한 이후 사망하였다면, 공판준비 또는 공판기일에 진술을 요하는 자가 사망하여 진술할 수 없는 때에 해당하므로 乙의 자술서는 그 작성이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명되었다면 甲에 대한 유죄 인정의 증거로 할 수 있다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되는바, 당해 피고인과 공범관계가 있는 다른 피의자에 대한 검사 이외의 수사기관 작성의 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정되므로 그 당연한 결과로 그 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 진술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 형사소송법 제314조가 적용되지 아니한다(대판 2009.11.26. 2009도6602). -> 개정 형사소송법 하에서는 공범에 대한 검사 작성 피의자신문조서에 대해서도 제314조가 적용되지 않는다고 해석된다. 공범의 법정진술에 의해 성립의 진정이 인정되더라도 당해 피고인이 그 조서의 내용을 부인하면 증거능력이 부정되기 때문이다(이창현, 형사소송법 제9판, p.901 참조).", "answer": "X"}, {"source": "17변시", "question": "공동피고인의 진술에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공범인 공동피고인의 법정자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있다.", "explanation": "형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 진술은 포함되지 않으며, 이러한 공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립한 증거능력이 있다(대판 1992.07.28. 92도917).", "answer": "O"}, {"source": "17변시", "question": "공동피고인의 진술에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲, 乙, 丙이 공모하여 타인의 재물을 편취한 범죄사실로 기소된 사건에서, 피고인 甲과 공동피고인 乙이 범죄사실을 자백하고 공동피고인 丙은 범죄사실을 부인하는 경우, 乙의 자백을 甲의 자백에 대한 보강증거로 사용할 수 없다.", "explanation": "형사소송법 제310조 소정의 “피고인의 자백”에 공범인 공동피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다(대판 1990.10.30. 90도1939).", "answer": "X"}, {"source": "17변시", "question": "참고인 조사에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "참고인이 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니한 경우에는, 특별한 사정이 없는 한 ‘적법한 절차와 방식’에 따라 수사과정에서 진술서가 작성되었다 할 수 없으므로 증거능력을 인정할 수 없다.", "explanation": "형사소송법 제312조 제4항은 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서의 증거능력이 인정되려면 ‘적법한 절차와 방식에 따라 작성된 것’이어야 한다고 규정하고 있다. 여기서 적법한 절차와 방식에 따라 작성한다는 것은 피고인이 아닌 자의 진술에 대한 조서 작성 과정에서 지켜야 할 형사소송법이 정한 여러 절차를 준수하고 조서의 작성 방식에도 어긋남이 없어야 한다는 것을 의미한다. 그리고 형사소송법 제312조 제5항은 피고인 또는 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거 능력에 관하여는 형사소송법 제312조 제1항부터 제4항까지 준용하도록 규정하고 있으므로, 위와 같은 법리는 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거능력에 관하여도 그대로 적용된다고 할 것이다. 형사소송법 제221조 제1항에서 검사 또는 사법경찰관은 수사에 필요한 때에는 피의자가 아닌 자의 출석을 요구하여 진술을 들을 수 있다고 규정하고, 제244조의4 제3항, 제1항에서 검사 또는 사법경찰관이 피의자가 아닌 자를 조사하는 경우에는 피의자를 조사하는 경우와 마찬가지로 조사장소에 도착한 시각, 조사를 시작하고 마친 시각, 그 밖에 조사과정의 진행경과를 확인하기 위하여 필요한 사항을 조서에 기록하거나 별도의 서면에 기록한 후 수사기록에 편철하여야 한다고 규정하고 있다. 이와 같이 수사기관으로 하여금 피의자가 아닌 자를 조사할 수 있도록 하면서도 그 조사과정을 기록하도록 한 취지는 수사기관이 조사과정에서 피조사자로부터 진술증거를 취득하는 과정을 투명하게 함으로써 그 과정에서의 절차적 적법성을 제도적으로 보장하려는 데 있다. 따라서 수사기관이 수사에 필요하여 피의자가 아닌 자를 조사하는 과정에서 그 진술을 청취하여 증거로 남기는 방법으로 진술조서가 아닌 진술서를 작성·제출받는 경우에도 그 절차는 준수되어야 할 것이다. 이러한 형사소송법의 규정 및 그 입법 목적 등을 종합하여 보면, 피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니하여 형사소송법 제244조의4 제3항, 제1항에서 정한 절차를 위반한 경우에는, 특별한 사정이 없는 한 '적법한 절차와 방식’에 따라 수사과정에서 진술서가 작성되었다 할 수 없으므로 그 증거능력을 인정할 수 없다(대판 2015.04.23. 2013도3790).", "answer": "O"}, {"source": "17변시", "question": "참고인 조사에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "진술거부권 고지의 대상이 되는 피의자의 지위는 수사기관이 범죄인지서를 작성하는 등의 형식적인 사건수리 절차를 거치기 전이라도 조사대상자에 대하여 범죄의 혐의가 있다고 보아 실질적으로 수사를 개시하는 행위를 한 때에 인정되므로, 진술조서의 형식을 취하더라도 실질이 피의자신문조서의 성격을 가지는 경우에는 수사기관은 진술을 듣기 전에 조사대상자에게 미리 진술거부권을 고지하여야 한다.", "explanation": "피의자의 진술을 기재한 서류 또는 문서가 수사기관에서의 조사 과정에서 작성된 것이라면, 그것이 ‘진술조서, 진술서, 자술서’라는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없고, 수사기관에 의한 진술거부권 고지의 대상이 되는 피의자의 지위는 수사기관이 범죄인지서를 작성하는 등의 형식적인 사건수리 절차를 거치기 전이라도 조사대상자에 대하여 범죄의 혐의가 있다고 보아 실질적으로 수사를 개시하는 행위를 한 때에 인정된다. 특히 조사대상자의 진술 내용이 단순히 제3자의 범죄에 관한 경우가 아니라 자신과 제3자에게 공동으로 관련된 범죄에 관한 것이거나 제3자의 피의사실뿐만 아니라 자신의 피의사실에 관한 것이기도 하여 실질이 피의자신문조서의 성격을 가지는 경우에 수사기관은 진술을 듣기 전에 미리 진술거부권을 고지하여야 한다(대판 2015.10.29. 2014도5939).", "answer": "O"}, {"source": "17변시", "question": "참고인 조사에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 작성한 참고인진술조서에 대하여 피고인이 증거로 함에 부동의한 경우, 원진술자가 법정에서 검사나 재판장의 신문에 대하여 수사기관에서 사실대로 진술하였다는 취지로 증언하더라도, 원진술자가 그 진술기재의 내용을 열람하거나 고지받지 못한 채로 그와 같이 증언한 것이라면 그 진술조서는 증거능력이 없다.", "explanation": "피고인이 사법경찰리 작성의 공소외인에 대한 피의자신문조서, 진술조서 및 검사 작성의 피고인에 대한 피의자신문조서 중 위 공소외인의 진술기재 부분을 증거로 함에 부동의하였고, 원진술자인 위 공소외인이 제1심 및 항소심에서 증인으로 나와 그 진술기재의 내용을 열람하거나 고지받지 못한 채 단지 검사나 재판장의 신문에 대하여 수사기관에서 사실대로 진술하였다는 취지의 증언만을 하고 있을 뿐이라면, 그 피의자신문조서와 진술조서는 증거능력이 없어 이를 유죄의 증거로 삼을 수 없다(대판 1994.11.11. 94도343)", "answer": "O"}, {"source": "17변시", "question": "참고인 조사에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 공판기일에서 이미 증언을 마친 증인을 소환하여 피고인에게 유리한 증언 내용을 추궁한 다음 그로 하여금 본인의 증언 내용을 번복하는 내용의 진술서를 작성하도록 하여 법원에 제출한 경우, 이러한 진술서는 피고인이 증거로 할 수 있음에 동의하여도 증거능력이 없다.", "explanation": "공판준비 또는 공판기일에서 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서를 유죄의 증거로 삼는 것은 당사 자주의·공판중심주의·직접주의를 지향하는 현행 형사소송법의 소송구조에 어긋나는 것일 뿐만 아니라, 헌법 제27조가 보장하는 기본권, 즉 법관의 면전에서 모든 증거자료가 조사·진술되고 이에 대하여 피고인이 공격·방어할 수 있는 기회가 실질적으로 부여되는 재판을 받을 권리를 침해하는 것이므로, 이러한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 아니하는 한 증거능력이 없고, 그 후 원진술자인 종전 증인이 다시 법정에 출석하여 증언을 하면서 그 진술조서의 성립의 진정함을 인정하고 피고인 측에 반대신문의 기회가 부여되었다고 하더라도 그 증언 자체를 유죄의 증거로 할 수 있음은 별론으로 하고 위와 같은 진술조서의 증거능력이 없다는 결론은 달리할 것이 아니다. 이는 검사가 공판준비 또는 공판기일에서 이미 증언을 마친 증인에게 수사기관에 출석할 것을 요구하여 그 증인을 상대로 위증의 혐의를 조사한 내용을 담은 피의자신문조서의 경우도 마찬가지이다(대판 2013.08.14. 2012도13665).", "answer": "X"}, {"source": "17변시",  「성폭력범죄의 처벌 등에 관한 특례법」에 규정된 절차에 따라 촬영한 영상물에 수록된 피해자의 진술은 공판준비 또는 공판기일에 피해자나 조사과정에 동석하였던 신뢰관계에 있는 사람 또는 진술조력인의 진술에 의하여 그 성립의 진정함이 인정된 경우에 증거로 할 수 있다. ", "explanation": "구 성폭력범죄의 처벌 등에 관한 특례법 제30조 제6항에 따르면 맞는 선지이나 해당 조문은 헌법재판소 2021. 12. 23. 위헌결정으로 폐지되고, 2023. 7. 11. 영상녹화물의 증거능력 특례가 신설되었다. 즉, 피해자가 공판기일에 출석하지 않았다면 사망, 외국 거주, 신체적, 정신적 질병, 소재불명, 그 밖에 이에 준하는 경우에 해당하고, 특별히 신빙할 수 있는 상태가 인정되어야 증거로 사용할 수 있다.", "answer": "X"}, {"source": "15변시", "question": "형사절차상 영상녹화에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 된 피의자의 진술을 영상녹화할 경우에는 진술거부권, 변호인의 참여를 요청할 수 있다는 점 등의 고지가 포함되어야 한다.", "explanation": "형사소송규칙 제134조의2 제3항 제4호 참조.\n형사소송규칙 제134조의2(영상녹화물의 조사 신청) ③ 제1항의 영상녹화물은 조사가 개시된 시점부터 조사가 종료되어 피의자가 조서에 기명날인 또는 서명을 마치는 시점까지 전과정이 영상녹화된 것으로, 다음 각 호의 내용을 포함하는 것이어야 한다.\n4. 진술거부권·변호인의 참여를 요청할 수 있디는 점 등의 고지", "answer": "O"}, {"source": "14변시", "question": "전문법칙에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "\"甲이 乙을 살해하는 것을 목격했다.\"하는 丙의 말을 들은 丁이 丙의 진술내용을 증언하는 경우, 甲의 살인 사건에 대하여는 전문증거이지만, 丙의 명예훼손 사건에 대하여는 전문증거가 아니다.", "explanation": "전문사실이 요증사실의 구성요소를 이루는 경우의 진술에는 전문법칙이 적용되지 않는다. 이 경우의 진술은 원본증거이고 전문증거가 아니기 때문이다. 지문에서 “甲이 乙을 살해하는 것을 목격했다”고 하는 丙의 말을 들은 丁이 丙의 진술내용을 증언하는 경우, 丙의 명예훼손 사건에서는 丁의 진술이 명예훼손 사실의 구성요소를 이루는 경우에 해당하므로 전문법칙이 적용되지 않는다.", "answer": "O"}, {"source": "14변시", "question": "전문법칙에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "사인(私人)이 피고인이 아닌 자의 진술을 녹음한 녹음테이프에 대하여 법원이 실시한 검증의 내용이, 녹음테이프에 녹음된 대화내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과한 경우, 그 검증조서는 형사소송법 제311조의 ‘법원의 검증의 결과를 기재한 조서’에 해당하여 그 조서 중 위 진술내용은 위 제311조에 의하여 증거능력이 인정된다.", "explanation": "수사기관이 아닌 사인이 피고인 아닌 자와의 전화대화를 녹음한 녹음테이프에 대하여 법원이 실시한 검증의 내용이 녹음테이프에 녹음된 전화대화의 내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과한 경우에는 증거자료가 되는 것은 여전히 녹음테이프에 녹음된 대화 내용이므로, 그 중 피고인 아닌 자와의 대화의 내용은 실질적으로 형사소송법 제311조, 제312조 규정 이외의 피고인 아닌 자의 진술을 기재한 서류와 다를 바 없어서, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 그 녹음테이프 검증조서의 기재 중 피고인 아닌 자의 진술내용을 증거로 사용하기 위해서는 형사소송법 제313조 제1항에 따라 공판준비나 공판기일에서 원진술자의 진술에 의하여 그 녹음테이프에 녹음된 진술내용이 자신이 진술한 대로 녹음된 것이라는 점이 인정되어야 하는 것이지만, 이와는 달리 녹음테이프에 대한 검증의 내용이 그 진술 당시 진술자의 상태 등을 확인하기 위한 것인 경우에는, 녹음테이프에 대한 검증조서의 기재 중 진술내용을 증거로 사용하는 경우에 관한 위 법리는 적용되지 아니하고, 따라서 위 검증조서는 법원의 검증의 결과를 기재한 조서로서 형사소송법 제311조에 의하여 당연히 증거로 할 수 있다(대판 2008.07.10. 2007도10755).", "answer": "X"}, {"source": "14변시", "question": "전문법칙에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증거보전절차에서 이루어진 甲에 대한 증인신문조서 중 당시 피의자였던 피고인 乙이 당사자로 참여하여 자신의 범행사실을 시인하는 전제하에 甲에게 반대신문을 하는 과정에서 乙이 행한 진술기재 부분은, 형사소송법 제184조에 의한 증인신문조서에 해당하므로 형사소송법 제311조에 의하여 증거능력이 인정된다.", "explanation": "증인신문조서가 증거보전절차에서 피고인이 증인으로서 증언한 내용을 기재한 것이 아니라 증인(갑)의 증언내용을 기재한 것이고 다만 피의자였던 피고인이 당사자로 참여하여 자신의 범행사실을 시인하는 전제하에 위 증인에게 반대신문 한 내용이 기재되어 있을 뿐이라면, 위 조서는 공판준비 또는 공판기일에 피고인 등의 진술을 기재한 조서도 아니고, 반대신문과정에서 피의자가 한 진술에 관한 한 형사소송법 제184조에 의한 증인신문조서도 아니므로 위 조서 중 피의자의 진술기재부분에 대하여는 형사소송법 제311조에 의한 증거능력을 인정할 수 없다(대판 1984.05.15. 84도508).", "answer": "X"}, {"source": "14변시", "question": "전문법칙에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "공범자가 당해 피고인과 별개의 공판절차에서 피고인으로서 공동범행에 관하여 한 진술이 기재된 공판조서가 당해 피고인의 공판에서 증거로 제출된 경우 이는 형사소송법 제311조에서 규정한 ‘법원 또는 법관의 조서’에 해당되지는 않지만, 특히 신용할 만한 정황에 의하여 작성된 문서이므로 그 증거능력이 인정된다.", "explanation": "다른 피고인에 대한 형사사건의 공판조서는 형사소송법 제315조 제3호에 정한 서류로서 당연히 증거능력이 있는바, 공판조서 중 일부인 증인신문조서 역시 형사소송법 제315조 제3호에 정한 서류로서 당연히 증거능력이 있다고 보아야 할 것이다(대판 2005.04.28. 2004도4428).", "answer": "O"}, {"source": "14변시", "question": "전문법칙에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "감정인이 법원의 명에 의하여 감정을 하고 그 감정결과를 기재한 감정서는 직무상 증명할 수 있는 사항에 관하여 작성한 문서이므로 피고인이 증거로 함에 부동의하더라도 당연히 증거능력이 있다.", "explanation": "감정서가 법원 또는 법관의 감정명령에 의하는 경우에는 선서(형사소송법 제 170조)와 형법상의 제재에 의하여 공정성이 담보된다는 점에서 진술서에 준하여 증거능력이 인정 된다. 즉 감정서는 형사소송법 제315조 제1호의 직무상 증명할 수 있는 사항에 관한 공무원작성문서가 아니라 형사소송법 제313조 제3항에 의하여 증거능력이 인정된다.", "answer": "X"}, {"source": "14변시", "question": "형사소송법 제314조에서 규정한 ‘진술을 요하는 자가 사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증인에 대한 소재탐지촉탁을 하여 소재수사를 하였으나 그 소재를 확인할 수 없었는데, 진술조서에 기재된 증인의 전화번호로 연락하여 보지 아니하는 등 증인의 법정 출석을 위한 가능하고도 충분한 노력을 다하지 않은 경우", "explanation": "[1] 형사소송법 제314조에 의하여 같은 법 제312조의 조서나 같은 법 제313조의 진술서, 서류 등을 증거로 하기위하여는 공판기일에 진술을 요하는 자가 사망·질병·외국거주·소재불명 그 밖에 이에 준하는 사유로 인하여 공판정에 출석하여 진술을 할 수 없는 경우이어야 하고, 그 진술 또는 서류의 작성이 특히 신빙할 수 있는 상태하에서 행하여진 것이어야 한다는 두 가지 요건을 갖추어야 한다. 그리고 직접주의와 전문법칙의 예외를 정한 형사소송법 제314조의 요건 충족 여부는 엄격히 심사하여야 하고, 전문증거의 증거능력을 갖추기 위한 요건에 관한 증명책임은 검사에게 있으므로, 법원이 증인이 소재불명이거나 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때에 해당한다고 인정할 수 있으려면, 증인의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 불구하고 부득이 증인의 법정 출석이 불가능하게 되었디는 사정을 검사가 증명한 경우여야 한다. [2] 제1심법원이 증인 갑의 주소지에 송달한 증인소환장이 송달되지 아니하자 갑에 대한 소재탐지를 촉탁하여 소재탐지 불능 보고서를 제출받은 다음 갑이 ‘소재불명’인 경우에 해당한다고 보아 갑에 대한 경찰 및 검찰 진술조서를 증거로 채택한 사안에서, 검사가 제출한 증인신청서에 휴대전화번호가 기재되어 있고, 수사기록 중 갑에 대한 경찰 진술조서에는 집 전화번호도 기재되어 있으며, 그 이후 작성된 검찰 진술조서에는 위 휴대전화번호와 다른 휴대전화번호가 기재되어 있는데도, 검사가 직접 또는 경찰을 통하여 위 각 전화번호로 갑에게 연락하여 법정 출석의사가 있는지 확인하는 등의 방법으로 갑의 법정 출석을 위하여 상당한 노력을 기울였다는 자료가 보이지 않는 사정에 비추어, 갑의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 부득이 갑의 법정출석이 불가능하게 되었다는 사정이 증명된 경우라고 볼 수 없어 형사소송법 제314조의 ‘소재불명 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당한다고 인정할 수 없는데도, 이와 달리 보아 갑에 대한 경찰 및 검찰 진술조서가 형사소송법 제314조에 의하여 증거능력이 있는 것으로 인정한 원심판결에 법리오해의 위법이 있다(대판 2013.04.11. 2013도1435).", "answer": "X"}, {"source": "14변시", "question": "형사소송법 제314조에서 규정한 ‘진술을 요하는 자가 사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증인이 형사소송법에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우", "explanation": "형사소송법 제314조는 “제312조 또는 제313조의 경우에 공판준비 또는 공판기일에 진술을 요하는 자가 사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때에는 그 조서 및 그 밖의 서류를 증거로 할 수 있다. 다만, 그 진술 또는 작성이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한한다.\"라고 정함으로써, 원진술자 등의 진술에 의하여 진정성립이 증명되지 아니하는 전문증거에 대하여 예외적으로 증거능력이 인정될 수 있는 사유로 ‘사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’를 들고 있다. 위 증거능력에 대한 예외사유로 1995. 12. 29. 법률 제5054호로 개정되기 전의 구 형사소송법 제314조가 ‘사망, 질병 기타 사유로 인하여 진술할 수 없는 때’, 2007. 6. 1. 법률 제8496호로 개정되기 전의 구 형사소송법 제314조가 ‘사망, 질병, 외국거주 기타 사유로 인하여 진술할 수 없는 때’라고 각 규정한 것에 비하여 현행 형사소송법은 그 예외사유의 범위를 더욱 엄격하게 제한하고 있는데, 이는 직접심리주의와 공판중심주의의 요소를 강화하려는 취지가 반영된 것이다. 한편 형사소송법은 누구든지 자기 또는 친족 등이 형사소추 또는 공소제기를 당하거나 유죄판결을 받을 사실이 발로될 염려가 있는 증언을 거부할 수 있도록 하고(제148조), 또한 변호사, 변리사, 공증인, 공인회계사, 세무사, 대서업자, 의사, 한의사, 치과의사, 약샤, 약종상, 조산사, 간호사, 종교의 직에 있는 자 또는 이러한 직에 있던 사람은 그 업무상 위탁을 받은 관계로 알게 된 사실로서 타인의 비밀에 관한 것은 증언을 거부할 수 있도록 규정하여(제149조 본문), 증인에게 일정한 사유가 있는 경우 증언을 거부할 수 있는 권리를 보장하고 있다. 위와 같은 현행 형사소송법 제314조의 문언과 개정 취지, 증언거부권 관련 규정의 내용 등에 비추어 보면, 법정에 출석한 증인이 형사소송법 제148조, 제149조 등에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우는 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 아니한다(대판 2012.05.17. 2009도6788(전합)).", "answer": "X"}, {"source": "14변시", "question": "형사소송법 제314조에서 규정한 ‘진술을 요하는 자가 사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 증거서류의 진정성립을 묻는 검사의 질문에 대하여 진술거부권을 행사하여 진술을 거부한 경우", "explanation": "현행 형사소송법 제314조의 문언과 개정 취지, 진술거부권 관련 규정의 내용 등에 비추어 보면, 피고인이 증거서류의 진정성립을 묻는 검사의 질문에 대하여 진술거부권을 행사하여 진술을 거부한 경우는 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 아니한다(대판  2013.06.13. 2012도16001).", "answer": "X"}, {"source": "14변시", "question": "형사소송법 제314조에서 규정한 ‘진술을 요하는 자가 사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "수사기관에서 진술한 피해자인 유아가 공판정에서 진술을 하였으나 증인신문 당시 대부분의 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 수사기관에서 행한 진술이 재현 불가능하게 된 경우", "explanation": "[1] 형사소송법 제314조, 제316조 제2항에서 말하는 ‘원진술자가 진술을 할 수 없는 때’에는 사망, 질병 등 명시적으로 열거된 사유 외에도 원진술자가 공판정에서 진술을 한 경우라도 증인신문 당시 일정한 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 그 진술의 일부가 재현 불가능하게 된 경우도 포함하는 것이고, 위 규정들에서 ‘그 진술 또는 작성이 특히 신빙할 수 있는 상태하에서 행하여진 때’라 함은 그 진술내용이나 조서 또는 서류의 작성에 허위개입의 여지가 거의 없고, 그 진술내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우를 가리킨다. [2] 수사기관에서 진술한 피해자인 유아가 공판정에서 진술을 하였더라도 증인신문 당시 일정한 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 그 진술의 일부가 재현 불가능하게 된 경우, 형사소송법 제314조, 제316조 제2항에서 말하는 ‘원진술자가 진술을 할 수 없는 때’에 해당한다(대판 2006.04.14. 2005도9561).", "answer": "O"}, {"source": "12변시", "question": "다음 <사례>에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)\n<사례>\na. 甲은 피해자 乙(만 17세)을 강간하였다. \nb. 乙은 丙(乙의 母)에게 강간피해사실을 알렸다. \nc.  중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)\n<사례>\na. 甲은 피해자 乙(만 17세)을 강간하였다. \nb. 乙은 丙(乙의 母)에게 강간피해사실을 알렸다. \nc. 丙은 丁(성폭력상담소장)에게 乙의 강간피해사실을 말하고, 丁의 조언에 따라 甲을 강간죄로 고소하였다. \nd. 戊(乙의 父)는 丙에게 이 사실을 전해 듣고 甲을 찾아가 따지자 甲은 강간사실을 인정하고 사죄하였다. \ne. 검사는 乙에 대한 진술조서, 丙에 대해서는 乙로부터 사건에 관해 들었다는 취지의 진술조서, 戊에 대해서는 甲이 강간사실을 시인하였다는 취지의 진술조서를 작성하였다. \nf. 검사는 甲을 소환하여 조사하였으나 甲은 혐의를 부인하였고, 甲은 기소된 후 공판정에서도 공소사실을 부인하였다. \ng. 검사는 乙과 戊를 증인으로 신청했지만, 乙은 정상적인 진술이 전혀 불가능한 정도의 심각한 정신병으로 출석할 수 없었고, 戊는 甲에 대한 공소제기 전에 사망하였음이 확인되었다. \nh. 검사는 丙과 丁을 증인으로 신청하였고, 乙, 丙, 戊에 대한 각 검사작성 진술조서를 증거로 제출하였으며, 丙은 공판정에서 자신에 대한 진술조서의 진정성립을 인정하였다(조서 작성 방식과 절차는 적법하였고, 증인신문절차에서의 반대신문의 기회는 보장되었음). ", "choice": "戊에 대한 검사 작성의 진술조서 중 '甲이 乙에 대한 강간범행을 시인하였다'는 부분은 甲이 戊에게 한 진술 및 戊의 검찰 진술이 특히 신빙할 수 있는 상태에서 행하여졌다면 증거능력이 있다. ", "explanation": "戊에 대한 진술조서 중 ‘甲이 乙에 대한 강간범행을 시인하였다’는 진술 부분은 피고인 아닌 戊가 피고인 甲의 진술을 전문한 것을 기재한 조서이므로 피고인이 증거동의 하지 않는 한, 제312조 제4항의 요건과 제316조 제1항의 요건을 모두 충족하여야 증거능력이 있다. i) 그런데 조서 작성 후 戊가 사망한 바, 제312조 제4항에도 불구하고 戊의 진술불능(필요성)에 따라 제314조의 특신상태가 증명된다면 증거능력이 인정될 수 있다. 따라서 戊의 검찰에서의 진술 또는 작성이 특신상태 하에서 행하여졌다는 점(제314조)  및 ii) 甲이 戊에게 범행을 시인한 진술이 특신상태 하에서 행하여졌다는 점(제316조 제1항)이 증명되면 증거능력이 인정된다.", "answer": "O"}, {"source": "12변시", "question": "甲과 乙은 합동하여 A의 금반지를 절취한 사실로, 丙은 甲으로부터 위 금반지가 훔친 물건임을 알면서 이를 양수한 사실로 각 기소되어 한 사건절차 내에서 공동피고인으로 재판을 받고 있다. 다음의 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "공판절차 중 검사의 乙에 대한 피고인신문에서 乙이 한 \"나(乙)는 甲과 함께 금반지를 훔쳤다.\"라는 답변은 甲에 대한 유죄의 증거가 된다.", "explanation": "형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 진술은 포함되지 않으며, 이러한 공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립한 증거능력이 있다(대판 1992.07.28. 92도917).", "answer": "O"}, {"source": "12변시", "question": "甲과 乙은 합동하여 A의 금반지를 절취한 사실로, 丙은 甲으로부터 위 금반지가 훔친 물건임을 알면서 이를 양수한 사실로 각 기소되어 한 사건절차 내에서 공동피고인으로 재판을 받고 있다. 다음의 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "공판절차 중 검사의 丙에 대한 피고인신문에서 丙이 \"나(丙)는 甲이 A로부터 훔친 것인 줄 알면서 위 금반지를 甲으로부터 양수하였다.\"라는 답변은 甲에 대한 유죄의 증거가 된다.", "explanation": "피고인과 별개의 범죄사실로 기소되어 병합심리되고 있던 공동피고인은 피고인에 대한 관계에서는 증인의 지위에 있음에 불과하므로 선서 없이 한 그 공동피고인의 법정 및 검찰진술은 피고인에 대한 공소범죄사실을 인정하는 증거로 할 수 없다(대판 1982.06.22. 82도898).", "answer": "X"}, {"source": "12변시", "question": "甲과 乙은 합동하여 A의 금반지를 절취한 사실로, 丙은 甲으로부터 위 금반지가 훔친 물건임을 알면서 이를 양수한 사실로 각 기소되어 한 사건절차 내에서 공동피고인으로 재판을 받고 있다. 다음의 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증거서류의 증거능력 유무에 관한 의견진술절차에서, 丙에 대한 검사작성의 피의자신문조서에 대하여 甲은 부동의하고 丙은 진정성립 및 임의성을 인정할 경우, 위 丙에 대한 검사 작성의 피의자신문조서는 甲에 대한 유죄의 증거가 된다.", "explanation": "공범이 아닌 공동피고인의 검사 작성의 피의자신문조서는 공동피고인이 당해 피고인과의 관계에서 순수한 제3자에 해당하므로 형소법 제312조 제4항이 적용되어 피고인이 증거 부동의를 히는 경우에는 진정성립 등이 증명된 때에 한해서 증거능력이 인정된다고 할 것이다(이창현, 형사소송법 제9판, p.899- 900 참조). 따라서 성립의 진정이 원진술자에 의하여 인정되더라도 반대신문권의 보장과 특신상태가 요구된다. 설문 상 이러한 요건이 없으므로 틀린 지문으로 봐야 한다.\n\n[判例]  피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증 인의 지위에 있다 할 것이므로 선서 없이 한 공동피고인의 법정진술이나 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자 신문조서는 피고인의 공소 범죄사실을 인정하는 증거로 할 수 없다(대판 1982.09.140 82도1000).", "answer": "X"}, {"source": "12변시", "question": "甲과 乙은 합동하여 A의 금반지를 절취한 사실로, 丙은 甲으로부터 위 금반지가 훔친 물건임을 알면서 이를 양수한 사실로 각 기소되어 한 사건절차 내에서 공동피고인으로 재판을 받고 있다. 다음의 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "甲이 수사기관과는 부관하게, A로부터 훔친 위 금반지를 처분하기 위하여 자신이 丙과 전화통화한 흥정 내용을 丙 몰래 녹음한 경우, 그 녹음테이프가 형사소송법 제313조(진술서 등) 제1항의 요건을 충족한다면 丙에 대한 유죄의 증거가 된다.", "explanation": "사인인 대화자 중 일방이 상대방의 동의 없이 대화를 녹음하였다고 하더라도 통신비밀보호법 위반이 아니므로 증거로 사용할 수 있고 형사소송법 제313조 제1 항의 요건을 충족한다면 증거능력이 인정된다. \n\n[判例] 녹음테이프 검증조서의 기재 중 고소인이 피고인과의 대화를 녹음한 부분은 타인간의 대화를 녹음한 것이 아니므로 위 법 제14조의 적용을 받지는 않지만, 그 녹음테이프에 대하여 실시한 검증의 내용은 녹음테이프에 녹음된 대화의 내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과하여 증거자료가 되는 것은 여전히 녹음테이프에 녹음된 대화의 내용이라 할 것인바, 피고인의 진술내용은 실질적으로 형사소송법 제311조, 제312조 규정 이외에 피고인의 진술을 기재한 서류와 다를 바 없으므로, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 그 녹음테이프 검증조서의 기재 중 피고인의 진술내용을 증거로 사용하기 위해서는 형사소송법 제313조 제1항 단서에 따라 공판준비 또는 공판기일에서 그 작성자인 고소인의 진술에 의하여 녹음테이프에 녹음된 피고인의 진술내용이 피고인이 진술한 대도 녹음한 것이라는 점이 증명되고 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여진 것으로 인정되어야 한다(대판 2001.10.09. 2001도3106).", "answer": "O"}, {"source": "25변시", "question": "증거동의에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "검사가 신청한 증거들에 관한 변호인의 증거동의에 대하여 피고인이 즉시 이의하지 아니하면 그 증거들의 증거능력이 인정되고, 그 이후 피고인이 증거조사 완료 전에 변호인의 위 동의를 취소하거나 철회한다고 하더라도 일단 부여된 증거능력은 그대로 유지된다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않으며, 또한 증거로 함에 대한 동의의 주체는 소송주체인 당사자라 할 것이지만 변호인은 피고인의 명시한 의사에 반하지 아니하는 한 피고인을 대리하여 증거로 함에 동의할 수 있으므로 피고인이 증거로 함에 동의하지 아니한다고 명시적인 의사표시를 한 경우 이외에는 변호인은 서류나 물건에 대하여 증거로 함에 동의할 수 있고, 이 경우 변호인의 동의에 대하여 피고인이 즉시 이의하지 아니하는 경우에는 변호인의 동의로 증거능력이 인정되어 증거조사 완료 전까지 그 동의가 취소 또는 철회하지 아니한 이상 일단 부여된 증거능력은 그대로 존속한다(대판 2005. 4. 28. 선고 2004도4428). ▶ 증거조사 완료 전에 변호인의 동의를 취소하거나 철회하였다면 증거동의에 의한 증거능력은 인정되지 않는다. ", "answer": "X"}, {"source": "25변시", "question": "증거동의에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "제1심에서 무죄판결이 선고되어 검사가 항소한 후, 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 증거능력이 없고, 피고인이 증거로 할 수 있음에 동의한 경우에도 마찬가지이다.", "explanation": "제1심에서 피고인에 대하여 무죄판결이 선고되어 검사가 항소한 후, 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 피고인이 증거로 사용할 수 있음에 동의하지 않는 한 증거능력이 없다(대판 2019. 11. 28. 선고 2013도6825). ▶ 이 경우 피고인이 증거로 할 수 있음에 동의한다면 증거능력이 인정된다.", "answer": "X"}, {"source": "25변시", "question": "증거동의에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "검사가 제출한 증거 중 고발장에 대하여 피고인 및 변호인이 부동의 의견을 밝히고, 같은 고발장이 첨부된 검찰주사보 작성의 수사보고에 대하여는 증거동의를 하여 증거조사가 이루어진 경우, 수사보고에 대한 증거동의의 효력은 첨부된 고발장에도 당연히 미치므로 위 고발장을 유죄의 증거로 삼을 수 있다.", "explanation": "검찰관이 공판기일에 제출한 증거 중 뇌물공여자 甲이 작성한 고발장에 대하여 피고인의 변호인이 증거 부동의 의견을 밝히고, 같은 고발장을 첨부문서로 포함하고 있는 검찰주사보 작성의 수사보고에 대하여는 증거에 동의하여 증거조사가 행하여졌는데, 원심법원이 수사보고에 대한 증거동의의 효력이 첨부된 고발장에도 당연히 미친다고 보아 이를 유죄의 증거로 삼은 사안에서, 수사기관이 수사과정에서 수집한 자료를 기록에 현출시키는 방법으로 자료의 의미, 성격, 혐의사실과의 관련성 등을 수사보고의 형태로 요약·설명하고 해당 자료를 수사보고에 첨부하는 경우, 수사보고에 기재된 내용은 수사기관이 첨부한 자료를 통하여 얻은 인식·판단·추론이거나 자료의 단순한 요약에 불과하여 원 자료로부터 독립하여 공소사실에 대한 증명력을 가질 수 없고, 피고인이나 변호인도 수사보고의 증명력을 위와 같은 취지로 이해하여 공소사실을 부인하면서도 수사보고의 증거능력을 다투지 않은 것으로 보이는 등의 제반 사정에 비추어, 위 고발장은 군사법원법에 따른 적법한 증거신청·증거결정·증거조사 절차를 거쳤다고 볼 수 없거나 공소사실을 뒷받침하는 증명력을 가진 증거가 아니므로 이를 유죄의 증거로 삼을 수 없다고 한 사례(대판 2011. 7. 14. 선고 2011도3809). ▶ 판결이유 참조: 변호인이 동일한 고발장에 대하여 이미 증거에 동의하지 않는다는 의사를 표시한 바 있으므로 이 사건 수사보고에 관하여 증거로 동의한다는 의사를 표시하더라도 그에 첨부된 고발장을 따로 피고인과 변호인에게 제시하여 해당 부분 증거동의 여부에 관한 진의를 확인하는 등 적절한 소송지휘권을 행사하였어야 했음에도 불구하고, 이 사건 수사보고에 대한 증거동의가 있다는 이유로 아무런 지적 없이 그에 첨부된 고발장까지 증거로 채택해 두었다가 판결을 선고하는 단계에 이르러 이를 유죄 인정의 증거로 삼은 것은 실질적 적법절차의 원칙에 비추어 수긍할 수 없다.", "answer": "X"}, {"source": "25변시", "question": "증거동의에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우, 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다 하더라도 변호인의 증거동의는 특별한 사정이 없는 한 효력이 없다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 주체는 소송 주체인 검사와 피고인이고, 변호인은 피고인을 대리하여 증거동의에 관한 의견을 낼 수 있을 뿐이므로 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수는 없다. 따라서 피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다 하더라도 이는 특별한 사정이 없는 한 효력이 없다고 보아야 한다(대판 2013.03.28. 2013도3).", "answer": "O"}, {"source": "25변시", "question": "증거동의에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 연속 불출정하여 증거동의가 간주된 후 증거조사를 완료한 경우, 피고인이 항소심에 출석하여 공소사실을 부인하면서 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하면 증거능력이 상실된다.", "explanation": "약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 불출정하여 형사소송법 제318조 제2항에 따른 증거동의가 간주된 후 증거조사를 완료한 이상, 간주의 대상인 증거동의는 증거조사가 완료되기 전까지 철회 또는 취소할 수 있으나 일단 증거조사를 완료한 뒤에는 취소 또는 철회가 인정되지 아니하는 점, 증거동의 간주가 피고인의 진의와는 관계없이 이루어지는 점 등에 비추어, 비록 피고인이 항소심에 출석하여 공소사실을 부인하면서 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하더라도 그로 인하여 적법하게 부여된 증거능력이 상실되는 것이 아니다(대판 2010. 07. 15. 2007도5776).", "answer": "X"}, {"source": "23변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 출석한 공판기일에서 증거로 함에 부동의한 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만 출석하여 종전 의견을 번복하여 증거로 함에 동의하였더라도 효력이 없다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 주체는 소송 주체인 검사와 피고인이고, 변호인은 피고인을 대리하여 증거동의에 관한 의견을 낼 수 있을 뿐이므로 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수는 없다. 따라서 피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다 하더라도 이는 특별한 사정이 없는 한 효력이 없다고 보아야 한다(대판 2013. 3. 28. 선고 2013도3).", "answer": "O"}, {"source": "23변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "개개의 증거에 대하여 개별적으로 증거동의를 받지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 증거동의가 이루어진 것일지라도 증거동의로서의 효력을 부정할 이유가 되지 못한다.", "explanation": "개개의 증거에 대하여 개별적인 증거조사방식을 거치지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 이루어진 것이라 하여도 증거동의로서의 효력을 부정할 이유가 되지 못한다(대판 1983. 3. 8. 선고 82도2873).", "answer": "O"}, {"source": "23변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "｢형사소송법｣ 제184조에 의한 증거보전절차에서 증인신문을 하는 경우 피의자에게 증인신문에 참여할 수 있는 기회를 주지 아니하고 작성된 증인신문조서는 피의자였던 피고인이 법정에서 그 증인신문조서를 증거로 할 수 있음에 동의하여 별다른 이의 없이 적법하게 증거조사를 거친 경우라 하더라도 증거능력이 부여되지 않는다.", "explanation": "판사가 형사소송법 제184조에 의한 증거보전절차로 증인신문을 하는 경우에는 동법 제221조의2에 의한 증인신문의 경우와는 달라 동법 제163조에 따라 검사, 피의자 또는 변호인에게 증인신문의 시일과 장소를 미리 통지하여 증인신문에 참여할 수 있는 기회를 주어야 하나 참여의 기회를 주지 아니한 경우라도 피고인과 변호인이 증인신문조서를 증거로 할 수 있음에 동의하여 별다른 이의없이 적법하게 증거조사를 거친 경우에는 위 증인신문조서는 증인신문절차가 위법하였는지의 여부에 관계없이 증거능력이 부여된다(대판 1988. 11. 8. 선고 86도1646).", "answer": "X"}, {"source": "23변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증거동의의 의사표시는 증거조사가 완료되기 전까지 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 철회할 수 없다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다(대판 1999. 8. 20. 선고 99도2029).", "answer": "O"}, {"source": "23변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 ｢형사소송법｣ 제318조 제1항의 증거동의가 있는 것으로 간주되지만, 대리인 또는 변호인이 출정한 때에는 그러하지 아니하다.", "explanation": "형사소송법 제318조 참조.\n\n제318조 (당사자의 동의와 증거능력) ① 검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다.\n② 피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 전항의 동의가 있는 것으로 간주한다. 단, 대리인 또는 변호인이 출정한 때에는 예외로 한다.", "answer": "O"}, {"source": "20변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증거동의는 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 하여도 효력이 있다.", "explanation": "개개의 증거에 대하여 개별적인 증거조사방식을 거치지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 이루어진 것이라 하여도 증거동의로서의 효력을 부정할 이유가 되지 못한다(대판 1983. 3. 8. 선고 82도2873).", "answer": "O"}, {"source": "20변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "변호인은 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수 있다.", "explanation": "변호인은 피고인의 명시한 의사에 반하지 아니하는 한 피고인을 대리하여 증거로 함에 동의할 수 있으므로 피고인이 증거로 함에 동의하지 아니한다고 명시적인 의사표시를 한 경우 이외에는 변호인은 서류나 물건에 대하여 증거로 함에 동의할 수 있고 이 경우 변호인의 동의에 대하여 피고인이 즉시 이의하지 아니하는 경우에는 변호인의 동의로 증거능력이 인정된다(대판 1988. 11. 8. 선고 88도1628).", "answer": "X"}, {"source": "20변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "간이공판절차에서는 검사, 피고인 또는 변호인이 증거로 함에 이의가 없는 한 전문증거에 대하여 동의가 있는 것으로 간주한다.", "explanation": "형사소송법 제318조의3 참조.\n\n제318조의3(간이공판절차에서의 증거능력에 관한 특례)제286조의2의 결정이 있는 사건의 증거에 관하여는 제310조의2, 제312조 내지 제314조 및 제316조의 규정에 의한 증거에 대하여 제318조제1항의 동의가 있는 것으로 간주한다. 단, 검사, 피고인 또는 변호인이 증거로 함에 이의가 있는 때에는 그러하지 아니하다.", "answer": "O"}, {"source": "20변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "제1심 공판절차에서 피고인이 공시송달의 방법에 의한 공판기일 소환을 2회 이상 받고도 출석하지 아니하여 ｢소송촉진 등에 관한 특례법｣ 제23조 본문에 따라 피고인의 출정 없이 증거조사를 하는 때에는, ｢형사소송법｣ 제318조 제2항에 따른 증거동의가 간주된다.", "explanation": "소송촉진 등에 관한 특례법(이하 ‘소촉법’이라 한다) 제23조는 “제1심 공판절차에서 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 피고인의 소재를 확인할 수 없는 경우에는 대법원규칙으로 정하는 바에 따라 피고인의 진술 없이 재판할 수 있다. 다만, 사형, 무기 또는 장기 10년이 넘는 징역이나 금고에 해당하는 사건의 경우에는 그러하지 아니하다.”라고 규정하고 있고, 형사소송법 제318조 제2항은 “피고인의 출정 없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 피고인의 동의가 있는 것으로 간주한다. 단, 대리인 또는 변호인이 출정한 때에는 예외로 한다.”고 규정하고 있는바, 소촉법 제23조의 경우 피고인의 출정 없이도 심리·판결할 수 있고 공판심리의 일환으로 증거조사가 행해지게 마련이어서 피고인이 출석하지 아니한 상태에서 증거조사를 할 수밖에 없는 경우에는 형사소송법 제318조 제2항의 규정상 피고인의 진의와는 관계없이 형사소송법 제318조 제1항의 동의가 있는 것으로 간주하게 되어 있는 점, 형사소송법 제318조 제2항의 입법 취지가 재판의 필요성 및 신속성, 즉 피고인의 불출정으로 인한 소송행위의 지연 방지 내지 피고인 불출정의 경우 전문증거의 증거능력을 결정하지 못함에 따른 소송지연 방지에 있는 점 등에 비추어, 피고인이 공시송달의 방법에 의한 공판기일의 소환을 2회 이상 받고도 출석하지 아니하여 법원이 피고인의 출정 없이 증거조사를 하는 경우에는 형사소송법 제318조 제2항에 따른 피고인의 증거동의가 있는 것으로 간주된다고 할 것이다(대판 2011. 3. 10. 선고 2010도15977).", "answer": "O"}, {"source": "20변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "필요적 변호사건에서 피고인과 변호인이 재판거부의 의사를 표시하고 재판장의 허가 없이 퇴정한 경우, ｢형사소송법｣ 제318조 제2항에 따라 증거동의가 간주된다.", "explanation": "필요적 변론사건이라 하여도 피고인(관련 공동피고인들 포함)이 재판거부의 의사를 표시하고 재판장의 허가 없이 퇴정하고 변호인 마저 이에 동조하여 퇴정해 버린 것은 모두 피고인측의 방어권의 남용 내지 변호권의 포기로 볼 수 밖에 없는 것이어서 수소법원으로서는 형사소송법 제330조에 의하여 피고인이나 변호인의 재정 없이도 심리 판결할 수 있는 것이고 ( 당원 1990.6.12.선고 90도672 판결, 1990.6.8.선고 90도646 판결 등 참조) 또 공판심리는 사실심리와 증거조사가 행해지게 마련인데 이와 같이 피고인과 변호인들이 출석하지 않은 상태에서 증거조사를 할 수밖에 없는 경우에는 형사소송법 제318조 제2항의 규정상 피고인의 진의와는 관계없이 형사소송법 제318조 제1항의 동의가 있는 것으로 간주하게 되어 있는 것이므로 원심이 위와 같은 사실들을 바탕으로 하여 피고인의 항소(양형과경부당을 이유로 한 검사의 항소기각 포함)를 기각한 것은 위에서 본 법리를 염두에 둔 것으로 보여져 옳고 여기에 소론과 같은 위법이 없다. 논지는 모두 이유 없다(대판 1991. 6. 28. 선고 91도865)", "answer": "O"}, {"source": "18변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "사법경찰관이 소유자, 소지자 또는 보관자가 아닌 자로부터 임의로 제출받은 물건을 영장없이 압수한 경우, 그 '압수물' 및 '압수물을 찍은 사진'은 피고인이나 변호인이 증거로 함에 동의하였다 하더라도 이를 유죄의 증거로 사용할 수 없다.", "explanation": "형사소송법 제218조는 ‘사법경찰관은 소유자, 소지자 또는 보관자가 임의로 제출한 물건을 영장없이 압수할 수 있다’고 규정하고 있는바, 위 규정을 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 제출받은 물건을 영장없이 압수한 경우 그 압수물 및 압수물을 찍은 사진은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다(대판 2010. 1. 28. 선고 2009도10092).", "answer": "O"}, {"source": "18변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 증거동의의 법적효과에 대하여 잘 모르고 동의한 것이었다고 주장하나 그렇게 볼 만한 자료가 없고 변호인이 공판정에 재정하고 있으면서 피고인이 하는 동의에 대하여 아무런 이의나 취소를 한 사실이 없다면 그 동의에 법률적 하자가 있다고는 할 수 없다.", "explanation": "피고인이 사법경찰관작성의 피해자진술조서를 증거로 동의함에 있어서 그 동의가 법률적으로 어떠한 효과가 있는지를 모르고 한 것이었다고 주장하더라도 변호인이 그 동의시 공판정에 재정하고 있으면서 피고인이 하는 동의에 대하여 아무런 이의나 취소를 한 사실이 없다면 그 동의에 무슨 하자가 있다고 할 수 없다(대판 1983. 6. 28. 선고 83도1019).", "answer": "O"}, {"source": "18변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견을 진술한 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다면 이는 특별한 사정이 없는 한 증거동의의 효력이 없다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 주체는 소송 주체인 검사와 피고인이고, 변호인은 피고인을 대리하여 증거동의에 관한 의견을 낼 수 있을 뿐이므로 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수는 없다. 따라서 피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다 하더라도 이는 특별한 사정이 없는 한 효력이 없다고 보아야 한다(대판 2013. 3. 28. 선고 2013도3).", "answer": "O"}, {"source": "18변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 제1심 법정에서 경찰의 검증조서 중 범행에 관한 현장진술 부분에 대해서만 부동의하고 범행현장상황 부분에 대해서는 증거동의한 경우, 위 검증조서 중 동의한 범행현장상황 부분만을 증거로 채용할 수는 없다.", "explanation": "피고인들이 제1심 법정에서 경찰의 검증조서 가운데 범행부분만 부동의하고 현장상황 부분에 대해서는 모두 증거로 함에 동의하였다면, 위 검증조서 중 범행상황 부분만을 증거로 채용한 제1심판결에 잘못이 없다(대판 1990. 7. 24. 선고 90도1303).", "answer": "X"}, {"source": "18변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "수사기관이 A로부터 피고인의 폭력행위등처벌에관한법률위반(단체등의구성·활동)범행에 대한 진술을 듣고 추가적인 정보를 확보할 목적으로, 구속수감되어 있던 A에게 그의 압수된 휴대전화를 제공하여 피고인과 통화하게 하고 위 범행에 관한 통화내용을 녹음하게 한 경우, 그 녹음 자체는 물론 이를 근거로 작성된 녹취록 첨부 수사보고는 설령 피고인의 증거동의가 있는 경우에도 이를 유죄의 증거로 사용할 수 없다.", "explanation": "수사기관이 甲으로부터 피고인의 마약류관리에 관한 법률 위반(향정) 범행에 대한 진술을 듣고 추가적인 증거를 확보할 목적으로, 구속수감되어 있던 甲에게 그의 압수된 휴대전화를 제공하여 피고인과 통화하고 위 범행에 관한 통화 내용을 녹음하게 한 행위는 불법감청에 해당하므로, 그 녹음 자체는 물론 이를 근거로 작성된 녹취록 첨부 수사보고는 피고인의 증거동의에 상관없이 그 증거능력이 없다(대판 2010. 10. 14. 선고 2010도9016).", "answer": "O"}, {"source": "16변시", "question": "증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사문서위조죄의 행위자에게 ‘행사할 목적’이 있었다는 점은 검사가 증명하여야 하나 그 증명은 반드시 엄격한 증명에 의하여야 하는 것은 아니다.", "explanation": "엄격한 증명이란, 증거능력있는 증거에 의하여 법정의 증거조사방식에 따라 행하는 증명을 말한다. 형사절차에서 형벌권의 존부나 범위와 관련된 사실은 모두 엄격한 증명의 대상이 된다고 할 수 있다. 따라서 공소범죄사실로서 구성요건해당성 위법성과 책임사실, 처벌조건 뿐만 아니라 법률상 형의 가중 · 감면사실까지 엄격한 증명의 대상이 된다. 따라서 사문서위조죄의 ‘행사할 목적’이란 구성요건으로서 이는 엄격한 증명의 대상이 된다.", "answer": "X"}, {"source": "16변시", "question": "증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수표를 발행한 후 예금부족 등으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 증거물인 서면에 해당하므로 전문법칙이 적용되지 않는다.", "explanation": "피고인이 수표를 발행하였으나 예금부족 또는 거래정지처분으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 그 서류의 존재 또는 상태 자체가 증거가 되는 것이어서 증거물인 서면에 해당하고 어떠한 사실을 직접 경험한 사람의 진술에 갈음하는 대체물이 아니므로, 증거능력은 증거물의 예에 의하여 판단하여야 하고, 이에 대하여는 형사소송법 제310조의2에서 정한 전문법칙이 적용될 여지가 없다. 이때 수표 원본이 아니라 전지복사기를 사용하여 복사한 사본이 증거로 제출되었고 피고인이 이를 증거로 하는 데 부동의한 경우 위 수표 사본을 증거로 사용하기 위해서는 수표 원본을 법정에 제출할 수 없거나 제출이 곤란한 사정이 있고 수표 원본이 존재하거나 존재하였으며 증거로 제출된 수표 사본이 이를 정확하게 전사한 것이라는 사실이 증명되어야 한다(대판 2015.04.23. 2015도2275).", "answer": "O"}, {"source": "16변시", "question": "증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 증거 동의가 있는 것으로 간주하지만 변호인이 출정한 때에는 그러하지 아니하다.", "explanation": "형사소송법 제318조 제2항 참조.\n형사소송법 제318조(당사자의 동의와 증거능력) ① 검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다.\n② 피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 전항의 동의가 있는 것으로 간주한다. 단, 대리인 또는 변호인이 출정한 때에는 예외로 한다.", "answer": "O"}, {"source": "16변시", "question": "증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다.", "explanation": "피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다(대판 1984.11.27. 84도2252).", "answer": "O"}, {"source": "16변시", "question": "증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "간이공판절차의 결정이 있는 사건의 증거에 관하여는 당사자의 동의에 관한 「형사소송법」 제318조 제1항의 동의가 있는 것으로 간주되지만, 검사, 피고인 또는 변호인이 증거로 함에 이의가 있는 때에는 그러하지 아니하다.", "explanation": "간이공판절차의 결정이 있는 사건의 증거에 관하여는 당사자의 동의가 있는 것으로 간주한다. 그러나 피고인 또는 변호인이 이의가 있는 경우에는 그러하지 아니하다.", "answer": "O"}, {"source": "13변시", "question": "당사자의 동의와 증거능력에 관한 다음 설명 중 옳은 것(O)과 옳지 않은 것(X)은? (다툼이 있는 경우에는 판례에 의함)", "choice": "전문법칙에 의하여 증거능력이 없는 증거라고 할지라도 당사자가 동의하고 법원이 진정한 것으로 인정한 경우에는 증거능력이 있다.", "explanation": "형사소송법 제318조 제1항은 전문증거금지의 원칙에 대한 예외로서 반대신문권을 포기하겠다는 피고인의 의사표시에 의하여 서류 또는 물건의 증거능력을 부여하려는 규정이므로 피고인의 의사표시가 위와 같은 내용을 적극적으로 표시하는 것이라고 인정되는 경우이면 증거동의로서의 효력이 있다(대판 1983. 03.08. 82도2873).", "answer": "O"}, {"source": "13변시", "question": "당사자의 동의와 증거능력에 관한 다음 설명 중 옳은 것(O)과 옳지 않은 것(X)은? (다툼이 있는 경우에는 판례에 의함)", "choice": "진술에 임의성이 인정되지 않아 증거능력이 없는 증거라고 할지라도 당사자가 동의하고 법원이 진정한 것으로 인정한 경우에는 증거능력이 있다.", "explanation": "기록상 진술증거의 임의성에 관하여 의심할 만한 사정이 나타나 있는 경우에는 법원은 직권으로 그 임의성 여부에 관하여 조사를 하여야 하고, 임의성이 인정되지 아니하여 증거능력이 없는 진술증거는 피고인이 증거로 함에 동의하더라도 증거로 삼을 수 없다(대판 2006.11.23. 2004도7900).", "answer": "X"}, {"source": "13변시", "question": "당사자의 동의와 증거능력에 관한 다음 설명 중 옳은 것(O)과 옳지 않은 것(X)은? (다툼이 있는 경우에는 판례에 의함)", "choice": "피고인이 재판장의 허가 없이 퇴정하고 변호인도 이에 동조하여 퇴정해 버린 상태에서 증거조사를 할 수밖에 없는 경우에는 피고인의 진의와는 관계없이 증거에 대하여 피고인의 동의가 있는 것으로 간주된다.", "explanation": "필요적 변론사건이라 하여도 피고인(관련 공동피고인들 포함)이 재판거부의 의사를 표시하고 재판장의 허가 없이 퇴정하고 변호인 마저 이에 동조하여 퇴정해 버린 것은 모두 피고인측의 방어권의 남용 내지 변호권의 포기로 볼 수밖에 없는 것이어서 수소법원으로서는 형사소송법 제330조에 의하여 피고인이나 변호인의 재정 없이도 심리판결 할 수 있는 것이고, 또 공판심리는 사실심리와 증거조사가 행해지게 마련인데 이와 같이 피고인과 변호인들이 출석하지 않은 상태에서 증거조사를 할 수밖에 없는 경우에는 형사소송법 제318조 제2항의 규정상 피고인의 진의와는 관계없이 형사소송법 제318조 제1항의 동의가 있는 것으로 간주하게 되어 있다(대판 1991.06.28. 91도865).", "answer": "O"}, {"source": "12변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차에서 2회 불출정하여 법원이 피고인의 출정 없이 증거조시를 히는 경우에 증거동의가 간주된다.", "explanation": "형사소송법 제458조 제2항, 제365조는 피고인이 출정을 하지 않음으로써 본안에 대한 변론권을 포기한것으로 보는 일종의 제재적 규정으로 이와 같은 경우 피고인의 출정 없이도 심리, 판결할 수 있고 공판심리의 일환으로 증거조사가 행해지게 마련이어서 피고인이 출석하지 아니한 상태에서 증거조사를 할 수밖에 없는 경우에는 위 법 제318조 제2항의 규정상 피고인의 진의와는 관계없이 같은 조 제1항의 동의가 있는 것으로 간주하게 되어 있는 점, 위 법 제318조 제2항의 입법 취지가 재판의 필요성 및 신속성 즉, 피고인의 불출정으로 인한 소송행위의 지연 방지 내지 피고인 불출정의 경우 전문증거의 증거능력을 결정하지 못함에 따른 소송지연 방지에 있는 점 등에 비추어, 약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차에서 2회 불출정하여 법원이 피고인의 출정 없이 증거조사를 하는 경우에 위 법 제 318조 제2항에 따른 피고인의 증거동의가 간주된다(대판 2010.07.15. 2007도5776).", "answer": "O"}, {"source": "12변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "제1심에서 증거동의 간주 후 증거조사를 완료한 이상, 항소심에 출석하여 그 증거동의를 철회 또는 취소한다는 의사표시를 하더라도 그 증거능력이 상실되지 않는다.", "explanation": "약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 불출정하여 형사소송법 제318조 제2항에 따른 증거동의가 간주된 후 증거조사를 완료한 이상, 간주의 대상인 증거동의는 증거조사가 완료되기 전까지 철회 또는 취소할 수 있으나 일단 증거조사를 완료한 뒤에는 취소 또는 철회가 인정되지 아니하는 점, 증거동의 간주가 피고인의 진의외는 관계없이 이루어지는 점 등에 비추어, 비록 피고인이 항소심에 출석하여 공소사실을 부인하면서 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하더라도 그로 인하여 적법하게 부여된 증거능력이 상실되는 것이 아니다(대판 2010.07.15. 2007도5776).", "answer": "O"}, {"source": "12변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "긴급체포를 할 당시 물건을 압수하였는데 그 후 압수수색영장을 발부받지 않았음에도 즉시 반환하지 않은 경우 피고인이나 변호인이 이를 증거로 함에 동의하더라도 증거능력은 인정되지 않는다.", "explanation": "형사소송법 제216조 제1항 제2호, 제217조 제2항, 제3항은 사법경찰관은 형사소송법 제200조의3(긴급체포)의 규정에 의하여 피의자를 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압수·수색을 할 수 있고, 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 하며, 청구한 압수수색영장을 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다고 규정하고 있는바, 형사소송법 제217조 제2항, 제3항에 위반하여 압수수색영장을 청구하여 이를 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다(대판 2009.12.24. 2009도11401).", "answer": "O"}, {"source": "12변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "증거동의의 주체는 검사와 피고인이므로 변호인의 경우 피고인의 명시적인 위임이 없는 한 피고인을 대리하여 증거로 함에 동의할 수 없다.", "explanation": "증거로 함에 대한 동의의 주체는 소송주체인 당사자라 할 것이지만 변호인은 피고인의 명시한 의사에 반하지 아니하는 한 피고인을 대리하여 이를 할 수 있음은 물론이므로 피고인이 증거로 함에 동의하지 아니한다고 명시적인 의사표시를 한 경우 이외에는 변호인은 서류나 물건에 대하여 증거로 함에 동의할 수 있고 이 경우 변호인의 동의에 대하여 피고인이 즉시 이의하지 아니하는 경우에는 변호인의 동의로 증거 능력이 인정되고 증거조사 완료 전까지 앞서의 동의가 취소 또는 철회하지 아니한 이상 일단 부여된 증거 능력은 그대로 존속한다(대판 1999.08.20. 99도2029).", "answer": "X"}, {"source": "12변시", "question": "증거동의에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "검사와 피고인이 증거로 할 수 있음에 동의한 서류라고 하더라도 법원이 진정한 것으로 인정한 때에 증거로 할 수 있다.", "explanation": "검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다(형사소송법 제318조 제1항).", "answer": "O"}, {"source": "23변시", "question": "증거능력과 증명에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인 甲이 사업주(실질적 경영귀속주체)인 사업체의 종업원 乙이 법규위반행위를 하여 甲이 양벌규정에 의하여 기소되고 사법경찰관이 작성한 乙에 대한 피의자신문조서가 증거로 제출되었으나 甲이 이를 내용부인 취지로 부동의하였고 재판 진행 중 Z이 지병으로 사망한 경우 위 피의자신문조서는 「형사소송법」 제314조에 의해 증거능력이 인정될 수 있다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 해당 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 해당 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 해당 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되는 등 형사소송법 제312조 제4항의 요건을 갖춘 경우라고 하더라도 해당 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없고, 그 당연한 결과로 위 피의자신문조서에 대하여는 사망 등 사유로 인하여 법정에서 진술할 수 없는 때에 예외적으로 증거능력을 인정하는 규정인 형사소송법 제314조가 적용되지 아니한다. 그리고 이러한 법리는 공동정범이나 교사범, 방조범 등 공범관계에 있는 자들 사이에서뿐만 아니라, 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원 등 행위자의 위반행위에 대하여 행위자가 아닌 법인 또는 개인이 양벌규정에 따라 기소된 경우, 이러한 법인 또는 개인과 행위자 사이의 관계에서도 마찬가지로 적용된다고 보아야 한다. (...) 무릇 양벌규정은 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원 등 행위자가 법규위반행위를 저지른 경우, 일정 요건 하에 이를 행위자가 아닌 법인 또는 개인이 직접 법규위반행위를 저지른 것으로 평가하여 행위자와 같이 처벌하도록 규정한 것으로서, 이때의 법인 또는 개인의 처벌은 행위자의 처벌에 종속되는 것이 아니라 법인 또는 개인의 직접책임 내지 자기책임에 기초하는 것이기는 하다. 그러나 양벌규정에 따라 처벌되는 행 위자와 행위자가 아닌 법인 또는 개인 간의 관계는, 행위자가 저지른 법규위반행위가 사업주의 법규위반행위와 사실관계가 동일하거나 적어도 중요부분을 공유한다는 점에서 내용상 불가분적 관련성을 지닌다고 보아야 하고, 따라서 앞서 본 형법총칙의 공범관계 등과 마찬가지로 인권보장적인 요청에 따라 형사소송법 제312조 제3항이 이들 사이에서도 적용된다고 보는 것이 타당하다(대판 2020.06.11. 2016도9367).", "answer": "X"}, {"source": "23변시", "question": "증거능력과 증명에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "제1심에서 피고인에 대하여 무죄판결이 선고되어 검사가 항소한 후 수사기관이 항소심 공판기일에 증인으로신청하여 신문할수 있는사람을 특별한사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 않는 한 증거능력이 없다.", "explanation": "제1심에서 피고인에 대하여 무죄판결이되어 검사가 항소한 후 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 않는 한 증거능력이 없다. 검사가 공소를 제기한 후 참고인을 소환하여 피고인에게 불리한 진술을 기재한 진술조서를 작성하여 이를 공판절차에 증거로 제출할 수 있게 한다면, 피고인과 대등한 당사자의 지위에 있는 검사가 수사기관으로서의 권한을 이용하여 일방적으로 법정 밖에서 유리한 증거를 만들 수 있게 하는 것이므로 당사자주의·공판중심주의·직접심리주의에 반하고 피고인의 공정한 재판을 받을 권리를 침해하기 때문이다(대판 2019.11.28. 2013도6825).\n\n[비교판례] 검사가 공판기일에 증인으로 신청하여 신문할 사람을 특별한 사정 없이 미리 수사기관에 소환하여 면담하는 절차를 거친 후 증인이 법정에서 피고인에게 불리한 내용의 진술을 한 경우, 검사가 증인신문 전 면담 과정에서 증인에 대한 회유나 압박, 답변 유도나 암시 등으로 증인의 법정진술에 영향을 미치지 않았다는 점이 담보되어야 증인의 법정진술을 신빙할 수 있다고 할 것이다. 검사가 증인신문 준비 등 필요에 따라 증인을 사전 면담할 수 있다고 하더라도 법원이나 피고인의 관여 없이 일방적으로 사전 면담하는 과정에서 증인이 훈련되거나 유도되어 법정에서 왜곡된 진술을 할 가능성도 배제할 수 없기 때문이다. 증인에 대한 회유나 압박 등이 없었다는 사정은 검사가 증인의 법정진술이나 면담 과정을 기록한 자료 등으로 사전면담 시점, 이유와 방법, 구체적 내용 등을 밝힘으로써 증명하여야 한다(대판 2021.06.10. 2020도15891).", "answer": "O"}, {"source": "23변시", "question": "증거능력과 증명에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인 아닌 자의 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 경우 「형사소송법」 제316조 제2항이 요구하는 특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 증명은 단지 그러한 개연성이 있다는 정도로는 부족하고 합리적인 의심의 여지를 배제하는 정도에 이르러야 한다.", "explanation": "형사소송법 제312조 또는 제313조는 참고인이 진술하거나 작성한 진술조서나 진술서에 대하여 피고인 또는 변호인의 반대신문권이 보장되는 등 엄격한 요건이 충족될 경우에 한하여 증거능력을 인정하고 있다. 형사소송법 제314조는 참고인 소재불명 등의 경우에 직접심리주의 등 기본원칙에 대한 예외를 인정 한 것에 대하여 다시 중대한 예외를 인정하여 원진술자 등에 대한 반대신문의 기회조차 없이 증거능력을 부여할 수 있도록 한 것이다. 따라서 이러한 경우 참고인의 진술 또는 작성이 '특히 신빙할 수 있는 상태 하에서 행하여졌음에 대한 증명'은 단지 그러할 개연성이 있다는 정도로는 부족하고 합리적인 의심의 여지를 배제할 정도에 이르러야 한다. 나아가 이러한 법리는 원진술자의 소재불명 등을 전제로 하고 있는 형사소송법 제316조 제2항의 경우에도 그대로 적용된다(대판 2017.07.18. 2015도12981, 2015전도218).", "answer": "O"}, {"source": "23변시", "question": "증거능력과 증명에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "목적과 용도를 정하여 위탁한 금전을 수탁자가 임의로 소비하면 횡령죄를 구성할 수 있으며 피해자 등이 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도가 무엇인지는 엄격한 증명의 대상이 된다.", "explanation": "목적과 용도를 정하여 위탁한 금전을 수탁자가 임의로 소비한 경우 횡령죄가 성립하는지 여부(적극) 및 이 경우 피해자 등이 목적과 용도를 정하여 금전을 위탁한 사실과 그 목적과 용도가 무엇인지가 엄격한 증명의 대상인지 여부(적극)(대판 2013.11.14. 2013도8121).", "answer": "O"}, {"source": "23변시", "question": "증거능력과 증명에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "얌심적 병역거부를 주장하는 피고인이 자신의 병역거부가 그에 따라 행동하지 않고서는 인격적 존재가치가 파멸되고 말 것이라는 절박하고 구체적인 양심에 따른 것으로 그 양심이 갚고 확고하며 진실한 것이라는 사실의 존재를 수긍할 만한 소명자료를 법원에 제출한 경우, 검사는 제출된 자료의 신빙성을 탄핵하는 방법으로 진정한 양심의 부존재를 증명할 수 있다.", "explanation": "정당한 사유가 없다는 사실은 범죄구성요건이므로 검사가 증명하여야 한다. 다만 진정한 양심의 부존재를 증명한다는 것은 마치 특정되지 않은 기간과 공간에서 구체화되지 않은 사실의 부존재를 증명하는 것과 유사하다. 위와 같은 불명확한 사실의 부존재를 증명하는 것은 사회통념상 불가능한 반면 그 존재를 주장·증명하는 것이 좀 더 쉬우므로, 이러한 사정은 검사가 증명책임을 다하였는지를 판단할 때 고려하여야 한다. 따라서 양심적 병역거부를 주장히는 피고인은 자신의 병역거부가 그에 따라 행동하지 않고서는 인격적 존재가치가 파멸되고 말 것이라는 절박하고 구체적인 양심에 따른 것이며 그 양심이 갚고 확고하며 진실한 것이라는 사실의 존재를 수긍할 만한 소명자료를 제시하고, 검사는 제시된 자료의 신빙성을 탄핵히는 방법으로 진정한 양심의 부존재를 증명할 수 있다. 이때 병역거부자가 제시하여야 할 소명자료는 적어도 검사가 그에 기초하여 정당한 사유가 없다는 것을 증명하는 것이 가능할 정도로 구체성을 갖추어야 한다(대판 2018.11.01. 2016도10912).", "answer": "O"}, {"source": "18변시", "question": "탄핵증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "「형사소송법」 제 318조의2 제2항에 따른 영상녹화물의 탄핵증거로의 사용에 대해서 논란은 있으나, 영상녹화물의 재생은 법원의 직권이나 검사의 신청이 있는 경우에 한하고, 기억의 환기가 필요한 피고인 또는 피고인 아닌 자에게만 이를 재생하여 시청하게 하여야 한다.", "explanation": "형사소송법 제 318조의2 제2항에 따른 영상녹화물의 재생은 검사의 신청이 있는 경우에 한한다.", "answer": "X"}, {"source": "18변시", "question": "탄핵증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "탄핵증거에 대하여는 그 진정성립이 증명되지 않더라도 무방하다.", "explanation": "탄핵증거는 범죄사실을 인정하는 증거가 아니므로 그것이 증거서류이던 진술이던간에 유죄증거에 관한 소송법상의 엄격한 증거능력을 요하지 아니한다(대판 1985.05.14. 85도441).", "answer": "O"}, {"source": "18변시", "question": "탄핵증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거칠 필요는 없는바, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것까지 사전에 상대방에게 알릴 필요는 없다.", "explanation": "검사가 유죄의 자료로 제출한 사법경찰리 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있으며, 또한 탄핵증거는 범죄사실을 인정히는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제 318조의2의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요한 것이고, 한편 증거신청의 방식에 관하여 규정한 형사소송규칙 제132조 제1항의 취지에 비추어 보면 탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입증취지 등을 미리 구체적으로 명시하여야 할 것이므로, 증명력을 다투고자 히는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다(대판 2005.08.19. 2005도2617).", "answer": "X"}, {"source": "18변시", "question": "탄핵증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 법정에서 내용부인을 한 사법경찰관 작성의 피의자신문조서에 대하여 검사가 증거제출 당시 탄핵증거라는 입증취지를 명시하지 아니하였다면 피고인의 법정 진술에 대한 탄핵증거로서의 증거조사절차가 대부분 이루어졌다고 하더라도 그 조서를 피고인의 법정진술에 대한 탄핵증거로 시용할 수 없다.", "explanation": "피고인이 내용을 부인하여 증거능력이 없는 사법경찰리 작성의 피의자신문조서에 대하여 비록 당초 증거제출 당시 탄핵증거라는 입증취지를 명시하지 아니하였지만 피고인의 법정 진술에 대한 탄핵증거로서의 증거조사절차가 대부분 이루어졌다고 볼 수 있는 점 등의 사정에 비추어 위 피의자신문조서를 피고인의 법정 진술에 대한 탄핵증거로 사용할 수 있다(대판 2005.08.19. 2005도2617).", "answer": "X"}, {"source": "18변시", "question": "탄핵증거에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없는바, 그러한 증거는「형사소송법」 제 312조 제3항의 특별한 입법취지에 비추어 설령 임의로 작성된 것이라 하더라도 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로도 사용될 수 없다.", "explanation": "검사가 유죄의 자료로 제출한 사법경찰리 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있으며, 또한 탄핵증거는 범죄사실을 인정히는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제 318조의2의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요한 것이고, 한편 증거신청의 방식에 관하여 규정한 형사소송규칙 제132조 제1항의 취지에 비추어 보면 탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입증취지 등을 미리 구체적으로 명시하여야 할 것이므로, 증명력을 다투고자 히는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다(대판 2005.08.19. 2005도2617).", "answer": "X"}, {"source": "17변시", "question": "탄핵증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "탄핵증거는 진술의 증명력을 감쇄하기 위하여 인정되는 것이므로 범죄사실 또는 그 간접사실을 인정히는 증거로서는 허용되지 않는다.", "explanation": "탄핵증거는 범죄사실을 인정하는 증거가 아니므로 그것이 증거서류이던 진술이던간에 유죄증거에 관한 소송법상의 엄격한 증거능력을 요하지 아니한다(대판 1985.05.14. 85도441).", "answer": "O"}, {"source": "17변시", "question": "탄핵증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없으나, 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요하다.", "explanation": "탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제318조의2의 규정에 따라 명백하다고 할 것이나, 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요하다(대판 1998.02.27. 97도1770).", "answer": "O"}, {"source": "17변시", "question": "탄핵증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "검사가 피고인이 아닌 자의 진술을 기재한 조서는 원진술자가 성립의 진정을 부인하더라도 그의 증언의 증명력을 다투기 위한 증거로 할 수 있다.", "explanation": "증언의 증명력을 다투기(탄핵증거) 위한 경우에는 소송법상 엄격한 증거능력을 요구하지 않는다. 따라서 검사 작성의 피고인 아닌 자의 진술조서의 경우 제312조 제4항의 요건을 갖추지 않아도 된다(형사소송법 제318조의2 제1항). 그리고 자기모순진술은 탄핵증거의 범위에 관한 어느 학설을 따르더라도 탄핵증거로 제출할 수 있다.", "answer": "O"}, {"source": "17변시", "question": "탄핵증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "사법경찰관 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 경우, 그것이 임의로 작성된 것이 인정되더라도 피고인의 법정진술을 탄핵하기 위한 반대증거로 사용할 수 없다.", "explanation": "검사가 유죄의 자료로 제출한 사법경찰리 작성의 피고인에 대한 피의자신문조서 는 피고인이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있으며, 또한 탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제318조의2의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거 조사는 필요한 것이고, 한편 증거신청의 방식에 관하여 규정한 형사소송규칙 제132조 제1항의 취지에 비추어 보면 탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입 증취지 등을 미리 구체적으로 명시하여야 할 것이므로, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다(대판 2005.08.19. 2005도2617).", "answer": "X"}, {"source": "17변시", "question": "탄핵증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "탄핵증거를 제출하는 경우, 증명력을 다투고자 하는 증거 의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다.", "explanation": "검사가 유죄의 자료로 제출한 사법경찰리 작성의 피고인에 대한 피의자신문조서 는 피고인이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있으며, 또한 탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제318조의2의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거 조사는 필요한 것이고, 한편 증거신청의 방식에 관하여 규정한 형사소송규칙 제132조 제1항의 취지에 비추어 보면 탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입 증취지 등을 미리 구체적으로 명시하여야 할 것이므로, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다(대판 2005.08.19. 2005도2617).", "answer": "O"}, {"source": "26변시", "question": "보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "독립된 증거능력이 있는 이상 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있으므로 공소사실과 직접 관련이 없는 범행동기에 관한 정황증거도 보강증거가 될 수 있다.", "explanation": "검사 제출의 증거가 공소사실의 객관적 부분과 관련이 없는 것이어서 자백에 대한 보강증거가 될 수 없다고 본 사례 : 검사가 보강증거로서 제출한 증거의 내용이 피고인과 공소외 갑이 현대지동차 춘천영업소를 점거했다가 갑이 처벌받았다는 것이고, 피고인의 자백내용은 현대자동차 점거로 갑이 처벌받은 것은 학교측의 제보 때문이라 하여 피고인이 그 보복으로 학교총장실을 침입점거했다는 것이라면, 위 증거는 공소사실의 객관적 부분인 주거침입, 점거사실과는 관련이 없는 범행의 침입동기에 관한 정황증거에 지나지 않으므로 위 증거와 피고인의 자백을 합쳐 보아도 자백사실이 가공적인 것이 아니고 진실한 것이라 인정하기에 족하다고 볼 수 없으므로 검사 제출의 위 증거는 자백에 대한 보강증거가 될 수 없다(대판 1990.12.07. 90도2010).\n[비교판례] 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것 이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라，직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있다 할 것이다(대판 1998.03.13. 98도159 참조).", "answer": "X"}, {"source": "26변시", "question": "보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 수사받기 전에 사무처리의 내역을 그때그때 계속적, 기계적으로 기입한 상업장부 등은 공소사실에 일부 부합하는 사실의 기재가 있더라도 피고인이 범죄사실을 자백하는 문서라고 볼 수 없으므로 피고인의 자백에 대한 보강증거가 될 수 있다.", "explanation": "상법장부나 항해일지, 진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 자기에게 맡겨진 사무를 처리한 사무 내역을 그때그때 계속적, 기계적으로 기재한 문서 등의 경우는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 그 존재 자체 및 기재가 그러한 내용의 사무가 처리되었음의 여부를 판단할 수 있는 별개의 독립된 증거자료이고, 설사 그 문서가 우연히 피고인이 작성하였고 그 문서의 내용 중 피고인의 범죄시질의 존재를 추론해 낼 수 있는 즉 공소사실에 일부 부합되는 사실의 기재가 있다고 하더라도, 이를 일컬어 피고인이 범죄사실을 자백하는 문서라고 볼 수는 없다(대판 1996.10.17. 94도2865(전합)).", "answer": "O"}, {"source": "26변시", "question": "보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲과 乙이 공모하여 타인의 재물을 절취한 범죄사실로 기소된 사건에서 피고인 甲과 공동피고인 乙이 모두 자백하는 경우 乙의 자백은 甲의 자백에 대한 보강증거가 될 수 있다.", "explanation": "형사소송법 제 310조 소정의 “피고인의 자백”에 공범인 공동피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정 하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다(대판 1990.10.30. 90도1939).", "answer": "O"}, {"source": "26변시", "question": "보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "누범가중사유인 전과는 보강증거 없이 피고인의 자백만으로 이를 인정할 수 있다.", "explanation": "누범가중사유인 전과는 보강증거 없이 피고인의 자백만으로 이를 인정할 수 있다. 형사소송법 제 310조의 자백보강법칙은 범죄사실의 인정에 관한 것이지 양형사유에 관한 것이 아니기 때문이다.\n[참조판례] 형사소송법상 법원은 검사의 공소사실의 범위를 넘어서 범죄 사실을 인정할 수는 없으나, 누범가중의 사유가 되는 피고인의 전과사실은 범죄사실에 해당하는 것이 아니라 양형사유에 불과한 것이므로, 원판결이 검사의 이 사건 피고인에 대한 공소장에 기재되어 있지 아니한 누범가중의 사유가 되는 전과사실을 인정하고 피고인을 누범으로 처벌하였다 하여도 거기에 어떤 위법 사유가 있다고 할 수 없는 것이다(대판 1971.12.21. 71도2004 ) .", "answer": "O"}, {"source": "26변시", "question": "보강증거에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "포괄일죄인 상습범에서는 이를 구성하는 각 행위에 관해 개별적으로 보강증거가 있어야 한다.", "explanation": "피고인의 습벽을 범죄구성요건으로 하며 포괄1죄인 상습범에 있어서도 이를 구성하는 각 행위에 관하여 개별적으로 보강증거를 요구하고 있는 점에 비추어 보면 경합범인 이 사건 각 범죄행위를 인정함에 있어서 투약습성에 관한 정황증거만으로 범죄의 객관적 구성요건인 각 투약행위가 있었디는 점에 관한 보강증거로 삼을 수는 없다고 할 것 이다(대판 1996.02.13. 95도1794).", "answer": "O"}, {"source": "22변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 다세대주택의 여러 세대에서 7건의 절도행위를 한 것으로 기소되었는데 그중 4건은 범행 장소인 구체적 호수가 특정되지 않은 사안에서, 위 4건에 관한 피고인 자백의 진실성이 인정되는 경우라면, 피고인의 집에서 압수한 위 4건의 각 피해품에 대한 압수조서와 압수물 사진은 위 자백에 대한 보강증거가 된다.", "explanation": "[1] 자백에 대한 보강증거는 범죄사실의 전부 또는 중요부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족한 것으로서, 자백과 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하고, 나아가 사람의 기억에는 한계가 있는 만큼 자백과 보강증거 사이에 어느 정도의 차이가 있어도 중요부분이 일치하고 그로써 진실성이 담보되면 보강증거로서의 자격이 있다. [2] 피고인이 자신이 거주하던 다세대주택의 여러 세대에서 7건의 절도행위를 한 것으로 기소되었는데 그 중 4건은 범행장소인 구체적 호수가 특정되지 않은 사안에서, 위 4건에 관한 피고인의 범행 관련 진술이 매우 사실적·구체적·합리적이고 진술의 신빙성을 의심할 만한 사유도 없어 자백의 진실성이 인정되므로, 피고인의 집에서 해당 피해품을 압수한 압수조서와 압수물 사진은 위 자백에 대한 보강증거가 된다고 한 사례(대판 2008.05.29. 2008도2343).", "answer": "O"}, {"source": "22변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술은 피고인의 자백에 포함되지 아니하므로, 피고인 자백의 보강증거가 될 수 있다.", "explanation": "공판정에서의 피고인의 자백도 보강증거가 필요하다는 것이 판례이므로 보강증거가 필요하다. 이때 보강증거의 범위와 관련해 문제되는 것은 피고인이 범행을 인정하는 것을 들었다는 피고인 아닌 자의 진술이 기재된 진술조서가 보강증거가 될 수 있느냐라는 것 이다. 판례는 “피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 형사소송법 제310조의 피고인의 자백에는 포함되지 아니하나 피고인의 자백을 피고인의 자백으로 보강하는 결과가 되기 때문에 피고인의 자백의 보강증거로 될 수 없다”(대판 2008.02.14. 2007도10937).", "answer": "X"}, {"source": "22변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "2021. 10. 19. 채취한 소변에 대한 검사결과 메스암페타민 성분이 검출된 경우, 위 소변 검사결과는 2021. 10. 17. 메스암페타민을 투익하였다는 자백에 대한 보강증거가 될 수는 있지만, 각 투약행위에 대한 자백의 보강증거는 별개의 것이어야 하므로, 같은 달 13. 메스암페타민을 투약하였다는 자백에 대한 보강증거는 될 수 없다.", "explanation": "[1] 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 아니 하더라도 피고인의 자백이 기공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있으며 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다. [2] 대마 흡연자에 대한 소변검사에서 대마 성분이 검출되는 기간에 관한 심리 없이 피고인으로부터 채취한 소변에서 대마 성분이 검출되었다는 국립과학수사연구소장 작성의 감정의뢰회보와 간이소변검사결과가 소변 채취 시점으로부터 5일 이전에 대마를 흡연하였다는 피고인의 자백에 대한 보강증거가 될 수 없다고 한 원심판결을 파기한 사례(대판 1999.08.24. 99도1858).", "answer": "X"}, {"source": "22변시", "question": "자백과 보강증거에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "공소장에 기재된 대마 흡연일자로부터 한 달 후 피고인의 주거지에서 압수된 대마 잎은 비록 피고인의 자백이 구체적이고 그 진실성이 인정된다고 하더라도 피고인의 자백에 대한 보강증거가 될 수 없다.", "explanation": "기소된 대마 흡연일자로부터 한 달 후 피고인의 주거지에서 압수된 대마 잎이 피고인의 자백에 대한 보강증거가 된다(대판 2007.09.20. 2007도5845).", "answer": "X"}, {"source": "21변시", "question": "甲과 乙은 합동하여 평소 알고 지내던 A의 집에서 현금 1,000만 원을 절취하였다는 사실로 특수절도로 공소가 제기되어 함께 재판을 받고 있다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙이 피고인으로서 공판정에서 자백진술을 하면 그 진술은 甲에 대한 유죄의 증거로 사용할 수 있다. ", "explanation": "형사소송법 제310조에서 말하는 피고인의 자백이란 함은 문리해석상으로도 다른 공동피고인(공범인 경우이건 아니건 가리지 않는다)의 자백을 포함한다 하는 취지로 되어 있지 않을 뿐 아니라 실지문제로서도 이 공동피고인의 자백에 대하여는 반대신문권도 충분히 보장되어 있는 것이므로 증인으로 신문한 경우나 다를 바가 없으므로 이러한 의미에서 공동피고인의 자백도 증거능력이 있다 할 것이다(대판 1963.07.25. 63도185). ", "answer": "O"}, {"source": "21변시", "question": "甲과 乙은 합동하여 평소 알고 지내던 A의 집에서 현금 1,000만 원을 절취하였다는 사실로 특수절도로 공소가 제기되어 함께 재판을 받고 있다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲과 Z의 소송절차가 분리되면 甲은 乙에 대한 공소사실에 관하여 증인이 될 수 있다. ", "explanation": "공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다(대판 2008.06.26. 2008도3300).\n", "answer": "O"}, {"source": "21변시", "question":
