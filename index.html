적으로 고려하여 증인이 침묵하지 아니하고 진술한 것이 자신의 진정한 의사에 의한 것인지 여부를 기준으로 위증죄의 성립 여부를 판단하여야 한다. 전 남편에 대한 도로교통법 위반(음주운전) 사건의 증인으로 법정에 출석한 전처(前妻)가 증언거부권을 고지받지 않은 채 공소사실을 부인하는 전 남편의 변명에 부합하는 내용을 적극적으로 허위 진술한 사안에서, 증인으로 출석하여 증언한 경위와 그 증언 내용, 증언거부권을 고지받았더라도 이와 같이 증인을 하였을 것이라는 취지의 진술 내용 등을 전체적·종합적으로 고려할 때 선서 전에 재판장으로부터 증언거부권을 고지받지 않았다고 하더라도 이로 인하여 증언거부권이 사실상 침해당한 것으로 평가할 수는 없다(대판 2010.02.25. 2007도6273) - 대법원은 이혼한 자에게도 증언거부권이 인정된다는 취지로 위증죄의 인정을 위해서는 증언거부권이 사실상 침해 당하였는지를 판단해야 한다고 한다.", "answer": "O"}, {"year": "2019", "num": "8", "source": "19변시", "question": "전기통신금융사기(이른바 보이스피싱 범죄)를 계획한 甲이 순진해 보이는 乙에게 은행 계좌를 개설하여 현금인출카드를 주면 50만 원을 주겠다고 하자 乙은 甲이 범죄에 사용할 수도 있다는 것을 알면서도 돈을 벌 생각으로 자신의 계좌번호, 현금인출카드 등을 건네주었다. 甲의 계획대로 기망당한 다수의 피해자들은 현금을 乙의 계좌로 송금하였다. 한편 乙은 자신이 통장과 도장을 보관하고 있는 것을 이용하여 甲의 승낙 없이 위 계좌에서 500만 원을 인출하여 사용하였다. 검사는 위 범행에 대해 甲과 乙을 공소제기하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "乙이 甲과의 대화 내용을 甲 몰래 스마트폰으로 녹음하였다가 SD카드에 저장하여 경찰관에게 임의 제출한 경우, 甲이 동의하더라도 이는 「통신비밀보호법」을 위반하여 위법하게 수집된 증거이므로 증거능력이 없다.", "explanation": "피고인이 범행 후 피해자에게 전화를 걸어오자 피해자가 증거를 수집하려고 그 전화내용을 녹음한 경우, 그 녹음테이프가 피고인 모르게 녹음된 것이라 하여 이를 위법하게 수집된 증거라고 할 수 없다(대판 1997.03.28. 97도240). [판례] 피해자의 대표자인 공소외인이 피고인과 대화하면서 녹음한 이 사건 녹음파일 사본은 타인 간의 대화를 녹음한 것이 아니므로 타인의 대화비밀 침해금지를 규정한 통신비밀보호법 제14조의 적용 대상이 아니다(대결 2012.09.13. 2012도7461).", "answer": "X"}, {"year": "2019", "num": "8", "source": "19변시", "question": "전기통신금융사기(이른바 보이스피싱 범죄)를 계획한 甲이 순진해 보이는 乙에게 은행 계좌를 개설하여 현금인출카드를 주면 50만 원을 주겠다고 하자 乙은 甲이 범죄에 사용할 수도 있다는 것을 알면서도 돈을 벌 생각으로 자신의 계좌번호, 현금인출카드 등을 건네주었다. 甲의 계획대로 기망당한 다수의 피해자들은 현금을 乙의 계좌로 송금하였다. 한편 乙은 자신이 통장과 도장을 보관하고 있는 것을 이용하여 甲의 승낙 없이 위 계좌에서 500만 원을 인출하여 사용하였다. 검사는 위 범행에 대해 甲과 乙을 공소제기하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "甲은 사기죄, 乙은 사기방조죄로 기소된 경우, 변론 분리 없이 검사의 피고인신문 과정에서 \"甲으로부터 은행 계좌를 개설하여 현금인출카드를 주면 50만 원을 주겠다는 제안을 받고 현금인출카드를 교부하였다.\"라고 한 乙의 진술을 甲의 범죄사실을 인정하는 증거로 삼더라도 위법하지 않다.", "explanation": "형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 진술은 포함되지 않으며, 이러한 공동피고인의 진술에 대하여는 피고인의 반대신문권이 보장되어 있어 독립된 증거능력이 있다(대판 1992.07.28. 92도917). ▶공범인 공동피고인의 법정진술의 증거능력과 관련해 우리 판례는 피고인의 반대신문권이 보장되어 있으므로 증거능력을 인정하고 있다. 사안에서 비록 변론 분리 없이 이루어진 乙의 법정진술은 甲의 반대신문권이 보장되어 있으므로 증거로 삼을 수 있다.", "answer": "O"}, {"year": "2019", "num": "9", "source": "19변시", "question": "갑은 2014. 1. 9. A를 상대로 OO지방검찰청에, \"2010. 9. 1. A로부터 건물창호공사를 도급 받아 시공한 공사대금을 9,000만 원으로 정산하고 위 건물 201호를 대물변제받기로 하였으나, A가 자신에게 소유권이전등기를 해 주지 않고 다른 사람에게 매도하였으므로 처벌해 달라.\"라는 내용으로 고소장을 제출하였다. 그러나 수사과정에서 사실은 공사대금이 700만 원에 불과하고 위 금원마저 모두 지급되어 둘 사이의 채권채무관계가 정산되었음이 확인되었다. 이에 검사는 2014. 9. 1. A에 대하여 불기소처분을 하였고, 갑을 무고죄로 기소하였다. 한편 갑이 A를 고소할 당시, 대법원은 '채권담보로 부동산에 관한 대물변제예약을 체결한 채무자가 그 부동산을 처분한 경우 배임죄가 성립한다'고 보았으나, 2014. 8. 21. 판례를 변경하여 '배임죄가 성립하지 않는다'고 하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 갑이 제1심 법원에서 공소사실을 자백하여 간이공판절차로 진행된 후 갑이 항소심에서 범행을 부인하면, 간이공판절차의 효력이 상실되므로 다시 증거조사를 하여야 한다.", "explanation": "피고인이 제1심법원에서 공소사실에 대하여 자백하여 제1심법원이 이에 대하여 간이공판절차에 의하여 심판할 것을 결정하고, 이에 따라 제1심법원이 제1심판결 명시의 증거들을 증거로 함에 피고인 또는 변호인의 이의가 없이 형사소송법 제318조의3의 규정에 따라 증거능력이 있다고 보고 상당하다고 인정하는 방법으로 증거조사를 한 이상, 가사 항소심에 이르러 범행을 부인하였다고 하더라도 제1심법원에서 증거로 할 수 있었던 증거는 항소법원에서도 증거로 할 수 있는 것이므로 제1심법원에서 이미 증거능력이 있었던 증거는 항소심에서도 증거능력이 그대로 유지되어 심판의 기초가 될 수 있고 다시 증거조사를 할 필요가 없다(대판 1998.02.27. 97도3421).", "answer": "X"}, {"year": "2019", "num": "9", "source": "19변시", "question": "갑은 2014. 1. 9. A를 상대로 OO지방검찰청에, \"2010. 9. 1. A로부터 건물창호공사를 도급 받아 시공한 공사대금을 9,000만 원으로 정산하고 위 건물 201호를 대물변제받기로 하였으나, A가 자신에게 소유권이전등기를 해 주지 않고 다른 사람에게 매도하였으므로 처벌해 달라.\"라는 내용으로 고소장을 제출하였다. 그러나 수사과정에서 사실은 공사대금이 700만 원에 불과하고 위 금원마저 모두 지급되어 둘 사이의 채권채무관계가 정산되었음이 확인되었다. 이에 검사는 2014. 9. 1. A에 대하여 불기소처분을 하였고, 갑을 무고죄로 기소하였다. 한편 갑이 A를 고소할 당시, 대법원은 '채권담보로 부동산에 관한 대물변제예약을 체결한 채무자가 그 부동산을 처분한 경우 배임죄가 성립한다'고 보았으나, 2014. 8. 21. 판례를 변경하여 '배임죄가 성립하지 않는다'고 하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 갑이 제1심 법원에서 징역 1년 6월, 집행유예 3년의 판결을 선고받아 갑만이 항소한 경우, 항소심 법원이 징역 1년의 실형을 선고하였다면, 「형사소송법」 제368조에 정해진 불이익변경금지원칙에 위배된다.", "explanation": "징역 1년에 3년간 집행유예가 선고된 제1심 판결에 대하여 피고인 및 검사가 제기한 항소를 기각하고 직권으로 제1심 판결의 형이 중하다는 이유로 이를 파기한 후 징역 10월의 실형을 선고한 경우에는 불이익변경의 금지규정에 위배된다(실질적으로 보면 집행유예라는 법률적, 사회적 가치판단은 높게 평가하지 않을 수 없으므로 총체적으로 고려하여 보면 원심의 형(실형 10월)은 제1심의 형(징역 1년 집행유예 3년간)보다 중하다고 하지 않을 수 없다)(대판 1965.12.10. 65도826).", "answer": "O"}, {"year": "2019", "num": "10", "source": "19변시", "question": "외국에 거주하는 위장결혼 알선 브로커인 한국인 갑은, 국내에 거주하는 노숙자 을에게 100만 원을 송금해 주기로 하고 진정한 혼인의사가 없는 을로 하여금 외국인 여성 A와의 혼인 신고서를 작성하여 OO구청 공무원 B에게 제출하도록 하였다. B는 가족관계등록부와 동일한 공전자 기록에 을과 A가 혼인한 것으로 입력하여 등록하였다. 한편 100만 원의 입금을 기다리던 을은 전혀 모르는 사람인 C의 이름으로 100만 원이 착오 입금되었으나, 이를 알면서도 인출하여 사용해 버렸다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "을에 대한 사법경찰관 작성의 피의자신문조서는 을이 진정성립을 인정하였더라도, 갑이 공판기일에 내용을 부인하면 갑에 대하여 증거능력이 부정된다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되는 등 형사소송법 제312조 제4항의 요건을 갖춘 경우라고 하더라도, 당해 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없다(대판 2009.07.09, 2009도2865).", "answer": "O"}, {"year": "2019", "num": "11", "source": "19변시", "question": "주식회사의 임원 갑은 애인 을과 공모하여 업무수행용 법인카드를 이용해 3개월간 3,000만 원에 해당하는 금액을 개인용도로 사용하였다. 친구 갑이 급여에 비하여 소비가 지나친 것을 수상하게 여기던 사법경찰관 P는 때마침 회사의 제보를 받고 과 을에게 출석을 요구하여 조사한 결과 갑으로부터는 자백을 받았으나, 을은 범죄사실을 부인하였다. 이에 P는 법관의 영장에 의하지 아니하고 신용카드 회사에 근무하는 친구로부터 갑의 법인카드 사용내역을 확보하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "P가 수집한 카드사용내역은 적법한 절차에 따르지 아니하고 수집한 증거에 해당하여 유죄의 증거로 사용할 수 없다.", "explanation": "수사기관이 범죄 수사를 목적으로 금융실명거래 및 비밀보장에 관한 법률(이하 '금융실명법'이라 한다) 제4조 제1항에 정한 '거래정보 등'을 획득하기 위해서는 법관의 영장이 필요하고, 신용카드에 의하여 물품을 거래할 때 금융회사 등이 발행하는 매출전표의 거래명의자에 관한 정보 또한 금융실명법에서 정하는 '거래정보 등'에 해당하므로, 수사기관이 금융회사 등에 그와 같은 정보를 요구하는 경우에도 법관이 발부한 영장에 의하여야 한다. 그럼에도 수사기관이 영장에 의하지 아니하고 매출전표의 거래명의자에 관한 정보를 획득하였다면, 그와 같이 수집된 증거는 원칙적으로 형사소송법 제308조의2에서 정하는 '적법한 절차에 따르지 아니하고 수집한 증거'에 해당하여 유죄의 증거로 삼을 수 없다(대판 2013.03.28, 2012도13607). 형사소송법 제308조의2(위법수집증거의 배제) 적법한 절차에 따르지 아니하고 수집한 증거는 증거로 할 수 없다.", "answer": "O"}, {"year": "2019", "num": "11", "source": "19변시", "question": "주식회사의 임원 갑은 애인 을과 공모하여 업무수행용 법인카드를 이용해 3개월간 3,000만 원에 해당하는 금액을 개인용도로 사용하였다. 친구 갑이 급여에 비하여 소비가 지나친 것을 수상하게 여기던 사법경찰관 P는 때마침 회사의 제보를 받고 과 을에게 출석을 요구하여 조사한 결과 갑으로부터는 자백을 받았으나, 을은 범죄사실을 부인하였다. 이에 P는 법관의 영장에 의하지 아니하고 신용카드 회사에 근무하는 친구로부터 갑의 법인카드 사용내역을 확보하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 카드사용내역이 증거로 사용될 수 없고 다른 증거가 없다면, 갑은 자신의 자백이 유일한 증거이므로 처벌되지 아니한다.", "explanation": "피고인의 자백이 그 피고인에게 불리익한 유일의 증거인 때에는 이를 유죄의 증거로 하지 못한다(형사소송법 제310조).", "answer": "O"}, {"year": "2019", "num": "12", "source": "19변시", "question": "시골마을에 사는 할머니 갑은 경작지의 농수 문제로 시비가 붙어 인근에 사는 A 할머니를 둔기로 때려 살해하였다는 혐의로 검사 S에 의해 기소되었다. 갑의 주거지 근처에서 피가 묻은 둔기는 발견되었으나, A의 사체는 발견되지 않았다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "갑의 살인죄는 간접증거에 의해 인정될 수도 있다.", "explanation": "살인죄와 같이 법정형이 무거운 범죄도 직접증거 없이 간접증거로만 유죄를 인정할 수 있으나, 이러한 방식에 의한 유죄 인정을 위해서는 공소사실과 관련이 깊은 간접증거에 대하여 신중한 판단이 필요하므로, 간접증거에 의하여 주요사실의 전제가 되는 간접사실을 인정할 때에는 그 증명이 합리적인 의심을 허용하지 않을 정도에 이르러야 하며, 간접사실 하나하나 사이에 모순·저축이 없어야 함은 물론 간접사실이 논리와 경험의 법칙, 과학법칙으로 뒷받침되어야 한다(대관 2013.09.12. 2013도4381).", "answer": "O"}, {"year": "2019", "num": "12", "source": "19변시", "question": "시골마을에 사는 할머니 갑은 경작지의 농수 문제로 시비가 붙어 인근에 사는 A 할머니를 둔기로 때려 살해하였다는 혐의로 검사 S에 의해 기소되었다. 갑의 주거지 근처에서 피가 묻은 둔기는 발견되었으나, A의 사체는 발견되지 않았다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "살인죄의 구성요건은 폭행치사 사실을 포함하므로, 법원은 살인죄가 인정되지 않더라도 공소장 변경 없이 폭행치사죄를 인정할 수 있다.", "explanation": "공소가 제기된 살인죄의 범죄사실에 대하여는 그 증명이 없으나 폭행치사의 증명이 있는 경우에도 검사의 공소장 변경 없이는 이를 폭행치사죄로 처단할 수 없으므로, 폭행치사죄로 처단한 제1심 판결을 파기하고 무죄를 선고한 원심의 조처는 정당하다(대판 1981.07.28. 81도1489).", "answer": "X"}, {"year": "2019", "num": "12", "source": "19변시", "question": "시골마을에 사는 할머니 갑은 경작지의 농수 문제로 시비가 붙어 인근에 사는 A 할머니를 둔기로 때려 살해하였다는 혐의로 검사 S에 의해 기소되었다. 갑의 주거지 근처에서 피가 묻은 둔기는 발견되었으나, A의 사체는 발견되지 않았다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만약 주민 B가 \"갑이 나에게 '망할 놈의 할망구, 내가 A를 없애 버렸다'고 말한 적이 있다.\"라고 증언하였다면, 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한하여 B의 진술을 증거로 할 수 있다.", "explanation": "지문은 피고인이 아닌 자(B)의 공판정에서의 진술이 피고인(갑)의 진술을 그 내용으로 하는 것에 해당한다. 따라서 형사소송법 제316조 제1항의 요건인, 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한하여 증거로 할 수 있다. \n형사소송법 제316조(전문의 진술) 1항. 피고인이 아닌 자(공소제기 전에 피고인을 피의자로 조사하였거나 그 조사에 참여하였던 자를 포함한다. 이하 이 조에서 같다)의 공판준비 또는 공판기일에서의 진술이 피고인의 진술을 그 내용으로 하는 것인 때에는 그 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한하여 이를 증거로 할 수 있다.", "answer": "O"}, {"year": "2018", "num": "1", "source": "18변시", "question": "甲(17세)은 친구들과 술을 마셔 혀가 꼬부라진 발음을 하며 걸음을 제대로 걷지 못한 채 비틀거리는 등 만취한 상태에서 00:45경 자동차를 운전하다가 행인 A를 뒤늦게 발견하고 미처 피하지 못하여 A에게 전치 4주의 상해를 입히고 B 소유의 상점 출입문을 들이받아 파손한 후 의식을 잃고 곧바로 사고현장 인근 병원 응급실로 후송되었다. 병원 응급실로 출동한 경찰관 P는 甲에게서 술 냄새가 강하게 나는 등 음주운전의 가능성이 현저하자 같은 날 01:50경 甲의 아버지의 동의를 받고 그 병원 의료인에게 의학적인 방법에 따라 필요최소한의 한도 내에서 甲의 혈액을 채취하게 한 후 그 혈액을 영장 없이 압수하였다. 그 후 P는 그 혈액을 국랍과학수사연구원에 감정의뢰하였고 甲의 혈중알콜농도는 0.15%로 회신되었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "P가 혈액을 압수한 후 지체없이 압수·수색영장을 발부받지 않았다면 국립과학수사연구원이 작성한 감정의뢰회보는 증거능력이 없다. ", "explanation": "음주운전 중 교통사고를 야기한 후 피의자가 의식불명 상태에 빠져 있는 등으로 도로교통법이 음주운전의 제1차적 수사방법으로 규정한 호흡조사에 의한 음주측정이 불가능하고 혈액 채취에 대한 동의를 받을 수도 없을 뿐만 아니라 법원으로부터 혈액 채취에 대한 감정처분허가장이나 사전 압수영장을 발부받을 시간적 여유도 없는 긴급한 상황이 생길 수 있다. 이러한 경우 피의자의 신체 내지 의복류에 주취로 인한 냄새가 강하게 나는 등 형사소송법 제211조 제2항 제3호가 정하는 범죄의 증적이 현저한 준현행범인의 요건이 갖추어져 있고 교통사고 발생 시각으로부터 사회통념상 범행 직후라고 볼 수 있는 시간 내라면, 피의자의 생명·신체를 구조하기 위하여 사고현장으로부터 곧바로 후송된 병원 응급실 등의 장소는 형사소송법 제216조 제3항의 범죄 장소에 준한다 할 것이므로, 검사 또는 사법경찰관은 피의자의 혈중알코올농도 등 증거의 수집을 위하여 의료법상 의료인의 자격이 있는 자로 하여금 의료용 기구로 의학적인 방법에 따라 필요최소한의 한도 내에서 피의자의 혈액을 채취하게 한 후 그 혈액을 영장 없이 압수할 수 있다. 따라서 수사기관이 법원으로부터 영장 또는 감정처분허가장을 발부받지 아니한 채 피의자의 동의 없이 피의자의 신체로부터 혈액을 채취하고 사후에도 지체 없이 영장을 발부받지 아니한 채 그 혈액 중 알코올농도에 관한 감정을 의뢰하였다면, 이러한 과정을 거쳐 얻은 감정의뢰회보 등은 형사소송법상 영장주의 원칙을 위반하여 수집하거나 그에 기초하여 획득한 증거로서, 그 절차위반행위가 적법절차의 실질적인 내용을 침해하여 피고인이나 변호인의 동의가 있더라도 유죄의 증거로 사용할 수 없다(대판 2014.11.13. 2013도1228).", "answer": "O"}, {"year": "2018", "num": "2", "source": "18변시", "question": "검사는 특수(합동)절도(㉠)를 범한 甲과 乙에 대하여 공소를 제기하였다. 그러면서 甲에 대하여는 甲이 단독으로 범한 절도(㉡)도 경합범으로 함께 기소하였다. 검사는 제1회 공판기일에 기소요지를 진술하면서 증거목록을 제출하였는데, 甲은 증거목록상의 증거들을 부동의하면서 자신은 사건 당시 집에 있었으므로 공동피고인 乙과 합동한 사실이 없고 단독으로 절도를 범한 사실도 없다고 하면서 범행을 부인하고 있다. 한편, 乙은 자신의 범행을 자백하였고, 乙의 진술 중 甲의 진술과 배치되는 부분에 대하여는 甲의 변호인이 乙에 대하여 반대신문을 실시하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "甲의 ㉠ 범죄사실에 대하여 제출된 乙에 대한 사법경찰관 작성의 피의자신문조서에 “甲과 함께 절도를 하였습니다.\"라는 내용이 기재되어 있는 경우, 이 조서는 증거능력이 없다.", "explanation": "형사소송법 제312조 제3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라, 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조사를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다. 그리고 이러한 경우 그 공동피고인이 법정에서 경찰수사 도중 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였다고 하더라도, 이러한 증언은 원진술자인 공동피고인이 그 자신에 대한 경찰 작성의 피의자신문조서의 진정성립을 인정하는 취지에 불과하여 위 조서와 분리하여 독자적인 증거가치를 인정할 것은 아니므로, 앞서 본 바와 같은 이유로 위 조서의 증거능력이 부정되는 이상 위와 같은 증언 역시 이를 유죄 인정의 증거로 쓸 수 없다(대판 2009.10.15. 2009도1889). ", "answer": "O"}, {"year": "2018", "num": "2", "source": "18변시", "question": "검사는 특수(합동)절도(㉠)를 범한 甲과 乙에 대하여 공소를 제기하였다. 그러면서 甲에 대하여는 甲이 단독으로 범한 절도(㉡)도 경합범으로 함께 기소하였다. 검사는 제1회 공판기일에 기소요지를 진술하면서 증거목록을 제출하였는데, 甲은 증거목록상의 증거들을 부동의하면서 자신은 사건 당시 집에 있었으므로 공동피고인 乙과 합동한 사실이 없고 단독으로 절도를 범한 사실도 없다고 하면서 범행을 부인하고 있다. 한편, 乙은 자신의 범행을 자백하였고, 乙의 진술 중 甲의 진술과 배치되는 부분에 대하여는 甲의 변호인이 乙에 대하여 반대신문을 실시하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "甲의 ㉠ 범죄사실에 대하여 제출된 乙에 대한 검사 작성의 피의자신문조서에 “甲은 망을 보고, 제가 절도를 하였습니다.\"라는 내용이 기재되어 있고 乙이 법정에서 이 조서에 자신이 말한 대로 기재되어 있다고 말할 뿐 아니라 조서가 적법한 절차와 방식에 따라 작성되었고 임의성 및 특신상태도 증명되었다면 이 조서는 증거능력이 있다. ", "explanation": "(1) 2020.2.4. 법률 제16924호로 개정되어 2022.1.1.부터 시행된 형사소송법 제312조 제1항은 검사가 작성한 피의자신문조서의 증거능력에 대해 ‘적법한 절차와 방식에 따라 작성된 것으로서 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다’고 규정하였다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. \n(2) 형사소송법 제312조 제1항에서 정한 ‘검사가 작성한 피의자신문조서’란 ①당해 피고인에 대한 피의자신문조서만이 아니라 ②당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대해 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 ‘공범’에는 형법총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형별 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대해 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다(대판 2023.06.01. 2023도3741).", "answer": "X"}, {"year": "2018", "num": "2", "source": "18변시", "question": "검사는 특수(합동)절도(㉠)를 범한 甲과 乙에 대하여 공소를 제기하였다. 그러면서 甲에 대하여는 甲이 단독으로 범한 절도(㉡)도 경합범으로 함께 기소하였다. 검사는 제1회 공판기일에 기소요지를 진술하면서 증거목록을 제출하였는데, 甲은 증거목록상의 증거들을 부동의하면서 자신은 사건 당시 집에 있었으므로 공동피고인 乙과 합동한 사실이 없고 단독으로 절도를 범한 사실도 없다고 하면서 범행을 부인하고 있다. 한편, 乙은 자신의 범행을 자백하였고, 乙의 진술 중 甲의 진술과 배치되는 부분에 대하여는 甲의 변호인이 乙에 대하여 반대신문을 실시하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "甲의 ㉡ 범죄사실과 관련하여 乙이 피고인신문 과정에서 “甲이 절도를 하는 것을 보았습니다.\"라고 진술한 경우, 이 진술은 ㉡ 범죄사실에 대한 증거능력이 있다. ", "explanation": "㉡ 범죄사실에 대하여 乙은 공범아닌 공동피고인이므로 변론을 분리하지 아니하더라도 증인적격이 인정되므로 피고인신문이 아니라 증인신문절차를 거쳐 증인으로 신문해야 한다(이재상 형사소송법 제9판 p.590). 따라서 피고인 신문과정에서의 乙의 진술은 甲의 ㉡ 범죄사실에 대해 증거능력이 인정되지 아니한다. \n\n판례) 피고인과 별개의 범죄사실로 기소되어 병합심리되고 있던 공동피고인은 피고인에 대한 관계에서는 증인의 지위에 있음에 불과하므로 선서 없이 한 그 공동피고인의 법정 및 검찰진술은 피고인에 대한 공소범죄 사실을 인정하는 증거로 할 수 없다(대판 1982.06.22. 82도898).", "answer": "X"}, {"year": "2018", "num": "2", "source": "18변시", "question": "검사는 특수(합동)절도(㉠)를 범한 甲과 乙에 대하여 공소를 제기하였다. 그러면서 甲에 대하여는 甲이 단독으로 범한 절도(㉡)도 경합범으로 함께 기소하였다. 검사는 제1회 공판기일에 기소요지를 진술하면서 증거목록을 제출하였는데, 甲은 증거목록상의 증거들을 부동의하면서 자신은 사건 당시 집에 있었으므로 공동피고인 乙과 합동한 사실이 없고 단독으로 절도를 범한 사실도 없다고 하면서 범행을 부인하고 있다. 한편, 乙은 자신의 범행을 자백하였고, 乙의 진술 중 甲의 진술과 배치되는 부분에 대하여는 甲의 변호인이 乙에 대하여 반대신문을 실시하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "甲의 ㉡ 범죄사실에 대하여 제출된 乙에 대한 검사 작성의 피의자신문조서에 “丙으로부터 甲이 절도를 하였다는 말을 들었습니다.\"라는 내용이 기재되어 있는 경우, 丙이 이 사건 법정에 증인으로 출석하여 “甲이 절도를 하는 것을 보았고 이 이야기를 乙에게 하였습니다\"라는 내용으로 증언하였더라도 이 조서는 증거능력이 없다.", "explanation": "㉡ 범죄사실에 대한 乙에 대한 검사 작성의 피의자신문조서 중 丙의 진술 기재부분은 전문진술이 기재된 조서인 바 재전문조서가 된다. 판례는 재전문조서에 대하여만은 전문법칙의 각 요건을 충족하는 경우에 예외적으로 증거능력을 인정하는 입장이다. 이러한 판례의 입장을 따를 때 ㉡ 범죄사실에 대하여는 乙에 대한 피의자신문조서가 동법 제316조 제2항의 요건을 충족하지 못하므로 乙에 대한 검사작성피의자신문조서는 증거능력이 없다. \n\n판례) 재전문증거의 증거능력: 전문진술이나 재전문진술을 기재한 조서는 형사소송법 제310조의2의 규정에 의하여 원칙적으로 증거능력이 없는 것인데, 다만 전문진술은 형사소송법 제316조 제2항의 규정에 따라 원진술자가 사망, 질병, 외국거주 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에 한하여 예외적으로 증거능력이 있다고 할 것이고, 전문진술이 기재된 조서는 형사소송법 제312조 또는 제314조의 규정에 의하여 각 그 증거능력이 인정될 수 있는 경우에 해당하여야 함은 물론 나아가 형사소송법 제316조 제2항 규정에 따른 위와 같은 요건을 갖추어야 예외적으로 증거능력이 있다고 할 것이며, 형사소송법은 전문진술에 대여 제316조에서 실질상 단순한 전문의 형태를 취하는 경우에 한하여 예외적으로 그 증거능력을 인정하는 규정을 두고 있을 뿐 재전문진술이나 재전문진술을 기재한 조서에 대하여는 달리 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 하는 데 동의하지 아니하는 한 형사소송법 제310조의2의 규정에 의하여 이를 증거로 할 수 없다(대판 2004.03.11. 2003도171).\n", "answer": "O"}, {"year": "2018", "num": "3", "source": "18변시", "question": "외국 국적자인 甲은 주간에 A가 운영하는 휴대폰 판매 가게에서 A가 잠시 자리를 비운 틈을 타 중고 휴대폰 여러 대를 훔친 후 자신의 집에 숨겨두었다. 며칠 뒤 사법경찰관은 노래방에서 나오는 甲을 긴급체포하였다. 검사는 검찰수사관과 통역인을 참여시킨 상태에서 甲을 신문하여 피의자신문조서를 작성하였고 영상녹화는 하지 않았다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 甲이 공판과정에서 검사가 작성한 피의자신문조서의 실질적 진정성립을 부정하면서 증거로 함에 부동의하는 경우, 피의자신문에 참여하였던 통역인이 공판정에 증인으로 출석하여 甲이 진술한 대로 기재되어 있다고 증언한 것만으로는 피의자신문조서의 실질적 진정성립을 인정할 수 없다.", "explanation": "실질적 진정성립을 증명할 수 있는 방법으로서 형사소송법 제312조 제2항에 예시되어 있는 영상녹화물의 경우 형사소송법 및 형사소송규칙에 의하여 영상녹화의 과정, 방식 및 절차 등이 엄격하게 규정되어 있는데다(형사소송법 제244조의2, 형사소송규칙 제134조의2 제3항, 제4항, 제5항 등) 피의자의 진술을 비롯하여 검사의 신문 방식 및 피의자의 답변 태도 등 조사의 전 과정이 모두 담겨 있어 피고인이 된 피의자의 진술 내용 및 취지를 과학적·기계적으로 재현해 낼 수 있으므로 조서의 내용과 검사 앞에서의 진술 내용을 대조할 수 있는 수단으로서의 객관성이 보장되어 있다고 볼 수 있으나, 피고인을 피의자로 조사하였거나 조서에 참여하였던 자들의 증언은 오로지 증언자의 주관적 기억 능력에 의존할 수밖에 없어 객관성이 보장되어 있다고 보기 어렵다. 결국 검사 작성의 피의자신문조서에 대한 실질적 진정성립을 증명할 수 있는 수단으로서 형사소송법 제312조 제2항에 규정된 ‘영상녹화물이나 그 밖의 객관적인 방법’이란 형사소송법 및 형사소송규칙에 규정된 방식과 절차에 따라 제작된 영상녹화물 또는 그러한 영상녹화물에 준할 정도로 피고인의 진술을 과학적·기계적·객관적으로 재현해 낼 수 있는 방법만을 의미하고, 그 외에 조사관 또는 조사 과정에 참여한 통역인 등의 증언은 이에 해당한다고 볼 수 없다(대판 2016.02.18. 2015도16586). \n\n• 2020년 2월 4일 개정되고 2021년 1월 1일에 시행되는 형사소송법에 의하면 제312조 제2항은 삭제되었음에 유의  (대판 2016.02.18. 2015도16586).\n\n<2019. 12. 31. 시행>\n형사소송법 제312조(검사 또는 사법경찰관의 조서 등) ①검사가 피고인이 된 피의자의 진술을 으로 甲은 다음 날 경찰서에 자진출석하였으나 필로폰 투약 사실을 일관되게 부인하며 소변의 임의제출도 거부하므로 경찰관은 소변 확보를 위해 압수·수색·검증영장을 발부받았다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "(4) 甲은 경찰서에 자진 출석 하였으나 혐의를 부인하고 있으므로 필로폰 투약 사실에 대한 자수로서의 효력이 없다.\n", "explanation": "자수서를 소지하고 수사기관에 자발적으로 출석하였으나 자수서를 제출하지 아니하고 범행사실도 부인하였다면 자수가 성립하지 아니하고, 그 이후 구속까지 된 상태에서 자수서를 제출하고 범행사실을 시인한 것을 자수에 해당한다고 인정할 수 없다(2003도3133).\n", "answer": "O"}, {"year": "2018", "num": "9", "source": "18변시", "question": "甲은 A 소유의 부동산을 매수하면서 A와 매매계약을 한 후 소유권이전등기는 명의신탁약정을 맺은 乙 앞으로 경료하였다. 乙은 등기가 자신 명의로 되어있음을 기화로 친구인 丙과 공모하여 甲의 승낙 없이 이 부동산을 丙에게 헐값으로 처분하였다. 이 사실을 안 甲이 乙과 丙에게 폭언을 퍼붓자, 乙과 丙은 서로 짜고 B를 포함한 여러 사람들에게 甲을 모욕하는 말을 떠들고 다녔다. 이에 甲은 乙과 丙을 횡령과 모욕의 범죄사실로 고소하였다. 이후 甲은 도로상에서 만난 丙이 “왜 나를 고소했느냐?\"라고 따지면서 대들자 마침 그곳을 지나가는 동생 丁에게 “강도인 저 사람이 칼을 갖고 형을 협박하니 좀 때려라.\"라고 하면서 상해의 고의로 옆에 있던 위험한 물건인 몽둥이를 건네주었고, 甲의 말만 믿은 丁은 甲을 방위할 의사로 丙에게 약 3주간의 치료를 요하는 상해를 가하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "(5) 만일 검사로부터 丙을 모욕죄로 공소를 제기하지 아니한다는 통지를 받은 甲이 관할 고등법원에 재정신청을 하였다면 재정결정이 확정될 때까지 공소시효의 진행은 정지되며, 법원의 공소제기 결정에 대하여 검사는 즉시항고 등의 방법으로 불복할 수 없다.", "explanation": "형사소송법 제260조(재정신청) ①고소권자로서 고소를 한 자(「형법」 제123조부터 제126조까지의 죄에 대하여는 고발을 한 자를 포함한다. 이하 이 조에서 같다)는 검사로부터 공소를 제기하지 아니한다는 통지를 받은 때에는 그 검사 소속의 지방검찰청 소재지를 관할하는 고등법원(이하 “관할 고등법원”이라 한다)에 그 당부에 관한 재정을 신청할 수 있다. 다만, 「형법」 제126조의 죄에 대하여는 피공표자의 명시한 의사에 반하여 재정을 신청할 수 없다. \n\n제262조(심리와 결정) \n  ②법원은 재정신청서를 송부받은 날부터 3개월 이내에 항고의 절차에 준하여 다음 각 호의 구분에 따라 결정한다. 이 경우 필요한 때에는 증거를 조사할 수 있다.\n  1. 신청이 법률상의 방식에 위배되거나 이유 없는 때에는 신청을 기각한다.\n  2. 신청이 이유 있는 때에는 사건에 대한 공소제기를 결정한다.\n  ④제2항제1호의 결정에 대하여는 제415조에 따른 즉시항고를 할 수 있고, 제2항제2호의 결정에 대하여는 불복할 수 없다. 제2항제1호의 결정이 확정된 사건에 대하여는 다른 중요한 증거를 발견한 경우를 제외하고는 소추할 수 없다. \n\n제262조의4(공소시효의 정지 등) ①제260조에 따른 재정신청이 있으면 제262조에 따른 재정결정이 확정될 때까지 공소시효의 진행이 정지된다. ", "answer": "O"}, {"year": "2017", "num": "1", "source": "17변시", "question": "甲과 乙은 야간에 A의 집에 있는 다이아몬드를 훔쳐서 유흥비를 마련하기로 모의하면서, 범행이 발각되는 경우 어떤 수단을 사용해서라도 체포되어서는 아니된다고 약속하였다. 밤 12시 경 甲이 집 밖에서 망을 보고있는 사이 乙은 A의 집에 들어가서 다이아몬드를 들고 나오다가 이를 본 A가 “도둑이야!\"라고 소리치자 집 밖으로 도망쳤다.\nⓐ A가 乙을 체포하기 위해 집 밖으로 나오는 순간 집 밖에서 기다리고 있던 甲은 체포를 면탈할 목적으로 A를 넘어뜨려 A는 상해를 입었고 A는 더 이상 추적을 할 수 없었다.\nⓑ 이에 A는 경찰서에 신고를 하였고, 출동한 경찰관 B는 乙을 추격하여 체포하려고 하자, 乙은 B를 밀쳐서 B는 상해를 입었다.\nⓒ 甲과 乙은 모두 체포되어 공동정범으로 기소되어 재판을 받고 있다. 甲은 법정에서 범행을 자백하면서 乙과 함께 다이이몬드를 훔칠 것을 모의하였다고 진술하였다. 그러나 乙은 모의한 사실이 없고 지나가다가 甲의 범행에 도움을 준 것이라고 주장하면서 범행을 부인하였다.\nⓓ 한편 경찰관 C는 증거확보를 위해 A의 상해부위를 사진촬영하였고, 검사는 그 사진을 법원에 증거로 신청하였다.", "choice": "ㄹ. ⓒ사실과 관련하여 변론의 분리 없이도 甲은 乙의 범죄사실에 대한 증인적격이 인정된다.", "explanation": "공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인에 대한 공소 사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다(대판 2008.06.26. 2008도.3300).", "answer": "X"}, {"year": "2017", "num": "1", "source": "17변시", "question": "甲과 乙은 야간에 A의 집에 있는 다이아몬드를 훔쳐서 유흥비를 마련하기로 모의하면서, 범행이 발각되는 경우 어떤 수단을 사용해서라도 체포되어서는 아니된다고 약속하였다. 밤 12시 경 甲이 집 밖에서 망을 보고있는 사이 乙은 A의 집에 들어가서 다이아몬드를 들고 나오다가 이를 본 A가 “도둑이야!\"라고 소리치자 집 밖으로 도망쳤다.\nⓐ A가 乙을 체포하기 위해 집 밖으로 나오는 순간 집 밖에서 기다리고 있던 甲은 체포를 면탈할 목적으로 A를 넘어뜨려 A는 상해를 입었고 A는 더 이상 추적을 할 수 없었다.\nⓑ 이에 A는 경찰서에 신고를 하였고, 출동한 경찰관 B는 乙을 추격하여 체포하려고 하자, 乙은 B를 밀쳐서 B는 상해를 입었다.\nⓒ 甲과 乙은 모두 체포되어 공동정범으로 기소되어 재판을 받고 있다. 甲은 법정에서 범행을 자백하면서 乙과 함께 다이이몬드를 훔칠 것을 모의하였다고 진술하였다. 그러나 乙은 모의한 사실이 없고 지나가다가 甲의 범행에 도움을 준 것이라고 주장하면서 범행을 부인하였다.\nⓓ 한편 경찰관 C는 증거확보를 위해 A의 상해부위를 사진촬영하였고, 검사는 그 사진을 법원에 증거로 신청하였다.", "choice": "ㅁ. ⓓ 사실과 관련하여 상해부위 촬영 사진에 대해서는 전문법칙이 적용되지 않는다.", "explanation": "‘공소외인의 상해부위를 촬영한 사진’은 비진술증거로서 전문법칙이 적용되지 않는다(대판 2007.07.26. 2007도3906).", "answer": "O"}, {"year": "2017", "num": "2", "source": "17변시", "question": "유흥업소를 운영하는 甲은 경찰관 乙에게 단속정보를 제공해 주는 대가로 2009. 5. 20. 200만 원의 뇌물을 공여하였다는 혐의로 조사를 받았다. 하지만 甲은 “돈을 가져오지 않으면 구속수사 하겠다는 乙의 협박 때문에 200만 원을 주었을 뿐이고, 乙로부터 단속정보를 제공받은 사실이 없으며, 그 대가로 준 것도 아니다\"라고 강하게 부인하였다. 그 후 甲이 잠적해 버리자, 고민을 거듭하던 검사는 甲의 부인 A로부터 “구속수사를 피하기 위해 乙에게 200만 원을 주었다는 얘기를 甲으로부터 들었다\"라는 진술을 확보하여 2016.5.21. 乙을 공갈죄로 기소하였다. 乙의 공판이 진행되던 2016. 7. 10. 검찰에 자진출석한 甲은 “乙로부터 경찰의 단속정보를 제공받는 대가로 200만 원을 제공한 것이 맞다\"라고 진술하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "③ 공소장변경을 통해 乙에 대한 공소사실이 공갈에서 뇌물수수로 변경될 경우, 乙에 대해 적용될 공소시효의 기간은 공갈죄를 기준으로 한다.", "explanation": "공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 된다(대판 2002.10.11. 2002도2939)", "answer": "X"}, {"year": "2017", "num": "2", "source": "17변시", "question": "유흥업소를 운영하는 甲은 경찰관 乙에게 단속정보를 제공해 주는 대가로 2009. 5. 20. 200만 원의 뇌물을 공여하였다는 혐의로 조사를 받았다. 하지만 甲은 “돈을 가져오지 않으면 구속수사 하겠다는 乙의 협박 때문에 200만 원을 주었을 뿐이고, 乙로부터 단속정보를 제공받은 사실이 없으며, 그 대가로 준 것도 아니다\"라고 강하게 부인하였다. 그 후 甲이 잠적해 버리자, 고민을 거듭하던 검사는 甲의 부인 A로부터 “구속수사를 피하기 위해 乙에게 200만 원을 주었다는 얘기를 甲으로부터 들었다\"라는 진술을 확보하여 2016.5.21. 乙을 공갈죄로 기소하였다. 乙의 공판이 진행되던 2016. 7. 10. 검찰에 자진출석한 甲은 “乙로부터 경찰의 단속정보를 제공받는 대가로 200만 원을 제공한 것이 맞다\"라고 진술하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 乙에게 뇌물수수죄가 인정되고 甲에게 뇌물공여죄가 인정될 경우, 乙에 대해 공소가 제기되더라도 甲의 뇌물공여죄에 관한 공소시효가 정지되지 않는다.\n", "explanation": "형사소송법 제 248조 제1항, 제253조 제1항,제2항에서 규정히는 바와 같이, 형사소송법은 공범 사이의 처벌에 형평을 기하기 위하여 공범 중 1인에 대한 공소의 제기로 다른 공범자에 대하여도 공소시효가 정지되도록 규정하고 있는데, 위 공범의 개념이나 유형에 관하여는 아무런 규정을 두고 있지 아니하다.\n따라서 형사소송법 제 253조 제2항의 공범을 해석할 때에는 공범 사이의 처벌의 형평이라는 위 조항의 입법 취지, 국가형벌권의 적정한 실현이라는 형사소송법의 기본이념, 국가형별권 행사의 대상을 규정한 형법 등 실체법과의 체계적 조화 등의 관점을 종합적으로 고려하여야 하고, 특히 위 조항이 공소제기 효력의 인적 범위를 확장하는 예외를 마련하여 놓은 것이므로 원칙적으로 엄격하게 해석하여야 하고 피고인에게 불리한 방향으로 확장하여 해석해서는 아니된다. 뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 자는 강학상으로는 필요적 공범이라고 불리고 있으나 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌규정에 따라 처벌되는 것이어서, 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며, 대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면, 형사소송법 제253조 제2항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 지는 포함되지 않는다(대판 2015.02.12. 2012도4842) .", "answer": "O"}, {"year": "2017", "num": "2", "source": "17변시", "question": "유흥업소를 운영하는 甲은 경찰관 乙에게 단속정보를 제공해 주는 대가로 2009. 5. 20. 200만 원의 뇌물을 공여하였다는 혐의로 조사를 받았다. 하지만 甲은 “돈을 가져오지 않으면 구속수사 하겠다는 乙의 협박 때문에 200만 원을 주었을 뿐이고, 乙로부터 단속정보를 제공받은 사실이 없으며, 그 대가로 준 것도 아니다\"라고 강하게 부인하였다. 그 후 甲이 잠적해 버리자, 고민을 거듭하던 검사는 甲의 부인 A로부터 “구속수사를 피하기 위해 乙에게 200만 원을 주었다는 얘기를 甲으로부터 들었다\"라는 진술을 확보하여 2016.5.21. 乙을 공갈죄로 기소하였다. 乙의 공판이 진행되던 2016. 7. 10. 검찰에 자진출석한 甲은 “乙로부터 경찰의 단속정보를 제공받는 대가로 200만 원을 제공한 것이 맞다\"라고 진술하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ “乙에게 200만 원을 뇌물로 주었다\"라는 甲의 진술이 유일한 증거인 경우, “甲으로부터 그런 얘기를 들었다\"라는 A의 법정증언을 보강증거로 하여 甲의 뇌물공여를 유죄로 인정할 수 있다.", "explanation": "피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 형사소송법 제310조의 피고인의 자백에는 포함되지 아니하나 피고인의 자백을 피고인의 자백으로 보강하는 결과가 되기 때문에 피고인의 자백의 보강증거로 될 수 없다(대판 2008.02.14. 2007도10937).", "answer": "X"}, {"year": "2017", "num": "3", "source": "17변시", "question": "甲은 A의 집에 들어가 금품을 절취하려다 A에게 발각되자 A를 강간한 후에 도주하였다. 甲은 양심에 가책을 느꼈지만 처벌이 두려워 자수하지 못하고 친구인 乙에게 자신의 범행을 이야기하였는데, 乙은 다시 이 사실을 여자친구 丙에게 이야기하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄱ. 甲이 자필로 작성한 범행을 인정하는 내용의 메모지가 甲의 집에서 발견되어 증거로 제출된 경우, 甲이 공판기일에서 그 성립의 진정을 부인하면 필적감정에 의하여 성립의 진정함이 증명되더라도 증거로 사용할 수 없다.", "explanation": "진술서의 작성자가 공판준비나 공판기일에서 그 성립의 진정을 부인하는 경우에는 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에는 증거로 할 수 있다. 다만, 피고인 아닌 자가 작성한 진술서는 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 작성자를 신문할 수 있었을 것을 요한다(형사소송법 제313조 제2항) .", "answer": "X"}, {"year": "2017", "num": "3", "source": "17변시", "question": "甲은 A의 집에 들어가 금품을 절취하려다 A에게 발각되자 A를 강간한 후에 도주하였다. 甲은 양심에 가책을 느꼈지만 처벌이 두려워 자수하지 못하고 친구인 乙에게 자신의 범행을 이야기하였는데, 乙은 다시 이 사실을 여자친구 丙에게 이야기하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄴ. 乙이 甲과의 대화를 녹음한 녹음테이프의 원본이 증거로 제출된 경우, 공판기일에서 甲이 녹음내용을 부인하여도 乙의 진술에 의하여 녹음테이프에 녹음된 甲의 진술내용이 甲이 진술한 대로 녹음된 것이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 것이 인정되는 때에는 증거로 사용할 수 있다.", "explanation": "녹음테이프에 대하여 실시한 검증의 내용은 녹음테이프에 녹음된 대화의 내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같디는 것에 불과하여 증거자료가 되는 것은 여전히 녹음테이프에 녹음된 대화의 내용이라 할 것인바 그 중 피고인의 진술내용은 실질적으로 형사소송법 제311 조, 제312조 규정 이외에 피고인의 진술을 기재한 서류와 다를 바 없으므로 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 그 녹음테이프 검증조서의 기재 중 피고인의 진술내용을 증거로 사용하기 위해서는 형사소송법 제313조 제1항 단서에 따라 공판준비 또는 공판기일에서 그 작성자인 고소인의 진술에 의하여 녹음테이프에 녹음된 피고인의 진술내용이 피고인이 진술한 대로 녹음된 것이라는 점이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 것으로 인정되어야 한다(대판 2001.10.09. 2001도.3106) .\n\n형사소송법 제313조(진술서등) ① 전2조의 규정 이외에 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류로서 그 작성자 또는 진술자의 자필이거나 그 서명 또는 날인이 있는 것(피고인 또는 피고인 아닌 자가 작성하였거나 진술한 내용이 포함된 문자 · 사진 · 영상 등의 정보로서 컴퓨터용디스크, 그 밖에 이와 비슷한 정보저장매체에 저장된 것을 포함한다. 이하 이 조에서 같다)은 공판준비나 공판기일에서의 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다. 단, 피고인의 진술을 기재한 서류는 공판준비 또는 공판기일에서의 그 작성자의 진술에 의하여 그 성립의 진정함이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여 진 때에 한하여 피고인의 공판준비 또는 공판기일에서의 진술에 불구하고 증거로 할 수 있다.\n② 제1항 본문에도 불구하고 진술서의 작성자가 공판준비나 공판기일에서 그 성립의 진정을 부인하는 경우에는 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에는 증거로 할 수 있다. 다만, 피고인 아닌 자가 작성한 진술서는 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 작성자를 신문할 수 있었을 것을 요한다.", "answer": "O"}, {"year": "2017", "num": "3", "source": "17변시", "question": "甲은 A의 집에 들어가 금품을 절취하려다 A에게 발각되자 A를 강간한 후에 도주하였다. 甲은 양심에 가책을 느꼈지만 처벌이 두려워 자수하지 못하고 친구인 乙에게 자신의 범행을 이야기하였는데, 乙은 다시 이 사실을 여자친구 丙에게 이야기하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄷ. 丙이 乙로부터 들은 甲의 진술내용을 사법경찰관에게 진술하였고 그러한 진술이 기재된 진술조서가 증거로 제출된 경우, 해당 진술조서 중 甲의 진술기재 부분은 「형사소송법」 제316조 제1항 및 제 312조 제4항의 규정에 따른 요건을 갖춘 때에 한하여 증거로 사용할 수 있다.", "explanation": "전문진술이나 재전문진술을 기재한 조서는 형사소송법 제 310조의2의 규정에 의하여 원칙적으로 증거능력이 없는 것인데 다만 전문진술은 형사소송법 제 316조 제2항의 규정에 따라 원진술자가 사망, 질병, 외국거주 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여진 때에 한하여 예외적으로 증거능력이 있다고 할 것이고, 전문진술이 기재된 조서는 형사소송법 제312조 또는 제314조의 규정에 의하여 각 그 증거능력이 인정될 수 있는 경우에 해당하여야 함은 물론 나아가 형사소송법 제316조 제2항의 규정에 따른 위와 같은 요건을 갖추어야 예외적으로 증거능력이 있다고 할 것이며, 형사소송법은 전문진술에 대하여 제 316조에서 실질상 단순한 전문의 형태를 취히는 경우에 한하여 예외적으로 그 증거능력을 인정하는 규정을 두고 있을 뿐, 재전문진술이나 재전문진술을 기재한 조서에 대하여는 달리 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 히는데 동의하지 아니하는 한 형사소송법 제310조의2의 규정에 의히여 이를 증거로 할 수 없다{대판 2004.03.11.2003도171). 사안의 경우 재전문진술을 기재한 조서로서 전문법칙 예외규정이 없고 증거동의가 없는 한 증거로 할 수 없다.", "answer": "X"}, {"year": "2017", "num": "3", "source": "17변시", "question": "甲은 A의 집에 들어가 금품을 절취하려다 A에게 발각되자 A를 강간한 후에 도주하였다. 甲은 양심에 가책을 느꼈지만 처벌이 두려워 자수하지 못하고 친구인 乙에게 자신의 범행을 이야기하였는데, 乙은 다시 이 사실을 여자친구 丙에게 이야기하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 피해자 A는 피해 내용을 아버지 B에게 문자메시지로 보냈고 B가 그 문자메시지를 촬영한 사진이 증거로 제출된 경우, A와 B가 법정에 출석하여 A는 사진 속 문자메시지의 내용이 자신이 작성해 보낸 것과 동일함을 확인하고 B는 A가 보낸 문자메시지를 촬영한 사진이 맞다고 확인한 때에는 증거로 사용할 수 있다.", "explanation": "이 사건 문자메시지는 피해자가 피고인으로부터 풀려난 당일에 남동생에게 도움을 요청하면서 피고인이 협박한 말을 포함하여 공갈 등 피고인으로부터 피해를 입은 내용을 문자메시지로 보낸 것이므로, 이 사건 문자메시지의 내용을 촬영한 사진은 증거서류 중 피해자의 진술서에 준하는 것으로 취급함이 상당할 것인바, 진술서에 관한 형사소송법 제313조에 따라 이 사건 문자메시지의 작성자인 피해자 공소외 1이 제1심 법정에 출석하여 자신이 이 사건 문자메시지를 작성하여 동생에게 보낸 것과 같음을 확인하고, 동생인 공소외 3도 제 1심 법정에 출석하여 피해자 공소외 1이 보낸 이 사건 문자메시지를 촬영한 사진이 맞다고 확인한 이상, 이 사건 문자메시지를 촬영한 사진은 그 성립의 진정함이 증명되었다고 볼 수 있으므로 이를 증거로 할 수 있다(대판 2010.11.25. 2010도8735).\n \n비교 판례 [1] 구 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제65조 제1항 제3호는 정보통신망을 통하여 공포심이나 불안감을 유발히는 글을 반복적으로 상대방에게 도달하게 하는 행위를 처벌하고 있다. 검사가 위 죄에 대한 유죄의 증거로 문자정보가 저장되어 있는 휴대전화기를 법정에 제출하는 경우, 휴대전화기에 저장된 문자정보 그 자체가 범행의 직접적인 수단으로서 증거로 사용될 수 있다. 또한, 검사는 휴대전화기 이용자가 그 문자정보를 읽을 수 있도록 한 휴대전화기의 화면을 촬영한 사진을 증거로 제출할 수도 있는데, 이를 증거로 사용하려면 문자정보가 저장된 휴대전화기를 법정에 제출할 수 없거나 그 제출이 곤란한 사정이 있고, 그 사진의 영상이 휴대전화기의 화면에 표시된 문자정보와 정확하게 같다는 사실이 증명되어야 한다. \n[2] 형사소송법 제 310조의 2는 사실을 직접 경험한 사람의 진술이 법정에 직접 제출되어야 하고 이에 갈음하는 대체물인 진술 또는 서류가 제출되어서는 안 된다는 이른바 전문법칙을 선언한 것이다. 그런데 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우， 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제 310조의 2 에서 정한 전문법칙이 적용되지 않는다(대판 2008.11.13. 2006도2556).", "answer": "O"}, {"year": "2017", "num": "4", "source": "17변시", "question": "甲은 A가 운영하는 식당에 들어가 금품을 절취하기로 마음먹고 야간에 A의 식당 창문과 방충망을 그대로 창틀에서 분리만 한 후 식당 안으로 들어갔으나 곧바로 방범시스템이 작동하여 그 경보 소리를 듣고 달려온 A와 근처를 순찰중이던 경찰관 B에게 발각되자 체포를 면탈할 목적으로 A와 B를 폭행하고 도주하였다. 이러한 상황은 식당에 설치된 CCTV에 모두 녹화되었다. 甲은 공소제기되어 제1심 법원에서 재판 진행 중이다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 검사가 위 CCTV 녹화기록을 증거로 제출하였는데, 제1심 법원이 공판기일에 CCTV에 대한 검증을 행한 경우, 그 검증결과가 바로 증거가 되는 것이고 그 검증의 결과를 기재한 검증조서가 서증으로서 증거가 되는 것은 아니다.", "explanation": "엘리베이터 CCTV 동영상 검증에 관하여 수소법원이 공판기일에 검증을 행한 경우에는 그 검증결과 즉 법원이 오판의 작용에 의하여 판단한 결과가 바로 증거가 되고, 그 검증의 결과를 기재한 검증조서가 서증으로서 증거가 되는 것은 아니다(대판 2009.11.12. 2009도8949).", "answer": "O"}, {"year": "2017", "num": "6", "source": "17변시", "question": "「정치자금법」상 금품수수 혐의로 공소제기된 피고인 甲이 법정에서 금품수수 사실을 부인하였고, 제1심 법원에 증인으로 출석한 乙은 甲에게 금품을 제공하였다고 증언하였지만 제1심 법원은 乙의 증언에 신빙성이 없고 범죄의 증명이 부족하다는 이유로 무죄를 선고하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "① 甲의 혐의를 뒷받침할 금융자료 등 객관적 물증이 없는 경우, 제1심 법원이 금품수수 사실을 부인하는 甲에 대해 乙의 진술만으로 유죄를 인정하기 위해서는 乙의 진술이 증거능력이 있어야 함은 물론 합리적인 의심을 배제할 만한 신빙성이 있어야 한다.", "explanation": "금품수수 여부가 쟁점이 된 사건에서 금품수수자로 지목된 피고인이 수수사실을 부인하고 있고 이를 뒷받침할 금융자료 등 객관적 물증이 없는 경우 금품을 제공하였다는 사람의 진술만으로 유죄를 인정하기 위하여는 그 사람의 진술이 증거능력이 있어야 함은 물론 합리적인 의심을 배제할 만한 신빙성이 있어야 하고, 신빙성이 있는지 여부를 판단할 때에는 그 진술 내용 자체의 합리성, 객관적 상당성, 전후의 일관성 뿐만 아니라 그의 인간됨, 그 진술로 얻게 되는 이해관계 유무, 특히 그에게 어떤 범죄의 혐의가 있고 그 혐의에 대하여 수사가 개시될 기능성이 있거나 수사가 진행 중인 경우에는 이를 이용한 협박이나 회유 등의 의심이 있어 그 진술의 증거능력이 부정되는 정도에까지 이르지 아니하는 경우에도 그로 인한 궁박한 처지에서 벗어나려는 노력이 진술에 영향을 미칠 수 있는지 여부 등도 아울러 살펴보아야 한다(대판 2011.04.28. 2010도14487).", "answer": "O"}, {"year": "2017", "num": "6", "source": "17변시", "question": "「정치자금법」상 금품수수 혐의로 공소제기된 피고인 甲이 법정에서 금품수수 사실을 부인하였고, 제1심 법원에 증인으로 출석한 乙은 甲에게 금품을 제공하였다고 증언하였지만 제1심 법원은 乙의 증언에 신빙성이 없고 범죄의 증명이 부족하다는 이유로 무죄를 선고하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "② 항소심 법원이 乙을 증인으로 다시 신문한 결과 제1심이 들고 있는 의심과 일부 어긋날 수 있는 사실의 개연성이 드러나 제1심의 판단에 의문이 생긴 경우, 제1심이 일으킨 합리적인 의심을 충분히 해소할 수 있을 정도에까지 이르지 아니하더라도 乙의 진술의 신빙성이 부족하다는 제1심의 판단에 사실오인의 위법이 있다고 인정하여 공소사실을 유죄로 인정할 수 있다.", "explanation": "금품 수수 여부가 쟁점이 된 사건에서 금품을 제공하였다는 사람의 진술에 대하여 제1심이 증인신문절차 등을 거친 후에 합리적인 의심을 배제할 만한 신빙성이 없다고 보아 공소사실을 무죄로 판단한 경우에, 항소심이 제1심 증인 등을 다시 신문하는 등의 추가 증거조사를 거쳐 신빙성을 심사하여 본 결과 제1심이 들고 있는 의심과 일부 어긋날 수 있는 사실의 개연성이 드러남으로써 제1심의 판단에 의문이 생기더라도, 제1심이 제기한 의심이 금품 제공과 양립할 수 없거나 진술의 신빙성 인정에 장애가 되는 사실의 개연성에 대한 합리성 있는 근거에 기초하고 있고 제1심의 증거조사 결과와 항소심의 추가 증거조사 결과에 의하여도 제1심이 일으킨 합리적인 의심을 충분히 해소할 수 있을 정도에까지 이르지 아니한다면, 일부 반대되는 사실에 관한 개연성 또는 의문만으로 진술의 신빙성 및 범죄의 증명이 부족하다는 제1심의 판단에 사실오인의 위법이 있다고 단정하여 공소사실을 유죄로 인정하여서는 아니 된다. 특히 항소심에서도 진술 중의 일부에 대하여 신빙성을 부정함으로써 그에 관한 제1심의 판단을 수긍하는 경우라면, 나머지 진술 부분에 대하여 신빙성을 부정한 제1심의 판단이 위법하다고 인정하기 위해서는 그 부분 진술만은 신뢰할 수 있는 확실한 근거가 제시되는 등의 특별한 사정이 있는지에 관하여 더욱 신중히 판단하여야 한다(대판 2016.02.18. 2015도11428).", "answer": "X"}, {"year": "2017", "num": "6", "source": "17변시", "question": "「정치자금법」상 금품수수 혐의로 공소제기된 피고인 甲이 법정에서 금품수수 사실을 부인하였고, 제1심 법원에 증인으로 출석한 乙은 甲에게 금품을 제공하였다고 증언하였지만 제1심 법원은 乙의 증언에 신빙성이 없고 범죄의 증명이 부족하다는 이유로 무죄를 선고하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "③ 만일 乙이 검찰에서는 자금을 조성하여 甲에게 정치자금으로 제공하였다고 진술하였다가 제1심 법정에서는 정치자금으로 제공한 사실을 부인하면서 자금의 사용처를 달리 증언하였다고 하더라도 제1심 법원은 乙의 검찰 진술의 신빙성을 인정하여 甲에게 유죄를 선고할 수 있다.", "explanation": "국회의원인 피고인이 甲주식회사 대표이사 乙에게서 3차례에 걸쳐 약 9억 원의 불법정치자금을 수수하였다는 내용으로 기소되었는데 乙이 검찰의 소환 조사에서는 자금을 조성하여 피고인에게 정치자금으로 제공하였다고 진술하였다가, 제1심 법정에서는 이를 번복하여 자금 조성 사실은 시인하면서도 피고인에게 정치자금으로 제공한 사실을 부인하고 자금의 사용처를 달리 진술한 경우 공판중심주의와 실질적 직접심리주의 등 형사소송의 기본원칙상 검찰진술보다 법정진술에 더 무게를 두어야 한다는 점을 감안하더라도, 乙의 법정진술을 믿을 수 없는 사정 아래에서 乙이 법정에서 검찰진술을 번복하였다는 이유만으로 조성 자금을 피고인에게 정치자금으로 공여하였다는 검찰진술의 신빙성이 부정될 수는 없고, 진술 내용 자체의 합리성, 객관적 상당성, 전후의 일관성, 이해관계 유무 등과 함께 다른 객관적인 증거나 정황사실에 의하여 진술의 신빙성이 보강될 수 있는지, 반대로 공소사실과 배치되는 사정이 존재하는지 두루 살펴 판단할 때 자금 사용처에 관한 乙의 검찰진술의 신빙성이 인정되므로, 乙의 검찰진술 등을 종합하여 공소사실을 모두 유죄로 인정한 원심판단에 자유심증주의의 한계를 벗어나는 등의 잘못이 없다(대판 2015.08.20. 2013도11650(전합)).", "answer": "O"}, {"year": "2017", "num": "6", "source": "17변시", "question": "「정치자금법」상 금품수수 혐의로 공소제기된 피고인 甲이 법정에서 금품수수 사실을 부인하였고, 제1심 법원에 증인으로 출석한 乙은 甲에게 금품을 제공하였다고 증언하였지만 제1심 법원은 乙의 증언에 신빙성이 없고 범죄의 증명이 부족하다는 이유로 무죄를 선고하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 乙이 증인신문에 앞서 법원에 甲뿐만 아니라 변호인에 대해서까지 차폐시설의 설치를 요구한다면, 그러한 방식으로 증인신문이 이루어지는 경우 반대신문권이 제한될 수 있으므로, 법원은 특별한 사정이 있는 경우에만 예외적으로 변호인에 대한 차폐시설의 설치를 허용할 수 있다.", "explanation": "증인이 대면하여 진술함에 있어 심리적인 부담으로 정신의 평온을 현저하게 잃을 우려가 있는 상대방은 피고인인 경우가 대부분일 것이지만, 증인이나 피고인과의 관계에 따라서는 방청인 등 다른 사람도 상대방이 될 수 있다. 이에 따라 형사소송법 제165조의2 제3호도 대상을 ‘피고인 등’이라고 규정하고 있으므, 법원은 형사소송법 제165조의2 제3호의 요건이 충족될 경우 피고인뿐만 아니라 검사, 변호인, 방청인 등에 대하여도 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 있으며, 이는 형사소송규칙 제84조의9 에서 피고인과 증인 사이의 차폐시설 설치만을 규정하고 있다고 하여 달리 볼 것이 아니다. 다만 증인이 변호인을 대면하여 진술함에 있어 심리적인 부담으로 정신의 평온을 현저하게 잃을 우려가 있다고 인정되는 경우는 일반적으로 쉽게 상정할 수 없고 피고인뿐만 아니라 변호인에 대해서까지 차폐시설을 설치하는 방식으로 증인신문이 이루어지는 경우 피고인과 변호인 모두 증인이 증언하는 모습이나 태도 등을 관찰할 수 없게 되어 그 한도에서 반대신문권이 제한될 수 있으므로 변호인에 대한 차폐시설의 설치는, 특정범죄신고자 등 보호법 제7조에 따라 범죄신고자 등이나 친족 등이 보복을 당할 우려가 있다고 인정되어 조서 등에 인적사항을 기재하지 아니한 범죄신고자 등을 증인으로 신문하는 경우와 같이, 이미 인적사항에 관하여 비밀조치가 취해진 증인이 변호인을 대면하여 진술함으로써 자신의 신분이 노출되는 것에 대하여 심한 심리적인 부담을 느끼는 등의 특별한 사정이 있는 경우에 예외적으로 허용될 수 있을 뿐이다(대판 2015.05.28. 2014도18006).", "answer": "O"}, {"year": "2017", "num": "6", "source": "17변시", "question": "「정치자금법」상 금품수수 혐의로 공소제기된 피고인 甲이 법정에서 금품수수 사실을 부인하였고, 제1심 법원에 증인으로 출석한 乙은 甲에게 금품을 제공하였다고 증언하였지만 제1심 법원은 乙의 증언에 신빙성이 없고 범죄의 증명이 부족하다는 이유로 무죄를 선고하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 항소심 법원이 공개금지사유가 없음에도 비공개로 乙에 대한 증인신문절차를 진행한 경우 乙의 증언은 증거능력이 인정되지 않는다.", "explanation": "헌법 제27조 제3항 후문, 제109조와 법원조직법 제57조 제1항, 제2항의 취지에 비추어 보면, 헌법 제109조, 법원조직법 제57조 제1항에서 정한 공개금지사유가 없음에도 불구하고 재판의 심리에 관한 공개를 금지하기로 결정하였다면 그러한 공개금지결정은 피고인의 공개재판을 받을 권리를 침해한 것으로서 그 절차에 의하여 이루어진 증인의 증언은 증거능력이 없고 변호인의 반대신문권이 보장되었더라도 달리 볼 수 없으며, 이러한 법리는 공개금지결정의 선고가 없는 등으로 공개금지결정의 사유를 알 수 없는 경우에도 마찬가지이다(대판 2013.07.26. 2013도2511).", "answer": "O"}, {"year": "2017", "num": "7", "source": "17변시", "question": "채무자 甲은 채권자 A의 가압류집행을 면탈할 목적으로, 자신이 제3채무자 乙에 대해 가지고있는 채권을 2016. 12. 8. 丙에게 허위로 양도하였다. 한편 A는 甲의 乙에 대한 위 채권에 대하여 2016. 12. 1. 법원에 가압류신청을 하였고 법원의 가압류결정 정본은 2016. 12. 8. 乙에게 송달되었다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 위 사안에서 강제집행면탈죄가 성립하는 경우 공소시효는 甲이 乙에게 채권양도의 통지를 한 때가 아니라 丙에게 채권을 허위양도한 때부터 진행한다.", "explanation": "강제집행 면탈의 목적으로 채무자가 제3채무자에 대한 채권을 허위로 양도한 경우, 강제집행면탈죄의 공소시효 기산점(= 제3채무자에게 채권양도의 통지가 행해진 때).\n[판례] 강제집행면탈죄는 채권자의 권리 실현의 이익을 보호법익으로 하는데, 강제집행 면탈의 목적으로 채무자가 그의 제 3채무자에 대한 채권을 허위로 양도한 경우에 제 3채무자에게 채권 양도의 통지가 행하여짐으로써 통상 제 3채무자가 채권 귀속의 변동을 인식할 수 있게 된 시점에서는 채권 실현의 이익이 해하여질 위험이 실제로 발현되었다고 할 것이므로, 늦어도 그 통지가 있는 때에는 그 범죄행위가 종료하여 그때부터 공소시효가 진행된다고 볼 것이다(대판 201 1.10.13. 2011도6855).", "answer": "X"}, {"year": "2017", "num": "8", "source": "17변시", "question": "음주운전으로 자동차운전면허가 취소된 甲은 술을 마신 상태로 도로에서 자동차를 운전하다가 단속 중인 경찰관에게 적발되어 음주측정한 결과 혈중알콜농도 0.078%로 측정되었다. 이 사건을 송치받은 검사는 甲에 대하여 벌금 200만 원의 약식명령을 청구하면서 필요한 증거서류 및 증거물을 법원에 제출하였고, 법원은 검사가 청구한 대로 벌금 200만 원의 약식명령을 발령하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄴ. 甲이 약식명령에 대하여 불복하여 정식재판을 청구하였음에도 법원이 증거서류 및 증거물을 검사에게 반환하지 않고 보관하고 있다면 공소제기의 절차가 위법하게 된다.", "explanation": "검사가 약식명령을 청구하는 때에는 약식명령의 청구와 동시에 약식명령을 하는 데 필요한 증거서류 및 증거물을 법원에 제출하여야 하는바(형사소송규칙 제170조), 이는 약식절차가 서면심리에 의한 재판이어서 공소장일본주의의 예외를 인정한 것이므로 약식명령의 청구와 동시에 증거서류 및 증거물이 법원에 제출되었다 하여 공소장일본주의를 위반하였다 할 수 없고, 그 후 약식명령에 대한 정식재판청구가 제기되었음에도 법원이 증거서류 및 증거물을 검사에게 반환하지 않고 보관하고 있다고 하여 그 이전에 이미 적법하게 제기된 공소제기의 절차가 위법하게 된다고 할 수도 없다(대판 2007.07.26. 2007도3906).", "answer": "X"}, {"year": "2017", "num": "8", "source": "17변시", "question": "음주운전으로 자동차운전면허가 취소된 甲은 술을 마신 상태로 도로에서 자동차를 운전하다가 단속 중인 경찰관에게 적발되어 음주측정한 결과 혈중알콜농도 0.078%로 측정되었다. 이 사건을 송치받은 검사는 甲에 대하여 벌금 200만 원의 약식명령을 청구하면서 필요한 증거서류 및 증거물을 법원에 제출하였고, 법원은 검사가 청구한 대로 벌금 200만 원의 약식명령을 발령하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄹ. 약식명령이 검사나 甲의 정식재판 청구 없이 그대로 확정된 경우, 약식명령은 그 고지를 검사와 피고인에 대한 재판서 송달로 하고 따로 선고하지는 않으므로 그 기판력의 시적 범위는 약식명령 송달시를 기준으로 한다.", "explanation": "유죄의 확정판결의 기판력의 시적범위 즉 어느 때까지의 범죄사실에 관하여 기판력이 미치느냐의 기준시점은 사실심리의 가능성이 있는 최후의 시점인 판결선고시 를 기준으로 하여 가리게 되고, 판결절차 아닌 약식명령은 그 고지를 검사와 피고인에 대한 재판서 송달로써 하고 따로 선고하지 않으므로 약식명령에 관하여는 그 기판력의 시적범위를 약식명령의 송달시를 기준으로 할 것인가 또는 그 발령시를 기준으로 할 것인지 이론의 여지가 있으나 그 기판력의 시적 범위를 판결절차와 달리 하여야 할 이유가 없으므로 그 발령시를 기준으로 하여야 한다(대판 1984.07.24. 84도1129).", "answer": "X"}, {"year": "2017", "num": "9", "source": "17변시", "question": "입시학원 강사인 甲은 A사립대학에 재직중인 입학처장 乙에게 요청하여 A대학의 신입생전형 논술시험문제를 전자우편으로 전송받았다. 甲은 공모에 따라 A대학에 진학하고자 하는 학생들\n에게 시험문제와 답안을 알려주었고, 학생들은 답안지를 그대로 작성하여 그 정을 모르는 시험\n감독관에게 제출하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 공소제기 후, 검사가 제출한 증거에 대한 피고인 甲의 동의 또는 진정성립 여부 등에 관한 의견이 증거목록에 기재되었다면 증거목록의 기재는 공판조서의 일부로서 명백한 오기가 아닌 이상 절대적인 증명력을 가지게 된다.", "explanation": "공판조서의 기재가 병백한 오기나 착오에 의한 경우를 제외하고는 공판기일의 소송절차로서 공판조서에 기재된 것은 조서만으로써 증명하여야 하고 그 증명력은 공판조서 이외의 자료에 의한 반증이 허용되지 않는 절대적인 것이다. 기록에 의하면 피고인은 제1심 제1회 공판기일에 검사가 제출한 진단서에 대하여 증거동의를 하였음이 증거목록에 기재되어 있음을 알 수 있고 그 기재가 명백한 오기나 착오에 의한 것이라고 볼 만한 자료가 없으므로, 증거목록의 기재에 반하여 위 진단서의 증거능력을 다투는 상고 이유는 받아들이지 아니한다(대판 2008.04.24. 2007도10058).", "answer": "O"}, {"year": "2017", "num": "9", "source": "17변시", "question": "입시학원 강사인 甲은 A사립대학에 재직중인 입학처장 乙에게 요청하여 A대학의 신입생전형 논술시험문제를 전자우편으로 전송받았다. 甲은 공모에 따라 A대학에 진학하고자 하는 학생들\n에게 시험문제와 답안을 알려주었고, 학생들은 답안지를 그대로 작성하여 그 정을 모르는 시험\n감독관에게 제출하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 검사가 제출한 증거에 대해 甲이 증거동의 하였다면, 공판기일에서의 증거조사가 완료된 후 甲이 증거동의의 의사표시를 취소하더라도 이미 취득한 증거능력이 상실된다고 볼 수 없다.", "explanation": "형사소송법 제318조에 규정된 증거동의의 의사표시는 증거 조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다(대판 1999.08.20. 99도2019).", "answer": "O"}, {"year": "2017", "num": "10", "source": "17변시", "question": "공무원인 甲은 건설회사 대표 乙에게 자신이 속한 부서가 관장하는 관급공사를 수주할 수 있게 해주겠다고 약속하고, 그 대가로 乙로부터 2016. 3. 15. 1,000만 원을, 2016. 4. 1. 1,500만 원을 받았다. 그 후 甲은 乙에게 직무상 비밀인 관급공사의 예정가격을 알려주어 乙이 공사를 수주하게 되었다. 검사는 甲이 변호인의 참여를 원한다는 의사를 명백하게 표시하였음에도, 정당한 사유 없이 변호인을 참여하게 하지 아니한 채 甲을 신문하여 피의자신문조서를 작성하였고, 추가조사를 거친 후에 甲과 乙에 대해 공소제기 하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "④ 검사가 작성한 피의자신문조서는 「형사소송법」 제312조 제1항에 정한 ‘적법한 절차와 방식’에 위반된 증거일 뿐만 아니라 「형사소송법」 제308조의2에서 정한 ‘적법한 절차에 따르지 아니하고 수집한 증거’에 해당하므로 이를 증거로 할 수 없다.", "explanation": "헌법 제12조 제1항, 제4항 본문, 형사소송법 제243조의2 제1항 및 그 입법 목적 등에 비추어 보면, 피의자가 변호인의 참여를 원한다는 의사를 명백하게 표시하였음에도 수사기관이 정당한 사유 없이 변호인을 참여하게 하지 아니한 채 피의자를 신문하여 작성한 피의자신문조서는 형사소송법 제312조에 정한 ‘적법한 절차와 방식’에 위반된 증거일 뿐만 아니라, 형사소송법 제308조의2에서 정한 ‘적법한 절차에 따르지 아니하고 수집한 증거’에 해당하므로 이를 증거로 할 수 없다(대판 2013.03.28. 2010도3359).", "answer": "O"}, {"year": "2017", "num": "10", "source": "17변시", "question": "공무원인 甲은 건설회사 대표 乙에게 자신이 속한 부서가 관장하는 관급공사를 수주할 수 있게 해주겠다고 약속하고, 그 대가로 乙로부터 2016. 3. 15. 1,000만 원을, 2016. 4. 1. 1,500만 원을 받았다. 그 후 甲은 乙에게 직무상 비밀인 관급공사의 예정가격을 알려주어 乙이 공사를 수주하게 되었다. 검사는 甲이 변호인의 참여를 원한다는 의사를 명백하게 표시하였음에도, 정당한 사유 없이 변호인을 참여하게 하지 아니한 채 甲을 신문하여 피의자신문조서를 작성하였고, 추가조사를 거친 후에 甲과 乙에 대해 공소제기 하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "⑤ 위 사건에서 심리결과 1,500만 원에 대한 부분만 무죄로 판단되는 경우에는 판결이유에만 기재하고 주문에서 따로 무죄를 선고할 것이 아님에도 불구하고 법원이 그 판결주문에 무죄를 표시하였더라도 이러한 잘못이 판결에 영향을 미친 위법사유가 되는 것은 아니다.", "explanation": "포괄일죄의 관계에 있는 공소사실 중 일부가 무죄로 판단된다고 하더라도 주문에서 따로 무죄의 선고를 할 것이 아님에도 불구하고, 공소사실 일부에 대하여 무죄의 선고를 하고 이를 판결주문에 표시하였다고 하여 이러한 잘못이 판결에 영향을 미칠 위법사유가 되는 것은 아니다(대판 1995.03.24. 94도1112). ▸ 2016. 3. 15. 1,000만 원을, 2016. 4. 1. 1,500만 원을 수수한 것은 뇌물수수죄의 포괄일죄에 해당한다.", "answer": "O"}, {"year": "2017", "num": "11", "source": "17변시", "question": "채권자인 甲과 그의 아내 乙은 빚을 갚지 못하고 있는 채무자 A를 찾아가 함께 심한 욕설을 하였다. 이에 관한 설명 중 옳은 것(O)과 옳지 않은 것(X)을 올바르게 조합한 것은? (다툼이 있는 경우 판례에 의함)", "choice": "ㄴ. 위 사건현장에 있던 A의 아들 B(5세)가 사건을 목격하였고 당시 상황을 이해하고 답변할 수 있다고 하더라도, B는 16세 미만의 선서무능력자이므로 그의 증언은 증거로 할 수 없다.", "explanation": "사건현장에 있던 B(5세)가 사건을 목격하고 당시 상황을 이해하고 답변할 수 있었으므로 그의 증언은 증거능력이 있다.\n[판례] 선서 무능력자에 대하여 선서케하고 신문한 경우라 할지라도 그 선서만이 무효가 되고 그 증언의 효력에 관하여는 영향이 없고 유효하다(대판 1957.03.08. 4290형상23). 사고 당시는 만 3년 3월 남짓 증언 당시는 만 3년 6월 남짓된 강간치상죄의 피해자인 여아가 피해상황에 관하여 비록 구체적이지는 못하지만 개괄적으로 물어 본 검사의 질문에 이를 이해하고 고개를 끄덕이는 형식의 답변은 증언능력이 있다(대판 1991.05.10. 91도579).", "answer": "X"}, {"year": "2016", "num": "1", "source": "16변시", "question": "외국인 근로자 甲은 외국인인 A의 운전면허증(서울지방경찰청장 발행)을 훔쳐 소지함을 기화로 이동통신 대리점에서 A로 행세하면서 A 명의로 이동전화가입신청서를 작성하여 A의 운전면허증과 함께 제출한 뒤 휴대전화기를 교부받으려다 A가 아님을 알아차린 업주에게 현행범으로 체포되어 경찰에 인계되어 조사 받은 후 석방되었다. 甲은 검사 작성의 피의자신문조서에 이의없음을 진술하고도 간인, 날인 및 서명을 거부하여 검사는 조서에 그러한 취지를 기재하고 기소하였고, 담당 재판부는 甲이 공판기일에 수회 불출석하여 구속영장을 발부하였다. 공판기일에 A의 사실혼 배우자 B가 증인으로 출석하여 운전면허증을 도난당한 상황을 증언한 후 이어서 A의 증언을 통역하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "피의자의 날인 또는 서명이 누락된 피의자신문조서는 증거능력이 없으나, 피의자가 이의 없이 조사를 받은 후 타당한 이유 없이 날인 또는 서명을 거부하였다는 취지가 조서말미에 기재되었다면 그 조서의 증거능력이 있다.", "explanation": "조서말미에 피고인의 서명만이 있고, 그 날인(무인 포함)이나 간인이 없는 검사 작성의 피고인에 대한 피의자신문조서는 증거능력이 없다고 할 것이고, 그 날인이나 간인이 없는 것이 피고인이 그 날인이나 간인을 거부하였기 때문이어서 그러한 취지가 조서말미에 기재되었다거나, 피고인이 법정에서 그 피의자신문조서의 임의성을 인정하였다고 하여 달리 볼 것은 아니다(대판 1999.04.13. 99도237).", "answer": "X"}, {"year": "2016", "num": "1", "source": "16변시", "question": "외국인 근로자 甲은 외국인인 A의 운전면허증(서울지방경찰청장 발행)을 훔쳐 소지함을 기화로 이동통신 대리점에서 A로 행세하면서 A 명의로 이동전화가입신청서를 작성하여 A의 운전면허증과 함께 제출한 뒤 휴대전화기를 교부받으려다 A가 아님을 알아차린 업주에게 현행범으로 체포되어 경찰에 인계되어 조사 받은 후 석방되었다. 甲은 검사 작성의 피의자신문조서에 이의없음을 진술하고도 간인, 날인 및 서명을 거부하여 검사는 조서에 그러한 취지를 기재하고 기소하였고, 담당 재판부는 甲이 공판기일에 수회 불출석하여 구속영장을 발부하였다. 공판기일에 A의 사실혼 배우자 B가 증인으로 출석하여 운전면허증을 도난당한 상황을 증언한 후 이어서 A의 증언을 통역하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "통역인이 사실혼 배우자인 경우는 제척사유에 해당하지 않으나 통역인이 사건에 관하여 증인으로 증언한 때에는 직무집행에서 제척되므로 B가 통역한 A에 대한 증인신문조서는 유죄 인정의 증거로 사용할 수 없다.", "explanation": "[1] 형사소송법 제17조 제4호는 ‘법관이 사건에 관하여 증인, 감정인, 피해자의 대리인으로 된 때에는 직무집행에서 제척된다’고 규정하고 있고, 위 규정은 같은 법 제25조 제1항에 의하여 통역인에게 준용되므로, 통역인이 사건에 관하여 증인으로 증언한 때에는 직무집행에서 제척되고, 제척사유가 있는 통역인이 통역한 증인의 증인신문조서는 유죄 인정의 증거로 사용할 수 없다. [2] 형사소송법 제17조 제2호는 ‘법관이 피고인 또는 피해자의 친족 또는 친족관계가 있었던 자인 때에는 직무집행에서 제척된다’고 규정하고 있고, 위 규정은 형사소송법 제25조 제1항에 의하여 통역인에게 준용되나, 사실혼관계에 있는 사람은 민법에서 정한 친족이라고 할 수 없어 형사소송법 제17조 제2호에서 말하는 친족에 해당하지 않으므로, 통역인이 피해자의 사실혼 배우자라고 하여도 통역인에게 형사소송법 제25조 제1항, 제17조 제2호에서 정한 제척사유가 있다고 할 수 없다. [3] 통역인 甲이 피고인들에 대한 특정경제범죄 가중처벌 등에 관한 법률 위반(사기) 사건의 제1심 공판기일에 증인으로 출석하여 진술한 다음, 같은 기일에 위 사건의 피해자로서 자신의 사실혼 배우자인 증인 乙의 진술을 통역한 경우, 제척사유 있는 甲이 통역한 乙의 증인신문조서는 유죄 인정의 증거로 사용할 수 없다(대판 2011.04.14. 2010도13583).", "answer": "O"}, {"year": "2016", "num": "2", "source": "16변시", "question": "甲은 2015. 11. 3. 01:00경 건축자재 등을 훔칠 생각으로 乙과 함께 주택 신축공사 현장에 있는 컨테이너 박스 앞에서, 乙은 망을 보고 甲은 컨테이너 박스 앞에 놓여 있던 노루발못뽑이(일명 빠루)를 이용하여 컨테이너 박스의 출입문의 시정장치를 부순 혐의로 기소되었다. 甲은 제1심법정에서 乙이 시켜서 한 일이라고 자백하였으나, 제1심법원은 공소사실에는 「형법」 제331조 제2항(합동절도)의 특수절도미수죄만 포함되어 있음을 전제로, 乙의 존재에 대하여는 증거가 불충분하여 공소사실을 무죄로 판단하면서, 다만 공소사실에는 절도미수죄의 공소사실이 포함되어 있다는 이유로 동일한 공소사실범위 내에 있는 절도미수죄만을 유죄로 인정하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "적법하게 수집된 범행에 사용된 노루발못뽑이와 손괴된 쇠창살의 모습이 촬영되어 수사보고서에 첨부된 현장 사진은 「형법」 제331조 제1항(야간손괴침입절도)의 죄에 관한 甲의 자백에 대한 보강증거로 인정될 수 있다.", "explanation": "자백에 대한 보강증거는 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족하다. 따라서 사안에서 수사보고서에 첨부된 현장사진은 甲의 자백을 보강할 만한 증거가 될 수 있다.", "answer": "O"}, {"year": "2016", "num": "4", "source": "16변시", "question": "다음 사례에 관할 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)\n甲은 유흥주점 허가를 받기 위해 구청 담당 과장 乙과 친하다는 丙을 찾아가 乙에게 전달하여 달라고 부탁하면서 2,500만 원을 제공하였다. 丙은 乙에게 甲의 유흥주점 허가를 부탁하면서 2,000만 원을 교부하고, 나머지 500만 원은 자신이 사용하였다. 한편, 乙은 구의원 丁에게 丙으로부터 받은 2,000만 원을 교부하면서, 구청장에게 부탁하여 구청 정기인사에서 자신이 좋은 평정을 받게 해달라고 말하였다. 甲에게 유흥주점 허가가 난 후, 甲은 감사의 표시로 자신의 유흥주점에 乙을 초대하였고, 乙은 대학동창인 회사원 3명에게 자신이 술값을 낸다고 말하고 이들과 함께 家의 유흥주점에 가서 400만 원의 향응을 제공받았다.", "choice": "甲과 乙은 공소시효의 정지에 관한 「형사소송법」 제253조 제2항에서 말하는 ‘공범’에 포함되지 않는다.", "explanation": "사안에서 甲은 뇌물공여죄, 乙은 뇌물수수죄의 죄책을 지는바, 형사소송법 제253조 제2항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다. 따라서 만약 검사가 乙에 대하여 공소를 제기하여 그에 대하여 공소시효가 정지되더라도, 그 시효정지의 효력은 ‘공범이 아닌’ 甲에게는 미치지 아니한다.", "answer": "O"}, {"year": "2016", "num": "4", "source": "16변시", "question": "다음 사례에 관할 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)\n甲은 유흥주점 허가를 받기 위해 구청 담당 과장 乙과 친하다는 丙을 찾아가 乙에게 전달하여 달라고 부탁하면서 2,500만 원을 제공하였다. 丙은 乙에게 甲의 유흥주점 허가를 부탁하면서 2,000만 원을 교부하고, 나머지 500만 원은 자신이 사용하였다. 한편, 乙은 구의원 丁에게 丙으로부터 받은 2,000만 원을 교부하면서, 구청장에게 부탁하여 구청 정기인사에서 자신이 좋은 평정을 받게 해달라고 말하였다. 甲에게 유흥주점 허가가 난 후, 甲은 감사의 표시로 자신의 유흥주점에 乙을 초대하였고, 乙은 대학동창인 회사원 3명에게 자신이 술값을 낸다고 말하고 이들과 함께 家의 유흥주점에 가서 400만 원의 향응을 제공받았다.", "choice": "수사기관에 피의자로 출석한 乙에게 진술거부권을 고지하지 않은 채 자술서를 작성토록 하였다면, 그 자술서는 증거능력이 없다.", "explanation": "피의자의 진술을 기재한 서류 또는 문서가 수사기관에서의 조사 과정에서 작성된 것이라면, 그것이 ‘진술조서, 진술서, 자술서’라는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없고, 수사기관에 의한 진술거부권 고지의 대상이 되는 피의자의 지위는 수사기관이 범죄인지서를 작성하는 등의 형식적인 사건수리 절차를 거치기 전이라도 조사대상자에 대하여 범죄의 혐의가 있다고 보아 실질적으로 수사를 개시하는 행위를 한 때에 인정된다. 특히 조사대상자의 진술 내용이 단순히 제3자의 범죄에 관한 경우가 아니라 자신과 제3자에게 공동으로 관련된 범죄에 관한 것이거나 제3자의 피의사실뿐만 아니라 자신의 피의사실에 관한 것이기도 하여 실질이 피의자신문조서의 성격을 가지는 경우에 수사기관은 진술을 듣기 전에 미리 진술거부권을 고지하여야 한다(2014도5939).", "answer": "O"}, {"year": "2016", "num": "6", "source": "16변시", "question": "甲은 乙과 공동으로 구입하여 자신이 점유하고 있던 복사기를 A에게 매도하기로 하고 계약금과 중도금을 받았다. 그후 甲은 복사기를 수리하기 위해 수리점에 맡겼다고 乙에게 거짓말하고 이를 다시 丙에게 매도한 후 복사기를 건네주었으며, 丙은 선의, 무과실로 이를 취득하였다. 며칠 후 이 사실을 알게 된 乙은 丙 몰래 위 복사기를 가져가 버렸다. 수사기관에서 甲의 아내 B는 참고인으로서 진술하고 진술조서에는 가명으로 서명, 날인하였다. 甲에 대한 재판 중 B가 증인으로 출석하였고, 재판장은 B에게 증언거부권이 있음을 고지하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "B에 대한 조서가 비록 가명으로 작성되었더라도 「형사소송법」 제312조 제4항의 요건을 모두 갖춘다면 증거능력이 인정될 수 있다.", "explanation": "형사소송법 제312조 제4항은 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서의 증거능력이 인정되려면 ‘적법한 절차와 방식에 따라 작성된 것’이어야 한다고 규정하고 있다. 여기서 적법한 절차와 방식이라 함은 피의자 또는 제3자에 대한 조서 작성 과정에서 지켜야 할 진술거부권의 고지 등 형사소송법이 정한 제반 절차를 준수하고 조서의 작성방식에도 어긋남이 없어야 한다는 것을 의미한다. 그런데 형사소송법은 조서에 진술자의 실명 등 인적 사항을 확인하여 이를 그대로 밝혀 기재할 것을 요구하는 규정을 따로 두고 있지는 아니하다. 따라서 「특정범죄신고자 등 보호법」 등에서처럼 명시적으로 진술자의 인적 사항의 전부 또는 일부의 기재를 생략할 수 있도록 한 경우가 아니라 하더라도, 진술자와 피고인의 관계, 범죄의 종류, 진술자 보호의 필요성 등 여러 사정으로 볼 때 상당한 이유가 있는 경우에는 수사기관이 진술자의 성명을 가명으로 기재하여 조서를 작성하였다고 해서 그 이유만으로 그 조서가 ‘적법한 절차와 방식’에 따라 작성되지 않았다고 할 것은 아니다. 그러한 조서라도 공판기일 등에 원진술자가 출석하여 자신의 진술을 기재한 조서임을 확인함과 아울러 그 조서의 실질적 진정성립을 인정하고 나아가 그에 대한 반대신문이 이루어지는 등 형사소송법 제312조 제4항에서 규정한 조서의 증거능력 인정에 관한 다른 요건이 모두 갖추어진 이상 그 증거능력을 부정할 것은 아니라고 할 것이다(대판 2012.05.24. 2011도7757).", "answer": "O"}, {"year": "2016", "num": "6", "source": "16변시", "question": "甲은 乙과 공동으로 구입하여 자신이 점유하고 있던 복사기를 A에게 매도하기로 하고 계약금과 중도금을 받았다. 그후 甲은 복사기를 수리하기 위해 수리점에 맡겼다고 乙에게 거짓말하고 이를 다시 丙에게 매도한 후 복사기를 건네주었으며, 丙은 선의, 무과실로 이를 취득하였다. 며칠 후 이 사실을 알게 된 乙은 丙 몰래 위 복사기를 가져가 버렸다. 수사기관에서 甲의 아내 B는 참고인으로서 진술하고 진술조서에는 가명으로 서명, 날인하였다. 甲에 대한 재판 중 B가 증인으로 출석하였고, 재판장은 B에게 증언거부권이 있음을 고지하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "B가 증언을 거부하여도 「형사소송법」 제314조에 따라 특신상태가 증명되면 B에 대한 진술조서는 증거능력이 인정된다.", "explanation": "B는 피고인인 甲의 처로서 증언거부권이 있는바 증언을 거부할 수 있다. 또한 판례는 법정에 출석한 증인이 형사소송법 제 148조, 제149조 등에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우는 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 아니한다고 판시한 바 B가 증언을 거부하였다면 형사소송법 제314조가 적용될 수 없으므로 증거능력이 인정되지 않는다(아래 2009도6788 참조).\n판례: 현행 형사소송법 제314조의 문언과 개정 취지, 증언거부권 관련 규정의 내용 등에 비추어 보면, 법정에 출석한 증인이 형사소송법 제148조, 제149조 등에서 정한 바에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우는 형사소송법 제314조의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’ 에 해당하지 아니한다(대판 2012.05.17. 2009도6788(전합)).", "answer": "X"}, {"year": "2016", "num": "7", "source": "16변시", "question": "다음 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)\n甲과 乙은 옆 동네에 사는 甲의 사촌동생 A의 신용카드를 훔쳐 은행 현금인출기에서 비밀번호를 입력하고 현금서비스로 100만 원을 인출하였다. 甲은 인출한 100만 원 중 50만 원을 자신의 애인인 丙에게 용돈으로 주었다. 수사가 개시되자 甲은 형사처분을 면할 목적으로 2년간 외국에 도피하였다. 甲이 귀국하자 검사는 甲, 乙, 丙을 위의 공소사실로 기소하였다.", "choice": "甲의 국외도피로 인한 공소시효 정지의 효과는 乙에게 미치지 않는다.", "explanation": "공범 1인에 대한 공소제기로 인한 시효의 정지는 다른 공범에 대하여도 정지의 효력이 미치지만(형사소송법 제253조 제2항), 범인이 형사처분을 면할 목적으로 국외에 있는 경우의 시효정지(형사소송법 제253조 제3항)는 다른 공범에 효력이 미치지 않는다.", "answer": "O"}, {"year": "2016", "num": "9", "source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ㉠ 재무구조가 매우 열악한 회사의 실질적 1인 주주인 대표이사 甲은 자신이 다니는 교회에 회사자산으로 거액을 기부하였다. ㉡乙의 사기죄에 대한 항소심 공판에서 검사는 별개사건으로 기소되어 확정된 공범 丙에 대한 공판조서와 乙과 A의 통화내용을 담은 녹음테이프를 증거로 제출하였다. ㉢ 피고인 丁의 기피신청이 있어 「형사소송법」 제 22 조에 따라 소송진행을 정지하여야 함에도, 기피신청을 받은 법관이 본안의 소송절차를 정지하지 않고 그대로 증거조시를 실시하였다. ㉣피고인의 변호인 戊는 피고인에 대한 고발장을 증거로 함에 부동의하였고, 같은 고발장을 첨부문서로 포함하고 있는 검찰주사보 작성의 수사보고서에 대하여는 증거 동의하였다.", "choice": "사안 ㉡에서 丙에 대한 공판조서는 「형사소송법」 제311조가 아니라 제315조 제3호에 따라 당연히 증거능력이 인정된다.", "explanation": "다른 피고인에 대한 형사사건의 공판조서는 형사소송법 제 315조 제3호에 정한 서류로서 당연히 증거능력이 있는바, 공판조서 중 일부인 증인신문조서 역시 형사소송법 제315조 제3호에 정한 서류로서 당연히 증거능력이 있다고 보아야 할 것이다(대판 2005.04.28. 2004도4428) . 형사소송법 제311조는 일체로서 공판절차, 즉 법관의 심리의 동일성이 상실된 경우를 예정한 조문으로서 피고사건의 상급심에서의 재판시 원심의 공판조서나 이송된 사건의 이송전의 공판조서 등이 그 예이다.", "answer": "O"}, {"year": "2016", "num": "9", "source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ㉠ 재무구조가 매우 열악한 회사의 실질적 1인 주주인 대표이사 甲은 자신이 다니는 교회에 회사자산으로 거액을 기부하였다. ㉡乙의 사기죄에 대한 항소심 공판에서 검사는 별개사건으로 기소되어 확정된 공범 丙에 대한 공판조서와 乙과 A의 통화내용을 담은 녹음테이프를 증거로 제출하였다. ㉢ 피고인 丁의 기피신청이 있어 「형사소송법」 제 22 조에 따라 소송진행을 정지하여야 함에도, 기피신청을 받은 법관이 본안의 소송절차를 정지하지 않고 그대로 증거조시를 실시하였다. ㉣피고인의 변호인 戊는 피고인에 대한 고발장을 증거로 함에 부동의하였고, 같은 고발장을 첨부문서로 포함하고 있는 검찰주사보 작성의 수사보고서에 대하여는 증거 동의하였다.", "choice": "사안 ㉡에서 녹음테이프에 대한 법관의 검증조서에 기재된 통화내용은 「형사소송법」 제311조에 따라 당연히 증거능력이 인정된다.", "explanation": "녹음테이프 검증조서의 기재 중 피고인과 공소외인 간의 대회를 녹음한 부분은 공개되지 아니한 타인간의 대화를 녹음한 것이므로 위 법 제 14조 제2항 및 제4조의 규정에 의하여 그 증거능력이 없고, 피고인들 간의 전화통화를 녹음한 부분은 피고인의 동의없이 불법감청한 것 이므로 위 법 제4조에 의하여 그 증거능력이 없다. 또한, 녹음테이프 검증조서의 기재 중 고소인이 피고인과의 대화를 녹음한 부분은 타인간의 대화를 녹음한 것이 아니므로 위 법 제14 조의 적용을 받지는 않지만, 그 녹음테이프에 대하여 실시한 검증의 내용은 녹음테이프에 녹음된 대화의 내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과하여 증거자료가 되는 것은 여전히 녹음테이프에 녹음된 대화의 내용이라 할 것 인바, 그 중 피고인의 진술내용은 실질적으로 형사소송법 제311조, 제312조 규정 이외에 피고인의 진술을 기재한 서류와 다를 바 없으므로, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 그 녹음테이프 검증조서의 기재 중 피고인의 진술내용을 증거로 사용하기 위해서는 형사소송법 제313조 제1항 단서에 따라 공판준비 또는 공판기일에서 그 작성자인 고소인의 진술에 의하여 녹음테이프에 녹음된 피고인의 진술내용이 피고인이 진술한 대로 녹음된 것이라는 점이 증명 되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 것으로 인정되어야 한다(대판 2001.10.09. 2001도3106).", "answer": "X"}, {"year": "2016", "num": "9", "source": "16변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) ㉠ 재무구조가 매우 열악한 회사의 실질적 1인 주주인 대표이사 甲은 자신이 다니는 교회에 회사자산으로 거액을 기부하였다. ㉡乙의 사기죄에 대한 항소심 공판에서 검사는 별개사건으로 기소되어 확정된 공범 丙에 대한 공판조서와 乙과 A의 통화내용을 담은 녹음테이프를 증거로 제출하였다. ㉢ 피고인 丁의 기피신청이 있어 「형사소송법」 제 22 조에 따라 소송진행을 정지하여야 함에도, 기피신청을 받은 법관이 본안의 소송절차를 정지하지 않고 그대로 증거조시를 실시하였다. ㉣피고인의 변호인 戊는 피고인에 대한 고발장을 증거로 함에 부동의하였고, 같은 고발장을 첨부문서로 포함하고 있는 검찰주사보 작성의 수사보고서에 대하여는 증거 동의하였다.", "choice": "사안 ㉣에서 수사보고서에 대한 증거동의의 효력은 첨부문서인 고발장에도 당연히 미치므로, 고발장을 유죄의 증거로 삼을 수 있다.", "explanation": "검찰관이 공판기일에 제출한 증거 중 뇌물공여자 甲이 작성한 고발장에 대하여 피고인의 변호인이 증거 부동의 의견을 밝히고, 같은 고발장을 첨부문서로 포함하고 있는 검찰주사보 작성의 수사보고에 대하여는 증거에 동의하여 증거조사가 행하여졌는데, 원심법원이 수사보고에 대한 증거동의의 효력이 첨부된 고발장에도 당연히 미친다고 보아 이를 유죄의 증거로 삼은 경우 수사기관이 수사과정에서 수집한 자료를 기록에 현출시키는 방법으로 자료의 의미, 성격, 혐의사실과의 관련성 등을 수사보고의 형태로 요약·설명하고 해당 자료를 수사보고에 첨부히는 경우, 수사보고에 기재된 내용은 수사기관이 첨부한 자료를 통하여 얻은 인식 · 판단 · 추론이거나 자료의 단순한 요약에 불과하여 원 자료로부터 독립하여 공소 사실에 대한 증명력을 가질 수 없고, 피고인이나 변호인도 수사보고의 증명력을 위와 같은 취지로 이해하여 공소사실을 부인하면서도 수사보고의 증거 거는 증거능력이 있다.", "explanation": "[제1 영장]에 근거하여 출력한 뇌물공여내역서는 증거능력이 없으며, [제2 영장]에 근거하여 압수· 수색을 하기 위하여는 甲의 참여권을 보장하고 압수목록을 교부하여야 하는데, 설문상 이를 하지 않았으므로 뇌물공여내역서 등은 위법수집증거로서 증거능력이 부정된다. \n(판례) 전자정보에 대한 압수 · 수색에 있어 저장매체 자체를 외부로 반출하거나 하드카피 · 이미징 등의 형태로 복제본을 만들어 외부에서 저장매체나 복제본에 대하여 압수 · 수색이 허용되는 예외적인 경우에도 혐의사실과 관련된 전자정보 이외에 이와 무관한 전자정보를 탐색 · 복제 · 출력하는 것은 원칙적으로 위법한 압수 · 수색에 해당하므로 허용될 수 없다. 그러나 전자정보에 대한 압수 수색이 종료되기 전에 혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원에서 별도의 범죄혐의에 대한 압수·수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수 · 수색을 할 수 있다. 나아가 이러한 경우에도 별도의 압수 · 수색 절차는 최초의 압수 · 수색 절차와 구별되는 별개의 절차이고, 별도 범죄혐의와 관련된 전자정보는 최초의 압수 · 수색영장에 의한 압수 · 수색의 대상이 아니어서 저장매체의 원래 소재지에서 별도의 압수·수색영장에 기해 압수 · 수색을 진행하는 경우와 마찬가지로 피압수 · 수색 당사자(이하 ‘ 피압수자’ 라 한다) 는 최초의 압수 · 수색 이전부터 해당 전자정보를 관리하고 있던 자라 할 것이므로, 특별한 사정이 없는 한 피압수자에게 형사소송법 제219조, 제121조, 제129조에 따라 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피압수자의 이익을 보호하기 위한 적절한 조치가 이루어져야 한다(대결 2015.07.16 . 2011모1839(전합))", "answer": "X"}, {"year": "2016", "num": "11", "source": "16변시", "question": "사법경찰관 P는 ‘X 제약회사 대표 甲과 직원 乙이 공모하여 의사 丙에게 리베이트를 제공한 범죄사실’의 압수·수색영장[제1 영장]에 근거하여 X회사를 압수·수색하였다. P는 압수·수색 시 위 영장을 甲에게 제시하였으나, 현장에 없는 乙에게는 영장을 제시하지 아니한 채 甲과 乙의 컴퓨터에 저장된 전자정보 전부를 이미징하는 방법으로 외장하드에 복제하여 경찰서로 가져갔다. 그후 P는 甲이 참여하지 않은 상태에서 이미징한 전자정보를 탐색·분석하던 중, 우연히 甲이 공무원에게 뇌물을 공여한 내역을 발견하고 이를 문서로 출력하여 소명자료로 제출하면서 법원으로부터 다시 압수·수색영장[제2 영장]을 발부받았다.P는 [제2 영장]을 근거로 甲의 참여가 없는 상태에서 위 외장하드에서 정보를 탐색하면서 뇌물공여내역을 출력하는 방식으로 압수·수색을 하였고, 그 압수 후 5개월 뒤에 甲의 요청에 따라 압수물 목록을 교부하였다. 한편, P는 [제1 영장]에 의한 압수·수색 과정에서 사무실에 보관 중이던 A변호사 작성의 리베이트 관련 법률의견서도 압수하였다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)", "choice": "수사기관의 참고인조사 과정에서 乙은 甲의 증뢰사실에 관하여 진술서를 작성하여 제출하였는데, 수사기관이 그에 대한 조사과정을 기록하지 아니하였다면 특별한 사정이 없는 한 그 진술서는 증거능력이 부정된다. ", "explanation": "형사소송법 제221조 제 1항, 제 244조의4 제1항, 제3항, 제312조 제4항, 제5항 및 그 입법 목적 등을 종합하여 보면, 피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니하여 형사소송법 제 244조의4 제3항, 제1항에서 정한 절차를 위반한 경우에는, 특별한 사정이 없는 한 ‘적법한 절차와 방식'에 따라 수사과정에서 진술서가 작성되었다 할 수 없으므로 증거능력을 인정할 수 없다(대판2015.04.23. 2013도3790).", "answer": "O"}, {"year": "2016", "num": "12", "source": "16변시", "question": "甲은 A에 대한 강도상해죄로 기소되었다. 범행을 목격한 甲의 사촌동생  乙은 甲의 강도상해사건의 증인으로 출석하여 선서한 후, 허위의 진술을 하였다. 한편, 甲은 공소장부본을 송달받은 다음 날 국민참여재판을 신청하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "국민참여재판으로 진행하는 것은 상당하지 않다는 검사의 이의가 있어 공판준비기일에서 甲과 검사의 의견을 다시 들은 후 국민참여재판으로 진행하기로 결정하였는데,  이에 대해 검사가 항고한 경우, 법원은 항고기각결정을 해야 한다.", "explanation": "국민의 형사재판 참여에 관한 법률(이하 ‘법 ’이라고만 한다)에 의하면 제1심 법원이 국민참여재판 대상사건을 피고인의 의사에 따라 국민참여재판으로 진행함에 있어 별도의 국민참여재판 개시결정을 할 필요는 없고, 그에 관한 이의가 있어 제1심 법원이 국민참여재판으로 진행하기로 하는 결정에 이른 경우 이는 판결 전의 소송절차에 관한 결정에 해당하며 그에 대하여 특별히 즉시항고를 허용하는 규정이 없으므로 위 결정에 대하여는 항고할 수 없다고 할 것이다(형사소송법 제403조) . 따라서 국민참여재판으르 진행하기로 하는 제1심 법원의 결정에 대한 항고는 항고의 제기가 법률상의 방식에 위반한 때에 해당하여 위 결정을 한 법원이 항고를 기각하여야 하고(형사소송법 제407조 제1항), 위 결정을 한 법원이 항고기각의 결정을 하지 아니한 때에는 항고법원은 결정으로 항고를 기각하여야 한다(형사소송법 제413조). 같은 취지에서 원심이 국민참여재판으로 진행하기로 한 제1심 법원의 결정에 대한 검사의 항고를 기각한 것은 정당하고, 거기에 재판에 영향을 미친 헌법 · 법률 · 명령 또는 규칙의 위반이 있다고 할 수 없다(대결 2009.10.23. 2009모1032). ", "answer": "O"}, {"year": "2016", "num": "12", "source": "16변시", "question": "甲은 A에 대한 강도상해죄로 기소되었다. 범행을 목격한 甲의 사촌동생  乙은 甲의 강도상해사건의 증인으로 출석하여 선서한 후, 허위의 진술을 하였다. 한편, 甲은 공소장부본을 송달받은 다음 날 국민참여재판을 신청하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "법원이 甲의 국민참여재판 신청에 대해 배제결정 없이 통상의 공판절차로 재판을 진행하는 것은 위법하지만, 이러한 공판절차에서 이루어진 소송행위는 유효하다.", "explanation": "국민참여재판을 시행하는 이유나 ‘국민의 형사재판 참여에 관한 법률’의 여러 규정에 비추어 볼 때,위 법에서 정하는 대상 사건에 해당하는 한 피고인은 원칙적으로 국민참여재판으로 재판을 받을 권리를 가지는 것이므로,  피고인이 법원에 국민참여재판을 신청하였는데도 법원이 이에 대한 배제결정도 하지 않은 채 통상의 공판절차로 재판을 진행하는 것은 피고인의 국민참여재판을 받을 권리 및 법원의 배제결정에 대한 항고권 등 중대한 절차적 권리를 침해한 것으로서 위법하고, 국민참여재판제도의 도입 취지나 위법에서 배제결정에 대한 즉시항고권을 보장한 취지 등에 비추어 이와 같이 위법한 공판절차에서 이루어진 소송행위는 무효라고 보아야 한다(대판 2011.09.08. 2011도7106). 제1심 법원이 피고인의 강간치상 사건에 대하여 공소장 부본 송달일로부터 7일이 경과하기 전에 제1회 공판기일을 진행하면서 국민참여재판 신청 의사를 확인하지 않고, 그 이후 도착한 피고인의 국민참여재판 신청에 대해 배제결정도 하지 않은 채 통상의 공판절차로 재판을 진행한 사안에|서, 이와 같이 위법한 공판절차에서 이루어진 소송행위는 무효라고 보아야 한다는 이유로, 원심판결과 제1심판결을 모두 파기하고 사건을 제1심법원에 환송한 사례", "answer": "X"}, {"year": "2015", "num": "1", "source": "15 변시", "question": "甲은 자신의 집에서 A4용지 1장에, A에 대하여 아래와 같은 내용을 수기(手記)로 작성한 다음 잉크젯 복합기를 이용하여 복사하는 방법으로 유인물을 30장 제작하였다. 甲은 15장은 자신이 직접, 나머지 15장은 친구 乙에게 부탁하여 A가 거주하는 아파트 단지 곳곳에 게시하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함) / [다음 유인물 내용] A, 그는 누구인가?! A는 처자식이 있는 몸임에도 불구하고, 2014. 12. 경 △△도 ○○시 등지 모텔에서 B와 수차례 불륜행위를 저질렀다. ", "choice": "위 유인물이 甲과 乙의 명예훼손사건의 증거로 제출된 경우, 이는 「형사소송법」 제313조 제1항의 ‘피고인이 작성한 진술서’이므로 그 진술자이며 작성자인 甲이 공판준비나 공판기일에서 진정성립 진술을 하여야 증거능력이 인정된다.", "explanation": "전문증거가 되기 위해서는 원진술의 내용이 된 사실의 존부가 요증사실이 되어야 한다. 판례도 타인의 진술을 내용으로 하는 진술이 전문증거인지는 요증사실과 관계에서 정하여지는데, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이나, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다(대판 2012.07.26. 2012도2937). 문제에서 만일 A와 B의 불륜행위가 요증사실이라면 전문증거가 될 수도 있으나 문제에서는 A와 B의 불륜행위가 아니라 甲의 사실적시 또는 허위사실적시로 인한 명예훼손행위가 있었는가 여부가 문제되므로 사안은 원진술의 존재 자체가 요증사실인 경우로서 유인물은 본래증거에 해당하는 것으로 보는 것이 타당하고 따라서 전문증거의 증거능력에 관한 형사소송법 제313조의 적용여부는 문제되지 아니한다.", "answer": "X"}, {"year": "2015", "num": "3", "source": "15 변시", "question": "甲은 자신의 아들 A에게 폭행을 당하여 입원한 B의 1인 병실로 병문안을 가서 B의 모친인 C와 대화하던 중 C의 여동생인 D가 있는 자리에서 “과거에 B에게 정신병이 있었다고 하더라.\" 라고 말하였다. 이에 화가 난 B는 甲을 명예훼손죄로 고소하였고, 甲은 명예훼손죄로 기소되었다. 한편 C는 자신과 D가 나눈 대화내용을 녹음한 녹음테이프를 증거로 제출하였는데 그 녹음테이프에는 ‘甲이 위의 발언을 한 것을 들었다’리는 D의 진술이 녹음되어 있었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "위 녹음테이프는 수사기관이 아닌 사인이 피고인이 아닌 사람과의 대화내용을 녹음한 것이므로 「형사소송법」 제311조, 제312조 규정 이외에 피고인이 아닌 자의 진술을 기재한 서류와 다를 바 없다. ", "explanation": "녹음테이프는 수사기관이 아닌 사인인 C가 D와 나눈 대화내용을 녹음한 것으로서 피고인 아닌 자의 진술을 기재한 서면과 같고 이 경우 증거능력이 인정되기 위해서는 원본성이 인정될 것과 형사소송법 제313조의 요건을 갖추어야 하는 바 진정성립이 인정되어야 한다. 특신상태가 요구되는 것은 피고인의 진술이 기재된 경우일 것을 요한다(형사소송법 제313조 제1항 단서). / 형사소송법 제313조(진술서등) ① 전2조의 규정 이외에 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류로서 그 작성자 또는 진술자의 자필이거나 그 서명 또는 날인이 있는 것(피고인 또는 피고인 아닌 자가 작성하였거나 진술한 내용이 포함된 문자ㆍ사진ㆍ영상 등의 정보로서 컴퓨터용디스크, 그 밖에 이와 비슷한 정보저장매체에 저장된 것을 포함한다. 이하 이 조에서 같다)은 공판준비나 공판기일에서의 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다. 단, 피고인의 진술을 기재한 서류는 공판준비 또는 공판기일에서의 그 작성자의 진술에 의하여 그 성립의 진정함이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여 진 때에 한하여 피고인의 공판준비 또는 공판기일에서의 진술에 불구하고 증거로 할 수 있다. <개정 2016. 5. 29.> / [판례] 수사기관이 아닌 사인(사인)이 피고인 아닌 사람과의 대화내용을 녹음한 녹음테이프는 형사소송법 제311조, 제312조 규정 이외의 피고인 아닌 자의 진술을 기재한 서류와 다를 바 없으므로, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 아니하는 이상 그 증거능력을 부여하기 위해서는 첫째, 녹음테이프가 원본이거나 원본으로부터 복사한 사본일 경우에는 복사과정에서 편집되는 등의 인위적 개작 없이 원본의 내용 그대로 복사된 사본일 것, 둘째 형사소송법 제313조 제1항에 따라 공판준비나 공판기일에서 원진술자의 진술에 의하여 그 녹음테이프에 녹음된 각자의 진술내용이 자신이 진술한 대로 녹음된 것이라는 점이 인정되어야 할 것이다(대판 2011.09 .08. 2010도7497).", "answer": "O"}, {"year": "2015", "num": "3", "source": "15 변시", "question": "甲은 자신의 아들 A에게 폭행을 당하여 입원한 B의 1인 병실로 병문안을 가서 B의 모친인 C와 대화하던 중 C의 여동생인 D가 있는 자리에서 “과거에 B에게 정신병이 있었다고 하더라.\" 라고 말하였다. 이에 화가 난 B는 甲을 명예훼손죄로 고소하였고, 甲은 명예훼손죄로 기소되었다. 한편 C는 자신과 D가 나눈 대화내용을 녹음한 녹음테이프를 증거로 제출하였는데 그 녹음테이프에는 ‘甲이 위의 발언을 한 것을 들었다’리는 D의 진술이 녹음되어 있었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) ", "choice": "위 녹음테이프에 녹음된 D의 진술내용이 명예훼손죄를 입증할 증거가 될 수 있기 위해서는 녹음테이프가 원본이거나 원본의 내용 그대로 복사된 사본임이 인정되고, 그 진술이 특히 신빙할 수 있는 상태에서 행하여진 것임이 인정되어야 한다. ", "explanation": "녹음테이프는 수사기관이 아닌 사인인 C가 D와 나눈 대화내용을 녹음한 것으로서 피고인 아닌 자의 진술을 기재한 서면과 같고 이 경우 증거능력이 인정되기 위해서는 원본성이 인정될 것과 형사소송법 제313조의 요건을 갖추어야 하는 바 진정성립이 인정되어야 한다. 특신상태가 요구되는 것은 피고인의 진술이 기재된 경우일 것을 요한다(형사소송법 제313조 제1항 단서). / 형사소송법 제313조(진술서등) ① 전2조의 규정 이외에 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류로서 그 작성자 또는 진술자의 자필이거나 그 서명 또는 날인이 있는 것(피고인 또는 피고인 아닌 자가 작성하였거나 진술한 내용이 포함된 문자ㆍ사진ㆍ영상 등의 정보로서 컴퓨터용디스크, 그 밖에 이와 비슷한 정보저장매체에 저장된 것을 포함한다. 이하 이 조에서 같다)은 공판준비나 공판기일에서의 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다. 단, 피고인의 진술을 기재한 서류는 공판준비 또는 공판기일에서의 그 작성자의 진술에 의하여 그 성립의 진정함이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여 진 때에 한하여 피고인의 공판준비 또는 공판기일에서의 진술에 불구하고 증거로 할 수 있다. <개정 2016. 5. 29.> / [판례] 수사기관이 아닌 사인(사인)이 피고인 아닌 사람과의 대화내용을 녹음한 녹음테이프는 형사소송법 제311조, 제312조 규정 이외의 피고인 아닌 자의 진술을 기재한 서류와 다를 바 없으므로, 피고인이 그 녹음테이프를 증거로 할 수 있음에 동의하지 아니하는 이상 그 증거능력을 부여하기 위해서는 첫째, 녹음테이프가 원본이거나 원본으로부터 복사한 사본일 경우에는 복사과정에서 편집되는 등의 인위적 개작 없이 원본의 내용 그대로 복사된 사본일 것, 둘째 형사소송법 제313조 제1항에 따라 공판준비나 공판기일에서 원진술  아동‧청소년의 성보호에 관한 법률 제26조 제6항의 규정과 대비하여 보면, 수사기관이 참고인을 조사하는 과정에서 형사소송법 제221조 제1항에 따라 작성한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수는 없다고 해석함이 타당하다(대판 2014.07.10. 2012도5041).", "answer": "X"}, {"year": "2015", "num": "5", "source": "15 변시", "question": "甲은 2014. 6. 25. 23:30경 물건을 훔칠 생각으로 복면을 하고 A의 집에 침입하였다가 마침 거실에 있던 애완견이 짖는 바람에 잠이 깬 A에게 발각되어 A가 “도둑이야!\"라고 고함치자 집 밖으로 도망쳐 나왔다. 다음 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) / [사례] 아래의 ㉠과 ㉡은 위 사실관계 후 전개된 상황으로 서로 독립적인 별개의 상황이다. ㉠ A는 혼자서 甲을 추격하여 체포하였는데, 그 과정에서 甲은 체포를 면탈할 목적으로, 주먹으로 A의 얼굴 부위를 1회 때려 A에게 비골 골절상을 가하였다. ㉡ 마침 A의 집 주변에서 야간순찰 중이던 경찰관 B는 A의 고함소리와 동시에 A의 집에서 도망쳐 나오는 甲을 발견하고 혼자서 甲을 추격하여 체포하였는데, 그 과정에서 甲은 체포를 면탈할 목적으로 발로 B의 왼쪽 허벅지 부위를 1회 걷어차 폭행하였다.", "choice": "㉡ 상황이라면, 만일 B가 진술거부권을 고지하지 않고, 甲을 신문한 결과 절도 범행을 자백하는 내용의 피의자신문조서를 작성한 경우 이 피의자신문조서는 증거능력이 없다.", "explanation": "피의자의 진술을 녹취 내지 기재한 서류 또는 문서가 수사기관에서의 조사과정에서 작성된 것이라면, 그것이 ‘진술조서, 진술서, 자술서’라는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없고, 한편 「형사소송법」이 보장하는 피의자의 진술거부권은 헌법이 보장하는 형사상 자기에 불리한 진술을 강요당하지 않는 자기부죄거부의 권리에 터 잡은 것이므로 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거능력이 부인되어야 한다(대판 2011.11.10. 2010도8294).", "answer": "O"}, {"year": "2015", "num": "5", "source": "15 변시", "question": "甲은 2014. 6. 25. 23:30경 물건을 훔칠 생각으로 복면을 하고 A의 집에 침입하였다가 마침 거실에 있던 애완견이 짖는 바람에 잠이 깬 A에게 발각되어 A가 “도둑이야!\"라고 고함치자 집 밖으로 도망쳐 나왔다. 다음 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) / [사례] 아래의 ㉠과 ㉡은 위 사실관계 후 전개된 상황으로 서로 독립적인 별개의 상황이다. ㉠ A는 혼자서 甲을 추격하여 체포하였는데, 그 과정에서 甲은 체포를 면탈할 목적으로, 주먹으로 A의 얼굴 부위를 1회 때려 A에게 비골 골절상을 가하였다. ㉡ 마침 A의 집 주변에서 야간순찰 중이던 경찰관 B는 A의 고함소리와 동시에 A의 집에서 도망쳐 나오는 甲을 발견하고 혼자서 甲을 추격하여 체포하였는데, 그 과정에서 甲은 체포를 면탈할 목적으로 발로 B의 왼쪽 허벅지 부위를 1회 걷어차 폭행하였다.", "choice": "㉡ 상황이라면, 만일 B가 진술거부권을 고지하지 않고 甲을 조사하여 자백을 받은 경우, B가 공판기일에 증인으로 출석하여 甲이 A의 집에서 도망쳐 나오는 장면을 증언하더라도 그 증언은 증거능력이 없다.", "explanation": "B가 범행을 목격한 것은 진술거부권 불고지 이전의 행위이므로 위법수집증거배제법칙의 적용여부가 문제되는 것이 아니며 나아가 기타 위법사항은 없다. 한편 현행범 상황하에서 현행범을 체포한 경찰관의 진술은 보통의 목격자의 진술과 다름없이 증거능력이 있다. / [판례] 현행범을 체포한 경찰관의 진술이라 하더라도 범행을 목격한 부분에 관하여는 여느 목격자와 다름없이 증거능력이 있고, 다만 그 증거의 신빙성만 문제되는 것이라 할 것이며, 위와 같은 경찰관의 체포행위를 도운 자가 범인의 범행을 목격하였디는 취지의 진술은 그 사람이 경찰정보원이라 하더라도 그 증거능력을 부인할 아무런 이유가 없다 할 것이다(대판 1995.05.09. 95도535). ", "answer": "X"}, {"year": "2015", "num": "5", "source": "15 변시", "question": "甲은 2014. 6. 25. 23:30경 물건을 훔칠 생각으로 복면을 하고 A의 집에 침입하였다가 마침 거실에 있던 애완견이 짖는 바람에 잠이 깬 A에게 발각되어 A가 “도둑이야!\"라고 고함치자 집 밖으로 도망쳐 나왔다. 다음 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함) / [사례] 아래의 ㉠과 ㉡은 위 사실관계 후 전개된 상황으로 서로 독립적인 별개의 상황이다. ㉠ A는 혼자서 甲을 추격하여 체포하였는데, 그 과정에서 甲은 체포를 면탈할 목적으로, 주먹으로 A의 얼굴 부위를 1회 때려 A에게 비골 골절상을 가하였다. ㉡ 마침 A의 집 주변에서 야간순찰 중이던 경찰관 B는 A의 고함소리와 동시에 A의 집에서 도망쳐 나오는 甲을 발견하고 혼자서 甲을 추격하여 체포하였는데, 그 과정에서 甲은 체포를 면탈할 목적으로 발로 B의 왼쪽 허벅지 부위를 1회 걷어차 폭행하였다.", "choice": "㉡ 상황이라면, B가 甲을 체포할 당시 甲이 소지하고 있던 복면은 필요한 때에는 영장 없이 압수할 수 있으나, 계속 압수할 필요가 있는 경우에는 지체 없이 압수·수색영장을 청구하여야 한다.", "explanation": "㉡ 상황의 경우 현행범 체포(형사소송법 제212조)에 해당하는 것으로 판단되고 현행범 체포시 영장 없이 압수할 수 있으며(형사소송법 제216조 제1항 2호) 압수를 계속할 필요가 있는 때에는 지체없이 압수수색영장을 청구하여야 한다(형사소송법 제217조 제2항). / 형사소송법 제212조(현행범인의 체포) 현행범인은 누구든지 영장없이 체포할 수 있다. / 형사소송법 제216조(영장에 의하지 아니한 강제처분) ① 검사 또는 사법경찰관은 제200조의2ㆍ제200조의3ㆍ제201조 또는 제212조의 규정에 의하여 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장없이 다음 처분을 할 수 있다. 2. 체포현장에서의 압수, 수색, 검증 / 형사소송법 제217조(영장에 의하지 아니하는 강제처분) ② 검사 또는 사법경찰관은 제1항 또는 제216조제1항제2호에 따라 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 한다. 이 경우 압수수색영장의 청구는 체포한 때부터 48시간 이내에 하여야 한다.", "answer": "O"}, {"year": "2015", "num": "6", "source": "15변시", "question": "甲은 乙로부터 명의신탁을 받아 관리하던 시가 2억 원 상당의 토지를 명의신탁자 乙의 승낙  없이,  2014. 3. 2. 丙으로부터 8,000만 원을 빌리면서 채권최고액 1억 원의 근저당권설정등기를 경료하여 주었다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우 판례에 의함)", "choice": "만일 검사가, 甲이 근저당권설정등기를 경료하여 준 행위를 배임죄로 기소하였고, 법원은 甲의 행위가 배임죄가 아니고 횡령죄라고 판단할 경우, 법원은 공소장변경 없이 직권으로 횡령죄를 인정할 수 있다.", "explanation": "횡령죄와 배임죄는 다같이 신임관계를 기본으로 하고 있는 같은 죄질의 재산범죄로서 그 형벌에 있어서도 경중의 차이가 없고 동일한 범죄사실에 대하여 단지 법률적용만을 달리하는 경우에 해당하므로 법원은 배임죄로 기소된 공소사실에 대하여 공소장변경 없이도 횡령죄를 적용하여 처벌할 수 있다(대판 1999.11.26. 99도2651).", "answer": "O"}, {"year": "2015", "num": "9", "source": "15변시", "question": "다음 설명 중 옳지 않은 것은?", "choice": "변호사 甲이 법률자문 과정에서 작성한 법률의견서는 전문증거로서 공판준비 또는 공판기일에서 그 작성자 또는 진술자인 甲의 진술에 의하여 그 성립의 진정함이 증명되어야 증거능력을 인정할 수 있다.", "explanation": "갑 주식회사 및 그 직원인 피고인들이 정비사업전문관리업자의 임원에게 갑 회사가 주택재개발사업 시공사로 선정되게 해 달라는 청탁을 하면서 금원을 제공하였다고 하여 구 건설산업기본법 위반으로 기소되었는데, 변호사가 법률자문 과정에 작성하여 갑 회사 측에 전송한 전자문서를 출력한 ‘법률의견서’에 대하여 피고인들이 증거로 함에 동의하지 아니하고, 변호사가 원심 공판기일에 증인으로 출석하였으나 증언할 내용이 갑 회사로부터 업무상 위탁을 받은 관계로 알게 된 타인의 비밀에 관한 것임을 소명한 후 증언을 거부한 사안에서, 위 법률의견서는 압수된 디지털 저장매체로부터 출력한 문건으로서 실질에 있어서 형사소송법 제313조 제1항에 규정된 ‘피고인 아닌 자가 작성한 진술서나 그 진술을 기재한 서류’에 해당하는데, 공판준비 또는 공판기일에서 작성자 또는 진술자인 변호사의 진술에 의하여 성립의 진정함이 증명되지 아니하였으므로 위 규정에 의하여 증거능력을 인정할 수 없고, 나아가 원심 공판기일에 출석한 변호사가 그 진정성립 등에 관하여 진술하지 아니한 것은 형사소송법 제149조에서 정한 바에 따라 정당하게 증언거부권을 행사한 경우에 해당하므로 형사소송법 제314조에  의하여 증거능력을 인정할 수도 없다(대판 2012.05.17. 2009도6788(전합)).", "answer": "O"}, {"year": "2014", "num": "1", "source": "14변시", "question": "甲은 A의 재물을 강취한 후 A를 살해할 목적으로 A가 살고 있는 집에 방화하여 A는 사망하였다. 그 후 수사망을 피해 도피 중이던 甲은 자신의 누나 丁에게 도피자금을 부탁하였고, 丁은 甲에게 도피자금을 송금하였다. 한편 사법경찰관 丙은 丁의 동의를 얻은 후 강도살인과 방화와 관련된 甲과 丁의 사이의 통화내용을 녹음하여 녹음테이프를 검사에게 증거로 제출하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "丙이 증거로 제출한 녹음테이프에 대해서는 丙이 공판정에서 성립의 진정을 인정하더라도 증거능력이 인정되지 않는다.", "explanation": "구 통신비밀보호법에서는 그 규율의 대상을 통신과 대화로 분류하고 그 중 통신을 다시 우편물과 전기통신으로 나눈 다음, 동법 제2조 제3호로 ‘전기통신’이라 함은 유선·무선·광선 및 기타의 전자적 방식에 의하여 모든 종류의 음향·문언·부호 또는 영상을 송신하거나 수신하는 것을 말한다고 규정하고 있는바, 전화통화가 위 법에서 규정하고 있는 전기통신에 해당함은 전화통화의 성질 및 위 규정 내용에 비추어 명백하므로 이를 동법 제3조 제1항 소정의 ‘타인간의 대화’에 포함시킬 수는 없고, 나아가, 동법 제2조 제7호가 규정한 ‘전기통신의 감청’은 그 전호의 ‘우편물의 검열’ 규정과 아울러 고찰할 때 제3자가 전기통신의 당사자인 송신인과 수신인의 동의를 받지 아니하고 같은 호 소정의 각 행위를 히는 것만을 말한다고 풀이함이 상당하다고 할 것이므로, 전기통신에 해당하는 전화통화 당사자의 일방이 상대방 모르게 통화내용을 녹음(위 법에는 ‘채록’이라고 규정한다)하는 것은 여기의 감청에 해당하지 아니하지만(따라서 전회통화 당사자의 일방이 상대방 몰래 통화내용을 녹음하더라도, 대화 당사자 일방이 상대방 모르게 그 대화내용을 녹음한 경우와 마찬가지로 동법 제3조 제1항 위반이 되지 아니한다), 제3자의 경우는 설령 전화통화 당사자 일방의 동의를 받고 그 통화내용을 녹음하였다 하더라도 그 상대방의 동의가 없었던 이상, 사생활 및 통신의 불가침을 국민의 기본권의 하나로 선언하고 있는 헌법규정과 통신비밀의 보호와 통신의 자유신장을 목적으로 제정된 통신비밀보호법의 취지에 비추어 이는 동법 제3조 제1 항 위반이 된다고 해석하여야 할 것이다(이 점은 제3자가 공개되지 아니한 타인간의 대화를 녹음한 경우에도 마찬가지이다)(대판 2002.10 .08. 2002도123). 따라서 丙이 증거로 제출한 녹음테이프는 통신비밀보호법 제3조 제1항 위반 행위로 수집된 증거이므로 증거능력이 부정된다(동법 제4조) . ", "answer": "O"}, {"year": "2014", "num": "1", "source": "14변시", "question": "甲은 A의 재물을 강취한 후 A를 살해할 목적으로 A가 살고 있는 집에 방화하여 A는 사망하였다. 그 후 수사망을 피해 도피 중이던 甲은 자신의 누나 丁에게 도피자금을 부탁하였고, 丁은 甲에게 도피자금을 송금하였다. 한편 사법경찰관 丙은 丁의 동의를 얻은 후 강도살인과 방화와 관련된 甲과 丁의 사이의 통화내용을 녹음하여 녹음테이프를 검사에게 증거로 제출하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "甲의 재판에 증인으로 출석한 丁은 증언거부권을 행사할 수 있다.", "explanation": "丁은 甲의 누나로 방계혈족(민법 제768조)으로서 친족에 해당(민법 제767조)하는 바, 甲의 누나는 형사소송법 제148조에 따라 증언을 거부할 수 있다.", "answer": "O"}, {"year": "2014", "num": "2", "source": "14변시", "question": "甲은 乙, 丙과 함께 지나가는 행인을 대상으로 강도를 하기로 모의한 뒤(甲은 모의과정에서 모의를 주도하였다), 함께 범행대상을 물색하다가 乙, 丙이 행인 A를 강도 대상으로 지목하고 뒤쫓아 가자 甲은 단지 \"어?\"라고만 하고 비대한 체격 때문에 뒤따라가지 못한 채 범행현장에서 200m 정도 떨어진 곳에 앉아 있었다. 乙, 丙은 A를 쫓아가 A를 폭행하고 지갑과 현금 30만 원을 빼앗았다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "만일 甲, 乙, 丙이 위의 범죄사실로 기소되었을 경우, 甲에 대한 변론을 분리한 후라면 甲을 乙, 丙사건에 대한 증인으로 신문할 수 있다.", "explanation": "공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인에 대한 공소 사실에 관하여 증인이 될 수 없으나, 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다(대판 2008.06.26. 2008도3300).", "answer": "O"}, {"year": "2014", "num": "2", "source": "14변시", "question": "甲은 乙, 丙과 함께 지나가는 행인을 대상으로 강도를 하기로 모의한 뒤(甲은 모의과정에서 모의를 주도하였다), 함께 범행대상을 물색하다가 乙, 丙이 행인 A를 강도 대상으로 지목하고 뒤쫓아 가자 甲은 단지 \"어?\"라고만 하고 비대한 체격 때문에 뒤따라가지 못한 채 범행현장에서 200m 정도 떨어진 곳에 앉아 있었다. 乙, 丙은 A를 쫓아가 A를 폭행하고 지갑과 현금 30만 원을 빼앗았다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "만일 甲이 먼저 붙잡혀 공판과정에서 일관되게 범행을 부인하였지만 유죄판결이 확정되고, 그 후 별건으로 기소된 乙, 丙의 형사사건에서 자신의 범행을 부인하는 증언을 하였더라도 사실대로 진술할 기대가능성이 없어 위증죄는 성립하지 않는다.", "explanation": " [1] 피고인에게 적법행위를 기대할 기능성이 있는지 여부를 판단하기 위하여는 행위 당시의 구체적인 상황하에 행위자 대신에 사회적 평균인을 두고 이 평균인의 관점에서 그 기대가능성 유무를 판단하여야 한다. 또한, 자기에게 형사상 불리한 진술을 강요당하지 아니할 권리가 결코 적극적으로 허위의 진술을 할 권리를 보장하는 취지는 아니며, 이미 유죄의 확정판결을 받은 경우에는 일사부재리의 원칙에 의해 다시 처벌되지 아니하므로 증언을 거부할 수 없는바, 이는 사실대로의 진술 즉 자신의 범행을 시인하는 진술을 기대할 수 있기 때문이다. 이러한 점 등에 비추어 보면, 이미 유죄의 확정판결을 받은 피고인은 공범의 형사사건에서 그 범행에 대한 증언을 거부할 수 없을 뿐만 아니라 나아가 사실대로 증언하여야 하고, 설사 피고인이 자신의 형사사건에서 시종일관 그 범행을 부인하였다 하더라도 이러한 사정은 위증죄에 관한 양형참작사유로 볼 수 있음은 별론으로 하고 이를 이유로 피고인에게 사실대로 진술할 것을 기대할 가능성이 없다고 볼 수는 없다. [2] 자신의 강도상해 범행을 일관되게 부인하였으나 유죄판결이 확정된 피고인이 별건으로 기소된 공범의 형사사건에서 자신의 범행사실을 부인하는 증언을 한 경우, 피고인에게 사실대로 진술할 기대가능성이 있으므로 위증죄가 성립한다(대판 2008 .10.23. 2005도10101).", "answer": "X"}, {"year": "2014", "num": "3", "source": "14변시", "question": "공정거래위원회 소속 공무원 甲은 乙로부터 불공정거래행위 신고나 관련 처리업무를 할 경우 잘 봐 달라논 취지로 건네주는 액면금 100만 원짜리 자기앞수표 3장을 교부받았다. 검사 丙은 이 사실을 수사한 후 甲을 뇌물수수죄로 기소하였다. 丙은 이 사건 공소제기 후 공판절차가 진행 중 수소법원이 아닌 영장전담 판사 A로부터 압수-수색영장을 발부받아 그 집행을 통하여 확보한 위 자기앞수표 사본 3장과 이를 기초로 작성한 수사보고서를 증거로 제출하였다. 한편, 甲은 공판관여 참여주사 丁에게 형량을 감경하여 달라는 청탁과 함께 현금 100만 원을 교부하였다. 이에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "丙이 영장전담 판사로부터 발부받은 압수·수색영장에 의하여 압수한 자기앞수표 사본 3장과 위 수사보고서는 증거능력이 없다.", "explanation": "형사소송법은 제215조에서 검사가 압수·수색 영장을 청구할 수 있는 시기를 공소제기 전으로 명시적으로 한정하고 있지는 아니하나, 헌법상 보장된 적법절차의 원칙과 재판받을 권리 공판중심주의·당사자주의·직접주의를 지향하는 현행 형사소송법의 소송구조, 관련 법규의 체계, 문언 형식, 내용 등을 종합하여 보면, 일단 공소가 제기된 후에는 피고사건에 관하여 검사로서는 형사소송법 제215조에 의하여 압수·수색을 할 수 없다고 보아야 하며, 그럼에도 검사가 공소제기 후 형사소송법 제215조에 따라 수소법원 이외의 지방법원 판사에게 청구하여 발부받은 영장에 의하여 압수·수색을 하였다면, 그와 같이 수집된 증거는 기본적 인권 보장을 위해 마련된 적법한 절차에 따르지 않은 것으로서 원칙적으로 유죄의 증거로 삼을 수 없다(대판 2011.04 .28. 2009도10412) .", "answer": "O"}, {"year": "2014", "num": "4", "source": "14변시", "question": "甲(1994.4.15.생)은 2011.6.15.서울중앙지방법원에서 폭력행위등처벌에관한법률위반(집단·흉기등상해)죄로 징역 l년에 집행유예 2년을 선고받아 2011.6.22. 판결이 확정되었다.\n甲은 19세 미만이던 2013.2.1. 11:00경 피해자(여, 55세)가 현금인출기에서 돈을 인출하여 가방에 넣고 나오는 것을 발견하고 오토바이를 타고 피해자를 뒤따라가 인적이 드문 골목길에 이르러 속칭 ‘날치기’ 수법으로 손가방만 살짝 채어 갈 생각으로 피해자의 손가방을 순간적으로 낚아채어 도망을 갔다. 甲이 손가방을 낚아채는 순간 피해자가 넘어져 2주간의 치료가 필요한 상해를 입었다. \n甲은 같은 날 22:30경 주택가를 배회하던 중 주차된 자동차를 발견하고 물건을 훔칠 생각으로 자동차의 유리창을 통하여 그 내부를 손전등으로 비추어 보다가 순찰 중이던 경찰관에게 검거되었다. 당시 甲은 절도 범행이 발각되었을 경우 체포를 면탈하는데 도움이 될 수 있을 것이라는 생각에서 등산용 칼과 포장용 테이프를 휴대하고 있었다. \n검사는 2013.2.15. 甲을 강도치상, 절도미수, 강도예비로 기소하였고 재판 도중에 강도예비를 주위적 공소사실로, 「폭력행위 등 처벌에 관한 법률」제7조 위반을 예비적 공소사실로 공소장변경을 신청하였다. \n제1심법원은 2013.3.29. 유죄 부분에 대하여 징역 단기 2년, 장기 4년을 선고하였다. 이에 대하여 甲만 항소하였는데 항소심법원은 2013.6.28. 판결을 선고하였다. \n* 참조 조문 : 「폭력행위 등 처벌에 관한 법률」제7조(우범자) 정당한 이유 없이 이 법에 규정된 범죄에 공용될 우려가 있는 흉기 기타 위험한 물건을 휴대하거나 제공 또는 알선한 자는 3년 이하의 징역 또는 200만 원 이하의 벌금에 처한다.\n\n위 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "강도예비의 공소사실과「폭력행위 등 처벌에 관한 법률」제7조 위반의 공소사실은 그 동일성의 범위를 벗어나므로 제1심법원은 공소장변경을 허가하여서는 아니 된다.", "explanation": "흉기를 휴대하고 다방에 모여 강도예비를 하였다는 공소사실을 정당한 이유 없이 폭력범죄에 공용될 우려가 있는 흉기를 휴대하고 있었다는 폭력행위등처벌에관한법률 제7조 소정의 죄로 공소장 변경을 하였다면, 그 변경 전의 공소사실과 변경 후의 공소사실은 그 기본적 사실이 동일하므로 공소장변경은 적법하다(대판 1987.01.20.86도2396) .", "answer": "X"}, {"year": "2014", "num": "5", "source": "14변시", "question": "甲(1994.4.15.생)은 2011.6.15.서울중앙지방법원에서 폭력행위등처벌에관한법률위반(집단·흉기등상해)죄로 징역 l년에 집행유예 2년을 선고받아 2011.6.22. 판결이 확정되었다.\n甲은 19세 미만이던 2013.2.1. 11:00경 피해자(여, 55세)가 현금인출기에서 돈을 인출하여 가방에 넣고 나오는 것을 발견하고 오토바이를 타고 피해자를 뒤따라가 인적이 드문 골목길에 이르러 속칭 ‘날치기’ 수법으로 손가방만 살짝 채어 갈 생각으로 피해자의 손가방을 순간적으로 낚아채어 도망을 갔다. 甲이 손가방을 낚아채는 순간 피해자가 넘어져 2주간의 치료가 필요한 상해를 입었다. \n甲은 같은 날 22:30경 주택가를 배회하던 중 주차된 자동차를 발견하고 물건을 훔칠 생각으로 자동차의 유리창을 통하여 그 내부를 손전등으로 비추어 보다가 순찰 중이던 경찰관에게 검거되었다. 당시 甲은 절도 범행이 발각되었을 경우 체포를 면탈하는데 도움이 될 수 있을 것이라는 생각에서 등산용 칼과 포장용 테이프를 휴대하고 있었다. \n검사는 2013.2.15. 甲을 강도치상, 절도미수, 강도예비로 기소하였고 재판 도중에 강도예비를 주위적 공소사실로, 「폭력행위 등 처벌에 관한 법률」제7조 위반을 예비적 공소사실로 공소장변경을 신청하였다. \n제1심법원은 2013.3.29. 유죄 부분에 대하여 징역 단기 2년, 장기 4년을 선고하였다. 이에 대하여 甲만 항소하였는데 항소심법원은 2013.6.28. 판결을 선고하였다. \n* 참조 조문 : 「폭력행위 등 처벌에 관한 법률」제7조(우범자) 정당한 이유 없이 이 법에 규정된 범죄에 공용될 우려가 있는 흉기 기타 위험한 물건을 휴대하거나 제공 또는 알선한 자는 3년 이하의 징역 또는 200만 원 이하의 벌금에 처한다.\n\n위 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "법원은 공소장변경이 없어도 강도치상죄의 공소사실을 절도죄로 처벌할 수 있다. ", "explanation": "피고인들이 한 날치기행위의 수단과 방법, 그 과정에서 가해진 강제력의 정도와 피해자가 다친 부위 및 정도 등에 비추어 위 강도치상의 공소사실에는 절도와 상해의 사실이 포함되어 있을 뿐만 아니라 이를 인정하더라도 피고인들의 방어에 실질적인 불이익을 줄 염려가 없으므로, 이 법원은 공소장변경 없이 절도와 상해의 범죄사실을 인정하기로 한다(대구고법 2007.08.23. 2007노193).", "answer": "O"}, {"year": "2014", "num": "6", "source": "14변시", "question": "甲은 乙 명의의 차용증을 위조한 후 乙 소유 부동산에 대한 가압류신청을 하여 법원으로부터 가압류결정을 받았다. 이에 대하여 乙의 고소로 개시된 수사절차에서, 乙이 미국에 거주하는 A로부터 위 부동산을 1억 원에 매수하였으나 차후 양도소득세를 적게 낼 목적으로 1억 5,000만 원에 매수한 것인 양 신고하여 부동산등기부에 매매가이 1억 5,000만 원으로 기재되게 하고 소유권이전등기를 마친 사실이 확인되었다. 미국에 있는 A와의 전화통화 내용을 문답 형식으로 기재하고 검찰주사만 기명날인한 수사보고서를 검사는 공소제기 후 증거로 제출하였다. 한편, 甲의 범행을 알고 있는 B가 법정에서 허위증언을 하자 검사가 B를 소환하여 추궁 끝에 법정증언을 번복하는 취지의 진술조서를 작성하며 이를 증거로 제출하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "위 수사보고서는 A가 외국거주로 인하여 공판기일에 진술할 수 없으므로 수사보고서를 작성한 검찰주사가 특히 신빙할 수 있는 상태 하에서 작성한 것임을 증명하면 증거로 할 수 있다. ", "explanation": "A의 서명날인은 없고 단순히 검찰주사보의 서명날인만 있는 경우 증거로 사용할 수 없다. \n[판례] 외국에 거주하는 참고인과의 전화 대화내용을 문답형식으로 기재한 검찰주사보 작성의 수사보고서는 전문증거로서 형사소송법 제310조의2에 의하여 제311조 내지 제316조에 규정된 것 이외에는 이를 증거로 삼을 수 없는 것인데, 위 수사보고서는 제311조, 제312조, 제315조, 제316조의 적용대상이 되지 아니함이 분명하므로, 결국 제313조의 진술을 기재한 서류에 해당하여야만 제314조의 적용 여부가 문제될 것인바, 제313조가 적용되기 위하여는 그 진술을 기재한 서류에 그 진술자의 서명 또는 날인이 있어야 한다(대판 1999.02.26. 98도2742)\n", "answer": "X"}, {"year": "2014", "num": "6", "source": "14변시", "question": "甲은 乙 명의의 차용증을 위조한 후 乙 소유 부동산에 대한 가압류신청을 하여 법원으로부터 가압류결정을 받았다. 이에 대하여 乙의 고소로 개시된 수사절차에서, 乙이 미국에 거주하는 A로부터 위 부동산을 1억 원에 매수하였으나 차후 양도소득세를 적게 낼 목적으로 1억 5,000만 원에 매수한 것인 양 신고하여 부동산등기부에 매매가이 1억 5,000만 원으로 기재되게 하고 소유권이전등기를 마친 사실이 확인되었다. 미국에 있는 A와의 전화통화 내용을 문답 형식으로 기재하고 검찰주사만 기명날인한 수사보고서를 검사는 공소제기 후 증거로 제출하였다. 한편, 甲의 범행을 알고 있는 B가 법정에서 허위증언을 하자 검사가 B를 소환하여 추궁 끝에 법정증언을 번복하는 취지의 진술조서를 작성하며 이를 증거로 제출하였다. 이에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "B가 다시 법정에 출석하여 위 진술조서의 진정성립을 인정하고 甲에게 반대신문의 기회가 부여되었다면 그 진술조서는 증거능력이 있다.", "explanation": "공판준비 또는 공판기일에서 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 그 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서를 유죄의 증거로 삼는 것은 당사자주의·공판중심주의·직접주의를 지향하는 현행 형사소송법의 소송구조에 어긋나는 것일 뿐만 아니라, 헌법 제27조가 보장하는 기본권, 즉 법관의 면전에서 모든 증거자료가 조사·진술되고 이에 대하여 피고인이 공격·방어할 수 있는 기회가 실질적으로 부여되는 재판을 받을 권리를 침해하는 것이므로, 이러한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 아니하는 한 그 증거능력이 없다고 하여야 할 것이고, 그 후 원진술자인 종전 증인이 다시 법정에 출석하여 증언을 하면서 그 진술조서의 성립의 진정함을 인정하고 피고인측에 반대신문의 기회가 부여되었다고 하더라도 그 증언 자체를 유죄의 증거로 할 수 있음은 별론으로 하고 위와 같은 진술조서의 증거능력이 없다는 결론은 달리할 것이 아니다(대판 2000.06.15. 99도1108(전합)).", "answer": "X"}, {"year": "2014", "num": "9", "source": "14변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)\nㄱ. 甲은 발행일이 백지인 수표 1장을 위조하여 乙에게 교부하였다. 그런데 이 수표가 위조된 사실을 알고 있는 乙은 이를 자신의 채무를 변제하기 위하여 사용하였다.\nㄴ. 양도담보권설정자인 채무자가 점유개정의 방식으로 담보목적물인 동산을 점유하고 있는 상태에서 양도담보권자인 채권자 丙이 丁에게 담보목적물을 매각하고 목적물반환청구권을 양도하여 丁이 임의로 이를 가져가게 하였다.\nㄷ. A가 자동차를 구입하여 장애인에 대한 면세 혜택 등의 적용을 받기 위해 戊의 명의를 빌려 등록하였다. 명의수탁자 戊와 그의 딸 己는 공모하여, 戊는 己에게 자동차이전등록서류를 교부하고, 己는 그 자동차를 명의신탁자 A 몰래 가져와 이를 다른 사람에게 처분하였다.", "choice": "사안 ㄱ.에서 甲과 乙이 공동피고인으로 기소된 경우 乙이 피고인으로서 “甲으로부터 그가 위조한 수표를 받은 사실이 있다.”라고 한 법정진술은 甲이 乙에게 위조수표를 교부한 사실에 대한 증거로 사용할 수 있다.", "explanation": "甲은 부정수표단속법위반죄, 그리고 乙은 사기죄의 주체가 된다. 甲과 乙이 공동피고인이지만 공범자 아닌 공동피고인관계가 된다. 따라서 乙은 증인으로서 지위를 갖고 乙의 진술을 甲의 유죄의 증거로 사용하기 위해서는 증인으로서 신문했어야 한다. \n[판례] 피고인과 별개의 범죄사실로 기소되어 병합심리 되고 있던 공동피고인은 피고인에 대한 관계에서는 증인의 지위에 있음에 불과하므로 선서 없이 한 그 공동피고인의 법정 및 검찰진술은 피고인에 대한 공소범죄사실을 인정하는 증거로 할 수 없다(대판 1982.06.22. 82도898).", "answer": "X"}, {"year": "2014", "num": "9", "source": "14변시", "question": "다음 사례에 관한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)\nㄱ. 甲은 발행일이 백지인 수표 1장을 위조하여 乙에게 교부하였다. 그런데 이 수표가 위조된 사실을 알고 있는 乙은 이를 자신의 채무를 변제하기 위하여 사용하였다.\nㄴ. 양도담보권설정자인 채무자가 점유개정의 방식으로 담보목적물인 동산을 점유하고 있는 상태에서 양도담보권자인 채권자 丙이 丁에게 담보목적물을 매각하고 목적물반환청구권을 양도하여 丁이 임의로 이를 가져가게 하였다.\nㄷ. A가 자동차를 구입하여 장애인에 대한 면세 혜택 등의 적용을 받기 위해 戊의 명의를 빌려 등록하였다. 명의수탁자 戊와 그의 딸 己는 공모하여, 戊는 己에게 자동차이전등록서류를 교부하고, 己는 그 자동차를 명의신탁자 A 몰래 가져와 이를 다른 사람에게 처분하였다.", "choice": "사안 ㄷ.에서 공소시효의 진행은 개별적으로 진행되므로 戊가 먼저 기소되어 유죄판결을 받아 그 판결이 확정된 경우 戊가 기소되어 판결이 확정될 때까지의 기간 동안 己에 대한 공소시효의 진행은 정지되지 않는다.", "explanation": "공범 1인에 대한 공소시효의 정지는 다른 공범자에 대해서도 효력이 미치고, 당해 사건의 재판이 확정된 때로부터 진행한다. 여기서의 공범에는 교사범, 종범과 같은 협의의 공범 뿐 아니라 공동정범이나 필요적 공범도 포함한다. 무와 기는 2인 이상이 가공하여 공동의 구성요건을 실현한 공범관계에 있으므로, “뇌물공여죄와 뇌물수수죄 사이와 같은 이른바 대향범 관계에 있는 자는 강학상으로는 필요적 공범이라고 불리고 있으나, 서로 대향된 행위의 존재를 필요로 할 뿐 각자 자신의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 것이어서, 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와는 본질적으로 다르며, 대향범 관계에 있는 자 사이에서는 각자 상대방의 범행에 대하여 형법 총칙의 공범규정이 적용되지 아니한다. 이러한 점들에 비추어 보면, 형사소송법 제253조 제2항에서 말하는 ‘공범’에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다\"는 판례(대판 2015.2.12. 2012도4842)에 비추어 보아도, 제253조 제2항의 적용이 배제되는 관계에 있지 않다.\n\n형사소송법 제253조(시효의 정지와 효력) ②공범의 1인에 대한 전항의 시효정지는 다른 공범자에게 대하여 효력이 미치고 당해 사건의 재판이 확정된 때로부터 진행한다.", "answer": "X"}, {"year": "2014", "num": "10", "source": "14변시", "question": "검사는 甲, 乙에 대하여 아래 ㄱ, ㄴ 사실로 공소를 제기하였고, 甲과 乙은 국민참여재판을 원하고 있다. 아래 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)\nㄱ. 甲은 A로부터 직접 소유권이전등기를 받는 형식으로 7억 원 상당의 A 소유 아파트를 명의수탁받아 보관하던 중 명의신탁 사실을 알고 있는 乙에게 매도하였다.\nㄴ. 甲은 A가 사기에 이용하려고 한다는 사정을 알고서도 A의 부탁에 따라 자신의 명의로 농협은행 예금계좌를 개설하여 예금통장을 A에게 양도하였고, A는 X를 속여 X로 하여금 5,000만 원을 위 계좌로 송금하게 하였는데, 甲은 위 계좌로 송금된 돈 전액을 인출하였다.\nㄷ. 「국민의 형사재판 참여에 관한 법률」 제8조는 피고인이 공소장 부본을 송달받은 날부터 7일 이내에 국민참여재판을 원하는지 여부에 관한 의사가 기재된 서면을 제출하도록 하고 있다. 그런데 甲, 乙은 공소장 부본을 송달받은 날부터 7일 이내에 국민참여재판을 원하는지 여부에 관한 의사확인서를 제출하지 못하였으나 그 후 제1회 공판기일 전에 국민참여재판 신청을 하였다.", "choice": "ㄷ. 사실과 관련하여 법원은 甲, 乙의 신청을 받아들여 국민참여재판을 진행할 수 있다.", "explanation": "국민의 형사재판 참여에 관한 법률 제8조는 피고인이 공소장 부본을 송달받은 날부터 7일 이내에 국민참여재판을 원하는지 여부에 관한 의사가 기재된 서면(이하 ‘의사확인서’)을 제출하도록 하고, 피고인이 그 기간 내에 의사확인서를 제출하지 아니한 때에는 국민참여재판을 원하지 아니하는 것으로 보며, 공판준비기일이 종결되거나 제1회 공판기일이 열린 이후 등에는 종전의 의사를 바꿀 수 없도록 규정하고 있다. 위 규정의 취지를 위 기한이 지나면 피고인이 국민참여재판 신청을 할 수 없도록 하려는 것으로는 보기 어려운 점 등에 비추어 볼 때, 공소장 부본을 송달받은 날부터 7일 이내에 의사확인서를 제출하지 아니한 피고인도 제1회 공판기일이 열리기 전까지는 국민참여재판 신청을 할 수 있고, 법원은 그 의사를 확인하여 국민참여재판으로 진행할 수 있다고 봄이 상당하다(대결 2009.10.23. 2009모1032).", "answer": "O"}, {"year": "2014", "num": "10", "source": "14변시", "question": "검사는 甲, 乙에 대하여 아래 ㄱ, ㄴ 사실로 공소를 제기하였고, 甲과 乙은 국민참여재판을 원하고 있다. 아래 사례에 관한 설명 중 옳지 않은 것은? (다툼이 있는 경우에는 판례에 의함)\nㄱ. 甲은 A로부터 직접 소유권이전등기를 받는 형식으로 7억 원 상당의 A 소유 아파트를 명의수탁받아 보관하던 중 명의신탁 사실을 알고 있는 乙에게 매도하였다.\nㄴ. 甲은 A가 사기에 이용하려고 한다는 사정을 알고서도 A의 부탁에 따라 자신의 명의로 농협은행 예금계좌를 개설하여 예금통장을 A에게 양도하였고, A는 X를 속여 X로 하여금 5,000만 원을 위 계
