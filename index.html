녹취 내지 기재한 서류 또는 문서가 수사기관에서의 조사과정에서 작성된 것이라면, 그것이 '진술조서, 진술서, 자술서'라는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없다. 형사소송법이 보장하는 피의자의 진술거부권은 헌법이 보장하는 형사살 자기에게 불리한 진술을 강요당하지 않는 자기부죄거부의 권리에 터 잡은 것이므로, 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거능력이 부인되어야 한다. (대판 2009. 08. 30. 2008도8213)\n[판례] 검사는 2009. 9. 9. 외국인투자 촉진법 위반으로 처벌받은 공소외 3으로부터, 허위로 D-8(기업투자)로 체류자격을 변경한 공소외 4 등에 대한 인적사항을 제출받고, 인천 출입국관리사무소로부터 공소외 4의 등록외국인기록표 및 기업투자 체류자격변경 신청서류를 제출받았으며, 2009. 9. 16. 공소외 4에 대한 외국인투자기업등록증명서를 발급해 준 우리은행 외국인투자지원팀 담당자와 전화통화를 통하여 허위의 외국인투자로 의심된다는 진술을 듣는 등의 조사를 거친 사실, 검사는 2009. 9. 17. 공소외 4를 참고인으로 소환하여 기업투자비자를 발급받지 위해 허위서류를 제출한 것에 관하여 신문하면서 진술조서를 작성한 사실, 검사는 2009. 10. 27. 피고인에 대한 이 사건 공소를 제기하면서 공소사실에 \"피고인은 공소외 4와 공모하여 외국인투자 촉진법에 의한 신고와 관련하여 허위의 서류를 제출하였다\"라고 기재한 서류를 제출하였다는 구성요건의 직접적은 주체로서 정범에 해당하는 점을 보태어 보면, 검사가 공소외 4를 소환하여 조사한 것은 이미 사전조사를 거쳐 공소외 4의 범죄혐의가 있다고 보아 수사를 개시하는 행위를 한 것으로 보아야 한다. 그렇다면, 조사 당시 피의자의 지위에 있었다고 볼 공소외 4의 진술을 기재한 서류가 비록 진술조서라는 형식을 취하였다고 하더라도 피의자신문조서와 달리 볼 수 없고, 그런데도 기록상 검사가 위 진술조서 작성 당시 공소외 4에게 진술거부권이 있음을 고지한 사실을 인정할 아무런 자료가 없으므로, 위 진술조서는 진술의 임의성이 인정되는 경우라도 위법하게 수집된 증거로서 증거능력이 없어 피고인에 대한 유죄의 증거로 쓸 수 없다. (대판 2011. 11. 10. 2010도8294)", "answer": "O"}, {"year": "2013", "num": "1", "source": "13변시", "question": "甲은 로망카페 대표, 乙은 위 카페 월급사장인 바, 甲과 乙은 카페 여자종업원들과 손님들의 성매매를 알선하고 위 종업원들로부터 돈의 일부를 알선료로 받아 분배하기로 공모하고 이를 실행하였다. 제보를 받은 경찰은 먼저 乙로부터 甲과 공모하여 성매매를 알선하였다고 인정하는 진술서를 받은 다음, 乙에 대한 참고인 진술조서를 작성하였다. 그 후 甲과 乙은 경찰에서 피의자신문을 받았는데 둘 다 성매매알선의 점을 자백하였고, 그 내용의 피의자신문조서가 작성되었다. 검찰에 송치된 이후 甲은 성매매알선의 점을 부인하였으나 乙은 자백하였고, 검사는 그러한 내용의 피의자신문조서를 작성한 후 甲과 乙을 성매매알선혐의로 기소하였다. 이 경우 다음 설명 중 옳지 않은 것은?", "choice": "사법경찰관 작성의 甲에 대한 피의자신문조서는 乙이 내용을 부인하면 乙에 대하여 증거능력이 없다. ", "explanation": "형사소송법 제312조3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되는 등 형사소송법 제312조 4항의 요건을 갖춘 경우라 하더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없다 (대판 2009. 07. 09. 2009도2865)", "answer": "O"}, {"year": "2013", "num": "1", "source": "13변시", "question": "甲은 로망카페 대표, 乙은 위 카페 월급사장인 바, 甲과 乙은 카페 여자종업원들과 손님들의 성매매를 알선하고 위 종업원들로부터 돈의 일부를 알선료로 받아 분배하기로 공모하고 이를 실행하였다. 제보를 받은 경찰은 먼저 乙로부터 甲과 공모하여 성매매를 알선하였다고 인정하는 진술서를 받은 다음, 乙에 대한 참고인 진술조서를 작성하였다. 그 후 甲과 乙은 경찰에서 피의자신문을 받았는데 둘 다 성매매알선의 점을 자백하였고, 그 내용의 피의자신문조서가 작성되었다. 검찰에 송치된 이후 甲은 성매매알선의 점을 부인하였으나 乙은 자백하였고, 검사는 그러한 내용의 피의자신문조서를 작성한 후 甲과 乙을 성매매알선혐의로 기소하였다. 이 경우 다음 설명 중 옳지 않은 것은?", "choice": "사법경찰관 작성의 乙에 대한 피의자신문조서는 甲이 내용을 부인하면 甲에 대하여 증거능력이 없지만, 변론분리 후 乙이 법정에서 '경찰 수사 도중 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다'는 취지로 증언한 경우에는 위 피의자신문조서는 甲에 대하여 증거능력이 인정된다. ", "explanation": "형사소송법 제312조3항은 검사 이외의 수사기관이 작성한 당해 피고인에 대한 피의자신문조서를 유죄의 증거로 하는 경우뿐만 아니라 검사 이외의 수사기관이 작성한 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 당해 피고인에 대한 유죄의 증거로 채택할 경우에도 적용된다. 따라서 당해 피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인의 법정진술에 의하여 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다. 그리고 이러한 경우 그 공동피고인이 법정에서 경찰수사 도중 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였다고 하더라도, 이러한 증언은 원진술자인 공동피고인이 그 자신에 대한 경찰 작성의 피의자신문조서의 진정성립을 인정하는 취지에 불과하여 위 조서와 분리하여 독자적인 증거가치를 인정할 것은 아니므로, 앞서 본 바와 같은 이유로 위 조서의 증거능력이 부정되는 이상 위와 같은 증언 역시 이를 유죄 인정의 증거로 쓸 수 없다 (대판 2009.10.15. 2009도1889).", "answer": "X"}, {"year": "2013", "num": "1", "source": "13변시", "question": "甲은 로망카페 대표, 乙은 위 카페 월급사장인 바, 甲과 乙은 카페 여자종업원들과 손님들의 성매매를 알선하고 위 종업원들로부터 돈의 일부를 알선료로 받아 분배하기로 공모하고 이를 실행하였다. 제보를 받은 경찰은 먼저 乙로부터 甲과 공모하여 성매매를 알선하였다고 인정하는 진술서를 받은 다음, 乙에 대한 참고인 진술조서를 작성하였다. 그 후 甲과 乙은 경찰에서 피의자신문을 받았는데 둘 다 성매매알선의 점을 자백하였고, 그 내용의 피의자신문조서가 작성되었다. 검찰에 송치된 이후 甲은 성매매알선의 점을 부인하였으나 乙은 자백하였고, 검사는 그러한 내용의 피의자신문조서를 작성한 후 甲과 乙을 성매매알선혐의로 기소하였다. 이 경우 다음 설명 중 옳지 않은 것은?", "choice": "만일 이 경우 乙이 함께 기소되지 않았다면 乙에 대한 검사 작성의 피의자신문조서는 甲이 증거로 함에 동의하지 않는 이상 검사 작성의 참고인진술조서의 경우와 동일한 요건을 갖추어야 甲에 대하여 증거능력이 인정된다. ", "explanation": "형사소송법 제312조 1항에서 정한 '검사가 작성한 피의자신문조서'란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함되고, 여기서 말하는 '공범'에는 형법 총칙의 공범 이외에도 서로 대향된 행위의 존재를 필요로 할 뿐 각자의 구성요건을 실현하고 별도의 형벌 규정에 따라 처벌되는 강학상 필요적 공범 또는 대향범까지 포함한다. 따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 1항에 따라 유죄의 증거로 쓸 수 없다 (대판 2023. 06. 01. 2023도3741). \n--> 출제 당시에는 O인 지문이었으나, 형사소송법 개정 및 위 판례에 따라 X로 정답 변경. 형사소송법 제312조 1항의 개정 취지에 따르면 검사가 작성한 피의자신문조서도 내용인정이라는 엄격한 요건을 요구하는 바, 피고인과 공범관계에 있다면 그에 대해 검사가 작성한 피의자신문조서는 공동피고인인 여부를 묻지 않고 당해 피고인 또는 변호인이 내용을 인정해야만 증거능력이 인정된다고 할 것이다 (이창현, 형사소송법 제9판, p.899 참조).", "answer": "X"}, {"year": "2013", "num": "4", "source": "13변시", "question": "갑, 을, 병, 정은 절도를 하기로 모의하였다. 빈집털이 경험이 풍부한 갑은 을, 병, 정에게 빈집털이와 관련하여 범행대상, 물색방법, 범행시 유의사항 등을 자세히 설명하였다. 을, 병, 정은 A의 집을 범행대상으로 정하고, 당일 14시30분경 병과 정이 A의 집 문을 열고 침입하여 현금 800만원을 절취하였다. 병과 정이 A의 집 안으로 들어간 직후 밖에서 망을 보기로 한 을은 갑자기 후회가 되어 현장을 이탈하였다. 검사 P는 병과 정을 특수절도죄, 갑을 특수절도죄에 대한 공동정범으로 기소하였으나 을은 범행모의단계에서 기여도가 적고 절도범행이 개시되기 이전에 이탈했다는 점을 고려하여 기소유예처분을 하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼 시 판례에 의함)", "choice": "ㄷ. 검사 P는 병과 정은 기소하면서 을은 기소유예처분하였는데 이는 공소제기절차가 법률의 규정에 위반된 경우이므로 법원은 공소기각판결을 선고해야 한다. ", "explanation": "검사 P가 을에게 기소유예처분을 하였다고 하더라도, 병과 정에 대한 공소제기가 무효라고 할 수 없다. \n[판례] 형사소송법 제246조와 제247조가 검사에게 자의적이고 무제한적인 소추권을 부여한 것은 아니라고 할지라도 검사는 범죄의 구성요건에 해당하여 형사적 제재를 함이 상당하다고 판단되는 경우에는 공소를 제기할 수 있고, 또 형법 제52조의 사항을 참작하여 공소를 제기하지 아니할 수 있는 재량권이 부여되어 있는 것이므로 이 재량권의 행사에 따라 공소제기하였다 하여 공소권을 남용한 경우에 해당한다고 할 수 없다 (대판 1990. 09. 25. 90도1613). ", "answer": "X"}, {"year": "2013", "num": "4", "source": "13변시", "question": "갑, 을, 병, 정은 절도를 하기로 모의하였다. 빈집털이 경험이 풍부한 갑은 을, 병, 정에게 빈집털이와 관련하여 범행대상, 물색방법, 범행시 유의사항 등을 자세히 설명하였다. 을, 병, 정은 A의 집을 범행대상으로 정하고, 당일 14시30분경 병과 정이 A의 집 문을 열고 침입하여 현금 800만원을 절취하였다. 병과 정이 A의 집 안으로 들어간 직후 밖에서 망을 보기로 한 을은 갑자기 후회가 되어 현장을 이탈하였다. 검사 P는 병과 정을 특수절도죄, 갑을 특수절도죄에 대한 공동정범으로 기소하였으나 을은 범행모의단계에서 기여도가 적고 절도범행이 개시되기 이전에 이탈했다는 점을 고려하여 기소유예처분을 하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼 시 판례에 의함)", "choice": "ㄹ. 갑에게 특수절도죄에 대한 방조고의와 방조행위가 인정되고 실질적으로 갑의 벙어권 행사에 불이익이 없는 경우 법원은 공소장변경 없이 갑을 특수절도죄의 종범으로 인정할 수 있다. ", "explanation": "법원은 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실보다 가벼운 범죄사실이 인정되는 경우에, 그 심리의 경과 등에 비추어 볼 때 피고인의 방어에 실질적인 불이익을 주지 아니한다면 공소장변경 없이 직권으로 가벼운 범죄사실을 인정할 수 있다고 할 것이므로, 공동정범으로 기소된 범죄사실을 방조사실로 인정할 수 있다. (대판 2012. 06. 28. 2012도2628).", "answer": "O"}, {"year": "2013", "num": "4", "source": "13변시", "question": "갑, 을, 병, 정은 절도를 하기로 모의하였다. 빈집털이 경험이 풍부한 갑은 을, 병, 정에게 빈집털이와 관련하여 범행대상, 물색방법, 범행시 유의사항 등을 자세히 설명하였다. 을, 병, 정은 A의 집을 범행대상으로 정하고, 당일 14시30분경 병과 정이 A의 집 문을 열고 침입하여 현금 800만원을 절취하였다. 병과 정이 A의 집 안으로 들어간 직후 밖에서 망을 보기로 한 을은 갑자기 후회가 되어 현장을 이탈하였다. 검사 P는 병과 정을 특수절도죄, 갑을 특수절도죄에 대한 공동정범으로 기소하였으나 을은 범행모의단계에서 기여도가 적고 절도범행이 개시되기 이전에 이탈했다는 점을 고려하여 기소유예처분을 하였다. 이 경우 다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼 시 판례에 의함)", "choice": "ㅁ. 법원은 심리 중 갑의 행위가 특수절도죄의 공동정범이 아니라 종범에 해당하는 사실을 인정한 경우에 직권으로 이를 종범으로 인정하지 않고 특수절도죄의 공동정범에 대하여 무죄를 선고하는 것은 허용되지 않는다. ", "explanation": "판례는 특수강도의 공소사실은 인정할 수 없으나 공동 폭행/협박 또는 특수강도의 종범에 관한 범죄사실은 인정할 수 있다 하더라도 이를 유죄로 인정하지 아니한 원심의 조치가 위법하지는 않다고 보았다. \n[판례] 법원은 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실에 포함된 보다 가벼운 범죄사실이 인정되는 경우에 심리의 경과에 비추어 피고인의 방어권행사에 실질적 불이익을 초래할 염려가 없다고 인정되는 떄에는 공소장이 변경되지 않았더라도 직권으로 공소장에 기재된 공소사실과 다른 범죄사실을 인정할 수 있지만, 이와 같은 경우라고 하더라도 공소가 제기된 범죄사실과 대비하여 볼 때 실제로 인정되는 범죄사실의 사안이 중대하여 공소장이 변경되지 않았다는 이유로 이를 처벌하지 않는다면 적정절차에 의한 신속한 실체적 진실의 발견이라는 형사소송의 목적에 비추어 현저히 정의와 형평에 반하는 것으로 인정되는 경우가 아닌 한 법원이 직권으로 그 범죄사실을 인정하지 아니하였다고 하여 위법한 것이라고 까지 볼 수는 없다 (대판 2001. 12. 11. 2001도4013). ", "answer": "X"}, {"year": "2013", "num": "5", "source": "13변시", "question": "갑은 사장 A가 자신을 해고한 것에 불만을 품고 A의 휴대전화로 \"그런 식으로 살지 말라. 계속 그렇게 행동하다간 너의 가족이 무사하지 않을 것이다\" 라는 내용의 문자메시지를 보내고, 그 후 다시 \"따님은 학교를 잘 다니고 계신지. 곧 못 볼 수도 있는 딸인데 맛있는 것 많이 사 주시지요.\"라는 문자메시지를 보냈다. 이를 본 A는 전혀 공포심을 느끼지 못했다. 이 경우 다음 설명 중 옳지 않은 것은? (다툼시 판례에 의함)", "choice": "검사가 유죄의 증거로 문자정보가 저장되어 있는 휴대전화기를 법정에 제출하는 경우 그 휴대전화기에 저장된 문자정보는 그 자체가 증거로 사용될 수 있다. ", "explanation": "[1] 구 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제65조 제1항 제3호는 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 처벌하고 있다. 검사가 위 죄에 대한 유죄의 증거로 문자정보가 저장되어 있는 휴대전화기를 법정에 제출하는 경우, 휴대전화기에 저장된 문자정보 자체가 범행의 직접적인 수단으로서 증거로 사용될 수 있다. 또한, 검사는 휴대전화기 이용자가 그 문자정보를 읽을 수 있도록 한 휴대전화기의 화면을 촬용한 사진을 증거로 제출할 수도 있는데, 이를 증거로 사용하려면 문자정보가 저장된 휴대전화기를 법정에 제출할 수 없거나 그 제출이 곤란한 사정이 있고, 그 사진의 영상이 휴대전화기의 화면에 표시된 문자정보와 정확하게 같다는 사실이 증명되어야 한다. [2] 형사소송법 제310조의2는 사실을 직접 경험한 사람의 진술이 법정에 직접 제출되어야 하고 이에 갈음하는 대체물인 딘술 또는 서류가 제출되어서는 안된다는 이른바 전문법칙을 선언한 것이다. 그런데 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2에서 정한 전문법칙이 적용되지 않는다 (대판 2009. 11. 13. 2006도2556).", "answer": "O"}, {"year": "2013", "num": "5", "source": "13변시", "question": "갑은 사장 A가 자신을 해고한 것에 불만을 품고 A의 휴대전화로 \"그런 식으로 살지 말라. 계속 그렇게 행동하다간 너의 가족이 무사하지 않을 것이다\" 라는 내용의 문자메시지를 보내고, 그 후 다시 \"따님은 학교를 잘 다니고 계신지. 곧 못 볼 수도 있는 딸인데 맛있는 것 많이 사 주시지요.\"라는 문자메시지를 보냈다. 이를 본 A는 전혀 공포심을 느끼지 못했다. 이 경우 다음 설명 중 옳지 않은 것은? (다툼시 판례에 의함)", "choice": "휴대전화기 이용자가 문자정보가 저장된 휴대전화기를 법정에 제출할 수 없거나 그 제출이 곤란한 사정이 있는 경우, 검사는 그 문자정보를 읽을 수 있도록 한 휴대전화기의 화면을 촬영한 사진을 증거로 제출할 수 있다. ", "explanation": "[1] 구 정보통신망 이용촉진 및 정보보호 등에 관한 법률 제65조 제1항 제3호는 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 처벌하고 있다. 검사가 위 죄에 대한 유죄의 증거로 문자정보가 저장되어 있는 휴대전화기를 법정에 제출하는 경우, 휴대전화기에 저장된 문자정보 자체가 범행의 직접적인 수단으로서 증거로 사용될 수 있다. 또한, 검사는 휴대전화기 이용자가 그 문자정보를 읽을 수 있도록 한 휴대전화기의 화면을 촬용한 사진을 증거로 제출할 수도 있는데, 이를 증거로 사용하려면 문자정보가 저장된 휴대전화기를 법정에 제출할 수 없거나 그 제출이 곤란한 사정이 있고, 그 사진의 영상이 휴대전화기의 화면에 표시된 문자정보와 정확하게 같다는 사실이 증명되어야 한다. [2] 형사소송법 제310조의2는 사실을 직접 경험한 사람의 진술이 법정에 직접 제출되어야 하고 이에 갈음하는 대체물인 딘술 또는 서류가 제출되어서는 안된다는 이른바 전문법칙을 선언한 것이다. 그런데 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2에서 정한 전문법칙이 적용되지 않는다 (대판 2009. 11. 13. 2006도2556).", "answer": "O"}, {"year": "2013", "num": "5", "source": "13변시", "question": "갑은 사장 A가 자신을 해고한 것에 불만을 품고 A의 휴대전화로 \"그런 식으로 살지 말라. 계속 그렇게 행동하다간 너의 가족이 무사하지 않을 것이다\" 라는 내용의 문자메시지를 보내고, 그 후 다시 \"따님은 학교를 잘 다니고 계신지. 곧 못 볼 수도 있는 딸인데 에 대하여「성립 및 임의성 인정, 내용부인」의 증거의견을 제출하였다.\n제1심은 무죄를 선고하였다. 검사는 항소하였고 항소심에서 모욕죄로 공소장이 변경되었다.\n그 후 A는 고소를 취소하였다.", "choice": "만약 甲이 공판정에서 ㉠사실에 대하여 자백을 하였다면 ㉱를 자백의 보강증거로 사용할 수 있다.", "explanation": "피고인의 법정에서의 진술과 피고인에 대한 검찰 피의자신문조서의 진술기재들은 피고인의 법정 및 검찰에서의 자백으로서 형사소송법 제310조에서 규정하는 자백의 개념에 포함되어 그 자백만으로는 유죄의 증거로 삼을 수 없다(대판 2008.02.14. 2007도10937). ▶ 피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 형사소송법 제310조의 피고인의 자백에는 포함되지 아니하나 이는 피고인의 자백의 보강증거로 될 수 없다(같은 판례) .", "answer": "X"}, {"year": "2013", "num": "8", "source": "13변시", "question": "甲과 乙은 고의로 교통사고를 낸 뒤 보험금을 청구하여 수령하기로 계획하였다. 이에 甲은 乙의 다리를 고의로 자동차로 치어 전치 4주의 상해를 입게 한 후 위 교통사고가 마치 과실에 의한 교통사고인 양 A보험회사와 B보험회사에 보험금을 청구하였다. 그 이후 甲은 교통사고에 대하여 교통사고처리특례법위반죄로 기소되어 유죄판결을 받고 확정되었다. 甲과 乙은 A보험회사로부터는 보험금을 수령했고, B보험회사로부터는 보험금을 수령하지 못하였다. 이후 검사는 甲과 乙의 보험사기 범행에 대하여 사기 및 사기미수죄로 기소하였고, 甲은 교통사고처리특례법위반과 사기 및 사기미수는 일련의 행위로서 기본적 사실관계가 동일하다는 이유로 면소판결을 해달라고 주장하였다. 이 사안과 관련한 설명 중 옳은 것은? (다툼이 있는 경우에는 판례에 의함)", "choice": "형사재판이 실체적으로 확정되면 동일한 범죄에 대하여 거듭 처벌할 수 없고, 확정판결이 있는 사건과 동일사건에 대하여 공소의 제기가 있는 경우에는 공소기각판결을 해야 한다.", "explanation": "[1] 형사재판이 실체적으로 확정되면 동일한 범죄에 대하여 거듭 처벌할 수 없고(헌법 제13조 제1항) , 확정판결이 있는 사건과 동일사건에 대하여 공소의 제기가 있는 경우에는 판결로써 면소의 선고를 하여야 하는 것인바(형사소송법 제326조 제1호), 피고인에 대한 각 ‘교통사고처리 특례법 위반죄’의 확정판결의 기판력이 ‘사기 및 사기미수죄’에 미치는 것인지의 여부는 그 기본적 사실관계가 동일한 것인가의 여부에 따라 판단하여야 할 것이다. 또한 기본적 사실관계가 동일한가의 여부는 규범적 요소를 전적으로 배제한 채 순수하게 사회적, 전법률적인 관점에서만 파악할 수는 없고, 그 자연적, 사회적 사실관계나 피고인의 행위가 동일한 것인가 외에 그 규범적 요소도 기본적 사실관계 동일성의 실질적 내용의 일부를 이루는 것이라고 보는 것이 상당하다. [2] 과실로 교통사고를 발생시켰다는 각 ‘교통사고처리 특례법 위반죄’와 고의로 교통사고를 낸 뒤 보험금을 청구하여 수령하거나 미수에 그쳤다는 ‘사기 및 사기미수죄’는 서로 행위 태양이 전혀 다르고, 각 교통사고처리 특례법 위반죄의 피해지는 교통사고로 사망한 사람들이나, 사기 및 사기미수죄의 피해자는 피고인과 운전자보험계약을 체결한 보험회사들로서 역시 서로 다르며, 따라서 위 각 교통사고처리 특례법 위반죄와 사기 및 사기미수죄는 그 기본적 사실관계가 동일하다고 볼 수 없으므로, 위 전자에 관한 확정판결의 기판력이 후자에 미친다고 할 수 없다(대판 2010.02.25. 2009도14263) .", "answer": "X"}, {"year": "2013", "num": "8", "source": "13변시", "question": "甲과 乙은 고의로 교통사고를 낸 뒤 보험금을 청구하여 수령하기로 계획하였다. 이에 甲은 乙의 다리를 고의로 자동차로 치어 전치 4주의 상해를 입게 한 후 위 교통사고가 마치 과실에 의한 교통사고인 양 거로 함에 동의하지 않을 경우 甲의 공소사실을 인정하는 증거로 사용할 수 없다.", "explanation": "구속적부심은 구속된 피의자 또는 그 변호인 등의 청구로 수사기관과는 별개 독립의 기관인 법원에 의하여 행하여지는 것으로서 구속된 피의자에 대하여 피의사실과 구속사유 등을 알려 그에 대한 자유로운 변명의 기회를 주어 구속의 적부를 심사함으로써 피의자의 권리보호에 이바지하는 제도인바, 법원 또는 합의부원, 검사, 변호인, 청구인이 구속된 피의자를 심문하고 그에 대한 피의자의 진술 등을 기재한 구속적부심문조서는 형사소송법 제311조가 규정한 문서에는 해당하지 않는다 할 것이나, 특히 신용할 만한 정황에 의하여 작성된 문서라고 할 것이므로 특별한 사정이 없는 한, 피고인이 증거로 함에 부동의하더라도 형사소송법 제315조 제3호에 의하여 당연히 그 증거능력이 인정된다(대판 2004.01.16. 2003도5693).", "answer": "X"}, {"year": "2012", "num": "3", "source": "12변시", "question": "甲은 2010. 7. 6. 23:00경 강도의 고의를 가지고 가스총을 주머니에 넣은 채 좁은 골목길이 복잡하게 얽혀 있는 동네 길목에서 ‘표적’을 기다리다가 귀가 중인 피해자에게 다가가 가스총으로 겁을 주어 현금 20만 원과 목걸이 및 반지를 빼앗았다. 일주일 후 甲은 양심의 가책을 느끼고 경찰서에 출석하여 위 범죄사실을 자수하였다. 하지만 경찰관은 甲이 범행한 장소와 피해자를 정확하게 기억하지 못하여 피해자에 대한 조사를 하지 못하였을 뿐 아니라, 목걸이와 반지도 모조품인 것을 알고 쓰레기통에 버렸다고 하고 20만 원은 이미 소비해 버린 상태인 것만 확인한 채 사건을 검찰에 송치하였다. 甲은 검찰에서도 범행을 자백하였고, 특수강도죄로 기소된 후 제1심 공판절차에서도 일관되게 자백하였다. 이에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우에는 판례에 의함) ", "choice": "제1심 법원이 甲의 자백에 따라 위 사건을 간이공판절차에 의해 심판하게 되었다고 하더라도, 甲의 자백에 대한 보강증거가 없으면 甲을 유죄로 인정할 수 없다. \n", "explanation": "간이공판절차의 특칙은 증거능력과 증거조사에 대한 특칙을 인정하는 것으로 증명력에 관한 자백의 보강법칙은 적용된다. \n-> 참고조문\n형사소송법 제286조의2(간이공판절차의 결정) \n피고인이 공판정에서 공소사실에 대하여 자백한 때에는 법원은 그 공소사실에 한하여 간이공판절차에 의하여 심판할 것을 결정할 수 있다. \n형사소송법 제318조의3(간이공판절차에서의 증거능력에 관한 특례) \n제286조의2의 결정이 있는 사건의 증거에 관하여는 제310조의2, 제312조 내지 제314조 및 제316조의 규정에 의한 증거에 대하여 제318조 제1항의 동의가 있는 것으로 간주한다. 단, 검사, 피고인 또는 변호인이 증거로 함에 이의가 있는 때에는 그러하지 아니하다. \n형사소송법 제310조(불이익한 자백의 증거능력) \n피고인의 자백이 그 피고인에게 불이익한 유일의 증거인 때에는 이를 유죄의 증거로 하지 못한다. ", "answer": "O"}, {"year": "2012", "num": "3", "source": "12변시", "question": "甲은 2010. 7. 6. 23:00경 강도의 고의를 가지고 가스총을 주머니에 넣은 채 좁은 골목길이 복잡하게 얽혀 있는 동네 길목에서 ‘표적’을 기다리다가 귀가 중인 피해자에게 다가가 가스총으로 겁을 주어 현금 20만 원과 목걸이 및 반지를 빼앗았다. 일주일 후 甲은 양심의 가책을 느끼고 경찰서에 출석하여 위 범죄사실을 자수하였다. 하지만 경찰관은 甲이 범행한 장소와 피해자를 정확하게 기억하지 못하여 피해자에 대한 조사를 하지 못하였을 뿐 아니라, 목걸이와 반지도 모조품인 것을 알고 쓰레기통에 버렸다고 하고 20만 원은 이미 소비해 버린 상태인 것만 확인한 채 사건을 검찰에 송치하였다. 甲은 검찰에서도 범행을 자백하였고, 특수강도죄로 기소된     const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    curTab       = s.curTab       || 'suhap';
    idx          = s.idx          || 0;
    correctCount = s.correctCount || 0;
    wrongCount   = s.wrongCount   || 0;
    wrongItems   = s.wrongItems   || {};
    mode         = s.mode         || 'all';
    shuffleOrder = s.shuffleOrder || [];
    sourceFilter = s.sourceFilter || '';
    return true;
  } catch(e) { return false; }
}

function clearState() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

// ── Tab / Filter ────────────────────────────────────────
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', (i===0&&tab==='suhap')||(i===1&&tab==='burok')));
  sourceFilter = '';
  buildSourceFilter();
  rebuildFiltered();
  saveState();
  renderQuestion();
}

function buildSourceFilter() {
  const sel = document.getElementById('source-filter');
  sel.innerHTML = '<option value="">전체 출처</option>';
  const data = DATA[curTab];
  const sources = [...new Set(data.map(q => curTab==='suhap' ? q.source : q.year+'년'))].sort();
  sources.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  sel.value = sourceFilter;
  document.getElementById('suhap-count').textContent = '(' + DATA.suhap.length + ')';
  document.getElementById('burok-count').textContent = '(' + DATA.burok.length + ')';
}

function applyFilter() {
  sourceFilter = document.getElementById('source-filter').value;
  idx = 0; correctCount = 0; wrongCount = 0;
  rebuildFiltered();
  saveState();
  renderQuestion();
}

function rebuildFiltered() {
  const base = DATA[curTab];
  let temp = sourceFilter
    ? base.filter(q => (curTab==='suhap' ? q.source : q.year+'년') === sourceFilter)
    : [...base];
  if (mode === 'wrong') {
    temp = temp.filter((_,i) => wrongItems[curTab+'_'+i]);
  }
  filtered = temp;
  if (mode === 'shuffle' && shuffleOrder.length !== filtered.length) {
    shuffleOrder = [...Array(filtered.length).keys()].sort(() => Math.random()-0.5);
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-'+m).classList.add('active');
  idx = 0; correctCount = 0; wrongCount = 0;
  shuffleOrder = [];
  rebuildFiltered();
  saveState();
  renderQuestion();
}

function getQ(i) {
  if (mode==='shuffle') return filtered[shuffleOrder[i]];
  return filtered[i];
}

// ── Stats / UI ──────────────────────────────────────────
function updateStats() {
  const total = filtered.length;
  document.getElementById('cur-idx').textContent = Math.min(idx+1, total);
  document.getElementById('total-cnt').textContent = total;
  document.getElementById('correct-cnt').textContent = correctCount;
  document.getElementById('wrong-cnt').textContent = wrongCount;
  const pct = total > 0 ? (idx / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── Render ──────────────────────────────────────────────
function renderQuestion() {
  const area = document.getElementById('quiz-area');
  answered = false;
  if (filtered.length === 0) {
    area.innerHTML = '<div class="empty-state"><h2>문제가 없습니다</h2><p>필터를 변경해보세요.</p></div>';
    return;
  }
  if (idx >= filtered.length) {
    renderScore();
    return;
  }
  updateStats();
  const q = getQ(idx);
  let metaHtml = curTab==='suhap'
    ? `<div class="meta-line"><span class="meta-tag">${q.source}</span></div>`
    : `<div class="meta-line"><span class="meta-tag">${q.year}년</span><span class="meta-tag">문제 ${q.num}번</span></div>`;

  area.innerHTML = `
    <div class="card" id="main-card">
      ${metaHtml}
      <div class="question-text">${escHtml(q.question)}</div>
      <div class="choice-text">${escHtml(q.choice)}</div>
      <div class="ox-buttons">
        <button class="ox-btn o-btn" onclick="answer('O')">O</button>
        <button class="ox-btn x-btn" onclick="answer('X')">X</button>
      </div>
      <div id="answer-area"></div>
    </div>
  `;
}

function answer(chosen) {
  if (answered) return;
  answered = true;
  const q = getQ(idx);
  const correct = q.answer.toUpperCase() === chosen.toUpperCase();

  document.getElementById('main-card').classList.add(correct ? 'correct-card' : 'wrong-card');
  document.querySelectorAll('.ox-btn').forEach(b => b.disabled = true);
  document.querySelector(chosen==='O' ? '.o-btn' : '.x-btn')
    .classList.add(chosen==='O' ? 'selected-o' : 'selected-x');

  if (correct) {
    correctCount++;
  } else {
    wrongCount++;
    wrongItems[curTab+'_'+idx] = true;
  }
  saveState();
  updateStats();

  const answerClass = q.answer==='O' ? 'o' : 'x';
  document.getElementById('answer-area').innerHTML = `
    <div class="answer-reveal ${correct?'correct':'wrong'}">
      <div class="answer-header">
        <span class="answer-label ${correct?'correct':'wrong'}">${correct?'✓ 정답입니다!':'✗ 틀렸습니다'}</span>
        <span class="answer-value ${answerClass}">${q.answer}</span>
      </div>
      ${q.explanation ? '<div class="explanation-text">'+escHtml(q.explanation)+'</div>' : ''}
    </div>
    <div class="next-btn-wrap">
      <button class="btn primary" onclick="nextQuestion()">다음 문제 →</button>
    </div>
  `;
}

function nextQuestion() {
  idx++;
  saveState();
  renderQuestion();
}

function renderScore() {
  const total = correctCount + wrongCount;
  const pct = total>0 ? Math.round(correctCount/total*100) : 0;
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('quiz-area').innerHTML = `
    <div class="score-screen">
      <div class="score-big">${pct}%</div>
      <div class="score-label">최종 점수</div>
      <div class="score-grid">
        <div class="score-item c"><div class="val">${correctCount}</div><div class="lbl">정답</div></div>
        <div class="score-item w"><div class="val">${wrongCount}</div><div class="lbl">오답</div></div>
      </div>
      ${wrongCount>0 ? '<button class="btn primary" style="margin-right:8px" onclick="reviewWrong()">오답 복습</button>' : ''}
      <button class="btn" onclick="restartQuiz()">처음부터 다시</button>
    </div>
  `;
}

function reviewWrong() {
  mode = 'wrong';
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-wrong').classList.add('active');
  const savedWrong = {...wrongItems};
  wrongItems = savedWrong;
  idx=0; correctCount=0; wrongCount=0;
  rebuildFiltered();
  saveState();
  renderQuestion();
}

function jumpTo() {
  const input = document.getElementById('jump-input');
  const n = parseInt(input.value);
  if (!n || n < 1 || n > filtered.length) {
    input.style.borderColor = 'var(--wrong)';
    setTimeout(() => input.style.borderColor = '', 1000);
    return;
  }
  idx = n - 1;
  input.value = '';
  saveState();
  renderQuestion();
}

function restartQuiz() {
  clearState();
  wrongItems={}; idx=0; correctCount=0; wrongCount=0;
  mode='all'; sourceFilter=''; shuffleOrder=[];
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-all').classList.add('active');
  buildSourceFilter();
  rebuildFiltered();
  renderQuestion();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ────────────────────────────────────────────────
const hadSave = loadState();
// restore tab UI
document.querySelectorAll('.tab').forEach((t,i) =>
  t.classList.toggle('active', (i===0&&curTab==='suhap')||(i===1&&curTab==='burok')));
// restore mode UI
document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
document.getElementById('mode-'+mode).classList.add('active');

buildSourceFilter();
rebuildFiltered();

if (hadSave && idx > 0) {
  // show resume banner
  const area = document.getElementById('quiz-area');
  const wrongCount_ = Object.keys(wrongItems).length;
  area.innerHTML = `
    <div class="card" style="text-align:center;padding:32px 24px;">
      <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px;">이어서 풀기</div>
      <div style="color:var(--text-muted);font-size:0.88rem;margin-bottom:24px;">
        마지막으로 <strong style="color:var(--text)">${idx}번</strong> 문제까지 풀었어요.<br>
        ${wrongCount_>0 ? '오답 <strong style="color:var(--wrong)">'+wrongCount_+'개</strong> 누적 중' : ''}
      </div>
      <button class="btn primary" style="margin-right:8px" onclick="renderQuestion()">이어서 풀기</button>
      <button class="btn" onclick="restartQuiz()">처음부터</button>
    </div>
  `;
  updateStats();
} else {
  renderQuestion();
}
</script>
</body>
</html>
